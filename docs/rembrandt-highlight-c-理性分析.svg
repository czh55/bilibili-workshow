.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>伦勃朗如何突出C位</h1>
  <div class="meta"><span class="tag tag-blue">C位</span><span class="tag tag-green">黄金分割</span><span class="tag tag-orange">疏密</span><span class="tag tag-purple">视线引导</span><span class="tag tag-red">伦勃朗</span><span class="tag tag-gray">时长 187秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/1U9u21oww6k">原视频</a>
  <div class="summary-line">中心与近大远小都不够自然。《解剖课》四招叠用：黄金分割点、左密右疏、姿态＋稳定三角、众人目光引导线——主角不居中不靠前也能第一眼抓住。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">中心／近大远小不够</span></div><div class="timeline-item"><span class="timeline-time">00:38</span><span class="timeline-text">《解剖课》引入</span></div><div class="timeline-item"><span class="timeline-time">00:54</span><span class="timeline-text">九宫格黄金分割点</span></div><div class="timeline-item"><span class="timeline-time">01:26</span><span class="timeline-text">方法一：分割点</span></div><div class="timeline-item"><span class="timeline-time">01:30</span><span class="timeline-text">左密右疏</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">方法二：疏密</span></div><div class="timeline-item"><span class="timeline-time">02:12</span><span class="timeline-text">姿态＋三角</span></div><div class="timeline-item"><span class="timeline-time">02:28</span><span class="timeline-text">视线引导</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">点位<br/>黄金分割</div><span class="arrow">→</span><div class="node-green">布局<br/>疏密</div><span class="arrow">→</span><div class="node-orange">形<br/>姿态三角</div><span class="arrow">→</span><div class="node-blue">线<br/>目光引导</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「伦伯朗／态然自若」→「伦勃朗／泰然自若」。</p><p>误区：突出＝放正中。口播称灵动打折。</p><p>误区：只放大主体。后排被忽略也失败。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>问题设定</h3>
      <p>中心呆板；近大远小丢群体信息。</p>
      <div class="quote">好像都差点意思</div>
      <div class="relation">要自然生动的突出。</div>
    </div>
    <div class="card card-orange">
      <h3>黄金分割点</h3>
      <p>九宫格四焦点天然引视线；C位放这儿。</p>
      <div class="quote">利用黄金分割点强化主角</div>
      <div class="relation">位置先于大小。</div>
    </div>
    <div class="card card-red">
      <h3>疏密如战场将军</h3>
      <p>左密右疏，一紧一松凸显独占空间的主角。</p>
      <div class="quote">用疏密布局强化主角</div>
      <div class="relation">留白也是强调。</div>
    </div>
    <div class="card card-purple">
      <h3>姿态＋目光线</h3>
      <p>自信姿态与稳定三角；众人目光拉回解剖动作。</p>
      <div class="quote">这就是第四招视线引导</div>
      <div class="relation">形与视线闭环。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>四招叠用</p>
      <div class="quote">分割点、疏密、姿态形、视线引导——C位突出且有故事感。</div>
      <div class="relation">还会更自然生动</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>聚焦构图突出，非明暗教学专场。</li><li>「时尚奶奶」为当代类比。</li><li>画中技巧远不止这些，口播有开放讨论。</li></ul><div class="pitfall">只放黄金点却背景均匀无疏密。</div><div class="pitfall">主角姿态软塌。</div><div class="pitfall">人物目光四处飘无汇聚。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>位置＞蛮力放大</li><li>疏密制造主角</li><li>视线闭环</li></ul><h3>行动清单</h3><ol><li>群像草图先标四焦点再落C位</li><li>检查半幅疏密差</li><li>画一条众人目光汇聚线</li><li>中心构图做对照看灵动差</li></ol><h3>关键认知转变</h3><p>以前：放大并放中间；现在：用点位、疏密、姿态与目光四层推C位。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 187秒</div>
</div>
    </div>
  </foreignObject>
</svg>