<div class="svg-page">
  <div class="container">
    <h1>景深：清晰区间、光圈口诀与入瞳径</h1>
    <div class="meta">
      <span class="tag tag-blue">小红书</span>
      <span class="tag tag-green">1 分 12 秒</span>
      <span class="tag tag-orange">光圈</span>
      <span class="tag tag-purple">景深</span>
      <span class="tag tag-gray">理性分析</span>
    </div>
    <a class="source-link" href="http://xhslink.cn/o/AxXsrxu9hhC">原视频：相机“光圈”底层逻辑科普，景深是什么？（三）</a>
    <div class="summary-line">
      <strong>核心判断：</strong>景深是对焦点前后、可被人眼识别为清晰的区间；日常「背景虚化」只是浅景深的常见观感。视频用 F16／F1.2 动画对照说明：光圈越小景深越深，光圈越大景深越浅；并纠正——直接影响景深的是入瞳径而非物理光圈叶片本身，景深边界的精确定义还需引入容许弥散圆。
    </div>

    <div class="timeline">
      <h3>关键证据时间轴</h3>
      <div class="timeline-item"><div class="timeline-time">00:03</div><div class="timeline-text">以「背景虚化」对齐日常语感，再进入景深定义</div></div>
      <div class="timeline-item"><div class="timeline-time">00:10</div><div class="timeline-text">人物与相机之间的纵向轴线；焦点落在主体上</div></div>
      <div class="timeline-item"><div class="timeline-time">00:19</div><div class="timeline-text">相对清晰区间「称作景深」（画面字幕可核对）</div></div>
      <div class="timeline-item"><div class="timeline-time">00:26</div><div class="timeline-text">F16 视图：主体／前景／背景在距离轴上可分清</div></div>
      <div class="timeline-item"><div class="timeline-time">00:34</div><div class="timeline-text">调大光圈：清晰范围收窄，背景渐虚</div></div>
      <div class="timeline-item"><div class="timeline-time">00:47</div><div class="timeline-text">小光圈 → 深景深／大景深（F16 横条拉长）</div></div>
      <div class="timeline-item"><div class="timeline-time">00:52</div><div class="timeline-text">大光圈 → 浅景深（F1.2 窄条）</div></div>
      <div class="timeline-item"><div class="timeline-time">01:00</div><div class="timeline-text">直接变量是入瞳径；预告容许弥散圆</div></div>
    </div>

    <div class="map">
      <h2>核心脉络</h2>
      <div class="diagram">
        <div class="node">日常观感<br/>背景虚化</div>
        <div class="arrow">→</div>
        <div class="node">定义<br/>清晰区间=景深</div>
        <div class="arrow">→</div>
        <div class="node node-green">规则<br/>小光圈深／大光圈浅</div>
        <div class="arrow">→</div>
        <div class="node node-orange">底层<br/>入瞳径＋弥散圆</div>
      </div>
      <p>问题是「景深是什么、和光圈怎么连」；证据来自动画对照与口播定义；行动层先会用深浅景深口诀，再把「光圈」说法升级为光学变量。</p>
    </div>

    <div class="correction">
      <h3>常见误解与认知纠偏</h3>
      <p>1）把「背景虚化」当成景深的全部——它只是浅景深的一种结果，景深本身是清晰区间长度。<br/>
      2）以为调的是「物理叶片开合」就直接等于景深旋钮——视频明确：直接影响景深的是入瞳径。<br/>
      3）把「光圈越大景深越大」说反——视频对照：光圈越大，清晰范围越小（浅景深）。</p>
    </div>

    <div class="section">
      <h2 class="sec-title">观点拆解</h2>

      <div class="card">
        <h3>1. 景深 = 对焦点前后可识别清晰的区间</h3>
        <p><strong>在讲什么：</strong>用纵向轴线把「人物清楚、背景糊」翻译成空间区间。</p>
        <p><strong>关键理解：</strong>焦点落在主体上时，前后会有一段相对清晰范围；这段范围被命名为景深，而不是「背景糊」本身。</p>
        <p><strong>怎么用：</strong>描述画面时先问「清晰区间有多长」，再谈虚化风格。</p>
        <div class="quote">原文依据 [00:17–00:20]：「我们把相对清晰的这一区间称作景深」（字幕；Whisper 误作「乘坐」）。</div>
        <div class="insight">可验证事实：视频给出了口头定义；区间边界的精确定义留给容许弥散圆。</div>
      </div>

      <div class="card card-green">
        <h3>2. 光圈口诀：越小越深，越大越浅</h3>
        <p><strong>在讲什么：</strong>同一焦点下，改变光圈如何改变清晰范围长度。</p>
        <p><strong>关键理解：</strong>动画用 F16 拉满「深景深」横条、用 F1.2 标出窄「浅景深」，把口诀可视化。</p>
        <p><strong>怎么用：</strong>想前后都清楚就收小光圈；想主体跳出背景就开大光圈——仍受焦段、物距等其他因素约束（本集未展开）。</p>
        <div class="quote">原文依据 [00:43–00:53]：「光圈越小，清晰的范围越大……称之为深景深或者大景深；反之……称之为浅景深。」</div>
        <div class="relation">关系：光圈设定 → 清晰区间长度 → 深／浅景深称谓。</div>
      </div>

      <div class="card card-purple">
        <h3>3. UP 主立场：直接变量是入瞳径</h3>
        <p><strong>在讲什么：</strong>为什么日常仍说「光圈影响景深」，以及什么才是更底层的旋钮。</p>
        <p><strong>关键理解：</strong>作者把「物理光圈」与「入瞳径」拆开：入瞳径才是直接影响景深的量；「光圈影响景深」是方便说法，完整解释需容许弥散圆。</p>
        <p><strong>怎么用：</strong>读机身 F 值时，把它当作代理指标；进阶时再追透镜系统的入瞳与弥散圆定义。</p>
        <div class="quote">原文依据 [00:58–01:11]：「实际上直接影响景深的是入瞳径，而非物理光圈……这里就要涉及到另一个概念——容许弥散圆。」</div>
        <div class="highlight">立场分层：入瞳径／弥散圆是光学概念陈述；「为何大家仍说光圈」在本集只提出问题，未给完整推导。</div>
      </div>

      <div class="card card-orange">
        <h3>4. 避坑：别把术语说反，也别把本集当完整公式</h3>
        <p><strong>在讲什么：</strong>本集是科普序列第（三）集，偏定义与对照，不是景深公式课。</p>
        <div class="pitfall">陷阱：把「前景深」当术语——画面字幕是「浅景深」；Whisper「前景深」为误识。</div>
        <div class="pitfall">陷阱：以为学会 F 值口诀就能精确算出景深——视频自己把精确定义推给容许弥散圆。</div>
        <div class="action">行动：先用 F16／大光圈对照记住方向；遇到争议时回到「清晰区间」定义，而不是争论虚化审美。</div>
      </div>
    </div>

    <div class="card">
      <h3>横向对比：深景深 vs 浅景深（本集动画）</h3>
      <table>
        <thead>
          <tr>
            <th>维度</th>
            <th>深景深／大景深</th>
            <th>浅景深</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>示例光圈（动画）</td>
            <td><span class="key-data">F16</span></td>
            <td><span class="key-data">F1.2／F1.4</span></td>
          </tr>
          <tr>
            <td>清晰范围</td>
            <td>大，距离轴上横条拉长</td>
            <td>小，仅焦点附近窄条</td>
          </tr>
          <tr>
            <td>实拍观感</td>
            <td>主体与远景都相对清楚</td>
            <td>主体清楚、背景虚化</td>
          </tr>
          <tr>
            <td>口诀方向</td>
            <td>光圈越小 → 景深越深</td>
            <td>光圈越大 → 景深越浅</td>
          </tr>
          <tr>
            <td>适用提醒</td>
            <td>想交代环境层次时优先考虑</td>
            <td>想突出主体、压背景时优先考虑</td>
          </tr>
        </tbody>
      </table>
      <p>方法边界：对照固定在同一场景动画；未讨论传感器尺寸、焦距、物距对景深的共同作用。结论适用于理解方向，不替代景深计算公式。</p>
    </div>

    <div class="card">
      <h3>立场分层</h3>
      <div class="stance-grid">
        <div class="stance-item">
          <strong>可验证事实</strong>
          视频给出景深口头定义；动画展示 F16 与大光圈下清晰区间长短差异；字幕出现「入瞳径」「浅景深」。
        </div>
        <div class="stance-item">
          <strong>UP 主观点</strong>
          直接影响景深的是入瞳径而非物理光圈；日常「光圈影响景深」需要更底层概念来解释。
        </div>
        <div class="stance-item">
          <strong>基于原文的推断</strong>
          容许弥散圆将在后续集数用于定义「多清晰算清晰」；本集只负责提出问题。
        </div>
      </div>
    </div>

    <div class="conclusion">
      <h2>总结与行动</h2>
      <h3>核心要点</h3>
      <ul>
        <li>景深是焦点前后可识别清晰的区间，背景虚化是浅景深的常见结果。</li>
        <li>口诀：光圈越小景深越深，光圈越大景深越浅。</li>
        <li>进阶纠正：直接变量是入瞳径；边界定义指向容许弥散圆。</li>
      </ul>
      <h3>行动清单</h3>
      <ol>
        <li>拍环境交代时先尝试收小光圈，观察前后清晰是否增加。</li>
        <li>拍人像虚化时开大光圈，但固定焦点在主体上再比较。</li>
        <li>用「清晰区间长度」描述画面，少用含糊的「有没有景深」。</li>
        <li>遇到「光圈到底如何影响景深」时，记下入瞳径与弥散圆，等待后续推导。</li>
        <li>复核术语：浅景深 ≠ 前景深；入瞳径 ≠ 物理叶片开合本身。</li>
      </ol>
      <h3>关键认知转变</h3>
      <p>从「背景虚化好不好看」转到「清晰区间有多长、旋钮代理是什么」；把光圈口诀当实用捷径，同时保留「入瞳径／弥散圆」这条更硬的解释链。</p>
    </div>

    <p class="footer">理性分析 · aperture-depth-of-field · 2026-07-26 · 证据来自视频画面与 Whisper 分段</p>
  </div>
</div>

    </div>
  </foreignObject>
</svg>