<div class="timeline-item"><span class="timeline-time">[00:06]</span><span class="timeline-text">很多新手小白在拍攝人像或者商單短片的過程中</span></div>
<div class="timeline-item"><span class="timeline-time">[00:10]</span><span class="timeline-text">總是覺得穩定器很複雜很難上手</span></div>
<div class="timeline-item"><span class="timeline-time">[00:13]</span><span class="timeline-text">鎖定模式是大家拿到穩定器最容易上手</span></div>
<div class="timeline-item"><span class="timeline-time">[00:16]</span><span class="timeline-text">也是最容易忽略的模式</span></div>
<div class="timeline-item"><span class="timeline-time">[00:18]</span><span class="timeline-text">比較常用於固定鏡頭或者拍攝人物</span></div>
