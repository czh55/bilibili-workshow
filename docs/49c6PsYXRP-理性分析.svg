<div class="timeline-item"><span class="timeline-time">[00:33]</span><span class="timeline-text">就可以打開鎖定模式</span></div>
<div class="timeline-item"><span class="timeline-time">[00:35]</span><span class="timeline-text">比如人物在固定位置或者固定行徑狀態時</span></div>
<div class="timeline-item"><span class="timeline-time">[00:39]</span><span class="timeline-text">鎖定模式下可以確保雲台不會向其他方向偏移</span></div>
<div class="timeline-item"><span class="timeline-time">[00:43]</span><span class="timeline-text">從而拍出跟隨人物走動的畫面</span></div>
<div class="timeline-item"><span class="timeline-time">[00:46]</span><span class="timeline-text">也可以通過鎖定模式</span></div>
<div class="timeline-item"><span class="timeline-time">[00:48]</span><span class="timeline-text">運鏡時經過不同的前景</span></div>
<div class="timeline-item"><span class="timeline-time">[00:50]</span><span class="timeline-text">把鏡頭設計成轉場過度使用</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>為什麼我們用穩定器拍攝時</li>
<li>畫面還是會移動呢?</li>
<li>哈囉大家好又是你們的瑞角</li>
<li>很多新手小白在拍攝人像或者商單短片的過程中</li>
<li>總是覺得穩定器很複雜很難上手</li>
<li>鎖定模式是大家拿到穩定器最容易上手</li>
<li>也是最容易忽略的模式</li>
<li>比較常用於固定鏡頭或者拍攝人物</li>
<li>在某個方向固定的運動</li>
<li>長按搬機鍵進入鎖定模式後</li>
<li>穩定器不會跟隨我們身體移動</li>
<li>而是鎖定在朝前的方向上</li>
<li>當我們按照固定線路拍攝時</li>
<li>就可以打開鎖定模式</li>
<li>比如人物在固定位置或者固定行徑狀態時</li>
<li>鎖定模式下可以確保雲台不會向其他方向偏移</li>
<li>從而拍出跟隨人物走動的畫面</li>
<li>也可以通過鎖定模式</li>
<li>運鏡時經過不同的前景</li>
<li>把鏡頭設計成轉場過度使用</li>
<li>RS4搭載了第四代真穩算法</li>
<li>優化了雲台的控制</li>
<li>可以在我們拍攝固定鏡頭時</li>
<li>做到盡可能的畫面穩定</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>為什麼我們用穩定器拍攝時畫面還是會移動呢?哈囉大家好又是你們的瑞角很多新手小白在拍攝人像或者商單短片的過程中總是覺得穩定器很複雜很難上手鎖定模式是大家拿到穩定器最容易上手也是最容易忽略的模式比較常用於固定鏡頭或者拍攝人物在某個方向固定的運動長按搬機鍵進入鎖定模式後穩定器不會跟隨我們身體移動而是鎖定在朝前的方向上當我們按照固定線路拍攝時就可以打開鎖定模式比如人物在固定位置或者固定行徑狀態時鎖定模式下</p><p>转录分段: 24 | 时长: 1:02</p></div>
