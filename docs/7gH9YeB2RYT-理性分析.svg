<div class="card"><h3>内容要点</h3><ul><li>今天我會用手機和雲台教大家幾種電影中常見的運鏡方式</li>
<li>第一個是前推加上搖鏡頭</li>
<li>在我們拿著穩定器向前走的過程中</li>
<li>同時用手指往上推動搖桿</li>
<li>因為一個鏡頭中包含了前鏡推動</li>
<li>和向上搖的兩個鏡頭運動</li>
<li>畫面整體會變得十分動感</li>
<li>那麼這邊我使用的手機穩定器是大疆Osmo Mobile 6</li>
<li>第二個是橫移鏡頭</li>
<li>利用穩定器自帶的延長感</li>
<li>翻轉雲台進行拍攝</li>
<li>這裡一定要注意配合上前景才能產生有層次的畫面</li>
<li>橫移鏡頭在電影中經常會出現</li>
<li>跟隨人物進行左右之間的移動</li>
<li>第三個是環繞鏡頭</li>
<li>圍繞主體進行拍攝</li>
<li>大家可以看到我的腳步其實是半蹲前進的狀態</li>
<li>這樣半蹲的前進能夠給到我們更穩定的畫面</li>
<li>在我們拍攝的過程中</li>
<li>雲台始終圍繞著主體進行拍攝</li>
<li>我們來看看電影中是如何運用這些鏡頭的</li>
<li>第四個是前推鏡頭</li>
<li>前推鏡頭非常簡單</li>
<li>但是用法卻非常多</li>
<li>它可以是快速的向前推進</li>
<li>也可以是緩慢的向前推進</li>
<li>電影中經常會出現人物傷感或者思考的時刻</li>
<li>一般導演都會用緩慢前推</li>
<li>去進行人物情緒的增強</li>
<li>第五個是上升鏡頭</li>
<li>這裡有一個使用穩定器的技巧</li>
<li>一般我會完全蹲下</li>
<li>然後運用腳和身體同時往上提升</li>
<li>這樣的畫面出來更加的平穩</li>
<li>緩慢的鏡頭上升一般在電影中用作畫面遮擋</li>
<li>揭露隱藏畫面</li>
<li>像我這裡揭露了一隻鴿子在雕塑頭上搞事情</li>
<li>同時這個運鏡也可以用作人物行動的跟隨</li>
<li>最後一個是橫移焦點轉換鏡頭</li>
<li>這個鏡頭的意思是通過橫移的鏡頭運動</li>
<li>在兩個視覺焦點之間進行切換</li>
<li>第一個我們的焦點在這個陶瓷人臉上</li>
<li>然後通過橫移把焦點切換到後面的雕塑上</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>今天我會用手機和雲台教大家幾種電影中常見的運鏡方式第一個是前推加上搖鏡頭在我們拿著穩定器向前走的過程中同時用手指往上推動搖桿因為一個鏡頭中包含了前鏡推動和向上搖的兩個鏡頭運動畫面整體會變得十分動感那麼這邊我使用的手機穩定器是大疆Osmo Mobile 6第二個是橫移鏡頭利用穩定器自帶的延長感翻轉雲台進行拍攝這裡一定要注意配合上前景才能產生有層次的畫面橫移鏡頭在電影中經常會出現跟隨人物進行左右之間的</p><p>转录分段: 43 | 时长: 2:15</p></div>
