      <div class="container root-wrap">
  <h1>达芬奇冷暖反差怎么做最简单？很多人都想错</h1>
  <div class="meta"><span class="tag tag-blue">达芬奇</span><span class="tag tag-green">冷暖反差</span><span class="tag tag-orange">白平衡</span><span class="tag tag-purple">色相差</span><span class="tag tag-red">并行节点</span><span class="tag tag-gray">时长 8分24秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/9jqn7ftdAwQ">原视频</a>
  <div class="summary-line">冷暖反差不是把受光暖色硬染成最冷，而是只染「能冷」的暗面/本色冷。先校白平衡保留色相差，影调与分区到位后全局加冷、并行找回暖色饱和——比一级轮按曝光硬分区更安全。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">能冷才冷：暗面或本色冷；受光暖色硬冷必假</span></div><div class="timeline-item"><span class="timeline-time">00:59</span><span class="timeline-text">先校白平衡再加暖，保留色相差</span></div><div class="timeline-item"><span class="timeline-time">02:10</span><span class="timeline-text">HDR 柔化影调；大遮罩+暗角强化中心</span></div><div class="timeline-item"><span class="timeline-time">05:12</span><span class="timeline-text">缺冷→全局加冷；并行找回暖饱和</span></div><div class="timeline-item"><span class="timeline-time">07:00</span><span class="timeline-text">非一级轮曝光分区；该冷该暖逻辑稳</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">前提<br/>能冷的物体/暗面</div><span class="arrow">→</span><div class="node-green">还原<br/>校白平衡 → 再加暖</div><span class="arrow">→</span><div class="node-orange">影调<br/>大遮罩分区</div><span class="arrow">→</span><div class="node-blue">染色<br/>全局加冷 → 并行保暖</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「竞争」校正为「静帧」；「中晖」校正为「中灰」；「H大色轮」校正为「HDR 色轮」；「L的加P/2D加P」校正为「Shift+P」；「直映下」校正为「只影响」；「高光劃快」校正为「高光滑块」；「不好度/好度」校正为「饱和度」；「绿色」合成模式校正为「屏幕」；「1级交死轮」校正为「一级校色轮」；「掩饰」语境为「演示」。</p><p>误区：把受光暖色硬染成画面最冷。</p><p>误区：保持错误白平衡的「好看暖」当风格。</p><p>误区：只用一级校色轮按曝光分区做冷暖。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>能冷才冷</h3>
      <p>冷一般出现在暗面或本色偏冷物体。本色暖且受光时硬成最冷必然假。</p>
      <div class="quote">如果本色就是暖色，并且它处在一个受光面，你硬要把它变成画面中最冷的存在，这必然是会很假</div>
      <div class="relation">先问「谁能冷」，再动手染色。</div>
    </div>
    <div class="card card-orange">
      <h3>校白平衡再加暖＝保留色相差</h3>
      <p>用窗户等不受置景改色的参照判断白平衡。先校再加暖：暖区几乎不动，该冷的白/肤色能相对冷。</p>
      <div class="quote">先给它校正白平衡，再给它调暖……该是冷色的部分能呈现出相对冷的结果</div>
      <div class="relation">色相差是冷暖成立的前提。</div>
    </div>
    <div class="card card-green">
      <h3>全局加冷 + 并行找回暖</h3>
      <p>缺冷就先全局加冷（可偏青绿）。本可冷区域染蓝更狠；并行节点把暖饱和找回，冷暖同时在场。</p>
      <div class="quote">此时冷色也有了，暖色也有了</div>
      <div class="relation">与「校白再染色」同一套逻辑。</div>
    </div>
    <div class="card card-red">
      <h3>不必按曝光硬分区</h3>
      <p>这套冷暖不依赖一级轮曝光分区，减少逻辑错误（如脸暗面浮冷）。</p>
      <div class="quote">我们并不是按照曝光作为分区的，像一级校色轮那样</div>
      <div class="relation">按本色/能否变冷来分区。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>个人项目经验与演示，非官方冷暖教程。</li><li>室内置景案例，外景光色需重判「谁能冷」。</li><li>白柔/黑柔、密度微调为可选风格，非必做。</li><li>课程/训练营引流信息不展开。</li></ul><div class="pitfall">受光暖色硬染最冷。</div><div class="pitfall">不校白平衡直接堆暖当风格。</div><div class="pitfall">暗角中心忽略主体肢体导致压错。</div><div class="pitfall">并行染色一次求每个色完美，拖延。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>能冷才冷：暗面/本色冷</li><li>先校白平衡再加暖，保色相差</li><li>影调分区后再染色</li><li>全局加冷 + 并行保暖更稳</li></ul><h3>行动清单</h3><ol><li>找不受置景改色的参照校白平衡</li><li>问：谁本色能冷？谁不该硬冷？</li><li>缺冷先全局加，再并行找回暖饱和</li><li>开关对比检查该冷该暖是否同时成立</li></ol><h3>关键认知转变</h3><p>以前：一级轮硬拧亮暖暗冷；现在：按本色能否变冷，校白→影调→加冷→保暖。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 8分24秒</div>
</div>
    </div>
  </foreignObject>
</svg>