<h1>闪光灯摇控色温</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">视频制作</span> <span class="tag tag-blue">灯光</span> <span class="tag tag-gray">1:53</span></div>
<div class="summary-line">闪光灯能不能像双色温、敞亮灯一样无极的遥控色温答案是可以的而且我还经常怎么使用不过这里需要两支闪光灯一直加CTO一直不加这手闪光灯的色温就可以从3200可以到5600可以之间无极调节实际使用时两支灯一直设为A组一直设置为B组先用全局调节的方式把两支闪光灯都调节到一个合适的亮度这时候不用管色温其实这时...</div>
<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">闪光灯能不能像双色温、敞亮灯一样无极的遥控色温</span></div>
<div class="timeline-item"><span class="timeline-time">[00:04]</span><span class="timeline-text">答案是可以的</span></div>
<div class="timeline-item"><span class="timeline-time">[00:05]</span><span class="timeline-text">而且我还经常怎么使用</span></div>
<div class="timeline-item"><span class="timeline-time">[00:07]</span><span class="timeline-text">不过这里需要两支闪光灯</span></div>
<div class="timeline-item"><span class="timeline-time">[00:08]</span><span class="timeline-text">一直加CTO一直不加</span></div>
<div class="timeline-item"><span class="timeline-time">[00:11]</span><span class="timeline-text">这手闪光灯的色温就可以从3200可以到5600可以之间无极调节</span></div>
<div class="timeline-item"><span class="timeline-time">[00:17]</span><span class="timeline-text">实际使用时两支灯一直设为A组</span></div>
<div class="timeline-item"><span class="timeline-time">[00:20]</span><span class="timeline-text">一直设置为B组</span></div>
<div class="timeline-item"><span class="timeline-time">[00:21]</span><span class="timeline-text">先用全局调节的方式把两支闪光灯都调节到一个合适的亮度</span></div>
<div class="timeline-item"><span class="timeline-time">[00:26]</span><span class="timeline-text">这时候不用管色温</span></div>
<div class="timeline-item"><span class="timeline-time">[00:27]</span><span class="timeline-text">其实这时候的色温大概是在3200可以到5600可以之间的平均值</span></div>
<div class="timeline-item"><span class="timeline-time">[00:32]</span><span class="timeline-text">大概是4400可以</span></div>
<div class="timeline-item"><span class="timeline-time">[00:34]</span><span class="timeline-text">也就是说先把亮度值确定了下一步再调色温</span></div>
<div class="timeline-item"><span class="timeline-time">[00:38]</span><span class="timeline-text">需要调暖色温就提高A组的亮度值降低B组的亮度值</span></div>
<div class="timeline-item"><span class="timeline-time">[00:43]</span><span class="timeline-text">需要调冷色温就降低A组的值提高B组值</span></div>
<div class="timeline-item"><span class="timeline-time">[00:48]</span><span class="timeline-text">只要A组值和B组值相加保持在一个大致的横定种的亮度就不会有什么大的变化</span></div>
<div class="timeline-item"><span class="timeline-time">[00:54]</span><span class="timeline-text">具体调节需要些经验值但实际上也不复杂</span></div>
<div class="timeline-item"><span class="timeline-time">[00:57]</span><span class="timeline-text">比去换色变方便多了</span></div>
<div class="timeline-item"><span class="timeline-time">[00:59]</span><span class="timeline-text">多用用就熟了</span></div>
<div class="timeline-item"><span class="timeline-time">[01:00]</span><span class="timeline-text">我们再隐身一步闪光灯能不能实现RGB的调色呢</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>闪光灯能不能像双色温、敞亮灯一样无极的遥控色温</li>
<li>答案是可以的</li>
<li>而且我还经常怎么使用</li>
<li>不过这里需要两支闪光灯</li>
<li>一直加CTO一直不加</li>
<li>这手闪光灯的色温就可以从3200可以到5600可以之间无极调节</li>
<li>实际使用时两支灯一直设为A组</li>
<li>一直设置为B组</li>
<li>先用全局调节的方式把两支闪光灯都调节到一个合适的亮度</li>
<li>这时候不用管色温</li>
<li>其实这时候的色温大概是在3200可以到5600可以之间的平均值</li>
<li>大概是4400可以</li>
<li>也就是说先把亮度值确定了下一步再调色温</li>
<li>需要调暖色温就提高A组的亮度值降低B组的亮度值</li>
<li>需要调冷色温就降低A组的值提高B组值</li>
<li>只要A组值和B组值相加保持在一个大致的横定种的亮度就不会有什么大的变化</li>
<li>具体调节需要些经验值但实际上也不复杂</li>
<li>比去换色变方便多了</li>
<li>多用用就熟了</li>
<li>我们再隐身一步闪光灯能不能实现RGB的调色呢</li>
<li>理论上也可以但我们需要3支灯</li>
<li>一直加红色色片一直加绿色色变一直加蓝色色变</li>
<li>同等输出下3支灯打出来的混合颜色应该是白色</li>
<li>你想打出不同的颜色只要调整3支灯输出的比例就可以了</li>
<li>实际操作会比较复杂一般人搞不定</li>
<li>不过我觉得有一个很简单的方法</li>
<li>就是在隐闪器上面设置一个算法来自动计算输出比例的方式来实现RGB的闪光灯</li>
<li>如果隐闪器上实现这种功能比较麻烦的话</li>
<li>我觉得也可以在手机APP上来做</li>
<li>只要通过手机APP和隐闪器之间的通讯来实现远程控制就可以了</li>
<li>不需要添加任何硬件设施就可以实现RGB的闪光灯</li>
<li>那会不会有闪光灯的厂商这样试一下呢</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>闪光灯能不能像双色温、敞亮灯一样无极的遥控色温答案是可以的而且我还经常怎么使用不过这里需要两支闪光灯一直加CTO一直不加这手闪光灯的色温就可以从3200可以到5600可以之间无极调节实际使用时两支灯一直设为A组一直设置为B组先用全局调节的方式把两支闪光灯都调节到一个合适的亮度这时候不用管色温其实这时候的色温大概是在3200可以到5600可以之间的平均值大概是4400可以也就是说先把亮度值确定了下一</p><p>转录分段: 32 | 时长: 1:53</p></div>
