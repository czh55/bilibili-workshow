.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>五调归纳法</h1>
  <div class="meta"><span class="tag tag-blue">五调</span><span class="tag tag-green">黑白</span><span class="tag tag-orange">色阶</span><span class="tag tag-purple">列宾</span><span class="tag tag-red">结构</span><span class="tag tag-gray">时长 152秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/6YjFqgvsnav">原视频</a>
  <div class="summary-line">如五音成曲：先眯眼取最黑、最白，其余并大灰成三阶；再把大灰劈成亮灰与暗灰得五调。结构完成后细化和上色才简单——五调是不脏不乱的地基。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">五音成曲类比</span></div><div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">五调归纳法</span></div><div class="timeline-item"><span class="timeline-time">00:34</span><span class="timeline-text">列宾肖像</span></div><div class="timeline-item"><span class="timeline-time">00:42</span><span class="timeline-text">找最黑最白</span></div><div class="timeline-item"><span class="timeline-time">00:58</span><span class="timeline-text">三色阶</span></div><div class="timeline-item"><span class="timeline-time">01:07</span><span class="timeline-text">灰中分亮暗</span></div><div class="timeline-item"><span class="timeline-time">01:21</span><span class="timeline-text">结构完成</span></div><div class="timeline-item"><span class="timeline-time">01:45</span><span class="timeline-text">复杂画面挑战</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">类比<br/>五音</div><span class="arrow">→</span><div class="node-green">三阶<br/>黑白大灰</div><span class="arrow">→</span><div class="node-orange">五调<br/>亮灰暗灰</div><span class="arrow">→</span><div class="node-blue">地基<br/>再细化加彩</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「色结」→「色阶」；眯眼「卡兹兰」为口语玩笑。</p><p>误区：黑白要从一开始就抠五层。应先三后五。</p><p>误区：上色可跳过明暗结构。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>五音类比</h3>
      <p>好听曲子往往音阶有限——绘画亦然。</p>
      <div class="quote">音乐可以五音成曲</div>
      <div class="relation">限制即方法。</div>
    </div>
    <div class="card card-orange">
      <h3>先三后五</h3>
      <p>眯眼取极值黑白，其余并大灰。</p>
      <div class="quote">画面瞬间被归纳为清晰的三个色阶</div>
      <div class="relation">整体优先。</div>
    </div>
    <div class="card card-red">
      <h3>劈开大灰</h3>
      <p>最亮灰＋最暗灰→五调丰富明确。</p>
      <div class="quote">像施了魔法一样</div>
      <div class="relation">结构训练至此可停。</div>
    </div>
    <div class="card card-purple">
      <h3>复杂亦成立</h3>
      <p>超复杂画面仍可五调；科学思路＋有效方法。</p>
      <div class="quote">这就是科学思路加有效方法的魅力所在</div>
      <div class="relation">可迁移。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>地基定位</p>
      <div class="quote">五调归纳法＝不脏不乱、立体扎实的万能地基。</div>
      <div class="relation">其实五调归纳法就是你画面</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>152秒方法演示。</li><li>复杂挑战作品名未口播。</li><li>课宣非步骤。</li></ul><div class="pitfall">不眯眼直接局部取色。</div><div class="pitfall">灰阶切太碎超过五调。</div><div class="pitfall">结构未立就上色。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>先三阶后五调</li><li>极值＋灰阶劈分</li><li>结构先于细化</li></ul><h3>行动清单</h3><ol><li>任选照片眯眼涂三阶</li><li>再只加两灰成五调</li><li>禁止超过五块前细化</li><li>复杂场景重复一次验证</li></ol><h3>关键认知转变</h3><p>以前：黑白一起磨细节；现在：五调立住再谈刻画与色彩。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 152秒</div>
</div>
    </div>
  </foreignObject>
</svg>