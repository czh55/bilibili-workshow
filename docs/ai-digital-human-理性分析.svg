<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2586" viewBox="0 0 1320 2586">
  <foreignObject x="0" y="0" width="1320" height="2586">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}
.container{max-width:1200px;margin:0 auto}
h1{font-size:36px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h2{font-size:26px;font-weight:700;color:#1e40af;margin:32px 0 16px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
h3{font-size:20px;font-weight:700;color:#334155;margin-bottom:12px}
p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}
ul,ol{padding-left:24px;margin:8px 0}
li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:6px}
.tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}
.tag-blue{background:#dbeafe;color:#1e40af}
.tag-green{background:#d1fae5;color:#065f46}
.tag-orange{background:#ffedd5;color:#9a3412}
.tag-purple{background:#ede9fe;color:#6b21a8}
.tag-red{background:#fee2e2;color:#991b1b}
.tag-gray{background:#f1f5f9;color:#64748b}
.meta{margin:12px 0 20px}
.summary-line{font-size:18px;line-height:1.7;color:#334155;padding:20px 24px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline{background:#fff;border-radius:16px;padding:24px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline h3{color:#1e40af;margin-bottom:12px}
.timeline-item{display:flex;align-items:baseline;padding:8px 0;border-bottom:1px solid #f1f5f9}
.timeline-time{font-size:14px;font-weight:700;color:#3b82f6;min-width:70px;font-variant-numeric:tabular-nums}
.timeline-text{font-size:15px;color:#475569}
.map{background:#fff;border-radius:20px;padding:36px;margin-bottom:28px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.map h2{font-size:24px;margin-top:0;border-bottom:none;padding-bottom:0}
.diagram{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:20px 0}
.node{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:16px;padding:20px 28px;text-align:center;min-width:160px;font-weight:700;font-size:16px;color:#1e40af}
.node-green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}
.node-orange{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}
.arrow{font-size:24px;color:#94a3b8}
.correction{background:linear-gradient(135deg,#fef3c7,#fef9c3);border-left:4px solid #f59e0b;padding:20px 24px;border-radius:12px;margin-bottom:24px}
.correction h3,.correction p{color:#92400e}
.section{margin-bottom:32px}
.sec-title{font-size:22px;font-weight:700;color:#1e40af;margin-bottom:16px;padding-left:16px;border-left:4px solid #3b82f6}
.card{background:#fff;border-radius:16px;padding:32px;margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.06);border-left:5px solid #3b82f6}
.card.card-green{border-left-color:#10b981}
.card.card-orange{border-left-color:#f59e0b}
.card.card-purple{border-left-color:#8b5cf6}
.card.card-red{border-left-color:#ef4444}
.card h3{font-size:20px;font-weight:700;color:#1e40af;margin-bottom:12px}
.card .highlight{background:#fef3c7;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#92400e;border-left:4px solid #f59e0b}
.card .quote{background:#f8fafc;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#64748b;border-left:4px solid #cbd5e1;font-style:italic}
.card .relation{background:#f0fdf4;padding:10px 14px;border-radius:10px;margin:8px 0;font-size:14px;color:#166534}
.card .pitfall{background:#fef2f2;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#991b1b;border-left:4px solid #ef4444}
.card .action,.card .insight{background:#eff6ff;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#1e40af;border-left:4px solid #3b82f6}
.speaker{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:12px;margin-right:8px}
.speaker-host{background:#dbeafe;color:#1e40af}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}
th{background:#f1f5f9;padding:12px 16px;text-align:left;font-weight:700;color:#1e40af;border-bottom:2px solid #cbd5e1}
td{padding:12px 16px;border-bottom:1px solid #e2e8f0;color:#475569;vertical-align:top}
tr:nth-child(even) td{background:#fafbfc}
.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:36px;margin-top:32px}
.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>一个视频教会你 AI 数字人</h1>
  <div class="meta"><span class="tag tag-blue">剪映</span><span class="tag tag-green">AI数字人</span><span class="tag tag-orange">教程</span><span class="tag tag-purple">视频制作</span><span class="tag tag-gray">时长 4分18秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/CvmNqVh9YC">原视频</a>
  <div class="summary-line">剪映AI数字人制作7步：①入口=开始创作→左侧上方工具栏数字人工具；②形象=定制（上传正面照生成）或内置（热门/超仿真/绿幕主题，绿幕背景透明方便换背景，点形象预览自动播旁白）；③背景=先保持空背景，后续用素材补充；④文案=输入/粘贴或智能文案自动生成几组选择；⑤声音=克隆音色/主题/超仿真试听+勾选同时生成字幕；⑥合成=自动匹配语音动作口型同步；⑦成片=素材库拖风景背景（长视频多段）、Ctrl+B分割删多余、分离原声一键删除、比例改9:16抖音格式。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">开场：用剪映做个性数字人</span></div><div class="timeline-item"><span class="timeline-time">00:14</span><span class="timeline-text">开始创作→数字人工具</span></div><div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">定制形象：上传正面照生成</span></div><div class="timeline-item"><span class="timeline-time">00:40</span><span class="timeline-text">内置形象：热门/分类筛选</span></div><div class="timeline-item"><span class="timeline-time">00:52</span><span class="timeline-text">超仿真更真实；点形象预览旁白</span></div><div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">绿幕主题背景透明方便换背景</span></div><div class="timeline-item"><span class="timeline-time">01:29</span><span class="timeline-text">右侧切换景别/背景，先留空背景</span></div><div class="timeline-item"><span class="timeline-time">01:49</span><span class="timeline-text">文案：输入/粘贴或智能生成</span></div><div class="timeline-item"><span class="timeline-time">02:18</span><span class="timeline-text">声音：克隆音色/主题/超仿真</span></div><div class="timeline-item"><span class="timeline-time">02:52</span><span class="timeline-text">勾选字幕→生成→口型同步确认</span></div><div class="timeline-item"><span class="timeline-time">03:06</span><span class="timeline-text">官方素材库拖风景背景</span></div><div class="timeline-item"><span class="timeline-time">03:25</span><span class="timeline-text">Ctrl+B分割删多余素材</span></div><div class="timeline-item"><span class="timeline-time">03:39</span><span class="timeline-text">分离原声一键删除</span></div><div class="timeline-item"><span class="timeline-time">03:50</span><span class="timeline-text">比例改9:16抖音格式</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">形象<br/>定制上传照/内置/绿幕</div><span class="arrow">→</span><div class="node-green">文案<br/>粘贴或智能生成</div><span class="arrow">→</span><div class="node-orange">声音<br/>克隆/主题/超仿真</div><span class="arrow">→</span><div class="node-blue">合成<br/>字幕+语音+口型同步</div><span class="arrow">→</span><div class="node">背景<br/>素材库风景拖入</div><span class="arrow">→</span><div class="node-green">成片<br/>9:16比例+清原声</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误区：以为数字人必须露脸。不想露脸可用内置形象，绿幕主题背景透明方便后期换背景。</p><p>误区：以为文案只能自己写。智能文案输入需求自动生成几组，不满意点下一个。</p><p>误区：以为合成完就结束了。还要拖背景、Ctrl+B分割删多余、分离删除原声、改9:16比例。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card">
      <h3>两种形象方案</h3>
      <p>定制数字人形象有两种方案：想用自己的形象，点定制形象→加号→上传清晰正面照，系统自动生成属于你的AI数字人；不想露脸或想快速完成，直接用内置形象——按热门类型、最新分类筛选，超仿真主题更真实，点每个形象可预览效果、自动播放一段旁白方便判断。</p>
      <div class="quote">上传一张清晰的正面照片，系统会自动生成属于你的AI数字人</div>
      <div class="relation">想露脸=定制；不想露脸=内置。</div>
    </div>
    <div class="card card card-green">
      <h3>绿幕主题：换背景的自由度</h3>
      <p>如果希望数字人更独特、与众不同，也方便后期更换背景，推荐使用绿幕主题——这些形象的背景是透明的，只保留人物本身。选好形象后在右侧将功能滑到底部，可以切换景别和背景（纯色/实体型）。制作时先保持空背景，方便后续切换成素材背景，让视频更具风格化。</p>
      <div class="quote">推荐大家使用绿幕主题，这些形象的背景是透明的，只保留人物本身</div>
      <div class="relation">透明背景=后期自由换景。</div>
    </div>
    <div class="card card card-purple">
      <h3>文案与声音</h3>
      <p>有现成文案直接输入或粘贴；没有文案点蓝色智能文案图标，输入需求（如100字左右人生感悟），系统自动生成几组文案，不满意点下一个直到满意。选声音：左边克隆音色点加号生成，或右侧小三角选主题声音；想要更真实选超仿真主题，试听不同声音挑选。</p>
      <div class="quote">系统会自动生成几组文案供你选择，如果不满意可以点击下一个</div>
      <div class="relation">AI生成文案+多组备选。</div>
    </div>
    <div class="card card card-orange">
      <h3>一键合成：口型同步</h3>
      <p>挑选好音色后，勾选下方的『同时生成字幕』，然后点击生成——系统会自动合成语音和数字人动作，人物形象和口型都会同步匹配，再点击确认合成，数字人就初步成型了。</p>
      <div class="quote">系统会自动合成语音和数字人动作，人物形象和口型都会同步匹配</div>
      <div class="relation">语音+动作+口型三合一。</div>
    </div>
    <div class="card card card-blue">
      <h3>背景与收尾技巧</h3>
      <p>添加风格化背景：左上角素材→官方素材库→搜索风景素材拖到时间线数字人下方；长视频多拖几段增加多样性。清理技巧：片尾多余素材选中按Ctrl+B分割后删除；风景素材带原声的，鼠标右键分离音频，选中所有分离音频一键删除原声。最后把右下角比例改成9:16抖音格式。</p>
      <div class="quote">把它改成9比16的抖音格式，一个完整的AI数字人视频就做好了</div>
      <div class="relation">拖背景→清多余→改比例。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">AI 数字人制作速查</h2><div class="card"><table><thead><tr><th>步骤</th><th>操作</th><th>要点</th></tr></thead><tbody><tr><td>入口</td><td>开始创作→数字人工具</td><td>左侧上方工具栏</td></tr><tr><td>形象</td><td>定制/内置/绿幕</td><td>绿幕背景透明</td></tr><tr><td>背景</td><td>先留空，后补素材</td><td>保持空背景</td></tr><tr><td>文案</td><td>粘贴/智能文案</td><td>不满意点下一个</td></tr><tr><td>声音</td><td>克隆/主题/超仿真</td><td>勾选同时生成字幕</td></tr><tr><td>合成</td><td>点击生成→确认合成</td><td>口型同步</td></tr><tr><td>背景</td><td>素材库拖风景</td><td>长视频拖多段</td></tr><tr><td>清理</td><td>Ctrl+B分割/分离原声</td><td>一键删除原声</td></tr><tr><td>成片</td><td>比例9:16</td><td>抖音格式</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>教程基于剪映特定版本的数字人功能，不同版本入口与界面可能有差异。</li><li>定制形象需上传清晰正面照片，生成效果以系统实际输出为准。</li><li>AI生成的文案与声音可能不完全符合预期，需要人工挑选与微调。</li></ul><div class="pitfall">忘记先勾选『同时生成字幕』，后面补字幕麻烦。</div><div class="pitfall">风景素材带原声直接导出，口播混入背景声。</div><div class="pitfall">片尾多余素材不分割不删除，视频拖沓。</div><div class="pitfall">忘记改9:16比例，抖音发布被裁剪。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>数字人=剪映左侧工具栏一个入口。</li><li>形象：定制/内置/绿幕三选一。</li><li>文案智能生成、声音超仿真更真实。</li><li>合成自动同步口型与动作。</li><li>成片=拖背景+清原声+改9:16。</li></ul><h3>行动清单</h3><ol><li>打开剪映找到数字人工具，先选一个内置形象练手。</li><li>用智能文案生成一段人生感悟。</li><li>勾选同时生成字幕再点击生成。</li><li>从官方素材库拖一个风景背景。</li><li>按9:16导出，发布到抖音。</li></ol><h3>关键认知转变</h3><p>从『不会做口播视频』到『7步流水线出片』——形象、文案、声音、背景全部AI辅助，你只需要会点按钮。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 视频 4分18秒 · AI 数字人教程</div>
</div>
    </div>
  </foreignObject>
</svg>