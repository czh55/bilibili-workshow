.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>人体素材「一虾四吃」</h1>
  <div class="meta"><span class="tag tag-blue">人体</span><span class="tag tag-green">火柴人</span><span class="tag tag-orange">体块</span><span class="tag tag-purple">骨骼</span><span class="tag tag-red">肌肉</span><span class="tag tag-gray">时长 105秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/AeZoUTHkFo2">原视频</a>
  <div class="summary-line">同一素材四吃：火柴人盯比例动态（肩／盆骨线）；几何体块练动态透视（分水岭）；骨骼透结构；肌肉解决结构假。层层叠加，不要只临表皮。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">四种练习方法</span></div><div class="timeline-item"><span class="timeline-time">00:04</span><span class="timeline-text">火柴人：比例与动态</span></div><div class="timeline-item"><span class="timeline-time">00:18</span><span class="timeline-text">肩线盆骨线要准</span></div><div class="timeline-item"><span class="timeline-time">00:24</span><span class="timeline-text">几何体块：动态透视</span></div><div class="timeline-item"><span class="timeline-time">00:41</span><span class="timeline-text">分水岭</span></div><div class="timeline-item"><span class="timeline-time">00:50</span><span class="timeline-text">骨骼训练</span></div><div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">肌肉解决结构假</span></div><div class="timeline-item"><span class="timeline-time">01:31</span><span class="timeline-text">一虾四吃</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">1<br/>火柴人</div><span class="arrow">→</span><div class="node-green">2<br/>几何体块</div><span class="arrow">→</span><div class="node-orange">3<br/>骨骼</div><span class="arrow">→</span><div class="node-blue">4<br/>肌肉</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「一瞎四吃／分水滴／文化的时候」→「一虾四吃／分水岭／画的时候」。</p><p>误区：四种互相替代。视频是递进四层。</p><p>误区：跳过体块直接肌肉。分水岭在体块。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>火柴人减负</h3>
      <p>只关注比例与动态；肩线与盆骨线必须准。</p>
      <div class="quote">只关注人的比例和动态……肩线和盆骨线……一定要找准确</div>
      <div class="relation">先动态，后体积。</div>
    </div>
    <div class="card card-orange">
      <h3>体块是分水岭</h3>
      <p>几何形体练动态透视，难但区分会不会画。</p>
      <div class="quote">这也是会画画的人和不会画画的重要分水岭</div>
      <div class="relation">过不了体块，后面白练。</div>
    </div>
    <div class="card card-red">
      <h3>骨骼→肌肉递进</h3>
      <p>骨骼加深结构透视；肌肉针对「结构很假」，让你更主动画准画好看。</p>
      <div class="quote">帮助我们解决画出来的结构很假的这种常见的问题</div>
      <div class="relation">假结构往往缺中间层。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>一虾四吃</p>
      <div class="quote">四个方法吃同一张素材——复用参考，叠加能力。</div>
      <div class="relation">以上就是人体素材练习的一虾四吃</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>105 秒方法总览，非完整解剖课。</li><li>示范为单一动态模特。</li><li>「分水岭」为激励性判断。</li></ul><div class="pitfall">同一素材只临表面光影一遍。</div><div class="pitfall">火柴人阶段就加肌肉。</div><div class="pitfall">体块阶段忽略肩盆动态线。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>四层递进吃同一素材</li><li>肩盆线是动态底线</li><li>体块过关再上骨骼肌肉</li></ul><h3>行动清单</h3><ol><li>选一张人体：只画火柴人一版</li><li>同图只画体块一版</li><li>再骨骼、再肌肉</li><li>对比四版，看假结构消失在哪一层</li></ol><h3>关键认知转变</h3><p>以前：一张素材临一次表皮；现在：一虾四吃，能力按层叠上去。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 105秒</div>
</div>
    </div>
  </foreignObject>
</svg>