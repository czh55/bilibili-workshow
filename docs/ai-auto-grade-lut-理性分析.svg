.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>真正的AI自动调色：一键仿色，一键制作LUT</h1>
  <div class="meta"><span class="tag tag-blue">达芬奇</span><span class="tag tag-green">AI调色</span><span class="tag tag-orange">LUT</span><span class="tag tag-purple">仿色</span><span class="tag tag-red">曝光层次</span><span class="tag tag-gray">时长 5分29秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/2kuBFtuBYg0">原视频</a>
  <div class="summary-line">手搓阴天浓郁车景：还原别太亮→车身对比与光泽→压地面天空→加绿保暖。AI LUT 应在曝光层次做好后生成，色域选项对齐色彩管理，力度用键输出增益回调；细节校正仍需手动节点。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">阴天浓郁：还原别太亮；主体是车</span></div><div class="timeline-item"><span class="timeline-time">00:30</span><span class="timeline-text">车加对比抬 Light；压地面天空；HDR 强化光泽</span></div><div class="timeline-item"><span class="timeline-time">01:33</span><span class="timeline-text">加绿+并行保暖；电影感外观；神奇遮罩还原白车</span></div><div class="timeline-item"><span class="timeline-time">02:51</span><span class="timeline-text">只留曝光层次→静帧→本地生成 LUT→前插微调</span></div><div class="timeline-item"><span class="timeline-time">04:32</span><span class="timeline-text">内测有 Bug；登录反馈；功能仍在优化</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">手搓<br/>曝光层次 → 光泽 → 颜色</div><span class="arrow">→</span><div class="node-green">AI<br/>层次静帧 → LUT → 回调</div><span class="arrow">→</span><div class="node-orange">对齐<br/>广色域 / Rec.709</div><span class="arrow">→</span><div class="node-blue">边界<br/>LUT 试风格，细节仍手调</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「辣子」校正为「LUT」；「王子会」校正为「网址会」；「体谅」校正为「提亮」；「界面制造」校正为「渐变遮罩」；「饮料关系」校正为「明暗关系」；「慢反射」校正为「漫反射」；「映光」语境为「硬光」；「竞争」校正为「静帧」；「LAD」校正为「LUT」；「达芬基」校正为「达芬奇」；「REG709」校正为「Rec.709」；「键输出的增益」保留为键输出增益；「AEI」为反馈选项口误。</p><p>误区：没做曝光层次就直接套 AI LUT。视频建议先做好层次再生成。</p><p>误区：色彩管理选错广色域/Rec.709。选项必须对齐项目设置。</p><p>误区：LUT 力度过大硬吃。用键输出增益回调，色偏前插节点微调。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>阴天浓郁：还原别太亮</h3>
      <p>作者要阴雨浓郁感，还原过亮就不符。主体是车：不加对比会发灰，遮罩加反差并抬 Light 把光感拉出来。</p>
      <div class="quote">作者想要阴天浓郁的感觉，那我们还原的时候，自然不能太亮</div>
      <div class="relation">定调先于风格与 AI。</div>
    </div>
    <div class="card card-orange">
      <h3>漫反射拧巴：牺牲地面，弱化天空</h3>
      <p>阴天反差不能太强，但受光面又不亮。把地面当可牺牲暗部，天空别太亮，再 HDR 降 Light/Shadow、抬 Highlight 强化车身光泽。</p>
      <div class="quote">阴天的反差不能太强，因为它是漫反射……需要找到画面中可以被牺牲的部分</div>
      <div class="relation">调车几乎必须做出光泽感。</div>
    </div>
    <div class="card card-green">
      <h3>缺绿就加绿，并行保暖</h3>
      <p>参考偏绿而地面暖：全局加绿后并行用蜘蛛网把暖饱和拉回。白车被外观染色，用神奇遮罩去色还原。</p>
      <div class="quote">画面中又暖又有绿……用神奇遮罩卷出了这个车，给它去了颜色</div>
      <div class="relation">颜色怪就开新节点，别回头硬拧。</div>
    </div>
    <div class="card card-purple">
      <h3>AI：层次静帧 → LUT → 增益回调</h3>
      <p>删颜色节点只留层次，静帧上传，选对广色域/Rec.709，本地生成后拖末节点。偏暖则前插略绿冷；过大则键输出增益回调。</p>
      <div class="quote">我建议大家在原始画面中，上传已经做好曝光层次的画面</div>
      <div class="relation">适合快速试风格，精细仍手调胜出。</div>
    </div>
    <div class="card card-red">
      <h3>工具边界：内测有 Bug</h3>
      <p>预览可能不准、功能仍在优化；登录反馈。不好用先别骂，好用再继续分享。</p>
      <div class="quote">目前测试没有特别的完善，还是有不少 Bug</div>
      <div class="relation">当加速试色，不当最终裁判。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>个人工具演示与经验口令，非官方 AI 调色标准。</li><li>LUT 仿色依赖参考图与色彩管理选择，结果需人工校色偏。</li><li>预览窗 Bug、内测范围以作者说明为准。</li><li>课程/线下班/平台为引流信息，实录不展开招生细节。</li></ul><div class="pitfall">还原过亮，阴天浓郁直接垮掉。</div><div class="pitfall">调车不做光泽，车身发灰。</div><div class="pitfall">未做曝光层次就生成 LUT。</div><div class="pitfall">广色域项目却选 Rec.709（或相反）。</div><div class="pitfall">LUT 力度过大不回调增益。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>手搓主线：层次 → 光泽分区 → 颜色</li><li>AI 适合层次做好后快速试风格</li><li>色域选项必须对齐色彩管理</li><li>键输出增益回调 LUT 力度</li></ul><h3>行动清单</h3><ol><li>阴天浓郁：先把还原压到「不够亮」</li><li>车：遮罩对比 + HDR 抬 Highlight</li><li>生成 LUT 前只留曝光层次静帧</li><li>拖入后色偏前插、力度用增益收</li></ol><h3>关键认知转变</h3><p>以前：全程手搓节点堆风格；现在：层次手做，风格可 LUT 快试再微调。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 5分29秒</div>
</div>
    </div>
  </foreignObject>
</svg>