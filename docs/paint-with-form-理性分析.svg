      <div class="container root-wrap">
  <h1>用形体画画：先体块后细节</h1>
  <div class="meta"><span class="tag tag-blue">体块</span><span class="tag tag-green">造型</span><span class="tag tag-orange">鲁本斯</span><span class="tag tag-purple">光源</span><span class="tag tag-red">肖像</span><span class="tag tag-gray">时长 138秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/NWMxdjXcoz">原视频</a>
  <div class="summary-line">过早抠细节；鲁本斯去细节剩体块。头作俯视立方体，下光源分正面／侧暗／朝亮／背最深；深背景助控明度。细节＝大体块上的小体块，禁止孤立描眼皮。校正朝向是否符合光影。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">太早关注细节</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">鲁本斯去掉细节剩体块</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">头＝俯视立方体</span></div><div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">光从下方</span></div><div class="timeline-item"><span class="timeline-time">00:35</span><span class="timeline-text">侧光稍暗、朝光提亮</span></div><div class="timeline-item"><span class="timeline-time">00:50</span><span class="timeline-text">背光最深</span></div><div class="timeline-item"><span class="timeline-time">00:56</span><span class="timeline-text">深色背景帮明度</span></div><div class="timeline-item"><span class="timeline-time">01:19</span><span class="timeline-text">眼周体块后点瞳孔</span></div><div class="timeline-item"><span class="timeline-time">01:35</span><span class="timeline-text">细节是小体块</span></div><div class="timeline-item"><span class="timeline-time">01:45</span><span class="timeline-text">校正朝向与光影</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">先<br/>体块</div><span class="arrow">→</span><div class="node-green">分<br/>朝向明暗</div><span class="arrow">→</span><div class="node-orange">后<br/>小体块细节</div><span class="arrow">→</span><div class="node-blue">验<br/>光影逻辑</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「卢本斯／线铃／较正／闭塞／重着光源」→「鲁本斯／理清／校正／闭塞阴影／朝着光源」。</p><p>误区：细节＝描五官线。视频定义为小体块关系。</p><p>误区：先画眼睛再找体块。应体块立住再点瞳孔。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>去细节剩体块</h3>
      <p>鲁本斯启示：先体块后细节，避免过早刻画。</p>
      <div class="quote">去掉细节以后剩下的是什么？是体块</div>
      <div class="relation">复杂度的正确降维。</div>
    </div>
    <div class="card card-orange">
      <h3>立方体＋下光</h3>
      <p>头＝俯视立方体；分正面、侧暗、朝亮、背最深。</p>
      <div class="quote">把头部看成一个俯视的立方体</div>
      <div class="relation">几何容器承载明暗。</div>
    </div>
    <div class="card card-red">
      <h3>背景与提亮</h3>
      <p>深背景帮把握明度；朝光面大胆提亮。</p>
      <div class="quote">完全朝着光源的面一定要大胆的提亮</div>
      <div class="relation">明度锚点要敢给。</div>
    </div>
    <div class="card card-purple">
      <h3>细节定义</h3>
      <p>细节是大体块上的小体块，不是孤立描眼皮皱纹。</p>
      <div class="quote">是大体块上面的小体块关系</div>
      <div class="relation">细节必须继承朝向逻辑。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>体块意识</p>
      <div class="quote">全程用体块意识，轻松完成非常规光线肖像。</div>
      <div class="relation">我全程用体块意识……就能画完</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>138 秒造型示范，非完整解剖课。</li><li>参考为鲁本斯风格仰视／非常规光肖像。</li><li>2 月 2 日课宣为片尾信息。</li></ul><div class="pitfall">开局描五官。</div><div class="pitfall">侧脸与背光明度糊成一片。</div><div class="pitfall">细节脱离大面朝向。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>先体块后细节</li><li>按朝向分面</li><li>细节＝小体块</li></ul><h3>行动清单</h3><ol><li>头像先画俯视立方体与下光源箭头</li><li>只分四类面：正／侧／朝光／背光</li><li>眼周小体块立住再点瞳孔</li><li>收工前逐面问：朝向是否仍符合光</li></ol><h3>关键认知转变</h3><p>以前：先把眼睛鼻子画像；现在：先让立方体在光里站住，细节只是小体块。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 138秒</div>
</div>
    </div>
  </foreignObject>
</svg>