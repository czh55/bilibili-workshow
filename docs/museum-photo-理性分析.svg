<h1>博物馆别只拍文物！6个拍照口诀拍出故事感</h1>
<div class="meta">
<span class="tag tag-blue">拍照技巧</span><span class="tag tag-green">博物馆</span><span class="tag tag-orange">构图</span><span class="tag tag-gray">0:12</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>博物馆拍照6口诀：<strong>拍一个用特写</strong>、<strong>拍两个走对角线</strong>、<strong>拍多个绕侧面</strong>、<strong>故事感用剪影</strong>、<strong>拍窗影找反射</strong>、<strong>拍层次用框架</strong>——不拍干巴巴的文物正面照，构图一变照片就有故事感。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">口诀1：拍一个，用特写</span></div><div class="timeline-item"><span class="timeline-time">00:01</span><span class="timeline-text">口诀2：拍两个，对角线</span></div><div class="timeline-item"><span class="timeline-time">00:03</span><span class="timeline-text">口诀3：拍多个，绕侧面</span></div><div class="timeline-item"><span class="timeline-time">00:05</span><span class="timeline-text">口诀4：故事感，用剪影</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">口诀5：拍窗影，找反射</span></div><div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">口诀6：拍层次，用框架</span></div></div>
<div class='section'><div class='sec-title'>6个口诀速记</div><div class='card'><h3>① 拍一个，用特写</h3><p>单个文物别拍全身正面，<strong>靠近拍特写</strong>——放大纹样、肌理、细节，照片立刻高级。</p></div><div class='card card-green' style='margin:12px 0'><h3>② 拍两个，对角线</h3><p>两个物品时让它们构成<strong>对角线关系</strong>，画面有动势和延伸感，不呆板。</p></div><div class='card card-orange' style='margin:12px 0'><h3>③ 拍多个，绕侧面</h3><p>多个展品别正面排排拍，<strong>绕到侧面</strong>用斜角度拍，有纵深感、像在“讲述”。</p></div><div class='card card-purple' style='margin:12px 0'><h3>④ 故事感，用剪影</h3><p>用<strong>剪影</strong>拍人物/文物轮廓，背景留光，故事感和氛围感拉满。</p></div><div class='card card-red' style='margin:12px 0'><h3>⑤ 拍窗影，找反射</h3><p>博物馆窗户的<strong>光影投射</strong>、展柜玻璃<strong>反射</strong>——虚实结合，画面有层次有味道。</p></div><div class='card'><h3>⑥ 拍层次，用框架</h3><p>借<strong>门框、窗框、展柜边</strong>做前景框架，把文物框在里面，纵深感强、构图有故事。</p></div></div>
<div class="conclusion">
<h2>博物馆拍照口诀卡</h2>
<h3>6个口诀</h3><ol><li><strong>特写</strong>：拍一个，放大细节</li><li><strong>对角线</strong>：拍两个，制造动势</li><li><strong>侧面</strong>：拍多个，斜角度纵深</li><li><strong>剪影</strong>：要故事感，轮廓+逆光</li><li><strong>反射</strong>：窗影玻璃，虚实结合</li><li><strong>框架</strong>：门框窗框，前景构图</li></ol><h3>记住一句话</h3><ul><li>博物馆不是“拍文物”，是<strong>用构图讲故事</strong></li></ul>
</div>
