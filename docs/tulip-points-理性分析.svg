<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2078" viewBox="0 0 1320 2078">
  <foreignObject x="0" y="0" width="1320" height="2078">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&amp;display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans SC',-apple-system,sans-serif}.container{width:1240px;padding:40px 40px 60px}h1{font-size:30px;font-weight:700;color:#1a1a1a;margin-bottom:8px}.meta{font-size:13px;color:#999;margin-bottom:8px}.tags{margin-bottom:20px}.tag{display:inline-block;background:#fdf2f2;color:#c0392b;padding:3px 10px;border-radius:12px;font-size:12px;margin-right:8px}.summary-line{background:#fff5f5;border-left:4px solid #e74c3c;padding:12px 16px;margin-bottom:28px;font-size:15px;color:#555;line-height:1.7}h2{font-size:20px;font-weight:600;color:#c0392b;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid #e74c3c;display:inline-block}.layers{display:flex;gap:16px;margin:16px 0}.layer{cursor:pointer;flex:1;padding:16px;border-radius:12px;text-align:center;font-size:13px;line-height:1.8}.l1{background:#fdf2f2;border:2px solid #e74c3c}.l2{background:#fff0f0;border:2px solid #f1948a}.l3{background:#fff5f5;border:2px solid #f5b7b1}.layer h4{font-size:15px;font-weight:600;color:#c0392b;margin-bottom:4px}.layer .dist{font-size:24px;font-weight:700;color:#e74c3c;margin:8px 0}.layer p{color:#555}.error-cards{display:flex;gap:16px;margin:16px 0}.err-card{flex:1;padding:14px;border-radius:10px;background:#fff5f5;font-size:13px;line-height:1.8}.err-card h4{color:#c0392b;font-size:14px;font-weight:600;margin-bottom:6px}.err-card p{color:#555}.checklist{background:#faf8f5;padding:16px 20px;border-radius:12px;margin:16px 0;font-size:14px;line-height:1.9}.checklist strong{color:#c0392b}.conclusion{background:linear-gradient(135deg,#fdf2f2,#fff5f5);padding:20px 24px;border-radius:8px;margin-top:28px;font-size:14px;color:#555;line-height:1.8}.conclusion strong{color:#c0392b}</style>
      <div class="container"><h1>压纹郁金香：几个要点</h1><div class="meta"><span>来源：小红书</span><span>时长：2分15秒</span><span>类型：技法要点</span></div><div class="tags"><span class="tag">压纹郁金香</span><span class="tag">推纹</span><span class="tag">内卷</span><span class="tag">层次</span></div><div class="summary-line"><strong>一句话总结：</strong>压纹郁金香是边摆动边前推形成的三层层次效果。核心规律是<strong>推距逐层递减</strong>（大→中→小），正确推纹产生<strong>内卷褶皱</strong>而非平直或开裂。常见错误：第一次推太多（开裂）或完全不推（变叶子）。</div>
<h2>三层推纹力度分配</h2>
<div class="layers"><div class="layer l1"><h4>第一层</h4><div class="dist">大</div><p>推最多，距离最远<br/>从中间推到前面较远位置</p></div><div class="layer l2"><h4>第二层</h4><div class="dist">中</div><p>推少一些<br/>从中间推到微量前方</p></div><div class="layer l3"><h4>第三层</h4><div class="dist">小</div><p>推最少<br/>轻微前推即可，收尾</p></div></div>
<h2>两种典型错误</h2>
<div class="error-cards"><div class="err-card"><h4>❌ 第一次推太多</h4><p>第一层就推过头→纹路开裂<br/>后续几层串在一起→图案混乱</p></div><div class="err-card"><h4>❌ 完全不推</h4><p>只摆动不推→变成叶子效果<br/>中间凸出，边缘毛躁<br/>没有内卷褶皱</p></div></div>
<h2>正确效果判定标准</h2>
<div class="checklist"><strong>✅ 好的压纹郁金香：</strong>边缘内卷、有褶皱、层次分明<br/><strong>🔑 关键动作：</strong>边摆边推（摆动+前推同时进行）<br/><strong>📏 推距判断：</strong>不是推得越远越好，而是微量前推——推太多反而开裂<br/><strong>🥛 奶泡影响：</strong>泡太薄→边缘平；泡够厚→边缘圆润饱满</div>
<h2>每层操作流程</h2>
<div class="checklist">每层都是同一个节奏：<strong>放流→边摆边推→断流</strong>，然后开始下一层。层与层之间要断流，不能连在一起倒。每层都从中间位置出发，方向一致向前。</div>
<div class="conclusion"><strong>练功方向：</strong>练习压纹郁金香时，先刻意控制每层的推距——第一层推远、第二层推近、第三层轻点。眼睛重点看<strong>边缘是否有内卷褶皱</strong>，这是判断推纹是否到位的直观标准。如果边缘是平的，说明推的量不够或泡太薄。</div></div>
    </div>
  </foreignObject>
