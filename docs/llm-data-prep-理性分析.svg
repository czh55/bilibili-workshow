.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style>
      
<div class="container">
  <h1>大语言模型原理（1）数据准备</h1>
  <div class="meta">
    <span class="tag tag-blue">大语言模型</span>
    <span class="tag tag-green">数据准备</span>
    <span class="tag tag-orange">Token化</span>
    <span class="tag tag-purple">Embedding</span>
    <span class="tag tag-gray">6:54</span>
  </div>

  <div class="summary-line">
    <strong>一句话核心</strong>：数据准备阶段就是把大量文本，经过<strong>收集清洗 → 分词(Token化) → 嵌入(Embedding)</strong>三个步骤，转化为AI能处理的数字向量。这是大语言模型诞生的第一步，为后续预训练铺路。
  </div>

  <!-- 时间线 -->
  <div class="timeline">
    <h3>内容时间线</h3>
    <div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">开场：大语言模型的三大阶段（数据准备 → 预训练 → 对齐训练）</span></div>
    <div class="timeline-item"><span class="timeline-time">00:39</span><span class="timeline-text"><strong>第一步</strong>：资料收集与清洗 —— 从全网收集网页、书籍、论文、代码，去重去噪过滤敏感信息</span></div>
    <div class="timeline-item"><span class="timeline-time">01:15</span><span class="timeline-text"><strong>第二步</strong>：分词（Token化）—— 训练分词器，建立合并规则和词表，将文本切分为带ID的Token</span></div>
    <div class="timeline-item"><span class="timeline-time">03:23</span><span class="timeline-text"><strong>插播</strong>：为什么AI不能精确控制字数？因为AI按Token生成，不知道Token对应几个字</span></div>
    <div class="timeline-item"><span class="timeline-time">04:25</span><span class="timeline-text"><strong>第三步</strong>：嵌入（Embedding）—— 每个Token转换为高维向量，相似词向量相近</span></div>
    <div class="timeline-item"><span class="timeline-time">06:32</span><span class="timeline-text"><strong>总结</strong>：数据准备全流程回顾，引出下一步预训练</span></div>
  </div>

  <!-- 核心逻辑图 -->
  <div class="map">
    <h2>核心逻辑：从文字到数字的转化链</h2>
    <div class="diagram">
      <div class="node">原始文本<br/><small>网页·书籍·论文·代码</small></div>
      <span class="arrow">→</span>
      <div class="node node-green">清洗后的文本<br/><small>去重·去噪·过滤</small></div>
      <span class="arrow">→</span>
      <div class="node node-orange">Token序列<br/><small>每个Token带ID编号</small></div>
      <span class="arrow">→</span>
      <div class="node node-purple">高维向量<br/><small>上万个小数表示含义</small></div>
    </div>
    <p style="text-align:center;color:#94a3b8;font-size:14px;margin-top:12px">三个步骤层层递进，每一步都为了把"语义"更好地转化为"数字"</p>
  </div>

  <!-- 三步详解 -->
  <div class="section">
    <div class="sec-title">第一步：资料收集与清洗</div>
    <div class="card">
      <h3>收集什么？</h3>
      <p>海量的网页、书籍、论文、代码 —— 构成AI学习的庞大知识库</p>
      <h3 style="margin-top:16px">清洗什么？</h3>
      <table>
        <tr><th>操作</th><th>目的</th></tr>
        <tr><td><strong>去重</strong></td><td>删除重复出现的内容，避免AI学到重复模式</td></tr>
        <tr><td><strong>去噪</strong></td><td>移除没有含义的垃圾数据（乱码、广告等）</td></tr>
        <tr><td><strong>过滤</strong></td><td>剔除敏感与违规信息，确保数据合规</td></tr>
      </table>
      <div class="highlight">数据质量决定模型质量 — 垃圾进，垃圾出（Garbage In, Garbage Out）</div>
    </div>
  </div>

  <div class="section">
    <div class="sec-title">第二步：分词（Token化）</div>

    <div class="card card-green">
      <h3>Token是什么？</h3>
      <p>Token是AI处理文字的<strong>最小单位</strong>。人不就是一个字一个字读吗？不是，AI的"字"叫Token，它可能是一个字，也可能是一串字。</p>
      <div class="example">
        <strong>举例</strong>："我喜欢金毛" → 三个Token：我(1025)、喜欢(2578)、金毛(10871)
      </div>
      <p style="margin-top:12px">GPT等大模型的词表通常有<strong>数十万个</strong>词条，每个Token都有唯一的数字编号。</p>
    </div>

    <div class="card card-green" style="margin-top:16px">
      <h3>分词器（Tokenizer）如何工作？</h3>
      <ol>
        <li><strong>建立合并规则</strong>：阅读大量文本后，发现高频搭配（如"喜欢"总是连在一起出现），就合并成一个Token</li>
        <li><strong>建立词表</strong>：创建一个映射表，包含所有Token和对应的ID编号</li>
      </ol>
      <div class="highlight">为什么需要ID？因为计算机只认识数字，给Token一个ID后，计算机就能"认出"这个文字</div>
    </div>
  </div>

  <div class="section">
    <div class="sec-title">价值洞察：理解了Token，就理解了AI的边界</div>
    <div class="card card-orange">
      <h3>为什么AI不能精确控制字数？</h3>
      <p>当你让AI写一个"100字的短文"，它生成的答案总是<strong>大约100字</strong>，永远做不到精确。</p>
      <div class="highlight">
        <strong>原因</strong>：AI按Token生成，不是按字。每个Token可能对应1个字，也可能对应2个、3个字。AI不知道100个字对应多少个Token，只能估算。所以生成的字数天然就是不确定的。
      </div>
      <div class="quote">
        "我们了解AI底层原理，不是为了像科学家一样研究复杂技术，而是为了知道AI为什么可以做某些事情，<strong>又为什么做不好另外一些事情</strong>，从而更准确高效地使用它。"
      </div>
    </div>
  </div>

  <div class="section">
    <div class="sec-title">第三步：嵌入（Embedding）</div>
    <div class="card card-purple">
      <h3>什么是嵌入？</h3>
      <p>把每个Token转换为一个<strong>高维向量</strong>（一组按顺序排列的数字，如上万个小数），用这组数字来"代表"这个词的全部含义。</p>
      <div class="example">
        <strong>一个词的含义有多丰富？</strong> "喜欢"这个词包含情感方向、强度层次，还和"爱"、"钟意"、"偏好"等词有各种联系。这些复杂含义，只能用大量数字来量化。
      </div>
      <p style="margin-top:12px">GPT这样的大模型，可能把一个"我"字转化为<strong>上万个小数</strong>组成的向量。</p>
    </div>

    <div class="card card-purple" style="margin-top:16px">
      <h3>嵌入的意义：语义的数字化</h3>
      <p>最初这些向量是<strong>随机的</strong>，但经过训练后，数字就会"变得有意义"：</p>
      <table>
        <tr><th>场景</th><th>效果</th></tr>
        <tr><td>"再见" vs "拜拜"</td><td>含义接近 → 训练后两个向量在数值上也<strong>比较接近</strong></td></tr>
        <tr><td>"小猫" vs "小狗"</td><td>都和动物有关 → 向量在<strong>某个维度上</strong>比较接近</td></tr>
      </table>
      <div class="highlight">嵌入的训练目标是：让语义相近的词，在数字空间里也相近。这正是AI"理解"语言的基础。</div>
    </div>
  </div>

  <!-- 三步对比总览 -->
  <div class="section">
    <div class="sec-title">三步对照表</div>
    <table>
      <tr>
        <th>步骤</th>
        <th>输入</th>
        <th>输出</th>
        <th>核心操作</th>
        <th>关键概念</th>
      </tr>
      <tr>
        <td><strong>1. 收集清洗</strong></td>
        <td>全网原始数据</td>
        <td>干净文本库</td>
        <td>去重、去噪、过滤敏感</td>
        <td>数据质量</td>
      </tr>
      <tr>
        <td><strong>2. 分词Token化</strong></td>
        <td>干净文本</td>
        <td>带ID的Token序列</td>
        <td>合并规则 + 词表映射</td>
        <td>Token（最小单位）</td>
      </tr>
      <tr>
        <td><strong>3. 嵌入Embedding</strong></td>
        <td>Token ID序列</td>
        <td>高维向量矩阵</td>
        <td>随机初始化，训练后有意义</td>
        <td>语义的数字表示</td>
      </tr>
    </table>
  </div>

  <!-- 常见误区 -->
  <div class="section">
    <div class="sec-title">常见误解与纠正</div>
    <div class="card card-red">
      <h3>误解1：Token就是一个字</h3>
      <div class="pitfall">❌ 很多人以为AI和人类一样按字处理</div>
      <div class="action">✅ Token是变长的最小语义单元，可能是一个字、两个字、甚至一个英文单词。中文"喜欢"是一个Token，英文"apple"也是一个Token。</div>
    </div>
    <div class="card card-red" style="margin:12px 0">
      <h3>误解2：数据越多越好</h3>
      <div class="pitfall">❌ 有人认为只要喂足够多数据，AI自然就聪明了</div>
      <div class="action">✅ 数据质量比数量更重要。垃圾数据训练出垃圾模型。清洗步骤（去重、去噪、过滤）至关重要。</div>
    </div>
    <div class="card card-red">
      <h3>误解3：嵌入开箱即用</h3>
      <div class="pitfall">❌ 以为给每个词一个向量，它天然就"知道"词的意思</div>
      <div class="action">✅ 嵌入向量最初是随机的，经过预训练（下一步）后才获得语义含义。数据准备只是"搭好了舞台"，真正的"表演"在预训练阶段。</div>
    </div>
  </div>

  <!-- 结论 -->
  <div class="conclusion">
    <h2>总结与行动启示</h2>

    <h3>数据准备三件事</h3>
    <ol>
      <li><strong>收集清洗</strong>：海量文本 → 去重去噪过滤 → 干净语料库</li>
      <li><strong>分词Token化</strong>：文本 → 合并规则+词表 → 带ID的Token序列</li>
      <li><strong>嵌入Embedding</strong>：Token ID → 随机高维向量 → （训练后）语义空间</li>
    </ol>

    <h3>对普通用户的意义</h3>
    <ul>
      <li><strong>接受AI计数不准</strong>：要求精确字数时，别指望AI一次到位</li>
      <li><strong>理解Token限制</strong>：每个模型有上下文窗口（Token数量上限），超长文本需要分段处理</li>
      <li><strong>认知AI能力边界</strong>：了解底层原理不是为了开发模型，而是为了更好地利用AI</li>
    </ul>

    <p style="margin-top:16px;opacity:0.7">下一阶段：预训练 — 这些随机向量如何在训练中"学会"语义？</p>
  </div>

  <a class="source-link" href="http://xhslink.cn/o/5FSQXbAvARN" target="_blank" rel="noopener" style="margin-top:20px">→ 原视频链接（小红书）</a>
</div>
    </div>
  </foreignObject>
</svg>