.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>达芬奇四种画遮罩方法让你强化视频层次</h1>
  <div class="meta"><span class="tag tag-blue">达芬奇</span><span class="tag tag-green">遮罩</span><span class="tag tag-orange">渐变</span><span class="tag tag-purple">差集</span><span class="tag tag-red">大柔化</span><span class="tag tag-gray">时长 8分44秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/4JBGtAH1SIM">原视频</a>
  <div class="summary-line">钢笔精细非首选。四种选区：主体山大遮罩小力、渐变减规则物选天、湖面靠轴心躲开人物、小于目标的大柔化防泛白。力度小+偷懒，才能持续高质量判断。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">精细非首选；HDR 拉开夕阳影调</span></div><div class="timeline-item"><span class="timeline-time">02:20</span><span class="timeline-text">左侧山主体：大遮罩小力加对比</span></div><div class="timeline-item"><span class="timeline-time">03:20</span><span class="timeline-text">渐变选天 − 圆形山差集</span></div><div class="timeline-item"><span class="timeline-time">04:20</span><span class="timeline-text">湖遮罩加对比，轴心躲开腿</span></div><div class="timeline-item"><span class="timeline-time">05:40</span><span class="timeline-text">人物小圈大柔化，防边缘泛白</span></div><div class="timeline-item"><span class="timeline-time">07:00</span><span class="timeline-text">青橙+外观；偷懒为了判断力</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">法一<br/>大范围小力</div><span class="arrow">→</span><div class="node-green">法二<br/>渐变 − 规则物</div><span class="arrow">→</span><div class="node-orange">法三<br/>调整躲开他物</div><span class="arrow">→</span><div class="node-blue">法四<br/>小于目标大柔化</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「制造」校正为「遮罩」；「除买」校正为「曲线」；「中晖」校正为「中灰」；「波感」校正为「波杆」；「限电器/信电器」校正为「限定器」；「抢袭」校正为「抢戏」；「X几」校正为「差集」；「Light/Shadow Serum」校正为「Light/Shadow 色轮」；「强风狗化」校正为「强风格化」；「遮浮」校正为「遮幅」。</p><p>误区：天空不规则就上钢笔。渐变+差集更快。</p><p>误区：遮罩边缘对准目标再大柔化提亮。易外围泛白。</p><p>误区：偷懒不体面。视频主张偷懒换判断力。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-red">
      <h3>精细有时要，但不是默认</h3>
      <p>钱到位可抠细；钱不够没必要。每镜钢笔会把调色做成苦力活。</p>
      <div class="quote">有可能需要，但是它一定不会是首选操作</div>
      <div class="relation">先问性价比，再问精度。</div>
    </div>
    <div class="card card-orange">
      <h3>大遮罩小力：痕迹靠力度藏</h3>
      <p>主体可以是山不是人。范围内不加大力，轴心控好，边缘带一点也看不见。</p>
      <div class="quote">我在每个遮罩范围内的操作都不会做的很大力</div>
      <div class="relation">痕迹来自力度，不只来自边缘。</div>
    </div>
    <div class="card card-green">
      <h3>不规则用「大减小」</h3>
      <p>天空用渐变符合衰减；挡道的规则山用圆差集剪掉。天空要比山暗，别抢戏。</p>
      <div class="quote">用大范围遮罩减去小范围规则物体的遮罩的方式，来快速选择不规则的物体</div>
      <div class="relation">谁被剪，就点谁的差集。</div>
    </div>
    <div class="card ">
      <h3>避不开就让调整不影响</h3>
      <p>湖与人交叉时，不必先死磕限定器：遮罩加对比后改轴心，腿上几乎无痕。</p>
      <div class="quote">想办法让你的调整不影响其他的物体</div>
      <div class="relation">工具服务于结果，不服务于仪式感。</div>
    </div>
    <div class="card card-purple">
      <h3>小圈大柔：防泛白</h3>
      <p>遮罩小于要调区域并保持大柔化再提亮，外围不受影响。柔化圈也要纳入范围意识。</p>
      <div class="quote">遮罩给它缩小，让它小于要调整的内容，同时保持柔化开的相对比较大</div>
      <div class="relation">看的不只是中间圈，还有柔化外圈。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>夕阳山湖案例的主次判断是作者观点，换片需重判主体。</li><li>参数与波杆位置需按自己波形调整。</li><li>电影感外观与遮幅为可选风格层。</li><li>引流与三连话术不展开。</li></ul><div class="pitfall">默认钢笔抠天空与限定器抠湖，耗尽精力。</div><div class="pitfall">天空调太亮抢走山体主体。</div><div class="pitfall">人物遮罩边缘压在轮廓上再大柔化猛提，一圈泛白。</div><div class="pitfall">遮罩范围内加对比过大，痕迹立刻露馅。</div><div class="pitfall">把偷懒当成偷工，重复劳动导致排斥调色。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>四种遮罩套路覆盖多数局部强化</li><li>力度小是隐痕关键</li><li>不规则＝大范围减规则</li><li>偷懒是为了保住判断力</li></ul><h3>行动清单</h3><ol><li>先 HDR 把夕阳影调拉开再谈遮罩</li><li>主体用大遮罩小力；天空渐变减山</li><li>交叉物体优先轴心/范围策略</li><li>提亮人物：遮罩小于目标 + 大柔化</li><li>颜色与外观放在分区之后</li></ol><h3>关键认知转变</h3><p>以前：遮罩＝精细抠像；现在：遮罩＝性价比选区，四种套路轮换。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 8分44秒</div>
</div>
    </div>
  </foreignObject>
</svg>