.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style><div class="container">
<h1>蝶泳腿教学来咯 简简单单</h1>
<div class="meta">
<span class="tag tag-blue">游泳</span><span class="tag tag-green">蝶泳</span><span class="tag tag-orange">海豚腿</span><span class="tag tag-gray">0:20</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>蝶泳腿（海豚腿）两步走：①<strong>小腿往下压，顺势把上半身上抬</strong>——先重复几遍找感觉；②用<strong>腿末段的力量支撑起整个身体</strong>——最后连起来。重点在“小腿下压带动身体起伏”，不是膝盖主动弯。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">今天教你蝶泳腿，Ready?</span></div><div class="timeline-item"><span class="timeline-time">00:02</span><span class="timeline-text">第一步：小腿往下压，顺势将上半身上抬</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">先重复几遍找找感觉</span></div><div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">第二步：再用腿末段的力量支撑起整个身体</span></div><div class="timeline-item"><span class="timeline-time">00:13</span><span class="timeline-text">最后连起来就行了</span></div><div class="timeline-item"><span class="timeline-time">00:14</span><span class="timeline-text">学废了吗？</span></div></div>
<div class='section'><div class='sec-title'>蝶泳腿核心：海豚式打腿</div><div class='diagram'><div class='node'>小腿往下压</div><span class='arrow'>→</span><div class='node'>上半身上抬</div><span class='arrow'>→</span><div class='node'>身体呈波浪起伏</div><span class='arrow'>→</span><div class='node node-green'>腿末段力量撑全身</div></div></div><div class='section'><div class='sec-title'>两步教学</div><div class='card'><h3>第一步：找感觉</h3><p><strong>先把小腿往下压</strong>，<strong>顺势将上半身上抬</strong>——这一步练的是“腿带身”的联动，先<strong>重复几遍找找感觉</strong>，别急着加力量。</p></div><div class='card card-green' style='margin:12px 0'><h3>第二步：撑起身体</h3><p>再逐步用<strong>腿末段的力量</strong>（脚踝一带，不是大腿发力）<strong>支撑起整个身体</strong>——把第一步的感觉放大，让整个身体跟着腿做波浪起伏。</p></div><div class='card card-orange'><h3>最后：连起来</h3><p>把两步连起来就是完整的海豚打腿：<strong>小腿下压 → 上身抬起 → 腿末段发力 → 波浪传递</strong>。动作是连续的、有弹性的，不是一节一节的。</p></div></div>
<div class="conclusion">
<h2>蝶泳腿练习清单</h2>
<h3>练习步骤</h3><ol><li><strong>扶板/原地练</strong>：反复做“小腿下压+上身上抬”，找到波浪感</li><li><strong>重点在脚踝</strong>：发力靠腿末段（脚踝弹性），不是膝盖或大腿</li><li><strong>从慢到快</strong>：先慢速找感觉，再逐渐提速连贯</li></ol><h3>常见错误</h3><ul><li><strong>膝盖弯太大</strong>：应该小腿下压带波浪，不是小腿后踢</li><li><strong>上身僵硬</strong>：上半身要顺势抬起，跟着波浪走</li><li><strong>一段一段发力</strong>：打腿是连续弹性传递，不是停顿发力</li></ul>
</div>
