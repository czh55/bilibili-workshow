      <div class="container root-wrap">
  <h1>完美侧脸：圆＋三庭脚手架</h1>
  <div class="meta"><span class="tag tag-blue">侧面</span><span class="tag tag-green">三庭</span><span class="tag tag-orange">比例</span><span class="tag tag-purple">下颌角</span><span class="tag tag-red">校验线</span><span class="tag tag-gray">时长 122秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/9eDOAkIeOlI">原视频</a>
  <div class="summary-line">侧面难看多因比例：大圆头颅＋小圆（约大圆6/4直径）分三庭→下颌角；眼在中庭1/4、下唇在下庭1/2；侧面眼斜∥鼻下巴斜。用眼嘴线⊥眼耳线定宽，耳垂中线定颈。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">五官好仍难看＝比例问题</span></div><div class="timeline-item"><span class="timeline-time">00:10</span><span class="timeline-text">大圆头颅＋过心垂直线</span></div><div class="timeline-item"><span class="timeline-time">00:16</span><span class="timeline-text">小圆六分之四→三庭</span></div><div class="timeline-item"><span class="timeline-time">00:36</span><span class="timeline-text">耳在中庭，连下颌角</span></div><div class="timeline-item"><span class="timeline-time">00:48</span><span class="timeline-text">眼／嘴位点</span></div><div class="timeline-item"><span class="timeline-time">01:00</span><span class="timeline-text">眼斜∥鼻下巴斜</span></div><div class="timeline-item"><span class="timeline-time">01:41</span><span class="timeline-text">垂直校验定宽＋颈</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">架<br/>圆＋三庭</div><span class="arrow">→</span><div class="node-green">点<br/>眼嘴位点</div><span class="arrow">→</span><div class="node-orange">形<br/>平行斜线</div><span class="arrow">→</span><div class="node-blue">验<br/>垂直双线</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「一眼难尽／并角／耳窝」→「一眼难看／鬓角／耳蜗」。</p><p>误区：侧面脸廓画成垂直。视频强调平视略往里收。</p><p>误区：先抠五官再补比例。顺序相反。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>先立圆与三庭</h3>
      <p>大圆＝头颅；小圆直径约占大圆六分之四，等距分上中下三庭——侧面比例的脚手架。</p>
      <div class="quote">这个小圆直径占大圆的六分之四……等间距分出上中下三亭</div>
      <div class="relation">没有架，五官无处安放。</div>
    </div>
    <div class="card card-orange">
      <h3>位点公式</h3>
      <p>眼在中庭四分之一；下唇线在下庭二分之一；耳在中庭。</p>
      <div class="quote">眼睛的位置……在中庭的四分之一处……下庭的二分之一处是下唇线</div>
      <div class="relation">位点是比例语言，不是感觉。</div>
    </div>
    <div class="card card-red">
      <h3>垂直校验定宽</h3>
      <p>眼角—嘴角连线与眼角—耳蜗线互相垂直，用来确定眼嘴宽度；耳垂中线定脖子方向粗细。</p>
      <div class="quote">眼角和嘴角的连线……和眼角到耳窝的这条线……两者是垂直线</div>
      <div class="relation">校验线比「再看看」可靠。</div>
    </div>
    <div class="card card-purple">
      <h3>侧面形的平行</h3>
      <p>侧面眼睛倾斜趋势与鼻头到下巴斜线基本平行；头发有厚度要略大于圆。</p>
      <div class="quote">侧面的眼睛也是一个倾斜的趋势，和鼻头到下巴的斜线基本是平行的</div>
      <div class="relation">形的趋势比单点更重要。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>立刻默写</p>
      <div class="quote">脚手架画完就默写侧面头像——学完要动手。</div>
      <div class="relation">你学会了吗，那就动笔试试吧</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>122 秒侧面比例示范，非全面五官课。</li><li>「六分之四」为教学简化比例。</li><li>平视收脸轮廓，其他视角需迁移。</li></ul><div class="pitfall">脸廓画成垂直墙。</div><div class="pitfall">眼嘴位置凭感觉漂。</div><div class="pitfall">忽略眼—耳垂直校验导致宽窄失控。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>圆＋三庭先立</li><li>眼嘴有位点</li><li>垂直线定宽定颈</li></ul><h3>行动清单</h3><ol><li>只画大圆小圆三庭停笔检查</li><li>标眼1/4与下唇1/2</li><li>画眼斜∥鼻下巴斜</li><li>加垂直双线校验宽度</li></ol><h3>关键认知转变</h3><p>以前：侧面靠感觉修五官；现在：先脚手架再位点——难看多半是比例，不是眼神。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 122秒</div>
</div>
    </div>
  </foreignObject>
</svg>