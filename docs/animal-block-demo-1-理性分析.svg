      <div class="container root-wrap">
  <h1>雪豹体块：双立方头</h1>
  <div class="meta"><span class="tag tag-blue">雪豹</span><span class="tag tag-green">立方体</span><span class="tag tag-orange">中线</span><span class="tag tag-purple">斑点</span><span class="tag tag-red">换角</span><span class="tag tag-gray">时长 94秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/4xoStZEGGMX">原视频</a>
  <div class="summary-line">雪豹头＝两套立方体，颅顶与鼻梁中线不平行；颈圆柱透视压短；前肢长方体、腰圆柱、尾结构线接臀。细画大胆严谨、收放分明；斑点贴结构有规律。换角再练＋甩尾更生动。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">雪豹／功夫熊猫梗</span></div><div class="timeline-item"><span class="timeline-time">00:13</span><span class="timeline-text">头＝两套立方体</span></div><div class="timeline-item"><span class="timeline-time">00:17</span><span class="timeline-text">中线不平行</span></div><div class="timeline-item"><span class="timeline-time">00:26</span><span class="timeline-text">前肢长方体＋腰圆柱</span></div><div class="timeline-item"><span class="timeline-time">00:33</span><span class="timeline-text">尾结构线</span></div><div class="timeline-item"><span class="timeline-time">00:42</span><span class="timeline-text">细画不慌</span></div><div class="timeline-item"><span class="timeline-time">01:00</span><span class="timeline-text">斑点贴结构</span></div><div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">换角再练</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">头<br/>双立方</div><span class="arrow">→</span><div class="node-green">身<br/>柱／方</div><span class="arrow">→</span><div class="node-orange">纹<br/>贴结构</div><span class="arrow">→</span><div class="node-blue">练<br/>换角</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>繁体转简；「鉤斧熊猫／几何龟／大大而严峻／快面／写报」→「功夫熊猫／几何形／大胆而严谨／宽面／雪豹」。</p><p>误区：头中线处处平行。本角度明确不平行。</p><p>误区：斑点平面盖章。要求贴合结构走向。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>头＝嵌套立方体</h3>
      <p>两个套在一起的立方体起头；并承认颅顶与鼻梁中线可以不平行。</p>
      <div class="quote">先把头看成两个套在一起的立方体……中线并不是平行的</div>
      <div class="relation">体块允许「拧」。</div>
    </div>
    <div class="card card-orange">
      <h3>尾线接臀</h3>
      <p>粗壮尾巴中间结构线画准，才能和屁股体块自然连接。</p>
      <div class="quote">尾巴中间有一条极重要的结构线……才能和屁股的体块自然的连接</div>
      <div class="relation">连接处比中间装饰重要。</div>
    </div>
    <div class="card card-red">
      <h3>斑点有规律</h3>
      <p>斑点贴合身体结构，大小分布与走向都有规律——不是随机撒点。</p>
      <div class="quote">斑点要注意贴合身体的结构来画……都是有它的规律在里面的</div>
      <div class="relation">花纹服从体块。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>换角加压</p>
      <div class="quote">类似角度再画一张更凶的，并想象甩尾增加生动。</div>
      <div class="relation">再练习一张</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>94 秒雪豹示范。</li><li>电影角色梗仅开场。</li><li>体块为简化教学。</li></ul><div class="pitfall">头画成单一圆球。</div><div class="pitfall">脖子无视透视压短。</div><div class="pitfall">斑点大小均匀无走向。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>双立方起头</li><li>结构线接部件</li><li>斑点贴体块</li></ul><h3>行动清单</h3><ol><li>只画两立方＋不平行中线</li><li>标尾中结构线接臀</li><li>斑点沿体块分大中小</li><li>换角重画同一清单</li></ol><h3>关键认知转变</h3><p>以前：猛兽靠花纹吓人；现在：立方体拧紧了，斑点才吓得住人。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 94秒</div>
</div>
    </div>
  </foreignObject>
</svg>