.correction h3,.correction p{color:#92400e}
.section{margin-bottom:32px}
.sec-title{font-size:22px;font-weight:700;color:#1e40af;margin-bottom:16px;padding-left:16px;border-left:4px solid #3b82f6}
.card{background:#fff;border-radius:16px;padding:32px;margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.06);border-left:5px solid #3b82f6}
.card.card-green{border-left-color:#10b981}
.card.card-orange{border-left-color:#f59e0b}
.card.card-purple{border-left-color:#8b5cf6}
.card.card-red{border-left-color:#ef4444}
.card.card-blue{border-left-color:#3b82f6}
.card h3{font-size:20px;font-weight:700;color:#1e40af;margin-bottom:12px}
.card .highlight{background:#fef3c7;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#92400e;border-left:4px solid #f59e0b}
.card .quote{background:#f8fafc;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#64748b;border-left:4px solid #cbd5e1;font-style:italic}
.card .relation{background:#f0fdf4;padding:10px 14px;border-radius:10px;margin:8px 0;font-size:14px;color:#166534}
.card .pitfall{background:#fef2f2;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#991b1b;border-left:4px solid #ef4444}
.card .action,.card .insight{background:#eff6ff;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#1e40af;border-left:4px solid #3b82f6}
.speaker{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:12px;margin-right:8px}
.speaker-host{background:#dbeafe;color:#1e40af}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}
th{background:#f1f5f9;padding:12px 16px;text-align:left;font-weight:700;color:#1e40af;border-bottom:2px solid #cbd5e1}
td{padding:12px 16px;border-bottom:1px solid #e2e8f0;color:#475569;vertical-align:top}
tr:nth-child(even) td{background:#fafbfc}
.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:36px;margin-top:32px}
.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>四大留白技巧</h1>
  <div class="meta"><span class="tag tag-blue">留白技巧</span><span class="tag tag-green">典型信息</span><span class="tag tag-orange">白形</span><span class="tag tag-purple">引导</span><span class="tag tag-red">节奏</span><span class="tag tag-gray">时长 170秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/3eFlkPnS4J0">原视频</a>
  <div class="summary-line">四招：只留最典型信息；用空白激发想象；用白形引导焦点；用白形注入黑白灰节奏。沉闷时删细节、主动留白形。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:04</span><span class="timeline-text">四大技巧</span></div><div class="timeline-item"><span class="timeline-time">00:14</span><span class="timeline-text">侧脸典型信息</span></div><div class="timeline-item"><span class="timeline-time">00:47</span><span class="timeline-text">徽派删细节</span></div><div class="timeline-item"><span class="timeline-time">01:08</span><span class="timeline-text">空白矩形想象</span></div><div class="timeline-item"><span class="timeline-time">01:27</span><span class="timeline-text">遮挡身体留半脸</span></div><div class="timeline-item"><span class="timeline-time">01:48</span><span class="timeline-text">桥面白形引导</span></div><div class="timeline-item"><span class="timeline-time">02:13</span><span class="timeline-text">白块衣袜节奏</span></div><div class="timeline-item"><span class="timeline-time">02:27</span><span class="timeline-text">沉闷就留白形</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">删<br/>到典型为止</div><span class="arrow">→</span><div class="node-green">藏<br/>激发想象</div><span class="arrow">→</span><div class="node-orange">引<br/>白形路径</div><span class="arrow">→</span><div class="node-blue">跳<br/>白块节奏</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「低谋／灰派／白行」→「低眉／徽派／白形」。</p><p>误区：留白只能大面积空江。白形也可是衣块桥面。</p><p>误区：删细节＝偷工。是信息优先级。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>典型信息</h3>
      <p>侧脸轮廓已够亲密；青瓦识别徽派即可。</p>
      <div class="quote">保留最典型信息其余大胆留白</div>
      <div class="relation">识别任务完成即可停手。</div>
    </div>
    <div class="card card-orange">
      <h3>激发想象</h3>
      <p>无细节矩形／遮挡身体，把故事交给观众。</p>
      <div class="quote">留给观众无限的遐想空间</div>
      <div class="relation">空白是叙事接口。</div>
    </div>
    <div class="card card-red">
      <h3>白形引导</h3>
      <p>桥面形状＋镂空留白把视线送向行人。</p>
      <div class="quote">留白在助力画面视觉引导上起到了关键作用</div>
      <div class="relation">空也可以是箭头。</div>
    </div>
    <div class="card card-purple">
      <h3>白形节奏</h3>
      <p>衣袜改白块，配黑发皮鞋灰裤立刻明快。</p>
      <div class="quote">产生了轻松明快的视觉节奏感</div>
      <div class="relation">白是节奏里的休止符／强音。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>沉闷就删细节留白形</p>
      <div class="quote">看看画面会不会马上变得舒服起来</div>
      <div class="relation">可立即试的急救</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>170 秒技巧速览。</li><li>系统训练指向形式美构成课。</li><li>「四个」与上期「作用分类」互补，非互相取代。</li></ul><div class="pitfall">删掉典型信息导致不可识别。</div><div class="pitfall">空白无形状，既不引导也不成节奏。</div><div class="pitfall">只在国画留白，插画摄影不敢用。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>删到典型</li><li>空可叙事</li><li>白形可引导可节奏</li></ul><h3>行动清单</h3><ol><li>肖像练习：只留侧脸轮廓一版</li><li>摄影：识别建筑后删天空墙面细节</li><li>沉闷稿主动切出两块白形看节奏</li><li>禁止把留白理解成「什么都不画的角落」</li></ol><h3>关键认知转变</h3><p>以前：不敢空；现在：空要完成识别、想象、引导或节奏中的至少一项。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 170秒</div>
</div>
    </div>
  </foreignObject>
</svg>