<div class="svg-page">
  <div class="container">
    <h1>只谈做工不谈价格的都是在“耍流氓”</h1>
    <div class="meta">
      <span class="tag tag-blue">小红书</span>
      <span class="tag tag-green">52 秒</span>
      <span class="tag tag-purple">买衣技巧</span>
      <span class="tag tag-orange">价位做工</span>
      <span class="tag tag-gray">理性分析视角</span>
    </div>
    <a class="source-link" href="http://xhslink.cn/o/8RBIhcVMeYc">原视频：xhslink.cn/o/8RBIhcVMeYc</a>
    <div class="summary-line"><strong>核心判断：</strong>视频主张价位必须配得上做工，并把验货压成三条可现场动作——看领口挂架形态、避开堆领抽褶、用手抻螺纹测秒回弹。它对 109 / 129 / 299 的“不值”判断是主讲人立场，不是跨品牌耐穿实验。</div>

    <div class="timeline">
      <h3>关键证据时间轴</h3>
      <div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">叠字“109 不值 / 129 不值”，价签出现 RMB 129。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:03</span><span class="timeline-text">“299 更不值”，叠穿抽褶款打上警告三角。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:05</span><span class="timeline-text">转入 T 恤领口：挂架上应微微翘起。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:09</span><span class="timeline-text">反例：领口趴在衣架上，穿上也容易不服帖。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">抽碎褶领口被判夏天别买，称视觉上胖二十斤。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:22</span><span class="timeline-text">ZARA 价签 RMB 299：叠字“39 都别买”。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">指出同样是二本针，变形关键在螺纹好坏。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:33</span><span class="timeline-text">买前用手抻两下；轻撑即变形，推断洗 3-5 次必变形。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:44</span><span class="timeline-text">回评 109 不值，不如地摊 39；收尾要求秒回弹。</span></div>
    </div>

    <div class="map">
      <h2>核心脉络</h2>
      <div class="diagram">
        <div class="node">问题<br/><span class="small">价位是否配得上<br/>做工质量</span></div>
        <div class="arrow">→</div>
        <div class="node">证据<br/><span class="small">挂架形态 / 抽褶<br/>螺纹回弹 / 价签</span></div>
        <div class="arrow">→</div>
        <div class="node node-orange">判断<br/><span class="small">虚高价不值<br/>要秒回弹</span></div>
        <div class="arrow">→</div>
        <div class="node node-green">行动<br/><span class="small">店内三步手测<br/>再决定买单</span></div>
      </div>
    </div>

    <div class="correction">
      <h3>常见误解与认知纠偏</h3>
      <p><strong>误解：</strong>“只谈做工就够了，价格不重要。”</p>
      <p><strong>纠偏：</strong>视频标题把价格拉回决策——同样差的领口/螺纹，卖 39 与卖 299 的代价不同；做工信号要和价签一起看。</p>
      <p><strong>误解：</strong>“有二本针就等于耐洗不变形。”</p>
      <p><strong>纠偏：</strong>主讲人明确：二本针只是缝法之一，螺纹回弹差仍会变形；关键动作是抻两下看是否秒回。</p>
    </div>

    <div class="section">
      <h2 class="sec-title">观点拆解</h2>

      <div class="card">
        <h3>1. 价签先定性：109 / 129 / 299 被判不值</h3>
        <p class="label">在讲什么</p>
        <p>用叠字与价签特写，先建立“这个价不配这个货”的情绪框架。</p>
        <p class="label">关键理解</p>
        <p>数字本身是画面事实；“不值/更不值/39 都别买”是价值判断，证据强弱取决于后续做工演示是否支撑。</p>
        <div class="quote">原文依据：叠字“109 不值”“129 不值”“299 更不值”；ZARA 标价 RMB 299；“还 299 呢，39 都别买”。</div>
        <div class="insight">怎么用：先看价签与目标预算，再决定要不要投入做工检查时间；高价差货优先一票否决。</div>
      </div>

      <div class="card card-green">
        <h3>2. 领口挂架形态：翘起可选，趴着慎选</h3>
        <p class="label">在讲什么</p>
        <p>把衣架上的领口形态当作预览：有支撑感的微翘优于软趴。</p>
        <p class="label">关键理解</p>
        <p>这是可观察的结构信号，不是面料成分证明；适合店内快速筛，不能替代上身试穿。</p>
        <div class="quote">原文依据：“像这边它挂在衣架上是这种翘起来的，而不是像这种趴在衣架上的……穿到身上多半也是这样翘起来的。”</div>
        <div class="action">怎么用：进店先扫一排挂架领口；软趴塌领优先跳过，再对手测回弹。</div>
      </div>

      <div class="card card-orange">
        <h3>3. 抽褶堆领：视觉增重 + 高价双重避雷</h3>
        <p class="label">在讲什么</p>
        <p>密密抽碎褶被主讲人认定为夏天显胖款，并与 299 价签绑定成“连 39 都别买”。</p>
        <p class="label">关键理解</p>
        <p>“胖二十斤”是夸张修辞与个人审美，不是测量结果；真正可迁移的是：堆领装饰会增加胸口体积感，价高时更需警惕。</p>
        <div class="pitfall">避坑：别把主观显胖断言当成所有体型的普遍定律；若喜欢该廓形，仍应用挂架与螺纹测试核对做工。</div>
        <div class="quote">原文依据：“领口上全是这种抽碎褶的，夏天千万别买……原地视觉上胖 20 斤不止……还 299 呢，39 都别买。”</div>
      </div>

      <div class="card card-purple">
        <h3>4. 螺纹回弹：二本针不够，秒回弹才算数</h3>
        <p class="label">在讲什么</p>
        <p>后期变形的关键卡在螺纹弹性；买前抻两下，轻撑变形则推断洗 3-5 次必坏。</p>
        <p class="label">关键理解</p>
        <p>“洗 3-5 次必变形”是基于回弹差的推断，视频未做洗涤对照实验。可验证部分是：当场回弹差 → 风险更高。</p>
        <div class="quote">原文依据：“明明我的 T 恤也是二本针……问题就出现在这个螺纹上……一定要用手这样抻两下……去选这种秒回弹的。”</div>
        <div class="relation">关系：二本针（缝法）≠ 螺纹回弹（弹性）≠ 价签数字（定价）；三者要分开核对。</div>
        <div class="action">怎么用：横向/纵向轻抻领口 2 次，松手观察是否瞬间复原；不复原则降优先级。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">横向对比：价位信号与做工信号</h2>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>检查项</th>
              <th>视频中的负向信号</th>
              <th>视频中的正向信号</th>
              <th>证据类型</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>价签</td>
              <td>109 / 129 / 299 被判不值</td>
              <td>未给出“值得买”的具体价位</td>
              <td>画面事实 + 观点</td>
            </tr>
            <tr>
              <td>挂架领口</td>
              <td>软趴贴在衣架上</td>
              <td>微微翘起、有支撑</td>
              <td>可观察事实</td>
            </tr>
            <tr>
              <td>领口造型</td>
              <td>抽碎褶堆领（显胖避雷）</td>
              <td>未展开其他造型推荐</td>
              <td>观点为主</td>
            </tr>
            <tr>
              <td>缝法</td>
              <td>仅有二本针仍可能变形</td>
              <td>二本针本身不是否决项</td>
              <td>观点 + 演示</td>
            </tr>
            <tr>
              <td>螺纹</td>
              <td>轻撑即变形、回弹差</td>
              <td>秒回弹、撑多少次都回</td>
              <td>可复现手测</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">方法边界与立场分层</h2>
      <div class="card">
        <div class="stance-grid">
          <div class="stance-item">
            <strong>可验证事实</strong>
            价签出现 RMB 129、RMB 299；领口可被拉开观察；画面演示回弹差异。
          </div>
          <div class="stance-item">
            <strong>UP 主观点</strong>
            “不值 / 更不值 / 39 都别买 / 胖二十斤 / 不如地摊 39”。
          </div>
          <div class="stance-item">
            <strong>基于原文的推断</strong>
            回弹差 → 洗 3-5 次易变形；价高且做工差 → 优先跳过。
          </div>
        </div>
        <div class="highlight" style="margin-top:16px">适用边界：适合店内快速筛 T 恤/螺纹领口类成衣；不覆盖面料成分、缩水率、跨季节耐穿，也不构成对优衣库 / H&amp;M / ZARA 的品牌总评。</div>
      </div>
    </div>

    <div class="conclusion">
      <h2>总结与行动</h2>
      <h3>核心要点</h3>
      <ul>
        <li>价格与做工要一起谈：高价差货比低价差货更亏。</li>
        <li>挂架领口形态是第一道可见筛：翘起优于趴塌。</li>
        <li>二本针不够，螺纹秒回弹才是耐形关键手测。</li>
      </ul>
      <h3>行动清单</h3>
      <ol>
        <li>先看价签，明确预算与“不值”阈值。</li>
        <li>扫挂架：领口软趴的先跳过。</li>
        <li>对候选款抻螺纹两次，只要秒回弹。</li>
        <li>堆领抽褶按个人显瘦目标谨慎，不盲从夸张断言。</li>
        <li>高价且回弹差：优先一票否决，另找替代。</li>
      </ol>
      <h3>关键认知转变</h3>
      <p>从“只谈做工”转向“价位必须配得上可手测的做工信号”；把情绪化的“不值”落成挂架观察 + 螺纹回弹两步动作。</p>
    </div>

    <p class="footer">双轨产物之二 · 理性分析 · 基于可见字幕与画面证据 · Whisper 原始分段另见 HTML 转录区</p>
  </div>
</div>

    </div>
  </foreignObject>
</svg>