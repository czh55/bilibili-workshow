<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="4800" viewBox="0 0 1320 4800">
  <foreignObject x="0" y="0" width="1320" height="4800">
    <div xmlns="http://www.w3.org/1999/xhtml"><style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}
.container{max-width:1200px;margin:0 auto}
h1{font-size:36px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h2{font-size:26px;font-weight:700;color:#1e40af;margin:32px 0 16px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
h3{font-size:20px;font-weight:700;color:#334155;margin-bottom:12px}
p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}
ul,ol{padding-left:24px;margin:8px 0}li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:6px}
.tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}
.tag-blue{background:#dbeafe;color:#1e40af}.tag-green{background:#d1fae5;color:#065f46}
.tag-orange{background:#ffedd5;color:#9a3412}.tag-purple{background:#ede9fe;color:#6b21a8}
.tag-red{background:#fef2f2;color:#991b1b}.tag-gray{background:#f1f5f9;color:#64748b}
.meta{margin:12px 0 20px}
.summary-line{font-size:18px;line-height:1.7;color:#334155;padding:20px 24px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline{background:#fff;border-radius:16px;padding:24px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline h3{color:#1e40af;margin-bottom:12px}
.timeline-item{display:flex;align-items:baseline;padding:8px 0;border-bottom:1px solid #f1f5f9}
.timeline-time{font-size:14px;font-weight:700;color:#3b82f6;min-width:70px;font-variant-numeric:tabular-nums}
.timeline-text{font-size:15px;color:#475569}
.map{background:#fff;border-radius:20px;padding:36px;margin-bottom:28px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.map h2{font-size:24px;margin-top:0;border-bottom:none;padding-bottom:0}
.diagram{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:20px 0}
.node{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:16px;padding:20px 28px;text-align:center;min-width:140px;font-weight:700;font-size:15px;color:#1e40af}
.node-green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}
.node-orange{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}
.node-purple{background:linear-gradient(135deg,#faf5ff,#ede9fe);border-color:#c4b5fd;color:#6b21a8}
.node-red{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-color:#fca5a5;color:#991b1b}
.arrow{font-size:22px;color:#94a3b8}
.section{margin-bottom:32px}
.sec-title{font-size:22px;font-weight:700;color:#1e40af;margin-bottom:16px;padding-left:16px;border-left:4px solid #3b82f6}
.card{background:#fff;border-radius:16px;padding:32px;margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.06);border-left:5px solid #3b82f6}
.card.card-green{border-left-color:#10b981}.card.card-orange{border-left-color:#f59e0b}
.card.card-purple{border-left-color:#8b5cf6}.card.card-red{border-left-color:#ef4444}
.card h3{font-size:20px;font-weight:700;color:#1e40af;margin-bottom:12px}
.card .highlight{background:#fef3c7;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#92400e;border-left:4px solid #f59e0b}
.card .formula{background:#1e293b;color:#e2e8f0;padding:16px 20px;border-radius:10px;margin:12px 0;font-size:17px;font-family:"SF Mono","Menlo",monospace;text-align:center}
.card .quote{background:#f8fafc;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#64748b;border-left:4px solid #cbd5e1;font-style:italic}
.card .example{background:#f0fdf4;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#065f46;border-left:4px solid #10b981}
.card .pitfall{background:#fef2f2;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#991b1b;border-left:4px solid #ef4444}
.card .action{background:#eff6ff;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#1e40af;border-left:4px solid #3b82f6}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}
th{background:#f1f5f9;padding:12px 16px;text-align:left;font-weight:700;color:#1e40af;border-bottom:2px solid #cbd5e1}
td{padding:12px 16px;border-bottom:1px solid #e2e8f0;color:#475569;vertical-align:top}
tr:nth-child(even) td{background:#fafbfc}
.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:36px;margin-top:32px}
.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style><div class="container">
<h1>平时练的时候就容易鼓肚子，记得这样操作❗</h1>
<div class="meta">
<span class="tag tag-blue">核心训练</span><span class="tag tag-green">腹肌</span><span class="tag tag-orange">瑜伽小球</span><span class="tag tag-gray">0:24</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>仰卧抬腿<strong>腹部明显隆起</strong>？请停止——<strong>没练到腹，大概率腰也在代偿</strong>。正确做法：用<strong>瑜伽小球垫高腰底</strong>，<strong>呼气先收紧腹部</strong>（摸起来硬硬的）并一直保持，在这个基础上<strong>抬腿呼气、下落吸气</strong>。对改善<strong>腹直肌分离、悬垂腹、腹内压过大</strong>都很有效。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">仰卧抬腿动作时，腹部明显隆起</span></div><div class="timeline-item"><span class="timeline-time">00:03</span><span class="timeline-text">像这种请停止</span></div><div class="timeline-item"><span class="timeline-time">00:05</span><span class="timeline-text">没练到腹，大概率腰也是代偿的</span></div><div class="timeline-item"><span class="timeline-time">00:07</span><span class="timeline-text">用一个瑜伽小球垫高腰底</span></div><div class="timeline-item"><span class="timeline-time">00:10</span><span class="timeline-text">呼气，先收紧腹部，摸起来是硬硬的</span></div><div class="timeline-item"><span class="timeline-time">00:14</span><span class="timeline-text">一直保持，在这个基础上做抬腿</span></div><div class="timeline-item"><span class="timeline-time">00:17</span><span class="timeline-text">抬腿呼气，下落吸气</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">改善腹直肌分离、悬垂腹、腹内压过大</span></div></div>
<div class='section'><div class='sec-title'>鼓肚子 = 白练 + 伤腰</div><div class='diagram'><div class='node node-red'>仰卧抬腿<br/><small>腹部隆起</small></div><span class='arrow'>→</span><div class='node node-red'>没练到腹<br/><small>腰在代偿</small></div><span class='arrow'>→</span><div class='node node-green'>瑜伽小球垫腰<br/><small>呼气收腹再动</small></div></div></div><div class='section'><div class='sec-title'>正确操作三步</div><div class='card'><h3>① 垫高腰底</h3><p>用<strong>瑜伽小球</strong>垫在腰底，给腰部支撑，避免腰代偿发力。</p></div><div class='card card-green' style='margin:12px 0'><h3>② 呼气收腹</h3><p><strong>呼气，先收紧腹部</strong>，收完<strong>摸起来是硬硬的</strong>——腹肌真正发力了。</p></div><div class='card card-orange' style='margin:12px 0'><h3>③ 保持收腹做动作</h3><p>腹部<strong>一直保持收紧</strong>，在这个基础上做抬腿——<strong>抬腿呼气，下落吸气</strong>，全程不松腹。</p></div></div>
<div class="conclusion">
<h2>动作要点清单</h2>
<h3>一句话记牢</h3><ul><li>抬腿<strong>鼓肚子</strong>=没练到腹+腰代偿，<strong>立即停止</strong></li><li>瑜伽小球<strong>垫高腰底</strong>，把腰稳住</li><li><strong>呼气收紧腹部</strong>，摸起来硬硬的再动腿</li><li>抬腿<strong>呼气</strong>，下落<strong>吸气</strong>，全程保持收腹</li></ul><h3>适合人群</h3><ul><li>腹直肌分离</li><li>悬垂腹</li><li>腹内压过大</li></ul>
</div>
