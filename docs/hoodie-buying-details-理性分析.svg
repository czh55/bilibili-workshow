<div class="svg-page">
  <div class="container">
    <h1>卫衣验货：把“全面指南”拆成可摸的结构关卡</h1>
    <div class="meta">
      <span class="tag tag-blue">小红书</span>
      <span class="tag tag-green">3分40秒</span>
      <span class="tag tag-purple">穿搭</span>
      <span class="tag tag-orange">买衣技巧</span>
      <span class="tag tag-gray">理性分析</span>
    </div>
    <a class="source-link" href="http://xhslink.cn/o/AN6Q6X4965m">原视频：最全卫衣购买小细节</a>
    <div class="summary-line">
      <strong>核心判断：</strong>视频真正回答的不是“哪件卫衣最好看”，而是如何用<span class="key-data">领口螺纹</span>、<span class="key-data">帽型拉条</span>、<span class="key-data">针法袖型</span>、<span class="key-data">挂面克重</span>、<span class="key-data">五金与版型</span>五组结构信号，在店内快速分流。结论来自主讲人经验与画面示范，不是成分实验室报告或品牌总评。
    </div>

    <div class="timeline">
      <h3>关键证据时间轴</h3>
      <div class="timeline-item"><div class="timeline-time">00:06</div><div class="timeline-text">反例：本布领口轻轻拉扯变形；正例：含氨纶螺纹秒回弹</div></div>
      <div class="timeline-item"><div class="timeline-time">00:34</div><div class="timeline-text">双层帽比单层更立体挺阔；毛边应收进内部</div></div>
      <div class="timeline-item"><div class="timeline-time">00:44</div><div class="timeline-text">后领贴条遮做缝并固定领形；通肩拉条为升级版</div></div>
      <div class="timeline-item"><div class="timeline-time">01:07</div><div class="timeline-text">针法阶梯：三针五线/三本针 &gt; 二本针 &gt; 无明线</div></div>
      <div class="timeline-item"><div class="timeline-time">01:20</div><div class="timeline-text">大插肩袖/大落肩更显瘦时尚；小落肩卡胸围易显胖</div></div>
      <div class="timeline-item"><div class="timeline-time">01:50</div><div class="timeline-text">拉链需挂面；无挂面边布裸露，敞开穿显邋遢</div></div>
      <div class="timeline-item"><div class="timeline-time">02:10</div><div class="timeline-text">克重建议 300–400g；太轻贴身，太重显胖</div></div>
      <div class="timeline-item"><div class="timeline-time">02:24</div><div class="timeline-text">内里锁边密实优先；锁眼/吊钟/拉链小绳与领口下摆</div></div>
      <div class="timeline-item"><div class="timeline-time">03:21</div><div class="timeline-text">面料：100%棉或加约 5%氨纶；毛圈细腻亲肤</div></div>
    </div>

    <div class="map">
      <h2>核心脉络</h2>
      <div class="diagram">
        <div class="node">问题<br/>卫衣怎么<br/>现场验货</div>
        <div class="arrow">→</div>
        <div class="node node-orange">证据<br/>五组结构<br/>触感检查</div>
        <div class="arrow">→</div>
        <div class="node">判断<br/>挺阔耐穿<br/>显瘦利索</div>
        <div class="arrow">→</div>
        <div class="node node-green">行动<br/>店内清单<br/>分流决策</div>
      </div>
    </div>

    <div class="correction">
      <h3>常见误解与认知纠偏</h3>
      <p><strong>误解 1：</strong>厚就一定好。→ 视频明确说太重会显胖，克重有上限（约三四百克）。</p>
      <p><strong>误解 2：</strong>帽绳开孔随便有就行。→ 剪刀开眼最差；菊花眼/金属气眼与金属吊钟才是升级信号。</p>
      <p><strong>误解 3：</strong>Whisper 原文可直接当术语。→ “V1/裸板/安伦/通间/客众”等多是音近误识；应以叠字“卫衣/螺纹/氨纶/通肩/克重”为准。</p>
    </div>

    <div class="section">
      <h2 class="sec-title">分析主题一：领口、帽型与肩部固定</h2>
      <div class="card card-green">
        <h3>在讲什么 → 关键理解 → 怎么用 → 原文依据</h3>
        <p><span class="speaker speaker-host">结构事实</span>本布领口用本体料直接做领，回弹差；螺纹含氨纶可秒回弹；双层帽更挺阔；通肩拉条比普通后领贴条覆盖更长。</p>
        <div class="quote">关键原话（校正后）：“一定要避开……本布……”“一定要选这种弹性好秒回弹的螺纹”“双层帽确实要比单层帽更加立体挺阔”“通肩拉条……后领贴条的一个升级版”。</div>
        <div class="action">用法：先拉领口看回弹，再摸帽是否双层，最后翻后领看贴条是否延伸到肩。</div>
        <div class="relation">关系：领口决定耐穿形，帽型决定立体感，拉条决定领形是否跑。</div>
      </div>
      <div class="card card-purple">
        <h3>UP 主观点：好卫衣/T恤“必不可少”后领贴条</h3>
        <p>这是经验立场，不是全品类强制标准。证据强度：画面演示 + 口述，无对照实验。</p>
        <div class="highlight">适用边界：适用于圆领/连帽卫衣店内快筛；对特殊设计款或刻意毛边美学未必适用。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">分析主题二：针法、袖型与拉链挂面</h2>
      <div class="card">
        <h3>针法阶梯与袖型分流</h3>
        <p><strong>在讲什么：</strong>外明线越规整通常越利索；插肩/大落肩通过分割线显瘦。</p>
        <p><strong>关键理解：</strong>三针五线/三本针稀缺即加分，不等于没有就不买；小落肩位置不对会反向显胖。</p>
        <div class="quote">字幕依据：“两条线的二本针……更加利索平整”“三针五线……有的话就是优秀的”“特别大的插肩袖……也会显瘦”。</div>
        <div class="action">用法：肩缝有二本针可优先；试穿时看落肩点是否卡在胸围线附近。</div>
      </div>
      <div class="card card-orange">
        <h3>风险：拉链无挂面 = 敞开穿露毛边</h3>
        <div class="pitfall">避坑：拉链卫衣必须翻开看有无挂面；边布裸露、软塌塌的敞开穿易显邋遢。</div>
        <div class="insight">推断（基于原文）：挂面同时服务观感与支撑，不只是“好看”。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">分析主题三：克重、五金与版型收口</h2>
      <div class="card card-green">
        <h3>克重窗口与内里锁边</h3>
        <p>太轻贴身没精神；<span class="key-data">300–400g</span> 兼顾挺阔；更重易显胖。内里锁边稀疏差、密实好——这是可当场核对的触感证据。</p>
        <div class="quote">“克重千万别选这种太轻的……要选这种三到四百克的”“特别稀疏……差的”“包得特别密实的……好的”。</div>
      </div>
      <div class="card">
        <h3>锁眼 / 吊钟 / 拉链拉头</h3>
        <p>开眼：剪刀眼最差 → 一字眼基础 → 菊花眼/金属气眼更好。吊钟：无吊钟打结最差 → 铝/铁片夹通货 → 螺丝加固更精致。拉头带细绳或布条更好拽。</p>
        <div class="relation">关系：五金细节不决定保暖，但强烈影响“利索/廉价”观感与日常操作摩擦。</div>
      </div>
      <div class="card card-red">
        <h3>避坑总结</h3>
        <ul>
          <li>本布领口、稀松无回弹螺纹</li>
          <li>单层软塌帽、无后领贴条/通肩拉条</li>
          <li>拉链无挂面、克重过轻或过重</li>
          <li>剪刀开眼、无吊钟、领口过紧、下摆过紧</li>
        </ul>
      </div>
    </div>

    <div class="card">
      <h3>横向对比：店内快筛信号</h3>
      <table>
        <thead>
          <tr><th>检查点</th><th>优先信号</th><th>降级/避雷</th><th>证据时段</th></tr>
        </thead>
        <tbody>
          <tr><td>领口</td><td>含氨纶、秒回弹螺纹</td><td>本布领、稀松螺纹</td><td>00:00–00:26</td></tr>
          <tr><td>帽型</td><td>双层、毛边内收</td><td>单层软塌、缝缝外露</td><td>00:26–00:41</td></tr>
          <tr><td>后领固定</td><td>通肩拉条 &gt; 普通贴条</td><td>无贴条、领形易跑</td><td>00:41–01:07</td></tr>
          <tr><td>针法</td><td>三针五线/三本针 &gt; 二本针</td><td>无明线凌乱</td><td>01:07–01:20</td></tr>
          <tr><td>袖型</td><td>大插肩/大落肩</td><td>小落肩卡胸围</td><td>01:20–01:43</td></tr>
          <tr><td>拉链</td><td>有挂面、边不裸露</td><td>无挂面、毛边外露</td><td>01:43–02:05</td></tr>
          <tr><td>克重</td><td>约 300–400g</td><td>过轻贴身 / 过重显胖</td><td>02:05–02:14</td></tr>
          <tr><td>锁眼吊钟</td><td>金属气眼 + 螺丝吊钟</td><td>剪刀眼、打结无吊钟</td><td>02:24–02:56</td></tr>
          <tr><td>版型收口</td><td>领口略大、下摆不紧</td><td>领口过小、下摆过紧</td><td>03:09–03:21</td></tr>
          <tr><td>面料</td><td>纯棉或棉+约5%氨纶，毛圈细腻</td><td>粗糙、易起球/静电（口述）</td><td>03:21–03:40</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <h3>立场分层</h3>
      <div class="stance-grid">
        <div class="stance-item">
          <strong>可验证事实</strong>
          <p class="small">画面可见本布领变形、螺纹回弹、双层帽、通肩拉条、针法对比、挂面有无、锁眼类型与克重口述区间。</p>
        </div>
        <div class="stance-item">
          <strong>UP 主观点</strong>
          <p class="small">“好卫衣必不可少贴条”“三四百克最合适”“金属锁眼/吊钟更好”——经验排序，非行业强制标准。</p>
        </div>
        <div class="stance-item">
          <strong>基于原文的推断</strong>
          <p class="small">把清单当作店内分流工具最有效；不能替代试穿、水洗耐久与真实成分检测。</p>
        </div>
      </div>
    </div>

    <div class="conclusion">
      <h2>总结与行动</h2>
      <h3>核心要点</h3>
      <ul>
        <li>卫衣好坏大量取决于结构细节，而非只有图案与厚薄。</li>
        <li>领口回弹、帽型、拉条、针法、挂面、克重、五金构成一条完整筛查链。</li>
        <li>显瘦来自袖型与下摆领口比例，不只来自尺码加大。</li>
      </ul>
      <h3>行动清单</h3>
      <ol>
        <li>拉领口：秒回弹螺纹优先，本布领直接过。</li>
        <li>摸帽子与后领：双层帽 + 通肩拉条优先。</li>
        <li>看肩缝与拉链内侧：二本针以上、有挂面。</li>
        <li>估克重并翻内里：约 300–400g，锁边密实。</li>
        <li>查帽绳出口与吊钟，再试穿领口/下摆松紧。</li>
      </ol>
      <h3>关键认知转变</h3>
      <p>从“看图案买卫衣”转向“用手验证结构”；厚与贵都不是充分条件，挺阔、利索和耐形才是可复用的筛选标准。</p>
    </div>

    <p class="footer">双轨产物之二 · 理性分析 · 依据同一 Whisper 转录与可见字幕校正 · hoodie-buying-details</p>
  </div>
</div>

    </div>
  </foreignObject>
</svg>