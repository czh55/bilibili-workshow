      <div class="container root-wrap">
  <h1>大师的蓝：冷暖同时对比</h1>
  <div class="meta"><span class="tag tag-blue">冷暖</span><span class="tag tag-green">同时对比</span><span class="tag tag-orange">西斯莱</span><span class="tag tag-purple">克罗耶</span><span class="tag tag-red">蓝色</span><span class="tag tag-gray">时长 117秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/3agCqgRTEwa">原视频</a>
  <div class="summary-line">同蓝换暖底更显蓝。西斯莱天空靠暖云托出通透；云改纯白则天硬。规律：冷色要自然，亮部须发暖。克罗耶脸冷紫因海更冷而反显温暖。高手设计关系，不是单块「神蓝」。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">蓝圆换暖底</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">突然更蓝</span></div><div class="timeline-item"><span class="timeline-time">00:22</span><span class="timeline-text">冷暖同时对比</span></div><div class="timeline-item"><span class="timeline-time">00:35</span><span class="timeline-text">西斯莱天空</span></div><div class="timeline-item"><span class="timeline-time">00:46</span><span class="timeline-text">云的暖白</span></div><div class="timeline-item"><span class="timeline-time">00:54</span><span class="timeline-text">云纯白则天硬</span></div><div class="timeline-item"><span class="timeline-time">01:03</span><span class="timeline-text">规律：亮部发暖</span></div><div class="timeline-item"><span class="timeline-time">01:25</span><span class="timeline-text">克罗耶冷紫脸</span></div><div class="timeline-item"><span class="timeline-time">01:40</span><span class="timeline-text">海更冷衬脸暖</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">机制<br/>暖推冷</div><span class="arrow">→</span><div class="node-green">风景<br/>云暖托天蓝</div><span class="arrow">→</span><div class="node-orange">规律<br/>亮部发暖</div><span class="arrow">→</span><div class="node-blue">人像<br/>海冷衬脸</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「同时对／西斯兰零间小路／加蓝子／亮度的颜色」→「同时对比／西斯莱林间小路／加蓝紫／亮部的颜色」。</p><p>误区：天蓝＝加更多蓝。视频强调旁边要暖。</p><p>误区：脸冷紫一定病态。取决于环境是否更冷。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>机制</h3>
      <p>见暖则旁色更冷；同蓝在暖底上更蓝。</p>
      <div class="quote">会自动的让旁边的颜色看起来比实际更冷</div>
      <div class="relation">冷感是相对的。</div>
    </div>
    <div class="card card-orange">
      <h3>西斯莱钥匙在云</h3>
      <p>通透蓝关键常在暖白云；切断冷暖则天硬。</p>
      <div class="quote">云的暖白会让我们的眼睛自动觉得天空更蓝</div>
      <div class="relation">先设计云温，再谈蓝配方。</div>
    </div>
    <div class="card card-red">
      <h3>可执行规律</h3>
      <p>冷色要自然，别只加蓝紫；同时让亮部发暖。</p>
      <div class="quote">一定要记得同时让亮部的颜色发暖</div>
      <div class="relation">冷的成立条件是暖的在场。</div>
    </div>
    <div class="card card-purple">
      <h3>克罗耶关系逆转</h3>
      <p>脸冷紫本可病态；海更冷更蓝后脸反显温暖有血色。</p>
      <div class="quote">让脸上的冷反而变得温暖有血色了</div>
      <div class="relation">单块色的评价取决于关系网。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>关系＞单块</p>
      <div class="quote">真正的高手……是颜色之间的关系设计得很精彩</div>
      <div class="relation">从来不是某一块颜色画得好</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>117 秒冷暖短片，明度同时对比留给下期。</li><li>画名「林间小路」据口播校正，具体馆藏名可能变体。</li><li>片尾预告非本集结论。</li></ul><div class="pitfall">天空一路加蓝加紫。</div><div class="pitfall">云涂死白，切断冷暖。</div><div class="pitfall">孤立评价「这脸太冷」而不看环境。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>暖推冷的同时对比</li><li>亮部发暖托冷色</li><li>关系设计决定单块观感</li></ul><h3>行动清单</h3><ol><li>同蓝对冷底／暖底对照</li><li>风景小稿：先铺暖云再铺天蓝</li><li>人像：环境再冷一档，看肤色冷紫是否「活」</li><li>自检：最冷处旁边是否有足够暖</li></ol><h3>关键认知转变</h3><p>以前：找「大师用的那管蓝」；现在：经营旁边的暖与更冷的环境，让蓝自己显出来。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 117秒</div>
</div>
    </div>
  </foreignObject>
</svg>