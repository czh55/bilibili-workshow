      <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}.c{max-width:1200px;margin:0 auto}h1{font-size:36px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}h2{font-size:26px;font-weight:700;color:#1e40af;margin:32px 0 16px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}h3{font-size:20px;font-weight:700;color:#334155;margin-bottom:12px}p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}ul,ol{padding-left:24px;margin:8px 0}li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:6px}.tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}.tb{background:#dbeafe;color:#1e40af}.tg{background:#d1fae5;color:#065f46}.to{background:#ffedd5;color:#9a3412}.meta{margin:12px 0 20px}.sl{font-size:18px;line-height:1.7;color:#334155;padding:20px 24px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}.tl{background:#fff;border-radius:16px;padding:24px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.04)}.tl h3{color:#1e40af;margin-bottom:12px}.ti{display:flex;align-items:baseline;padding:8px 0;border-bottom:1px solid #f1f5f9}.tt{font-size:14px;font-weight:700;color:#3b82f6;min-width:70px}.tx{font-size:15px;color:#475569}.map{background:#fff;border-radius:20px;padding:36px;margin-bottom:24px;box-shadow:0 4px 24px rgba(0,0,0,.06)}.map h2{font-size:24px;margin-top:0;border-bottom:none;padding-bottom:0}.dg{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:20px 0}.n{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:16px;padding:20px 28px;text-align:center;min-width:140px;font-weight:700;font-size:16px;color:#1e40af}.ng{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}.no{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}.ar{font-size:24px;color:#94a3b8}.cor{background:linear-gradient(135deg,#fef3c7,#fef9c3);border-left:4px solid #f59e0b;padding:20px 24px;border-radius:12px;margin-bottom:24px}.cor h3,.cor p{color:#92400e}.st{font-size:22px;font-weight:700;color:#1e40af;margin-bottom:16px;padding-left:16px;border-left:4px solid #3b82f6}.card{background:#fff;border-radius:16px;padding:28px;margin-bottom:16px;box-shadow:0 4px 24px rgba(0,0,0,.06);border-left:5px solid #3b82f6}.cg{border-left-color:#10b981}.co{border-left-color:#f59e0b}.card h3{font-size:20px;font-weight:700;color:#1e40af;margin-bottom:10px}.card .ac{background:#eff6ff;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#1e40af;border-left:4px solid #3b82f6}.con{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:36px;margin-top:32px}.con h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}.con h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}.con p,.con li{color:rgba(255,255,255,.9);font-size:15px}.ft{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}</style>
      <div class="c"><h1>自由泳划手常见的错误动作纠正</h1><div class="meta"><span class="tag tb">游泳技术</span><span class="tag tg">自由泳</span><span class="tag to">9秒</span></div><div class="sl">核心判断：自由泳划手的错误往往不是手臂动作的问题，而是<strong>肩部位置没有引导手臂</strong>。教练用触觉按压来纠正肩部发力起点，比口头指令更高效。</div>
<div class="tl"><h3>纠正过程时间轴</h3><div class="ti"><span class="tt">00:00</span><span class="tx">学员独立划手 → 肩部位置不正确，手臂孤立发力</span></div><div class="ti"><span class="tt">00:03</span><span class="tx">教练触觉介入 → 用手按压学员肩部，引导正确发力起点</span></div><div class="ti"><span class="tt">00:06</span><span class="tx">学员调整 → 肩带臂完成高肘抱水，手掌前臂有效抓水</span></div></div>
<div class="map"><h2>核心脉络</h2><div class="dg"><div class="n">划手为什么不对？</div><span class="ar">→</span><div class="n no">只看手臂，忽略了肩部</div><span class="ar">→</span><div class="n ng">教练触觉引导肩部发力点</div><span class="ar">→</span><div class="n ng">肩带臂 = 正确的划手</div></div></div>
<div class="cor"><h3>核心认知纠偏</h3><p>很多人以为划手就是用胳膊划，但教练在这个视频里传递的信息是：<strong>肩部是划手的发动机，手臂是传动轴</strong>。发动机位置不对，传动轴再怎么转也是低效的。</p></div>
<div class="card"><h3>错误：手臂孤立发力 [00:00]</h3><p>学员的典型错误：划手时肩膀位置过高或过前，手臂只能在有限范围内运动，手掌抓水距离短、力度弱。视觉上看起来"在划水"，实际上推进效率极低。</p><div class="ac">判断方法：游完后肩膀酸痛而不是背阔肌酸痛 → 大概率是用手臂在划。</div></div>
<div class="card cg"><h3>纠正：触觉引导肩部 [00:03]</h3><p>教练没有说"肩膀往下压"之类的口头指令，而是直接用手按压学员的肩部，让学员<strong>用身体感受</strong>正确的发力方向。这是游泳教学中最高效的纠正方式——触觉反馈绕过语言理解，直达运动神经。</p><div class="ac">启示：自学时找不到感觉，可以请人用手按在你想发力的位置给你外部参照。</div></div>
<div class="card"><h3>正确：肩带臂完成划水 [00:06]</h3><p>学员调整后，手掌和前臂形成有效的高肘抱水角度，划水路径从"短而浅"变成了"长而深"。整个动作的流畅度明显提升。</p><div class="ac">标志：正确发力时，你能感觉到肩膀/背阔肌在用力，而不是二头肌或前臂酸。</div></div>
<div class="con"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>划手的发动机是肩部（背阔肌），不是手臂</li><li>触觉引导比口头指令更直接——请人用手给你外部参照</li><li>判断标准：划完肩膀/背阔肌该酸，不是手臂酸</li></ul><h3>行动清单</h3><ol><li>下次游泳时请朋友站在池边，用手按在你的肩膀上，让你感受正确的发力起点</li><li>做单臂划水分解，另一只手摸着划水侧的背阔肌，确认肌肉是否在收缩</li><li>录制自己游泳视频，慢放检查肩部在划水过程中的位置变化</li></ol><h3>关键认知转变</h3><p>从"划手是用手臂"转变为"划手是用肩带臂"——找到肩部的发力感，手臂自然就对了。</p></div><div class="ft">原视频 · 小红书 · 自由泳划手常见的错误动作纠正</div></div>
    </div>
  </foreignObject>
</svg>