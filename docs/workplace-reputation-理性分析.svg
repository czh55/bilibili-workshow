      <div class="container root-wrap">
  <h1>职场口碑：业绩只占10%，口碑占90%</h1>
  <div class="meta"><span class="tag tag-blue">职场</span><span class="tag tag-green">口碑</span><span class="tag tag-orange">职业发展</span><span class="tag tag-gray">时长 1分19秒</span><span class="tag tag-gray">分析视角：职场口碑的构成与建立方法</span></div>
  <a class="source-link" href="local:01e46dcc79eb354301037103884fd25b45_4610.mp4video.MP4">原视频（本地文件）</a>
  <div class="summary-line">核心判断：雇主对员工的评价，业绩只占 10%，口碑、职场印象和职场曝光占 90%。建立口碑的两个方法：做自己擅长的事启动正反馈（做得好→更有兴趣→做得更好），以及用知识文档建立个人标签（让别人一提到某件事就想到你）。文档为自己而写，留好备份用于面试。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">核心观点：业绩只占10%，口碑/职场印象/曝光占90%</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">进公司就想好建立什么口碑：搞定客户、活跃气氛、逻辑思维</span></div><div class="timeline-item"><span class="timeline-time">00:16</span><span class="timeline-text">方法一：做自己擅长的事情</span></div><div class="timeline-item"><span class="timeline-time">00:19</span><span class="timeline-text">痛点不是放弃不擅长，而是不知道自己擅长什么</span></div><div class="timeline-item"><span class="timeline-time">00:24</span><span class="timeline-text">《把时间当作朋友》：做得好→更有兴趣→做得更好（正反馈）</span></div><div class="timeline-item"><span class="timeline-time">00:39</span><span class="timeline-text">落地：写每日工作任务清单，对标高薪岗位要求，做到极致</span></div><div class="timeline-item"><span class="timeline-time">00:51</span><span class="timeline-text">方法二：让别人一提到某件事就想到你</span></div><div class="timeline-item"><span class="timeline-time">00:53</span><span class="timeline-text">写知识文档：培训课件、复盘总结、任务清单，放共享平台</span></div><div class="timeline-item"><span class="timeline-time">01:02</span><span class="timeline-text">不是为公司写的，是为自己写的，留备份</span></div><div class="timeline-item"><span class="timeline-time">01:08</span><span class="timeline-text">面试高薪工作时秀出文档，证明你是专家</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>如何建立职场口碑</div><span class="arrow">→</span><div class="node-green">证据<br/>10%/90%比例 + 两个方法</div><span class="arrow">→</span><div class="node-orange">判断<br/>口碑是可主动建立的个人品牌</div><span class="arrow">→</span><div class="node-blue">行动<br/>擅长的事+知识文档曝光</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解 1：职场靠业绩说话，做出结果就行。纠偏：业绩只占 10%，口碑与职场曝光占 90%。</p><p>误解 2：不知道擅长什么就没辙。纠偏：可以写每日任务清单、对标高薪岗位要求来发现并强化优势。</p><p>误解 3：写文档是为公司做贡献。纠偏：你是为自己写的，文档备份是面试跳槽的筹码。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>评价结构：业绩10%，口碑90%</h3>
      <p>在讲什么：雇主评价员工，业绩只占 10%，口碑、职场印象和职场曝光占 90%。关键理解：职场印象是他人认知，需要主动经营。怎么用：刚进公司就想好要建立什么样的口碑标签。</p>
      <div class="quote">依据 [00:00–00:15]：雇主对员工的评价中业绩只占10%，口碑、职场印象和职场曝光占了90%。</div>
      <div class="relation">立场分层：10/90 比例为讲者观点，无法严格实证，但「口碑重要」为职场共识。</div>
    </div>
    <div class="card card-orange">
      <h3>方法一：擅长的事启动正反馈</h3>
      <p>在讲什么：做自己擅长的事。痛点是不知道自己擅长什么。推荐《把时间当作朋友》：不是有兴趣才做得好，而是做得好所以更有兴趣，形成增强正反馈。关键理解：兴趣是结果的产物，不是前提。怎么用：写每日任务清单，对标高薪岗位要求，把对应任务做到极致，先启动一个正反馈。</p>
      <div class="quote">依据 [00:24–00:50]：不是因为你有兴趣所以才把事情做好，而是正是因为你把事情做好了，所以你更有兴趣把事情做得更好，形成一个不断增强的正反馈。</div>
      <div class="relation">立场分层：正反馈逻辑为心理学常识；落地步骤为讲者方法。</div>
    </div>
    <div class="card card-purple">
      <h3>方法二：文档建立个人标签</h3>
      <p>在讲什么：让别人一提到某件事就想到你。操作：写相关领域知识文档（培训课件、复盘、总结、任务清单）放内部共享平台。关键理解：你不是为公司写的，是为自己写的；留备份用于面试秀出专家证明。怎么用：选一个领域持续输出文档，让曝光成为习惯。</p>
      <div class="quote">依据 [00:51–01:13]：你不是为公司写的，你是为你自己写的。所有你写的文档都自己手里留一个备份。面试下一份薪水更高的工作时，把你写的这些文档都秀出来。</div>
      <div class="relation">立场分层：方法为讲者实战经验；「为自己写文档」为核心观点。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">职场口碑建立双方法</h2><div class="card"><table><thead><tr><th>维度</th><th>方法一：擅长的事</th><th>方法二：知识文档</th></tr></thead><tbody><tr><td>目标</td><td>启动正反馈</td><td>建立个人标签</td></tr><tr><td>动作</td><td>做到极致</td><td>写文档放共享平台</td></tr><tr><td>受众</td><td>自己</td><td>公司所有人 + 未来雇主</td></tr><tr><td>关键词</td><td>兴趣是结果</td><td>文档即名片</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>适用：初入职场、想主动经营职业形象的人。</li><li>上限：口碑是长期累积，不能速成；业绩仍是入场券。</li><li>反例：光写文档不出成果，会被当作「文档党」。</li><li>例外：技术型岗位口碑维度不同，但仍包含曝光与协作印象。</li></ul><div class="pitfall">避坑：别把文档写成流水账，要让人一读就记住你的标签。</div><div class="pitfall">避坑：别只输出不做事，口碑最终要靠成果托底。</div><div class="pitfall">避坑：备份文档注意保密边界，别泄露公司敏感信息。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>业绩只占 10%，口碑占 90%。</li><li>擅长的事会启动「做得好→更有兴趣」的正反馈。</li><li>知识文档 = 你的名片，为自己而写，留好备份。</li></ul><h3>行动清单</h3><ol><li>写一周的每日任务清单，找出你最擅长的那几类。</li><li>选一个领域，本周在共享平台发布一份复盘/教程文档。</li><li>为文档建立个人备份文件夹，长期积累。</li></ol><h3>关键认知转变</h3><p>从「等结果说话」转到「主动经营口碑」：职场印象不是运气，是可以设计的资产。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 1分19秒</div>
</div>
