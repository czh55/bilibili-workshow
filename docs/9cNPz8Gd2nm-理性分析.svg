<div class="card"><h3>内容要点</h3><ul><li>如何制作这样的省会感动好文字</li>
<li>让我们省略多余的开箱白</li>
<li>直接进入详细调整不准</li>
<li>第一种方法</li>
<li>有一定的设备要求</li>
<li>你需要一台可以使用Apple Pencil的iPad</li>
<li>以及一个付费软件Procreate</li>
<li>如果你没有iPad</li>
<li>可以调到实情的这个位置</li>
<li>是我琢磨出来的一些其他替代方法</li>
<li>好 现在让我们回到iPad的做法</li>
<li>首先我们打开Procreate</li>
<li>新建一个画布</li>
<li>画布的尺寸可以设置成跟你视频一样的</li>
<li>比如你拍的是1080P的视频</li>
<li>那么画布尺寸就可以设置成1920x1080</li>
<li>新建画布之后</li>
<li>我们首先在组合找到这个小班手里面</li>
<li>找到画布</li>
<li>把这个动画协助打开</li>
<li>接下来你可以在需要放置文字的视频里</li>
<li>写一张图放进画布里面作为参考</li>
<li>然后我们新建一个图层</li>
<li>现在就可以直接开始写字了</li>
<li>比如说我一般会用软件自带的干油墨</li>
<li>在琢磨这个分类里面</li>
<li>如果觉得自己写字不太好看</li>
<li>可以选一个手写风格的字体</li>
<li>先把要写的字打出来再描一遍</li>
<li>像我视频里经常出现在这种方块感觉的字体</li>
<li>是我先写一遍正常的字</li>
<li>顺着笔划描成方块感觉的空间字</li>
<li>最后再填色</li>
<li>当然也可以直接保留空间字的感觉</li>
<li>那此时我们就获得了一张手写字的图片</li>
<li>接下来需要做的是让它拥有动态</li>
<li>效果最好的方式是新建两个图层</li>
<li>每个图层各把刚刚写的字描一遍</li>
<li>也就是获得三个比数六有不同的图层</li>
<li>然后的时候可以故意粗糙一点</li>
<li>这样最终生成的动画斗斗感会更强一些</li>
<li>接下来我会把这三个图层分别复制两次</li>
<li>然后按顺序排列好</li>
<li>因为我一般会导出每秒九帧的视频</li>
<li>这样只要图刚好是一秒</li>
<li>会比较方便使用</li>
<li>接下来我们把除了这九个图层以外的所有图层</li>
<li>全部关闭</li>
<li>点击分享</li>
<li>把动画导出来</li>
<li>你可以直接选这个动画GIF</li>
<li>这样导出来的素材就是透明底的</li>
<li>直接传到电脑里</li>
<li>放到视频上面就可以用了</li>
<li>如果动画不够长的</li>
<li>就多复制几段</li>
<li>拼到一起就可以了</li>
<li>这一部任何的剪辑软件都可以做到</li>
<li>操作都是一样的</li>
<li>如果你觉得描两遍太麻烦的话</li>
<li>还有一种做法是写完第一张字以后</li>
<li>直接关闭其他图层</li>
<li>把字导出为一张PNG的图片</li>
<li>然后把这张图放到你的视频上面</li>
<li>接下来的操作我是用PR完成的</li>
<li>我不确定其他更简单的软件能不能做到</li>
<li>在PR里是这样做的</li>
<li>首先在效果哪里搜索囤流置换</li>
<li>把它施压在完整图片上</li>
<li>然后在效果空间里找到这个效果</li>
<li>把数量改成10</li>
<li>然后找到下面的演化</li>
<li>在图片开头打一个关键针</li>
<li>在图条视频最后</li>
<li>把演化的数值猛拉大的大一点</li>
<li>让你的字能够像这样疯狂的抽出</li>
<li>然后右键把图片嵌套</li>
<li>给嵌到图层施加一个色调分离时间的效果</li>
<li>把主意不要选择色调分离</li>
<li>然后在效果空间里面找到它</li>
<li>把这个24改成6或者9</li>
<li>这样整个嵌套就变成6帧或者9帧了</li>
<li>我们的文字图片也都变成了这样逐帧抖动的效果</li>
<li>可以对比一下两种方法做出来的效果</li>
<li>其实我觉得有时候右边这种感觉反而更好一些</li>
<li>你们觉得呢</li>
<li>OK 那如果你没有iPad的话</li>
<li>也有其他的解决方案</li>
<li>如果会稍微麻烦一点</li>
<li>你可以找一张白纸</li>
<li>用马克笔写出你要放在视频的文字</li>
</ul></div>
