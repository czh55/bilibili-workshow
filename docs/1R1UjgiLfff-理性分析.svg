<div class="card"><h3>内容要点</h3><ul><li>歡迎您收看低摘RS3 mini教學視頻</li>
<li>本視頻將為您介紹包裝清單首次使用</li>
<li>平衡調節、激活、開始使用及收納的</li>
<li>以幫助您快速瞭解和上手該位的力氣</li>
<li>RS3 mini包裝內包含</li>
<li>雲台主體、三角架、USB-C彎頭相機控制線</li>
<li>USB-C線、快裝板和螺絲套裝</li>
<li>將三角架安裝至雲台底部</li>
<li>將穩定器平穩放置於桌面</li>
<li>推薦使用五伏二安的USB充電器</li>
<li>連接USB-C線給穩定器充電</li>
<li>將上層快裝板的擋邊內壁與相機前端貼住後鎖緊螺絲</li>
<li>如果相機前端對齊後無法鎖緊螺絲</li>
<li>請將快裝板調轉180度</li>
<li>使擋邊內壁與相機機身貼緊後再鎖緊相機固定螺絲</li>
<li>解鎖下層快裝板上的板扣</li>
<li>按住安全鎖</li>
<li>將相機連同上層快裝板滑入下層快裝板後鎖緊板扣</li>
<li>穩定器有三個軸分別是撫養軸</li>
<li>和平衣軸</li>
<li>在運動過程中三個軸沿不同方向轉動</li>
<li>用來抵消不同方向的動動起到穩定的作用</li>
<li>軸鎖用來鎖定軸壁分別為撫養軸鎖</li>
<li>橫滾軸鎖</li>
<li>平衣軸鎖</li>
<li>搬扣用來鎖定軸壁位置分別為數幣搬扣</li>
<li>橫幣搬扣</li>
<li>橫滾軸壁搬扣</li>
<li>下層快裝板鎖緊板扣</li>
<li>下層快裝板紅色板扣</li>
<li>安全鎖可以防止快裝板軸壁脫落分別為數幣安全鎖</li>
<li>撫養軸安全鎖</li>
<li>上層快裝板安全鎖</li>
<li>下層快裝板安全鎖</li>
<li>撫養軸垂直平衡調節打開撫養軸軸鎖</li>
<li>鬆開橫幣板扣</li>
<li>翻轉相機使鏡頭垂直朝上</li>
<li>判斷相機重心朝向</li>
<li>如果相機鏡頭朝前傾斜</li>
<li>則表明重心靠前</li>
<li>用手拖住相機後</li>
<li>須向後移動橫幣</li>
<li>如果相機向後傾斜</li>
<li>則表明重心靠後</li>
<li>用手拖住相機後</li>
<li>須向前移動橫幣</li>
<li>鎖緊橫幣板扣</li>
<li>如果相機鏡頭垂直朝上時</li>
<li>能保持不動</li>
<li>代表撫養軸垂直方向以調節平衡</li>
<li>撫養軸前後平衡調節</li>
<li>使相機鏡頭水平朝前</li>
<li>鬆開數幣板扣</li>
<li>判斷相機重心朝向</li>
<li>如果相機鏡頭向下傾斜</li>
<li>說明重心靠前</li>
<li>用手拖住相機後</li>
<li>須向後移動數幣</li>
<li>若相機鏡頭向上傾斜</li>
<li>用手拖住相機後</li>
<li>須向前移動數幣</li>
<li>鎖緊數幣板扣</li>
<li>若相機水平朝前時</li>
<li>能夠保持靜止</li>
<li>表明撫養軸以調節平衡</li>
<li>當相機在撫養軸任意位置</li>
<li>都能保持靜止不動</li>
<li>代表撫養軸已完成平衡調節</li>
<li>將軸鎖撥至鎖定位置</li>
<li>鎖定撫養軸很滾軸平衡調節</li>
<li>打開很滾軸鎖</li>
<li>鬆開很滾軸軸幣板扣</li>
<li>判斷相機重心朝向</li>
<li>若相機向左傾斜</li>
<li>說明相機重心靠左</li>
<li>用手拖住相機後</li>
<li>須向右移動很滾軸</li>
<li>若相機向右傾斜</li>
<li>說明相機重心靠右</li>
<li>用手拖住相機後</li>
<li>須向左移動很滾軸</li>
<li>鎖緊很滾軸板扣</li>
<li>若相機能在水平方向保持不動</li>
<li>表示很滾軸已調節平衡</li>
<li>打開平衣軸鎖</li>
<li>鬆開平衣軸軸幣板扣</li>
<li>握住雲台手柄</li>
<li>使雲台向前傾斜</li>
<li>轉動平衣軸軸幣</li>
<li>使其與身體平行</li>
<li>判斷軸幣重心位置</li>
<li>若相機向左側傾斜</li>
<li>說明相機重心靠左</li>
<li>握住軸幣後</li>
<li>向右移動平衣軸</li>
<li>若相機向右傾斜</li>
<li>說明相機重心靠右</li>
<li>握住軸幣後</li>
<li>向左移動平衣軸</li>
<li>鎖緊平衣軸軸幣板扣</li>
<li>若雲台平衣軸在銳意角度</li>
<li>都能保持靜止不動</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>歡迎您收看低摘RS3 mini教學視頻本視頻將為您介紹包裝清單首次使用平衡調節、激活、開始使用及收納的以幫助您快速瞭解和上手該位的力氣RS3 mini包裝內包含雲台主體、三角架、USB-C彎頭相機控制線USB-C線、快裝板和螺絲套裝將三角架安裝至雲台底部將穩定器平穩放置於桌面推薦使用五伏二安的USB充電器連接USB-C線給穩定器充電將上層快裝板的擋邊內壁與相機前端貼住後鎖緊螺絲如果相機前端對齊後無</p><p>转录分段: 231 | 时长: 11:07</p></div>
