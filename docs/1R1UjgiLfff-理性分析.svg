      <div class="container">
<h1>大疆RS 3 Mini完整教学：从开箱到调平</h1>
<div class="meta"><span class="tag tag-blue">小红书</span><span class="tag tag-blue">拍摄设备</span><span class="tag tag-blue">稳定器</span><span class="tag tag-gray">11:07</span></div>

<div class="summary-line">大疆RS 3 Mini稳定器完整使用流程：包装内含云台主体、三脚架、USB-C控制线、快装板螺丝套装。核心步骤：①安装三脚架→②安装上层快装板到相机→③滑入下层快装板锁紧→④三轴平衡调节（俯仰轴垂直平衡→横滚轴平衡→平移轴平衡）→⑤激活使用。平衡调节是关键：解锁轴锁→松板扣→判断重心方向→移动相机位置→锁紧，直至每个轴在任意角度都能静止不动。</div>

<div class="map"><h2>核心脉络图</h2>
<div class="diagram">
  <div class="node">安装快装板<br/>到相机</div>
  <div class="arrow">→</div>
  <div class="node node-green">装入云台<br/>锁紧板扣</div>
  <div class="arrow">→</div>
  <div class="node node-orange">三轴平衡<br/>俯仰→横滚→平移</div>
  <div class="arrow">→</div>
  <div class="node">激活<br/>开始使用</div>
</div>
</div>

<div class="card"><h3>RS 3 Mini 三轴平衡调节步骤</h3>
<table>
<tr><th>轴</th><th>调节方法</th><th>判断标准</th></tr>
<tr><td>俯仰轴(垂直)</td><td>镜头垂直朝上→判断前后倾斜→移动相机</td><td>镜头可静止垂直朝上</td></tr>
<tr><td>俯仰轴(水平)</td><td>相机水平→判断前后倾斜→移动相机</td><td>相机水平不倾斜</td></tr>
<tr><td>横滚轴</td><td>相机水平→判断左右倾斜→移动横滚臂</td><td>相机不左右倾斜</td></tr>
<tr><td>平移轴</td><td>倾斜云台→判断重心→移动平移臂</td><td>任意角度静止不动</td></tr>
</table>
</div>

<div class="card card-green"><h3>行动清单</h3>
<ul>
<li>开箱先检查配件：云台主体、三脚架、USB-C控制线、快装板、螺丝套装</li>
<li>安装上层快装板时挡边内壁与相机前端贴紧后锁螺丝</li>
<li>如果相机前端对齐后无法锁紧→快装板调转180度</li>
<li>三轴平衡顺序：俯仰轴（先垂直后水平）→横滚轴→平移轴</li>
<li>使用前解锁所有轴锁（俯仰/横滚/平移三轴锁）</li>
<li>充电推荐5V/2A USB充电器</li>
</ul>
</div>

<div class="card card-red"><h3>避坑总结</h3>
<ul>
<li>不要跳过平衡调节直接开机——不平衡会烧电机或影响稳定效果</li>
<li>不要忘记解锁轴锁——三轴被锁定时开机可能损坏电机</li>
<li>上层快装板方向不对会导致相机无法锁紧——可以调转180度</li>
<li>注意安全锁：可以防止快装板意外脱落</li>
</ul>
</div>

<div class="card card-orange"><h3>方法边界</h3>
<div class="boundary">
<p><strong>三轴平衡核心原理：</strong>每个轴在任意角度都能静止不动=完全平衡。重心判断法：看相机往哪个方向倾斜→向反方向调整。</p>
<p><strong>适用机型：</strong>DJI RS 3 Mini，适合微单/小型相机组合。</p>
</div>
</div>

<div class="conclusion">
<h2>立场分层与结语</h2>
<h3>新手必做</h3>
<p>拿到稳定器第一件事：三轴平衡调节。这是使用稳定器的基础，跳过这一步所有拍摄都会受影响。</p>
<h3>调节顺序</h3>
<p>俯仰→横滚→平移，记牢这个顺序，每次都能快速完成调平。</p>
</div></div>
