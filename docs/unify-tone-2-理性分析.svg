.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>统一色调2：核心对比</h1>
  <div class="meta"><span class="tag tag-blue">核心对比</span><span class="tag tag-green">纯与灰</span><span class="tag tag-orange">眯眼</span><span class="tag tag-purple">托斯卡纳</span><span class="tag tag-red">情绪</span><span class="tag tag-gray">时长 238秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/8UTvxLcId6o">原视频</a>
  <div class="summary-line">丰富不等于多色：突出唯一核心对比（黄紫／纯灰／明度等），其余融入或退让。三步：定主角、他色降纯缩面积或融入、眯眼验秩序。规则是拐杖，核心对比须匹配情绪。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">只能选一对？</span></div><div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">黄紫突出</span></div><div class="timeline-item"><span class="timeline-time">00:40</span><span class="timeline-text">复原即违和</span></div><div class="timeline-item"><span class="timeline-time">01:20</span><span class="timeline-text">纯灰核心</span></div><div class="timeline-item"><span class="timeline-time">01:40</span><span class="timeline-text">明度核心</span></div><div class="timeline-item"><span class="timeline-time">02:22</span><span class="timeline-text">托斯卡纳三步</span></div><div class="timeline-item"><span class="timeline-time">02:52</span><span class="timeline-text">回归感受</span></div><div class="timeline-item"><span class="timeline-time">03:30</span><span class="timeline-text">作业</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">定主角<br/>唯一对比</div><span class="arrow">→</span><div class="node-green">退让<br/>降纯缩面</div><span class="arrow">→</span><div class="node-orange">眯眼<br/>验秩序</div><span class="arrow">→</span><div class="node-blue">感受<br/>配情绪</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「纯一灰／托斯卡拉／护衬」→「纯与灰／托斯卡纳／互衬」。</p><p>误区：颜色越多画面越丰富。</p><p>误区：死板预置对比不顾感受。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>抓主要对比</h3>
      <p>黄紫突出时树绿桃红应融入。</p>
      <div class="quote">一定要抓住主要的对比</div>
      <div class="relation">多不如准。</div>
    </div>
    <div class="card card-orange">
      <h3>纯灰或明度</h3>
      <p>也可灰vs高纯，或深浅明度作核心。</p>
      <div class="quote">这就是纯与灰的核心对比关系</div>
      <div class="relation">对比类型可选。</div>
    </div>
    <div class="card card-red">
      <h3>三步用法</h3>
      <p>定主线→他色退让→眯眼检查。</p>
      <div class="quote">千万不要和主角来抢戏</div>
      <div class="relation">秩序可维护。</div>
    </div>
    <div class="card card-purple">
      <h3>感受优先</h3>
      <p>核心对比匹配情绪；规则是拐杖。</p>
      <div class="quote">最重要的是回归感受</div>
      <div class="relation">方法服务表达。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>作业</p>
      <div class="quote">找素材核心对比并说理由。</div>
      <div class="relation">识别即练习。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>衔接上期三招，本集聚焦核心对比。</li><li>托斯卡纳为假设主线示例。</li><li>情绪列表非穷尽。</li></ul><div class="pitfall">多组同等强对比互抢。</div><div class="pitfall">复原所有固有色。</div><div class="pitfall">从不眯眼检查。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>唯一核心对比</li><li>其余退让</li><li>眯眼维护</li><li>匹配情绪</li></ul><h3>行动清单</h3><ol><li>标出画面最强对比一对</li><li>把他色降纯或缩面积</li><li>破坏后再眯眼对比美感</li><li>写下该对比对应的情绪词</li></ol><h3>关键认知转变</h3><p>以前：什么颜色都画满；现在：只养一组核心对比，其余退出抢戏。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 238秒</div>
</div>
    </div>
  </foreignObject>
</svg>