      <div class="container">
<h1>闪光灯功率选购指南</h1>
<div class="meta"><span class="tag tag-blue">小红书</span><span class="tag tag-blue">摄影灯光</span><span class="tag tag-gray">2:29</span></div>

<div class="summary-line">买多大功率的闪光灯，核心标准只有一个：你在多亮的环境下使用。暗环境（夜景/室内）几乎任何灯都能用；外景GN不低于50；大太阳下需要200瓦以上。但功率不仅是环境亮度的问题——距离决定了光的均匀度和自然感。灯光越近越不均匀、痕迹越重；灯光越远越均匀、自然感越强。拍全身照需要更远的距离→更高的功率。此外，使用光位附件（柔光箱等）会大幅衰减光线，此时功率越高越好。</div>

<div class="map"><h2>核心脉络图</h2>
<div class="diagram">
  <div class="node">拍摄环境亮度</div>
  <div class="arrow">→</div>
  <div class="node node-green">确定基础功率</div>
  <div class="arrow">→</div>
  <div class="node node-orange">距离×功率<br/>均匀度权衡</div>
  <div class="arrow">→</div>
  <div class="node">附件衰减<br/>功率越高越好</div>
</div>
</div>

<div class="card"><h3>不同场景功率参考</h3>
<table>
<tr><th>场景</th><th>推荐功率/GN</th><th>说明</th></tr>
<tr><td>夜景/暗室内</td><td>几乎任何灯均可</td><td>环境光弱，小灯也够</td></tr>
<tr><td>外景/阴天</td><td>GN≥50</td><td>需要一定压光能力</td></tr>
<tr><td>大太阳</td><td>≥200瓦</td><td>强光下压光必须大功率</td></tr>
<tr><td>肖像(1m内)</td><td>小功率可应付</td><td>距离近，但注意均匀度</td></tr>
<tr><td>全身(3m外)</td><td>需要大功率</td><td>距离远，衰减明显</td></tr>
<tr><td>使用附件</td><td>功率越高越好</td><td>附件大幅衰减光线</td></tr>
</table>
</div>

<div class="card card-green"><h3>行动清单</h3>
<ul>
<li>核心标准：评估你最常拍摄的环境亮度等级</li>
<li>全身照需求：灯离人至少3米远，功率要够大</li>
<li>有变焦功能/灯头的闪光灯优先——方头灯可控范围更大</li>
<li>使用离机闪——光位自由与机位自由同等重要</li>
<li>用附件（柔光箱等）：在预算范围内功率越高越好</li>
</ul>
</div>

<div class="card card-red"><h3>避坑总结</h3>
<ul>
<li>不要把"距离近小灯也够"作为核心标准——距离影响光均匀度</li>
<li>不要忽略全身拍摄的距离需求——灯离太近会导致脸亮腿黑、衰减明显</li>
<li>不要把灯固定在相机上——离机闪才能控制光位和距离</li>
<li>GN值和瓦数是两个概念但大致表达同一意思——变焦灯头标GN，裸灯管标瓦数</li>
</ul>
</div>

<div class="card card-orange"><h3>方法边界</h3>
<div class="boundary">
<p><strong>选灯铁律：</strong>在你能负担的情况下，功率越高越好——功率高时调小输出反而凝固性更好。</p>
<p><strong>距离法则：</strong>肖像(1m)、半身(2m)、全身(3m+)——拍摄距离越远，需要的功率越高。</p>
<p><strong>附件衰减：</strong>使用柔光箱、深抛等附件后光线衰减明显，此时小功率灯完全不够用。</p>
</div>
</div>

<div class="conclusion">
<h2>立场分层与结语</h2>
<h3>新手购买建议</h3>
<p>如果只买一支灯：GN50以上的方头机顶闪，兼顾便携和足够功率。</p>
<h3>专业需求</h3>
<p>外拍灯200瓦起，配合离机闪和光位附件，功率越高创作自由度越大。</p>
<h3>核心认知</h3>
<p>功率不仅关乎能否照亮——更关乎光的质量（均匀度、自然感）和创作自由（距离、附件）。</p>
</div></div>
