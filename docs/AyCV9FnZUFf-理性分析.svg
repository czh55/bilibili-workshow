<h1>闪光灯买多大的够用</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">摄影技巧</span> <span class="tag tag-blue">视频制作</span> <span class="tag tag-blue">灯光</span> <span class="tag tag-gray">2:29</span></div>
<div class="summary-line">买多亮的闪光灯,其实核心的标准只有一个就是你在多亮的环境下使用暗的环境下指数可以低一点夜景、悠暗的室内,几乎4个灯都能用外景的指数就要高一些,平常也不要低于50的gN大太阳底下,基本上就要200瓦奇了顺便说一下,gN值和瓦数是两个不同的概念但表达的大致是同一个意思有辨胶功能或固定胶段的或者说有个灯头...</div>
<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">买多亮的闪光灯,其实核心的标准只有一个</span></div>
<div class="timeline-item"><span class="timeline-time">[00:03]</span><span class="timeline-text">就是你在多亮的环境下使用</span></div>
<div class="timeline-item"><span class="timeline-time">[00:06]</span><span class="timeline-text">暗的环境下指数可以低一点</span></div>
<div class="timeline-item"><span class="timeline-time">[00:08]</span><span class="timeline-text">夜景、悠暗的室内,几乎4个灯都能用</span></div>
<div class="timeline-item"><span class="timeline-time">[00:12]</span><span class="timeline-text">外景的指数就要高一些,平常也不要低于50的gN</span></div>
<div class="timeline-item"><span class="timeline-time">[00:16]</span><span class="timeline-text">大太阳底下,基本上就要200瓦奇了</span></div>
<div class="timeline-item"><span class="timeline-time">[00:20]</span><span class="timeline-text">顺便说一下,gN值和瓦数是两个不同的概念</span></div>
<div class="timeline-item"><span class="timeline-time">[00:24]</span><span class="timeline-text">但表达的大致是同一个意思</span></div>
<div class="timeline-item"><span class="timeline-time">[00:27]</span><span class="timeline-text">有辨胶功能或固定胶段的</span></div>
<div class="timeline-item"><span class="timeline-time">[00:29]</span><span class="timeline-text">或者说有个灯头的闪光灯,一般主要是标gN值</span></div>
<div class="timeline-item"><span class="timeline-time">[00:34]</span><span class="timeline-text">有时也会标一下瓦数</span></div>
<div class="timeline-item"><span class="timeline-time">[00:37]</span><span class="timeline-text">裸灯管的一般支标瓦数</span></div>
<div class="timeline-item"><span class="timeline-time">[00:39]</span><span class="timeline-text">我之前的视频有聊,有兴趣的可以看一下</span></div>
<div class="timeline-item"><span class="timeline-time">[00:42]</span><span class="timeline-text">再顺便说一句,如果你是裸灯使用</span></div>
<div class="timeline-item"><span class="timeline-time">[00:45]</span><span class="timeline-text">买带有辨胶功能灯头的闪光灯</span></div>
<div class="timeline-item"><span class="timeline-time">[00:48]</span><span class="timeline-text">目前有该功能的闪光灯,一般都是机灵灯</span></div>
<div class="timeline-item"><span class="timeline-time">[00:51]</span><span class="timeline-text">会方便很多</span></div>
<div class="timeline-item"><span class="timeline-time">[00:53]</span><span class="timeline-text">有些人会提到灯光的距离</span></div>
<div class="timeline-item"><span class="timeline-time">[00:55]</span><span class="timeline-text">就是对近人拍,小闪光灯也够用</span></div>
<div class="timeline-item"><span class="timeline-time">[00:58]</span><span class="timeline-text">但我不把距离作为核心的标准,是因为距离有额外的影响</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>买多亮的闪光灯,其实核心的标准只有一个</li>
<li>就是你在多亮的环境下使用</li>
<li>暗的环境下指数可以低一点</li>
<li>夜景、悠暗的室内,几乎4个灯都能用</li>
<li>外景的指数就要高一些,平常也不要低于50的gN</li>
<li>大太阳底下,基本上就要200瓦奇了</li>
<li>顺便说一下,gN值和瓦数是两个不同的概念</li>
<li>但表达的大致是同一个意思</li>
<li>有辨胶功能或固定胶段的</li>
<li>或者说有个灯头的闪光灯,一般主要是标gN值</li>
<li>有时也会标一下瓦数</li>
<li>裸灯管的一般支标瓦数</li>
<li>我之前的视频有聊,有兴趣的可以看一下</li>
<li>再顺便说一句,如果你是裸灯使用</li>
<li>买带有辨胶功能灯头的闪光灯</li>
<li>目前有该功能的闪光灯,一般都是机灵灯</li>
<li>会方便很多</li>
<li>有些人会提到灯光的距离</li>
<li>就是对近人拍,小闪光灯也够用</li>
<li>但我不把距离作为核心的标准,是因为距离有额外的影响</li>
<li>就是光的均匀度,简单说灯光越近,越不均匀</li>
<li>灯光的痕迹越重,灯光越远</li>
<li>光亮度越均匀,自然感越强</li>
<li>看这张势力图,我们不光一般都会高于人脸</li>
<li>否则就是底光</li>
<li>所以你拍一个肖像,可以距离在1米以内</li>
<li>妹子蹲着坐着,你可以在2米左右</li>
<li>但是你要拍站着的全身,可能就得在3米之外会好一些</li>
<li>如果妹子个子越高,这个距离可能就需要越远</li>
<li>当然需要的灯的功率就越高</li>
<li>所以在多近的距离拍,很大程度上要考虑光的均匀度</li>
<li>有些朋友用指数很小的闪光灯拍全身,离得很近</li>
<li>拍出来就会觉得脸亮了,腿还是黑的</li>
<li>而且全身的衰减感觉特别明显</li>
<li>就像有个暗角,很不舒服</li>
<li>很多摄影师都不知道,距离是闪光灯打出来的光的效果</li>
<li>是不自然的一个非常重要的参数</li>
<li>光位的自由跟机位的自由,一样很重要</li>
<li>所以说我们一般用离机闪</li>
<li>如果你的闪光灯是固定在相机上</li>
<li>那你的光位可能就会受到机位的限制</li>
<li>就没有办法像我上面说的那样</li>
<li>在不同的拍摄取景下,调整不同的距离</li>
<li>我这里还没有提到过闪光灯使用复健</li>
<li>比如深拋,柔光箱等等</li>
<li>复健对光的衰减影响很大</li>
<li>这时候的标准就是有一个</li>
<li>在你能负担得起的情况下,功率越高越好</li>
<li>另外,既然你已经玩到复健了</li>
<li>也别太在乎灯的重量了</li>
<li>反正都轻松不了</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>买多亮的闪光灯,其实核心的标准只有一个就是你在多亮的环境下使用暗的环境下指数可以低一点夜景、悠暗的室内,几乎4个灯都能用外景的指数就要高一些,平常也不要低于50的gN大太阳底下,基本上就要200瓦奇了顺便说一下,gN值和瓦数是两个不同的概念但表达的大致是同一个意思有辨胶功能或固定胶段的或者说有个灯头的闪光灯,一般主要是标gN值有时也会标一下瓦数裸灯管的一般支标瓦数我之前的视频有聊,有兴趣的可以看一</p><p>转录分段: 51 | 时长: 2:29</p></div>
