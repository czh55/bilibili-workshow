      <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}.c{max-width:1200px;margin:0 auto}h1{font-size:36px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}h2{font-size:26px;font-weight:700;color:#1e40af;margin:32px 0 16px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}h3{font-size:20px;font-weight:700;color:#334155;margin-bottom:12px}p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}ul,ol{padding-left:24px;margin:8px 0}li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:6px}.tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}.tb{background:#dbeafe;color:#1e40af}.tg{background:#d1fae5;color:#065f46}.to{background:#ffedd5;color:#9a3412}.meta{margin:12px 0 20px}.sl{font-size:18px;line-height:1.7;color:#334155;padding:20px 24px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}.tl{background:#fff;border-radius:16px;padding:24px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.04)}.tl h3{color:#1e40af;margin-bottom:12px}.ti{display:flex;align-items:baseline;padding:8px 0;border-bottom:1px solid #f1f5f9}.tt{font-size:14px;font-weight:700;color:#3b82f6;min-width:70px}.tx{font-size:15px;color:#475569}.map{background:#fff;border-radius:20px;padding:36px;margin-bottom:24px;box-shadow:0 4px 24px rgba(0,0,0,.06)}.map h2{font-size:24px;margin-top:0;border-bottom:none;padding-bottom:0}.dg{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:20px 0}.n{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:16px;padding:20px 28px;text-align:center;min-width:130px;font-weight:700;font-size:15px;color:#1e40af}.ng{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}.no{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}.ar{font-size:24px;color:#94a3b8}.cor{background:linear-gradient(135deg,#fef3c7,#fef9c3);border-left:4px solid #f59e0b;padding:20px 24px;border-radius:12px;margin-bottom:24px}.cor h3,.cor p{color:#92400e}.st{font-size:22px;font-weight:700;color:#1e40af;margin-bottom:16px;padding-left:16px;border-left:4px solid #3b82f6}.card{background:#fff;border-radius:16px;padding:28px;margin-bottom:16px;box-shadow:0 4px 24px rgba(0,0,0,.06);border-left:5px solid #3b82f6}.cg{border-left-color:#10b981}.co{border-left-color:#f59e0b}.card h3{font-size:20px;font-weight:700;color:#1e40af;margin-bottom:10px}.card .ac{background:#eff6ff;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#1e40af;border-left:4px solid #3b82f6}.card .quote{background:#f8fafc;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#64748b;border-left:4px solid #cbd5e1;font-style:italic}.card .pitfall{background:#fef2f2;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#991b1b;border-left:4px solid #ef4444}.con{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:36px;margin-top:32px}.con h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}.con h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}.con p,.con li{color:rgba(255,255,255,.9);font-size:15px}.ft{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}</style>
      <div class="c"><h1>跑步送髋技术教学来喽</h1><div class="meta"><span class="tag tb">跑步技术</span><span class="tag tg">送髋</span><span class="tag to">44秒</span></div><div class="sl">核心判断：跑步增步幅不靠"迈大步"（易伤膝盖），靠<strong>髋关节主动前推</strong>。送髋产生的额外位移是每一步的隐性加速器。</div>
<div class="tl"><h3>关键时间轴</h3><div class="ti"><span class="tt">00:00</span><span class="tx">什么是送髋 → 髋部主动前推的动作</span></div><div class="ti"><span class="tt">00:04</span><span class="tx">台阶演示 → 半米外抬脚，够不到台阶</span></div><div class="ti"><span class="tt">00:14</span><span class="tx">关键动作 → 屁股前顶+身体前倾，脚自然到位</span></div><div class="ti"><span class="tt">00:22</span><span class="tx">原理总结 → 多出的距离=送髋的额外位移</span></div><div class="ti"><span class="tt">00:29</span><span class="tx">三个训练动作 → 台阶上步+侧摆腿+阻力提膝</span></div></div>
<div class="map"><h2>核心脉络</h2><div class="dg"><div class="n">如何增加步幅？</div><span class="ar">→</span><div class="n no">常见错误：迈大步（小腿前伸）</div><span class="ar">→</span><div class="n no">后果：膝盖超伸受伤</div><span class="ar">→</span><div class="n ng">正确方法：送髋（臀部前推）</div><span class="ar">→</span><div class="n ng">结果：安全增步幅</div></div></div>
<div class="cor"><h3>核心认知纠偏</h3><p>很多人想跑快就"迈大步"，把小腿往前甩。这是最常见的跑步伤痛来源——膝盖在超伸状态下承受冲击。教练的台阶演示揭示：<strong>步幅增加应该来自髋关节前推，不是小腿前伸</strong>。屁股往前顶一寸，整条腿就往前送了一寸，而膝盖不需要超伸。</p></div>
<div class="card"><h3>原理：台阶演示直观理解送髋 [00:04-00:22]</h3><p>站在台阶半米外，抬起腿，脚够不到台阶。然后<strong>屁股往前顶+身体前倾</strong>——脚自然放到了台阶上。这多出来的距离就是送髋的贡献。</p><div class="quote">原文依据："将腿抬起来，屁股往前顶，身体往前倾，这个时候我们就发现，我们的腿放到台阶上了"。</div><div class="ac">关键洞察：不是用腿去够台阶，而是用髋部的位移把腿"送"上去。</div></div>
<div class="card cg"><h3>训练一：台阶上步 [00:32]</h3><p>左右腿各 15 次 × 4 组。模拟送髋发力模式的最直接专项训练。每次上步时主动用髋部驱动而非大腿发力。</p></div>
<div class="card"><h3>训练二：扶墙侧摆腿 [00:35]</h3><p>左右腿各 10 次 × 4 组。训练髋关节外展肌群，提升髋部侧向稳定性。跑步时髋部不稳会导致骨盆晃动，能量白白损失。</p></div>
<div class="card cg"><h3>训练三：阻力提膝 [00:38]</h3><p>左右腿各 15 次 × 4 组。强化髋屈肌（髂腰肌）力量。这是送髋动作中"把腿往前送"的主力肌肉。</p></div>
<div class="card co"><h3>常见误区与避坑</h3><ul><li><strong>迈大步≠送髋</strong>：迈大步是小腿前伸，送髋是髋关节前推。前者伤膝盖，后者安全。</li><li><strong>只练腿不练髋</strong>：很多人做深蹲和腿举但从不练髋屈肌——跑步的核心肌群反而被忽略了。</li><li><strong>送髋≠挺肚子</strong>：送髋是髋关节前后平移，不是腰椎后仰（挺肚子）。核心要收紧。</li></ul></div>
<div class="con"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>送髋是用髋关节主动前推来增加步幅，不是迈大步</li><li>台阶演示直观展示了送髋产生的额外位移</li><li>三个动作（台阶上步+侧摆腿+阻力提膝）每周练 2-3 次</li></ul><h3>行动清单</h3><ol><li>下次跑步前先在台阶上感受 2 组送髋动作（半米外抬脚→屁股前顶→脚上台阶）</li><li>每周安排 2 次送髋专项训练：台阶上步 15×4 + 侧摆腿 10×4 + 阻力提膝 15×4</li><li>跑步时有意识地感受髋部前推的动作，不要用小腿代替</li></ol><h3>关键认知转变</h3><p>从"跑快就要迈大步"到"跑快要靠髋部往前送"——步幅来自髋关节推力，不是小腿伸展力。</p></div><div class="ft">原视频 · 小红书 · 跑步送髋技术教学</div></div>
