<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1413" viewBox="0 0 1320 1413">
  <foreignObject x="0" y="0" width="1320" height="1413">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&amp;display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans SC',-apple-system,sans-serif}.container{width:1240px;padding:40px 40px 60px}h1{font-size:30px;font-weight:700;color:#1a1a1a;margin-bottom:8px}.meta{font-size:13px;color:#999;margin-bottom:8px}.tags{margin-bottom:20px}.tag{display:inline-block;background:#fdf2f2;color:#c0392b;padding:3px 10px;border-radius:12px;font-size:12px;margin-right:8px}.summary-line{background:#fff5f5;border-left:4px solid #e74c3c;padding:12px 16px;margin-bottom:28px;font-size:15px;color:#555;line-height:1.7}h2{font-size:20px;font-weight:600;color:#c0392b;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid #e74c3c;display:inline-block}.comparison{display:flex;gap:20px;margin:16px 0}.comp-card{flex:1;padding:18px;border-radius:12px;font-size:14px;line-height:1.8}.bad{background:#fff5f5}.bad h4{color:#c0392b}.good{background:#e8f5e9}.good h4{color:#2e7d32}.comp-card h4{font-size:16px;font-weight:600;margin-bottom:8px}.comp-card p{color:#555}.principle{background:#faf8f5;padding:20px 24px;border-radius:12px;margin:16px 0;font-size:14px;color:#555;line-height:1.9}.conclusion{background:linear-gradient(135deg,#fdf2f2,#fff5f5);padding:20px 24px;border-radius:8px;margin-top:28px;font-size:14px;color:#555;line-height:1.8}.conclusion strong{color:#c0392b}</style>
      <div class="container"><h1>30秒找到拉花不好看的原因</h1><div class="meta"><span>来源：小红书</span><span>时长：22秒</span><span>类型：常见问题诊断</span></div><div class="tags"><span class="tag">奶缸回退</span><span class="tag">图案饱满</span><span class="tag">新手问题</span></div><div class="summary-line"><strong>一句话总结：</strong>拉花图案细长不好看，原因是奶缸在释放流量时不自觉地向后退。修正方法是——杯子回震时奶缸反而向中心点靠近，让图案更饱满。</div><h2>问题 vs 修正</h2>
<div class="comparison"><div class="comp-card bad"><h4>❌ 奶缸后退</h4><p>杯子回震 → 手本能地跟着往后拉<br/>奶缸位移方向 = 杯子后退方向<br/>结果：图案被拉长、细窄、不好看</p></div><div class="comp-card good"><h4>✅ 奶缸前靠</h4><p>杯子回震 → 奶缸反而往中心点推进<br/>奶缸位移方向 = 朝向杯子中心<br/>结果：图案集中、饱满、完成度高</p></div></div>
<h2>动作本质</h2><div class="principle">拉花时两只手的协调运动：<br/><strong>左手（杯子）</strong>：随着拉花进程逐渐回震（往后、往下倾斜）<br/><strong>右手（奶缸）</strong>：不能跟着退，要<strong>相对向左手的中心点运动</strong><br/><br/>这本质上是<strong>相对运动</strong>——两只手不能同方向移动。杯子退的时候，奶缸不能退，反而要往中心靠。画图的关键就是控制注入点始终在杯中合适的位置。</div>
<div class="conclusion"><strong>练功方向：</strong>下次拉花时，刻意关注奶缸的位置。杯子回震时——稳住右手不要跟着退，甚至可以主动往中心点靠近一点。图案是否饱满，就取决于这个细节。</div></div>
    </div>
  </foreignObject>
</svg>