.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>形状有多重要</h1>
  <div class="meta"><span class="tag tag-blue">不稳定三角</span><span class="tag tag-green">负形</span><span class="tag tag-orange">正形</span><span class="tag tag-purple">动感</span><span class="tag tag-red">构图</span><span class="tag tag-gray">时长 161秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/88qKJVoiHzj">原视频</a>
  <div class="summary-line">远看乱常因缺统一形状。不稳定三角天生动感，可用于鸟群、队列、救灾。负形是空隙刻刀，挤压正形更有力，也能引导视线、制造包裹与优雅动势。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">细节满远看乱</span></div><div class="timeline-item"><span class="timeline-time">00:09</span><span class="timeline-text">因为形状</span></div><div class="timeline-item"><span class="timeline-time">00:29</span><span class="timeline-text">倾斜不稳定三角</span></div><div class="timeline-item"><span class="timeline-time">00:44</span><span class="timeline-text">指示点一：三角动感</span></div><div class="timeline-item"><span class="timeline-time">00:56</span><span class="timeline-text">海鸥斜三角阵</span></div><div class="timeline-item"><span class="timeline-time">01:24</span><span class="timeline-text">负形＝空隙</span></div><div class="timeline-item"><span class="timeline-time">01:37</span><span class="timeline-text">指示点二：负形强化</span></div><div class="timeline-item"><span class="timeline-time">02:08</span><span class="timeline-text">弹琴负形挤压</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>细节散</div><span class="arrow">→</span><div class="node-green">三角<br/>动感</div><span class="arrow">→</span><div class="node-orange">负形<br/>刻刀</div><span class="arrow">→</span><div class="node-blue">作业<br/>二选一</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>画名《夯歌》按画面自证；ASR「打撼／附形」→「打夯／负形」。</p><p>误区：细节越多越好。远看乱说明缺形。</p><p>误区：只画人忽略空隙。负形是主动设计。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>乱在缺形</h3>
      <p>细节满满远看乱，因为忽视形状。</p>
      <div class="quote">因为你忽视了它 形状</div>
      <div class="relation">先形后繁。</div>
    </div>
    <div class="card card-orange">
      <h3>不稳定三角</h3>
      <p>倾斜三角天生动感；海鸥／队列／救灾可复用。</p>
      <div class="quote">多用不稳定的三角形</div>
      <div class="relation">动势可组阵。</div>
    </div>
    <div class="card card-red">
      <h3>负形是刻刀</h3>
      <p>空隙主动挤压雕刻正形轮廓。</p>
      <div class="quote">用附形的力量强化正形</div>
      <div class="relation">术语取负形。</div>
    </div>
    <div class="card card-purple">
      <h3>负形也能叙事</h3>
      <p>方向引导温情；背景负形包裹；侧向大负形推优雅上升。</p>
      <div class="quote">这就是附形的魅力</div>
      <div class="relation">空隙有表情。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>作业</p>
      <div class="quote">用不稳定三角或负形强化正形，拍／画一张。</div>
      <div class="relation">评论区等着你的美照</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>开场画名《夯歌》与打夯劳动画面一致。</li><li>短片两点指示，非形状学全书。</li><li>课宣日期以口播为准。</li></ul><div class="pitfall">三角画成稳定正置失去动感。</div><div class="pitfall">负形碎片化无方向。</div><div class="pitfall">正负形抢戏面积接近。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>形状优先于细节</li><li>三角推动势</li><li>负形强化正形</li></ul><h3>行动清单</h3><ol><li>远看作品只描外轮廓三角</li><li>海鸥或人群组一斜三角阵小稿</li><li>给人物空隙涂色检查负形</li><li>交作业并标注用了哪一招</li></ol><h3>关键认知转变</h3><p>以前：加细节治乱；现在：先统一形状与负形，细节才附着得住。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 161秒</div>
</div>
    </div>
  </foreignObject>
</svg>