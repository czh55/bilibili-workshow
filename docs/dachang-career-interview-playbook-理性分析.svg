      <div class="container root-wrap">
  <h1>大厂应届选岗与面试打法：阿里 / 小米对照</h1>
  <div class="meta"><span class="tag tag-blue">校招</span><span class="tag tag-green">选岗</span><span class="tag tag-orange">阿里</span><span class="tag tag-purple">小米</span><span class="tag tag-red">面试</span><span class="tag tag-gray">截图专题</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="#">personal:dachang-career-interview-playbook</a>
  <div class="summary-line">三条线合一：用性格特质选赛道（而非岗位虚名）；大厂面试按轮次换剧本——一面验真、二面 Owner、三面格局、四面闻味道；阿里偏客户第一与业务迁移，小米偏务实、人车家与发烧友/厚道。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">选岗1-2</span><span class="timeline-text">三类人 ↔ 岗位；警惕算法/策略产品/数据分析虚名</span></div><div class="timeline-item"><span class="timeline-time">选岗3-5</span><span class="timeline-text">研发要长期深耕；运营勿轻视；产品数据项目稳健</span></div><div class="timeline-item"><span class="timeline-time">选岗6-8</span><span class="timeline-text">实习底牌；AI/信创/AI运营赛道；简历按 JD 定制</span></div><div class="timeline-item"><span class="timeline-time">阿里1-2</span><span class="timeline-text">骨干验货 STAR；主管看 Owner 与业务规划</span></div><div class="timeline-item"><span class="timeline-time">阿里3-4</span><span class="timeline-text">总监看格局与价值观；HRG 闻味道</span></div><div class="timeline-item"><span class="timeline-time">小米1-4</span><span class="timeline-text">同构四轮 + 人车家 / 发烧友精神 / 厚道</span></div><div class="timeline-item"><span class="timeline-time">反问</span><span class="timeline-text">3-6 月优先价值；好 vs 出色；小米「和用户交朋友」</span></div></div>
  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">认清自己</div><span class="arrow">→</span><div class="node-green">选赛道</div><span class="arrow">→</span><div class="node-orange">一面验真</div><span class="arrow">→</span><div class="node">二三四面</div></div></div>
  <div class="correction"><h3>常见误解与认知纠偏</h3><p>· 素材为小红书聊天截图整理，非官方校招手册；战略表述（全球化/云/AI、人车家）以求职时官网为准。</p><p>· 「皮实」按原文保留，释义为抗压、韧劲。</p><p>· HRG（政委）为阿里语境称呼；小米四面为 HR 匹配面。</p><p>· 高红利赛道（AI/信创/AI运营）是截图观点，非投资建议。</p></div>
  <div class="section"><h2 class="sec-title">观点拆解</h2><div class="card"><h3>核心命题：适配 &gt; 虚名；每轮换剧本</h3><p>选岗看性格与抗压，不看岗位名气；面试看面试官角色，不看背诵稿。</p><div class="quote">互联网岗位没有绝对的好坏，只有适配与否</div><div class="relation">可验证：原文收束句。</div></div><div class="card card-orange"><h3>三类人 → 三类岗</h3><p>技术钻研→研发算法测试；逻辑统筹→产品项目；外向落地→运营市场商务。专业对口次于特质匹配。</p><div class="quote">性格特质和岗位匹配度，远比专业对口更重要</div><div class="relation">行动：先自测再投。</div></div><div class="card card-green"><h3>一面：验货 / 扣细节</h3><p>阿里骨干与小米同事都在验经历真实性。STAR、数据、个人贡献、落地案例是共同解。</p><div class="quote">验货……经不起追问</div><div class="relation">差异：阿里强调快速解题；小米强调动手解决小问题与务实。</div></div><div class="card card-purple"><h3>二面：Owner / 业务思维</h3><p>主管面挂在执行层。要有「发现问题→推动落地」案例，以及领域基本认知。</p><div class="quote">缺乏 Owner 意识 / 产品感</div><div class="relation">硬件补供应链品控；软件补体验与数据驱动。</div></div><div class="card card-red"><h3>三面格局 + 四面味道</h3><p>三面挂在格局与价值观；四面挂在不稳定、不真实、不匹配。反问用来摸紧急需求与卓越标准，勿谈薪假。</p><div class="quote">终极闻味道 / 找同道中人</div><div class="relation">阿里：客户第一；小米：极致性价比、发烧友、厚道。</div></div></div>
  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>个人经验分享整理，不构成录用承诺或薪资预测。</li><li>大厂流程因 BG/年份而异，以实际面试安排为准。</li><li>「普通本科难碰核心项目」是截图判断，个体差异大。</li></ul><h3>避坑</h3><ul><li>一份简历通投技术+产品+运营。</li><li>四面用同一套项目故事不换角度。</li><li>匹配面问薪资假期。</li><li>只追算法岗名却耐不住长期打磨。</li><li>轻视运营却又想快速出成果。</li></ul></div></div>
  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>适配优先：三类人对应三类岗</li><li>一面验真、二面 Owner、三面格局、四面味道</li><li>反问问紧急价值与卓越差距</li></ul><h3>行动清单</h3><ol><li>写「适配/不碰」岗位清单各 3 个</li><li>每目标岗一份定制简历</li><li>1～2 个项目练到扛三层追问</li><li>阿里补业务迁移；小米补人车家与文化共鸣</li><li>尽早实习验证赛道</li></ol><h3>关键认知转变</h3><p>以前：追高大上岗名、一套话术打四轮；现在：按特质选赛道，按面试官角色换剧本，用反问确认需求与卓越标准。</p></div>
  <div class="footer">双轨产物之二 · 理性分析 · 证据来自截图全文整理</div>
</div>
    </div>
  </foreignObject>
</svg>