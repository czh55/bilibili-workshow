<div class="container root-wrap">
  <h1>一些审美启发～穿搭/软装/p图/拍照</h1>
  <div class="meta"><span class="tag tag-blue">审美</span><span class="tag tag-blue">穿搭</span><span class="tag tag-blue">家居</span><span class="tag tag-blue">拍照姿势</span><span class="tag tag-blue">修图</span><span class="tag tag-blue">小红书</span><span class="tag tag-gray">时长 3:09</span></div>
  <a class="source-link" href="http://xhslink.cn/o/3iE6ecsaYjI">原视频链接</a>
  <div class="summary-line">从穿搭撞色、墨镜比例、家居软装到自拍道具与手帐记录，提炼小面积高对比的生活审美方法。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">配饰背景撞色</span></div><div class="timeline-item"><span class="timeline-time">00:30</span><span class="timeline-text">大框墨镜</span></div><div class="timeline-item"><span class="timeline-time">00:45</span><span class="timeline-text">花盆包布</span></div><div class="timeline-item"><span class="timeline-time">01:18</span><span class="timeline-text">双机自拍</span></div><div class="timeline-item"><span class="timeline-time">01:35</span><span class="timeline-text">橘黄小灯</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">豹纹桌垫手帐</span></div></div>
  <div class="section"><div class="sec-title">观点拆解</div><div class="card"><h3>核心命题：小面积撞色决定出片率</h3><div class="highlight">基础色是底，亮色配饰 + 撞色背景才是记忆点。</div><div class="action">拍照前先找：身上最小的高饱和色块在哪里。</div></div><div class="card"><h3>穿搭：配饰可以修正比例</h3><div class="quote">高眼位 + 复古大框墨镜 = 比例更和谐。</div><div class="pitfall">只有托盘没有桌垫，容易拍出食堂吃饭感。</div></div><div class="card"><h3>软装：低成本换肤</h3><div class="action">花盆包布、彩色壁灯、波点桌垫都属于小改大变化。</div></div><div class="card"><h3>记录：手帐式拼图</h3><div class="highlight">一天的事、食、景、自拍放进一张图，比单发更有故事感。</div><div class="pitfall">豹纹包难搭时，浅蓝是较稳妥的配色方向。</div></div></div>
  <div class="conclusion"><h2>行动清单</h2><ul><li>穿基础色出门时，刻意选一块与配饰撞色的拍照背景</li><li>给旧花盆或花瓶包一块喜欢的布，试一次「换皮肤」</li><li>双机自拍时固定加入墨镜和耳机两个道具</li><li>用拼图 + 抠图做一天的生活手帐记录</li></ul>
  <h2>适用边界</h2><p>软装与配色参考偏个人家居条件；墨镜是否适合高眼位、豹纹与浅蓝搭配需结合肤色与单品材质，手帐记录方式可按自己审美简化。</p></div>
  <div class="footer">双轨产物之二 · SVG 理性分析 · http://xhslink.cn/o/3iE6ecsaYjI</div>
