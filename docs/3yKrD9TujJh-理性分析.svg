<div class="card"><h3>内容要点</h3><ul><li>今天分别教大家画一下圆眼和长眼的眼妆</li>
<li>一个视频先为大家两种眼妆教程</li>
<li>那就让我们开始吧</li>
<li>其实我的眼睛是有点大小眼的</li>
<li>这样可能看不太出来</li>
<li>镜像给大家看一下</li>
<li>左眼会更偏长一点</li>
<li>右眼会更偏远一些</li>
<li>所以今天就用长眼画圆眼</li>
<li>圆眼画长眼</li>
<li>就更有对比效果</li>
<li>咱们先从圆眼开始</li>
<li>画眼妆可以注重三条线</li>
<li>上眼形和臥残</li>
<li>既然画圆眼</li>
<li>那三条线的形状也是要偏圆虎状的</li>
<li>先为一个浅色以一个半圆给我们眼皮打底</li>
<li>包括下眼间也是画圆眼打底</li>
<li>再用一个灰色系的颜色</li>
<li>从睫毛根部画起</li>
<li>以一个小半圆画在双眼皮上方</li>
<li>然后从眼尾和眉尾连一条线</li>
<li>延长下来</li>
<li>运染在下眼尾</li>
<li>让眼尾也更显远一些</li>
<li>再用深色加深在睫毛根部</li>
<li>让上眼形更外扩</li>
<li>到眼尾的时候平脱一点出来</li>
<li>继续运染刚刚下眼尾的位置</li>
<li>然后用比深色浅一举举举的深灰色</li>
<li>把下眼间的中间部分往下画圆</li>
<li>然后笑一下</li>
<li>找到握残中间</li>
<li>以它为最低点</li>
<li>分别向前后运染成一个半圆状</li>
<li>长度不要太长了</li>
<li>比眼珠长一点点就OK了</li>
<li>再用淡色只提亮在握残的正中间</li>
<li>用深色把眼角也画圆一些</li>
<li>连接到下眼间来</li>
<li>如果想要圆眼更有立体感</li>
<li>就用深灰色运染在眼头和眼尾</li>
<li>让整个基础眼型都是成圆状的</li>
<li>然后夹好睫毛</li>
<li>刷好睫毛打底</li>
<li>填内眼线的时候只填在眼中间这一段</li>
<li>让眼珠更圆更有神</li>
<li>贴睫毛的时候就选择这种竖直款的睫毛</li>
<li>贴完之后就会纵向拉长眼型</li>
<li>包括下睫毛也是竖直款的</li>
<li>而且下睫毛贴的时候</li>
<li>可以适当离睫毛根部往下贴一点</li>
<li>就会有下拉延剪下肢的效果</li>
<li>也会显得眼睛更圆</li>
<li>最后用中似的眼线胶比</li>
<li>再加深一下内眼角</li>
<li>眼线部分就可以画短画翘一点</li>
<li>然后从下睫毛后面连接上去</li>
<li>眼睛居也选择有扩同效果</li>
<li>且颜色深一点的</li>
<li>就会显得眼睛大大的圆圆的</li>
<li>眉毛也是需要一个偏圆偏柔感的形状</li>
<li>所以眉中间是最高的两端微微下落</li>
<li>再用染眉高染眉和眼妆统一色调</li>
<li>还有腮红的细节</li>
<li>也是尽量画成团状的</li>
<li>还可以在眼窝和眼尾处加一点</li>
<li>让眼周也是看起来圆糊糊的</li>
<li>更强调了妆容的显嫩剪灵的属性</li>
<li>然后就是长眼的画法</li>
<li>所以这三条线就要更偏直</li>
<li>更偏长一些</li>
<li>先用浅色以一个平行四边形去打底</li>
<li>下眼剪就平直着打底</li>
<li>再用灰色调从睫毛根部运染</li>
<li>一直橫向运染到眼尾</li>
<li>还有也是在双眼皮上方</li>
<li>下眼剪也是平直着往后连接到上眼尾</li>
<li>然后用深色从眼尾平拉</li>
<li>拉到和眉尾差不多的长度</li>
<li>然后用细刷子在眼角画出一个睿角</li>
<li>眼节下致呢就从后眼尾连接到上眼尾</li>
<li>记得上下眼尾可以流出一点空隙</li>
<li>眼中就会更有透气感</li>
<li>前半段下眼界也是画平</li>
<li>再用深灰色同样也是找到臥残中间这一点</li>
<li>先平直着往前加深臥残</li>
<li>到眼尾就拐上去</li>
<li>然后用淡色只提亮臥残的前半段</li>
<li>继续用深灰色加深上下眼尾</li>
<li>这样就会更强调我们的眼形</li>
<li>往后延伸的拉长感</li>
<li>同样加睫毛刷好睫毛</li>
<li>填补内眼线就是指填在前中段</li>
<li>下睫毛也是贴这种横向感</li>
<li>更重的斜肥款睫毛</li>
<li>下睫毛同理也是贴斜肥款</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>今天分别教大家画一下圆眼和长眼的眼妆一个视频先为大家两种眼妆教程那就让我们开始吧其实我的眼睛是有点大小眼的这样可能看不太出来镜像给大家看一下左眼会更偏长一点右眼会更偏远一些所以今天就用长眼画圆眼圆眼画长眼就更有对比效果咱们先从圆眼开始画眼妆可以注重三条线眉毛上眼形和臥残既然画圆眼那三条线的形状也是要偏圆虎状的先为一个浅色以一个半圆给我们眼皮打底包括下眼间也是画圆眼打底再用一个灰色系的颜色从睫毛根部</p><p>转录分段: 133 | 时长: 4:00</p></div>
