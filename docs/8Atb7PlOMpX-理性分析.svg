.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.conclusion ul,.conclusion ol{padding-left:24px;margin:8px 0}
.boundary{background:#faf8f5;padding:20px 24px;border-radius:12px;margin:16px 0;font-size:14px;color:#555;line-height:1.9}</style>
      <div class="container">
    <h1>竖屏视频黄金区一眼看懂📱✨</h1>
    <div class="meta">
      <span class="tag tag-gray">小红书</span>
      <span class="tag tag-blue">时长 1:08</span>
      <span class="tag tag-green">理性分析</span>
    </div>
    <div class="summary-line"><strong>核心命题：</strong>竖屏视频中哪里是观众眼睛停留最多的"黄金区域"？如何在拍摄和剪辑时刻意保留这个区域，避免被 UI 元素遮挡？</div>
    <div class="map"><h2>核心脉络图</h2><div class="diagram"><div class="node"><strong>问题</strong><br/><span style="font-size:13px;display:block;margin-top:6px;white-space:pre-line;color:#475569;font-weight:400">竖屏视频的"黄金区"在哪里？
哪些区域容易被 UI 遮挡？</span></div><<div class="node node-orange"><strong>证据</strong><br/><span style="font-size:13px;display:block;margin-top:6px;white-space:pre-line;color:#475569;font-weight:400">75% 的用户在竖屏看视频
字幕要放在底部但必须避开 UI 区
眼睛应该在上三分线位置</span></div>d<div class="node node-orange"><strong>判断</strong><br/><span style="font-size:13px;display:block;margin-top:6px;white-space:pre-line;color:#475569;font-weight:400">竖屏视频有三个关键区域需要规划：
视觉焦点区、字幕安全区、UI 避让区</span></div>i<div class="node node-green"><strong>行动</strong><br/><span style="font-size:13px;display:block;margin-top:6px;white-space:pre-line;color:#475569;font-weight:400">眼睛放在上三分线→字幕放在安全区
→避开底部 UI（点赞/评论/分享）</span></div>v</div></div>
    <h2>观点卡片</h2>
    <div class="card"><h3>核心洞察：竖屏视频有三层空间需要规划</h3><p>视频指出竖屏画面不是均匀分布的：上半部分是视觉焦点区（眼睛应该在这里），中间是字幕安全区，底部会被平台的点赞/评论/分享 UI 遮挡。如果不规划这三层空间，关键内容可能被界面元素盖住。</p><div class="quote">「你的眼睛应该在这里，不管从哪个角度拍」[00:51-00:55]</div></div>
<div class="card card-green"><h3>三区规划法则</h3><p><strong>上1/3（视觉焦点区）</strong>：人物眼睛应该在这个高度——这是观众本能注视的位置。<br/><strong>中1/3（字幕安全区）</strong>：字幕放在这里，但不能超过底部的安全线。<br/><strong>下1/3（UI 避让区）</strong>：平台的点赞、评论、分享按钮会覆盖这个区域——永远不要把重要内容放在这里。</p><div class="highlight">75% 的用户在竖屏状态下观看视频，所以竖屏的三区规划比横屏更关键。</div></div>
<div class="card card-red"><h3>常见误区：把重要内容放在底部</h3><p>很多创作者把字幕、关键文字或人物放在画面底部——结果被点赞和评论按钮完美遮挡。这是竖屏创作中最常见的"无效设计"：内容做出来了，但观众看不到。</p><div class="pitfall">避坑：发视频前在手机上预览一遍，检查底部 UI 是否遮挡了字幕或其他关键内容。</div></div>
    <h2>横向对比</h2><table><tr><th>画面区域</th><th>应该放什么</th><th>不应该放什么</th><th>原因</th></tr><tr><td>上1/3</td><td>人物眼睛、关键视觉焦点</td><td>字幕、复杂背景</td><td>观众视线天然停留区</td></tr><tr><td>中1/3</td><td>字幕、辅助信息</td><td>重要人物面部</td><td>安全区，不被 UI 遮挡</td></tr><tr><td>下1/3</td><td>留白、氛围画面</td><td>字幕、人物、关键文字</td><td>被点赞/评论/分享按钮遮挡</td></tr><tr><td>裁切区（最边缘）</td><td>不要放任何内容</td><td>所有内容</td><td>不同手机屏幕比例可能裁掉</td></tr></table>
    <h2>行动清单</h2><ol><li>拍摄时刻意调整构图，让眼睛落在画面上 1/3 的位置</li><li>字幕位置设置在画面上 2/3 处附近，绝对不要低于安全线</li><li>发布前在手机上用竖屏模式预览，检查底部 UI 是否遮挡内容</li><li>为不同平台准备不同的画面布局——抖音和小红书的 UI 位置不同</li></ol>
    <h2>避坑总结</h2><div class="card card-red"><ul><li>字幕太靠近底部→被点赞按钮遮挡→往上移到画面 2/3 位置</li><li>人物在画面正中→眼睛不在上三分线→看起来"不够舒服"</li><li>忽略不同手机屏幕比例→边缘内容被裁切→留出安全边距</li><li>横屏素材直接裁切为竖屏→关键画面被切掉→需要重新构图或使用关键帧跟随</li></ul></div>
    <h2>方法边界</h2><div class="boundary"><strong>适用</strong>：抖音、小红书、视频号等竖屏短视频平台。<br/><strong>需注意</strong>：不同平台的 UI 布局略有不同（小红书底部是点赞收藏评论、抖音偏右下角），需要针对性调整。<br/><strong>不适用</strong>：横屏视频（B站、YouTube）不适用竖屏三区法则。</div>
    <div class="conclusion">
    <h2>总结与认知转变</h2>
    <h3>核心要点</h3>
    <ul><li>竖屏画面分三层：上1/3视觉焦点、中1/3字幕安全区、下1/3 UI避让区</li><li>人物眼睛永远放在上三分线位置——这是最舒服的视觉焦点</li><li>发布前一定要在手机上预览，确认底部 UI 不遮挡内容</li></ul>
    <h3>行动清单</h3>
    <ol><li>眼睛上三分线</li><li>字幕不超安全线</li><li>底部留白给UI</li><li>手机预览确认</li></ol>
    <h3>认知转变</h3>
    <p>从「拍完就发」转变为「为竖屏观看体验而构图」</p>
  </div>
