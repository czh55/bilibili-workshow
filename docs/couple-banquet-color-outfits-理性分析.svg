<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="8181" viewBox="0 0 1320 8181">
  <foreignObject x="0" y="0" width="1320" height="8181">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
*{margin:0;padding:0;box-sizing:border-box}
