.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style><div class="container">
<h1>拍照姿势一定要选对‼️</h1>
<div class="meta">
<span class="tag tag-blue">拍照姿势</span><span class="tag tag-green">人像</span><span class="tag tag-orange">构图</span><span class="tag tag-gray">0:20</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>4个拍照场景姿势选对：①回头照身子朝前<strong>慢回头给四分之三侧脸</strong>；②蹲拍<strong>微微侧身、眼神往下看</strong>；③站拍<strong>手叉胯、一只脚往前伸</strong>；④半身<strong>假装摸头发、微微歪头</strong>。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">回头照：别硬回头 → 身子朝前、慢回头给四分之三侧脸</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">蹲着拍：别正面蹲 → 微微侧身、眼神往下看</span></div><div class="timeline-item"><span class="timeline-time">00:10</span><span class="timeline-text">站着拍：别直站 → 手叉胯、一只脚往前伸</span></div><div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">半身照：别干拍 → 假装摸头发、微微歪头</span></div></div>
<div class='section'><div class='sec-title'>4个场景的“选对”</div><div class='card'><h3>① 回头照</h3><p><strong>错：</strong>直接扭过头。<br/><strong>对：</strong><strong>身子朝前</strong>，<strong>慢慢回头</strong>，给到<strong>四分之三的侧脸</strong>——回头有过程，侧脸比正脸更上镜。</p></div><div class='card card-green' style='margin:12px 0'><h3>② 蹲着拍</h3><p><strong>错：</strong>正面蹲着。<br/><strong>对：</strong><strong>微微侧身</strong>，<strong>眼神往下看</strong>——侧蹲+垂眼，显瘦又有氛围。</p></div><div class='card card-orange' style='margin:12px 0'><h3>③ 站着拍</h3><p><strong>错：</strong>直挺挺站着。<br/><strong>对：</strong><strong>手叉胯</strong>，<strong>一只脚往前伸</strong>——手有支点，脚有延伸，比例立刻拉长。</p></div><div class='card card-purple'><h3>④ 半身照</h3><p><strong>错：</strong>干站着拍半身。<br/><strong>对：</strong><strong>假装摸头发</strong>，<strong>微微歪头</strong>——手上戏+头有角度，半身照立刻生动。</p></div></div>
<div class="conclusion">
<h2>姿势选对清单</h2>
<h3>四条纠错口诀</h3><ol><li><strong>回头</strong>：身子朝前，慢回头，四分之三侧脸</li><li><strong>蹲</strong>：微微侧身，眼神往下看</li><li><strong>站</strong>：手叉胯，一脚往前伸</li><li><strong>半身</strong>：假装摸头发，微微歪头</li></ol><h3>底层逻辑</h3><ul><li>永远给<strong>侧身角度</strong>，别正面怼镜头</li><li>手永远有<strong>动作</strong>（叉胯/摸发），别干垂着</li></ul>
</div>
