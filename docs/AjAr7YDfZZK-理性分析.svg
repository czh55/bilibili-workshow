      <div class="container">
<h1>详解索尼PP值（下）</h1>
<div class="meta"><span class="tag tag-blue">视频制作</span><span class="tag tag-green">索尼相机</span><span class="tag tag-purple">色彩管理</span> <span class="tag tag-blue" style="opacity:0.7">11:10</span></div>
<div class="summary-line">下集覆盖曝光监看、白平衡、黑色等级、黑伽马、拐点、色彩模式与细节设置。核心结论：斑马线+直方图双监看，伽马与色彩模式要成对选择，拐点慎用，细节推荐+7。</div>

<div class="map"><h2>核心逻辑图</h2><div class="diagram"><div class="node node-orange"><strong>曝光监看</strong><br/><span style="font-size:12px;color:#64748b">斑马线59±2
(过曝2档)
93+(开始过曝)</span></div><div class="arrow">→</div><div class="node node"><strong>白平衡</strong><br/><span style="font-size:12px;color:#64748b">自动→标准
复杂光→手动</span></div><div class="arrow">→</div><div class="node node-green"><strong>暗部控制</strong><br/><span style="font-size:12px;color:#64748b">黑色等级不调
黑伽马宽+7</span></div><div class="arrow">→</div><div class="node node"><strong>色彩模式</strong><br/><span style="font-size:12px;color:#64748b">伽马&amp;色域
成对选择</span></div><div class="arrow">→</div><div class="node node-green"><strong>细节锐化</strong><br/><span style="font-size:12px;color:#64748b">+7 手动模式
Crispening不开</span></div></div></div>

<div class="card card-green"><h3>深度解读</h3>
<div class="quote">拐点测试下来，它不仅不会增加更多高光细节，反而会将高光直接抹平，并且后期无法恢复。目前我发现它唯一的用途是在拍摄日出日落这种光比很大的场景。</div>
<div class="highlight">S-Gamut3.Cine虽然色域略窄于S-Gamut3，但被微单完整支持、色彩转换更容易，是更实用的选择；A-Roll/采访人物类推荐用S-Cinetone色域。</div>
<div class="pitfall">默认PP值的拐点都是&quot;自动&quot;——但只有伽马设为Movie时自动拐点才生效，其他模式下自动拐点等于没开！</div>
</div>

<div class="card card-purple"><h3>关键参数对比</h3>
<table><tr><th>参数</th><th>推荐设置</th><th>原因</th></tr>
<tr><td>黑色等级</td><td>不改</td><td>只让黑色发灰，不增细节</td></tr>
<tr><td>黑伽马</td><td>宽/范围/+7</td><td>自然提升暗部</td></tr>
<tr><td>拐点</td><td>一般不用/手动关</td><td>微单上会抹平高光</td></tr>
<tr><td>色彩模式(S-Log)</td><td>S-Gamut3.Cine</td><td>兼容性好、易调色</td></tr>
<tr><td>细节</td><td>+7 手动</td><td>锐度提升明显</td></tr>
<tr><td>Crispening</td><td>不开</td><td>开了不如不开</td></tr></table>
</div>

<div class="card"><h3>行动清单</h3>
<ol><li>S-Log3设置斑马线：自定义1=59±2（过曝2档），自定义2=93+（高光警戒）</li><li>伽马和色彩模式必须配套：S-Cinetone伽马→S-Cinetone色域；HLG→BT.2020</li><li>黑色等级不动，黑伽马用宽范围+7</li><li>细节改手动模式，等级+7，高亮细节4，VH/BW平衡默认</li><li>达芬奇中用色彩空间转换或阿莱LUT完成S-Log→709还原</li></ol>
</div>

<div class="card card-red"><h3>避坑总结</h3>
<ul><li>忘关拐点——默认自动但其他伽马下不生效，等于浪费了一个功能位</li><li>色彩模式不配套——S-Log+BT.2020会产生色彩偏移</li><li>细节自动模式下子项（VH平衡等）不生效——必须切手动</li></ul>
</div>

<div class="boundary"><strong>适用边界：</strong>以上推荐针对索尼A7M4/A7S3/FX3等主流微单。高端电影机（威尼斯等）可能有不同的色域实现和完整的色彩校正矩阵。斑马线59±2/93+是S-Log3下的数值，HLG/Cine等需要不同的阈值。</div>

<div class="conclusion">
<h2>总结</h2>
<h3>核心要点</h3><p>PP值下集的核心是：用好斑马线+直方图双监看，伽马和色域成对选，不动黑色等级和拐点，细节+7就够。</p>
<h3>立即行动</h3><p>斑马线设为59±2和93+ → 检查拐点手动关 → 成对选伽马和色彩模式 → 细节手动+7。</p>
<h3>认知转变</h3><p>从&quot;PP值参数太多看不懂&quot;转为&quot;只要调伽马+色域+细节三项就够了，其他默认或关闭&quot;——复杂菜单中抓住关键参数。</p>
</div>
</div>
    </div>
  </foreignObject>
</svg>