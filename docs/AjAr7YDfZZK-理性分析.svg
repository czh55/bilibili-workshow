<div class="card"><h3>内容要点</h3><ul><li>由无线电工程学会命名</li>
<li>它把亮度信号均匀的话分为100分</li>
<li>零iR1代表着纯黑色</li>
<li>100R1代表着纯白色</li>
<li>结合我们刚才做的实验</li>
<li>使用SLOG30</li>
<li>我会推荐你把半瓦线自定义1</li>
<li>设为标准加范围</li>
<li>水平设为59正负2</li>
<li>画面中出现半瓦线的区域就是刚好</li>
<li>过抱两档的地方</li>
<li>自定义2可以设为下线</li>
<li>水平设为93加</li>
<li>此时出现半瓦线的地方就提示你</li>
<li>它开始过抱了</li>
<li>并且会丢失高光细节</li>
<li>我也顺便测试了</li>
<li>像SLOG2、HLG、S-Sintone</li>
<li>以及Synigama和直出的碎加曝光范围</li>
<li>以供大家参考</li>
<li>其实除了曝光</li>
<li>还有一个东西也很重要</li>
<li>就是正确的白平衡</li>
<li>白平衡说白的就是</li>
<li>你告诉相机什么样的颜色是白色</li>
<li>错误的白平衡设置到了后期绝对会是灾难</li>
<li>大多数情况下</li>
<li>你都可以用白平衡自动来获得正常的色调</li>
<li>白平衡自动也有标准、白和环境的选择</li>
<li>我会更推荐使用标准</li>
<li>但也有些情况下</li>
<li>白平衡自动它就不是那么智能了</li>
<li>例如像我现在这种环境下拍摄</li>
<li>因为后面有一个暖光源和一个青绿光源</li>
<li>白平衡自动一看</li>
<li>这我能忍</li>
<li>给你修正</li>
<li>然后整个画面就会有点偏向于冷阳红的感觉</li>
<li>或者在拍摄蓝天时</li>
<li>它也会往暖黄色修正</li>
<li>所以这种情况</li>
<li>我还是推荐你使用色温绿光片来拍摄</li>
<li>虽然这需要一点经验</li>
<li>但是只要你不是差的特别多</li>
<li>几百K以内还是可以后期修正的</li>
<li>当然我现在也还只是个菜机</li>
<li>你可以点个关注一起进步</li>
<li>刚才我们只是讨论了Gama这一个最主要的设置</li>
<li>剩下还有八项大设置我们一个一个说</li>
<li>先说黑色等级</li>
<li>它可以较正画面中的黑色</li>
<li>提高它就是提亮黑色</li>
<li>反之就是压暗黑色</li>
<li>那理论上来说</li>
<li>我们可以提高黑色等级</li>
<li>来获得更多的暗部细节</li>
<li>但实际上</li>
<li>它只能让你的黑色变得更灰</li>
<li>造点更明显</li>
<li>对细节的增加可以说微乎其微</li>
<li>你甚至可以在后期把黑色提亮到同一程度</li>
<li>几乎没有区别</li>
<li>所以这个黑色等级没必要更改</li>
<li>它好像主要是应用于新闻直播</li>
<li>转播等领域</li>
<li>不同机位间匹配黑色的</li>
<li>然后就是黑Gama</li>
<li>它有三种范围选择</li>
<li>并且有正负7个等级可以调整</li>
<li>它是用来较正低亮度区域Gama</li>
<li>可以理解为用来控制Gama曲线暗部的弯曲形状</li>
<li>范围越窄在相同等级下影响程度也就越深</li>
<li>它确实可以做到在不改变曝光的情况下</li>
<li>提高黑Gama获得更多暗部细节</li>
<li>但造点的话</li>
<li>说实话我并不觉得造点增加了</li>
<li>只能说造点更明显了</li>
<li>而降低黑Gama暗部会更纯净</li>
<li>但是丢失的细节是无法后期找回的</li>
<li>如果你觉得这个功能有用</li>
<li>那么我会建议你使用范围宽正期</li>
<li>因为宽的效果会更自然一些</li>
<li>影响的暗部区域也是大多数人所更需要的</li>
<li>然后就是一个很重要的参数</li>
<li>细点它是用来控制高光的</li>
<li>是为了不让高光过曝而丢失细节所设计的</li>
<li>就像是你在Gama曲线上设置了一个点</li>
<li>让它后面的曲线来变得更平缓或者更陡峭</li>
<li>以此来压缩或者伸展高光信息</li>
<li>进入细点设置后</li>
<li>会发现它有自动和手动两种模式</li>
<li>但是HM4、HS3、HR5</li>
<li>甚至FX3等相机</li>
<li>只有Gama设为摸位时</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>由无线电工程学会命名它把亮度信号均匀的话分为100分零iR1代表着纯黑色100R1代表着纯白色结合我们刚才做的实验使用SLOG30我会推荐你把半瓦线自定义1设为标准加范围水平设为59正负2这时画面中出现半瓦线的区域就是刚好过抱两档的地方自定义2可以设为下线水平设为93加此时出现半瓦线的地方就提示你它开始过抱了并且会丢失高光细节另外我也顺便测试了像SLOG2、HLG、S-Sintone以及Synig</p><p>转录分段: 307 | 时长: 11:10</p></div>
