.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>临摹找规律，不复制画面</h1>
  <div class="meta"><span class="tag tag-blue">临摹</span><span class="tag tag-green">色彩关系</span><span class="tag tag-orange">明度</span><span class="tag tag-purple">冷暖</span><span class="tag tag-red">不吸色</span><span class="tag tag-gray">时长 4分38秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/42xPX9ws0Iw">原视频</a>
  <div class="summary-line">无目的临摹完成度高、能力增长低。带着色相／情绪目的，优先复刻明暗链与冷暖倾向；形状可散。不吸色，用环境冷灰、互补发灰、固有色与反光把大师密码搬到自己画面。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">目的提问</span></div><div class="timeline-item"><span class="timeline-time">00:22</span><span class="timeline-text">示范女人色块</span></div><div class="timeline-item"><span class="timeline-time">00:40</span><span class="timeline-text">脸最亮关系</span></div><div class="timeline-item"><span class="timeline-time">01:13</span><span class="timeline-text">同类色冷暖</span></div><div class="timeline-item"><span class="timeline-time">01:16</span><span class="timeline-text">研究关系</span></div><div class="timeline-item"><span class="timeline-time">02:35</span><span class="timeline-text">不吸色</span></div><div class="timeline-item"><span class="timeline-time">03:12</span><span class="timeline-text">破译密码</span></div><div class="timeline-item"><span class="timeline-time">04:20</span><span class="timeline-text">倾向不同</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">目的<br/>训练靶心</div><span class="arrow">→</span><div class="node-green">关系<br/>明暗冷暖</div><span class="arrow">→</span><div class="node-orange">推断<br/>环境＋固有</div><span class="arrow">→</span><div class="node-blue">迁移<br/>不吸色复刻</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「黎摹／黎摩」→临摹；「色相片翼」→色相偏移；「马来」→马奈。</p><p>误区：临摹＝扣形吸色完成一张——视频明确反对。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-orange">
      <h3>目的先行</h3>
      <p>色相搭配好奇或冷调情绪，都可以成为临摹目的；无目的则帮助有限。</p>
      <div class="quote">你画这张画的目的是什么</div>
      <div class="relation">完成度≠能力增量。</div>
    </div>
    <div class="card card-green">
      <h3>关系准即可散</h3>
      <p>形状散乱没关系；脸→帽→背景的明暗链准了，色彩练习就成立。</p>
      <div class="quote">看上去我的形状是很散乱的……但可是我的关系是准确的</div>
      <div class="relation">训练靶是关系不是描边。</div>
    </div>
    <div class="card card-purple">
      <h3>不吸色破译</h3>
      <p>环境冷灰＋粉绿近互补→暗部发灰；反光与耳固有色分开推断。</p>
      <div class="quote">我是把他的色彩关系给他复刻到了我的画面上</div>
      <div class="relation">理解可迁移，吸色不可迁移。</div>
    </div>
    <div class="card card-red">
      <h3>倾向差</h3>
      <p>每块颜色倾向不同：粉／红／绿／棕；同色相也分冷暖，头发勿死黑。</p>
      <div class="quote">这就是色彩关系同学们</div>
      <div class="relation">无倾向色块＝关系断裂。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>示范原作教学语境近马奈体系，参数不可当配方照抄。</li><li>「不吸色」是训练法，商业赶工另当别论。</li><li>片中 Photoshop 界面为演示载体，结论在观察本身。</li></ul><div class="pitfall">临摹只求画满像原作。</div><div class="pitfall">形状抠细但明暗链错乱。</div><div class="pitfall">全程吸管吸色，无法解释为何是这个灰。</div><div class="pitfall">头发等重色涂成无倾向死黑。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>临摹要有目的</li><li>关系＞完整画面</li><li>不吸色练推断</li><li>每块保留倾向</li></ul><h3>行动清单</h3><ol><li>临摹前写下一条目的（色相／情绪／明度链）</li><li>先铺3–5个大色块，检查最亮到最暗顺序</li><li>禁止吸管一局，只允许目测调色</li><li>结束时指出至少四处冷暖或同类色倾向差</li></ol><h3>关键认知转变</h3><p>以前：临摹＝复制完成一张；现在：临摹＝带目的破译并复刻色彩关系。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 4分38秒</div>
</div>
    </div>
  </foreignObject>
</svg>