  box-shadow: 0 16px 36px rgba(20, 39, 72, .18);
}
.conclusion > div { padding: 18px; border-radius: 16px; background: rgba(255,255,255,.08); }
.conclusion h3 { margin: 0 0 9px; color: #9ed9ff; font-size: 21px; }
.conclusion p, .conclusion li { color: #f5f8ff; }
