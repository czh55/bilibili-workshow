<div class="container">
  <h1>服装内行人教你一招辨别羊毛真假</h1>
  <div class="meta">
    <span class="tag tag-blue">小红书</span>
    <span class="tag tag-green">1分12秒</span>
    <span class="tag tag-orange">买衣验标</span>
    <span class="tag tag-purple">理性分析</span>
    <span class="tag tag-gray">店内快筛</span>
  </div>
  <a class="source-link" href="http://xhslink.cn/o/8nFYqnUoaAF">原视频：http://xhslink.cn/o/8nFYqnUoaAF</a>
  <div class="summary-line">核心判断：羊毛大衣是否“靠谱”，先核对三项标签信息——水洗标是否写原材料（羊毛/绵羊毛）、吊牌执行标准是否为 GB/T 2665-2017（女装）或 GB/T 2664-2017（男装）、安全类别是否完整标注 GB 18401-2010；缺一项就按主讲人立场降级为次品或假货风险。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><div class="timeline-time">00:04</div><div class="timeline-text">开场点题：轻松辨别羊毛大衣真假，切入吊牌与水洗标。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:12</div><div class="timeline-text">合规成分示例：面料写“绵羊毛 100%”。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:18</div><div class="timeline-text">反例成分：写“100% 澳洲羊毛 / 澳毛 / 高支羊毛”被判不合规。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:28</div><div class="timeline-text">女装执行标准：只认准 GB/T 2665-2017。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:40</div><div class="timeline-text">年份陷阱：2022/2010 毙掉；2009 不当尾货，按假货。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:54</div><div class="timeline-text">男装执行标准：只认准 GB/T 2664-2017。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:58</div><div class="timeline-text">安全类别：必须有 GB 18401-2010。</div></div>
    <div class="timeline-item"><div class="timeline-time">01:06</div><div class="timeline-text">缺完整安全标准号：主讲人判为次品或假货。</div></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">问题<br/>标签能否证明羊毛靠谱</div>
      <div class="arrow">→</div>
      <div class="node">证据<br/>成分 / 执行标准 / 安全类别</div>
      <div class="arrow">→</div>
      <div class="node node-orange">判断<br/>缺一项即风险升高</div>
      <div class="arrow">→</div>
      <div class="node node-green">行动<br/>店内三项快筛</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解与认知纠偏</h3>
    <p>误解 1：写“澳洲超细羊毛 / 高支羊毛”更高级。纠偏：视频把产地、支数、品种名写法视为不合规营销话术，要求回到“羊毛 / 绵羊毛”原材料表述。</p>
    <p>误解 2：执行标准年份越新越好。纠偏：主讲人只认 2017 的 GB/T 2665 / 2664；2022、2010、2009 都被她直接否决。</p>
    <p>误解 3：吊牌写了“C 类”就够了。纠偏：必须完整看到 GB 18401-2010；只写类别字母不够。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">三项标签检查拆解</h2>

    <div class="card card-green">
      <h3>1. 水洗标成分：只认原材料</h3>
      <p><span class="speaker speaker-host">在讲什么</span>真正的羊毛大衣，面料成分应写羊毛或绵羊毛，而不是产地/支数修饰词。</p>
      <p><span class="speaker speaker-host">关键理解</span>标签语言分两层：原材料（可核对）与营销修饰（难验证）。视频把后者直接降为风险信号。</p>
      <div class="highlight">合规：100% 羊毛 / 绵羊毛。不合规示例：100% 澳毛、澳洲超细羊毛、高支羊毛。</div>
      <div class="action">怎么用：翻开水洗标，先找“面料/成分含量”，确认是否出现原材料词，而不是产地形容词。</div>
      <div class="quote">原文依据（可见字幕/叠字，约 00:08–00:20）：“真正的羊毛大衣面料上一定写的是绵羊毛或者羊毛……像澳洲超细羊毛、高支羊毛等等都不规范。”</div>
      <div class="relation">立场分层：可验证事实=画面出现“绵羊毛 100%”与“100% 澳洲羊毛”对照；UP 主观点=后者一律按假货；推断=店内可先用标签用语做初筛。</div>
    </div>

    <div class="card">
      <h3>2. 执行标准：女装 2665，男装 2664，年份钉死 2017</h3>
      <p><span class="speaker speaker-host">在讲什么</span>吊牌“执行标准”栏，女装只认 GB/T 2665-2017，男装只认 GB/T 2664-2017。</p>
      <p><span class="speaker speaker-host">关键理解</span>视频把标准号当作“这件是否按大衣外套国标生产”的入口；其他年份或行业标准号都被判出局。</p>
      <div class="pitfall">避坑：看到 2022、2010 直接毙；看到 2009 不要解释成“很多年前的尾货”，主讲人说那就是假货。</div>
      <div class="action">怎么用：找到“执行标准”一行，完整抄写编号与年份；女装核对 2665-2017，男装核对 2664-2017。</div>
      <div class="quote">原文依据（叠字与口播，约 00:28–00:54）：“大衣外套的执行标准 GB/T2665-2017 或 GB/T2664-2017，除此之外均不合规。”</div>
      <div class="relation">立场分层：事实=画面合格证打印了 GB/T 2665-2017 / 2664-2017；观点=其他数字一律不合规；边界=此规则针对视频所说的大衣外套，不自动推广到所有服装品类。</div>
    </div>

    <div class="card card-orange">
      <h3>3. 安全类别：必须完整写 GB 18401-2010</h3>
      <p><span class="speaker speaker-host">在讲什么</span>安全技术类别是国家强制项，必须以 GB18401 开头，年份只能是 2010。</p>
      <p><span class="speaker speaker-host">关键理解</span>只写“C 类”不够；缺完整标准号时，主讲人把它与次品/假货绑定。</p>
      <div class="highlight">合规示例：GB 18401-2010 C 类。反例：安全技术要求只写 C 类，未见 GB 18401-2010。</div>
      <div class="action">怎么用：在吊牌找“安全类别 / 安全技术要求”，确认同时出现标准号、年份、类别字母。</div>
      <div class="quote">原文依据（约 00:56–01:12）：“一定要有这一项……一定要认准是 GB 18401-2010……没有明确标注这一项的，那不是次品就是假货。”</div>
      <div class="relation">立场分层：事实=画面出现带 GB 18401-2010 的吊牌，也出现只写 C 类的吊牌；观点=后者直接判次品/假货；推断=强制标准号是快速否决项，比价格更优先。</div>
    </div>
  </div>

  <div class="card">
    <h3>横向对比：标签写法怎么分流</h3>
    <table>
      <thead>
        <tr>
          <th>检查项</th>
          <th>通过信号</th>
          <th>否决信号</th>
          <th>适用边界</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>成分含量</td>
          <td>羊毛 / 绵羊毛 + 百分比</td>
          <td>澳毛、澳洲超细羊毛、高支羊毛等品种/产地写法</td>
          <td>店内快筛用语；不替代成分检测</td>
        </tr>
        <tr>
          <td>执行标准</td>
          <td>女装 GB/T 2665-2017；男装 GB/T 2664-2017</td>
          <td>其他年份（如 2022/2010/2009）或其他标准号</td>
          <td>视频限定大衣外套；其他品类另论</td>
        </tr>
        <tr>
          <td>安全类别</td>
          <td>完整 GB 18401-2010 + 类别</td>
          <td>缺标准号、缺年份、只写 C 类</td>
          <td>国家强制项；缺项优先否决</td>
        </tr>
        <tr>
          <td>价格信号</td>
          <td>不作为通过条件</td>
          <td>“再便宜也不要买”（针对 2009 等否决项）</td>
          <td>价格不能覆盖标签缺失风险</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="card card-red">
    <h3>避坑总结</h3>
    <ul>
      <li>不要被“澳洲 / 超细 / 高支”等修饰词安抚；先看有没有原材料词。</li>
      <li>不要把旧年份标准解释成尾货优惠；视频对 2009 给出的是假货判断。</li>
      <li>不要只看“C 类”；没有 GB 18401-2010 完整号，按主讲人标准仍不通过。</li>
      <li>不要用低价自我说服；否决项出现时，价格不是补救理由。</li>
      <li>不要把本视频结论扩成“所有外套只能有这两个标准号”；它明确针对大衣外套场景。</li>
    </ul>
  </div>

  <div class="card card-purple">
    <h3>方法边界与证据强度</h3>
    <p>适用条件：能翻到水洗标与合格证、品类为羊毛/毛呢大衣外套、需要店内快速分流。</p>
    <p>上限：只能判断标签是否符合视频给出的写法规则，不能直接证明纤维真伪、混纺比例或耐穿寿命。</p>
    <p>反例/例外：合法使用其他产品标准的外套品类、外贸贴标差异、仅展示安全类别字母的简化排版——都需要额外核实，不宜机械套用。</p>
    <div class="insight">证据强弱：画面吊牌文字属于较强可核对证据；“一律假货/次品”属于主讲人强立场，应保留为观点而非客观定论。</div>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>三项并行：成分原材料写法、执行标准号、安全强制标准号。</li>
      <li>女装盯 2665-2017，男装盯 2664-2017，安全盯 18401-2010。</li>
      <li>产地/支数营销词与缺项标签，是本视频最强否决信号。</li>
    </ul>
    <h3>行动清单</h3>
    <ol>
      <li>翻水洗标：抄下面料成分，确认是否含“羊毛/绵羊毛”。</li>
      <li>翻合格证：核对执行标准是否为 GB/T 2665-2017 或 2664-2017。</li>
      <li>同页核对安全类别是否完整写 GB 18401-2010。</li>
      <li>任一否决项出现：先不付款，再决定是否需要第三方检测或换货。</li>
      <li>把三项结果拍照存档，避免结账后无法对证。</li>
    </ol>
    <h3>关键认知转变</h3>
    <p>从“摸手感猜羊毛真假”，转到“先读标签三行字再决定要不要继续试穿”；真伪争议可以后置，标签完整性必须前置。</p>
  </div>

  <div class="footer">双轨产物之二 · SVG 理性分析 · slug: wool-real-fake-check · 分析视角：客观结构化，区分事实 / 观点 / 推断</div>
</div>

    </div>
  </foreignObject>
