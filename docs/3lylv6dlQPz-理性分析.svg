      <div class="container">
<h1>三个技巧教你如何在提示词里控制AI光线</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-green">视频分析</span></div>
<div class="summary-line">AI 图片之所以看起来很假，核心原因在于不会控制光线。视频提出三个可操作的提示词技巧：确定光线方向、控制光影比例、调整色温冷暖，让 AI 生成的画面有立体感、深度感和情绪感。</div>

<h2>问题 → 证据 → 判断 → 行动</h2>
<div class="map">
<div class="diagram"><div class="node">问题：AI图太假</div><div class="arrow">→</div><div class="node node-green">证据：光线扁平、无阴影</div><div class="arrow">→</div><div class="node node-orange">判断：缺少方向+光比+色温</div><div class="arrow">→</div><div class="node">行动：三步提示词法</div></div>
</div>

<h2>关键理解</h2>
<div class="card "><h3>技巧①：确定光的方向</h3><p>不要只写"影视灯光"这种笼统词——AI 根本不知道光从哪来。要让光有来源，写清楚光的进场方向，描述阴影分布，画面才能立体。</p><div class="highlight"><strong>核心提示词要素：</strong>光源位置 + 光线方向 + 阴影描述 → 画面立体感</div><div class="quote"><strong>原文：</strong>"我们要让光有来源，要写光的进场方向。要描述阴影不局，要画面变得立体。"</div></div>
<div class="card card-green"><h3>技巧②：控制光的比例</h3><p>AI 默认会把画面打得很满，导致画面没有深度。要明确告诉 AI 哪里该亮、哪里该暗，靠亮暗对比撑起真实感。</p><div class="action"><strong>操作：</strong>在提示词中加入"主体明亮 + 背景偏暗"或"侧光强调纹理"等光比描述</div></div>
<div class="card card-purple"><h3>技巧③：控制色温</h3><p>色温就是画面的情绪。偏冷像清晨的雾，偏暖像暴晒的风。用冷暖交错的光线，让画面有情绪感，不再死板。</p><div class="highlight"><strong>记忆口诀：</strong>方向 → 光比 → 色温，三步让 AI 图"假得真实"</div></div>

<h2>多方案对比</h2>
<table><tr><th>维度</th><th>错误做法</th><th>正确做法</th><th>效果</th></tr><tr><td>光源方向</td><td>笼统写"影视灯光"</td><td>指定光源位置和进场方向</td><td>画面立体有阴影层次</td></tr><tr><td>光影比例</td><td>画面全亮无对比</td><td>明确亮部和暗部区域</td><td>画面有深度和质感</td></tr><tr><td>色温</td><td>色彩单一无情绪</td><td>冷暖交错搭配</td><td>画面有情绪氛围</td></tr></table>
<h2>行动清单</h2><div class="card card-green"><ol><li>写提示词时先指定光源方向（如&quot;从左上方打来的自然光&quot;）</li><li>描述光影比例，明确哪些区域亮、哪些暗</li><li>用冷暖色温词搭配（如&quot;冷色调主光+暖色补光&quot;）</li><li>避免笼统灯光描述，给 AI 具体空间参照</li></ol></div>
<h2>避坑总结</h2><div class="card card-red"><h3>最常见的坑</h3><div class="pitfall">最常见的错误是只写&quot;好灯光&quot;、&quot;影视级光线&quot;等模糊描述。AI 无法理解这些抽象词，必须给出具体的物理光源信息。另一个坑是忽略光比，默认拍出来的画面会像影棚全亮——没有阴影就没有立体感。</div></div>
<h2>方法边界</h2><div class="boundary"><ul><li>适用于 Midjourney、Stable Diffusion、DALL-E 等主流 AI 绘图工具的提示词优化</li><li>对于抽象风格/超现实风格，部分规则可适当放宽</li><li>不同 AI 模型对光线关键词的响应强度不同，建议多对照测试</li><li>视频仅覆盖基础光线控制，反光、体积光、补光层次等内容需参考后续教程</li></ul></div>

<div class="conclusion">
<h2>总结</h2>
<p>AI 绘图的真实感密码不在模型升级，而在提示词的精度。当你把"方向、光比、色温"这三个维度写进提示词，AI 就能理解你想要的光影空间。这不是技巧堆砌，而是让 AI 理解物理世界的语言。</p>
</div>
</div>
