<h1>三个技巧教你如何在提示词里控制ai光线...</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">灯光</span> <span class="tag tag-gray">1:02</span></div>
<div class="summary-line">你的AI圖之所以假,是因為你不會控制光線光線是AI圖最容易漏線的地方三個技巧,教你讓AI圖假得真實首先我們要確定光的方向,別只顯示影視燈光這種太龍頭,AI根本不知道光從哪來我們要讓光有來源,要寫光的進場方向要描述陰影不局,要畫面變得立體這樣質感就出來了第二,我們要控制光的比例AI默認會把畫面打得很滿...</div>
<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">你的AI圖之所以假,是因為你不會控制光線</span></div>
<div class="timeline-item"><span class="timeline-time">[00:03]</span><span class="timeline-text">光線是AI圖最容易漏線的地方</span></div>
<div class="timeline-item"><span class="timeline-time">[00:05]</span><span class="timeline-text">三個技巧,教你讓AI圖假得真實</span></div>
<div class="timeline-item"><span class="timeline-time">[00:08]</span><span class="timeline-text">首先我們要確定光的方向,別只顯示影視燈光</span></div>
<div class="timeline-item"><span class="timeline-time">[00:11]</span><span class="timeline-text">這種太龍頭,AI根本不知道光從哪來</span></div>
<div class="timeline-item"><span class="timeline-time">[00:14]</span><span class="timeline-text">我們要讓光有來源,要寫光的進場方向</span></div>
<div class="timeline-item"><span class="timeline-time">[00:17]</span><span class="timeline-text">要描述陰影不局,要畫面變得立體</span></div>
<div class="timeline-item"><span class="timeline-time">[00:19]</span><span class="timeline-text">這樣質感就出來了</span></div>
<div class="timeline-item"><span class="timeline-time">[00:21]</span><span class="timeline-text">第二,我們要控制光的比例</span></div>
<div class="timeline-item"><span class="timeline-time">[00:23]</span><span class="timeline-text">AI默認會把畫面打得很滿,這樣會讓畫面沒深度</span></div>
<div class="timeline-item"><span class="timeline-time">[00:26]</span><span class="timeline-text">正確寫法是這樣,要告訴AI具體哪裡適量</span></div>
<div class="timeline-item"><span class="timeline-time">[00:29]</span><span class="timeline-text">哪裡適暗,這樣才有對比</span></div>
<div class="timeline-item"><span class="timeline-time">[00:31]</span><span class="timeline-text">我們要明確光影的比例</span></div>
<div class="timeline-item"><span class="timeline-time">[00:33]</span><span class="timeline-text">真實感就靠亮暗對比撐起來的</span></div>
<div class="timeline-item"><span class="timeline-time">[00:35]</span><span class="timeline-text">第三,我們是要控制色溫</span></div>
<div class="timeline-item"><span class="timeline-time">[00:36]</span><span class="timeline-text">色溫就是畫面的情緒</span></div>
<div class="timeline-item"><span class="timeline-time">[00:38]</span><span class="timeline-text">偏冷,像清晨的霧</span></div>
<div class="timeline-item"><span class="timeline-time">[00:40]</span><span class="timeline-text">偏暖,像暴暖的風</span></div>
<div class="timeline-item"><span class="timeline-time">[00:41]</span><span class="timeline-text">用冷暖交錯的光線</span></div>
<div class="timeline-item"><span class="timeline-time">[00:43]</span><span class="timeline-text">讓畫面有情緒感,不再死板</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>你的AI圖之所以假,是因為你不會控制光線</li>
<li>光線是AI圖最容易漏線的地方</li>
<li>三個技巧,教你讓AI圖假得真實</li>
<li>首先我們要確定光的方向,別只顯示影視燈光</li>
<li>這種太龍頭,AI根本不知道光從哪來</li>
<li>我們要讓光有來源,要寫光的進場方向</li>
<li>要描述陰影不局,要畫面變得立體</li>
<li>這樣質感就出來了</li>
<li>第二,我們要控制光的比例</li>
<li>AI默認會把畫面打得很滿,這樣會讓畫面沒深度</li>
<li>正確寫法是這樣,要告訴AI具體哪裡適量</li>
<li>哪裡適暗,這樣才有對比</li>
<li>我們要明確光影的比例</li>
<li>真實感就靠亮暗對比撐起來的</li>
<li>第三,我們是要控制色溫</li>
<li>色溫就是畫面的情緒</li>
<li>偏冷,像清晨的霧</li>
<li>偏暖,像暴暖的風</li>
<li>用冷暖交錯的光線</li>
<li>讓畫面有情緒感,不再死板</li>
<li>所以記住這三步,方向、光比、色溫</li>
<li>我創作了很多AI提示詞技巧放在站點裡</li>
<li>如果有需要的話,可以後台留言,都是免費的</li>
<li>下一期,教你怎麼寫反光、體積光</li>
<li>補光層次的提示詞</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>你的AI圖之所以假,是因為你不會控制光線光線是AI圖最容易漏線的地方三個技巧,教你讓AI圖假得真實首先我們要確定光的方向,別只顯示影視燈光這種太龍頭,AI根本不知道光從哪來我們要讓光有來源,要寫光的進場方向要描述陰影不局,要畫面變得立體這樣質感就出來了第二,我們要控制光的比例AI默認會把畫面打得很滿,這樣會讓畫面沒深度正確寫法是這樣,要告訴AI具體哪裡適量哪裡適暗,這樣才有對比我們要明確光影的比例</p><p>转录分段: 25 | 时长: 1:02</p></div>
