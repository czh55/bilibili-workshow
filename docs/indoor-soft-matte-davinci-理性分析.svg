.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>室内柔和哑光的效果该怎么用达芬奇做出来</h1>
  <div class="meta"><span class="tag tag-blue">达芬奇</span><span class="tag tag-green">哑光</span><span class="tag tag-orange">柔和对比度</span><span class="tag tag-purple">共享静帧</span><span class="tag tag-red">RGB混合器</span><span class="tag tag-gray">时长 8分08秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/2vil3P69aD9">原视频</a>
  <div class="summary-line">哑光：无大过曝；HDR 压中灰护两端再收反差。染色防滤镜感用 RGB 混合器与去脏黄。核心样条线大胆压高光成哑光。可导出 LUT，更推共享静帧附加节点图可改。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">HDR 压 Light/Shadow，护 Highlight；收反差</span></div><div class="timeline-item"><span class="timeline-time">01:38</span><span class="timeline-text">暖绿 + RGB 混合器 + 去脏黄</span></div><div class="timeline-item"><span class="timeline-time">03:25</span><span class="timeline-text">样条线压高光杠杆 = 哑光</span></div><div class="timeline-item"><span class="timeline-time">04:16</span><span class="timeline-text">降高饱和艳度；限定器护脸</span></div><div class="timeline-item"><span class="timeline-time">05:23</span><span class="timeline-text">33点LUT vs 共享静帧节点图</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">影调<br/>压中护两端</div><span class="arrow">→</span><div class="node-green">核心<br/>样条线哑光</div><span class="arrow">→</span><div class="node-orange">颜色<br/>拉开而非糊滤镜</div><span class="arrow">→</span><div class="node-blue">复用<br/>共享静帧更优</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「达芬吉」校正为「达芬奇」；「破爆」校正为「过曝」；「一按/全曲」校正为「一压/全曲线」；「爆光」校正为「曝光」；「蜡色/做蜡/蜡调」校正为「LUT」；「2Gb混合器」校正为「RGB 混合器」；「输值」校正为「数值」；「薄度」校正为「饱和度」；「波感」校正为「波杆」；「实量图」校正为「向量图」；「咽」校正为「艳」；「制造」校正为「遮罩」；「共享竞争集/竞争」校正为「共享静帧集/静帧」；「看我几天」校正为「看简介」。</p><p>误区：全曲线硬压当哑光 → 反差过强。</p><p>误区：只靠 LUT 且不可改。</p><p>误区：全局染色不管色相牺牲。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>压主要内容，两端不动</h3>
      <p>哑光不太亮且怕高光断层。HDR 降 Light/Shadow、护 Highlight，再阴影抬/高光降——压暗却不过分拉反差。</p>
      <div class="quote">让主要的内容给它往下走，但是高光和暗部不发生改变</div>
      <div class="relation">先看有没有大面积过曝。</div>
    </div>
    <div class="card card-orange">
      <h3>哑光关键一刀：样条线</h3>
      <p>高光端大胆下压，波杆左拉压缩高光；暗部上提右拉找回暗部反差。</p>
      <div class="quote">你看我拉成这样的话，它不就变成了哑光吗</div>
      <div class="relation">前面节点可简，这一刀要有。</div>
    </div>
    <div class="card card-green">
      <h3>颜色：拉开红蓝，去掉脏黄</h3>
      <p>暖绿全局易糊滤镜。RGB 混合器提红降蓝；蜘蛛网去脏黄留粉感。饱和曲线降高饱和艳度。</p>
      <div class="quote">显得像是一层滤镜糊在表面</div>
      <div class="relation">红是红、蓝是蓝。</div>
    </div>
    <div class="card card-purple">
      <h3>复用：共享静帧 &gt; 死 LUT</h3>
      <p>可生成33点LUT，但难改。共享静帧附加节点图跨项目且可回改色温色调。</p>
      <div class="quote">这个方式比起蜡调好用的多</div>
      <div class="relation">做人脸选区导出前建议隐藏。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>室内人像案例，室外强光需另验。</li><li>为做 LUT 故意省略部分遮罩优化。</li><li>共享静帧依赖本机画廊路径。</li></ul><div class="pitfall">大面积过曝仍硬做哑光导致断层。</div><div class="pitfall">全曲线一压到底反差炸。</div><div class="pitfall">只导出 LUT 无法按镜微调。</div><div class="pitfall">降高饱和时不护脸反差。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>压中护两端再收反差</li><li>样条线压缩高光=哑光</li><li>染色防滤镜感</li><li>共享静帧可改复用</li></ul><h3>行动清单</h3><ol><li>检查过曝 → HDR 压中</li><li>样条线做哑光波形</li><li>RGB/蜘蛛网整理色相</li><li>风格节点抓进共享静帧集</li></ol><h3>关键认知转变</h3><p>以前：套哑光 LUT 难改；现在：手搓样条线关键刀，用共享静帧复用并可调。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 8分08秒</div>
</div>
    </div>
  </foreignObject>
</svg>