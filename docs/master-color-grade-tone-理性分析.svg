      <div class="container root-wrap">
  <h1>这个色调学会了一定是大师｜品川力 Lightroom 仿色</h1>
  <div class="meta"><span class="tag tag-blue">调色</span><span class="tag tag-green">Lightroom</span><span class="tag tag-orange">品川力</span><span class="tag tag-purple">仿色</span><span class="tag tag-red">日系</span><span class="tag tag-gray">电影感</span><span class="tag tag-gray">时长 8分57秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/89ICbrxOSb9">原视频</a>
  <div class="summary-line">品川力仿色不是「死记一张参数表」，而是可迁移的结构：曲线先铺电影感暗调并给亮部加青；混色把暖色饱和打薄做成褪色；颜色分级用「中间调品红暖 + 阴影/高光冷」嵌回冷暖对比；校准用「右右左」青橙公式收束。验收标准是复制到同组手机片时，几乎只改基本参数仍成立。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">立题：迷人仿色第十期，品川力=空气感+叙事，非刻板清新</span></div><div class="timeline-item"><span class="timeline-time">00:49</span><span class="timeline-text">影调色调：低饱和暗调/电影感；品红暖；阴影高光偏冷</span></div><div class="timeline-item"><span class="timeline-time">01:50</span><span class="timeline-text">直方图：阴影青蓝、高光琥珀绿、整体褪色复古</span></div><div class="timeline-item"><span class="timeline-time">02:23</span><span class="timeline-text">原则：不能复用不算成功；Adobe 色彩 + 曲线先于基本参数</span></div><div class="timeline-item"><span class="timeline-time">03:16</span><span class="timeline-text">曲线+基础：红曲线亮部青、压亮柔对比、提阴影黑色、压高光</span></div><div class="timeline-item"><span class="timeline-time">04:43</span><span class="timeline-text">混色：系统降暖色饱和，用氛围换故事感</span></div><div class="timeline-item"><span class="timeline-time">05:48</span><span class="timeline-text">分级三区参数 + 校准右右左青橙；微调白平衡与曲线</span></div><div class="timeline-item"><span class="timeline-time">06:52</span><span class="timeline-text">复制到同组片只动基本参数；前后对比与邀约收尾</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">风格指纹<br/>品红暖中间调 + 冷阴影/高光</div><span class="arrow">→</span><div class="node-green">铺调顺序<br/>曲线→基础→混色→分级→校准</div><span class="arrow">→</span><div class="node-orange">亮部特征<br/>暖调里保留青色高光</div><span class="arrow">→</span><div class="node-blue">成功标准<br/>参数可复用到一组片</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误区：暖调=拉高白平衡色温。片中强调品红暖，且阴影/高光仍可偏冷。</p><p>误区：先拧完基本参数再上曲线。Leo 主张像铺水彩一样先用曲线铺基调。</p><p>误区：故事感靠堆暖色饱和。应降暖色饱和，用色调氛围与褪色感呈现。</p><p>误区：调好一张就算学会。不能复用到其他片的参数，不算形成风格。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card">
      <h3>风格命题：品川力 = 暗调电影感 × 内敛冷暖</h3>
      <p>定位不是清新日系，而是极简里的温润厚度。影调偏低饱和暗调、能量落在中间调、带电影故事感；色调暖来自品红，不是黄暖，阴影与高光偏冷，冷暖对比刻意内敛。</p>
      <div class="quote">这里的暖调不是黄色暖，而是品红暖……阴影和高光都是冷色……对比非常内敛</div>
      <div class="relation">先认指纹，再谈滑块；否则容易调成「普通暖色滤镜」。</div>
    </div>
    <div class="card card card-green">
      <h3>流程骨架：曲线铺调 → 混色打薄 → 分级嵌回</h3>
      <p>iPhone 片先改 Adobe 色彩。三原色曲线拉对比，红曲线给亮部加青；区域曲线柔亮压暗；基础面板提阴影/黑色、压高光/白色。混色系统降蓝青黄橙红饱和做褪色；颜色分级用阴影青蓝、高光琥珀绿、中间调品红暖把氛围加回。</p>
      <div class="quote">建议大家都先用曲线……就好像画水彩油画一样先铺基调</div>
      <div class="relation">颜色分级不是第一步；先把影调与固有色「打薄」，再分区染色。</div>
    </div>
    <div class="card card card-purple">
      <h3>可抄参数锚点：分级三区 + 校准右右左</h3>
      <p>阴影：色相 156、饱和 40（青蓝略偏绿）；高光：色相 100、饱和 7（琥珀绿）；中间调：色相 335、饱和 32（品红暖）；混合与平衡到 100。校准记住「右右左」青橙色公式，再回基本面板与曲线做细调。</p>
      <div class="quote">校准这里右右左是青橙色的调色公式</div>
      <div class="relation">参数是锚点，不是圣旨；同组片以复用后的基本参数微调用完。</div>
    </div>
    <div class="card card card-red">
      <h3>验收：复制到其他片仍成立，才叫风格</h3>
      <p>Leo 反复反对「只为参数」的笔记：一张成功却不能复用，后期很累也难成风格。演示把参数贴到同组手机片，通常只动曝光等基本项，色调影调仍匹配——这才是本期的成功定义。</p>
      <div class="quote">完全不用动其他地方，这就说明这次调色是成功的</div>
      <div class="relation">练习时一次调一组，而不是死磕单张到「看起来像」。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>工具场景是 Lightroom（桌面修改照片模块），不覆盖达芬奇节点或手机 App 一键滤镜。</li><li>仿色对象是品川力倾向的低饱和暗调叙事，不等于所有日系清新片。</li><li>口播给出的色相/饱和是该案例锚点，换题材需保留结构、微调数值。</li><li>素材为作者手机直出演示，RAW/Log 工作流需自行映射到曲线起点。</li></ul><div class="pitfall">一上来就拉白平衡求「暖」，丢掉品红暖与冷阴影结构。</div><div class="pitfall">颜色分级抢在曲线之前，导致对比与亮部青无法稳定复用。</div><div class="pitfall">暖色饱和降不够，画面艳而故事感弱；或降过头却忘记用分级把氛围加回。</div><div class="pitfall">只保存单张预设数值，不在同组片上做粘贴验收。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>风格指纹：品红暖中间调 + 冷阴影/高光</li><li>铺调顺序：曲线→基础→混色→分级→校准</li><li>亮部特征：暖调里保留青色高光</li><li>成功标准：参数可复用到一组片</li></ul><h3>行动清单</h3><ol><li>选一组同光源手机片，先定一张主案例，其余只准备做粘贴验证。</li><li>按顺序只走一遍：Adobe 色彩 → 曲线（含红通道亮部青）→ 基础 → 混色降饱和 → 分级三区 → 校准右右左。</li><li>把主案例参数同步到第 2、第 3 张，只允许改曝光/对比等基本项，记录还要不要动混色。</li><li>对照直方图检查：阴影是否偏青蓝、亮部是否仍带一点青、整体是否「褪色但不脏」。</li></ol><h3>关键认知转变</h3><p>大师感来自可复用结构：曲线定暗调与亮部青，混色做褪色，分级嵌品红暖与冷阴影/高光，校准收青橙；用「粘贴到同组片只改基本参数」当验收，而不是背一张神图的滑块。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 8分57秒</div>
</div>
    </div>
  </foreignObject>
</svg>