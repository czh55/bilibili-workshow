<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2004" viewBox="0 0 1320 2004">
  <foreignObject x="0" y="0" width="1320" height="2004">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&amp;display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',-apple-system,sans-serif}
.container{width:1240px;padding:40px 40px 60px}
h1{font-size:30px;font-weight:700;color:#1a1a1a;margin-bottom:8px}
.meta{font-size:13px;color:#999;margin-bottom:8px}
.meta span{margin-right:16px}
.tags{margin-bottom:20px}
.tag{display:inline-block;background:#fdf2f2;color:#c0392b;padding:3px 10px;border-radius:12px;font-size:12px;margin-right:8px}
.summary-line{background:#fff5f5;border-left:4px solid #e74c3c;padding:12px 16px;margin-bottom:28px;font-size:15px;color:#555;line-height:1.7}
h2{font-size:20px;font-weight:600;color:#c0392b;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid #e74c3c;display:inline-block}
.step{display:flex;margin-bottom:20px;align-items:flex-start}
.step-num{width:36px;height:36px;border-radius:50%;background:#e74c3c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;margin-right:14px;margin-top:2px}
.step-content{flex:1}
.step-content h4{font-size:16px;font-weight:600;color:#333;margin-bottom:4px}
.step-content p{font-size:14px;color:#666;line-height:1.7}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
th{background:#fdf2f2;color:#c0392b;padding:10px 12px;text-align:left;font-weight:600}
td{padding:10px 12px;border-bottom:1px solid #f0ece4;color:#555}
tr:last-child td{border-bottom:none}
.boundary{background:#faf8f5;padding:16px 20px;border-radius:8px;margin:16px 0;font-size:13px;color:#777;line-height:1.8}
.conclusion{background:linear-gradient(135deg,#fdf2f2,#fff5f5);padding:20px 24px;border-radius:8px;margin-top:28px;font-size:14px;color:#555;line-height:1.8}
.conclusion strong{color:#c0392b}
</style>
      
<div class="container">
  <h1>高难度压纹郁金香</h1>
  <div class="meta">
    <span>来源：小红书</span>
    <span>时长：25秒</span>
    <span>难度：★★★★☆</span>
  </div>
  <div class="tags">
    <span class="tag">压纹</span>
    <span class="tag">郁金香</span>
    <span class="tag">高难度</span>
    <span class="tag">一气呵成</span>
  </div>
  <div class="summary-line">
    <strong>一句话总结：</strong>高难度压纹郁金香的核心是四步一气呵成——引流开底奠定基础层，大流量确保纹路清晰，运用包心技巧成形，最后顶部收尾点缀。全程不能停顿，稳定性是关键。
  </div>

  <h2>核心步骤拆解</h2>

  <div class="step">
    <div class="step-num">1</div>
    <div class="step-content">
      <h4>引流开底 · 原地摆动前推</h4>
      <p>在液面中心开始原地摆动，用稳定小流量形成底层。然后向前推到底，为后续纹路预留位置。这一步关键是流量要稳、推送要直。</p>
    </div>
  </div>

  <div class="step">
    <div class="step-num">2</div>
    <div class="step-content">
      <h4>大流量出纹路 · 第二层浮现</h4>
      <p>在推到底的位置加大流量继续摆动，让奶泡浮出清晰的压纹。流量不够会导致纹路模糊，这一层决定了最终图案的清晰度。</p>
    </div>
  </div>

  <div class="step">
    <div class="step-num">3</div>
    <div class="step-content">
      <h4>包心成形 · 运用回包技巧</h4>
      <p>将之前学过的"回包"知识应用到这里——把大流量形成的纹路包裹成形，完成郁金香的主体轮廓。回包动作要果断，不能犹豫。</p>
    </div>
  </div>

  <div class="step">
    <div class="step-num">4</div>
    <div class="step-content">
      <h4>收尾点缀 · 顶部点一点</h4>
      <p>最后在郁金香顶部点一个收尾点，让整个图案更完整。收尾要干脆利落，点是最后的画龙点睛之笔。</p>
    </div>
  </div>

  <h2>关键技巧对比</h2>
  <table>
    <tr><th>环节</th><th>操作</th><th>常见错误</th></tr>
    <tr><td>引流开底</td><td>原地摆动 → 前推</td><td>流量太大导致底层不均匀</td></tr>
    <tr><td>大流量出纹路</td><td>加大流量持续摆动</td><td>流量不够，纹路模糊</td></tr>
    <tr><td>包心成形</td><td>回包动作包裹纹路</td><td>回包太快或太慢，形状变形</td></tr>
    <tr><td>收尾</td><td>顶部点一个点</td><td>拖泥带水，破坏整个图案</td></tr>
  </table>

  <h2>适用边界</h2>
  <div class="boundary">
    <strong>✅ 适用：</strong>已掌握基础郁金香和包心技巧，可以稳定控制流量和摆动节奏的进阶练习者。<br/>
    <strong>⚠️ 前提：</strong>需要先熟练基础郁金香和回包动作，否则四个步骤无法连贯完成。<br/>
    <strong>❌ 不适用：</strong>基础摆动和流量控制还不稳定时，不要直接挑战高难度版本。
  </div>

  <div class="conclusion">
    <strong>练功方向：</strong>高难度压纹郁金香考验的不是某个单一技巧，而是<strong>四个步骤的连贯性</strong>和<strong>全程稳定性</strong>。把这四步拆开来反复练，直到每个环节都能稳定执行后，再尝试一气呵成地组合起来。记住：宁可慢一点稳一点，也不要为了快而牺牲纹路的清晰度。
  </div>
</div>
    </div>
  </foreignObject>
</svg>