<div class="card"><h3>内容要点</h3><ul><li>新手剪輯通常會經歷三個階段</li>
<li>收機剪一切</li>
<li>很快你會發現</li>
<li>每次找個功能都要在這條細細的工具欄裡翻半天</li>
<li>並且軌道一旦多起來想修改</li>
<li>簡直就是個夢</li>
<li>於是你買了一台電腦</li>
<li>進入第二階段</li>
<li>但鼠標操作一切</li>
<li>切一刀和小垃圾桶</li>
<li>成了你最好的夥伴</li>
<li>於是你的光標反覆有座在這片區域</li>
<li>知道你又發現</li>
<li>這後面有括號</li>
<li>卡帽加K</li>
<li>會用高頻快捷鍵</li>
<li>卡帽加K剪一刀</li>
<li>退隔鍵刪除</li>
<li>左右鍵逐陣瀏覽</li>
<li>上下鍵再片段鍵切換</li>
<li>使用快捷鍵和剪輯效率翻倍完全不誇張</li>
<li>但還有優化空間</li>
<li>以大家常用的</li>
<li>右上角不起眼的角落有一個快捷鍵設置</li>
<li>在這裡你可以看到所有功能對應的鍵位</li>
<li>並且全都可以按去修改</li>
<li>今天我也分享給大家一套</li>
<li>我自己用了7年鍵的上千條視頻</li>
<li>不斷優化出來的一套高效鍵機</li>
<li>大師技能鍵位</li>
<li>馬上開始吧</li>
<li>剪切刪的設置</li>
<li>把你的左手自然放在鍵盤上</li>
<li>感受它最舒適的位置</li>
<li>如果你像我一樣有過凌晨兩點起床</li>
<li>小心翼翼打開電腦</li>
<li>脫摸著玩遊戲的童年</li>
<li>你應該會肌肉肌一般地把左手放在這裡</li>
<li>WASD</li>
<li>再合適不過了</li>
<li>圍繞WASD的這16個鍵位</li>
<li>我稱之為黃金左手區</li>
<li>是我們在左手手腕不動的情況下</li>
<li>能最快掉用的16個鍵</li>
<li>還適合放著我們常用的快捷鍵</li>
<li>比如最常用的分割</li>
<li>默認為卡帽加K</li>
<li>直接改成最靠近實質的1</li>
<li>還有刪除鍵</li>
<li>每次都要抬手腕去按</li>
<li>我們把刪除鍵改成D</li>
<li>可以對比一下同樣做一個刪除</li>
<li>視頻中間斷的操作</li>
<li>能省多長時間</li>
<li>默認快捷鍵</li>
<li>找到位置</li>
<li>卡帽加K</li>
<li>鼠標頭到下個位置</li>
<li>卡帽加K</li>
<li>用17.8秒</li>
<li>再來看調整後的鍵位</li>
<li>找到下個位置</li>
<li>用13.8秒</li>
<li>速度快樂有一倍</li>
<li>功能和新對應的鍵位站在這</li>
<li>不用急著截圖</li>
<li>最後會給大家做一個會走</li>
<li>在玩樂和自拍時</li>
<li>我們一定會在視頻開頭和截位處</li>
<li>有去按相機錄製鍵的廢片</li>
<li>作為大部分素材的這兩部分</li>
<li>是需要卡掉的</li>
<li>找到快捷鍵中的向左和向右採檢</li>
<li>分別給了A和S的鍵位</li>
<li>就可以實現一鍵的卡頭趣味了</li>
<li>時間線設置</li>
<li>時間軸上除了用鼠標去拓展預覽</li>
<li>再做像轉廠這樣的微操時</li>
<li>經常設計到逐幀的預覽操作</li>
<li>默認是左右方向鍵</li>
<li>還有片轉鍵的快速切換</li>
<li>默認為上下方向鍵</li>
<li>最後是時間軸的縮放</li>
<li>默認是加耗方大</li>
<li>減耗縮小</li>
<li>然而每次都要抬手去操作</li>
<li>效率實在太低</li>
<li>這裡要大改</li>
<li>把前後一針分別給到Q和W</li>
