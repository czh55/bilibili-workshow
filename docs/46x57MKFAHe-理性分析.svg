<li>我再推薦給大家幾個常用的</li>
<li>比如換起編速面板可以調成R</li>
<li>鼠標拓轉片段末尾</li>
<li>就能直接調整播放速度了</li>
<li>還有啟用停用片段調成F</li>
<li>當我們想看添加調色和貼紙的前後效果對比時</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>新手剪輯通常會經歷三個階段一階段收機剪一切很快你會發現每次找個功能都要在這條細細的工具欄裡翻半天並且軌道一旦多起來想修改簡直就是個夢於是你買了一台電腦進入第二階段電腦剪但鼠標操作一切切一刀和小垃圾桶成了你最好的夥伴於是你的光標反覆有座在這片區域知道你又發現嗯這後面有括號卡帽加K哦這也行三階段會用高頻快捷鍵卡帽加K剪一刀退隔鍵刪除左右鍵逐陣瀏覽上下鍵再片段鍵切換使用快捷鍵和剪輯效率翻倍完全不誇張但還</p><p>转录分段: 135 | 时长: 3:15</p></div>
