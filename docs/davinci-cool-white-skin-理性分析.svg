      <div class="container root-wrap">
  <h1>皮肤发黄？3 步用达芬奇做冷白皮</h1>
  <div class="meta"><span class="tag tag-blue">达芬奇</span><span class="tag tag-green">冷白皮</span><span class="tag tag-orange">肤色</span><span class="tag tag-purple">互补色</span><span class="tag tag-red">密度</span><span class="tag tag-gray">时长 8分56秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/9hhWNevxFaK">原视频</a>
  <div class="summary-line">阳光肤黄可走加冷路径：反差→降色温→降蓝青密度回调。本质是蓝对冲黄保留血色，不是抽饱和。白平衡正确却闷黄时先透亮统一饱和再加冷。环境须接纳冷调（叶改墨绿）。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">三步快做：反差→加冷→回调蓝青</span></div><div class="timeline-item"><span class="timeline-time">01:23</span><span class="timeline-text">对冲原理：加蓝对黄，勿僵尸色</span></div><div class="timeline-item"><span class="timeline-time">03:19</span><span class="timeline-text">闷黄：先提亮统一饱和再加冷</span></div><div class="timeline-item"><span class="timeline-time">06:17</span><span class="timeline-text">环境改墨绿；晨阴天更合适</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">快做<br/>反差→冷→回调</div><span class="arrow">→</span><div class="node-green">原理<br/>互补对冲</div><span class="arrow">→</span><div class="node-orange">例外<br/>先透亮</div><span class="arrow">→</span><div class="node-blue">全局<br/>环境也要冷</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「薄度」校正为「饱和度」；「切片工具」即色轮六向量/Hue vs Hue 等切片；「护股色」校正为「互补色」；「全去加」校正为「全局加」；「两个粒子」校正为「两个例子」；「达文集」校正为「达芬奇」；「加楞」校正为「加冷」；「2GB三值」校正为「RGB 三值」；「明目」校正为「明度」；「曲片」校正为「去偏」；「蓝掉」校正为「蓝调」；「强风」校正为「风格」；「赞联」校正为「三连」。</p><p>误区：把肤饱和抽干当冷白。</p><p>误区：白平衡正确仍强行加冷致受光面先蓝。</p><p>误区：只改肤不改暖环境。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>三步快路径</h3>
      <p>强化反差 → 降色温加冷（蓝可转青）→ 降蓝青密度回调，蜘蛛网微纠肤相。常无需遮罩。</p>
      <div class="quote">它并不需要你画遮罩或者是做皮肤的选区</div>
      <div class="relation">阳光黄≠一定白平衡错。</div>
    </div>
    <div class="card card-orange">
      <h3>对冲不是洗白</h3>
      <p>加蓝对冲黄，橙肤留红再纠。抽干饱和=僵尸色。慎减色调出绿。</p>
      <div class="quote">这就是我们冷白皮这个核心原理</div>
      <div class="relation">保留颜色比重，只对冲过黄。</div>
    </div>
    <div class="card card-red">
      <h3>白平衡对仍黄：先透亮</h3>
      <p>领白 RGB 接近则勿强加冷。先提亮、统一低/高饱和，降密度，再加冷。</p>
      <div class="quote">它的核心原因是不够透亮</div>
      <div class="relation">受光面先入蓝是危险信号。</div>
    </div>
    <div class="card card-green">
      <h3>环境必须跟冷</h3>
      <p>肤冷叶暖会脱节→黄绿改墨绿。晨/阴天合适；暖沙滩慎用。</p>
      <div class="quote">单纯的肤色调整没有什么难度……还是要多观察环境</div>
      <div class="relation">冷白皮的边界在场景气质。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>演示多例肤色与光线，参数不可照抄。</li><li>「冷白皮」为网感目标，非医学肤色标准。</li><li>胶片感压缩为可选收尾。</li></ul><div class="pitfall">抽饱和洗白。</div><div class="pitfall">白平衡正确却猛加冷。</div><div class="pitfall">减色调出不可控绿。</div><div class="pitfall">忽略环境冷暖匹配。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>反差→加冷→回调</li><li>互补对冲保留血色</li><li>闷黄先透亮</li><li>环境接纳冷调</li></ul><h3>行动清单</h3><ol><li>判断黄因：阳光 vs 白平衡 vs 闷</li><li>能全局加冷则走三步</li><li>不能则提亮统一饱和再冷</li><li>最后扫环境暖叶</li></ol><h3>关键认知转变</h3><p>以前：选区猛降黄或洗灰；现在：对冲保比重，先透亮，并改环境。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 8分56秒</div>
</div>
    </div>
  </foreignObject>
</svg>