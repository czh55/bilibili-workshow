<h1>练妆日记 | 想上线下化妆课的姐妹先看看这</h1>
<div class="meta">
<span class="tag tag-blue">化妆教程</span><span class="tag tag-green">新手友好</span><span class="tag tag-orange">底妆手法</span><span class="tag tag-gray">27:45</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>报名化妆课之前，先用 27 分钟把化妆基本原理和步骤顺序看懂：从毛发清理、补水锁水、防晒「印」法、遮瑕配色，到粉底、骨相三件套、眼皮定妆、眼妆、二次加深与口红收官——练完满意就不用花线下课的钱。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">别急着报名：先看免费视频，练完满意就不用上课</span></div><div class="timeline-item"><span class="timeline-time">00:41</span><span class="timeline-text">毛发清理：顺毛刮小胡子，避免粉底发青</span></div><div class="timeline-item"><span class="timeline-time">01:06</span><span class="timeline-text">皮肤清洁：化妆棉擦去油脂灰尘死皮，消除隔层</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">补水 + 锁水：喷雾补水、面霜锁水，只补水必起皮</span></div><div class="timeline-item"><span class="timeline-time">03:18</span><span class="timeline-text">防晒：粉扑「印」不「搓」，基本不搓泥</span></div><div class="timeline-item"><span class="timeline-time">04:40</span><span class="timeline-text">遮瑕配色：发青发黄用紫、发红用绿、黑眼圈用三文鱼</span></div><div class="timeline-item"><span class="timeline-time">07:26</span><span class="timeline-text">定妆喷雾衔接 → 粉底第一笔落面中，由内向外过渡</span></div><div class="timeline-item"><span class="timeline-time">08:30</span><span class="timeline-text">骨相三件套：提亮（要更白）+ 修容（有层次）+ 腮红（衔阴影）</span></div><div class="timeline-item"><span class="timeline-time">13:20</span><span class="timeline-text">二次定妆喷雾 + 散粉：眼皮一定要定妆</span></div><div class="timeline-item"><span class="timeline-time">14:30</span><span class="timeline-text">眼妆：蓬松刷铺色、扁刺刷加深、眼线填睫毛根</span></div><div class="timeline-item"><span class="timeline-time">18:39</span><span class="timeline-text">睫毛（夹→打底→膏→免胶假睫毛）与眉毛（眉粉→染眉膏→眉笔骨架）</span></div><div class="timeline-item"><span class="timeline-time">21:45</span><span class="timeline-text">二次加深：深浅双色修容、腮红保持同色调</span></div><div class="timeline-item"><span class="timeline-time">24:00</span><span class="timeline-text">提亮层次：自然白大圈、死白小圈、珠光迷你圈</span></div><div class="timeline-item"><span class="timeline-time">25:43</span><span class="timeline-text">口红：唇线笔模糊唇缘，更红色唇内叠涂</span></div></div>

<div class="map"><h2>化妆完整流程（一遍过）</h2>
<div class="diagram">
<span class="node node-green">清毛<br/>+清洁</span><span class="arrow">→</span>
<span class="node node-green">补水<br/>锁水</span><span class="arrow">→</span>
<span class="node node-green">防晒<br/>印法</span><span class="arrow">→</span>
<span class="node node-green">遮瑕<br/>配色</span><span class="arrow">→</span>
<span class="node">粉底<br/>面中起笔</span><span class="arrow">→</span>
<span class="node">定妆喷雾<br/>衔接</span>
</div>
<div class="diagram">
<span class="node node-orange">提亮<br/>更白有层次</span><span class="arrow">+</span>
<span class="node node-orange">修容<br/>深→过渡→收</span><span class="arrow">+</span>
<span class="node node-orange">腮红<br/>衔阴影</span><span class="arrow">→</span>
<span class="node">散粉<br/>眼皮必定</span><span class="arrow">→</span>
<span class="node node-purple">眼影<br/>眼线</span><span class="arrow">→</span>
<span class="node node-purple">睫毛<br/>眉毛</span><span class="arrow">→</span>
<span class="node node-purple">二次<br/>加深</span><span class="arrow">→</span>
<span class="node node-red">口红<br/>收官</span>
</div></div>

<div class="section"><div class="sec-title">① 底妆前：三个准备动作</div>
<div class="card card-green"><h3>清毛 → 清洁 → 补水锁水</h3>
<div class="action">清毛：顺着毛茬刮小胡子，不然隔着毛上粉底会发青</div>
<div class="action">清洁：化妆棉蘸化妆水顺纹路擦，消除粉底和脸之间的「隔合」</div>
<div class="action">补水：喷雾/精华；锁水：面霜/乳液——只补水不锁水，水一蒸发照样起皮</div>
<div class="highlight">判断标准：摸着脸微微发软，就够用了</div>
</div></div>

<div class="section"><div class="sec-title">② 防晒不搓泥的核心：别用搓</div>
<div class="card"><h3>「印」法</h3>
<div class="example">粉扑/海绵蘸防晒，往脸上「嘎嘎嘎」地印——手指不搓，自然没有泥</div>
<div class="example">用乳液压的防晒 + 粉扑，很少搓泥</div>
<div class="pitfall">上完防晒别急着叠，先扇一扇等它成膜</div>
</div></div>

<div class="section"><div class="sec-title">③ 遮瑕配色：按颜色对号入座</div>
<table>
<tr><th>瑕疵颜色</th><th>用什么色</th><th>要点</th></tr>
<tr><td>发青 / 发黄</td><td>紫色提亮</td><td>刷子铺开 + 粉扑压实</td></tr>
<tr><td>发红（大面积）</td><td>绿色遮瑕液</td><td>先处理大面积红</td></tr>
<tr><td>黑眼圈</td><td>三文鱼色</td><td>少亮多次，正面看基本不见即可</td></tr>
</table>
<div class="pitfall">黑眼圈想遮得完全看不出几乎不可能——保证正面看基本看不见就够了</div>
</div>

<div class="section"><div class="sec-title">④ 粉底 + 定妆喷雾 = 双面胶</div>
<div class="card card-purple"><h3>面中起笔，由内向外</h3>
<div class="action">遮瑕后先喷定妆喷雾：一边粘住遮瑕，一边粘住将上的粉底</div>
<div class="action">粉底第一笔落面中（里外脸分界线），再往后拍过渡到外轮廓</div>
<div class="highlight">外轮廓粉少一点反而更立体——那是修容该干活的地方</div>
</div></div>

<div class="section"><div class="sec-title">⑤ 骨相三件套：提亮 + 修容 + 腮红</div>
<div class="card card-orange"><h3>提亮：一定要比粉底白</h3>
<div class="action">不显亮 = 和粉底没拉开差距，提亮要肉眼可见白很多</div>
<div class="action">不服贴 = 掺一点刚用的粉底液再上，融合更好</div>
<div class="action">位置：面中、嘴角、下巴、鼻梁、眉骨、眼下</div>
</div>
<div class="card card-orange"><h3>修容：鼻影要有层次</h3>
<div class="action">不是一条均匀的黑：深点在鼻根两侧 → 其他地方过渡 → 往里收</div>
<div class="action">正面看哪块最突出就按哪，脸侧过来向外过渡</div>
<div class="action">嘴唇下方、下颌线也带一点阴影，立体感就出来了</div>
</div>
<div class="card card-orange"><h3>腮红：黑与白之间的桥梁</h3>
<div class="action">外圈修容是黑、里圈提亮是白，中间空档用腮红衔接，妆更自然</div>
<div class="action">鼻下、鼻背点一点腮红，像阴影一样显得鼻子高</div>
<div class="action">唇色和腮红保持同色调，脸上颜色不乱</div>
</div></div>

<div class="section"><div class="sec-title">⑥ 散粉定妆：眼皮是重点</div>
<div class="card"><h3>全脸可上 / 局部保光</h3>
<div class="action">定妆喷雾成膜后上散粉，把容易冒油、反光的地方定住</div>
<div class="highlight">眼皮一定要用小刷子沾粉定妆——不然画完眼线晕染特别快，画啥产品都没用</div>
</div></div>

<div class="section"><div class="sec-title">⑦ 眼妆手法</div>
<div class="card card-purple"><h3>眼影刷具选择</h3>
<div class="example">蓬松刷 → 大面积铺色，边缘模糊自然</div>
<div class="example">扁刺刷 → 小范围加深（眼尾、睫毛根部），边缘略硬</div>
<div class="action">眼线：刀锋刷/小笔杆抬眼皮，填睫毛根即可，新手不用翻眼皮</div>
</div></div>

<div class="section"><div class="sec-title">⑧ 睫毛与眉毛</div>
<div class="card card-green"><h3>睫毛：夹 → 打底 → 膏 →（可选）免胶假睫毛</h3>
<div class="action">夹：睫毛夹下沿对上眼皮边缘 → 眼睛上翻 → 按 → 抬</div>
<div class="action">睫毛打底=定型发胶，从睫毛根往上刷</div>
<div class="action">免胶假睫毛：夹在离真睫毛根 1/3 处，弧度朝自己</div>
</div>
<div class="card card-green"><h3>眉毛：眉粉 → 染眉膏 → 眉笔</h3>
<div class="action">眉粉按发色选色，先填眉毛底下皮的色</div>
<div class="action">染眉膏先蘸一蘸膏体，是染毛不是抹皮</div>
<div class="action">眉笔填眉毛中间那条线 = 眉毛骨架</div>
</div></div>

<div class="section"><div class="sec-title">⑨ 二次加深：层层渲染</div>
<div class="card card-red"><h3>为什么还要再补一遍</h3>
<div class="action">散粉会把油光和颜色「吃掉」，需要用更深的颜色局部再加深</div>
<div class="action">修容太黑 → 混点散粉，吸收颜色还顺带定妆</div>
<div class="action">两个修容色：浅色大面积晕 + 深色局部加重，层次就出来了</div>
<div class="action">腮红补第二遍必须和第一遍同色调</div>
</div></div>

<div class="section"><div class="sec-title">⑩ 提亮层次：大圈套小圈</div>
<table>
<tr><th>提亮类型</th><th>适用</th><th>比喻</th></tr>
<tr><td>自然白</td><td>面中、额头、下巴大面积</td><td>大圈</td></tr>
<tr><td>死白</td><td>小范围单点，不能大面积涂</td><td>小圈</td></tr>
<tr><td>珠光</td><td>鼻头等发光点，局部点上</td><td>迷你圈</td></tr>
</table>
<div class="highlight">大圈套小圈、再套迷你圈——提亮才有层次</div>
</div>

<div class="section"><div class="sec-title">⑪ 口红收官</div>
<div class="card card-red"><h3>唇线笔 = 嘴唇修容</h3>
<div class="action">先抹掉笔上蜡层再上，不然不上色</div>
<div class="action">上嘴唇薄：模糊唇缘分界线，看不清唇从哪开始 → 扩唇效果</div>
<div class="action">没血色：拿更红的色几乎只抹唇内，大盘套小圈</div>
</div></div>

<div class="conclusion">
<h2>总结与行动清单</h2>

<h3>报课前先自测（本视频方法）</h3>
<p>按流程练完一个全妆：满意 → 省下线下课的钱；还差点事 → 再带着具体问题去上课。</p>
<h3>新手最该记住的 6 件事</h3>
<ul>
<li>只补水不锁水 → 必起皮；锁水用面霜/乳液</li>
<li>防晒用「印」不用「搓」→ 基本不搓泥</li>
<li>遮瑕少亮多次 → 不卡粉；黑眼圈只求正面看基本不见</li>
<li>提亮要比粉底明显白；不服贴掺粉底液</li>
<li>眼皮必定妆 → 不然眼线晕染</li>
<li>化妆是层层渲染：一遍一遍加深，不是一步到位</li>
</ul>
<h3>最容易踩的 4 个坑</h3>
<ul>
<li>遮瑕想一步遮死黑眼圈 → 卡粉翻车</li>
<li>鼻影一条黑没层次 → 修了个寂寞</li>
<li>死白提亮大面积涂 → 涂了跟没涂一样</li>
<li>第二遍腮红换了色系 → 脸上颜色发乱</li>
</ul>

</div>
<a class="source-link" href="http://xhslink.cn/o/9TtjHs4NiCD" target="_blank" rel="noopener">→ 原视频链接（小红书）</a>
</div></div>
