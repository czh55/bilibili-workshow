.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>几何形归纳法：你会抓形吗</h1>
  <div class="meta"><span class="tag tag-blue">几何形归纳</span><span class="tag tag-green">抓形</span><span class="tag tag-orange">荷尔拜因</span><span class="tag tag-purple">动势</span><span class="tag tag-red">限时</span><span class="tag tag-gray">时长 184秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/AlYyIs2RRDj">原视频</a>
  <div class="summary-line">好形＝概括又美的几何。步骤：大势＋动势线→视觉团块几何→团块内更小几何→轻细节。必须限时、禁抠细节、对照大师。视觉团块≠解剖零件。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:16</span><span class="timeline-text">抓形技巧：几何形</span></div><div class="timeline-item"><span class="timeline-time">00:38</span><span class="timeline-text">去体积留轮廓</span></div><div class="timeline-item"><span class="timeline-time">01:02</span><span class="timeline-text">奔跑梅花鹿</span></div><div class="timeline-item"><span class="timeline-time">01:18</span><span class="timeline-text">大势＋动势线</span></div><div class="timeline-item"><span class="timeline-time">01:38</span><span class="timeline-text">视觉团块</span></div><div class="timeline-item"><span class="timeline-time">01:58</span><span class="timeline-text">更具体几何</span></div><div class="timeline-item"><span class="timeline-time">02:10</span><span class="timeline-text">轻加细节</span></div><div class="timeline-item"><span class="timeline-time">02:26</span><span class="timeline-text">三条使用说明</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">大势<br/>动势线</div><span class="arrow">→</span><div class="node-green">团块<br/>视觉几何</div><span class="arrow">→</span><div class="node-orange">细化<br/>仍是几何</div><span class="arrow">→</span><div class="node-blue">纪律<br/>限时禁抠</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「梅花路／抓型／轮廓简易」→「梅花鹿／抓形／轮廓剪影」。</p><p>误区：团块＝解剖结构。口播强调视觉团块。</p><p>误区：不限时慢慢抠会更准。视频相反。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>轮廓仍成立</h3>
      <p>去体积只留轮廓仍生动——几何形是关键。</p>
      <div class="quote">都离不开这些既概括提炼又充满美感的几何形状</div>
      <div class="relation">形先于体。</div>
    </div>
    <div class="card card-orange">
      <h3>先大势</h3>
      <p>概括轮廓剪影并带动势线；直线切或曲线找。</p>
      <div class="quote">身带一条动势线</div>
      <div class="relation">先势后块。</div>
    </div>
    <div class="card card-red">
      <h3>视觉团块</h3>
      <p>头脚可并一块——视觉团块≠生理部位。</p>
      <div class="quote">而不是客观的生理结构</div>
      <div class="relation">看见的组块优先。</div>
    </div>
    <div class="card card-purple">
      <h3>三条纪律</h3>
      <p>30秒–2分钟；禁抠细节；对照大师。</p>
      <div class="quote">绝对不能扣细节必须要概括</div>
      <div class="relation">限时强迫概括。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>方法名</p>
      <div class="quote">这就是几何形归纳法。</div>
      <div class="relation">你学会了吗</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>衔接宁方勿圆预告的练习篇。</li><li>下期体积塑造另述。</li><li>课宣非步骤。</li></ul><div class="pitfall">跳过动势线直接抠蹄。</div><div class="pitfall">按解剖拆块忽视视觉合并。</div><div class="pitfall">不限时导致细节回潮。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>几何形抓形</li><li>视觉团块</li><li>限时概括</li></ul><h3>行动清单</h3><ol><li>2分钟鹿／人速写只到团块层</li><li>头脚故意合并练一次</li><li>对照荷尔拜因轮廓</li><li>计时器固定30–120秒</li></ol><h3>关键认知转变</h3><p>以前：改来改去抠局部；现在：大势→团块→小几何→细节，限时保概括。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 184秒</div>
</div>
    </div>
  </foreignObject>
