<div class="container">
  <h1>衣服好坏分辨真的很简单。</h1>
  <div class="meta">
    <span class="tag tag-blue">小红书</span>
    <span class="tag tag-green">58秒</span>
    <span class="tag tag-orange">买衣技巧</span>
    <span class="tag tag-purple">版型结构</span>
    <span class="tag tag-gray">理性分析</span>
  </div>
  <a class="source-link" href="http://xhslink.cn/o/7cTVM9SEVsx">原视频链接（Webhook 原始 url）</a>
  <div class="summary-line">核心判断：店内分辨好坏，优先看半裙臀位放量、胸省腰省塑形与多片结构对比，再用同色晾衣绳做细节加分；松紧腰前后一片是明确避雷。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">差的／好的对照开场，建立货架快筛预期</div></div>
    <div class="timeline-item"><div class="timeline-time">00:04</div><div class="timeline-text">半裙侧看臀位是否外凸、有无放量；久坐下摆不外翘</div></div>
    <div class="timeline-item"><div class="timeline-time">00:14</div><div class="timeline-text">反例：侧面直筒无放量，臀翘也被压平</div></div>
    <div class="timeline-item"><div class="timeline-time">00:20</div><div class="timeline-text">好版型挂不平；胸省腰省让该凸凸、该收收</div></div>
    <div class="timeline-item"><div class="timeline-time">00:33</div><div class="timeline-text">纸片平直前片与松紧腰「腰围放大器」避雷</div></div>
    <div class="timeline-item"><div class="timeline-time">00:44</div><div class="timeline-text">多片结构做大小对比，腰部平整显腰细胯窄</div></div>
    <div class="timeline-item"><div class="timeline-time">00:54</div><div class="timeline-text">好衣服晾衣绳跟面料同色；差货常用黑白绳</div></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">问题<br/>版型好不好？</div>
      <div class="arrow">→</div>
      <div class="node">证据<br/>臀位／省道／片数</div>
      <div class="arrow">→</div>
      <div class="node node-green">判断<br/>结构是否贴体</div>
      <div class="arrow">→</div>
      <div class="node node-orange">行动<br/>店内三关快筛</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解与认知纠偏</h3>
    <p>「挂起来平整＝好衣服」并不成立。作者观点是：人体凹凸不平，好版型往往挂不平；真正要看的是放量、省道和分片是否服务上身线条。另：「有松紧腰就方便」也可能变成「腰围放大器」。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">分析主题：把「好版型」拆成可核对结构</h2>

    <div class="card card-green">
      <h3>1. 半裙臀位放量</h3>
      <p><span class="speaker speaker-host">在讲什么</span>侧看臀位是否向外凸起、下摆久坐是否外翘。</p>
      <p><span class="speaker speaker-host">关键理解</span>放量服务三维身体；直筒无放量会压平臀线，上身不合适。</p>
      <p><span class="speaker speaker-host">怎么用</span>把半裙侧转，看臀位外轮廓与下摆稳定性，再决定试穿。</p>
      <div class="quote">原文依据（字幕校正）：「侧过来看，看它臀位这块，是不是向外凸起的」「而且下摆久坐它也不会往外翘」[00:05–00:14]</div>
      <div class="relation">关系：臀位放量 → 上身合适 → 久坐下摆不翘</div>
    </div>

    <div class="card card-purple">
      <h3>2. 胸省腰省塑形（作者观点）</h3>
      <p><span class="speaker speaker-host">在讲什么</span>好版型挂不平；靠胸省、腰省放大优点、掩盖缺点。</p>
      <p><span class="speaker speaker-host">关键理解</span>平面裁片无法自动贴合凹凸人体；省道是把平面变成立体的关键手段。</p>
      <p><span class="speaker speaker-host">怎么用</span>翻看前侧是否有胸省／腰省或等效分片，而不是只摸面料软硬。</p>
      <div class="quote">原文依据：「好版型都挂不平」「通过做胸省、腰省……放大优点掩盖缺点，才是好版型」[00:20–00:33]</div>
      <div class="highlight">立场分层：COS 标牌是画面事实；「挂不平＝好」是作者归纳，非行业硬指标。</div>
    </div>

    <div class="card card-orange">
      <h3>3. 避雷：纸片前片与腰围放大器</h3>
      <p><span class="speaker speaker-host">在讲什么</span>前后都平像张纸，或前后一片加松紧腰头。</p>
      <p><span class="speaker speaker-host">关键理解</span>缺少结构对比时，松紧只会把余量堆在腰腹，视觉上放大腰围。</p>
      <p><span class="speaker speaker-host">怎么用</span>看到松紧腰＋前后一片，先标黄灯；优先改看多片半裙。</p>
      <div class="pitfall">「这可不叫半裙啊，这叫腰围放大器」[00:42–00:44] —— 明确避雷口号，证据强度中等（个案演示，非统计）。</div>
    </div>

    <div class="card">
      <h3>4. 多片结构与同色晾衣绳</h3>
      <p><span class="speaker speaker-host">在讲什么</span>多片做出大小对比，腰部不鼓囊；晾衣绳跟面料同色。</p>
      <p><span class="speaker speaker-host">关键理解</span>片数决定腰胯线条；挂环颜色是低成本工艺态度信号。</p>
      <p><span class="speaker speaker-host">怎么用</span>先看分片与腰部平整，再翻肩部挂环颜色作附加分。</p>
      <div class="quote">原文依据：「选多片结构的」「上身显得腰细胯窄」「好衣服的晾衣绳……会跟面料一样颜色」[00:44–00:57]</div>
      <div class="insight">适用边界：适合半裙／修身连衣裙店内快筛；不覆盖弹性针织、运动装或所有体型结论。</div>
    </div>
  </div>

  <div class="card">
    <h3>横向对比：三类半裙／成衣信号</h3>
    <table>
      <thead>
        <tr>
          <th>检查项</th>
          <th>优先信号</th>
          <th>避雷信号</th>
          <th>证据位置</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>臀位轮廓</td>
          <td>侧看外凸、有放量</td>
          <td>侧面直筒、压平臀线</td>
          <td>00:04–00:20</td>
        </tr>
        <tr>
          <td>塑形手段</td>
          <td>胸省、腰省或等效分片</td>
          <td>前后平直如纸</td>
          <td>00:20–00:38</td>
        </tr>
        <tr>
          <td>腰头结构</td>
          <td>多片收腰、腰部平整</td>
          <td>前后一片＋松紧一收</td>
          <td>00:38–00:54</td>
        </tr>
        <tr>
          <td>挂环细节</td>
          <td>晾衣绳跟面料同色</td>
          <td>通用黑白绳</td>
          <td>00:54–00:58</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>好版型服务凹凸人体：看放量与省道，不迷信「挂平」。</li>
      <li>半裙先侧看臀位，再查是否多片、腰部是否鼓囊。</li>
      <li>松紧腰前后一片被作者定性为「腰围放大器」。</li>
      <li>同色晾衣绳是附加工艺信号，不能单独定好坏。</li>
    </ul>
    <h3>行动清单</h3>
    <ol>
      <li>半裙侧转，检查臀位是否外凸、有无放量。</li>
      <li>翻看胸省／腰省或分片，确认不是前后一张纸。</li>
      <li>避开「前后一片＋松紧腰头」组合。</li>
      <li>优先多片结构，手摸腰部是否平整不鼓囊。</li>
      <li>最后看挂环颜色是否跟面料一致。</li>
    </ol>
    <h3>关键认知转变</h3>
    <p>从「摸面料软不软」转向「结构有没有给身体让位」；挂不平可能是好信号，松紧方便也可能是腰围放大器。</p>
  </div>

  <div class="footer">双轨产物 · 理性分析 · 事实／观点／推断已分层 · 时长 58 秒</div>
</div>

    </div>
  </foreignObject>
