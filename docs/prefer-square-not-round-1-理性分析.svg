      <div class="container root-wrap">
  <h1>宁方勿圆1：抓特征强化</h1>
  <div class="meta"><span class="tag tag-blue">宁方勿圆</span><span class="tag tag-green">徐渭</span><span class="tag tag-orange">特征</span><span class="tag tag-purple">造型</span><span class="tag tag-red">剪影</span><span class="tag tag-gray">时长 176秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/6eEfTaNhtbW">原视频</a>
  <div class="summary-line">宁方勿圆不是画棱角，而是敏锐抓住并大胆强化核心特征。徐渭驴／蟹、李苦禅鹰、列宾轮廓、安格尔隐含几何、角色剪影可辨——过圆＝特征被细节稀释。下期几何形归纳。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">细节充分却发软</span></div><div class="timeline-item"><span class="timeline-time">00:12</span><span class="timeline-text">宁方勿圆</span></div><div class="timeline-item"><span class="timeline-time">00:31</span><span class="timeline-text">徐渭驴背吟诗</span></div><div class="timeline-item"><span class="timeline-time">00:46</span><span class="timeline-text">耳颈臀蹄特征</span></div><div class="timeline-item"><span class="timeline-time">01:08</span><span class="timeline-text">抓特征并强化</span></div><div class="timeline-item"><span class="timeline-time">01:36</span><span class="timeline-text">李苦禅鹰</span></div><div class="timeline-item"><span class="timeline-time">01:57</span><span class="timeline-text">画得太圆</span></div><div class="timeline-item"><span class="timeline-time">02:29</span><span class="timeline-text">剪影可辨</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">方<br/>强化特征</div><span class="arrow">→</span><div class="node-green">圆<br/>细节稀释</div><span class="arrow">→</span><div class="node-orange">范例<br/>徐渭／苦禅</div><span class="arrow">→</span><div class="node-blue">下一步<br/>几何形归纳</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「宁方无缘／徐魏／鹰的会」→「宁方勿圆／徐渭／鹰的喙」。</p><p>误区：方＝到处折线。视频强调特征。</p><p>误区：细节多就艺术。特征不足仍叫太圆。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>问题对照</h3>
      <p>细节充分远看发软 vs 大师硬朗传神。</p>
      <div class="quote">答案就四个字宁方勿圆</div>
      <div class="relation">先立诊断。</div>
    </div>
    <div class="card card-orange">
      <h3>徐渭的方</h3>
      <p>方折笔墨＋耳颈臀蹄核心特征＝方。</p>
      <div class="quote">这其实就叫方</div>
      <div class="relation">特征清单可写。</div>
    </div>
    <div class="card card-red">
      <h3>太圆定义</h3>
      <p>细节仔细但特征不够强化＝画得太圆。</p>
      <div class="quote">所以叫画得太圆</div>
      <div class="relation">圆是特征不足。</div>
    </div>
    <div class="card card-purple">
      <h3>剪影验收</h3>
      <p>成功设计只给剪影也能认出。</p>
      <div class="quote">哪怕只给你一个剪影你也能一眼认出来</div>
      <div class="relation">特征在轮廓层完成。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>下期预告</p>
      <div class="quote">终极练习：几何形归纳法。</div>
      <div class="relation">叫几何形归纳法</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>轮廓／特征篇；体积篇见续集。</li><li>几何形归纳仅预告。</li><li>与 prefer-square-not-round-2 衔接。</li></ul><div class="pitfall">把方理解成锯齿边。</div><div class="pitfall">特征清单过长等同没特征。</div><div class="pitfall">只盯皮毛纹理。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>方＝强化特征</li><li>圆＝特征被稀释</li><li>剪影可验</li></ul><h3>行动清单</h3><ol><li>为对象写3条核心特征再画</li><li>涂黑检查剪影是否可辨</li><li>对照徐渭驴删掉非特征线</li><li>预习几何形归纳</li></ol><h3>关键认知转变</h3><p>以前：越圆滑越像；现在：宁方强化特征，艺术感从取舍来。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 176秒</div>
</div>
    </div>
  </foreignObject>
