<h1>“浅蓝色眼影迷离的眼神”千禧年蓝色眼影</h1>
<div class="meta">
<span class="tag tag-blue">Y2K妆容</span><span class="tag tag-green">蓝色眼影</span><span class="tag tag-orange">复古氛围</span><span class="tag tag-gray">0:15</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>千禧年复古妆容示范：<strong>浅蓝色眼影</strong>配<strong>迷离眼神</strong>。蓝色眼影是Y2K标志性单品，浅蓝大面积晕染+微眯慵懒眼神+粤语BGM，复古氛围感拉满，拍照/出片都很上镜。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">浅蓝色眼影下的迷离眼神</span></div><div class="timeline-item"><span class="timeline-time">00:04</span><span class="timeline-text">配粤语BGM营造复古氛围</span></div><div class="timeline-item"><span class="timeline-time">00:10</span><span class="timeline-text">眼神与妆效特写展示</span></div><div class="timeline-item"><span class="timeline-time">00:13</span><span class="timeline-text">千禧年复古感定格</span></div></div>
<div class='section'><div class='sec-title'>千禧年蓝色眼影的妆容要点</div><div class='card'><h3>① 蓝色眼影怎么选</h3><p>千禧年风格用<strong>浅蓝色</strong>（Baby Blue）最有标志性，比深蓝更清透、更复古。<strong>低饱和浅蓝</strong>对亚洲肤色更友好，不显脏。</p></div><div class='card card-green' style='margin:12px 0'><h3>② 眼神是灵魂</h3><p>配合<strong>迷离眼神</strong>：眼睛微眯、视线放松，像刚睡醒的慵懒感。眼神放空+蓝色眼影，立刻有“千禧年复古美人”的味道。</p></div><div class='card card-orange' style='margin:12px 0'><h3>③ 氛围感包装</h3><p>配<strong>粤语老歌BGM</strong>、商场/街景背景，整体做旧色处理——妆容好看，氛围感的包装更重要。</p></div></div>
<div class="conclusion">
<h2>Y2K蓝色眼影搭配清单</h2>
<h3>想复刻这个妆</h3><ol><li>眼影选<strong>浅蓝色（Baby Blue）</strong>，晕染范围适当放大</li><li>眼线保持<strong>干净利落</strong>，别让蓝色显脏</li><li>眼神<strong>微眯放空</strong>，迷离慵懒感</li><li>搭配<strong>复古配饰/服装</strong>，整体千禧年氛围</li></ol><h3>小提醒</h3><ul><li>蓝色眼影<strong>不要大面积铺满</strong>到眼窝外，容易显脏</li><li>肤色偏黄可选<strong>带灰调浅蓝</strong>，更高级</li></ul>
</div>
