.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style><div class="container">
<h1>4️⃣个拍照必会技巧！照着拍就能出神图</h1>
<div class="meta">
<span class="tag tag-blue">拍照技巧</span><span class="tag tag-green">构图</span><span class="tag tag-orange">手机摄影</span><span class="tag tag-gray">0:52</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>4个拍照必会技巧（含参数）：①<strong>逆光</strong>：距模特两臂、伞/手遮光、两倍焦距、额头卡第一条线；②<strong>全身</strong>：0.7焦距、退一步蹲下、机位与腰平、内扣15度、头顶留白1/3脚底贴边；③<strong>半身</strong>：机位与头平、外倾30度、两倍焦距、头顶留一格；④<strong>坐姿</strong>：退两步、机位高过头、镜头与脸平、腿向前伸贴边。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:03</span><span class="timeline-text">技巧1 拍逆光：摄影师距模特两个手臂距离，伞/手遮光，两倍焦距，额头卡第一条线</span></div><div class="timeline-item"><span class="timeline-time">00:14</span><span class="timeline-text">技巧2 拍全身：焦距0.7，摄影师后退一步蹲下，手机与腰部齐平、垂直地面内扣15度，人物中下格，头顶留白1/3脚底贴边</span></div><div class="timeline-item"><span class="timeline-time">00:27</span><span class="timeline-text">技巧3 拍半身：后退一步，手机和头齐平，向外倾斜30度，两倍焦距，头顶留白一格</span></div><div class="timeline-item"><span class="timeline-time">00:37</span><span class="timeline-text">技巧4 拍坐姿：后退两步，手机高于头顶，镜头与脸平行，人物下两格，腿向鞋前方伸出贴边</span></div></div>
<div class='section'><div class='sec-title'>四招速查表</div><table><tr><th>场景</th><th>机位</th><th>焦距</th><th>构图</th></tr><tr><td><strong>逆光</strong></td><td>距模特两臂</td><td>2倍</td><td>遮光，额头卡第一条线</td></tr><tr><td><strong>全身</strong></td><td>后退蹲下，与腰平</td><td>0.7</td><td>内扣15°，头顶留白1/3，脚底贴边</td></tr><tr><td><strong>半身</strong></td><td>后退一步，与头平</td><td>2倍</td><td>外倾30°，头顶留白一格</td></tr><tr><td><strong>坐姿</strong></td><td>后退两步，高过头</td><td>标准</td><td>脸平行，下两格，腿前伸贴边</td></tr></table></div><div class='section'><div class='sec-title'>核心要领</div><div class='card'><h3>① 逆光要“遮”</h3><p>伞或手<strong>遮住镜头前的光</strong>防过曝，焦距放大到<strong>2倍</strong>，模特<strong>额头卡在九宫格第一条线上</strong>。</p></div><div class='card card-green' style='margin:12px 0'><h3>② 全身看机位</h3><p>焦距<strong>0.7</strong>，摄影师<strong>后退一步蹲下</strong>，手机与模特<strong>腰部齐平、垂直地面</strong>再<strong>内扣15度</strong>；人物放<strong>中下两格</strong>，头顶留白1/3、脚底贴边——显高显瘦。</p></div><div class='card card-orange' style='margin:12px 0'><h3>③ 半身靠角度</h3><p>手机与<strong>头齐平</strong>，再<strong>向外倾斜30度</strong>，焦距<strong>2倍</strong>，头顶留白一格。</p></div><div class='card card-purple'><h3>④ 坐姿伸腿</h3><p>手机<strong>高于头顶</strong>、镜头与脸平行，人物放<strong>下两格</strong>；腿向鞋前方伸出去，<strong>脚贴近画面边缘</strong>——拉伸腿长。</p></div></div>
<div class="conclusion">
<h2>4招拍照速记卡</h2>
<h3>朋友也能拍的神图参数</h3><ol><li><strong>逆光</strong>：2倍焦距 + 遮光 + 额头卡第一条线</li><li><strong>全身</strong>：0.7焦距 + 蹲下与腰平 + 内扣15° + 头顶留白1/3</li><li><strong>半身</strong>：与头平 + 外倾30° + 2倍焦距 + 头顶留一格</li><li><strong>坐姿</strong>：高过头 + 脸平行 + 下两格 + 腿前伸脚贴边</li></ol><h3>通用原则</h3><ul><li>手机<span style='color:inherit'>略低</span>（腰位）显高，<span style='color:inherit'>略高</span>（过头）显脸小</li><li>头顶留白别满，脚底贴边拉比例</li><li>焦距2倍拍人像，0.7倍拍全身</li></ul>
</div>
