<h1>XiaoHongShu video #673b190f00000000060177cb</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">视频制作</span> <span class="tag tag-gray">1:06</span></div>
<div class="summary-line">只需三步,将以实现最近超火的萌板光影感调色。首先添加视频到简硬,在调色之前,我们需要先分析画面的光影关系。以这个视频为例,画面左右存在很明显的冷暖和明暗对比。所以我们就要去着重加强这些区域的光影对比。第二步,我们就可以利用萌板来圈出需要调色的区域了。先复制视频,转化中画,并对其主轨。然后在萌板里选择...</div>
<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">只需三步,将以实现最近超火的萌板光影感调色。</span></div>
<div class="timeline-item"><span class="timeline-time">[00:06]</span><span class="timeline-text">首先添加视频到简硬,在调色之前,我们需要先分析画面的光影关系。</span></div>
<div class="timeline-item"><span class="timeline-time">[00:10]</span><span class="timeline-text">以这个视频为例,画面左右存在很明显的冷暖和明暗对比。</span></div>
<div class="timeline-item"><span class="timeline-time">[00:14]</span><span class="timeline-text">所以我们就要去着重加强这些区域的光影对比。</span></div>
<div class="timeline-item"><span class="timeline-time">[00:17]</span><span class="timeline-text">第二步,我们就可以利用萌板来圈出需要调色的区域了。</span></div>
<div class="timeline-item"><span class="timeline-time">[00:20]</span><span class="timeline-text">先复制视频,转化中画,并对其主轨。</span></div>
<div class="timeline-item"><span class="timeline-time">[00:23]</span><span class="timeline-text">然后在萌板里选择一个合适的形状,圈出需要单独调色的区域。</span></div>
<div class="timeline-item"><span class="timeline-time">[00:27]</span><span class="timeline-text">这里以左边为例,为了让每个区域之间过度自然,可以适当带点语化。</span></div>
<div class="timeline-item"><span class="timeline-time">[00:32]</span><span class="timeline-text">最后第三步进入调节,对这个萌板区域单独调色。</span></div>
<div class="timeline-item"><span class="timeline-time">[00:35]</span><span class="timeline-text">根据开头分析,我们要让左半部分的色调更冷,画面更暗。</span></div>
<div class="timeline-item"><span class="timeline-time">[00:40]</span><span class="timeline-text">那么就调整与之相对应的参数即可。</span></div>
<div class="timeline-item"><span class="timeline-time">[00:42]</span><span class="timeline-text">同理,再复制一段,用萌板圈出右边区域,再通过调色。</span></div>
<div class="timeline-item"><span class="timeline-time">[00:46]</span><span class="timeline-text">让右边画面的色调更暖,画面更亮,将所有萌板区域都调好色之后,</span></div>
<div class="timeline-item"><span class="timeline-time">[00:51]</span><span class="timeline-text">再给视频分别添加一个梦幻灰光和暗角特效来增加电影感就完成了。</span></div>
<div class="timeline-item"><span class="timeline-time">[00:56]</span><span class="timeline-text">看看效果吧。</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>只需三步,将以实现最近超火的萌板光影感调色。</li>
<li>首先添加视频到简硬,在调色之前,我们需要先分析画面的光影关系。</li>
<li>以这个视频为例,画面左右存在很明显的冷暖和明暗对比。</li>
<li>所以我们就要去着重加强这些区域的光影对比。</li>
<li>第二步,我们就可以利用萌板来圈出需要调色的区域了。</li>
<li>先复制视频,转化中画,并对其主轨。</li>
<li>然后在萌板里选择一个合适的形状,圈出需要单独调色的区域。</li>
<li>这里以左边为例,为了让每个区域之间过度自然,可以适当带点语化。</li>
<li>最后第三步进入调节,对这个萌板区域单独调色。</li>
<li>根据开头分析,我们要让左半部分的色调更冷,画面更暗。</li>
<li>那么就调整与之相对应的参数即可。</li>
<li>同理,再复制一段,用萌板圈出右边区域,再通过调色。</li>
<li>让右边画面的色调更暖,画面更亮,将所有萌板区域都调好色之后,</li>
<li>再给视频分别添加一个梦幻灰光和暗角特效来增加电影感就完成了。</li>
<li>看看效果吧。</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>只需三步,将以实现最近超火的萌板光影感调色。首先添加视频到简硬,在调色之前,我们需要先分析画面的光影关系。以这个视频为例,画面左右存在很明显的冷暖和明暗对比。所以我们就要去着重加强这些区域的光影对比。第二步,我们就可以利用萌板来圈出需要调色的区域了。先复制视频,转化中画,并对其主轨。然后在萌板里选择一个合适的形状,圈出需要单独调色的区域。这里以左边为例,为了让每个区域之间过度自然,可以适当带点语化</p><p>转录分段: 15 | 时长: 1:06</p></div>
