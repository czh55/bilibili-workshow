<div class="container root-wrap">
  <h1>小个子秒变大长腿拍照姿势</h1>
  <div class="meta"><span class="tag tag-blue">拍照姿势</span><span class="tag tag-blue">显高</span><span class="tag tag-blue">小个子</span><span class="tag tag-blue">全身照</span><span class="tag tag-blue">小红书</span><span class="tag tag-gray">时长 29秒</span></div>
  <a class="source-link" href="http://xhslink.cn/o/APxuTRL0nik">原视频链接</a>
  <div class="summary-line">小个子显高五式：前伸、插腰抬腿、侧身走、抬腿伸腰、走动抓拍，用延伸与动感拉长腿部视觉。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">开场：五个显高姿势</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">动作一：三脚前伸松手伸腰</span></div><div class="timeline-item"><span class="timeline-time">00:11</span><span class="timeline-text">动作二：后插腰提包单抬腿</span></div><div class="timeline-item"><span class="timeline-time">00:16</span><span class="timeline-text">动作三：侧身向后走背头看镜头</span></div><div class="timeline-item"><span class="timeline-time">00:21</span><span class="timeline-text">动作四：侧身抬腿伸腰提鞋跟</span></div><div class="timeline-item"><span class="timeline-time">00:26</span><span class="timeline-text">动作五：发包往前走抓拍</span></div></div>
  <div class="section"><div class="sec-title">观点拆解</div><div class="card"><h3>显高核心逻辑</h3><div class="highlight">腿部延伸 + 身体线条拉伸 + 动态抓拍。</div></div><div class="card"><h3>动作一</h3><div class="highlight">三脚前伸，手放松伸腰。</div></div><div class="card"><h3>动作二</h3><div class="highlight">后插腰提包单抬腿。</div></div><div class="card"><h3>动作三四</h3><div class="highlight">侧身向后走、侧身抬腿伸腰提鞋跟。</div></div><div class="card"><h3>动作五</h3><div class="highlight">发包假装往前走抓拍，最有动感。</div></div></div>
  <div class="conclusion"><h2>行动清单</h2><ul><li>全身照用三脚前伸松手伸腰</li><li>后插腰提包单抬腿拉长腿部线条</li><li>侧身向后走背头看镜头增加延伸感</li><li>侧身抬腿伸腰提鞋跟拉伸身体</li><li>发包假装往前走抓拍出动态感</li></ul>
  <h2>适用边界</h2><p>本视频为小个子全身显高姿势教学，未涉及坐姿、蹲姿与背影姿势。</p></div>
