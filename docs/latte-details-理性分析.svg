<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2822" viewBox="0 0 1320 2822">
  <foreignObject x="0" y="0" width="1320" height="2822">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&amp;display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',-apple-system,sans-serif}
.container{width:1240px;padding:40px 40px 60px}
h1{font-size:30px;font-weight:700;color:#1a1a1a;margin-bottom:8px}
.meta{font-size:13px;color:#999;margin-bottom:8px}
.tags{margin-bottom:20px}
.tag{display:inline-block;background:#fdf2f2;color:#c0392b;padding:3px 10px;border-radius:12px;font-size:12px;margin-right:8px}
.summary-line{background:#fff5f5;border-left:4px solid #e74c3c;padding:12px 16px;margin-bottom:28px;font-size:15px;color:#555;line-height:1.7}
h2{font-size:20px;font-weight:600;color:#c0392b;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid #e74c3c;display:inline-block}
.checklist{margin-bottom:20px}
.check-item{display:flex;align-items:flex-start;padding:14px 0;border-bottom:1px solid #f0ece4}
.check-num{width:30px;height:30px;border-radius:50%;background:#e74c3c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;margin-right:16px}
.check-body{flex:1;font-size:14px;color:#555;line-height:1.8}
.check-body strong{color:#333}
.check-body .detail{font-size:13px;color:#888;margin-top:2px}
.principle{background:#faf8f5;padding:20px 24px;border-radius:12px;margin:20px 0;font-size:14px;line-height:1.9}
.principle strong{color:#c0392b}
.comparison{display:flex;gap:24px;margin:20px 0}
.comp-box{flex:1;padding:16px;border-radius:12px}
.comp-good{background:#e8f5e9}
.comp-bad{background:#fff5f5}
.comp-box h4{font-size:15px;font-weight:600;margin-bottom:8px}
.comp-good h4{color:#2e7d32}
.comp-bad h4{color:#c0392b}
.comp-box p{font-size:13px;color:#555;line-height:1.8}
.conclusion{background:linear-gradient(135deg,#fdf2f2,#fff5f5);padding:20px 24px;border-radius:8px;margin-top:28px;font-size:14px;color:#555;line-height:1.8}
.conclusion strong{color:#c0392b}
.golden-ratio{text-align:center;margin:24px 0;font-size:15px;color:#c0392b;font-weight:600}</style>
      <div class="container">
  <h1>拉花拉不出来，都是因为这几个小细节</h1>
  <div class="meta"><span>来源：小红书</span><span>时长：4分09秒</span><span>类型：综合定位篇</span></div>
  <div class="tags">
    <span class="tag">拉花基础</span><span class="tag">选材</span><span class="tag">打奶</span><span class="tag">倒缸</span><span class="tag">新手必看</span>
  </div>
  <div class="summary-line">
    <strong>一句话总结：</strong>拉花失败绝大多数不是手法问题，而是<strong>奶泡没打好</strong>和<strong>浓缩没处理好</strong>。这两个基础打好了，即使手法不怎么好也能出形状。本文逐项排查从豆到杯到手的每个环节。
  </div>

  <h2>失败原因优先级排序</h2>
  <div class="golden-ratio">基础（80%）= 奶泡均匀性 + 浓缩均匀性 &gt; 手法（20%）</div>

  <div class="comparison">
    <div class="comp-box comp-good">
      <h4>✅ 基础正确</h4>
      <p>奶泡均匀丝滑、浓缩平滑均匀<br/>→ 手法再差也能出形状</p>
    </div>
    <div class="comp-box comp-bad">
      <h4>❌ 基础不对</h4>
      <p>奶泡上面厚下面薄、浓缩张力不均<br/>→ 手法再好也推不动或一坨</p>
    </div>
  </div>

  <h2>逐项排查清单</h2>
  <div class="checklist">
    <div class="check-item">
      <div class="check-num">1</div>
      <div class="check-body">
        <strong>咖啡豆对了吗？</strong>
        <div class="detail">中深烘/深烘 → 油脂丰富；必须新鲜，放了三个月的豆子不行</div>
      </div>
    </div>
    <div class="check-item">
      <div class="check-num">2</div>
      <div class="check-body">
        <strong>牛奶对了吗？</strong>
        <div class="detail">全脂冷藏奶，蛋白质和脂肪含量越高越顺滑。脱脂/常温奶打不出好泡</div>
      </div>
    </div>
    <div class="check-item">
      <div class="check-num">3</div>
      <div class="check-body">
        <strong>杯子对了吗？</strong>
        <div class="detail">底部弧形 + 杯口大 → 流动性好 + 有发挥空间。平底直口杯不利拉花</div>
      </div>
    </div>
    <div class="check-item">
      <div class="check-num">4</div>
      <div class="check-body">
        <strong>浓缩均匀吗？</strong>
        <div class="detail">流速不能太慢（不滴答滴答）。萃取后摇一摇让油脂分布均匀，避免一边稠一边稀</div>
      </div>
    </div>
    <div class="check-item">
      <div class="check-num">5</div>
      <div class="check-body">
        <strong>打奶流程对吗？</strong>
        <div class="detail">放冷凝水 → 蒸汽棒伸入一半进气5-6秒 → 往上抬旋转切割打磨 → 烫手停。打完震桌去大泡</div>
      </div>
    </div>
    <div class="check-item">
      <div class="check-num">6</div>
      <div class="check-body">
        <strong>倒缸做了吗？</strong>
        <div class="detail">刚打好的奶泡上面厚下面薄 → 必须倒缸混合 → 再晃均匀。不做到后期厚的下来推不动</div>
      </div>
    </div>
    <div class="check-item">
      <div class="check-num">7</div>
      <div class="check-body">
        <strong>拉花前预处理了吗？</strong>
        <div class="detail">浓缩里先倒一点牛奶摇匀 → 降低表面张力差异 → 为拉花铺路</div>
      </div>
    </div>
  </div>

  <h2>拉花失败的两个典型现象及根因</h2>
  <div class="principle">
    <strong>现象1：推不动</strong> → 根因是浓缩表面张力太大（流速过慢导致油脂含量过高）或奶泡太厚不均匀。<br/>
    <strong>现象2：一倒一坨</strong> → 根因是没倒缸，后期倒出的全是厚奶泡，流动不了就堆积成一坨。
  </div>

  <h2>拉花心形标准流程</h2>
  <div class="principle">
    ① 预处理：浓缩加一点牛奶摇匀<br/>
    ② 高位置小流量融合至五六分满<br/>
    ③ 放低拉花杯，加大流量<br/>
    ④ 往前推，慢慢回杯<br/>
    ⑤ 心形完成
  </div>

  <div class="conclusion">
    <strong>练功方向：</strong>拉花不好≠手法不好，先按上面7项逐一排查基础条件。每次拉花前养成三个习惯：<strong>倒缸</strong>（让奶泡均匀）、<strong>摇浓缩</strong>（让油脂均匀）、<strong>晃奶缸</strong>（保持流动性）。基础打好后，即使手法粗糙也能做出差不多的形状——基础占80%，手法只占20%。
  </div>
</div>
    </div>
  </foreignObject>
</svg>