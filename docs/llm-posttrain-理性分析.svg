.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style><div class="container">
<h1>大语言模型原理（3）后训练</h1>
<div class="meta">
<span class="tag tag-blue">后训练</span><span class="tag tag-green">SFT</span><span class="tag tag-orange">RLHF</span><span class="tag tag-purple">DPO</span><span class="tag tag-red">3H原则</span><span class="tag tag-gray">6:23</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>后训练（对齐训练）通过<strong>SFT（监督微调，给示范学回答）+ 偏好对齐（RLHF/DPO，比答案学好坏）</strong>，让只会"接龙"的基座模型学会听懂命令、按要求回答，成为有用、诚实、无害的对话AI。</div>

<div class="timeline"><h3>内容时间线</h3>
<div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">回顾前两节：基座模型只会续写（"好好学习"→"天天向上"）</span></div>
<div class="timeline-item"><span class="timeline-time">01:04</span><span class="timeline-text"><strong>后训练概述</strong>：监督微调(SFT) + 偏好对齐，让AI回答与人类对齐</span></div>
<div class="timeline-item"><span class="timeline-time">01:18</span><span class="timeline-text"><strong>SFT详细讲解</strong>：给示范学回答；三种数据形式；调参如炒菜</span></div>
<div class="timeline-item"><span class="timeline-time">03:04</span><span class="timeline-text"><strong>调参方法</strong>：全参数微调 vs PEFT（LoRA/QLoRA）</span></div>
<div class="timeline-item"><span class="timeline-time">04:03</span><span class="timeline-text"><strong>偏好对齐</strong>：RLHF（训练奖励模型打分）vs DPO（直接对比好差答案）</span></div>
<div class="timeline-item"><span class="timeline-time">05:50</span><span class="timeline-text"><strong>三阶段总结</strong>：数据准备→预训练→后训练，从接龙到对话</span></div>
</div>

<div class="map"><h2>后训练：从接龙到对话</h2>
<div class="diagram">
<div class="node">基座大模型<br/><small>接龙大师</small></div>
<span class="arrow">→</span>
<div class="node node-green">SFT<br/><small>给示范学回答</small></div>
<span class="arrow">→</span>
<div class="node node-orange">偏好对齐<br/><small>RLHF / DPO</small></div>
<span class="arrow">→</span>
<div class="node node-purple">对齐后AI<br/><small>听得懂/答得好/安全</small></div>
</div>
<p style="text-align:center;color:#94a3b8;font-size:14px;margin-top:12px">后训练 = SFT（学会回答） + 偏好对齐（学会回答得更好、更安全）</p>
</div>

<div class="section"><div class="sec-title">监督微调（SFT）：给示范，学回答</div>
<div class="card">
<h3>SFT 六个字：给示范，学回答</h3>
<p>给模型大量标准的<strong>问答示范</strong>，让模型学会听懂任务并按人的要求回答。</p>
<div class="example"><strong>基础SFT数据示例：</strong><br/>用户："什么是token？"<br/>助手："token是大模型处理文本时的最小单位。"</div>
</div>

<div class="card card-green" style="margin:12px 0">
<h3>SFT 数据的三种形式</h3>
<table>
<tr><th>形式</th><th>结构</th><th>用途</th></tr>
<tr><td><strong>基础问答</strong></td><td>用户 → 助手</td><td>学会听懂问题并给出理想回答</td></tr>
<tr><td><strong>带系统指令</strong></td><td>系统 + 用户 → 助手</td><td>根据角色/风格/格式要求作答（如"你是小学教师"）</td></tr>
<tr><td><strong>多轮对话</strong></td><td>用户↔助手交替</td><td>模拟真实追问场景，学会上下文连贯回答</td></tr>
</table>
</div>

<div class="card card-orange">
<h3>SFT的本质：调参 = 炒菜</h3>
<p>SFT不是安装"听话模块"，而是通过训练继续<strong>调整模型原有参数</strong>，让符合指令的答案概率更高。</p>
<div class="highlight"><strong>炒菜比喻：</strong>做菜调火候、时间、调料比例 → 尝一口太咸 → 下次少放盐 → 继续调整 → 直到味道满意。调参也一样：不断调整参数中的数字，直到模型输出更符合人的期望。</div>
</div>
</div>

<div class="section"><div class="sec-title">SFT的两种调参策略</div>
<div class="card">
<h3>全参数微调 vs 参数高效微调（PEFT）</h3>
<table>
<tr><th></th><th>全参数微调</th><th>PEFT（LoRA/QLoRA）</th></tr>
<tr><td><strong>调整范围</strong></td><td>模型所有参数（embedding + Transformer各层）</td><td>原参数不变，额外加少量可训练参数</td></tr>
<tr><td><strong>炒菜比喻</strong></td><td>油盐生抽料酒所有配料重新调整</td><td>原有调料不变，新增一种配料（如十三香）只调它</td></tr>
<tr><td><strong>效果</strong></td><td>通常较好</td><td>有机会接近全参数微调</td></tr>
<tr><td><strong>成本</strong></td><td>高（大量算力和显存）</td><td>低</td></tr>
</table>
</div>
</div>

<div class="section"><div class="sec-title">偏好对齐：比答案，学好坏</div>

<div class="card card-orange">
<h3>SFT后模型的两个痛点</h3>
<div class="pitfall"><strong>痛点1：</strong>同一问题有成千上万种回答，哪个更好？模型不知道。</div>
<div class="pitfall"><strong>痛点2：</strong>模型可能踩红线——不管用户问什么都直接回答，不会判断是否危险、该不该答、答到什么程度。</div>
<div class="highlight">真正需要的回答标准——<strong>3H原则</strong>（Anthropic提出）：<strong>Helpful（有用）、Honest（诚实）、Harmless（无害）</strong></div>
</div>

<div class="card card-green" style="margin:12px 0">
<h3>方法1：RLHF（基于人类反馈的强化学习）</h3>
<p>先训练一位"老师"（奖励模型），再由老师给模型打分。</p>
<ol>
<li>模型针对同一问题生成<strong>多个答案</strong></li>
<li><strong>人类</strong>对这些答案进行<strong>比较和排序</strong>（哪个更好/更差）</li>
<li>用排序数据训练一个<strong>奖励模型</strong>（专门给答案打分）</li>
<li>主模型生成新答案 → 奖励模型打分 → 主模型按分数<strong>调整参数</strong> → 提高好答案概率、降低差答案概率</li>
</ol>
</div>

<div class="card card-purple">
<h3>方法2：DPO（直接偏好优化）</h3>
<p>更直接。训练数据中直接给出：<strong>一个问题 + 一个好答案 + 一个差答案</strong>，模型直接对比学习。</p>
<div class="highlight"><strong>区别：</strong>RLHF = 先训练老师再打分；DPO = 直接告诉模型哪个更好。DPO更简化，省去了训练奖励模型的步骤。</div>
</div>
</div>

<div class="section"><div class="sec-title">后训练 vs 预训练</div>
<table>
<tr><th>维度</th><th>预训练</th><th>后训练</th></tr>
<tr><td><strong>数据</strong></td><td>海量无标注文本</td><td>高质量标注问答对</td></tr>
<tr><td><strong>目标</strong></td><td>预测下一个Token（接龙）</td><td>按要求生成有用/诚实/无害的回答</td></tr>
<tr><td><strong>学习方法</strong></td><td>自监督（文本本身作为标签）</td><td>监督学习(SFT) + 强化学习/对比学习(RLHF/DPO)</td></tr>
<tr><td><strong>产出</strong></td><td>基座模型（接龙大师）</td><td>可对话的AI助手</td></tr>
<tr><td><strong>能力</strong></td><td>学会了语言规律和知识</td><td>学会听懂命令、按意图回答</td></tr>
</table>
</div>

<div class="conclusion"><h2>三阶段全流程总结</h2>
<h3>从接龙到对话</h3>
<ol>
<li><strong>数据准备</strong>：原始文本 → 清洗→ 分词Token化→ 随机高维向量（文本→数字）</li>
<li><strong>预训练</strong>：Transformer(自注意力+前馈)×几十层 → 预测下一个Token → 反向传播 → 基座大模型（接龙大师）</li>
<li><strong>后训练</strong>：SFT(给示范学回答) → 偏好对齐(RLHF/DPO，比答案学好坏) → 可对话的AI助手</li>
</ol>
<h3>对使用AI的启示</h3>
<ul>
<li><strong>指令的重要性</strong>：后训练让AI学会听指令，所以清晰的提问才能得到好回答</li>
<li><strong>系统提示词的原理</strong>：SFT数据中的"系统"角色解释了为什么设定角色/风格/格式能引导AI输出</li>
<li><strong>AI有价值观</strong>：偏好对齐确保AI回答"有用、诚实、无害"，所以AI不会什么都说</li>
</ul>
<p style="margin-top:16px;opacity:0.7">下一个话题：手推Transformer（1）自注意力机制</p>
</div>
