      <div class="container">
<h1>AT自动变速箱是怎么传动的？【下集】</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-green">AT</span> <span class="tag tag-green">变速箱</span> <span class="tag tag-green">行星齿轮</span> <span class="tag tag-green">4速</span> <span class="tag tag-gray">12:31</span></div>
<div class="summary-line">AT变速箱（下集）以一台4速AT为例，展示前后两组行星齿轮+5组离合片如何通过不同组合实现4个前进挡+1个倒挡，完整揭示自动变速箱的换挡逻辑。</div>

<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">4ETE四速AT结构：前后两组行星齿轮+5组离合片</span></div>
<div class="timeline-item"><span class="timeline-time">02:30</span><span class="timeline-text">1挡：后行星齿轮组单独工作，太阳轮→行星架（最大减速比）</span></div>
<div class="timeline-item"><span class="timeline-time">05:00</span><span class="timeline-text">2挡：后太阳轮+后齿圈同时输入→合成输出</span></div>
<div class="timeline-item"><span class="timeline-time">07:30</span><span class="timeline-text">3挡和4挡：前行星齿轮组逐渐介入，实现更高挡位</span></div>
<div class="timeline-item"><span class="timeline-time">10:00</span><span class="timeline-text">倒挡：后行星齿轮组反向输出</span></div></div>

<div class="map"><h2>核心脉络图</h2><div class="diagram"><div class="node node">上集：行星齿轮基础<br/><small>三种基本模式</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node-green">两组行星齿轮<br/><small>前后两组/复用组合</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node-green">5组离合片<br/><small>控制锁定/连接/断开</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node-orange">4前进挡+1倒挡<br/><small>不同离合组合=不同挡位</small></div></div></div>

<div class="section">
  <div class="sec-title">观点卡片</div>
  <div class="card card-green"><h3>从行星齿轮到完整变速箱</h3>
<p><strong>上集结论：</strong>一组行星齿轮通过固定不同部件可实现多种速比。</p><p><strong>本集核心：</strong>实际AT变速箱使用前后两组行星齿轮+5组离合片，通过不同离合片的锁止/分离组合来切换挡位：</p><p>• 1挡：仅后行星齿轮组，太阳轮输入→行星架输出=最大减速<br/>• 2挡：后太阳轮+后齿圈同时由不同路径输入<br/>• 3挡/4挡：前行星齿轮组逐步介入<br/>• 倒挡：后行星齿轮组反向路径</p><div class="insight">下集衔接：理解4速AT后，多速AT（6/8/10速）的原理类似，只是行星齿轮组和离合片更多、组合更复杂。</div>
<div class="quote">"能把这大家本来没什么机会体验得到的美妙和快乐带给更多人——这是做视频的初衷和动力。"</div></div>
</div>

<div class="section"><div class="sec-title">横向对比表</div><table><tr><th>挡位</th><th>工作行星齿轮组</th><th>驱动路径</th><th>特征</th></tr>
<tr><td>1挡</td><td>后组</td><td>太阳轮→行星架</td><td>最大减速比/最大扭矩</td></tr>
<tr><td>2挡</td><td>后组</td><td>太阳轮+齿圈→行星架</td><td>中等减速比</td></tr>
<tr><td>3挡</td><td>前+后组</td><td>两组协同</td><td>接近直接驱动</td></tr>
<tr><td>4挡</td><td>前+后组</td><td>超速挡路径</td><td>增速（高速巡航省油）</td></tr>
<tr><td>R倒挡</td><td>后组</td><td>反向路径</td><td>输出反转</td></tr></table></div>

<div class="section">
  <div class="sec-title">行动清单</div>
  <div class="card card-green"><ol><li>理解离合片在AT中的核心作用（锁止/连接/断开）</li>
<li>对比4速AT与多速AT的原理差异</li>
<li>关注现代AT的液力变矩器锁止范围对效率的影响</li></ol></div>
</div>

<div class="section">
  <div class="sec-title">避坑总结</div>
  <div class="card card-red"><ol><li>以为AT的挡位靠"换齿轮"实现（实际是离合片组合切换）</li>
<li>忽视液力变矩器的作用（启动/低速时的柔性连接）</li>
<li>混淆行星齿轮组和离合片的功能</li></ol></div>
</div>

<div class="section">
  <div class="sec-title">方法边界</div>
  <div class="boundary">本集以4速AT为例讲解原理。现代AT（6/8/10速）结构更复杂但基础原理相同。实际换挡逻辑还涉及液力变矩器锁止、换挡时机控制等，不同厂商策略不同。</div>
</div>


    <div class="section">
      <div class="sec-title">立场分层</div>
      <div class="card card-green"><h3>可验证事实</h3><ul><li>4ETE变速箱有2组行星齿轮+5组离合片</li><li>换挡通过不同离合片锁止/分离组合实现</li><li>每个挡位对应特定的行星齿轮工作路径</li></ul></div>
      <div class="card card-orange"><h3>UP主观点</h3><ul><li>UP主认为AT的行星齿轮设计非常巧妙</li><li>搞懂美妙的事物能带来快乐</li></ul></div>
      <div class="card card-purple"><h3>基于原文的推断</h3><ul><li>多速AT通过增加行星齿轮组和离合片实现更多挡位</li></ul></div>
    </div>

<div class="conclusion">
  <h2>一句话总结</h2>
  <p>AT变速箱（下集）以一台4速AT为例，展示前后两组行星齿轮+5组离合片如何通过不同组合实现4个前进挡+1个倒挡，完整揭示自动变速箱的换挡逻辑。</p>
  <p style="margin-top:16px;opacity:0.7">基于 Whisper 语音转录 × SVG 结构化分析 | 时长 12:31</p>
</div>
