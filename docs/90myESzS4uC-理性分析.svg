<h1>50毫米镜头为什么是标准镜头？</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">摄影技巧</span> <span class="tag tag-blue">视频制作</span> <span class="tag tag-gray">1:45</span></div>
<div class="summary-line">为什么50毫米被誉为标准镜头简单的原因是50毫米焦距在光学性能、体积、成本制造难度之间取得了最好的平衡用现代的话说就是当年摄影权的爆款产品相反越极端的焦段制造出成像优秀且大光权的镜头越困难在早期焦片的年代套机都是捆绑一个标准焦段45、50、55、58毫米取决于平排优势是便宜容易上手出片有效的让更多消...</div>
<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">为什么50毫米被誉为标准镜头</span></div>
<div class="timeline-item"><span class="timeline-time">[00:02]</span><span class="timeline-text">简单的原因是50毫米焦距</span></div>
