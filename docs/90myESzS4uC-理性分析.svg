<div class="timeline-item"><span class="timeline-time">[00:06]</span><span class="timeline-text">制造难度之间取得了最好的平衡</span></div>
<div class="timeline-item"><span class="timeline-time">[00:08]</span><span class="timeline-text">用现代的话说</span></div>
<div class="timeline-item"><span class="timeline-time">[00:09]</span><span class="timeline-text">就是当年摄影权的爆款产品</span></div>
<div class="timeline-item"><span class="timeline-time">[00:11]</span><span class="timeline-text">相反越极端的焦段</span></div>
<div class="timeline-item"><span class="timeline-time">[00:13]</span><span class="timeline-text">制造出成像优秀</span></div>
<div class="timeline-item"><span class="timeline-time">[00:14]</span><span class="timeline-text">且大光权的镜头越困难</span></div>
<div class="timeline-item"><span class="timeline-time">[00:16]</span><span class="timeline-text">在早期焦片的年代</span></div>
<div class="timeline-item"><span class="timeline-time">[00:18]</span><span class="timeline-text">套机都是捆绑一个标准焦段</span></div>
<div class="timeline-item"><span class="timeline-time">[00:20]</span><span class="timeline-text">45、50、55、58毫米</span></div>
<div class="timeline-item"><span class="timeline-time">[00:23]</span><span class="timeline-text">取决于平排</span></div>
<div class="timeline-item"><span class="timeline-time">[00:24]</span><span class="timeline-text">优势是便宜</span></div>
<div class="timeline-item"><span class="timeline-time">[00:25]</span><span class="timeline-text">容易上手出片</span></div>
<div class="timeline-item"><span class="timeline-time">[00:26]</span><span class="timeline-text">有效的让更多消费者跌入摄影坑</span></div>
<div class="timeline-item"><span class="timeline-time">[00:29]</span><span class="timeline-text">第一台批量销售的35毫米相机</span></div>
