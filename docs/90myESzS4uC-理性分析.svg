<div class="timeline-item"><span class="timeline-time">[00:32]</span><span class="timeline-text">就选用了50毫米F3.5</span></div>
<div class="timeline-item"><span class="timeline-time">[00:34]</span><span class="timeline-text">作为套头搭配</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>为什么50毫米被誉为标准镜头</li>
<li>简单的原因是50毫米焦距</li>
<li>在光学性能、体积、成本</li>
<li>制造难度之间取得了最好的平衡</li>
<li>用现代的话说</li>
<li>就是当年摄影权的爆款产品</li>
<li>相反越极端的焦段</li>
<li>制造出成像优秀</li>
<li>且大光权的镜头越困难</li>
<li>在早期焦片的年代</li>
<li>套机都是捆绑一个标准焦段</li>
<li>45、50、55、58毫米</li>
<li>取决于平排</li>
<li>优势是便宜</li>
<li>容易上手出片</li>
<li>有效的让更多消费者跌入摄影坑</li>
<li>第一台批量销售的35毫米相机</li>
<li>就选用了50毫米F3.5</li>
<li>作为套头搭配</li>
<li>制作变焦镜头技术越来越好</li>
<li>套机镜头开始被24-55</li>
<li>24-70之类的变焦镜头取代</li>
<li>数码时代</li>
<li>我们很少再能看到50毫米定焦</li>
<li>作为套头销售</li>
<li>而50毫米</li>
<li>真不是人眼视野看到的焦段</li>
<li>这点很容易批摇</li>
<li>这是50毫米拍的</li>
<li>我们再仔细看一下周围</li>
<li>我们的视野比50毫米宽多了</li>
<li>更像是运动相机的视角</li>
<li>但50毫米近视人眼视角的理论</li>
<li>也不是完全无道理</li>
<li>假设站在一幅画座前</li>
<li>我们人类会很自然地调整</li>
<li>我们离画幅的距离</li>
<li>直到画幅边缘</li>
<li>和我们的视角线</li>
<li>呈30-60度之间</li>
<li>因为这个是人眼十字</li>
<li>变色的视野范围</li>
<li>是人眼获取信息的密集区域</li>
<li>而50毫米的视角</li>
<li>就是46度</li>
<li>35毫米胶卷的对角线为43毫米</li>
<li>也和整数的50毫米接近</li>
<li>这种焦距</li>
<li>被认为能提供最自然</li>
<li>或中性的通知效果</li>
<li>所以50毫米作为标准焦段</li>
<li>是早期工业能力</li>
<li>和营销环境的历史原因</li>
<li>结合了人体工学和审美</li>
<li>逐渐演化出来的概念</li>
<li>更多关于镜头的特性</li>
<li>可以回看我的长视频</li>
<li>镜头的秘密</li>
<li>感谢收看《全人声》</li>
<li>咱们下期再见</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>为什么50毫米被誉为标准镜头简单的原因是50毫米焦距在光学性能、体积、成本制造难度之间取得了最好的平衡用现代的话说就是当年摄影权的爆款产品相反越极端的焦段制造出成像优秀且大光权的镜头越困难在早期焦片的年代套机都是捆绑一个标准焦段45、50、55、58毫米取决于平排优势是便宜容易上手出片有效的让更多消费者跌入摄影坑第一台批量销售的35毫米相机莱卡一就选用了50毫米F3.5作为套头搭配渐渐的制作变焦镜</p><p>转录分段: 63 | 时长: 1:45</p></div>
