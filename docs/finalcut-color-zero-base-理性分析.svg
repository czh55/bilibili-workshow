.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>Final Cut 零基础调色：LUT→曝光→色轮</h1>
  <div class="meta"><span class="tag tag-blue">Final Cut</span><span class="tag tag-green">LUT</span><span class="tag tag-orange">颜色板</span><span class="tag tag-purple">色轮</span><span class="tag tag-red">冷暖</span><span class="tag tag-gray">时长 203秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/4JsvDEt90vA">原视频</a>
  <div class="summary-line">S-Log3 灰片先官方 LUT 还原；二级前用颜色板分层把曝光做对（高光≤100、阴影≥1，看波形）；再用色轮高光偏暖、阴影偏冷，中调定风格。新手优先练明暗＋冷暖双对比，曲线留进阶。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:28</span><span class="timeline-text">套官方还原 LUT</span></div><div class="timeline-item"><span class="timeline-time">00:52</span><span class="timeline-text">强调先调曝光</span></div><div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">颜色板分层曝光</span></div><div class="timeline-item"><span class="timeline-time">01:20</span><span class="timeline-text">打开波形参考</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">色轮冷暖分层</span></div><div class="timeline-item"><span class="timeline-time">02:40</span><span class="timeline-text">新手先练双对比</span></div><div class="timeline-item"><span class="timeline-time">03:15</span><span class="timeline-text">回顾前后</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">还原<br/>官方 LUT</div><span class="arrow">→</span><div class="node-green">曝光<br/>分层到位</div><span class="arrow">→</span><div class="node-orange">色调<br/>高光暖阴影冷</div><span class="arrow">→</span><div class="node-blue">练习<br/>明暗+冷暖</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>繁体口播已转简体。</p><p>ASR「拼暖／银色板／钢货」→「偏暖／颜色板／干货」。</p><p>误区：先猛调颜色再补曝光。视频强调曝光先正确。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>链路顺序</h3>
      <p>LUT 还原 → 曝光分层 → 色轮冷暖；顺序反了颜色难归位。</p>
      <div class="quote">只有正确的曝光颜色才会去它该去的位置</div>
      <div class="relation">曝光是色相的坐标轴。</div>
    </div>
    <div class="card card-orange">
      <h3>曝光纪律</h3>
      <p>高光近 100 不超，阴影近 1 不低于；中调看风格；波形辅助。</p>
      <div class="quote">正常来讲把高光拉到100，不超过100</div>
      <div class="relation">数字边界防死白死黑。</div>
    </div>
    <div class="card card-red">
      <h3>冷暖分层</h3>
      <p>现场暖光时高光偏橙、阴影偏蓝，增加层次；中调定整体风格。</p>
      <div class="quote">增加画面的冷暖对比更有层次</div>
      <div class="relation">冷暖是第二层对比，叠在明暗之上。</div>
    </div>
    <div class="card card-purple">
      <h3>新手范围</h3>
      <p>先练明暗对比与冷暖对比；曲线与色相饱和度曲线可后置。</p>
      <div class="quote">可以先以增加画面明暗对比和冷暖对比来练习</div>
      <div class="relation">复杂度服从可重复练习。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>流程可参考</p>
      <div class="quote">这个调色流程希望给你参考</div>
      <div class="relation">方法模板，非唯一审美。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>针对 FCP 颜色板／色轮入门，非达芬奇节点课。</li><li>默认素材路径为 Sony S-Log3＋官方 LUT。</li><li>「100／1」为口播常规值，需结合监视与风格。</li></ul><div class="pitfall">灰片未还原就二级调色。</div><div class="pitfall">只调全局不管高光阴影分层。</div><div class="pitfall">新手同时堆曲线导致不可控。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>先还原</li><li>曝光分层</li><li>冷暖分层</li></ul><h3>行动清单</h3><ol><li>同一灰片走完：官方 LUT → 颜色板曝光 → 色轮冷暖</li><li>打开波形，把高光压在约 100 内、阴影不低于约 1</li><li>只练明暗对比＋冷暖对比各做一版前后截图</li><li>曲线与色相饱和度曲线留到曝光稳定后再碰</li></ol><h3>关键认知转变</h3><p>以前：打开色轮乱拧；现在：曝光到位再让冷暖为层次服务。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 203秒</div>
</div>
    </div>
  </foreignObject>
</svg>