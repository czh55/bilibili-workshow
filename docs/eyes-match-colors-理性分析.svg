      <div class="container root-wrap">
  <h1>让眼睛来配色：同时对比</h1>
  <div class="meta"><span class="tag tag-blue">同时对比</span><span class="tag tag-green">纯度</span><span class="tag tag-orange">索罗拉</span><span class="tag tag-purple">瑞鹤图</span><span class="tag tag-red">配色</span><span class="tag tag-gray">时长 137秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/3FADbvd6nTY">原视频</a>
  <div class="summary-line">同蓝换暖底更显蓝；索罗拉海沙活泼但取色纯度不高——强对比色互相推向补色，眼睛脑补更鲜艳（同时对比）。用法：中纯对比并置＋焦点高饱和；灰粉灰蓝加明度差亦耐看。堆纯度适得其反。《瑞鹤图》石青与金殿互推。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">提纯 vs 换背景</span></div><div class="timeline-item"><span class="timeline-time">00:09</span><span class="timeline-text">橙底让蓝更蓝</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">索罗拉海沙对比</span></div><div class="timeline-item"><span class="timeline-time">00:30</span><span class="timeline-text">取色：纯度并不高</span></div><div class="timeline-item"><span class="timeline-time">00:47</span><span class="timeline-text">同时对比原理</span></div><div class="timeline-item"><span class="timeline-time">00:50</span><span class="timeline-text">摄影：中纯对比＋焦点</span></div><div class="timeline-item"><span class="timeline-time">01:18</span><span class="timeline-text">勿堆纯度</span></div><div class="timeline-item"><span class="timeline-time">01:22</span><span class="timeline-text">灰粉灰蓝壁纸</span></div><div class="timeline-item"><span class="timeline-time">01:35</span><span class="timeline-text">瑞鹤图石青与金殿</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">滤镜<br/>同时对比</div><span class="arrow">→</span><div class="node-green">证据<br/>低纯仍鲜</div><span class="arrow">→</span><div class="node-orange">用法<br/>中纯＋焦点</div><span class="arrow">→</span><div class="node-blue">反例<br/>硬堆纯度</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「并制／主字／LOS壁纸／锐鹤图／金电」→「并置／主次／iOS壁纸／瑞鹤图／金殿」。</p><p>误区：鲜艳＝高纯度堆料。视频强调关系激活眼睛。</p><p>误区：背景也上最高饱和。最高饱和应留给焦点。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>眼睛自带滤镜</h3>
      <p>同色换对比底可更鲜；暖橙旁的蓝被推得更蓝。</p>
      <div class="quote">人的眼睛自带滤镜</div>
      <div class="relation">感知色≠颜料测定色。</div>
    </div>
    <div class="card card-orange">
      <h3>低纯仍可活泼</h3>
      <p>索罗拉海沙取色纯度不高，靠对比互相推向补色。</p>
      <div class="quote">其实啊它们的纯度并不高</div>
      <div class="relation">鲜艳感可外包给同时对比。</div>
    </div>
    <div class="card card-red">
      <h3>用法与反例</h3>
      <p>中纯对比并置＋焦点高饱和；一味堆纯度适得其反。</p>
      <div class="quote">再把最高饱和的强调色留给视觉焦点</div>
      <div class="relation">饱和预算要集中投放。</div>
    </div>
    <div class="card card-purple">
      <h3>瑞鹤图互推</h3>
      <p>石青让金殿更金，金殿让天空更蓝；鹤微暖靠蓝天。</p>
      <div class="quote">石青让金殿更金，金殿让天空更蓝</div>
      <div class="relation">古典画是同时对比教科书。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>底层逻辑</p>
      <div class="quote">这是一种强大的视觉语法思维。</div>
      <div class="relation">这就叫色彩的底层逻辑</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>137 秒配色原理，不含完整调和课（下期预告）。</li><li>壁纸案例为现代迁移，非唯一解。</li><li>片尾课程推销非技法结论。</li></ul><div class="pitfall">处处高饱和，焦点淹没。</div><div class="pitfall">对比色纯度都拉满导致打架。</div><div class="pitfall">取色不验证就断定大师「颜料很纯」。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>同时对比激活鲜艳感</li><li>中纯并置＋焦点高饱和</li><li>石青／金殿式互推</li></ul><h3>行动清单</h3><ol><li>同色块对黑／橙底各拍一张，记录观感差</li><li>从喜欢的画吸色，核对实际纯度</li><li>人物照选中纯对比背景，焦点留一处高饱和</li><li>试灰粉＋灰蓝＋明度差小样</li></ol><h3>关键认知转变</h3><p>以前：靠提纯制造对比；现在：设计关系让眼睛自动加饱和滤镜。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 137秒</div>
</div>
