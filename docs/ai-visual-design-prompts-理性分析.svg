.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>5组视觉设计提示词：分离、动机光、尺度、色彩、动线</h1>
  <div class="meta"><span class="tag tag-blue">AI绘画</span><span class="tag tag-green">提示词</span><span class="tag tag-orange">主体分离</span><span class="tag tag-purple">动机光</span><span class="tag tag-red">色彩锚点</span><span class="tag tag-gray">视觉动线</span><span class="tag tag-gray">时长 47秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/4son0WFRX48">原视频</a>
  <div class="summary-line">五组设计提示词都在写「关系」：主体如何从背景分离、光从哪来、巨大感靠什么参照、色彩如何锚点、视线走哪条路径。meta 标题为空，以画面组名为准。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">主体分离：轮廓光／对比</span></div><div class="timeline-item"><span class="timeline-time">00:09</span><span class="timeline-text">动机光：无／实景／动机</span></div><div class="timeline-item"><span class="timeline-time">00:19</span><span class="timeline-text">尺度参照：人物／多层</span></div><div class="timeline-item"><span class="timeline-time">00:30</span><span class="timeline-text">色彩锚点：点缀色／隔离／主导色</span></div><div class="timeline-item"><span class="timeline-time">00:39</span><span class="timeline-text">视觉动线：对角／S型</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">分离<br/>轮廓光·对比</div><span class="arrow">→</span><div class="node-green">光源<br/>实景·动机</div><span class="arrow">→</span><div class="node-orange">尺度<br/>人物·多层</div><span class="arrow">→</span><div class="node-blue">色彩<br/>锚点三法</div><span class="arrow">→</span><div class="node">动线<br/>对角·S</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「十几光源／单一点追色」按画面改为「实景光源／单一一点缀色」。</p><p>误区：只提高分辨率。视频强调分离、动机、尺度、色彩、动线五类结构。</p><p>误区：画面干净就等于好看。无动线时仍不知先看哪里。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-orange">
      <h3>主体分离：先让人看见谁</h3>
      <p>无分离则主体糊进背景。轮廓光边缘一圈光让主体跳出；对比分离靠明暗，不加光也能突出。</p>
      <div class="quote">边缘加一圈光，主体立刻跳出来……拉开明暗关系，不加光也能突出主体</div>
      <div class="relation">可读性优先于装饰。</div>
    </div>
    <div class="card card-purple">
      <h3>动机光：光要有来历</h3>
      <p>无动机光有光却不知从哪来。实景光源把灯管／屏幕／警示灯放进画面更可信；动机光来自门缝、窗外、月光，更有故事。</p>
      <div class="quote">光来自门缝、窗外、月光，画面更有故事</div>
      <div class="relation">光源叙事 = 可信度。</div>
    </div>
    <div class="card card-green">
      <h3>尺度与色彩锚点</h3>
      <p>只写巨大不够，要人物或人物+车+平台参照。色彩上：一点缀色抓视线、隔离突出主体、主导色统一氛围。</p>
      <div class="quote">只保留一个亮色，视线马上被抓住……一种颜色控制整张图</div>
      <div class="relation">尺度与色彩都是注意力工具。</div>
    </div>
    <div class="card card-red">
      <h3>视觉动线：给眼睛一条路</h3>
      <p>无动线时干净却迷茫。对角线带来速度与冲击；S 型曲线引导更流畅。把动线类型写进构图提示。</p>
      <div class="quote">斜线带来速度感和冲击力……曲线引导视线，画面更流畅</div>
      <div class="relation">构图动词比形容词更可执行。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>47 秒五组速览，非完整构图课或模型参数手册。</li><li>示例为概念对照卡，落地需结合具体模型语法。</li><li>「更有故事／更真实」为观感描述。</li></ul><div class="pitfall">主体与背景明度色相都接近，靠后期锐化硬抠。</div><div class="pitfall">光很亮但场景内找不到光源动机。</div><div class="pitfall">高饱和满屏，没有锚点色。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>五组提示词写的是视觉关系，不是滤镜名</li><li>分离→动机光→尺度→色彩→动线可作检查清单</li><li>每组都有「无／有」对照词可直接粘贴</li></ul><h3>行动清单</h3><ol><li>出图前用五组清单自检：谁突出、光从哪、尺度在哪、色锚在哪、眼怎么走</li><li>提示词模板按组名各备一句正例与反例</li><li>大场面必加尺度参照物</li><li>动态题材优先试对角线动线</li></ol><h3>关键认知转变</h3><p>以前：堆风格词盼「高级」；现在：按分离、动机、尺度、锚点、动线写结构提示词。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 47秒</div>
</div>
    </div>
  </foreignObject>
</svg>