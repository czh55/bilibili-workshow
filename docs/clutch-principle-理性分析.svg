<li>在拨面图中</li>
<li>也就是上下这两块区域</li>
<li>那现在我们把这些所有的零部件装到一起</li>
<li>发动机动力从左边这样过来</li>
<li>那么飞轮是固定在发动机端的</li>
<li>变速箱的输入轴</li>
<li>则是从右边这样插进来</li>
<li>它一头架在了红色的定位轴程上</li>
<li>另一头架在了绿色的分离轴程上</li>
<li>两侧都是自由转动的</li>
<li>和发动机一侧没有任何的连接</li>
<li>但是它中间的大家看</li>
<li>这一段它是带齿的</li>
<li>而离合器片中间的这个孔</li>
<li>大家看它内部其实也是带齿的</li>
<li>把离合器片这样套在变速箱的</li>
<li>这根输入轴上以后</li>
<li>它们两个就成为了一体转动的</li>
<li>那么讲到这里其实就有眉目了</li>
<li>想要让发动机和变速箱实现离合</li>
<li>其实就是要固定在发动机上的飞轮</li>
