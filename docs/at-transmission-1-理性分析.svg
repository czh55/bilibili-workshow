      <div class="container">
<h1>AT自动变速箱是怎么传动的？【上集】</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-green">AT</span> <span class="tag tag-green">自动变速箱</span> <span class="tag tag-green">行星齿轮</span> <span class="tag tag-green">变速</span> <span class="tag tag-gray">11:42</span></div>
<div class="summary-line">AT变速箱（上集）从自行车变速类比出发，引入行星齿轮组的三种基本传动模式：固定外齿圈/太阳轮/行星架中的任意一个，就能得到不同速比。</div>

<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">从自行车变速类比：大带小=低速大力，小带大=高速省力</span></div>
<div class="timeline-item"><span class="timeline-time">04:40</span><span class="timeline-text">汽车同理：需要不同速比应对不同路况和动力需求</span></div>
<div class="timeline-item"><span class="timeline-time">07:01</span><span class="timeline-text">行星齿轮三部：太阳轮(中心)、行星架(携行星轮)、外齿圈(外环)</span></div>
<div class="timeline-item"><span class="timeline-time">09:21</span><span class="timeline-text">三种基本模式：固定其一，输入其二，输出其三→不同速比</span></div></div>

<div class="map"><h2>核心脉络图</h2><div class="diagram"><div class="node node">自行车变速<br/><small>大带小/小带大</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node-green">行星齿轮<br/><small>太阳轮+行星架+齿圈</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node">固定齿圈<br/><small>输入太阳→输出行星架</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node">固定太阳轮<br/><small>输入行星架→输出齿圈</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node">固定行星架<br/><small>输入太阳→输出齿圈(倒挡)</small></div></div></div>

<div class="section">
  <div class="sec-title">观点卡片</div>
  <div class="card "><h3>行星齿轮的三种基本模式</h3>
<p>一组行星齿轮有三个核心部件：<strong>太阳轮（中心粉红色）、行星架（携多个行星轮）、外齿圈（最外层）</strong>。</p><p>改变"固定哪一个"和"从哪输入/从哪输出"，就能得到不同的传动比和方向：</p><p>①固定外齿圈，输入太阳轮→输出行星架=减速增扭（低挡）<br/>②固定太阳轮，输入行星架→输出外齿圈=增速减扭（高挡/超速挡）<br/>③固定行星架，输入太阳轮→输出外齿圈=反向（倒挡）</p><div class="insight">上集关键：一组行星齿轮通过改变锁定/输入/输出的组合，就能实现多种速比。下集将展示如何用多组行星齿轮+离合片实现一台完整的4速AT变速箱。</div>
<div class="quote">"传统AT变速箱采用行星齿轮结构，比手动变速箱的外齿轮设计更巧妙、体积更小。"</div></div>
</div>

<div class="section"><div class="sec-title">横向对比表</div><table><tr><th>固定</th><th>输入</th><th>输出</th><th>结果</th></tr>
<tr><td>外齿圈</td><td>太阳轮</td><td>行星架</td><td>减速增扭（低挡）</td></tr>
<tr><td>太阳轮</td><td>行星架</td><td>外齿圈</td><td>增速减扭（超速挡）</td></tr>
<tr><td>行星架</td><td>太阳轮</td><td>外齿圈</td><td>反向（倒挡）</td></tr>
<tr><td>外齿圈</td><td>行星架</td><td>太阳轮</td><td>增速（反向超速挡）</td></tr></table></div>

<div class="section">
  <div class="sec-title">行动清单</div>
  <div class="card card-green"><ol><li>理解行星齿轮三种基本模式是看懂AT变速箱的基础</li>
<li>对比手动变速箱（外齿轮一对一挡位）与AT（行星齿轮复用）</li>
<li>为理解下集4速AT完整结构打好基础</li></ol></div>
</div>

<div class="section">
  <div class="sec-title">避坑总结</div>
  <div class="card card-red"><ol><li>混淆三个部件的名称和作用</li>
<li>以为行星齿轮只能做一种速比</li>
<li>忽略倒挡也是通过行星齿轮实现的</li></ol></div>
</div>

<div class="section">
  <div class="sec-title">方法边界</div>
  <div class="boundary">本集为上集，介绍行星齿轮的基础原理。实际AT变速箱使用多组行星齿轮+多组离合片/制动器实现多个前进挡和倒挡。下集将以4速AT为例完整展示。</div>
</div>


    <div class="section">
      <div class="sec-title">立场分层</div>
      <div class="card card-green"><h3>可验证事实</h3><ul><li>行星齿轮由太阳轮/行星架/外齿圈三部分组成</li><li>固定不同部件可得到不同速比和方向</li><li>AT变速箱核心是行星齿轮组+离合片</li></ul></div>
      <div class="card card-orange"><h3>UP主观点</h3><ul><li>UP主认为AT的行星齿轮设计比手动变速箱更巧妙</li></ul></div>
      <div class="card card-purple"><h3>基于原文的推断</h3><ul><li>理解行星齿轮是理解AT/混动ECVT的基础</li></ul></div>
    </div>

<div class="conclusion">
  <h2>一句话总结</h2>
  <p>AT变速箱（上集）从自行车变速类比出发，引入行星齿轮组的三种基本传动模式：固定外齿圈/太阳轮/行星架中的任意一个，就能得到不同速比。</p>
