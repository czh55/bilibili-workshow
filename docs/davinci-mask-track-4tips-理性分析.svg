      <div class="container root-wrap">
  <h1>达芬奇遮罩跟踪麻烦？带来四种遮罩跟踪技巧</h1>
  <div class="meta"><span class="tag tag-blue">达芬奇</span><span class="tag tag-green">遮罩跟踪</span><span class="tag tag-orange">差集</span><span class="tag tag-purple">帧跟踪</span><span class="tag tag-red">交互模式</span><span class="tag tag-gray">时长 10分02秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/2VO8BZy19nT">原视频</a>
  <div class="summary-line">跟踪也要偷懒：相对不动可不跟；遮挡平移用差集+帧关键帧；大幅移动删背景十字点再续跟；出画则移出或动态关键帧淡出。四法约覆盖八成，疑难再用神奇遮罩。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">相对位置几乎不变 → 可不跟踪</span></div><div class="timeline-item"><span class="timeline-time">01:35</span><span class="timeline-text">窗外圆减人物；墙侵入加方差集+帧跟踪</span></div><div class="timeline-item"><span class="timeline-time">05:30</span><span class="timeline-text">跟丢：交互模式删背景点，只留人物点续跟</span></div><div class="timeline-item"><span class="timeline-time">07:50</span><span class="timeline-text">出画：帧模式移出，或动态关键帧重置淡出</span></div><div class="timeline-item"><span class="timeline-time">09:40</span><span class="timeline-text">四法≈80%；剩 20% 再用神奇遮罩</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">偷懒<br/>相对不动 → 不跟</div><span class="arrow">→</span><div class="node-green">遮挡<br/>差集 + 帧关键帧</div><span class="arrow">→</span><div class="node-orange">跟丢<br/>删背景跟踪点</div><span class="arrow">→</span><div class="node-blue">出画<br/>移出 / 动态关键帧</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「真跟踪/真选项」校正为「帧跟踪/帧模式」；「差距」校正为「差集」；「揉化」校正为「柔化」；「线电器」校正为「限定器」；「拨删」校正为「多删」；「关键针」校正为「关键帧」；「矫正气」校正为「校正器」；「三连」口误保留为三连。</p><p>误区：运动镜头遮罩都必须跟踪。相对位置不变可不跟。</p><p>误区：跟丢就改神奇遮罩。先清背景十字点往往能续上。</p><p>误区：直墙侵入硬缩圆遮罩。规则遮挡用方形差集更稳。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>可不跟踪：相对位置不变</h3>
      <p>人与镜头都晃，但人在画面中位置几乎不动时，光源与地面大遮罩建好即可，不必为跟而跟。</p>
      <div class="quote">不是所有的运动镜头的遮罩都必须要跟踪的</div>
      <div class="relation">建遮罩偷懒，跟踪同样偷懒。</div>
    </div>
    <div class="card card-orange">
      <h3>差集口令：谁被减点谁</h3>
      <p>圆窗外减人物钢笔；墙侵入再加方并差集。帧模式下改形状自动打关键帧，让方遮罩随墙走。</p>
      <div class="quote">谁被减掉，就选择谁的差距</div>
      <div class="relation">右钮差集、左钮反转，配对记。</div>
    </div>
    <div class="card card-red">
      <h3>跟丢主因：背景十字点</h3>
      <p>交互模式可见跟踪点；点落在背景会被带走。跟丢前一帧框删背景点，宁多勿留，再正向续跟。</p>
      <div class="quote">遮罩跟丢的原因是因为这些十字点被背景带走了</div>
      <div class="relation">先清点，再谈换工具。</div>
    </div>
    <div class="card card-green">
      <h3>出画：移出或淡出</h3>
      <p>光出画后遮罩停原地：帧模式把遮罩移出画；或两头动态关键帧，后帧重置对比度等，让强化线性变淡。</p>
      <div class="quote">让它在光出画的同时，我们也把这个遮罩移出画</div>
      <div class="relation">效果可渐隐，不必死跟空画。</div>
    </div>
    <div class="card card-purple">
      <h3>边界：八成四法，两成神遮</h3>
      <p>机器够力且碰上疑难再上神奇遮罩。限定器与遮罩高度绑定。</p>
      <div class="quote">这四种方法基本上能够应付得了我们超过80%的情况了</div>
      <div class="relation">先穷尽便宜办法。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>跟踪演示依赖具体运镜与遮挡几何，换镜头需重测。</li><li>帧模式/交互模式按钮位置随达芬奇版本可能变化。</li><li>「约 80%」为作者经验比例，非统计结论。</li><li>素材领取信息为引流，实录不展开。</li></ul><div class="pitfall">相对不动仍强行跟踪，浪费时间。</div><div class="pitfall">直墙侵入硬改圆遮罩，边缘永远有破绽。</div><div class="pitfall">跟丢不看交互模式点分布，直接放弃。</div><div class="pitfall">物体出画仍保持全力度遮罩效果。</div><div class="pitfall">差集点错遮罩，选区变成并集或反选。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>相对不动 → 不跟踪</li><li>遮挡平移 → 差集 + 帧关键帧</li><li>大幅移动 → 删背景点续跟</li><li>出画 → 移出或动态关键帧淡出</li></ul><h3>行动清单</h3><ol><li>先问相对位置变不变，不变就不跟</li><li>重叠用差集；规则遮挡加几何遮罩</li><li>跟丢打开交互模式清背景十字点</li><li>出画优先移遮罩或关键帧淡出效果</li><li>四法不够且机器够再上神奇遮罩</li></ol><h3>关键认知转变</h3><p>以前：运动镜头一律苦跟、跟丢就放弃；现在：分类处理，差集与清点优先于神器。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 10分02秒</div>
</div>
    </div>
  </foreignObject>
</svg>