<li>首先我要提取它的颜色</li>
<li>作为法则中的10%</li>
<li>然后让我们打开色环</li>
<li>在其中寻找对象的互补色</li>
<li>作为背景</li>
<li>60%的主色也就找到了</li>
<li>但这样的画面太冲</li>
<li>比如我们说要找一些</li>
<li>跟主色相近的辅色</li>
<li>来填充剩下的30%</li>
<li>这样便完成了</li>
<li>6比3比1的法则</li>
<li>像是韦三德森伯达佩斯大凡</li>
<li>店中的粉蓝对抗</li>
