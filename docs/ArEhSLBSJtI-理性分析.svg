<div class="card"><h3>内容要点</h3><ul><li>电影拍摄中有一个颜色法则6比3比1</li>
<li>其在一个整体中</li>
<li>60%的颜色作为主色调</li>
<li>30%为辅色</li>
<li>剩下10%作为对比色</li>
<li>用来突出主题或主题</li>
