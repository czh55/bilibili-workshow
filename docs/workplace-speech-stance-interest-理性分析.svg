.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>在职场，公开言论是维护自己和利益的</h1>
  <div class="meta"><span class="tag tag-blue">职场</span><span class="tag tag-green">公开表达</span><span class="tag tag-orange">立场三角</span><span class="tag tag-purple">跨部门沟通</span><span class="tag tag-red">复盘</span><span class="tag tag-gray">时长 3分20秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/7ubQDD3wwVA">原视频</a>
  <div class="summary-line">公开言论首先是立场与利益工具，不是思想表达场。一句话同时完成评价、定位、结盟；开口前用三问改写问题定义与站位，第一目标是推动结果。事实/立场/利益三层，比多加班更能决定事能不能推动。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">立题：公开言论维护立场与利益；会议/汇报/群/跨部门皆立场</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">踩坑：复盘有什么说什么 → 得罪所有人却未推动结果</span></div><div class="timeline-item"><span class="timeline-time">00:56</span><span class="timeline-text">模型：杜布瓦立场三角＝评价 · 定位 · 结盟</span></div><div class="timeline-item"><span class="timeline-time">01:28</span><span class="timeline-text">三问：定义问题 / 放在什么位置 / 希望和谁站一起</span></div><div class="timeline-item"><span class="timeline-time">02:50</span><span class="timeline-text">价值：统一判断、调位置、推同一结果；非变圆滑</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">公开言论<br/>维护立场与利益</div><span class="arrow">→</span><div class="node-green">立场三角<br/>评价→定位→结盟</div><span class="arrow">→</span><div class="node-orange">开口三问<br/>定义 / 位置 / 站队</div><span class="arrow">→</span><div class="node-blue">目标<br/>推动结果</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「后盘/多语言化/有一千备用」校正为「复盘/圆滑/有用得多」。</p><p>「杜布瓦」保留为作者口中的模型来源名，不作额外学术考证。</p><p>误区：真话+就事论事就能自保。视频证明真话也可条条伤立场。</p><p>误区：公开表达＝变圆滑。作者明确是否定圆滑，是要懂价值结构。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-red">
      <h3>踩坑：真话也能得罪干净</h3>
      <p>复盘时点名预算、采购、产品、现场互动，自以为真诚，却让各部门感到被甩锅/点名/暴露问题，领导看到矛盾却无结果。真假不等于有没有伤害立场。</p>
      <div class="quote">我说的每句话可能都是真的，但每句话确实都伤害了某个人的立场</div>
      <div class="relation">先查「这句话伤了谁的立场」，再查事实对错。</div>
    </div>
    <div class="card ">
      <h3>立场三角：评价 · 定位 · 结盟</h3>
      <p>公开场合一句话同时完成三动作。评价即定位；定位即宣布与谁站一起、与谁对立。「我只是就事论事」救不了你，因为听众听到的从来不只是观点。</p>
      <div class="quote">一句话从来不只是在表达观点，而是在完成三个动作：评价、定位、结盟</div>
      <div class="relation">模型来源按作者口述「杜布瓦」保留。</div>
    </div>
    <div class="card card-orange">
      <h3>第一问：怎么定义问题？</h3>
      <p>谁定义问题，谁决定责任与资源怎么分。「宣发预算没给够」把问题甩给财务/老板，对方只会自证预算没问题。应改成目标与资源如何分配的可推动问题（如预算与引流的交换关系）。</p>
      <div class="quote">把问题从谁做错了，变成目标和资源怎么分配</div>
      <div class="relation">定义问题＝分配责任的前戏。</div>
    </div>
    <div class="card card-green">
      <h3>第二问：放在什么位置？</h3>
      <p>任何评价都有位置。指责采购拖延＝对方责任人、自己受害者，易遭反击。应先站到对结果负责的位置，再提配合需求。第一目标是推动结果，不是证明无辜；越急自证，越像有问题。</p>
      <div class="quote">记住我们的第一目标是推动结果，而不是证明自己无辜</div>
      <div class="relation">站位先于话术。</div>
    </div>
    <div class="card card-purple">
      <h3>第三问：希望和谁站一起？</h3>
      <p>对齐是最易被忽略也最值钱的一点。表达前算清：保护谁、伤害谁、需要谁支持、谁可能反对。同一方案对人不同，重点应不同（对领导讲业务结果，对产品讲用户反馈）。</p>
      <div class="quote">表达之前先想清楚这句话会保护谁的利益、伤害谁的利益</div>
      <div class="relation">结盟设计先于公开发言。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">三层决定论</h2><div class="card"><table><thead><tr><th>层级</th><th>决定什么</th><th>公开表达时要问</th></tr></thead><tbody><tr><td>事实</td><td>你说得对不对</td><td>证据是否充分？</td></tr><tr><td>立场</td><td>别人愿不愿听</td><td>这句话把谁放在对立面？</td></tr><tr><td>利益</td><td>事能不能推动</td><td>谁受益、谁受损、需要谁点头？</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>个人运营复盘经验，非劳动法或合规举报指南。</li><li>「杜布瓦立场三角」按作者口述引用，未展开学术定义。</li><li>预算/引流数字为举例框架，不是该活动的实测归因。</li><li>不适用于需要如实披露风险、安全或合规问题的强制报告场景——那时事实义务优先于「站队」技巧。</li></ul><div class="pitfall">复盘有什么说什么，只顾真话不顾立场伤害。</div><div class="pitfall">用「就事论事」当免死金牌。</div><div class="pitfall">开口先甩锅到预算/他人，逼对方自证。</div><div class="pitfall">急于自证清白，把目标从推动结果换成洗白自己。</div><div class="pitfall">把立场思维理解成圆滑说谎。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>公开言论首先服务立场与利益，不是思想表达</li><li>一句话＝评价 + 定位 + 结盟</li><li>开口前三问：定义问题、位置、站队；第一目标推动结果</li><li>事实/立场/利益三层，比加班更能决定推动力</li></ul><h3>行动清单</h3><ol><li>开会前写下三问答案，写不出就不先开口</li><li>把「谁做错了」改写成「目标与资源怎么分」</li><li>汇报先声明自己对结果负责，再提配合清单</li><li>按听众改重点：领导看业务结果，协作方看其关切</li><li>复盘禁用公开点名式「甩锅清单」，改用可推动的资源请求</li></ol><h3>关键认知转变</h3><p>以前：以为敢讲真话真诚就能推进工作；现在：先过立场三角与三问，让公开表达统一判断、调整位置、把资源推向同一结果。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 3分20秒</div>
</div>
    </div>
  </foreignObject>
</svg>