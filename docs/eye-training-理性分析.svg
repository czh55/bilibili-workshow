.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style><div class="container">
<h1>模特私藏眼神训练法！学会眼睛上镜超有神~</h1>
<div class="meta">
<span class="tag tag-blue">表情管理</span><span class="tag tag-green">眼神训练</span><span class="tag tag-orange">上镜</span><span class="tag tag-gray">0:52</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>模特眼神训练法：①眼睛<strong>不要过来过去</strong>，只练<strong>一种状态</strong>——闭、睁、迷离；②用下巴控制眼神：<strong>收下巴=发力</strong>，<strong>微抬下巴=迷离</strong>，放松=松弛有气力感；③不同拍摄场景：<strong>正常展示=放松自然</strong>、温柔眼神<strong>要带点笑</strong>、清澈明亮<strong>要减灵感</strong>；④关键在<strong>定住</strong>：每个点位数一二三定住，学会定住就能驾驭风格。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">眼睛不要过来过去，只有一种状态</span></div><div class="timeline-item"><span class="timeline-time">00:02</span><span class="timeline-text">可以闭、可以睁、可以迷离</span></div><div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">收下巴它就发力了，微抬下巴它就迷离了</span></div><div class="timeline-item"><span class="timeline-time">00:13</span><span class="timeline-text">放松了、松弛了，有气力感</span></div><div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">正常展示：放松很自然的眼神</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">柔和温柔的眼神：要带点笑</span></div><div class="timeline-item"><span class="timeline-time">00:26</span><span class="timeline-text">清澈明亮的眼神：要有灵感</span></div><div class="timeline-item"><span class="timeline-time">00:34</span><span class="timeline-text">把这几种眼神学会，学会定住</span></div><div class="timeline-item"><span class="timeline-time">00:37</span><span class="timeline-text">在每一个点位定住：一二三</span></div><div class="timeline-item"><span class="timeline-time">00:44</span><span class="timeline-text">每个点位定下来，拍到风格就能驾驭了</span></div></div>
<div class='section'><div class='sec-title'>眼神控制核心</div><div class='diagram'><div class='node'>眼睛不乱动<br/><small>一种状态</small></div><span class='arrow'>→</span><div class='node'>闭/睁/迷离</div><span class='arrow'>→</span><div class='node'>下巴控眼神<br/><small>收=发力 抬=迷离</small></div><span class='arrow'>→</span><div class='node node-green'>每个点位定住</div></div></div><div class='section'><div class='sec-title'>不同场景的眼神</div><div class='card'><h3>① 发力感</h3><p><strong>收下巴</strong>眼睛就发力了——眼神有力度，适合酷感、凌厉风格。</p></div><div class='card card-green' style='margin:12px 0'><h3>② 迷离感</h3><p><strong>微抬下巴</strong>眼睛就迷离了——松弛、慵懒、有故事感。</p></div><div class='card card-orange' style='margin:12px 0'><h3>③ 放松自然</h3><p>正常展示时就是<strong>放松、自然</strong>的眼神，有气力感但不刻意。</p></div><div class='card card-purple' style='margin:12px 0'><h3>④ 柔和温柔</h3><p>温柔的眼神<strong>要带点笑</strong>——嘴角微扬，眼神跟着柔下来。</p></div><div class='card card-red'><h3>⑤ 清澈明亮</h3><p>清澈明亮的眼神<strong>要有灵感（减灵感）</strong>——眼神聚焦、有光点。</p></div></div>
<div class="conclusion">
<h2>眼神训练清单</h2>
<h3>训练步骤</h3><ol><li><strong>练状态</strong>：对着镜子练闭、睁、迷离三种状态，眼睛不乱飘</li><li><strong>练控制</strong>：收下巴练发力，微抬下巴练迷离</li><li><strong>练场景</strong>：放松自然、带笑温柔、聚焦清澈，逐一来</li><li><strong>练定住</strong>：每个点位数“一二三”定住，再换下一个点位</li></ol><h3>记住</h3><ul><li>上镜眼神的核心是<strong>定得住、不乱飘</strong></li><li>一个眼神学会定住，<strong>就能驾驭所有风格</strong></li></ul>
</div>
