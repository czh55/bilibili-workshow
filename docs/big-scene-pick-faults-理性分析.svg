      <div class="container root-wrap">
  <h1>大场景画面强化层次，新手必学——挑刺！</h1>
  <div class="meta"><span class="tag tag-blue">达芬奇</span><span class="tag tag-green">大场景</span><span class="tag tag-orange">层次</span><span class="tag tag-purple">挑刺</span><span class="tag tag-red">曝光分区</span><span class="tag tag-gray">时长 10分08秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/2R2qICZPFQG">原视频</a>
  <div class="summary-line">大场景层次＝还原准色 → 主体/光区/背光三区曝光 → 挑刺修离谱亮面 → 再补青橙与降红。电影感外观不能代替前面的层次与挑刺；口令是缺啥补啥。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">曲线拉开黑白位；偏黄则降色温、色调略品红</span></div><div class="timeline-item"><span class="timeline-time">01:50</span><span class="timeline-text">主体提高光压阴影；并行光区加对比；外部压背光暗面</span></div><div class="timeline-item"><span class="timeline-time">05:03</span><span class="timeline-text">挑刺：右侧墙过亮，压暗并略提高光</span></div><div class="timeline-item"><span class="timeline-time">05:50</span><span class="timeline-text">色调补窗青→并行找回暖；降红；提高青密度</span></div><div class="timeline-item"><span class="timeline-time">07:45</span><span class="timeline-text">暗角避开光源；电影感外观；还原对比</span></div><div class="timeline-item"><span class="timeline-time">08:50</span><span class="timeline-text">工具非唯一；缺啥补啥</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">顺序<br/>还原 → 三区曝光 → 挑刺 → 颜色</div><span class="arrow">→</span><div class="node-green">三区<br/>主体 / 光区 / 背光</div><span class="arrow">→</span><div class="node-orange">挑刺<br/>对照现场灯光逻辑</div><span class="arrow">→</span><div class="node-blue">忌讳<br/>跳过层次直接上外观</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「挥冰」校正为「灰片」；「往屏/屁影」校正为「往品红」；「安卓要再加P / Option加B」校正为「Shift+P / Option+P 建并行」；「制造」校正为「遮罩」；「压按」校正为「压暗」；「瘦光面」校正为「受光面」；「金层色调」校正为「青橙色调」；「发屏」校正为「发平」；「挑次」校正为「挑刺」；「老查」校正为「老叉」；「摆平痕」校正为「白平衡」；「赞联」校正为「三连」。</p><p>误区：大场景先堆电影感外观。视频强调先层次与挑刺。</p><p>误区：只压背光曝光。应压暗面、护微弱受光，避免发闷。</p><p>误区：一上来锁死偏暖。应先校准，暖意后加。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>先准色：黑白位 + 白平衡</h3>
      <p>曲线拉开黑白位后，用分量图看受光面 RGB 接近即可。不准会隐性伤肤色与本色；喜欢暖可后面单独加。</p>
      <div class="quote">我建议大家先把颜色调准，让我们的调色是在一个正确的基础上来进行的</div>
      <div class="relation">准色是后续分区与染色的地基。</div>
    </div>
    <div class="card card-orange">
      <h3>三区曝光：主体、光区、背光</h3>
      <p>主体遮罩略提高光再压阴影防发灰；光区加对比+轴心；背光用外部节点，靠对比度压暗面而非整块闷死。</p>
      <div class="quote">我们对于一个画面一定要先找主体，主体一定是被强化的</div>
      <div class="relation">对标现场打光：亮的打亮，其余让位。</div>
    </div>
    <div class="card card-red">
      <h3>挑刺：离谱亮面对照光向</h3>
      <p>左来光却右墙更亮就不合理。遮罩压暗时仍略提高光，护受光面不闷。</p>
      <div class="quote">既然光是从左侧照射来的，那必然会呈现左侧亮于右侧的一个结果</div>
      <div class="relation">挑刺＝用灯光逻辑找违和。</div>
    </div>
    <div class="card card-green">
      <h3>颜色：缺青补青，过红就降</h3>
      <p>色调给窗光补青，并行找回暖成青橙；暗部红过强用蜘蛛网降；青太浮则提密度沉下去。</p>
      <div class="quote">缺啥补啥，哪里不够强我们就强化哪里，哪里太强我们就弱化哪里</div>
      <div class="relation">染色服务层次，不另起炉灶。</div>
    </div>
    <div class="card card-purple">
      <h3>外观是加成不是跳板</h3>
      <p>暗角避开光源；电影感外观好用，但跳过前序节点仍会发平。不会的工具别硬上。</p>
      <div class="quote">前面这些节点该做还得做，挑刺该做还得做</div>
      <div class="relation">工具多路径，效果非唯一绑定。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>个人调色演示与经验口令，非达芬奇官方手册。</li><li>室内灯光与道具特定，参数需按自己波形重调。</li><li>「电影感外观创造器」名称以软件版本界面为准。</li><li>课程/素材平台为引流信息，实录不展开。</li></ul><div class="pitfall">灰片未准就全局染色，后面想改冷调不干净。</div><div class="pitfall">只提主体不处理光区与背光，画面仍平。</div><div class="pitfall">压背光时整块降曝光导致发闷。</div><div class="pitfall">暗角压到主光源，光感变怪。</div><div class="pitfall">不做层次直接拖外观创造器。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>还原准色 → 三区曝光 → 挑刺 → 颜色</li><li>挑刺对照现场光向与抢戏面</li><li>青橙：补缺色 + 并行找回</li><li>外观不能替代层次</li></ul><h3>行动清单</h3><ol><li>开篇用曲线+分量图把灰片与白平衡做稳</li><li>按主体/光区/背光三节点做曝光，外部节点偷懒</li><li>对照光向找过亮墙/过红暗部，逐条挑刺</li><li>缺青补青、过艳降饱和或提密度</li><li>最后才暗角与外观；与还原做开关对比</li></ol><h3>关键认知转变</h3><p>以前：大场景不知从哪下手、直接堆风格；现在：先准色与三区，再挑刺补色，外观放最后。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 10分08秒</div>
</div>
    </div>
  </foreignObject>
</svg>