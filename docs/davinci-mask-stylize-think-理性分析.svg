      <div class="container root-wrap">
  <h1>达芬奇的遮罩要怎么用？风格化要怎么思考</h1>
  <div class="meta"><span class="tag tag-blue">达芬奇</span><span class="tag tag-green">遮罩</span><span class="tag tag-orange">柔化</span><span class="tag tag-purple">渐变</span><span class="tag tag-red">风格化</span><span class="tag tag-gray">时长 8分27秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/ANBoBvHVVfl">原视频</a>
  <div class="summary-line">遮罩服务对还原的不满：先 HDR 展脸体积（全局副作用再用遮罩纠）。提人、强化相机、压中间亮区；柔化开大。弄清圆遮罩与渐变范围。风格从已有色夹角长出，亮暖暗冷要物理自洽。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">HDR 展脸 40–75 区间立体</span></div><div class="timeline-item"><span class="timeline-time">02:08</span><span class="timeline-text">三遮罩：人 / 相机 / 中间亮</span></div><div class="timeline-item"><span class="timeline-time">03:25</span><span class="timeline-text">圆遮罩与渐变范围课</span></div><div class="timeline-item"><span class="timeline-time">05:40</span><span class="timeline-text">暗角；加绿纠肤；高光加暖</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">先<br/>全局体积</div><span class="arrow">→</span><div class="node-green">再<br/>遮罩主次</div><span class="arrow">→</span><div class="node-orange">懂<br/>柔化范围</div><span class="arrow">→</span><div class="node-blue">色<br/>夹角+亮暖</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「波星图」校正为「波形图」；「急交点缓和线」校正为「交叉点与缓和线」；「角属架移」校正为「角架/灯架」；「人物体量」校正为「人物提亮」；「Android Out加P」校正为「Alt/Option+P」；「亮补」校正为「亮部」；「制造」校正为「遮罩」；「逐渐简单」校正为「逐渐减弱」；「打分起」校正为「达芬奇」；「暗不去」校正为「暗部去」；「薄度」校正为「饱和度」；「左右左右对比度」校正为「柔和/偏移式对比」；「偏移色能」校正为「偏移色轮」；「绝对你」校正为「觉得对你」。</p><p>误区：一上来小遮罩猛提。</p><p>误区：不懂柔化圈却怪边缘。</p><p>误区：风格化不管亮暖暗冷落点。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>遮罩=局部纠正不满</h3>
      <p>先 HDR 展灰面立体；全局会改环境亮度，再用遮罩抢回视线中心。</p>
      <div class="quote">遮罩的使用呢其实就是反映你对画面不满的优化结果的</div>
      <div class="relation">先全局，再局部。</div>
    </div>
    <div class="card card-orange">
      <h3>柔化开大，力度宁小</h3>
      <p>提人/强化相机/压中间亮。提太多边缘又明显；柔化尽可能大。</p>
      <div class="quote">柔化尽可能的大一点，这样可以减少遮罩边缘过于明显的风险</div>
      <div class="relation">三刀改变曝光比重。</div>
    </div>
    <div class="card card-green">
      <h3>把圈与箭头读懂</h3>
      <p>圆遮罩：全效圈、柔化起点、衰减到0。渐变：线后满效，沿箭头衰减。</p>
      <div class="quote">染色行为就变成0了</div>
      <div class="relation">Shift+H 验证范围。</div>
    </div>
    <div class="card card-purple">
      <h3>风格：夹角色 + 亮暖自洽</h3>
      <p>从画面已有蓝/橙夹角加绿并纠肤。远处高光仍冷则遮罩局部加温。</p>
      <div class="quote">暖的区域一般会发生在高光区域，而冷的则是暗部</div>
      <div class="relation">怪往往是冷暖落点物理不一致。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>人像+相机道具场景。</li><li>遮罩示意为教学夸张染色。</li><li>软对比收尾可选。</li></ul><div class="pitfall">未全局展体积就猛遮罩。</div><div class="pitfall">柔化过小露边。</div><div class="pitfall">风格加绿后高光区仍冷。</div><div class="pitfall">不理解渐变方向调反。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>先 HDR 再遮罩纠主次</li><li>柔化大、力度小</li><li>读懂圆/渐变范围</li><li>风格自洽亮暖暗冷</li></ul><h3>行动清单</h3><ol><li>波形看脸区间再 HDR</li><li>人/道具/抢戏区三刀</li><li>练习读遮罩圈与箭头</li><li>盘点已有色→夹角染色→补亮暖</li></ol><h3>关键认知转变</h3><p>以前：不知何时画遮罩、边缘发飘；现在：全局体积→遮罩主次→范围可读→风格物理自洽。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 8分27秒</div>
</div>
    </div>
  </foreignObject>
</svg>