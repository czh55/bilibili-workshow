<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">来,看案例,这位司机进行车房停车</span></div>
<div class="timeline-item"><span class="timeline-time">[00:02]</span><span class="timeline-text">由于路不是很宽,调整了很多次都没有成功路库</span></div>
<div class="timeline-item"><span class="timeline-time">[00:05]</span><span class="timeline-text">整体来说还是车身偏外,最终还是放下了车位</span></div>
<div class="timeline-item"><span class="timeline-time">[00:09]</span><span class="timeline-text">所以我们讲,问题出现在哪里</span></div>
<div class="timeline-item"><span class="timeline-time">[00:11]</span><span class="timeline-text">它前面的操作没有任何问题,先贴近旁边车</span></div>
<div class="timeline-item"><span class="timeline-time">[00:14]</span><span class="timeline-text">给左侧车头留出外摆的空间</span></div>
<div class="timeline-item"><span class="timeline-time">[00:16]</span><span class="timeline-text">但倒置一半,它把前轮回正了</span></div>
<div class="timeline-item"><span class="timeline-time">[00:18]</span><span class="timeline-text">所以就导致后车轮没有送进去</span></div>
<div class="timeline-item"><span class="timeline-time">[00:20]</span><span class="timeline-text">你看我们一直讲,车身偏外的主要原因</span></div>
<div class="timeline-item"><span class="timeline-time">[00:23]</span><span class="timeline-text">就是因为后车轮没有送到位</span></div>
<div class="timeline-item"><span class="timeline-time">[00:25]</span><span class="timeline-text">所以我们在倒车的同时,随着后轮往库里面走</span></div>
<div class="timeline-item"><span class="timeline-time">[00:28]</span><span class="timeline-text">车头外摆的空间也会越来越大</span></div>
<div class="timeline-item"><span class="timeline-time">[00:30]</span><span class="timeline-text">这时候不应该回正方向</span></div>
<div class="timeline-item"><span class="timeline-time">[00:32]</span><span class="timeline-text">而是加大角度,继续倒车</span></div>
<div class="timeline-item"><span class="timeline-time">[00:34]</span><span class="timeline-text">目的就一个,把后车轮先送进去</span></div>
<div class="timeline-item"><span class="timeline-time">[00:36]</span><span class="timeline-text">你不用管车身角度停成什么样子</span></div>
<div class="timeline-item"><span class="timeline-time">[00:39]</span><span class="timeline-text">只要后车轮能到位,并且车头右前方有空间</span></div>
<div class="timeline-item"><span class="timeline-time">[00:42]</span><span class="timeline-text">就等于已经进空了</span></div>
<div class="timeline-item"><span class="timeline-time">[00:44]</span><span class="timeline-text">之后只需要右前方走一点,反方向倒一点</span></div>
<div class="timeline-item"><span class="timeline-time">[00:47]</span><span class="timeline-text">重复此操作,也就可以了</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>来,看案例,这位司机进行车房停车</li>
<li>由于路不是很宽,调整了很多次都没有成功路库</li>
<li>整体来说还是车身偏外,最终还是放下了车位</li>
<li>所以我们讲,问题出现在哪里</li>
<li>它前面的操作没有任何问题,先贴近旁边车</li>
<li>给左侧车头留出外摆的空间</li>
<li>但倒置一半,它把前轮回正了</li>
<li>所以就导致后车轮没有送进去</li>
<li>你看我们一直讲,车身偏外的主要原因</li>
<li>就是因为后车轮没有送到位</li>
<li>所以我们在倒车的同时,随着后轮往库里面走</li>
<li>车头外摆的空间也会越来越大</li>
<li>这时候不应该回正方向</li>
<li>而是加大角度,继续倒车</li>
<li>目的就一个,把后车轮先送进去</li>
<li>你不用管车身角度停成什么样子</li>
<li>只要后车轮能到位,并且车头右前方有空间</li>
<li>就等于已经进空了</li>
<li>之后只需要右前方走一点,反方向倒一点</li>
<li>重复此操作,也就可以了</li>
<li>车身角度是最好调整的</li>
<li>即使你倒成这个样子,也是同样的操作</li>
<li>右前方走一点,反方向倒一点</li>
<li>但切记,右前方走的时候不要走太多</li>
<li>不然后车轮会被拉出去,车身还是会偏外</li>
<li>好,下一期咱们缩短车位</li>
<li>就是在你倒车时已经打死方向了</li>
<li>但因为车位很短,后车轮还是送不进去</li>
<li>或者你的车感不是很好</li>
<li>车头外摆时总是害怕刮到前车头</li>
<li>这种车位有没有办法可以进</li>
<li>好,我们下期见</li>
</ul></div>
