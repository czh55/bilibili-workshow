<h1>拍摄眼神控制不好？错误示范&正确示范</h1>
<div class="meta">
<span class="tag tag-blue">拍照眼神</span><span class="tag tag-green">表情管理</span><span class="tag tag-orange">上镜技巧</span><span class="tag tag-gray">0:45</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>拍摄眼神控制：①<strong>不能瞪眼</strong>看镜头、也<strong>不要闭眼</strong>；②往上/往下看都容易翻出眼白或闭眼，是错误示范；③正确做法：<strong>头不动、眼睛看镜头、放松</strong>；<strong>刷眼皮（双眼皮）往下放松、不要往上</strong>，上下合一点点；④眼睛可以往两边看但<strong>不能看太多</strong>——中间一个点，一二三看三个点就够了，防止眼白过多。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">眼神不能这样：瞪眼睛看镜头</span></div><div class="timeline-item"><span class="timeline-time">00:03</span><span class="timeline-text">也不要闭眼</span></div><div class="timeline-item"><span class="timeline-time">00:05</span><span class="timeline-text">往上看、往两边看、往下看——眼睛太多不好拍</span></div><div class="timeline-item"><span class="timeline-time">00:14</span><span class="timeline-text">往下看很多人是闭着眼睛看的，这几个表情不能做</span></div><div class="timeline-item"><span class="timeline-time">00:21</span><span class="timeline-text">正确：头不动，眼睛看镜头，放松</span></div><div class="timeline-item"><span class="timeline-time">00:28</span><span class="timeline-text">刷眼皮不要往上，往下放松，上下合一点点</span></div><div class="timeline-item"><span class="timeline-time">00:34</span><span class="timeline-text">眼睛可以往两边看，但不能看太多</span></div><div class="timeline-item"><span class="timeline-time">00:37</span><span class="timeline-text">中间一个点，一二三看三个点就够了</span></div><div class="timeline-item"><span class="timeline-time">00:41</span><span class="timeline-text">看太多眼白越来越多，防止眼白</span></div></div>
<div class='section'><div class='sec-title'>错误 vs 正确</div><table><tr><th>动作</th><th>错误</th><th>正确</th></tr><tr><td><strong>看镜头</strong></td><td>瞪眼睛</td><td>头不动、眼神放松</td></tr><tr><td><strong>看别处</strong></td><td>上下左右乱飘</td><td>中间一个点，一二三看三个点</td></tr><tr><td><strong>闭眼</strong></td><td>直接闭眼</td><td>刷眼皮往下放松，上下合一点点</td></tr><tr><td><strong>往两边看</strong></td><td>看太多露眼白</td><td>不超过三个点</td></tr></table></div><div class='section'><div class='sec-title'>四个不能做的错误</div><div class='card'><h3>① 不能瞪眼睛看镜头</h3><p>瞪眼会显得凶、生硬、不自然，拍照时最忌这种用力过猛的看镜头。</p></div><div class='card card-green' style='margin:12px 0'><h3>② 也不要闭眼</h3><p>闭眼拍摄会显得没精神，而且拍出来像失误照。</p></div><div class='card card-orange' style='margin:12px 0'><h3>③ 眼睛往上看/两边看/往下看</h3><p>往上看翻眼白，往两边看太多露眼白，往下看容易闭眼——这些方向动作眼睛太多了，<strong>不好拍</strong>。</p></div><div class='card card-red'><h3>④ 往下看别闭眼</h3><p>很多人“往下看”其实是闭上眼睛的，这几个表情都不能做。</p></div></div>
<div class="conclusion">
<h2>眼神控制清单</h2>
<h3>正确的眼神</h3><ol><li><strong>头不动</strong>，眼睛看镜头，<strong>放松</strong></li><li>刷眼皮（双眼皮）<strong>往下、放松</strong>，不要往上，上下合一点点</li><li>眼睛可以往两边看，但<strong>不要看太多</strong>：中间一个点，一二三看三个点就够了</li></ol><h3>防止眼白</h3><ul><li>看四（第四个点）眼白就越来越多</li><li>眼睛不能往旁边看太多，也不能乱动</li></ul>
</div>
