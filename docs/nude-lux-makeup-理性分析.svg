<h1>贵气感骨相裸妆｜淡妆也能有效提升气质✨</h1>
<div class="meta">
<span class="tag tag-blue">骨相妆</span><span class="tag tag-green">淡妆</span><span class="tag tag-orange">修容</span><span class="tag tag-gray">4:41</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>骨相裸妆核心：<strong>化结构、重轮廓</strong>（不是化五官、重色彩）才能立体精致。步骤：①<strong>粉底只上内轮廓</strong>（眉峰最高点画垂直线为界），T区粉多往外递减，余粉带脸侧→面中亮面侧暗小脸；②<strong>四笔修容</strong>头包脸：额角-眉峰/眼尾-眉尾/颧骨-发际线/嘴角垂线-耳垂，晕开收窄脸型；③<strong>双C从眼头顺眼眶骨+鼻头U</strong>立体五官，<strong>中轴线提亮</strong>（额头鼻梁鼻头下巴+泪沟法令纹+颧骨向内）提高折叠度；④<strong>眉毛染浅画毛流</strong>（有形无边）；⑤<strong>收缩色腮红当眼影预染大</strong>+卧蚕提亮+平拉眼线放大眼睛；⑥<strong>腮红从颧骨斜向内扫</strong>+口红三线晕染统一色系。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">化五官重色彩=扁平土气；化结构重轮廓=立体精致</span></div><div class="timeline-item"><span class="timeline-time">00:18</span><span class="timeline-text">底妆：大屏脸 vs 小V脸，区别在粉底液距离</span></div><div class="timeline-item"><span class="timeline-time">00:22</span><span class="timeline-text">整脸铺满显脸大；只上内轮廓脸立马小一圈</span></div><div class="timeline-item"><span class="timeline-time">00:32</span><span class="timeline-text">确定内轮廓：脸侧到眉峰最高点，上下画线回正</span></div><div class="timeline-item"><span class="timeline-time">00:44</span><span class="timeline-text">粉底从内往外铺：T区粉多，越往外越少</span></div><div class="timeline-item"><span class="timeline-time">01:01</span><span class="timeline-text">余粉带过脸侧：面中亮面侧暗的小脸效果</span></div><div class="timeline-item"><span class="timeline-time">01:13</span><span class="timeline-text">头包脸四笔修容，视觉收窄脸型</span></div><div class="timeline-item"><span class="timeline-time">01:35</span><span class="timeline-text">双C线从眼头顺眼眶骨；鼻头画U抬鼻尖</span></div><div class="timeline-item"><span class="timeline-time">01:50</span><span class="timeline-text">提亮：中轴线+泪沟法令纹+颧骨向内，提高折叠度</span></div><div class="timeline-item"><span class="timeline-time">02:11</span><span class="timeline-text">定妆：眼睛定牢，保留颧骨光泽增贵气感</span></div><div class="timeline-item"><span class="timeline-time">02:27</span><span class="timeline-text">眉毛：染浅+画毛流，有形无边的眉毛</span></div><div class="timeline-item"><span class="timeline-time">02:56</span><span class="timeline-text">眼妆：收缩色腮红预染大眼影范围+卧蚕提亮</span></div><div class="timeline-item"><span class="timeline-time">03:31</span><span class="timeline-text">眼线：平拉晕开虚化，眼线液笔加深睫毛根部</span></div><div class="timeline-item"><span class="timeline-time">03:46</span><span class="timeline-text">睫毛：边夹边往上抬，刷定型保持一天</span></div><div class="timeline-item"><span class="timeline-time">04:02</span><span class="timeline-text">腮红：从颧骨最高点斜向内扫修饰脸型</span></div><div class="timeline-item"><span class="timeline-time">04:14</span><span class="timeline-text">口红：色系一致，三线晕染唇峰唇中下唇</span></div></div>
<div class='section'><div class='sec-title'>核心：化结构，不化五官</div><div class='diagram'><div class='node node-red'>化五官 重色彩<br/><small>扁平土气</small></div><span class='arrow'>→</span><div class='node node-green'>化结构 重轮廓<br/><small>立体精致</small></div></div></div><div class='section'><div class='sec-title'>底妆：内轮廓法</div><div class='card'><h3>粉底只上内轮廓</h3><p>脸侧到只能看到<strong>眉峰最高点</strong>，沿点上下画线回正——这就是内轮廓线。<strong>粉底不超这条线</strong>，从内往外铺：T区粉多、越往外越少，余粉带过脸侧——<strong>面中亮、面侧暗</strong>的小脸效果。</p></div></div><div class='section'><div class='sec-title'>修容：四笔头包脸</div><div class='card'><h3>四笔修容</h3><p>①额角-眉峰 ②眼尾-眉尾 ③颧骨最高点-发际线 ④嘴角垂直线-耳垂。四笔<strong>往外晕开</strong>，视觉收窄脸型。</p></div><div class='card card-green' style='margin:12px 0'><h3>立体五官</h3><p><strong>双C</strong>：从眼头开始顺眼眶骨画。<strong>鼻头U</strong>：抬高鼻尖缩小鼻头。双C向两头晕染，鼻头向外晕染，阴影自然衔接。</p></div><div class='card card-orange' style='margin:12px 0'><h3>提亮三处</h3><p><strong>中轴线</strong>（额头鼻梁鼻头下巴）+<strong>泪沟法令纹</strong>+<strong>颧骨向内</strong>——提高面部折叠度，干净精致。</p></div></div><div class='section'><div class='sec-title'>眉眼：淡而不塌</div><div class='card'><h3>眉毛</h3><p>螺旋刷刷顺→<strong>染眉膏染浅</strong>（浅眉显柔和）→硬芯眉笔<strong>画毛流</strong>（眉头向上、眉中斜画、眉尾倒着画）——有形无边。</p></div><div class='card card-purple' style='margin:12px 0'><h3>眼妆</h3><p>收缩色腮红当眼影<strong>预染大</strong>（不超眼眶骨、包眼头、稍往下）→瞳孔正下方<strong>哑光高光提亮卧蚕</strong>→修容混腮红<strong>加深卧蚕线</strong>→刀锋刷<strong>平拉眼线</strong>晕开虚化+眼线液笔加深睫毛根部→睫毛<strong>边夹边往上抬</strong>。</p></div></div><div class='section'><div class='sec-title'>腮红口红</div><div class='card'><h3>腮红</h3><p>同一块收缩色腮红，从<strong>颧骨最高点斜向内扫</strong>——修饰脸型、外轮廓流畅。</p></div><div class='card card-red' style='margin:12px 0'><h3>口红</h3><p>唇线不能太湿，颜色与眼影腮红<strong>一致</strong>；<strong>三线晕染</strong>：唇峰左右、唇中往外、下唇下方连接嘴角，最后加唇蜜。</p></div></div>
<div class="conclusion">
<h2>骨相裸妆步骤清单</h2>
<h3>六步流程</h3><ol><li><strong>底妆</strong>：粉底只上内轮廓，面中亮面侧暗</li><li><strong>修容</strong>：四笔头包脸+双C鼻头U+三处提亮</li><li><strong>定妆</strong>：眼睛定牢，保留颧骨光泽</li><li><strong>眉毛</strong>：染浅+毛流，有形无边</li><li><strong>眼妆</strong>：收缩色眼影预染大+卧蚕+平拉眼线</li><li><strong>腮红口红</strong>：同色系，颧骨斜扫+三线晕染</li></ol><h3>心法</h3><ul><li>淡妆不淡人的关键是<strong>结构感</strong>：明暗对比度拉满</li><li>全程只用<strong>收缩色/同色系</strong>，妆面干净又协调</li></ul>
</div>
