.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>高速遇人：让速不让道</h1>
  <div class="meta"><span class="tag tag-blue">高速</span><span class="tag tag-green">行人</span><span class="tag tag-orange">ABS</span><span class="tag tag-purple">让速不让道</span><span class="tag tag-red">记录仪</span><span class="tag tag-gray">时长 168秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/Qvr6gBYwca">原视频</a>
  <div class="summary-line">乱打方向可能甩进旁车道，风险翻倍。原则：稳方向＋全力制动降碰撞速度；撞后双闪靠边报警存证，勿吵责任。口令：让速不让道。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">制止乱打方向</span></div><div class="timeline-item"><span class="timeline-time">00:40</span><span class="timeline-text">旁车道风险</span></div><div class="timeline-item"><span class="timeline-time">01:15</span><span class="timeline-text">ABS 持续制动</span></div><div class="timeline-item"><span class="timeline-time">01:30</span><span class="timeline-text">直线降速</span></div><div class="timeline-item"><span class="timeline-time">01:50</span><span class="timeline-text">撞后双闪</span></div><div class="timeline-item"><span class="timeline-time">02:10</span><span class="timeline-text">保存记录仪</span></div><div class="timeline-item"><span class="timeline-time">02:40</span><span class="timeline-text">五字口令</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">否定<br/>乱打方向</div><span class="arrow">→</span><div class="node-green">动作<br/>全力制动直线</div><span class="arrow">→</span><div class="node-orange">撞后<br/>双闪报警存证</div><span class="arrow">→</span><div class="node-blue">口令<br/>让速不让道</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>「让速不让到」→「让速不让道」。</p><p>教学观点；法律责任由交警认定。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>风险交换</h3>
      <p>躲开人未必躲开车；横向突变更易失控。</p>
      <div class="quote">你躲开了一个危险，可能又给自己制造三个危险</div>
      <div class="relation">可见危险≠唯一危险。</div>
    </div>
    <div class="card card-orange">
      <h3>让速不让道</h3>
      <p>速度可降，车道尽量不扔；ABS 抖也不松。</p>
      <div class="quote">让速不让道</div>
      <div class="relation">把碰撞能量先降下来。</div>
    </div>
    <div class="card card-red">
      <h3>撞后顺序</h3>
      <p>双闪→安全靠边→自保→报警→存记录仪；勿吵。</p>
      <div class="quote">不是现在靠吵出来的</div>
      <div class="relation">证据与安全先于争论。</div>
    </div>
    <div class="card card-purple">
      <h3>改第一反应</h3>
      <p>把「打方向」改成「稳方向+制动」。</p>
      <div class="quote">先把第一反应改掉，别乱打方向</div>
      <div class="relation">训练的是本能替换。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>避险定义</p>
      <div class="quote">真正的避险……是谁能把风险控制在最小</div>
      <div class="relation">漂亮走位不是目标。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>情景教学，非个案法律责任结论。</li><li>未覆盖冰雪／制动失效等特例。</li></ul><div class="pitfall">看见人就猛打方向。</div><div class="pitfall">ABS 抖动松开刹车。</div><div class="pitfall">下车理论责任。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>稳方向</li><li>全力制动</li><li>撞后存证报警</li></ul><h3>行动清单</h3><ol><li>把第一反应从「打方向」改成「稳方向＋制动」</li><li>ABS 抖动时继续踩住，方向尽量直线</li><li>撞后顺序：双闪→安全靠边→自保→报警→存记录仪</li><li>记住口令：让速不让道；勿下车吵责任</li></ol><h3>关键认知转变</h3><p>以前：躲人优先；现在：先控车把总风险压最小。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 168秒</div>
</div>
    </div>
  </foreignObject>
</svg>