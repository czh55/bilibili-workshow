<h1>科学解释人眼动态模糊和180度快门的关系</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">摄影技巧</span> <span class="tag tag-blue">视频制作</span> <span class="tag tag-blue">灯光</span> <span class="tag tag-gray">3:50</span></div>
<div class="summary-line">出于艺术的考量感光度光圈我们都不可以调那为何快门也不能调呢简单的回答就是180度原则为了电影感但事实并没有那么简单咱们拍照片的时候如果画面太暗我们最直觉的反应就是简慢快门力干见影 非常奏效但一旦到了拍视频调节快门可是犯了大忌电影的快门速度只有一个那就是48分之1秒大伙都知道电影作品的帧率为24帧每秒...</div>
<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">出于艺术的考量</span></div>
<div class="timeline-item"><span class="timeline-time">[00:01]</span><span class="timeline-text">感光度光圈我们都不可以调</span></div>
<div class="timeline-item"><span class="timeline-time">[00:03]</span><span class="timeline-text">那为何快门也不能调呢</span></div>
<div class="timeline-item"><span class="timeline-time">[00:04]</span><span class="timeline-text">简单的回答就是180度原则</span></div>
<div class="timeline-item"><span class="timeline-time">[00:06]</span><span class="timeline-text">为了电影感</span></div>
<div class="timeline-item"><span class="timeline-time">[00:07]</span><span class="timeline-text">但事实并没有那么简单</span></div>
<div class="timeline-item"><span class="timeline-time">[00:09]</span><span class="timeline-text">咱们拍照片的时候</span></div>
<div class="timeline-item"><span class="timeline-time">[00:11]</span><span class="timeline-text">如果画面太暗</span></div>
<div class="timeline-item"><span class="timeline-time">[00:12]</span><span class="timeline-text">我们最直觉的反应就是简慢快门</span></div>
<div class="timeline-item"><span class="timeline-time">[00:14]</span><span class="timeline-text">力干见影 非常奏效</span></div>
<div class="timeline-item"><span class="timeline-time">[00:16]</span><span class="timeline-text">但一旦到了拍视频</span></div>
<div class="timeline-item"><span class="timeline-time">[00:18]</span><span class="timeline-text">调节快门可是犯了大忌</span></div>
<div class="timeline-item"><span class="timeline-time">[00:19]</span><span class="timeline-text">电影的快门速度只有一个</span></div>
<div class="timeline-item"><span class="timeline-time">[00:21]</span><span class="timeline-text">那就是48分之1秒</span></div>
<div class="timeline-item"><span class="timeline-time">[00:23]</span><span class="timeline-text">大伙都知道电影作品的帧率为24帧</span></div>
<div class="timeline-item"><span class="timeline-time">[00:25]</span><span class="timeline-text">每秒钟在你眼前快速播放24张图片</span></div>
<div class="timeline-item"><span class="timeline-time">[00:28]</span><span class="timeline-text">让大脑会支出连贯动感的错觉</span></div>
<div class="timeline-item"><span class="timeline-time">[00:31]</span><span class="timeline-text">很多朋友误以为人影的帧率也是24帧</span></div>
<div class="timeline-item"><span class="timeline-time">[00:34]</span><span class="timeline-text">其实这是错误的</span></div>
<div class="timeline-item"><span class="timeline-time">[00:35]</span><span class="timeline-text">人影的帧率也是动态的</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>出于艺术的考量</li>
<li>感光度光圈我们都不可以调</li>
<li>那为何快门也不能调呢</li>
<li>简单的回答就是180度原则</li>
<li>为了电影感</li>
<li>但事实并没有那么简单</li>
<li>咱们拍照片的时候</li>
<li>如果画面太暗</li>
<li>我们最直觉的反应就是简慢快门</li>
<li>力干见影 非常奏效</li>
<li>但一旦到了拍视频</li>
<li>调节快门可是犯了大忌</li>
<li>电影的快门速度只有一个</li>
<li>那就是48分之1秒</li>
<li>大伙都知道电影作品的帧率为24帧</li>
<li>每秒钟在你眼前快速播放24张图片</li>
<li>让大脑会支出连贯动感的错觉</li>
<li>很多朋友误以为人影的帧率也是24帧</li>
<li>其实这是错误的</li>
<li>人影的帧率也是动态的</li>
<li>或许说是持续的</li>
<li>在这个生物皮脑里</li>
<li>没有一个恒定帧率的机制</li>
<li>完全取决于你的注意力和生命机能</li>
<li>电竞选手可以分辨144Hz</li>
<li>和240Hz显示器高刷的区别</li>
<li>当我们生病了或者醉酒状态下</li>
<li>也能看见王家卫电影里</li>
<li>常曝光降格的拖影</li>
<li>而光线通过晶体</li>
<li>成像落在视网膜后</li>
<li>感光细胞产生的化学信号不会瞬间消失</li>
<li>大概会持续10分之1到15分之1秒</li>
<li>那么大脑会合成这段时间内</li>
<li>光所发生的所有变化成为一段快照</li>
<li>被称之为视觉战流</li>
<li>所以感知上动态模糊是一小段时间内</li>
<li>视觉发生所有变化的一个重叠</li>
<li>我们可以做一个小实验</li>
<li>找一个昏暗点的地方</li>
<li>举起你的手臂</li>
<li>快速在眼前挥舞</li>
<li>你会看到手运动时会产生拖影</li>
<li>现在拿出手机打开手电筒</li>
<li>对着眼睛开到最亮</li>
<li>同样再挥舞一遍</li>
<li>你会发现拖影长了很多</li>
<li>这是因为手电筒的光</li>
<li>造成更强的刺激</li>
<li>感光细胞需要更长时间恢复敏感度</li>
<li>所以停留在视网膜的时间更长</li>
<li>人类可以根据这条拖影轨迹</li>
<li>判断进入视线的物体</li>
<li>从哪个方向来</li>
<li>预测将要往哪个方向去</li>
<li>帮助我们在物理世界里运动</li>
<li>狩猎 躲避危险</li>
<li>这就是人眼产生动态模糊的原理</li>
<li>说回标准帧率</li>
<li>电影工业音乐时期</li>
<li>曾建议过使用16帧每秒作为标准帧率</li>
<li>但后期有了同机身的加入</li>
<li>设定一个兼容声音画面</li>
<li>并且稳定播放的标准帧率</li>
<li>成为了不得不解决的问题</li>
<li>随之才有了24帧每秒的标准</li>
<li>所以24帧每秒</li>
<li>既不是人眼感知动态的极限帧率</li>
<li>也不是能够形成动态错觉的最低帧率</li>
<li>但是如果播放的画面过于清晰</li>
<li>人眼能开始觉察到眼前播放的</li>
<li>并不是连观影像</li>
<li>而是一张张单独的图片</li>
<li>特别是大范围的运动</li>
<li>很容易打消错觉</li>
<li>哪怕是24P</li>
<li>带正确运动模糊的水平摇进画面</li>
<li>依然会给人一卡一卡的感觉</li>
<li>那么180度又是个啥意思</li>
<li>以前的快门</li>
<li>市场这样的一个圆盘</li>
<li>漏空的地方是允许美真画面曝光的时长</li>
<li>折挡的地方</li>
<li>是让摄影机更换下针胶片的时长</li>
<li>漏空的缝隙越小</li>
<li>代表曝光时长越短</li>
<li>画面越锐利</li>
<li>动态模糊越小</li>
<li>180度的漏空角度</li>
<li>形成折中自然的动态模糊</li>
<li>所以就算现代摄影机快门结构</li>
<li>已经完全改变</li>
<li>我们依旧沿用当年的快门角度原则</li>
<li>当然180度快门是人定下的规矩</li>
<li>它是可以打破的</li>
<li>比如战争动作片</li>
<li>士兵处于高度危险时</li>
<li>圣上线速爆发</li>
<li>身体技能提升</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>出于艺术的考量感光度光圈我们都不可以调那为何快门也不能调呢简单的回答就是180度原则为了电影感但事实并没有那么简单咱们拍照片的时候如果画面太暗我们最直觉的反应就是简慢快门力干见影 非常奏效但一旦到了拍视频调节快门可是犯了大忌电影的快门速度只有一个那就是48分之1秒大伙都知道电影作品的帧率为24帧每秒钟在你眼前快速播放24张图片让大脑会支出连贯动感的错觉很多朋友误以为人影的帧率也是24帧其实这是错误</p><p>转录分段: 125 | 时长: 3:50</p></div>
