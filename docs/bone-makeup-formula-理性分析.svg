      <div class="container">
<h1>方圆脸骨相化妆公式：用明暗对比制造「折叠度」</h1>
<div class="meta">
<span class="tag tag-blue">化妆</span><span class="tag tag-green">骨相</span><span class="tag tag-orange">方圆脸</span><span class="tag tag-purple">修容</span><span class="tag tag-gray">12:24</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>对五官圆钝的肉肉脸，用「<strong>明暗对比替代色彩叠加</strong>」提升面部立体度：底妆内亮外暗做折叠度 → 平行四边形阴影定骨相 → 眉骨提亮加明暗 → 颧骨斜打腮红修饰阔面。全程「画笔演示 + 实操」双轨教学，小白可复刻。</div>

<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:26</span><span class="timeline-text">找内外轮廓：眼尾-嘴角连线、眉峰垂直到发际线、嘴角垂直到下巴</span></div><div class="timeline-item"><span class="timeline-time">00:49</span><span class="timeline-text">外轮廓粉底色号比内轮廓暗 → 底妆出折叠度</span></div><div class="timeline-item"><span class="timeline-time">01:28</span><span class="timeline-text">骨相立体脸型侧面 = 平行四边形阴影（中间留白）</span></div><div class="timeline-item"><span class="timeline-time">02:28</span><span class="timeline-text">膏状/液体修容实操：平行分界线拍打、平行下颌线到颧骨、额头两侧垂直拍</span></div><div class="timeline-item"><span class="timeline-time">02:49</span><span class="timeline-text">鼻影：沿鼻本身阴影加深、山根画弧、鼻头V字形、横画一笔让鼻头翘</span></div><div class="timeline-item"><span class="timeline-time">03:56</span><span class="timeline-text">眼部 = 平行四边形阴影：山根到眼窝、眼尾到眉尾；眉骨必提亮</span></div><div class="timeline-item"><span class="timeline-time">05:15</span><span class="timeline-text">散粉局部定妆 → 深棕眼影加深上下睫毛根、卧蚕用余粉</span></div><div class="timeline-item"><span class="timeline-time">06:05</span><span class="timeline-text">液体提亮：额头/下巴/面中三角区、鼻梁竖提、鼻头横提</span></div><div class="timeline-item"><span class="timeline-time">06:26</span><span class="timeline-text">颧骨斜打腮红与眼尾阴影平行，修饰阔面感</span></div><div class="timeline-item"><span class="timeline-time">08:00</span><span class="timeline-text">定妆按压；膏状修容定妆后只是变淡不会消失（回应评论区）</span></div><div class="timeline-item"><span class="timeline-time">08:40</span><span class="timeline-text">英气眉：眉头顺山根下压、刀锋眉笔逐根画、染眉膏统一色</span></div><div class="timeline-item"><span class="timeline-time">10:04</span><span class="timeline-text">唇部画饱满：唇线笔外侧勾勒 + 细节刷向内晕染 + 裸色唇釉</span></div><div class="timeline-item"><span class="timeline-time">11:42</span><span class="timeline-text">粉状修容可叠加眉眼高光阴影；明暗对比即出高级感</span></div></div>

<div class="map"><h2>核心脉络</h2><div class="diagram">
<div class="node">内外轮廓分区</div><div class="arrow">→</div><div class="node node-orange">双色号底妆</div><div class="arrow">→</div><div class="node">平行四边形阴影</div><div class="arrow">→</div><div class="node node-purple">眉骨提亮+鼻影+眼影</div><div class="arrow">→</div><div class="node node-green">提亮+斜打腮红</div><div class="arrow">→</div><div class="node node-green">立体折叠度</div>
</div></div>

<div class="section">
<h2 class="sec-title">核心观点卡片</h2>
<div class="card"><h3>内外轮廓是骨相化妆的地基</h3><p><strong>在讲什么：</strong>用「眼尾-嘴角连线」「眉峰垂直到发际线」「嘴角垂直到下巴」把脸分成内轮廓和外轮廓。</p><p><strong>关键理解：</strong>这条分界线是后面所有修容的坐标原点，也是「平行四边形阴影」的基准。</p><div class="quote">「这条线以里就是脸的内轮廓，以外就是脸的外轮廓」</div></div>
<div class="card"><h3>双色号底妆 = 第一层折叠度</h3><p><strong>在讲什么：</strong>外轮廓粉底液色号比内轮廓暗一档，粉扑垂直拍开，先内后外。</p><p><strong>关键理解：</strong>不用修容膏，光靠底妆明暗就能让脸部出现自然转折阴影，这是最省力的立体化手段。</p><div class="quote">「就能够在底妆部分让脸部就有一个自然的折叠度，清晰轮廓感」</div></div>
<div class="card card-purple"><h3>「平行四边形阴影」是骨相立体的统一规律</h3><p><strong>在讲什么：</strong>骨相立体的脸型，侧面都是一个平行四边形阴影，眼部同样是平行四边形。</p><p><strong>关键理解：</strong>把脸侧阴影平行于分界线画到发际线、平行于下颌线到颧骨，连接后中间留白，就是一个标准定位。</p><div class="quote">「很多骨相立体的脸型，侧面都是一个平行四边形的阴影」</div></div>
<div class="card"><h3>眉骨提亮是不可省的明暗开关</h3><p><strong>在讲什么：</strong>眼窝/眼尾画完阴影后，眉骨处一定要提亮，小粉扑原地拍开。</p><p><strong>关键理解：</strong>「凹陷画阴 + 凸起提亮」的明暗对比，直接决定眉眼立体度，也是收尾粉状修容时反复强调的保留项。</p><div class="quote">「眉骨处这个位置一定要提亮，突出明暗对比，眉眼轮廓更立体」</div></div>
<div class="card"><h3>膏状修容定妆后「变淡不消失」</h3><p><strong>在讲什么：</strong>回应评论区疑问：膏状修容/腮红定妆后会稍微变淡，但不会被完全盖掉。</p><p><strong>关键理解：</strong>所以膏状产品可以稍微下重手，定妆按压后颜色回落，无需担心「白化」。这是实践验证的经验（博主视频演示）。</p><div class="quote">「定妆的时候它稍微都会盖掉一点颜色，但不是说完全盖掉」</div></div>
<div class="card"><h3>明暗对比 > 色彩叠加</h3><p><strong>在讲什么：</strong>整套妆容几乎不靠色彩，靠轮廓明暗就能化出高级感妆容。</p><p><strong>关键理解：</strong>对追求「立体上镜」而不是「彩妆感」的用户，这套公式的投入产出比最高。</p><div class="quote">「即使没什么颜色的叠加，只是通过轮廓的明暗对比，也可以化出一个高级气质的妆容」</div></div>
</div>

<div class="section">
<h2 class="sec-title">实操避坑与要点</h2>
<div class="card card-orange"><h3>关键避坑</h3>
<div class="pitfall">眼影「上来就直接扫」会把粉扫到未定妆的脸颊——必须<strong>先按上去再向上晕染</strong>，且先散粉局部定妆。</div>
<div class="pitfall">修容蘸取易下重手——先把膏/液涂手上再一点点蘸，上脸用<strong>点戳</strong>避免带掉粉底。</div>
<div class="pitfall">唇线「往外扣」之后必须向内晕染，否则化成大嘴巴。</div>
<div class="pitfall">提亮颜色不随肤色选：黄皮用暖调、白皮用冷调，用错会假面。</div>
<div class="pitfall">眉毛颜色与眉笔不统一时要用染眉膏，一次性眉刷蘸取往上梳，避免糊成一团。</div>
</div>
<div class="card card-green"><h3>方法边界（本视频未覆盖）</h3>
<ul>
<li>适用人群：五官圆钝的肉肉脸/方圆脸；极瘦窄脸或骨相已立体者收益递减。</li>
<li>「平行四边形」「明暗对比」等是博主个人方法论，属<strong>视频作者观点</strong>，非行业统一标准。</li>
<li>定妆不盖掉膏状修容为<strong>博主实操演示结论</strong>，具体效果受产品配方与定妆方式影响。</li>
<li>假睫毛「会贴就贴、不贴直接刷」：对贴睫新手视频未展开教学，为简化策略。</li>
</ul>
</div>
</div>

<div class="section">
<h2 class="sec-title">横向对比：膏状 vs 粉状修容</h2>
<div class="card"><table>
<tr><th>维度</th><th>膏状/液体修容</th><th>粉状修容</th></tr>
<tr><td>质地</td><td>更融肤自然，无粉感</td><td>可叠加、显色直接</td></tr>
<tr><td>使用时机</td><td>定妆前（粉底后）</td><td>定妆后叠加细节</td></tr>
<tr><td>定妆影响</td><td>变淡但保留（视频实测）</td><td>受定妆影响小</td></tr>
<tr><td>视频用法</td><td>全脸骨相轮廓主打</td><td>眉眼高光阴影收尾叠加</td></tr>
</table></div>
</div>

<div class="conclusion">
<h2>总结与行动</h2>
<h3>核心要点</h3>
<p>方圆脸立体化 = 内外轮廓分区 + 双色号底妆 + 平行四边形阴影 + 眉骨提亮 + 颧骨斜腮红。全程「画笔演示→实操」的跟练结构，小白可逐步复刻。</p>
<h3>行动清单</h3>
<p>1. 先画内外轮廓分界线，确认自己的坐标原点。<br/>2. 底妆用双色号（内亮外暗），粉扑垂直拍开。<br/>3. 画平行四边形阴影（脸侧 + 下颌到颧骨），中间留白。<br/>4. 山根-眼窝-眼尾画眼影阴影，眉骨必提亮。<br/>5. 鼻梁竖提、鼻头横提，颧骨斜打腮红。<br/>6. 收尾：英气眉眉头下压 + 染眉膏统一，唇部画饱满，粉状修容叠加眉眼。</p>
<h3>关键认知转变</h3>
<p>以前以为「立体度靠色彩/眼影堆叠」，实际是「明暗对比」：凹陷画阴、凸起提亮、骨相位置先定位，色彩只是点缀。</p>
</div>
</div>
    </div>
  </foreignObject>
