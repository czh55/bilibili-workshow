<div class="timeline-item"><span class="timeline-time">[00:38]</span><span class="timeline-text">它是76瓦秒</span></div>
<div class="timeline-item"><span class="timeline-time">[00:40]</span><span class="timeline-text">相對於76瓦的長亮燈它的亮度之筆差多少呢</span></div>
