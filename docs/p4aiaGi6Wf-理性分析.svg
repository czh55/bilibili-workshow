<div class="card"><h3>内容要点</h3><ul><li>同瓦數的閃光燈和閃亮燈的亮度之筆</li>
<li>這是一個很有意思的問題</li>
<li>如果你去網上查或者問一些老師</li>
<li>你得到的答案可能會是</li>
<li>這是兩個不同的概念</li>
<li>他們無法放在一起去比較</li>
<li>但現實中我們又經常面對選擇閃光燈還是常亮燈</li>
<li>而且標注的參數都是瓦</li>
<li>甚至還有不少攝影師認為同瓦數的閃光燈和閃亮燈是相同的</li>
<li>這顯然不符合我們的日常經驗</li>
<li>所以對他們的亮度之筆我們確實存在很強的好奇心</li>
<li>這些視頻我把這兩組燈的亮度之筆來說個明白</li>
<li>比如一個我們經常使用的60指數的機靈閃</li>
<li>它是76瓦秒</li>
<li>相對於76瓦的長亮燈它的亮度之筆差多少呢</li>
<li>兩者相同的是在1秒內都釋放了76.2的能量</li>
<li>但重要的區別就是這個能量是在多長的時間之內釋放出來的</li>
<li>長亮燈實實在在就是在1秒內平均釋放</li>
<li>但閃光燈就不同了在實際上閃光燈單持的能量釋放</li>
<li>並不是在1秒內完成的而是遠遠小於1秒</li>
<li>常規旗艦級的機靈閃在全光輸出下</li>
<li>它的閃爍時長差不多是300分之1秒左右</li>
<li>也就是說其實它在300分之1秒以內就已經輸出了76.2的能量</li>
<li>而長亮燈是在1秒內均勻的輸出了76.2的能量</li>
<li>說到這兒你可能就明白了</li>
<li>在這300分之1秒時間之內閃光燈的亮度是長亮燈的300倍</li>
<li>也就是說這時候閃光燈的功率相當於76瓦乘上300</li>
<li>大概是2萬多瓦</li>
<li>也就是說如果閃光燈保持在全光輸出的亮度持續下去</li>
<li>相當於2萬多瓦的長亮燈的亮度</li>
<li>這這個理論的值實際在各種原因下有些偏差</li>
<li>但不妨礙我們去理解這裡的底層邏輯</li>
<li>之前我的視頻有提到過</li>
<li>我們平常用的基金閃如果換成長亮燈</li>
<li>大概相當於1萬瓦以上</li>
<li>很多人還不太相信</li>
<li>閃光燈閃爍時間是個波星圖</li>
<li>這裡面又涉及到兩個很重要的參數</li>
<li>T0.1和T0.5</li>
<li>假說我們極端一下</li>
<li>支取T0.5這段波風這個數值會更誇張</li>
<li>最後我想再說一句就攝影來說閃光燈有學習的門檻</li>
<li>但它確實比長亮燈更好用</li>
<li>長亮燈可以幫助你建立光感和用光思路</li>
<li>但閃光燈才是人像攝影師必須掌握的一個工具</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>同瓦數的閃光燈和閃亮燈的亮度之筆這是一個很有意思的問題如果你去網上查或者問一些老師你得到的答案可能會是這是兩個不同的概念他們無法放在一起去比較但現實中我們又經常面對選擇閃光燈還是常亮燈而且標注的參數都是瓦甚至還有不少攝影師認為同瓦數的閃光燈和閃亮燈是相同的這顯然不符合我們的日常經驗所以對他們的亮度之筆我們確實存在很強的好奇心這些視頻我把這兩組燈的亮度之筆來說個明白比如一個我們經常使用的60指數的機</p><p>转录分段: 45 | 时长: 2:29</p></div>
