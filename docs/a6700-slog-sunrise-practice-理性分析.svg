.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      
<div class="container root-wrap">
  <h1>a6700 日出日落拍 S-Log：参数、ETTR 与连续性</h1>
  <div class="meta">
    <span class="tag tag-orange">个人专栏</span>
    <span class="tag tag-blue">S-Log3</span>
    <span class="tag tag-green">a6700</span>
    <span class="tag tag-purple">向右曝光</span>
    <span class="tag tag-red">日出日落</span>
    <span class="tag tag-gray">讨论整理</span>
    <span class="tag tag-gray">理性分析</span>
  </div>
  <div class="summary-line">Log 提高的是「已拍到的光比能否活进文件」，不是传感器多长几档；a6700 日出日落应锁 ISO 800/2500、手动 WB，用 ND 保高光骑曝光，并接受镜头间小跳跃、靠后期对齐连续性。</div>

  <div class="timeline">
    <h3>讨论证据轴（提问顺序）</h3>
    <div class="timeline-item"><span class="timeline-time">Q1</span><span class="timeline-text">FCP：认色彩空间 → 技术 LUT → 创意调色</span></div>
    <div class="timeline-item"><span class="timeline-time">Q3</span><span class="timeline-text">纠偏：ISO 要锁 Base，不是「Log 不管 ISO」</span></div>
    <div class="timeline-item"><span class="timeline-time">Q4–5</span><span class="timeline-text">ETTR 与暗部宽容度：编码 vs SNR，欠曝仍噪</span></div>
    <div class="timeline-item"><span class="timeline-time">Q6–7</span><span class="timeline-text">DR=保留率；中灰台阶变稀 → 要 10bit</span></div>
    <div class="timeline-item"><span class="timeline-time">Q8</span><span class="timeline-text">落地 a6700+18-135 参数卡与 ND</span></div>
    <div class="timeline-item"><span class="timeline-time">Q9–11</span><span class="timeline-text">WB 烤进画面；光剧变骑曝光；跳跃可对齐</span></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">心智<br/>保留率 ≠ 物理 DR</div>
      <span class="arrow">→</span>
      <div class="node-green">曝光<br/>Base ISO + ETTR 保高光</div>
      <span class="arrow">→</span>
      <div class="node-orange">现场<br/>ND 骑乘 + 时间窗</div>
      <span class="arrow">→</span>
      <div class="node-blue">成片<br/>转 709 再对齐跳跃</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解与认知纠偏</h3>
    <p>误区：Log 下 ISO/EV 都不用管。→ EV 可不管；ISO 锁原生 800/2500。</p>
    <p>误区：暗部宽容度强 = 可以欠曝。→ 欠曝仍贴噪底；ETTR 才是用高光余量换干净暗部。</p>
    <p>误区：Log 让传感器动态范围变大。→ 变的是写入文件的保留率与中灰标定。</p>
    <p>误区：全程参数不动才没有跳跃。→ 日出应追光；小跳跃预期内，后期对齐。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">概念层：Log 到底买到了什么</h2>
    <div class="card card-green">
      <h3>保留率，不是扩容</h3>
      <p>传感器物理档数在给定 ISO/读出下基本固定。标准伽马为「好看」提前膝点、压暗部；Log 少做成品化处理，并把码值更均匀摊到各档光。</p>
      <div class="insight">一句话：Log 提高的是「已捕捉光有多少活着进文件」，不是感光元件多长几档。</div>
      <div class="relation">与中灰：S-Log3 中灰约 41% IRE，头顶高光空间更大，这是标定差异。</div>
    </div>
    <div class="card card-purple">
      <h3>中灰「变稀」≠ 光学变差</h3>
      <p>宽光比占用同一 bit 预算，中间调平均台阶更少。10bit 实务通常够用；8bit 猛拉易色带。光学清晰度/SNR 仍看曝光与 ISO。</p>
      <div class="pitfall">用 8bit 拍 Log 再大力拉伸天空渐变，是主动制造色带。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">操作层：a6700 日出日落</h2>
    <div class="card">
      <h3>固定三件套 + 可变一件</h3>
      <table>
        <tr><th>固定</th><th>可变（骑乘）</th></tr>
        <tr><td>S-Log3 / S-Gamut3.Cine；快门跟帧率；ISO 800 或 2500</td><td>ND（首选）、光圈、必要时跳第二原生 ISO</td></tr>
        <tr><td>手动 WB，按时间窗锁定</td><td>构图、渐变 ND、补光决定「保天空还是保脸」</td></tr>
      </table>
      <div class="highlight">18-135 光圈有限：蓝调升 2500 或脚架，优于把快门改成 1/25。</div>
      <div class="action">变亮：加 ND / 收光圈，斑马 90%+ 不大面积死白。变暗：开光圈 → 减 ND → ISO 2500。</div>
    </div>
    <div class="card card-orange">
      <h3>连续性：接受跳，再对齐</h3>
      <p>窗内求稳，跨窗才大改；大改发生在两条镜头之间。后期：技术 LUT → 曝光对齐 → 色温统一 → 风格。</p>
      <div class="pitfall">一条长镜头中间猛拧 ND，观感像「画面自己在呼吸」——除非有意做 pull。</div>
      <div class="quote">现场追光的小跳跃是预期内的；靠后期对齐消除，而不是追求全程参数完全不动。</div>
    </div>
    <div class="card card-red">
      <h3>风险边界</h3>
      <ul>
        <li>太阳全圆 + 地面全细节常超单次曝光极限 → 改目标、GND 或补光</li>
        <li>View Assist / LUT 监看只辅助构图，曝光看斑马/波形</li>
        <li>已炸高光、已沉噪底：调色补不回来</li>
      </ul>
    </div>
  </div>

  <div class="card">
    <h3>对照表：错误默认 vs 推荐默认</h3>
    <table>
      <tr><th>主题</th><th>错误默认</th><th>推荐默认</th></tr>
      <tr><td>ISO</td><td>随便拧 / 完全不管</td><td>800；必要时 2500</td></tr>
      <tr><td>曝光</td><td>屏幕「好看」或故意欠曝</td><td>ETTR 但保高光</td></tr>
      <tr><td>WB</td><td>Auto</td><td>手动，时间窗锁定</td></tr>
      <tr><td>控光</td><td>降 ISO 或乱加快门</td><td>ND + 光圈</td></tr>
      <tr><td>连续性</td><td>参数死锁一整场</td><td>骑乘 + 分段 + 后期对齐</td></tr>
    </table>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>Log = 保留率与后期空间，不是免曝光税</li>
      <li>a6700：S-Log3、ISO 800/2500、10bit、手动 WB</li>
      <li>日出：保高光骑 ND；18-135 靠 ND/第二原生 ISO</li>
      <li>跳跃可修，死白与死黑不可修</li>
    </ul>
    <h3>行动清单</h3>
    <ol>
      <li>机内记忆组写入：Log 开、S-Log3/S-Gamut3.Cine、1/50、ISO 800、WB 5600K</li>
      <li>出门带 ND（最好含软渐变）；开斑马 90%+</li>
      <li>按「未出 / 金色 / 变亮」拆时间窗，窗内少大改</li>
      <li>FCP：Wide Gamut 库 → 技术 LUT → 对齐相邻镜头波形</li>
    </ol>
    <h3>关键认知转变</h3>
    <p>以前：以为 Log 自动扛住动态范围，参数设一次就行。现在：Log 只负责把拍到的光比带进后期；现场仍要锁原生 ISO、保高光追光，并用分段与调色管理连续性。</p>
  </div>
  <div class="footer">个人专栏 · 对话整理 · video-notes</div>
</div>

    </div>
  </foreignObject>
</svg>