<div class="svg-page">
  <div class="container">
    <h1>方圆脸化妆开智，妆容框架‼️总结篇</h1>
    <div class="meta">
      <span class="tag tag-blue">小红书</span>
      <span class="tag tag-green">3分31秒</span>
      <span class="tag tag-purple">方圆脸</span>
      <span class="tag tag-orange">妆容框架</span>
      <span class="tag tag-gray">理性分析</span>
    </div>
    <a class="source-link" href="http://xhslink.cn/o/4kKItBTRO4u">原视频：方圆脸化妆开智，妆容框架‼️总结篇</a>
    <div class="summary-line">
      <strong>核心判断：</strong>视频真正回答的不是「哪盘眼影最好看」，而是一套方圆脸可复用的结构框架：后置看清脸型 → 眉/收缩色腮红/模糊唇边先修外轮廓 → 眼妆以眼眶骨与卧蚕做三维感。后半段给出可操作尺寸与工具选择；证据以口播规则、字幕与实操演示为主，属个人改妆方法论，不构成医学或万能脸型结论。
    </div>

    <div class="timeline">
      <h3>关键证据时间轴</h3>
      <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">前置→后置对照：看清脸型是「开智」前提</div></div>
      <div class="timeline-item"><div class="timeline-time">00:09</div><div class="timeline-text">眉毛画在外轮廓中间，并带微微挑度</div></div>
      <div class="timeline-item"><div class="timeline-time">00:17</div><div class="timeline-text">腮红用收缩色修外侧圆轮廓（示例浮汀#06）</div></div>
      <div class="timeline-item"><div class="timeline-time">00:27</div><div class="timeline-text">唇妆优先模糊边界，硬边会拉宽下庭视觉</div></div>
      <div class="timeline-item"><div class="timeline-time">00:42</div><div class="timeline-text">眼妆关键=眼眶骨骨相，二维变三维</div></div>
      <div class="timeline-item"><div class="timeline-time">01:09</div><div class="timeline-text">眼眶骨范围：眉毛到眼角；形状似小鱼钩</div></div>
      <div class="timeline-item"><div class="timeline-time">01:48</div><div class="timeline-text">卧蚕画成「眼影面」；先下至再定区域</div></div>
      <div class="timeline-item"><div class="timeline-time">02:20</div><div class="timeline-text">卧蚕高度≈睁眼 1/2；修容晕染+中间提亮/腮红柔化</div></div>
    </div>

    <div class="map">
      <h2>核心脉络</h2>
      <div class="diagram">
        <div class="node">问题<br/>方圆脸怎么改妆</div>
        <div class="arrow">→</div>
        <div class="node">证据<br/>后置看脸+分区规则</div>
        <div class="arrow">→</div>
        <div class="node node-green">判断<br/>先结构后颜色</div>
        <div class="arrow">→</div>
        <div class="node node-orange">行动<br/>眶骨+卧蚕优先</div>
      </div>
      <p class="small">关系：外轮廓修形（眉/腮红/唇边）解决「显宽」；眼部结构（眶骨/卧蚕）解决「显平」。颜色是后置变量。</p>
    </div>

    <div class="correction">
      <h3>常见误解与认知纠偏</h3>
      <p>误解一：方圆脸靠更深的眼影和更长的眼线就能「开智」。纠偏：总结篇把重点放在眼眶骨骨相与卧蚕面状塑造。</p>
      <p>误解二：腮红打在苹果肌中间最显气色。纠偏：UP 主张收缩色修外侧圆轮廓，中间打法可能强化圆感。</p>
      <p>误解三：卧蚕画出来像黑眼圈就失败了。纠偏：演示里这是中间态，可用中间提亮与少量腮红柔化。</p>
    </div>

    <div class="section">
      <h2 class="sec-title">一、诊断前提：后置视角</h2>
      <div class="card card-green">
        <h3>在讲什么</h3>
        <p>「化妆开智」被绑定在后置视角——只有看清真实外轮廓，才会发现眉短、位置偏内等问题。</p>
        <div class="highlight">关键理解：前置美颜视角会掩盖结构问题；后置是校准工具，不是审美偏好。</div>
        <div class="action">怎么用：化妆前用后置或镜子平视，先标记眉尾相对外轮廓的中点，再动笔。</div>
        <div class="quote">原文依据（校正后大意）：「方圆脸能够化妆开智，是在你能够面对后置的时候……真正看清你的脸。」[00:00–00:06]</div>
        <div class="relation">立场：UP 主观点 + 演示对照；非对照实验。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">二、外轮廓三件套：眉 · 腮红 · 唇边</h2>
      <div class="card">
        <h3>眉毛：位置与挑度优先于「画浓」</h3>
        <p>规则：眉不够长时，画在外轮廓中间，并带微微挑度以修饰脸型。</p>
        <div class="highlight">关键理解：对方向圆脸，眉尾落点影响脸宽感知，比单纯加深眉色更关键。</div>
        <div class="action">怎么用：后置确认外轮廓中线 → 延长眉尾至此 → 加轻微上挑，避免水平一字眉拉宽。</div>
        <div class="quote">字幕依据：「它需要画在我的外轮廓的中间」[00:09]</div>
      </div>
      <div class="card card-purple">
        <h3>腮红：收缩色修外侧圆轮廓</h3>
        <p><span class="speaker speaker-host">UP 主立场</span>中间打法被否定；应选收缩色去修外边圆轮廓。示例色号浮汀#06 出现在画面叠字。</p>
        <div class="highlight">关键理解：腮红在此被当作「修形工具」而非纯气色道具。</div>
        <div class="action">怎么用：选偏灰调/收缩感腮红，落在外侧圆润区并向太阳穴方向收；避开正中苹果肌堆色。</div>
        <div class="quote">字幕依据：「而应该选择一个收缩色的腮红」[00:17]</div>
        <div class="relation">边界：色号为示例，不同品牌同号不保证等价；肤色与底妆会影响「收缩」观感。</div>
      </div>
      <div class="card card-orange">
        <h3>唇妆：模糊边界 &gt; 色号本身</h3>
        <p>颜色重要，但生硬唇线会把视觉重心拖到下半脸，使脸更宽。</p>
        <div class="pitfall">避坑：清晰描满唇线边缘，对方圆脸下庭不友好。</div>
        <div class="action">怎么用：上色后用手指或纸巾轻轻拍糊边缘；深色唇更要控制硬边。</div>
        <div class="quote">字幕/口播：「只会让别人的视觉重心……脸更宽」[00:29–00:33]</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">三、眼部结构：眼眶骨与卧蚕</h2>
      <div class="card">
        <h3>眼眶骨：从眉毛到眼角的小鱼钩</h3>
        <p>位置：眉毛到眼角范围；膏状修容先勾范围，刷子晕开后定妆；粉状可作补充。形状像小鱼钩（眉尾最长处→眼角）。提亮放在眼皮中间、眉骨下方，制造骨相与「往后折叠」感。</p>
        <div class="highlight">关键理解：眼妆的「三维」来自凹凸结构，而不是眼影饱和度。</div>
        <div class="action">怎么用：1）定眉尾；2）眶骨勾小鱼钩；3）晕开定妆；4）中间提亮。</div>
        <div class="quote">字幕依据：「去塑造眼眶骨的骨相感」[00:42]；口播「眉毛到我的眼角」「小鱼钩」[01:09–01:29]</div>
      </div>
      <div class="card card-green">
        <h3>卧蚕：面状、先下至、高度 1/2</h3>
        <p>不自然的主因常是刷子过细导致「线」而非「面」。流程：粗一点的扁头刷 → 先蹭下至（里深外浅三角弧）→ 用修容（非眼影）画卧蚕 → 高度约睁眼 1/2 → 刷子垂直于脸，最深在黑眼圈下方再向两侧晕。</p>
        <div class="action">怎么用：按「下至定区 → 修容铺面 → 中间提亮/腮红柔化」三段执行。</div>
        <div class="quote">字幕依据：「立体不生硬」「睁开的1/2大」[01:48–02:22]</div>
        <div class="pitfall">中间态可能像黑眼圈；勿只靠哑光提亮硬提，应用膏状浅色点在中央并避开下眼睑根部。</div>
      </div>
    </div>

    <div class="card">
      <h3>横向对比：常见做法 vs 本集框架</h3>
      <table>
        <thead>
          <tr>
            <th>模块</th>
            <th>常见默认</th>
            <th>本集主张</th>
            <th>选择条件</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>看脸工具</td>
            <td>前置自拍</td>
            <td>后置/平视校准</td>
            <td>需要判断真实外轮廓时</td>
          </tr>
          <tr>
            <td>腮红</td>
            <td>苹果肌中间提气色</td>
            <td>收缩色修外侧圆轮廓</td>
            <td>方圆脸显宽、想先修形时</td>
          </tr>
          <tr>
            <td>唇边</td>
            <td>清晰唇线显精致</td>
            <td>模糊边界，避免下庭抢戏</td>
            <td>下庭偏宽或深色唇时更关键</td>
          </tr>
          <tr>
            <td>眼妆重心</td>
            <td>眼线长度/眼影深度</td>
            <td>眼眶骨骨相 + 卧蚕面</td>
            <td>眼睛显平、想放大时优先</td>
          </tr>
          <tr>
            <td>卧蚕产品</td>
            <td>眼影直接勾</td>
            <td>修容铺面，必要时腮红柔化</td>
            <td>易脏或新手晕染不稳时</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="section">
      <h2 class="sec-title">四、方法边界与立场分层</h2>
      <div class="card card-red">
        <h3>适用边界</h3>
        <ul>
          <li>主要针对方圆脸「显宽/显平」的化妆修形，不覆盖手术或医美路径。</li>
          <li>「收缩色」「1/2 卧蚕」是口播经验规则，受脸宽、眼型、妆容浓度影响。</li>
          <li>系列专期（眉/腮红/唇/眼影）被指向但未在本集展开，完整效果依赖系列观看。</li>
          <li>反例：长脸或上庭过重者照搬外侧腮红，可能进一步拉长视觉。</li>
        </ul>
        <div class="stance-grid">
          <div class="stance-item"><strong>可验证事实</strong>画面演示了后置对照、眶骨刷法、卧蚕 1/2 口诀与叠字色号。</div>
          <div class="stance-item"><strong>UP 主观点</strong>收缩色腮红、模糊唇边、眼妆以骨相为先。</div>
          <div class="stance-item"><strong>推断</strong>对多数方圆脸新手，先结构后颜色的学习顺序效率更高（基于口播逻辑，非统计验证）。</div>
        </div>
      </div>
    </div>

    <div class="conclusion">
      <h2>总结与行动</h2>
      <h3>核心要点</h3>
      <ul>
        <li>后置看清脸型，是方圆脸改妆框架的入口。</li>
        <li>外轮廓：眉落点+挑度、收缩色腮红、模糊唇边。</li>
        <li>眼部：眼眶骨小鱼钩 + 卧蚕面状（高度约 1/2）。</li>
      </ul>
      <h3>行动清单</h3>
      <ol>
        <li>化妆前用后置拍一张，标出外轮廓中点与眉尾。</li>
        <li>腮红改外侧收缩色试妆，对比中间打法的圆感差异。</li>
        <li>唇部上色后主动拍糊边缘，检查下庭是否抢戏。</li>
        <li>按「眉尾→眼角」画小鱼钩眶骨，中间提亮看折叠感。</li>
        <li>卧蚕：扁头刷+先下至+修容铺面+中央提亮/薄腮红。</li>
      </ol>
      <h3>关键认知转变</h3>
      <p>从「堆颜色」转向「先校准结构」：方圆脸的开智不在眼影盘，而在看清轮廓后的分区修形与眼部骨相。</p>
    </div>

    <p class="footer">双轨产物之二 · 理性分析 · 依据 Whisper 分段与可见字幕校正叙述，不新增视频未表达的事实</p>
  </div>
</div>

    </div>
  </foreignObject>
</svg>