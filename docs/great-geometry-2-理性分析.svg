      <div class="container root-wrap">
  <h1>脚的几何体：圆柱＋两轴</h1>
  <div class="meta"><span class="tag tag-blue">脚</span><span class="tag tag-green">圆柱</span><span class="tag tag-orange">梯形</span><span class="tag tag-purple">轴</span><span class="tag tag-red">透视</span><span class="tag tag-gray">时长 99秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/9bwFcYuimYs">原视频</a>
  <div class="summary-line">脚＝小腿圆柱＋脚掌梯形＋脚趾扁方块；随视角透视变形。踝与趾根当两轴，体块转动即动态。双脚加压仍轻松——几何体让姿态可推导。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">脚难下笔</span></div><div class="timeline-item"><span class="timeline-time">00:09</span><span class="timeline-text">侧面：圆柱＋梯形＋方块</span></div><div class="timeline-item"><span class="timeline-time">00:18</span><span class="timeline-text">正面透视变形</span></div><div class="timeline-item"><span class="timeline-time">00:27</span><span class="timeline-text">3/4立体感最强</span></div><div class="timeline-item"><span class="timeline-time">00:39</span><span class="timeline-text">踝／趾根两轴</span></div><div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">双脚加压</span></div><div class="timeline-item"><span class="timeline-time">01:23</span><span class="timeline-text">难度MAX</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">拆<br/>三体块</div><span class="arrow">→</span><div class="node-green">变<br/>透视</div><span class="arrow">→</span><div class="node-orange">转<br/>两轴</div><span class="arrow">→</span><div class="node-blue">练<br/>加压</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「下痞／轴程／废炊灰／集合体／快手见」→「下笔／轴／费吹灰／几何体／课程见」。</p><p>误区：脚当平面剪影临摹。视频要求体块＋轴。</p><p>误区：只背侧面一种。需换角验证透视。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>三件套体块</h3>
      <p>小腿圆柱、脚掌梯形、脚趾扁方块——复杂脚先变成零件。</p>
      <div class="quote">小腿像个圆柱，脚掌是梯形的体块，脚趾是扁一点的方块</div>
      <div class="relation">命名体块才能检查透视。</div>
    </div>
    <div class="card card-orange">
      <h3>关节＝轴</h3>
      <p>脚踝与脚趾根看成两个轴，体块绕轴运动就能拿捏动态。</p>
      <div class="quote">把脚踝、脚趾根这两个点看成两个轴</div>
      <div class="relation">动态是转动，不是换一张剪影。</div>
    </div>
    <div class="card card-red">
      <h3>先体块后细化</h3>
      <p>有体块理解再细化，感觉完全不一样；加压双脚也成立。</p>
      <div class="quote">有了体块的理解，再细化起来是不是感觉完全不一样</div>
      <div class="relation">顺序决定返工量。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>系列口号</p>
      <div class="quote">伟大的几何体——把难画部位变成可推导零件。</div>
      <div class="relation">这就是伟大的几何体</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>99 秒脚部专题，非全身解剖。</li><li>体块为教学简化。</li><li>片尾课程推销非技法结论。</li></ul><div class="pitfall">脚趾逐根描轮廓无方块。</div><div class="pitfall">忽略踝轴导致「假弯」。</div><div class="pitfall">只练侧面，正面透视崩。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>脚拆三体块</li><li>踝趾两轴</li><li>换角验证透视</li></ul><h3>行动清单</h3><ol><li>侧面脚只画圆柱梯形方块</li><li>标两轴并旋转体块</li><li>改画正面检查变形</li><li>再上双脚加压</li></ol><h3>关键认知转变</h3><p>以前：脚靠死记姿势；现在：零件＋轴——难姿态也可推导。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 99秒</div>
</div>
    </div>
  </foreignObject>
</svg>