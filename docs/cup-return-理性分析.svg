<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1916" viewBox="0 0 1320 1916">
  <foreignObject x="0" y="0" width="1320" height="1916">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&amp;display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans SC',-apple-system,sans-serif}.container{width:1240px;padding:40px 40px 60px}h1{font-size:30px;font-weight:700;color:#1a1a1a;margin-bottom:8px}.meta{font-size:13px;color:#999;margin-bottom:8px}.tags{margin-bottom:20px}.tag{display:inline-block;background:#fdf2f2;color:#c0392b;padding:3px 10px;border-radius:12px;font-size:12px;margin-right:8px}.summary-line{background:#fff5f5;border-left:4px solid #e74c3c;padding:12px 16px;margin-bottom:28px;font-size:15px;color:#555;line-height:1.7}h2{font-size:20px;font-weight:600;color:#c0392b;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid #e74c3c;display:inline-block}.comparison{display:flex;gap:20px;margin:16px 0}.comp-card{flex:1;padding:18px;border-radius:12px;font-size:14px;line-height:1.8}.bad{background:#fff5f5}.bad h4{color:#c0392b}.good{background:#e8f5e9}.good h4{color:#2e7d32}.comp-card h4{font-size:16px;font-weight:600;margin-bottom:8px}.comp-card p{color:#555}.principle{background:#faf8f5;padding:20px 24px;border-radius:12px;margin:16px 0;font-size:14px;color:#555;line-height:1.9}.principle strong{color:#c0392b}.conclusion{background:linear-gradient(135deg,#fdf2f2,#fff5f5);padding:20px 24px;border-radius:8px;margin-top:28px;font-size:14px;color:#555;line-height:1.8}.conclusion strong{color:#c0392b}.distribute{display:flex;gap:16px;margin:16px 0}.dist-box{flex:1;text-align:center;padding:14px;border-radius:10px;font-size:13px}.dist-bad{background:#fff5f5}.dist-good{background:#e8f5e9}.dist-box h5{font-size:14px;font-weight:600;margin-bottom:8px}.dist-box .label{font-size:12px;color:#888;margin-top:6px}</style>
      <div class="container"><h1>回杯技巧：用身体而不是手</h1><div class="meta"><span>来源：小红书</span><span>时长：1分17秒</span><span>类型：技法优化</span></div><div class="tags"><span class="tag">回杯</span><span class="tag">身体倾斜</span><span class="tag">手腕解放</span><span class="tag">动作分离</span></div><div class="summary-line"><strong>一句话总结：</strong>回杯（杯子从90°回正到水平）不需要用手腕——<strong>用身体自然倾斜代替手腕转动</strong>，手完全不动，只专注摆动和流量控制。核心思想是<strong>动作分离</strong>：身体管回杯，手只管画图。</div>
<h2>两种回杯方式对比</h2>
<div class="comparison"><div class="comp-card bad"><h4>❌ 用手腕回杯</h4><p>手腕需要同时：<br/>①转动杯子回杯<br/>②横向摆动<br/>③控制流量<br/>→ 三个动作叠加，互相干扰<br/>→ 手部负担过重，精度下降</p></div><div class="comp-card good"><h4>✅ 用身体回杯</h4><p>手只负责：<br/>①横向摆动<br/>②控制流量<br/>回杯交给身体倾斜<br/>→ 手部动作减少1/3<br/>→ 注意力集中，精度提升</p></div></div>
<h2>手部任务分配对比</h2>
<div class="distribute"><div class="dist-box dist-bad"><h5>手回杯</h5>摆动➕流量➕回杯<br/><div class="label">3个任务互相干扰</div></div><div class="dist-box dist-good"><h5>身体回杯</h5>摆动➕流量<br/><div class="label">2个任务，回杯由身体完成</div></div></div>
<h2>核心原理</h2><div class="principle"><strong>动作分离原则：</strong>每个身体部位只负责一个运动维度。<br/>• 身体（躯干）：负责回杯的倾斜运动<br/>• 手/手腕：负责摆动和流量控制<br/><br/>当两个运动叠加在同一部位时，必然产生干扰。把不同维度的运动分配到不同身体部位，<strong>降低每部位的负担</strong>，提高每个动作的精度和稳定性。</div>
<div class="conclusion"><strong>练功方向：</strong>下次拉花时刻意注意——杯子回正用的是身体倾斜还是手腕？如果是手腕，试试身体倾斜。找一面镜子练习，观察身体和手是否做到了运动分离。当手不再需要操心回杯时，你会发现摆动变得更加从容。</div></div>
    </div>
  </foreignObject>
</svg>