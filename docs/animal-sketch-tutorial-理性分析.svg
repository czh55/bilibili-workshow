      <div class="container root-wrap">
  <h1>山羊速写：头部窗口期</h1>
  <div class="meta"><span class="tag tag-blue">山羊</span><span class="tag tag-green">鹅蛋</span><span class="tag tag-orange">头部优先</span><span class="tag tag-purple">交界线</span><span class="tag tag-red">对比</span><span class="tag tag-gray">时长 81秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/7VFN9CUYTRo">原视频</a>
  <div class="summary-line">感受最敏锐时从最精彩处下笔。山羊：大鹅蛋＋几何形建头颈躯干；细画从头部开始。角顺纹路有厚度；抓明暗交界线拿体积；腿分前后；石头长直线与羊对比。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">从最精彩处画起</span></div><div class="timeline-item"><span class="timeline-time">00:10</span><span class="timeline-text">大鹅蛋＋几何形</span></div><div class="timeline-item"><span class="timeline-time">00:19</span><span class="timeline-text">头颈躯干体块</span></div><div class="timeline-item"><span class="timeline-time">00:32</span><span class="timeline-text">从头部细画</span></div><div class="timeline-item"><span class="timeline-time">00:43</span><span class="timeline-text">羊角顺纹路</span></div><div class="timeline-item"><span class="timeline-time">00:53</span><span class="timeline-text">明暗交界线</span></div><div class="timeline-item"><span class="timeline-time">01:08</span><span class="timeline-text">石直线对比</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">1<br/>鹅蛋大型</div><span class="arrow">→</span><div class="node-green">2<br/>头优先</div><span class="arrow">→</span><div class="node-orange">3<br/>交界线</div><span class="arrow">→</span><div class="node-blue">4<br/>材质对比</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「划起／几何斤」→「画起／几何形」。</p><p>误区：全身平均推进。视频主张头部落在注意力高峰。</p><p>误区：两腿画对称。强调前后关系。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>感受窗口期</h3>
      <p>刚开始感受最敏锐、注意力最集中——所以从最精彩／最重要的头部画起。</p>
      <div class="quote">一定要先从最精彩的地方画起……建议从最重要的头部开始</div>
      <div class="relation">顺序服从注意力曲线。</div>
    </div>
    <div class="card card-orange">
      <h3>鹅蛋→体块→细画</h3>
      <p>整体大鹅蛋，内部大几何形，头颈躯干交代清楚再细画。</p>
      <div class="quote">把整体看成一个大的鹅蛋……找出内部的大的几何形</div>
      <div class="relation">大型未立禁止开心细画。</div>
    </div>
    <div class="card card-red">
      <h3>交界线＝体积开关</h3>
      <p>紧紧抓住明暗交界线的丰富变化，体积感轻松拿捏；腿要有前后。</p>
      <div class="quote">要紧紧的抓住明暗交界线的丰富的变化，体积感就会轻松的拿捏</div>
      <div class="relation">体积在交界，不在平涂。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>材质对比</p>
      <div class="quote">石头长直线 vs 羊的有机形，主动制造视觉对比。</div>
      <div class="relation">和羊可以形成一种有趣的视觉对比</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>81 秒山羊一例。</li><li>「先精彩处」针对速写感受，非所有画种铁律。</li><li>无完整解剖展开。</li></ul><div class="pitfall">平均铺全身错过头。</div><div class="pitfall">角无线方向只涂黑。</div><div class="pitfall">两腿画成同一深度。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>大型后头优先</li><li>交界线出体积</li><li>前后与材质对比</li></ul><h3>行动清单</h3><ol><li>计时：前3分钟只画鹅蛋＋头</li><li>角只顺着纹路三组线</li><li>标一条主交界线</li><li>背景石用长直线对比</li></ol><h3>关键认知转变</h3><p>以前：速写从头到脚平均推进；现在：把最好注意力留给头部与交界线。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 81秒</div>
</div>
    </div>
  </foreignObject>
</svg>