<div class="card"><h3>内容要点</h3><ul><li>忘记那些快门控制环境、光圈控制主体</li>
<li>挨手控制整体之类的说法</li>
<li>这些说法真的不会让你觉得很发闷</li>
<li>我觉得它会让闪光灯的拍摄</li>
<li>变得很复杂、很啰嗦</li>
<li>而且这种说法里面有很多错误之处</li>
<li>有些博主把闪光灯的使用讲得太过于复杂了</li>
<li>导致很多新手不敢于去尝试用的</li>
<li>甚至排斥用的</li>
<li>闪光灯的使用其实比相机的使用还简单</li>
<li>它就是一层窗户纸</li>
<li>捅开了没有任何难度</li>
<li>外景闪光灯最易操作法就是两步法</li>
<li>按照你平常喜欢的方式去拍一张场景照</li>
<li>不用去考虑人物主体</li>
<li>相机参数不动</li>
<li>调节闪光灯输出</li>
<li>直至主体曝光准确</li>
<li>支条相机</li>
<li>支条灯就这么简单</li>
<li>闪光灯有一个很重要的特性</li>
<li>就是它是一个近距离的光</li>
<li>所以说我们会发现</li>
<li>闪光灯基本支作用在主体身上</li>
<li>对即便只是稍微远一点的环境</li>
<li>也没有什么大的影响</li>
<li>所以环境是由现场光决定的</li>
<li>主体是由闪光灯决定的</li>
<li>其实就是拍一张场景照</li>
<li>但可以比正常的环境照略安一点</li>
<li>以便于后面主体突出</li>
<li>有的人喜欢压得很暗</li>
<li>但我不太建议这么做</li>
<li>因为会导致后期人物</li>
<li>跟环境有一些玻璃感像贴上去的</li>
<li>主体的亮度和环境的亮度</li>
<li>还是要控制在一个合适的比例</li>
<li>但这个比例却是因个人的口味不同</li>
<li>再说一下曝光山药树的调整</li>
<li>光圈的设计主要取决于景深</li>
<li>如果你想突出主体虚化环境</li>
<li>就把光圈开大一点</li>
<li>反思易染</li>
<li>如果景深不重要</li>
<li>就把光圈设计放到最后</li>
<li>先考虑其他两个因素</li>
<li>在现场光亮度允许的范围之内</li>
<li>尽量用最低的ISO</li>
<li>以确保最好的画质</li>
<li>如果是夜景暗光拍摄</li>
<li>就把ISO放到最后条</li>
<li>快门速度如果没有特别的要求</li>
<li>尽量放在你相机的最高同步速度上</li>
<li>一般也就是250分之1秒</li>
<li>因为这个速度是闪光灯</li>
<li>发挥效率最高的快门速度</li>
<li>如果是暗光拍摄</li>
<li>就放在最低快门上</li>
<li>如果不在乎环境的动态模糊</li>
<li>甚至可以放到1 2分之1</li>
<li>1 4分之1这样极慢的快门速度上</li>
<li>反正主体有闪光灯来凝固</li>
<li>记住这里的三个参数的设计</li>
<li>都是为你拍出的那张</li>
<li>场景招服务的</li>
<li>和用不用闪光灯没关系</li>
<li>这部场景最好是用M档来拍</li>
<li>你可以用最优的方案</li>
<li>来控制散药数的组合</li>
<li>当然你想减遍也可以用光圈优先</li>
<li>快门优先 甚至P档</li>
<li>但拍到满意之后</li>
<li>切换到M把三个参数固定下来不动</li>
<li>第二步把人放到场景中去</li>
<li>支持调节闪光灯的输出</li>
<li>不用管环境的事</li>
<li>人物曝光准确就OK了</li>
<li>完全不用理会哪个参数</li>
<li>控制的是哪个</li>
<li>这些乱七八糟的东西</li>
<li>如果闪光灯操控熟练</li>
<li>这部闪光灯最好也用M</li>
<li>如果不熟练或者你不会</li>
<li>也可以用TDL</li>
<li>只要点测光人脸基本上就可以了</li>
<li>是不是很简单</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>忘记那些快门控制环境、光圈控制主体挨手控制整体之类的说法这些说法真的不会让你觉得很发闷我觉得它会让闪光灯的拍摄变得很复杂、很啰嗦而且这种说法里面有很多错误之处有些博主把闪光灯的使用讲得太过于复杂了导致很多新手不敢于去尝试用的甚至排斥用的闪光灯的使用其实比相机的使用还简单它就是一层窗户纸捅开了没有任何难度外景闪光灯最易操作法就是两步法第一步按照你平常喜欢的方式去拍一张场景照不用去考虑人物主体第二步相</p><p>转录分段: 93 | 时长: 3:01</p></div>
