<h1>10bit422和8bit420究竟是个啥？差别大吗？</h1>
<div class="meta">
<span class="tag tag-blue">摄影知识</span><span class="tag tag-green">色深</span><span class="tag tag-orange">色度采样</span><span class="tag tag-gray">2:47</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>两个概念：①<strong>色深</strong>（bit）——决定色彩分级数量：8bit=每通道256灰度≈<strong>1670万色</strong>，10bit=每通道1024灰度≈<strong>10.7亿色</strong>，差<strong>64倍</strong>；色深越低越容易<strong>色彩断层</strong>（渐变色条带）；拍 log/后期重拉色彩时<strong>别用 8bit</strong>。②<strong>色度采样</strong>（420/422/444）——人眼对亮度敏感对色彩不敏感，让像素<strong>共享色度值</strong>减少数据量：420=相邻像素共享、422=每行记录一半、444=全记录（电影机）；日常 420 够用，但<strong>二级调色、抠像</strong>时 422 以上避免<strong>颜色溢出、边缘发糊</strong>。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">8bit420、10bit422 这些影像名词是什么</span></div><div class="timeline-item"><span class="timeline-time">00:05</span><span class="timeline-text">类比：128色马克笔 vs 12色马克笔画晚霞</span></div><div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">颜色不够出现明显分界线=色彩断层</span></div><div class="timeline-item"><span class="timeline-time">00:26</span><span class="timeline-text">决定颜色细分数量的是色深（bit）</span></div><div class="timeline-item"><span class="timeline-time">00:36</span><span class="timeline-text">8bit：每通道256灰度≈1670万色</span></div><div class="timeline-item"><span class="timeline-time">00:48</span><span class="timeline-text">10bit：每通道1024灰度≈10.7亿色，差64倍</span></div><div class="timeline-item"><span class="timeline-time">01:02</span><span class="timeline-text">相机支持10bit，渐变更自然，后期调整更明显</span></div><div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">log模式别用8bit：色彩空间有限+信息量大，重拉就断层</span></div><div class="timeline-item"><span class="timeline-time">01:26</span><span class="timeline-text">420/422 是什么：人眼对亮度敏感对色彩不敏感</span></div><div class="timeline-item"><span class="timeline-time">01:39</span><span class="timeline-text">像素保留明度，多个像素共享一个色度值</span></div><div class="timeline-item"><span class="timeline-time">01:48</span><span class="timeline-text">4:2:0 = 第一行记录2个色度，第二行继承</span></div><div class="timeline-item"><span class="timeline-time">02:05</span><span class="timeline-text">4:2:2 = 每行各记录2个色度；4:4:4=全记录</span></div><div class="timeline-item"><span class="timeline-time">02:26</span><span class="timeline-text">日常420够用；二级调色、抠像要更高采样</span></div></div>
<div class='section'><div class='sec-title'>两个维度拆解</div><div class='diagram'><div class='node'>色深<br/><small>bit：色彩分级数量</small></div><span class='arrow'>→</span><div class='node'>色度采样<br/><small>420/422/444：色度信息量</small></div><span class='arrow'>→</span><div class='node node-green'>出片质量<br/><small>渐变顺滑+后期不崩</small></div></div></div><div class='section'><div class='sec-title'>色深：色彩阶梯</div><div class='card'><h3>8bit vs 10bit</h3><p><strong>8bit</strong>：红绿蓝每通道 256 灰度（2^8），共约 <strong>1670 万色</strong>。<strong>10bit</strong>：每通道 1024 灰度（2^10），共约 <strong>10.7 亿色</strong>——<strong>相差 64 倍</strong>。</p></div><div class='card card-orange' style='margin:12px 0'><h3>色彩断层</h3><p>像 128 色马克笔换成 12 色，天空渐变出现<strong>明显分界线</strong>——颜色分级不够就是<strong>色彩断层</strong>。色深越高，阶梯越多，渐变越自然。</p></div><div class='card card-red'><h3>log 模式注意</h3><p>log 模式把大量信息放进有限色彩空间，<strong>8bit 后期重拉很容易断层</strong>——要拍 log 用 10bit。</p></div></div><div class='section'><div class='sec-title'>色度采样：共享色度</div><div class='card'><h3>人眼特点</h3><p>人眼对<strong>亮度明暗极其敏感</strong>，对色彩细微变化<strong>没那么挑剔</strong>——所以明度每像素必留，色度可共享。</p></div><div class='card card-green' style='margin:12px 0'><h3>4:2:0 / 4:2:2 / 4:4:4</h3><p><strong>4:2:0</strong>：每行4像素，第一行记录2个色度，第二行继承第一行。<strong>4:2:2</strong>：两行各记录2个色度。<strong>4:4:4</strong>：色彩全记录，专业电影机规格。</p></div><div class='card card-purple'><h3>什么时候需要高采样</h3><p>日常拍摄 <strong>4:2:0 就够</strong>；但做精细<strong>二级调色、抠像</strong>时，因为像素缺色度值，会出现<strong>颜色溢出、边缘发糊</strong>——这时候选 4:2:2 以上。</p></div></div>
<div class="conclusion">
<h2>选型结论</h2>
<h3>一句话总结</h3><ul><li><strong>色深</strong>管“颜色分级细不细”（渐变顺滑 vs 断层）</li><li><strong>色度采样</strong>管“色度信息留多少”（日常够用 vs 后期可塑）</li></ul><h3>怎么选</h3><ol><li>日常拍：8bit 4:2:0 够用，画面正常</li><li>拍 log、拍渐变多的场景：<strong>10bit</strong></li><li>精细二级调色、抠像：<strong>4:2:2 及以上</strong></li></ol>
</div>
