<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2600" viewBox="0 0 1320 2600">
  <foreignObject x="0" y="0" width="1320" height="2600">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}
.container{max-width:1200px;margin:0 auto}
h1{font-size:36px;font-weight:900;background:linear-gradient(135deg,#0f766e,#14b8a6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h2{font-size:26px;font-weight:700;color:#0f766e;margin:32px 0 16px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
h3{font-size:20px;font-weight:700;color:#334155;margin-bottom:12px}
p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}
ul,ol{padding-left:24px;margin:8px 0}
li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:6px}
.tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}
.tag-blue{background:#dbeafe;color:#1e40af}
.tag-green{background:#d1fae5;color:#065f46}
.tag-orange{background:#ffedd5;color:#9a3412}
.tag-purple{background:#ede9fe;color:#6b21a8}
.tag-red{background:#fee2e2;color:#991b1b}
.tag-gray{background:#f1f5f9;color:#64748b}
.meta{margin:12px 0 20px}
.summary-line{font-size:18px;line-height:1.7;color:#334155;padding:20px 24px;background:#fff;border-radius:12px;border-left:4px solid #14b8a6;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline{background:#fff;border-radius:16px;padding:24px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline h3{color:#0f766e;margin-bottom:12px}
.timeline-item{display:flex;align-items:baseline;padding:8px 0;border-bottom:1px solid #f1f5f9}
.timeline-time{font-size:14px;font-weight:700;color:#0d9488;min-width:70px;font-variant-numeric:tabular-nums}
.timeline-text{font-size:15px;color:#475569}
.map{background:#fff;border-radius:20px;padding:36px;margin-bottom:28px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.map h2{font-size:24px;margin-top:0;border-bottom:none;padding-bottom:0}
.diagram{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:20px 0}
.node{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:2px solid #6ee7b7;border-radius:16px;padding:20px 28px;text-align:center;min-width:160px;font-weight:700;font-size:16px;color:#065f46}
.node-green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}
.node-orange{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}
.node-blue{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-color:#93c5fd;color:#1e40af}
.arrow{font-size:24px;color:#94a3b8}
.correction{background:linear-gradient(135deg,#fef3c7,#fef9c3);border-left:4px solid #f59e0b;padding:20px 24px;border-radius:12px;margin-bottom:24px}
.correction h3,.correction p{color:#92400e}
.section{margin-bottom:32px}
.sec-title{font-size:22px;font-weight:700;color:#0f766e;margin-bottom:16px;padding-left:16px;border-left:4px solid #14b8a6}
.card{background:#fff;border-radius:16px;padding:32px;margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.06);border-left:5px solid #14b8a6}
.card.card-green{border-left-color:#10b981}
.card.card-orange{border-left-color:#f59e0b}
.card.card-purple{border-left-color:#8b5cf6}
.card.card-red{border-left-color:#ef4444}
.card h3{font-size:20px;font-weight:700;color:#0f766e;margin-bottom:12px}
.card .highlight{background:#fef3c7;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#92400e;border-left:4px solid #f59e0b}
.card .quote{background:#f8fafc;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#64748b;border-left:4px solid #cbd5e1;font-style:italic}
.card .relation{background:#f0fdf4;padding:10px 14px;border-radius:10px;margin:8px 0;font-size:14px;color:#166534}
.card .pitfall{background:#fef2f2;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#991b1b;border-left:4px solid #ef4444}
.card .action,.card .insight{background:#ecfdf5;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#065f46;border-left:4px solid #14b8a6}
.speaker{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:12px;margin-right:8px}
.speaker-host{background:#d1fae5;color:#065f46}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}
th{background:#f1f5f9;padding:12px 16px;text-align:left;font-weight:700;color:#0f766e;border-bottom:2px solid #cbd5e1}
td{padding:12px 16px;border-bottom:1px solid #e2e8f0;color:#475569;vertical-align:top}
tr:nth-child(even) td{background:#fafbfc}
.conclusion{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border-radius:20px;padding:36px;margin-top:32px}
.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#0d9488;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#0f766e;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      
<div class="container root-wrap">
  <h1>分享一些审美灵感➕我的分析～</h1>
  <div class="meta"><span class="tag tag-blue">审美</span><span class="tag tag-blue">穿搭</span><span class="tag tag-blue">化妆</span><span class="tag tag-blue">家居</span><span class="tag tag-blue">配饰</span><span class="tag tag-blue">小红书</span><span class="tag tag-gray">时长 4:25</span></div>
  <a class="source-link" href="http://xhslink.cn/o/6DJKZmKwwYY">原视频链接</a>
  <div class="summary-line">把审美参考图拆成耳饰、软装、修容、发型、配色、叠戴与光影等可记录的观察点。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:10</span><span class="timeline-text">耳廓夹位置</span></div><div class="timeline-item"><span class="timeline-time">00:40</span><span class="timeline-text">镜子需纹理墙</span></div><div class="timeline-item"><span class="timeline-time">01:05</span><span class="timeline-text">鼻小柱阴影</span></div><div class="timeline-item"><span class="timeline-time">01:25</span><span class="timeline-text">鸭舌帽耳后括弧</span></div><div class="timeline-item"><span class="timeline-time">02:10</span><span class="timeline-text">全身颜色呼应</span></div><div class="timeline-item"><span class="timeline-time">02:45</span><span class="timeline-text">叠链与波点甲</span></div><div class="timeline-item"><span class="timeline-time">03:30</span><span class="timeline-text">发丝光与冷白色</span></div></div>
  <div class="section"><div class="sec-title">观点拆解</div><div class="card"><h3>核心命题：审美分析 = 拆局部机制</h3><div class="highlight">每张图回答「它靠什么成立」，而不是「我想买同款」。</div><div class="action">记录时写：焦点部位 / 墙面或背景 / 颜色呼应链。</div></div><div class="card"><h3>配饰：位置改变存在感</h3><div class="quote">耳廓高位耳饰 &gt; 只戴耳垂款。</div><div class="pitfall">可爱镜子挂大白墙，容易显得空且廉价。</div></div><div class="card"><h3>脸型服务：帽型要配发型结构</h3><div class="action">鸭舌帽试耳后括弧；肉鼻可试鼻小柱阴影线。</div></div><div class="card"><h3>配色与补完：叠戴和光都是工具</h3><div class="highlight">两条项链可分别呼应不同颜色；发丝光能补棕色包。</div><div class="pitfall">冷白和暖白硬凑一套，不如把冷白当独立色块。</div></div></div>
  <div class="conclusion"><h2>行动清单</h2><ul><li>收藏图时标注「启发部位」：耳饰/鼻型/发型/配色/墙面</li><li>试一次耳廓夹或耳骨夹，看正面耳朵存在感是否提升</li><li>全身基础色时，用两条不同色项链补层次</li><li>穿冷白色上衣时，先把它当「一个颜色」再配其他单品</li></ul>
  <h2>适用边界</h2><p>观点来自博主个人刷图经验；耳饰、鼻型修容、帽型与发型需结合耳型、脸型与日常舒适度，不必照搬每张参考图。</p></div>
  <div class="footer">双轨产物之二 · SVG 理性分析 · http://xhslink.cn/o/6DJKZmKwwYY</div>
</div>
    </div>
  </foreignObject>
</svg>