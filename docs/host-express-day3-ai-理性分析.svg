      <div class="container root-wrap">
  <h1>三句定乾坤：AI 当你的表达安检</h1>
  <div class="meta"><span class="tag tag-blue">表达系统</span><span class="tag tag-green">三句定乾坤</span><span class="tag tag-orange">AI陪练</span><span class="tag tag-purple">结构安检</span><span class="tag tag-red">职场沟通</span><span class="tag tag-gray">2分36秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/4KwKxppQWJ">原视频</a>
  <div class="summary-line">被问「你到底想说什么」时，用结果→原因→行动做结构安检；把固定提示词交给 AI 追问逃避与矛盾并重组三句，缺的是安检员不是口才。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">痛点：你到底想表达什么</span></div><div class="timeline-item"><span class="timeline-time">00:05</span><span class="timeline-text">诊断：缺结构安检</span></div><div class="timeline-item"><span class="timeline-time">00:22</span><span class="timeline-text">三句定乾坤：结论—为什么—然后呢</span></div><div class="timeline-item"><span class="timeline-time">00:32</span><span class="timeline-text">方案：AI 当陪练</span></div><div class="timeline-item"><span class="timeline-time">00:38</span><span class="timeline-text">提示词：教练身份+只追三问</span></div><div class="timeline-item"><span class="timeline-time">01:03</span><span class="timeline-text">案例：无效会议情绪版</span></div><div class="timeline-item"><span class="timeline-time">01:20</span><span class="timeline-text">逼出结果与自我归因</span></div><div class="timeline-item"><span class="timeline-time">01:56</span><span class="timeline-text">重组三句完成安检</span></div><div class="timeline-item"><span class="timeline-time">02:12</span><span class="timeline-text">本质：安检不是 AI 聪明</span></div></div>
  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">情绪吐槽</div><span class="arrow">→</span><div class="node-green">AI 三问追打</div><span class="arrow">→</span><div class="node-orange">结果原因行动</div><span class="arrow">→</span><div class="node-red">可复制安检</div></div></div>
  <div class="correction"><h3>常见误解与认知纠偏</h3><p>· ASR「三具定乾坤」→三句定乾坤；「无常」→无偿；「提词系」→提词器；「志祥」→指责；「表达安全」→表达安检；「说火」→说活。</p><p>· 误解：我不会说话。纠偏：缺的是结构安检闭环。</p><p>· 误解：靠 AI 替我生成漂亮稿。纠偏：AI 职责是追问与重组，话仍是你的。</p><p>· 误解：吐槽外部就等于表达完成。纠偏：要落到自己可执行的行动。</p></div>
  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 为何重要 → 怎么用</h2><div class="card card-orange"><h3>三句定乾坤</h3><p>高压出场同款内核：核心结论是什么、为什么、然后呢。把瞬时空转成可执行结构。</p><div class="quote">「接下来这段话的核心结论是什么、为什么、然后呢——这就是三句定乾坤」[00:22–00:27]</div><div class="pitfall">只发泄情绪与过程，没有结论句。</div><div class="action">任何抱怨先强制写成三句再开口。</div></div><div class="card card-green"><h3>AI 提示词设计</h3><p>身份=表达教练；只追三问；抓逃避模糊矛盾；答完用结果—原因—行动重组。边界写死，模型才不会跑去安慰或闲聊。</p><div class="quote">「如果我的回答里有逃避、模糊或者前后矛盾，直接指出来」[00:50–00:54]</div><div class="pitfall">提示词太软，AI 变成情绪树洞。</div><div class="action">把片尾卡片原文粘贴进常用 AI，收藏为「表达安检」。</div></div><div class="card"><h3>案例：无效会议如何过安检</h3><p>从「不爽开会」被逼到结果（浪费上午/工作未动），再分清外部吐槽 vs 自己应对不足，最后给出 24 小时议程与跑题超时干预。</p><div class="quote">「不是 AI 多聪明，是我给自己设置了一个表达安检」[02:12–02:16]</div><div class="pitfall">停在指责会议，不认领自己可改的动作。</div><div class="action">用同一提示词复盘本周一次低效会，产出三句话。</div></div><div class="card card-red"><h3>系统位置：结构之后是具体化</h3><p>本集解决「说清」；预告下一阶段用细节把话说活、让对方有画面——与画面感训练衔接。</p><div class="quote">「从我觉得到结果是，中间只差一个追问你的人」[02:20–02:22]</div><div class="pitfall">结构通了就停，表达仍抽象无画面。</div><div class="action">安检通过后，再给结果句补两个感官细节。</div></div></div>
  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>示范用通用大模型对话，效果依赖你是否诚实回答追问。</li><li>三句结构适合作结论表达与工作同步，不覆盖所有叙事体裁。</li><li>AI 指出矛盾不等于事实真相，最终判断仍在你。</li></ul><h3>避坑</h3><ul><li>把 AI 当代写，跳过被追问的不适感。</li><li>归因永远甩给外部，行动句空洞。</li><li>提示词每次即兴改写，丢失「只追三问」约束。</li></ul></div></div>
  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>表达问题常是缺安检，不是缺嘴皮</li><li>结果→原因→行动可练、可迁移</li><li>AI 的价值是强制追问与重组</li></ul><h3>行动清单</h3><ol><li>收藏片中提示词，今日用它复盘一件不爽事</li><li>输出必须是三句话，禁止超长情绪铺陈</li><li>明日衔接具体化：给结论句加感官细节</li></ol><h3>关键认知转变</h3><p>以前：一肚子情绪却说不清；现在：先过三句安检，再决定要不要展开故事。</p></div>
  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 2分36秒</div>
</div>
