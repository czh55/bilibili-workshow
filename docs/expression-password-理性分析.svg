.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>表情密码：放大特征与趋势</h1>
  <div class="meta"><span class="tag tag-blue">表情</span><span class="tag tag-green">特征放大</span><span class="tag tag-orange">趋势</span><span class="tag tag-purple">五官</span><span class="tag tag-red">速写</span><span class="tag tag-gray">时长 4分55秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/1oddahTXBCO">原视频</a>
  <div class="summary-line">生动表情＝在正确结构点做特征放大（眼三角、川字纹、鼻孔尖、眉尖、嘴角高低），再拉长趋势（裂开程度、线走向）。可变形服务表现；线条足够，不必迷信揉擦术语。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">原则：特征放大</span></div><div class="timeline-item"><span class="timeline-time">00:11</span><span class="timeline-text">眼睛三角</span></div><div class="timeline-item"><span class="timeline-time">00:22</span><span class="timeline-text">川字纹</span></div><div class="timeline-item"><span class="timeline-time">00:28</span><span class="timeline-text">鼻与鼻孔</span></div><div class="timeline-item"><span class="timeline-time">01:12</span><span class="timeline-text">嘴角高低</span></div><div class="timeline-item"><span class="timeline-time">01:48</span><span class="timeline-text">比原图更强</span></div><div class="timeline-item"><span class="timeline-time">03:16</span><span class="timeline-text">形状＋趋势</span></div><div class="timeline-item"><span class="timeline-time">04:00</span><span class="timeline-text">作业对照</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">选点<br/>正确结构位</div><span class="arrow">→</span><div class="node-green">放大<br/>特征形状</div><span class="arrow">→</span><div class="node-orange">拉长<br/>趋势力度</div><span class="arrow">→</span><div class="node-blue">对照<br/>原图／作业</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「穿字纹」→川字纹；「滋雅咧嘴」→龇牙咧嘴；「清纯」→清楚。</p><p>「C黑」为人名／作业代号，ASR不清，文中称作业即可。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>特征放大</h3>
      <p>在正确点位强化已有特征，而不是随机乱加符号。</p>
      <div class="quote">实际上有一个原则叫做特征放大</div>
      <div class="relation">夸张锚定结构，不是瞎变形。</div>
    </div>
    <div class="card card-purple">
      <h3>趋势第二刀</h3>
      <p>形状夸张后，再加强嘴裂开等趋势线，表情才「炸」得清楚。</p>
      <div class="quote">第二个叫在趋势上进行夸张</div>
      <div class="relation">形状×趋势＝可读情绪。</div>
    </div>
    <div class="card card-orange">
      <h3>表现优先</h3>
      <p>局部可偏离课堂比例，服务艺术表现；线条能解决就不必堆术语技法。</p>
      <div class="quote">线条是万能的同学们</div>
      <div class="relation">工具服务于表情可读性。</div>
    </div>
    <div class="card card-red">
      <h3>作业判准</h3>
      <p>嘴趋势弱＝精髓丢失；中间稿更龇牙咧嘴反而对。</p>
      <div class="quote">中间这样你完全把握住了这个表情的夸张的精髓</div>
      <div class="relation">对照原图看趋势强弱，不看像不像照片。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>示范仍自称收敛，课堂夸张幅度需与阶段匹配。</li><li>反对的是空转术语，不是否定一切色调技法。</li><li>五官夸张在写实商业肖像中要另控尺度。</li></ul><div class="pitfall">只抠比例不敢放大特征。</div><div class="pitfall">夸张了形状却不拉趋势，表情仍平。</div><div class="pitfall">离开结构点乱加皱纹与符号。</div><div class="pitfall">用「像不像照片」替代「情绪是否更清楚」。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>特征放大在正确点</li><li>趋势是第二层夸张</li><li>变形可服务表现</li><li>对照看精髓不看描红</li></ul><h3>行动清单</h3><ol><li>选一张表情照片，列出3个必放大特征点</li><li>先画结构点，再统一加大嘴角高低差</li><li>与原图并置检查趋势线是否更强</li><li>作业互评只问：精髓抓住了没有</li></ol><h3>关键认知转变</h3><p>以前：表情靠描准五官；现在：在结构点放大特征并拉长趋势，让情绪先于形似。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 4分55秒</div>
</div>
    </div>
  </foreignObject>
</svg>