<h1>一个重要的布光理论 亮度=1/n²</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">摄影技巧</span> <span class="tag tag-blue">灯光</span> <span class="tag tag-gray">1:31</span></div>
