ckground:#faf8f5;padding:20px 24px;border-radius:12px;margin:16px 0;font-size:14px;color:#555;line-height:1.9}</style>
      <div class="container">
<h1>反平方定律：亮度 = 1/n²</h1>
<div class="meta"><span class="tag tag-blue">小红书</span><span class="tag tag-blue">摄影灯光</span><span class="tag tag-gray">1:31</span></div>

<div class="summary-line">光的传播衰减不是线性的，而是几何级的——这个核心理论就是反平方定律：亮度=1/n²。距离增加1倍→亮度为原来的1/4；距离增加2倍→亮度为原来的1/9。这个法则对布光实践影响巨大：①一盏灯打两个人时，两人之间微小的距离差会产生巨大的亮度差→光源应拉远；②口播拍摄时，光源越近→背景衰减越大→人物与背景分离；反之光源拉远→人物与背景亮度差缩小。但特定条件下反平方率会失效（如平行光源、远距离光源如太阳）。</div>

<div class="map"><h2>核心脉络图</h2>
<div class="diagram">
  <div class="node">距离n=1<br/>亮度=1</div>
  <div class="arrow">→×2→</div>
  <div class="node node-orange">n=2<br/>亮度=1/4</div>
  <div class="arrow">→×3→</div>
  <div class="node node-orange">n=3<br/>亮度=1/9</div>
</div>
<p style="text-align:center;margin-top:12px;color:#64748b;font-size:14px;">几何衰减：距离每增加1倍，亮度变为原来的1/4</p>
</div>

<div class="card"><h3>反平方定律的实战应用</h3>
<table>
<tr><th>场景</th><th>光源位置</th><th>效果</th></tr>
<tr><td>口播/人像分离背景</td><td>光源尽量靠近人物</td><td>背景大幅变暗，主体突出</td></tr>
<tr><td>多人合影</td><td>光源拉远</td><td>人物间亮度均匀</td></tr>
<tr><td>太阳光</td><td>极远</td><td>地球表面亮度几乎一致</td></tr>
<tr><td>近距补光灯</td><td>非常近</td><td>明暗反差极大</td></tr>
</table>
</div>

<div class="card card-green"><h3>行动清单</h3>
<ul>
<li>口播想分离背景：灯尽量靠近人物（利用近距强衰减）</li>
<li>多人拍摄想亮度均匀：灯尽量拉远</li>
<li>一盏灯打两个人物同时出现明暗差距→问题出在灯太近</li>
<li>理解太阳光"均匀"的原因：极远距离使反平方率效应趋近于零</li>
</ul>
</div>

<div class="card card-red"><h3>避坑总结</h3>
<ul>
<li>不要直觉认为光衰减是线性的——距离加倍=亮度1/4，不是1/2</li>
<li>不要忽略近距离拍摄时灯距人物过近导致的明暗反差过大</li>
<li>不要让补光灯太远——失去背景分离效果</li>
</ul>
</div>

<div class="card card-orange"><h3>方法边界</h3>
<div class="boundary">
<p><strong>反平方定律适用条件：</strong>点光源、无遮挡、均匀介质。</p>
<p><strong>特定条件下的失效：</strong>太阳等极远光源（平行光）、使用光位附件改变光束特性后。</p>
</div>
</div>

<div class="conclusion">
<h2>立场分层与结语</h2>
<h3>一句话</h3>
<p>光源离人物越近→明暗反差越大→背景分离越强。这是布光中最基础也最常被忽略的物理定律。</p>
</div></div>
