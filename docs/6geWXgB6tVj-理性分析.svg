<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">我们很直观的认为光行走了一辈的距离</span></div>
<div class="timeline-item"><span class="timeline-time">[00:02]</span><span class="timeline-text">强度应当减弱一半</span></div>
<div class="timeline-item"><span class="timeline-time">[00:04]</span><span class="timeline-text">但是是光的传播衰减倍率</span></div>
<div class="timeline-item"><span class="timeline-time">[00:06]</span><span class="timeline-text">不是线性的</span></div>
<div class="timeline-item"><span class="timeline-time">[00:06]</span><span class="timeline-text">而是成几何事的</span></div>
<div class="timeline-item"><span class="timeline-time">[00:08]</span><span class="timeline-text">首先咱们做个思想实验</span></div>
<div class="timeline-item"><span class="timeline-time">[00:10]</span><span class="timeline-text">我们站在80楼</span></div>
<div class="timeline-item"><span class="timeline-time">[00:11]</span><span class="timeline-text">小帅上方有一盏灯</span></div>
