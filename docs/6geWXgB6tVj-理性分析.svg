<div class="timeline-item"><span class="timeline-time">[00:26]</span><span class="timeline-text">小帅和小美被照的亮度几乎一致</span></div>
<div class="timeline-item"><span class="timeline-time">[00:29]</span><span class="timeline-text">大家看</span></div>
<div class="timeline-item"><span class="timeline-time">[00:30]</span><span class="timeline-text">光衰减的攻势是个反平方率</span></div>
<div class="timeline-item"><span class="timeline-time">[00:32]</span><span class="timeline-text">亮度等于n的平方分之一</span></div>
<div class="timeline-item"><span class="timeline-time">[00:34]</span><span class="timeline-text">距离增加一倍</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>我们很直观的认为光行走了一辈的距离</li>
<li>强度应当减弱一半</li>
<li>但是是光的传播衰减倍率</li>
<li>不是线性的</li>
<li>而是成几何事的</li>
<li>首先咱们做个思想实验</li>
<li>我们站在80楼</li>
<li>小帅上方有一盏灯</li>
<li>把小帅照亮</li>
<li>同时小美站在1楼</li>
<li>这盏灯几乎对小美起不到半点照明作用</li>
<li>但如果把光源换成太阳</li>
<li>太阳离我们超级无敌远</li>
<li>以至于在地球上</li>
<li>不管我们站在80楼还是1楼</li>
<li>小帅和小美被照的亮度几乎一致</li>
<li>光衰减的攻势是个反平方率</li>
<li>亮度等于n的平方分之一</li>
<li>距离增加一倍</li>
<li>光的亮度为原有的四分之一</li>
<li>增加两倍为原有的九分之一</li>
<li>但这个对于我们曝光有什么影响呢</li>
<li>其实影响非常大</li>
<li>大家有没有遇到过这样的情况</li>
<li>一盏灯打两个人物</li>
<li>一个人物面部曝光刚刚好</li>
<li>但另一个人物面部却曝光不足</li>
<li>问题处在光源离演员们太近了</li>
<li>两个人物之间</li>
<li>光衰减的太极处</li>
<li>越极处的衰减</li>
<li>也意味着明暗反差越大</li>
<li>在举个应用场景</li>
<li>我们拍摄口播的时候</li>
<li>光源离人物越近</li>
<li>那么背景的亮度衰减也越大</li>
<li>咱们如果把光源拉远</li>
<li>人物和背景的亮度差就会逐渐缩小</li>
<li>那么如果我们想要做到背景分离的效果</li>
<li>让照亮人物的同时</li>
<li>光源不要过分影响背景</li>
<li>就需要把光源尽可能往人物靠近</li>
<li>但反平方率</li>
<li>不完全适用于所有情况</li>
<li>特定的条件下它是会失效的</li>
<li>以后我们聊光志会继续研究</li>
<li>感谢收看这篇新闻摄影</li>
<li>我是老队</li>
<li>我们下次再见</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>我们很直观的认为光行走了一辈的距离强度应当减弱一半但是是光的传播衰减倍率不是线性的而是成几何事的首先咱们做个思想实验我们站在80楼小帅上方有一盏灯把小帅照亮同时小美站在1楼这盏灯几乎对小美起不到半点照明作用但如果把光源换成太阳太阳离我们超级无敌远以至于在地球上不管我们站在80楼还是1楼小帅和小美被照的亮度几乎一致大家看光衰减的攻势是个反平方率亮度等于n的平方分之一距离增加一倍光的亮度为原有的四分之</p><p>转录分段: 50 | 时长: 1:31</p></div>
