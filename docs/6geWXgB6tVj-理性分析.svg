<div class="timeline-item"><span class="timeline-time">[00:14]</span><span class="timeline-text">同时小美站在1楼</span></div>
<div class="timeline-item"><span class="timeline-time">[00:16]</span><span class="timeline-text">这盏灯几乎对小美起不到半点照明作用</span></div>
<div class="timeline-item"><span class="timeline-time">[00:19]</span><span class="timeline-text">但如果把光源换成太阳</span></div>
