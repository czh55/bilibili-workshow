      <div class="container root-wrap">
  <h1>公司里事情推不动？把「我的事」变成「我们的事」</h1>
  <div class="meta"><span class="tag tag-blue">职场</span><span class="tag tag-green">KPI</span><span class="tag tag-orange">协作</span><span class="tag tag-purple">管理</span><span class="tag tag-gray">时长 1分32秒</span><span class="tag tag-gray">分析视角：跨部门推不动任务的三个解法拆解</span></div>
  <a class="source-link" href="local:01e511685a14650a010371038af31cf69c_4610.mp4video.MP4">原视频（本地文件）</a>
  <div class="summary-line">核心判断：事情推不动，根因是「跟KPI没关系」——没有利益绑定，没人有义务配合你。解法不是求人，而是把「我的事」变成「我们的事」（利益挂钩或风险绑定）、提前经营人情（让人欠你人情）、把任务拆解到实习生都能做的程度。三点做到，二八法则里的大部分问题就解决了；只选一条，选利益挂钩。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">为什么公司里事情总推不动</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">推不动的事，大概率跟KPI没关系</span></div><div class="timeline-item"><span class="timeline-time">00:12</span><span class="timeline-text">挂上KPI，不用你推，大家自己卷自己</span></div><div class="timeline-item"><span class="timeline-time">00:22</span><span class="timeline-text">大家心里：办你的事就没时间办自己的事</span></div><div class="timeline-item"><span class="timeline-time">00:31</span><span class="timeline-text">解法一：没有人有义务配合你</span></div><div class="timeline-item"><span class="timeline-time">00:40</span><span class="timeline-text">把「我的事」变成「我们的事」：挂钩利益或造成风险</span></div><div class="timeline-item"><span class="timeline-time">00:48</span><span class="timeline-text">解法二：提前清理人脉，让人欠你人情</span></div><div class="timeline-item"><span class="timeline-time">01:00</span><span class="timeline-text">解法三：拆解任务，拆到实习生都能做</span></div><div class="timeline-item"><span class="timeline-time">01:11</span><span class="timeline-text">三点都做到，二八法则大部分搞定</span></div><div class="timeline-item"><span class="timeline-time">01:25</span><span class="timeline-text">只能选一条？我选利益挂钩</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">现象<br/>事情推不动，每天工作压抑沮丧</div><span class="arrow">→</span><div class="node-green">拆穿<br/>推不动的事都不挂KPI，凭什么配合你</div><span class="arrow">→</span><div class="node-orange">真相<br/>把「我的事」变成「我们的事」</div><span class="arrow">→</span><div class="node-blue">行动<br/>利益挂钩/欠人情/拆解任务</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解1：配合是同事的义务。纠偏：没人有义务配合你，除非挂钩他的利益或造成他的风险。</p><p>误解2：有需要时再找人帮忙就行。纠偏：临时抱佛脚不管用，要平时经营人情，让别人欠你。</p><p>误解3：任务推不动就多催几次。纠偏：要当项目经理把任务拆解到傻瓜级，降低对方执行的启动成本。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>根源：推不动的事都不挂KPI</h3>
      <p>在讲什么：推不下去的事大概率跟KPI没关系；挂上KPI，大家会自己卷自己。关键理解：对方的利益结构决定他是否配合。怎么用：动手前先检查这件事跟对方KPI的关联。</p>
      <div class="quote">依据 [00:06-00:22]：推不下去的事，大概率都跟KPI没有关系。如果跟KPI挂钩起来，不用你推，大家都会自己卷自己。</div>
      <div class="relation">立场分层：「不挂KPI」是根因；「自己卷自己」是行为后果。</div>
    </div>
    <div class="card card-orange">
      <h3>解法一：把「我的事」变成「我们的事」</h3>
      <p>在讲什么：没有人有义务配合你，要么挂钩他的利益，要么给他造成风险，二选一。关键理解：推动力的本质是利益绑定，而不是道理和人情临时凑。怎么用：提前把对方利益设计进你的任务目标。</p>
      <div class="quote">依据 [00:31-00:48]：除非把我的事变成我们的事，要么挂钩他的利益，要么给他造成风险，请你二选一。</div>
      <div class="relation">立场分层：「利益/风险」是双杠杆；「二选一」是决策框架。</div>
    </div>
    <div class="card card-purple">
      <h3>解法二、三：人情账户与傻瓜级拆解</h3>
      <p>在讲什么：平时请人喝酱香拿铁、混个脸熟，让人欠你人情；把没人做过的探索性任务拆解到实习生都能做的程度。关键理解：对方不干是因为启动成本高，拆解就是降低启动成本。怎么用：提前存人情，任务先拆成SOP化的最小步骤。</p>
      <div class="quote">依据 [00:48-01:10]：临时抱佛脚在公司里是不管用的，你得提前清理好你的人脉关系网络……把任务拆解到实习生都能做的傻瓜程度，然后再交给他们。</div>
      <div class="relation">立场分层：「人情积累」与「任务拆解」分别解决意愿与能力问题。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">推不动任务的三个解法对照</h2><div class="card"><table><thead><tr><th>解法</th><th>解决什么问题</th><th>具体动作</th></tr></thead><tbody><tr><td>利益挂钩/风险绑定</td><td>对方没有配合动机</td><td>把任务设计进对方的利益或风险</td></tr><tr><td>经营人情</td><td>临时求人没人理</td><td>平时请客混脸熟，让人欠你人情</td></tr><tr><td>拆解任务</td><td>探索性任务没人敢接</td><td>拆到实习生都能做的SOP级步骤</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>适用：跨部门、跨岗位的横向协作推动场景。</li><li>上限：涉及老板明确否决的事，推动技巧无效。</li><li>反例：人情和利益都不能用于要对方做违规的事。</li><li>例外：对方也有同等资源时，要准备利益交换而非单向设计。</li></ul><div class="pitfall">避坑：利益挂钩要双方都赢，单方设计会被识破并反噬。</div><div class="pitfall">避坑：人情账户需要长期维护，临时请客只会显得功利。</div><div class="pitfall">避坑：拆解任务不等于替对方干活，要保留责任与边界。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>推不动的事，大概率都跟KPI没关系。</li><li>没有人有义务配合你：把「我的事」变成「我们的事」。</li><li>三个解法：利益挂钩、欠人情、拆解任务。</li></ul><h3>行动清单</h3><ol><li>接任务前先盘点：这件事和对方KPI挂钩吗？</li><li>本月请一位协作同事喝咖啡，经营人情账户。</li><li>把最难的任务拆成3个实习生能执行的步骤再发出去。</li></ol><h3>关键认知转变</h3><p>从「求别人配合」转到「设计对方配合的理由」：利益、人情、可执行性三条杠杆，才是真正的推动力。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 1分32秒</div>
</div>
