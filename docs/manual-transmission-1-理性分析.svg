      <div class="container">
<h1>硬核拆解，科普手动变速箱原理[上集]</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-green">手动变速箱</span> <span class="tag tag-green">MT</span> <span class="tag tag-green">同步器</span> <span class="tag tag-green">齿轮</span> <span class="tag tag-gray">14:57</span></div>
<div class="summary-line">手动变速箱（上集）以本田思域6MT为实物，从齿比概念、输入/输出轴布局、结合套与同步器的工作方式，拆解手动变速箱的核心传动原理。</div>

<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">实物：2018年本田思域Si六速手动变速箱，剖切壳体展示</span></div>
<div class="timeline-item"><span class="timeline-time">02:59</span><span class="timeline-text">齿比概念：低挡位=降速增扭（起步），高挡位=增速减扭（巡航）</span></div>
<div class="timeline-item"><span class="timeline-time">05:58</span><span class="timeline-text">超车降挡：降挡获得更大扭矩快速提速</span></div>
<div class="timeline-item"><span class="timeline-time">08:58</span><span class="timeline-text">齿轮与轴的布局：输入轴/输出轴上的齿轮对，空转与锁定</span></div>
<div class="timeline-item"><span class="timeline-time">11:57</span><span class="timeline-text">转速匹配问题：不同齿轮空转速度不同→需要同步器</span></div></div>

<div class="map"><h2>核心脉络图</h2><div class="diagram"><div class="node node">发动机<br/><small>动力源</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node">离合器<br/><small>连接/断开动力</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node-green">输入轴<br/><small>不同齿轮对=不同齿比</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node-green">输出轴<br/><small>连接到车轮</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node-orange">同步器<br/><small>转速匹配/平顺换挡</small></div></div></div>

<div class="section">
  <div class="sec-title">观点卡片</div>
  <div class="card "><h3>手动变速箱的核心：齿比与同步</h3>
<p><strong>齿比=输入齿轮齿数÷输出齿轮齿数。</strong>齿比>1=减速增扭（起步爬坡有力），齿比<1=超速挡（高速巡航省油）。</p><p><strong>同步器的必要性：</strong>不同挡位的齿轮在空转时转速不同，如果强行挂挡会产生打齿。同步器通过摩擦锥面先让齿轮转速匹配，再让结合套啮合。</p><div class="highlight">关键理解：变速箱不改变发动机功率，它改变的是转速和扭矩的配比——用转速换扭矩（低挡），或用扭矩换转速（高挡）。</div>
<div class="action">掌握齿比概念后能更好理解"降挡超车"的原理。</div>
<div class="quote">"这是一台2018年本田思域Si的六速手动变速箱，今天我会剖切它的壳体，展示它换挡时内部的样子。"</div></div>
</div>

<div class="section"><div class="sec-title">横向对比表</div><table><tr><th>本田思域Si 6MT齿比</th><th>齿比</th><th>作用</th></tr>
<tr><td>1挡</td><td>3.63</td><td>起步/爬坡（最大扭矩放大）</td></tr>
<tr><td>2挡</td><td>2.08</td><td>低速加速</td></tr>
<tr><td>3挡</td><td>1.36</td><td>中速巡航</td></tr>
<tr><td>4挡</td><td>1.03</td><td>直接驱动（约1:1）</td></tr>
<tr><td>5挡</td><td>0.77</td><td>高速巡航（超速挡）</td></tr>
<tr><td>6挡</td><td>0.65</td><td>极速巡航（最大超速）</td></tr>
<tr><td>尾牙</td><td>4.105</td><td>最终减速（所有挡位均经尾牙再到车轮）</td></tr></table></div>

<div class="section">
  <div class="sec-title">行动清单</div>
  <div class="card card-green"><ol><li>了解自己车辆的齿比分布理解换挡逻辑</li>
<li>降挡超车利用更大扭矩快速完成超车</li>
<li>学习跟趾动作利用同步器原理</li>
<li>定期更换变速箱油延长寿命</li></ol></div>
</div>

<div class="section">
  <div class="sec-title">避坑总结</div>
  <div class="card card-red"><ol><li>强行挂挡不踩离合=打齿损坏</li>
<li>高挡位低转速拖挡行驶（积碳+无力）</li>
<li>忽视离合器磨损（起步抖动/打滑）</li>
<li>无视同步器磨损（挂挡异响/卡顿）</li></ol></div>
</div>

<div class="section">
  <div class="sec-title">方法边界</div>
  <div class="boundary">本集为上集，介绍齿比、布局和同步器原理。下集将展示拨叉机构、换挡杆机械联动、尾牙（主减速器）以及改装尾牙对加速和极速的影响。</div>
</div>


    <div class="section">
      <div class="sec-title">立场分层</div>
      <div class="card card-green"><h3>可验证事实</h3><ul><li>齿比=输入齿轮齿数÷输出齿轮齿数</li><li>同步器通过摩擦锥面匹配转速</li><li>思域Si 1挡齿比3.63，尾牙4.105</li></ul></div>
      <div class="card card-orange"><h3>UP主观点</h3><ul><li>UP主认为剖切实物变速箱是最好教学方式</li></ul></div>
      <div class="card card-purple"><h3>基于原文的推断</h3><ul><li>理解齿比和尾牙是理解车辆加速性和经济性的基础</li></ul></div>
    </div>

<div class="conclusion">
  <h2>一句话总结</h2>
  <p>手动变速箱（上集）以本田思域6MT为实物，从齿比概念、输入/输出轴布局、结合套与同步器的工作方式，拆解手动变速箱的核心传动原理。</p>
