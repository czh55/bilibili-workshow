      <div class="container root-wrap">
  <h1>浓缩≠只有 Espresso：三种萃取对照</h1>
  <div class="meta"><span class="tag tag-blue">咖啡</span><span class="tag tag-green">浓缩</span><span class="tag tag-orange">Espresso</span><span class="tag tag-purple">Ristretto</span><span class="tag tag-red">Lungo</span><span class="tag tag-gray">时长 50秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/32Grn8RIzTy">原视频</a>
  <div class="summary-line">同 18g 粉、不同萃取时间与液重，得到 Espresso / Ristretto / Lungo 三种浓缩；大众只熟悉 Espresso，是因为店内多拿它做基底，不等于浓缩只有这一种。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">立题：espresso 叫浓缩「对但不完全对」</span></div><div class="timeline-item"><span class="timeline-time">00:10</span><span class="timeline-text">统一 18g 粉，给出三组时间与液重</span></div><div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">Espresso：22–35s → 36g</span></div><div class="timeline-item"><span class="timeline-time">00:17</span><span class="timeline-text">Ristretto：15–18s → 18g</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">Lungo：45–60s → 54g</span></div><div class="timeline-item"><span class="timeline-time">00:31</span><span class="timeline-text">店内多用 espresso 作基底，故大众只知它</span></div><div class="timeline-item"><span class="timeline-time">00:42</span><span class="timeline-text">比喻：泰迪是狗 ≠ 所有狗都叫泰迪</span></div></div>
  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">同粉量 18g<br/>控制变量</div><span class="arrow">→</span><div class="node-green">改时间/液重<br/>得到三种浓缩</div><span class="arrow">→</span><div class="node-orange">Espresso 最常见<br/>因作基底</div><span class="arrow">→</span><div class="node-red">概念边界<br/>浓缩 ⊃ Espresso</div></div></div>
  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解：听到 espresso 就等于「浓缩咖啡」的全部。纠偏：它是浓缩家族里的一种配方参数。</p><p>误解：液重更大就一定「更浓」。纠偏：Lungo 时间更长、液重更大，口感往往更苦、风味更淡（屏幕标注）。</p><p>ASR 纠偏：Rosgretto→Ristretto，Lango→Lungo。</p></div>
  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2><div class="card card-green"><h3>控制变量：同粉量才谈「种类」</h3><p>视频反复强调「相同重量的咖啡粉」。种类差异来自萃取时间与目标液重，而不是再换一包豆子。</p><div class="quote">「相同重量的咖啡粉，不同时间萃取不同重量的咖啡液，我们得到不同的三份都是浓缩咖啡」[00:22–00:29]</div></div><div class="card "><h3>三组可记参数</h3><p>Espresso≈22–35s/36g；Ristretto≈15–18s/18g；Lungo≈45–60s/54g。屏幕另给比例、咖啡因与适用饮品，可当作入门对照表。</p><div class="quote">「22–35秒萃取36克……15–18秒……45–60秒萃取54克」[00:12–00:22]</div><div class="action">练习时先锁粉量，只改停表液重，对比一口酸苦与厚度。</div></div><div class="card card-orange"><h3>为何你只听过 Espresso</h3><p>不是市场只有一种浓缩，而是门店出品链默认用它打奶咖基底，曝光最高。</p><div class="quote">「一般咖啡馆都是 espresso 作为咖啡基底来使用，所以大部分人只了解到 espresso 的存在而已」[00:31–00:37]</div><div class="pitfall">别把「常见」当成「唯一合法定义」。</div></div></div>
  <div class="section"><h2 class="sec-title">三种浓缩（视频给定粉量下）</h2><div class="card"><table><thead><tr><th>类型</th><th>时间</th><th>液重</th><th>一句话</th></tr></thead><tbody><tr><td>Espresso</td><td>22–35s</td><td>≈36g</td><td>最常见基底</td></tr><tr><td>Ristretto</td><td>15–18s</td><td>≈18g</td><td>更短更少液</td></tr><tr><td>Lungo</td><td>45–60s</td><td>≈54g</td><td>更长更多液</td></tr></tbody></table></div></div>
  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>参数是教学示意，不同机型/研磨/粉碗会偏移，需按实际校准。</li><li>「浓缩家族」此处按意式高压萃取讨论，不含手冲浓郁感。</li></ul><div class="pitfall">只背名字不锁粉量，对比无效。</div><div class="pitfall">把 Lungo 当「更浓」点单，可能得到更稀更苦的一杯。</div></div></div>
  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>Espresso ⊂ 浓缩，不是全等。</li><li>同粉量下，时间与液重决定种类与口感。</li><li>门店习惯解释「知名度」，不解释「定义边界」。</li></ul><h3>行动清单</h3><ol><li>用同一粉量拉三杯，只改目标液重，盲品记录。</li><li>点单时问清「Ristretto / Espresso / Lungo」或比例，而不是只说「来杯浓缩」。</li></ol><h3>关键认知转变</h3><p>从「名字=品类」转向「粉量固定下的时间–液重配方族」。</p></div>
  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 50秒</div>
</div>
