<div class="conclusion"><h2>总结</h2><p>推不是用手推而是用我們的身體帶動我們的手去推拉不是用手拉而是用我們的腿去拉搖不是用手搖而是轉動我們的腰部左右橫搖椅不是這樣椅不是用我們的手臂去移而是控制好我們的身體左右水平橫移擴上下垂直移動</p><p>转录分段: 11 | 时长: 26秒</p></div>
