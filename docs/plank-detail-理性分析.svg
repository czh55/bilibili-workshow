.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style><div class="container">
<h1>平板支撑细节｜如何避免腰酸，让腹发力</h1>
<div class="meta">
<span class="tag tag-blue">平板支撑</span><span class="tag tag-green">核心发力</span><span class="tag tag-orange">细节纠正</span><span class="tag tag-gray">0:24</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>平板支撑避免腰酸、让腹发力的<strong>5个细节</strong>：①手掌<strong>不是抱拳</strong>，掌心向下与<strong>肩同宽</strong>；②肩胛骨<strong>不是夹着</strong>，向<strong>两侧撑开</strong>；③头<strong>不要后仰</strong>，保持<strong>颈部中立</strong>；④腰<strong>不是向下塌</strong>，<strong>腹收紧略微向上拱</strong>；⑤双脚<strong>不是并一起</strong>，打开与<strong>髋同宽</strong>。掌握细节，才能<strong>发力在腹上</strong>。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">这是腰发力的平板支撑</span></div><div class="timeline-item"><span class="timeline-time">00:01</span><span class="timeline-text">这是腹发力的平板支撑</span></div><div class="timeline-item"><span class="timeline-time">00:03</span><span class="timeline-text">正确做法看好了</span></div><div class="timeline-item"><span class="timeline-time">00:05</span><span class="timeline-text">手掌不是抱拳，掌心向下与肩同宽</span></div><div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">肩胛骨不是夹着，要向两侧撑开</span></div><div class="timeline-item"><span class="timeline-time">00:11</span><span class="timeline-text">头不要后仰，保持颈部中立</span></div><div class="timeline-item"><span class="timeline-time">00:14</span><span class="timeline-text">腰不是向下塌，要腹收紧略微向上拱</span></div><div class="timeline-item"><span class="timeline-time">00:17</span><span class="timeline-text">双脚不是并一起，而是打开与髋同宽</span></div><div class="timeline-item"><span class="timeline-time">00:21</span><span class="timeline-text">掌握以上细节，才能发力在腹上</span></div></div>
<div class='section'><div class='sec-title'>腰发力 vs 腹发力</div><div class='diagram'><div class='node node-red'>腰发力<br/><small>塌腰、夹肩、抱拳</small></div><span class='arrow'>→</span><div class='node node-green'>腹发力<br/><small>撑肩、拱腰、收腹</small></div></div></div><div class='section'><div class='sec-title'>5 个细节对照</div><table><tr><th>部位</th><th>错误</th><th>正确</th></tr><tr><td><strong>手掌</strong></td><td>抱拳</td><td>掌心向下，与肩同宽</td></tr><tr><td><strong>肩胛骨</strong></td><td>夹着</td><td>向两侧撑开</td></tr><tr><td><strong>头颈</strong></td><td>后仰</td><td>颈部中立</td></tr><tr><td><strong>腰腹</strong></td><td>向下塌</td><td>腹收紧，略微向上拱</td></tr><tr><td><strong>双脚</strong></td><td>并一起</td><td>打开，与髋同宽</td></tr></table></div>
<div class="conclusion">
<h2>平板支撑自查清单</h2>
<h3>5 个细节</h3><ol><li><strong>手掌</strong>：掌心向下、与肩同宽，不抱拳</li><li><strong>肩胛骨</strong>：向两侧撑开，不夹着</li><li><strong>头颈</strong>：颈部中立，头不后仰</li><li><strong>腰腹</strong>：腹收紧、腰略微向上拱，不塌腰</li><li><strong>双脚</strong>：打开与髋同宽，不并一起</li></ol><h3>判断标准</h3><ul><li>腰酸 = 腰在发力，姿势错了</li><li>腹累 = 腹在发力，姿势对了</li></ul>
</div>
