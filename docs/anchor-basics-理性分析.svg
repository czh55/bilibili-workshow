.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style><div class="container">
<h1>主播基本功好，话术张口就来！</h1>
<div class="meta">
<span class="tag tag-blue">直播</span><span class="tag tag-green">话术基本功</span><span class="tag tag-orange">卖点拆解</span><span class="tag tag-gray">1:33</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>主播基本功：<strong>全世界所有产品我都能卖</strong>。秘密是问自己<strong>十遍为什么</strong>——为什么喜欢它。以完全不懂的香牌为例：讲好看→讲实用（香味）→讲材质→促单开价，并给出<strong>长版/短版</strong>两种话术，张口就来。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">秘密：全世界所有产品我都能卖</span></div><div class="timeline-item"><span class="timeline-time">00:05</span><span class="timeline-text">面对不懂的香牌：不慌，问自己十遍为什么</span></div><div class="timeline-item"><span class="timeline-time">00:24</span><span class="timeline-text">为什么1：好看，搭配衣服有调性</span></div><div class="timeline-item"><span class="timeline-time">00:44</span><span class="timeline-text">为什么2：真有香味，紧张无聊闻一闻，香气直达</span></div><div class="timeline-item"><span class="timeline-time">01:01</span><span class="timeline-text">为什么3：材质（沉香、檀香等三种香汇成）+雕刻漂亮</span></div><div class="timeline-item"><span class="timeline-time">01:08</span><span class="timeline-text">促单：喜欢打1、当地开价、拿5块出来不卖（稀缺）</span></div><div class="timeline-item"><span class="timeline-time">01:16</span><span class="timeline-text">长版短版切换：讲产品可以长可以短，这就是基本功</span></div></div>
<div class='section'><div class='sec-title'>万能卖货框架</div><div class='diagram'><div class='node'>问自己十遍为什么<br/><small>为什么喜欢它</small></div><span class='arrow'>→</span><div class='node node-green'>讲好看<br/><small>搭配/调性</small></div><span class='arrow'>→</span><div class='node node-orange'>讲实用<br/><small>真功能/真感受</small></div><span class='arrow'>→</span><div class='node node-purple'>讲材质/工艺</div><span class='arrow'>→</span><div class='node node-red'>促单开价</div></div></div><div class='section'><div class='sec-title'>香牌案例拆解</div><div class='card'><h3>1. 好看</h3><p>项链肯定得好看，不好看我不会戴。拿到手上那一刻就想戴上去了，穿很多衣服都搭。<strong>普通衣服搭上香牌就变得很有调性，西装也更有调性了。</strong></p></div><div class='card card-green' style='margin:12px 0'><h3>2. 实用：真有香味</h3><p>重点不是好看，是它<strong>真的有香味</strong>。紧张的时候拿起来闻一闻、滑口（嗓子卡壳）的时候闻一闻、无聊的时候闻一闻，香味直达、通体舒畅。</p></div><div class='card card-orange' style='margin:12px 0'><h3>3. 材质+工艺</h3><p>由<strong>沉香、檀香、麝香、降真香</strong>三种香汇成的一种香，雕刻很漂亮。就算不专业也能讲：“反正我听说它很厉害。”</p></div><div class='card card-purple'><h3>4. 促单</h3><p><strong>喜欢打个1</strong>，当地给你开了，拿5块出来，5块不卖——制造稀缺与互动钩子。</p></div></div><div class='section'><div class='sec-title'>长版 vs 短版</div><table><tr><th>版本</th><th>话术</th><th>适用</th></tr><tr><td><strong>长版</strong></td><td>好看→调性→香味→材质→促单，讲透</td><td>重点产品、客单高</td></tr><tr><td><strong>短版</strong></td><td>“这条漂亮吧？香料香牌不卖啊，当地给，要的打1”</td><td>过款快、顺带卖</td></tr></table></div>
<div class="conclusion">
<h2>话术基本功清单</h2>
<h3>拿到任何产品</h3><ol><li><strong>问自己十遍为什么</strong>：为什么我喜欢它</li><li>从回答里抽三个卖点：<strong>好看、实用、材质/工艺</strong></li><li>配上<strong>促单钩子</strong>：打1、开价、稀缺限量</li></ol><h3>万能公式</h3><ul><li>不问“这是什么”，只问“为什么我喜欢它”</li><li>不懂专业名词就说“反正我听说它很厉害”</li><li>同一套内容，准备<strong>长版和短版</strong>两种讲法</li></ul>
</div>
