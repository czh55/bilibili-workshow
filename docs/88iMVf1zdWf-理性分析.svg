<div class="timeline-item"><span class="timeline-time">[00:15]</span><span class="timeline-text">于是呢 我又入手了他的升级版本全新的The One and Only DJI Action 5 Pr</span></div>
<div class="timeline-item"><span class="timeline-time">[00:25]</span><span class="timeline-text">今天我就来给大家分享下如何用 DJI Action 5拍摄Vlog 以及拥有更好的电影感</span></div>
<div class="timeline-item"><span class="timeline-time">[00:33]</span><span class="timeline-text">作为一个运动相机说了防水防水 咔咔扛噪以外 action fire 还有另外一个特点那就是小</span></div>
<div class="timeline-item"><span class="timeline-time">[00:41]</span><span class="timeline-text">既于这个特点我们可以把相机不是在有很多有创意的地方带来更有感官刺激的视觉冲击</span></div>
