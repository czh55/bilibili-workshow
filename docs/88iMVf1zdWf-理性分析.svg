<div class="timeline-item"><span class="timeline-time">[00:53]</span><span class="timeline-text">他的遇寒能力是非常出众的</span></div>
<div class="timeline-item"><span class="timeline-time">[00:55]</span><span class="timeline-text">所以我在想是不是也可以把它放在煎鸡蛋的锅里面</span></div>
<div class="timeline-item"><span class="timeline-time">[00:59]</span><span class="timeline-text">不惹到他抵抗高温的能力到底如何</span></div>
<div class="timeline-item"><span class="timeline-time">[01:05]</span><span class="timeline-text">那有了这些想法在脑袋里 我们今天大概要拍摄的就是Kafuka 早期准备早餐的一个小故事</span></div>
<div class="timeline-item"><span class="timeline-time">[01:13]</span><span class="timeline-text">那先来一个经典的冰箱视觉 这个人人都会的拍摄技巧 it is boring</span></div>
<div class="timeline-item"><span class="timeline-time">[01:18]</span><span class="timeline-text">那怎么样才能拍得与众不同呢 毕竟就是双面胶</span></div>
<div class="timeline-item"><span class="timeline-time">[01:22]</span><span class="timeline-text">只要用双面胶把action固定在想要拍摄的物体上面</span></div>
<div class="timeline-item"><span class="timeline-time">[01:26]</span><span class="timeline-text">我们就可以获得更加真实并且是动态的物体视觉喽</span></div>
<div class="timeline-item"><span class="timeline-time">[01:37]</span><span class="timeline-text">The same method we could also apply to the coffee </span></div>
