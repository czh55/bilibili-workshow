      <div class="container root-wrap">
  <h1>达芬奇想要让提亮不发灰，有四个小技巧</h1>
  <div class="meta"><span class="tag tag-blue">达芬奇</span><span class="tag tag-green">提亮</span><span class="tag tag-orange">发灰</span><span class="tag tag-purple">中灰</span><span class="tag tag-red">六相切片</span><span class="tag tag-gray">时长 7分04秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/8GyVGz6dWs6">原视频</a>
  <div class="summary-line">暗面一提就发灰，因最暗被抬丢失黑位。四技巧：先增中灰反差再阴影提+高光护天；曲线中提高压并锁 Shadow；亮画面局部找暗；颜色增艳+六相降密度提肤。目标是中灰上移、高低两端少动。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">问题：暗面提亮发灰；还原留暗部空间</span></div><div class="timeline-item"><span class="timeline-time">00:37</span><span class="timeline-text">技巧1：先增反差，再阴影提+高光压</span></div><div class="timeline-item"><span class="timeline-time">02:41</span><span class="timeline-text">技巧2：曲线中提高压 + Shadow 去灰</span></div><div class="timeline-item"><span class="timeline-time">03:45</span><span class="timeline-text">亮掉要找暗：人物/滑板加对比</span></div><div class="timeline-item"><span class="timeline-time">04:35</span><span class="timeline-text">技巧3–4：青橙增色；六相提肤</span></div><div class="timeline-item"><span class="timeline-time">05:44</span><span class="timeline-text">四阶段总结：可按需选用</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">病因<br/>最暗被抬 → 丢黑位</div><span class="arrow">→</span><div class="node-green">锁两端<br/>中灰提、高低少动</div><span class="arrow">→</span><div class="node-orange">找暗<br/>局部加对比</div><span class="arrow">→</span><div class="node-blue">助攻<br/>颜色鲜艳 + 提肤</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「发挥」校正为「发灰」；「波星图/拨信图」校正为「波形图」；「中晖/中会」校正为「中灰」；「一级教室轮」校正为「一级校色轮」；「亮掉」校正为「亮调」；「早暗」校正为「找暗」；「体谅」校正为「提亮」；「色能/色轮流扇」校正为「色轮六相」；「Android Out加P」校正为「Alt+P / Option+P」。</p><p>误区：提亮＝阴影滑块一把拉。易天空过曝且暗部发灰。</p><p>误区：提亮后画面只剩亮。必须局部找暗。</p><p>误区：高亮场景把颜色降得很寡。适当鲜艳反而减发灰感。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>发灰机制：最暗一起被抬</h3>
      <p>提亮本质降反差。还原暗部留空间（主内容约 10% 附近），给组合操作留余地。</p>
      <div class="quote">提亮暗部发灰，是因为最暗的区域也一起被提亮了，从而失去了它合适的黑位</div>
      <div class="relation">先理解机制再选技巧。</div>
    </div>
    <div class="card card-orange">
      <h3>技巧1：先增反差再降反差提中灰</h3>
      <p>降 Shadow/Light 并抬 Highlight 让脸更立体；再阴影滑块提、高光滑块护天。两节点组合：中灰上移，两端少动。</p>
      <div class="quote">你会发现暗部和高光部分几乎没有受到太多的影响，但是中间调部分它有明显的往上提</div>
      <div class="relation">开关对比看立体感是否回来。</div>
    </div>
    <div class="card card-green">
      <h3>技巧2：曲线中提 + 锁 Shadow</h3>
      <p>中间上提、高光端下降；发灰就降 Shadow（或暗端右移）。波形变化与技巧1同类。</p>
      <div class="quote">要提亮中灰部分不让你画面发灰，就是要保证你的暗部不会受它的影响</div>
      <div class="relation">习惯曲线的人可主用此路。</div>
    </div>
    <div class="card card-purple">
      <h3>亮调要找暗</h3>
      <p>人物与滑板局部加对比，避免亮完没层次。颜色青橙增艳也能丰富层次。</p>
      <div class="quote">所以我们亮调画面要去找暗</div>
      <div class="relation">提亮完成不等于层次完成。</div>
    </div>
    <div class="card card-red">
      <h3>六相降密度＝小幅提肤</h3>
      <p>皮肤切片降密度提明度，饱和略增再手降一点。四技巧可单用可全上。</p>
      <div class="quote">降低密度是会在提高明度的同时，小幅增加饱和度</div>
      <div class="relation">提肤放在影调稳定之后。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>背光人像+亮天空个案，光比极端时需更多遮罩。</li><li>「约 10%」为口令示意，非绝对波形标准。</li><li>课程引流从略。</li></ul><div class="pitfall">还原暗部拉死，后面无空间。</div><div class="pitfall">只开阴影提亮节点，不先做增反差。</div><div class="pitfall">曲线中提却不锁高光/Shadow。</div><div class="pitfall">提亮后不找暗，画面发飘。</div><div class="pitfall">高亮场景颜色过寡，更容易显灰。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>发灰＝黑位被抬走</li><li>中灰提、高低两端少动</li><li>亮调局部找暗</li><li>颜色与六相提肤助攻</li></ul><h3>行动清单</h3><ol><li>还原暗部留空间再动手</li><li>提亮前先问：中灰反差够不够</li><li>两节点开关看波形是否只动中段</li><li>亮了就给主体加一点对比</li></ol><h3>关键认知转变</h3><p>以前：暗面一提就灰、只会猛拉阴影；现在：先锁两端再提中灰，亮了还找暗。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 7分04秒</div>
</div>
    </div>
  </foreignObject>
</svg>