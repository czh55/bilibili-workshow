<div class="card"><h3>内容要点</h3><ul><li>The moment you start your speech, you&#x27;ve got this</li>
<li>Your listeners, full attention</li>
<li>Hi, my name is Philip</li>
<li>Hmm, losing some</li>
<li>Thanks for being here today</li>
<li>Today I want to talk about X, Y and Z</li>
<li>And it&#x27;s gone</li>
<li>You just lost them</li>
<li>Most presenters lose their audience in the first 10 seconds</li>
<li>Now why?</li>
<li>Because they play it safe</li>
<li>They start with their name, their title and some boring context</li>
<li>Don&#x27;t do that</li>
<li>Say something that they didn&#x27;t expect</li>
<li>Something that they didn&#x27;t see coming</li>
<li>Here are five simple techniques you can do to start your speech like a pro</li>
<li>First technique, surprising statement</li>
<li>The average person will eat around 70 insects while sleeping</li>
<li>Today, ladies and gentlemen, you&#x27;ll learn how to keep your home insect-free</li>
<li>That one is powerful, but most people, they just rush through</li>
<li>They drop the number of facts</li>
<li>And before the audience can even process it</li>
<li>They&#x27;re already on to the next point</li>
<li>Don&#x27;t do that</li>
<li>Take your time</li>
<li>So instead, say your number of facts</li>
<li>Then stop talking for like two seconds</li>
<li>And then say the full sentence again with that number</li>
<li>That pause will help that your listeners can really process it and take it in</li>
<li>Second technique, show of hands</li>
<li>Quick show of hands</li>
<li>Who here likes pineapple on pizzas?</li>
<li>Who thinks that it&#x27;s a crime against humanity?</li>
<li>All right</li>
<li>And who here has no clue what I&#x27;m talking about</li>
<li>Show of hands questions are super common</li>
<li>But here&#x27;s the frustrating part</li>
<li>A lot of speakers just ignore the responses and just rush through</li>
<li>That makes people think</li>
<li>So instead, once you&#x27;ve asked that question, we&#x27;ll pause and look around</li>
<li>Acknowledge the answers</li>
</ul></div>
