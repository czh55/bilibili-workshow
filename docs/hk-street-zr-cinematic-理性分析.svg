.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>港风 ZR 扫街电影感</h1>
  <div class="meta"><span class="tag tag-blue">香港</span><span class="tag tag-green">尼康ZR</span><span class="tag tag-orange">扫街</span><span class="tag tag-purple">电影感</span><span class="tag tag-red">第一视角</span><span class="tag tag-gray">时长 13分07秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://b23.tv/5wyboFM">原视频</a>
  <div class="summary-line">电影感来自光与层次控制（窄光、前景栏杆、长焦纵深、夜景慢门）加上机内速度（触屏 A 档、自动 ISO、自定义三键）与低饱和滤镜；双镜内变焦覆盖街巷到压缩。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">ZR到香港</span></div><div class="timeline-item"><span class="timeline-time">00:51</span><span class="timeline-text">窄光壁画</span></div><div class="timeline-item"><span class="timeline-time">01:57</span><span class="timeline-text">栏杆前景</span></div><div class="timeline-item"><span class="timeline-time">03:04</span><span class="timeline-text">红光市井</span></div><div class="timeline-item"><span class="timeline-time">03:16</span><span class="timeline-text">触屏A档</span></div><div class="timeline-item"><span class="timeline-time">04:00</span><span class="timeline-text">猫与鸟</span></div><div class="timeline-item"><span class="timeline-time">04:32</span><span class="timeline-text">自动ISO</span></div><div class="timeline-item"><span class="timeline-time">04:49</span><span class="timeline-text">暴雨</span></div><div class="timeline-item"><span class="timeline-time">05:44</span><span class="timeline-text">长焦压缩</span></div><div class="timeline-item"><span class="timeline-time">07:06</span><span class="timeline-text">对焦抓拍</span></div><div class="timeline-item"><span class="timeline-time">08:14</span><span class="timeline-text">窗位纵深</span></div><div class="timeline-item"><span class="timeline-time">09:13</span><span class="timeline-text">快捷键</span></div><div class="timeline-item"><span class="timeline-time">11:11</span><span class="timeline-text">夜景防抖</span></div><div class="timeline-item"><span class="timeline-time">11:35</span><span class="timeline-text">RAID滤镜</span></div><div class="timeline-item"><span class="timeline-time">12:47</span><span class="timeline-text">总结</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">找光找前景<br/>层次</div><span class="arrow">→</span><div class="node-green">触屏与自动ISO<br/>速度</div><span class="arrow">→</span><div class="node-orange">自定义三键<br/>肌肉记忆</div><span class="arrow">→</span><div class="node-blue">滤镜与双镜<br/>成片风格</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「泽雅／吸引盘」→「ZR／西营盘」。</p><p>ASR「伏点收音」→「浮点收音」。</p><p>画面参数条机身信息以图为准，口播产品名为 ZR。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>窄光＋前景</h3>
      <p>硬窄光等行人；栏杆前景时收光圈保住层次，避免前景被虚没。</p>
      <div class="quote">这种拥挤的感觉就出来了</div>
      <div class="relation">电影感先来自空间层次。</div>
    </div>
    <div class="card card-orange">
      <h3>机内速度</h3>
      <p>触屏整档调光圈；自动 ISO 一键应对变光；暴雨证明街道不可控。</p>
      <div class="quote">可以直接通过触屏去调整参数</div>
      <div class="relation">操作延迟会丢掉瞬间。</div>
    </div>
    <div class="card card-purple">
      <h3>三键肌肉记忆</h3>
      <p>前拨轮光圈、正面键 ISO、1 号键曝光补偿，把高频调整放到手指。</p>
      <div class="quote">这几个按键我觉得使用频率还是挺高的</div>
      <div class="relation">自定义服务扫街节奏。</div>
    </div>
    <div class="card card-red">
      <h3>夜景与滤镜</h3>
      <p>防抖支撑低速光轨；RAID 低饱和柔和易「假电影」，需有光影内容托底。</p>
      <div class="quote">让街头影像充满了电影的氛围</div>
      <div class="relation">滤镜是收束不是万能。</div>
    </div>
    <div class="card ">
      <h3>一机两用</h3>
      <p>强调拍照对焦同样亮眼；视频规格作能力背书，结论是专业与新手两端可及。</p>
      <div class="quote">既能满足专业需求，又能让新手快乐创作</div>
      <div class="relation">旅行器材要覆盖动静。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>个人键位习惯，不代表官方默认。</li><li>RAID 为口播滤镜名，具体预设以机内菜单为准。</li><li>未做画质实验室测试，观感来自成片示例。</li></ul><div class="pitfall">只开大光圈虚化，把前景叙事元素虚没。</div><div class="pitfall">变光时仍死磕手动 ISO 错过抓拍。</div><div class="pitfall">单靠滤镜堆电影感，忽略光与纵深。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>光与前景定层次</li><li>触屏／自动ISO／三键提速</li><li>滤镜与双镜收风格</li></ul><h3>行动清单</h3><ol><li>扫街先找窄光或窗位纵深</li><li>把光圈／ISO／曝光补偿设到最顺手的键</li><li>变光练习自动 ISO 切换</li><li>夜景先试慢门再叠加低饱和</li></ol><h3>关键认知转变</h3><p>以前：电影感＝加滤镜；现在：先控制光与层次，再用机内速度与风格滤镜收束。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 13分07秒</div>
</div>
    </div>
  </foreignObject>
</svg>