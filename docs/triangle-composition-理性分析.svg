.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>三角形构图四型：正斜倒与组合</h1>
  <div class="meta"><span class="tag tag-blue">三角形</span><span class="tag tag-green">电影构图</span><span class="tag tag-orange">稳固</span><span class="tag tag-purple">压迫</span><span class="tag tag-red">嵌套</span><span class="tag tag-gray">时长 212秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/7eBRuxcuez8">原视频</a>
  <div class="summary-line">正三角可稳可权；斜三角写不稳；倒三角写压迫／失衡；多三角嵌套写复杂命运。练法是范例分析＋线索匹配主题。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:18</span><span class="timeline-text">肖申克正三角</span></div><div class="timeline-item"><span class="timeline-time">00:55</span><span class="timeline-text">权力正三角</span></div><div class="timeline-item"><span class="timeline-time">01:20</span><span class="timeline-text">斜三角不稳</span></div><div class="timeline-item"><span class="timeline-time">01:55</span><span class="timeline-text">阿凡达倒三角</span></div><div class="timeline-item"><span class="timeline-time">02:20</span><span class="timeline-text">盗梦失衡</span></div><div class="timeline-item"><span class="timeline-time">02:35</span><span class="timeline-text">山河故人多三角</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">正<br/>稳／权／向上</div><span class="arrow">→</span><div class="node-green">斜<br/>焦虑不稳</div><span class="arrow">→</span><div class="node-orange">倒<br/>压迫失衡</div><span class="arrow">→</span><div class="node-blue">多<br/>复杂语义</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>片名已校肖申克／甄嬛／盗梦等。</p><p>部分人物名 ASR 不确定，以几何类型为准。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>正三角语义</h3>
      <p>稳固底座+向上动势可表救赎；加宽底座可表权力。</p>
      <div class="quote">这来自三角形稳固的底座</div>
      <div class="relation">同形异义看语境。</div>
    </div>
    <div class="card card-orange">
      <h3>斜三角</h3>
      <p>随时坍塌的形态服务负担与边缘感。</p>
      <div class="quote">仿佛随时可能坍塌</div>
      <div class="relation">不稳定是表情。</div>
    </div>
    <div class="card card-red">
      <h3>倒三角</h3>
      <p>下指尖锐＝压迫；动态倒三角＝失衡荒诞。</p>
      <div class="quote">就像一柄悬在头顶的利剑</div>
      <div class="relation">方向性决定情绪。</div>
    </div>
    <div class="card card-purple">
      <h3>组合</h3>
      <p>嵌套多三角适合复杂命运与关系。</p>
      <div class="quote">多三角形组合更容易表现出一种微妙且复杂的视觉感受</div>
      <div class="relation">单形不够时用网络。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>练习</p>
      <div class="quote">试着去找画面那些能够构成三角形的重要线索</div>
      <div class="relation">先找线索再匹配主题。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>电影截帧教学，非摄影公式保证大片。</li><li>隐喻解读带作者主观。</li></ul><div class="pitfall">硬贴三角不管主题。</div><div class="pitfall">只知正三角不知倒／斜语义。</div><div class="pitfall">不分析范例只背名词。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>形选语义</li><li>语境决定正斜倒</li><li>线索服务主题</li></ul><h3>行动清单</h3><ol><li>暂停一部电影找一处三角并写它服务什么情绪</li><li>正三角试稳固或权力；斜／倒试焦虑或压迫</li><li>多人远景尝试嵌套多三角表达关系</li><li>先找可构三角的线索，再匹配主题，勿硬贴形状</li></ol><h3>关键认知转变</h3><p>以前：构图＝套形状；现在：形状是情绪阀门。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 212秒</div>
</div>
    </div>
  </foreignObject>
</svg>