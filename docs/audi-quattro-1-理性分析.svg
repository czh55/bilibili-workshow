      <div class="container">
<h1>奥迪Quattro四驱工作原理【上集】</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-green">奥迪</span> <span class="tag tag-green">Quattro</span> <span class="tag tag-green">四驱</span> <span class="tag tag-green">冠状齿轮</span> <span class="tag tag-gray">10:47</span></div>
<div class="summary-line">奥迪Quattro（上集）详解纵置发动机平台的自锁式冠状齿轮中央差速器：纯机械结构通过红色齿轮的特殊几何形状，在前/后轴打滑时自动将动力重新分配到有抓地力的轴。</div>

<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">Quattro是奥迪四驱商标，非特指某一种四驱形式</span></div>
<div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">奥迪有4套Quattro：纵置Quattro/QuattroUltra、横置Haldex、电动E-Quattro</span></div>
<div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">第六代Quattro核心：自锁式冠状齿轮中央差速器（取代托森）</span></div>
<div class="timeline-item"><span class="timeline-time">02:12</span><span class="timeline-text">结构：黑色外壳+4个红色小齿轮+紫色(前)/绿色(后)冠状齿轮</span></div>
<div class="timeline-item"><span class="timeline-time">04:22</span><span class="timeline-text">红色齿轮由瑞士ASSAG公司为奥迪定制，几何形状是专利</span></div>
<div class="timeline-item"><span class="timeline-time">06:07</span><span class="timeline-text">前轮打滑→紫色转快→红色齿轮自转→推绿色往外→离合片锁止→动力传后轴</span></div>
<div class="timeline-item"><span class="timeline-time">07:29</span><span class="timeline-text">默认动力分配40:60，最大前70:30或前15:后85</span></div></div>

<div class="map"><h2>核心脉络图</h2><div class="diagram"><div class="node node">发动机<br/><small>纵置平台</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node-green">冠状齿轮差速器<br/><small>纯机械自锁</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node">前轴开放式差速器<br/><small>40%默认</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node">后轴开放式差速器<br/><small>60%默认</small></div>
<div class="node undefined">→<br/><small>undefined</small></div>
<div class="node node-orange">打滑时自动切换<br/><small>前15~70%</small></div></div></div>

<div class="section">
  <div class="sec-title">观点卡片</div>
  <div class="card card-green"><h3>冠状齿轮差速器 vs 托森差速器</h3>
<p><strong>三大优势：</strong>①重量仅4.8kg（比托森轻2kg）②动力分配范围更自由、更大幅度 ③更好整合全车电子系统</p><p><strong>缺点：</strong>①动力分配是<strong>被动</strong>的（必须先打滑才调整）②前/后桥差速器仍是开放式，无限滑装置（可选配运动后差速器）</p><div class="insight">上集结论：冠状齿轮差速器比托森更轻、更灵活，但前后桥开放式差速器的局限仍存在。下集将讲QuattroUltra和Haldex系统。</div>
<div class="quote">"四个轮子是不是无时无刻都有动力的——这是Quattro的核心特征。"</div></div>
</div>

<div class="section"><div class="sec-title">横向对比表</div><table><tr><th>特性</th><th>冠状齿轮差速器（第6代）</th><th>托森差速器（第5代及以前）</th></tr>
<tr><td>重量</td><td>4.8kg</td><td>约6.8kg</td></tr>
<tr><td>默认分配</td><td>40:60</td><td>约50:50（变体不同）</td></tr>
<tr><td>最大前轴</td><td>70%</td><td>受打滑程度限制</td></tr>
<tr><td>最大后轴</td><td>85%</td><td>受打滑程度限制</td></tr>
<tr><td>电控整合</td><td>更好</td><td>纯机械，整合困难</td></tr>
<tr><td>主动分配</td><td>被动（先打滑再响应）</td><td>被动</td></tr></table></div>

<div class="section">
  <div class="sec-title">行动清单</div>
  <div class="card card-green"><ol><li>选奥迪四驱先确认是哪套Quattro系统（纵置/横置/电动）</li>
<li>追求操控可选配运动后差速器的车型</li>
<li>关注前后桥是否开放式差速器（影响极限脱困能力）</li></ol></div>
</div>

<div class="section">
  <div class="sec-title">避坑总结</div>
  <div class="card card-red"><ol><li>以为所有Quattro都一样（实际有4套不同系统）</li>
<li>以为没了托森Quattro就没了灵魂（冠状齿轮更轻更灵活）</li>
<li>忽略前后桥差速器类型（开放式vs限滑）</li></ol></div>
</div>

<div class="section">
  <div class="sec-title">方法边界</div>
  <div class="boundary">本集仅介绍纵置平台的自锁式冠状齿轮中央差速器（Quattro）。QuattroUltra（电控多片离合）和Haldex（横置平台）在下集。具体车型的动力分配可能因调教而异。</div>
</div>


    <div class="section">
      <div class="sec-title">立场分层</div>
      <div class="card card-green"><h3>可验证事实</h3><ul><li>冠状齿轮差速器由奥迪与瑞士ASSAG合作开发</li><li>重量4.8kg比托森轻2kg</li><li>默认前后分配40:60</li></ul></div>
      <div class="card card-orange"><h3>UP主观点</h3><ul><li>UP主认为冠状齿轮比托森更先进</li><li>情怀固然好但科技永远在进步</li></ul></div>
      <div class="card card-purple"><h3>基于原文的推断</h3><ul><li>纯机械自锁差速器仍将是高端四驱的基础</li></ul></div>
    </div>

<div class="conclusion">
  <h2>一句话总结</h2>
  <p>奥迪Quattro（上集）详解纵置发动机平台的自锁式冠状齿轮中央差速器：纯机械结构通过红色齿轮的特殊几何形状，在前/后轴打滑时自动将动力重新分配到有抓地力的轴。</p>
  <p style="margin-top:16px;opacity:0.7">基于 Whisper 语音转录 × SVG 结构化分析 | 时长 10:47</p>
</div>
