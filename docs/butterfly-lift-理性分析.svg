.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style><div class="container">
<h1>蝶泳“抬”不起来？再硬“抬”罚100次模仿</h1>
<div class="meta">
<span class="tag tag-blue">蝶泳</span><span class="tag tag-green">推水</span><span class="tag tag-orange">游泳技术</span><span class="tag tag-gray">0:28</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>蝶泳手推不出来？<strong>推水的发力不是靠“抬”</strong>——很多人一二三到这儿“抬、落”，当然起不来。正确做法：<strong>靠“抛”推出来</strong>——把抱水的力<strong>带到后面推出来</strong>，而不是抱水的力停住然后<strong>抬</strong>起来。记住：<strong>抛、推出来</strong>，不是“推到这儿停、抬出来”。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">看看蝶泳为什么手推不出来</span></div><div class="timeline-item"><span class="timeline-time">00:02</span><span class="timeline-text">蝶泳推水的发力不是靠抬</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">很多人一二三到这儿，抬、落</span></div><div class="timeline-item"><span class="timeline-time">00:09</span><span class="timeline-text">你当然起不来</span></div><div class="timeline-item"><span class="timeline-time">00:12</span><span class="timeline-text">蝶泳的推水是靠抛推出来</span></div><div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">抛、推出来，而不是推到这儿停</span></div><div class="timeline-item"><span class="timeline-time">00:19</span><span class="timeline-text">再看一遍正确的</span></div><div class="timeline-item"><span class="timeline-time">00:23</span><span class="timeline-text">抱水的力带到后面推出来</span></div><div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">而不是抱水的力停然后抬起来</span></div></div>
<div class='section'><div class='sec-title'>错误 vs 正确</div><table><tr><th></th><th>错误做法</th><th>正确做法</th></tr><tr><td><strong>发力</strong></td><td>靠“抬”</td><td>靠“抛”</td></tr><tr><td><strong>轨迹</strong></td><td>推到这儿停，然后抬出来</td><td>抱水的力带到后面，直接推出来</td></tr><tr><td><strong>结果</strong></td><td>起不来、脱节</td><td>发力连贯，身体被带出水面</td></tr></table></div><div class='section'><div class='sec-title'>核心概念</div><div class='card'><h3>“抛推”：抱水的力别停</h3><p>蝶泳推水的关键是<strong>连贯</strong>：抱水的力量不要停在身体下方，而是<strong>把力带到后面，顺势推出来</strong>——像“抛”出去一样。这样身体会自然被带起来。</p></div><div class='card card-red' style='margin:12px 0'><h3>“抬”：起不来的原因</h3><p>很多人做一二三到身体下方就<strong>停下来</strong>，然后靠肩膀“抬”——力量断掉了，<strong>当然起不来</strong>。</p></div></div>
<div class="conclusion">
<h2>蝶泳推水要点</h2>
<h3>记住这两句</h3><ul><li>蝶泳推水的发力<strong>不是靠抬，是靠抛</strong></li><li><strong>抛、推出来</strong>，不是“推到这儿停、抬出来”</li></ul><h3>动作口诀</h3><ol><li>一二三抱水，力量<strong>不停</strong></li><li>把抱水的力<strong>带到后面</strong></li><li>顺势<strong>推出来</strong>，让身体自然出水</li></ol>
</div>
