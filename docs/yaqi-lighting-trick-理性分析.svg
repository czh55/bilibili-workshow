<div class="container root-wrap">
  <h1>1分钟get雅琪同款打光秘籍</h1>
  <div class="meta"><span class="tag tag-blue">打光</span><span class="tag tag-blue">视频教程</span><span class="tag tag-blue">面光</span><span class="tag tag-blue">氛围感</span><span class="tag tag-blue">小红书</span><span class="tag tag-gray">时长 1分32秒</span></div>
  <a class="source-link" href="http://xhslink.cn/o/24f7rAJOsDK">原视频链接</a>
  <div class="summary-line">视频打光三件套：面光（双主光+反光板）打立体消纹路、背景光暖色打氛围、发丝光打精致，冷光显白暖光显温柔。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">有面光 vs 没面光开场对比</span></div><div class="timeline-item"><span class="timeline-time">00:23</span><span class="timeline-text">面光：双主光+下巴灯消纹路</span></div><div class="timeline-item"><span class="timeline-time">00:48</span><span class="timeline-text">背景光：暖色调台灯</span></div><div class="timeline-item"><span class="timeline-time">01:07</span><span class="timeline-text">发丝光：高射灯打头顶</span></div><div class="timeline-item"><span class="timeline-time">01:25</span><span class="timeline-text">总结：背景发丝用暖光</span></div></div>
  <div class="section"><div class="sec-title">观点拆解</div><div class="card"><h3>面光公式</h3><div class="highlight">左前+右前双主光 + 桌面反光板（下巴灯），消法令纹泪沟，打冷光显白。</div></div><div class="card"><h3>背景光</h3><div class="highlight">西洋灯或暖色台灯打背景，画面立刻温暖有氛围感。</div></div><div class="card"><h3>发丝氛围光</h3><div class="highlight">高射灯从上往下打头顶，亮度色温可调，发丝发光人更精致。</div></div><div class="card"><h3>色温逻辑</h3><div class="highlight">面光用冷光显白净，背景与发丝用暖光显温柔。</div></div></div>
  <div class="conclusion"><h2>行动清单</h2><ul><li>面前放两个主光源（左右各一）增加面部立体感</li><li>桌面铺反光板从下补光，消法令纹泪沟</li><li>面光打冷光显皮肤白净</li><li>背景加暖色灯，画面更温暖有氛围</li><li>头顶加高射灯打发丝光，人更精致</li></ul>
  <h2>适用边界</h2><p>本视频为桌面视频拍摄打光方案，未涉及户外补光、动态视频跟拍与大功率灯光使用场景。</p></div>
