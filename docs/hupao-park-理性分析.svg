<h1>来杭州不来虎跑公园我真的会伤心！摄影师私藏的虎跑宝藏机位大公开</h1>
<div class="meta">
<span class="tag tag-blue">摄影教学</span><span class="tag tag-green">虎跑公园</span><span class="tag tag-orange">宝藏机位</span><span class="tag tag-gray">10:02</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>虎跑公园机位指南：①<strong>早进园</strong>——7 点开门人少；②<strong>水山林</strong>——进门一片水山林，晴天蓝天倒映在池里像<strong>印象派/莫奈油画</strong>，拍<strong>局部水面倒影</strong>；③<strong>找光</strong>——公园拍照脸又黄又绿？教<strong>简单找光方法</strong>；④<strong>老虎雕像</strong>——韩美玲创作的两只老虎刨地雕像（公园名字由来），用<strong>大广角</strong>拍出<strong>峡谷感</strong>；⑤<strong>虎跑泉</strong>——康熙乾隆南巡<strong>指定喝</strong>的泉水，现在很多人接回家泡茶；⑥<strong>碧溪石龟</strong>——其实念碧溪，是龙子霸下；⑦<strong>弘一法师李叔同</strong>——写“长亭外古道边”的民国第一才子在虎跑出家；⑧<strong>构图技巧</strong>——<strong>前景留白</strong>、拍<strong>窗户</strong>、<strong>退远一点</strong>拍。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">开场：虎跑还是虎袍？</span></div><div class="timeline-item"><span class="timeline-time">00:34</span><span class="timeline-text">带相机来演示日常随手拍机位</span></div><div class="timeline-item"><span class="timeline-time">00:44</span><span class="timeline-text">7 点开门，建议早进园人少</span></div><div class="timeline-item"><span class="timeline-time">00:51</span><span class="timeline-text">一进门水山林，稍作停留</span></div><div class="timeline-item"><span class="timeline-time">01:07</span><span class="timeline-text">晴天蓝天倒映池面：莫奈油画感</span></div><div class="timeline-item"><span class="timeline-time">01:30</span><span class="timeline-text">公园拍照脸又黄又绿：教找光方法</span></div><div class="timeline-item"><span class="timeline-time">01:53</span><span class="timeline-text">两只老虎雕像（韩美玲作品）</span></div><div class="timeline-item"><span class="timeline-time">02:15</span><span class="timeline-text">大广角拍出峡谷感</span></div><div class="timeline-item"><span class="timeline-time">02:29</span><span class="timeline-text">虎跑泉：康熙乾隆指定喝，现人接水泡茶</span></div><div class="timeline-item"><span class="timeline-time">03:18</span><span class="timeline-text">碧溪：石龟是龙子霸下</span></div><div class="timeline-item"><span class="timeline-time">04:22</span><span class="timeline-text">弘一法师李叔同：民国第一才子</span></div><div class="timeline-item"><span class="timeline-time">05:26</span><span class="timeline-text">前景留白构图</span></div><div class="timeline-item"><span class="timeline-time">07:32</span><span class="timeline-text">拍窗户构图</span></div><div class="timeline-item"><span class="timeline-time">09:26</span><span class="timeline-text">正确做法：退远一点拍</span></div></div>
<div class='section'><div class='sec-title'>机位路线图</div><div class='diagram'><div class='node'>水山林<br/><small>莫奈油画倒影</small></div><span class='arrow'>→</span><div class='node'>虎雕像<br/><small>大广角峡谷感</small></div><span class='arrow'>→</span><div class='node'>虎跑泉<br/><small>康熙乾隆同款</small></div><span class='arrow'>→</span><div class='node'>李叔同馆<br/><small>留白+窗户</small></div></div></div><div class='section'><div class='sec-title'>出片要点</div><div class='card'><h3>① 早进园</h3><p><strong>7 点开门</strong>，早点进园人会少很多；一进门就是<strong>一片水山林</strong>，可以先稍作停留。</p></div><div class='card card-green' style='margin:12px 0'><h3>② 莫奈油画感</h3><p>晴天<strong>天很蓝</strong>，倒映在池子里，像<strong>印象派油画</strong>；拍<strong>局部的水面倒影</strong>很像莫奈的油画。</p></div><div class='card card-orange' style='margin:12px 0'><h3>③ 找光</h3><p>来公园拍照<strong>脸却又黄又绿</strong>？教大家一个非常简单的<strong>拍照找光的方法</strong>。</p></div><div class='card card-purple'><h3>④ 广角峡谷感</h3><p>两只老虎刨地雕像（<strong>韩美玲</strong>创作，公园名字由来），下边用<strong>大广角</strong>拍有<strong>峡谷的感觉</strong>。</p></div></div>
<div class="conclusion">
<h2>虎跑打卡清单</h2>
<h3>打卡点</h3><ol><li><strong>水山林</strong>：晴天拍水面倒影，莫奈油画感</li><li><strong>老虎雕像</strong>：大广角仰拍，峡谷感</li><li><strong>虎跑泉</strong>：康熙乾隆同款泉水，可接回家泡茶</li><li><strong>碧溪石龟</strong>：龙子霸下，考考你怎么念</li><li><strong>李叔同纪念馆</strong>：民国第一才子，前景留白+窗户构图</li></ol><h3>拍照心法</h3><ul><li>脸黄又绿？<strong>先找光</strong>，逆光脸绿、顺光脸黄是光线问题</li><li>人多就<strong>退远一点</strong>拍，避开人流</li><li>用<strong>前景</strong>（树叶/栏杆）做<strong>留白</strong>，照片更有层次</li></ul>
</div>
