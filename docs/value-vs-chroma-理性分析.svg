      <div class="container root-wrap">
  <h1>让我看看谁还没搞明白明度和纯度的区别！</h1>
  <div class="meta"><span class="tag tag-blue">绘画</span><span class="tag tag-green">水彩</span><span class="tag tag-orange">明度</span><span class="tag tag-purple">纯度</span><span class="tag tag-red">含颜料量</span><span class="tag tag-gray">对比色</span><span class="tag tag-gray">时长 2分21秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/3UOax2nm5cF">原视频</a>
  <div class="summary-line">明度是亮暗深浅；纯度是含颜料量（咖啡浓度）。改法主要是加水，或加对比色（红绿、蓝橙、黄紫）。明度可看成从暗到亮的单箭头；纯度却以中间最浓正红为峰，向右变浅、向左变暗都会降低含颜料量——两条轴方向不同，这是新手最易搞混处。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">人话：明度=亮暗；纯度=含颜料量；加水或加对比色</span></div><div class="timeline-item"><span class="timeline-time">00:39</span><span class="timeline-text">演示：红加水变浅；红加绿/黑变暗；明度单箭头</span></div><div class="timeline-item"><span class="timeline-time">01:17</span><span class="timeline-text">纯度峰形：中间最高，向两边都递减（咖啡类比）</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">明度<br/>亮暗深浅（单箭头）</div><span class="arrow">→</span><div class="node-green">纯度<br/>含颜料量（中间峰）</div><span class="arrow">→</span><div class="node-orange">加水<br/>变浅 → 纯度也降</div><span class="arrow">→</span><div class="node-blue">加对比色<br/>变暗 → 纯度也降</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误区：明度与纯度沿同一方向增减。片中强调纯度是中间最高、两侧双降。</p><p>误区：颜色变暗就等于纯度变高。加绿/加黑变暗时，含红颜料量减少，纯度降低。</p><p>误区：只有加水会降纯度。向暗侧加对比色同样降纯度。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card">
      <h3>人话定义：亮暗 vs 颜料浓度</h3>
      <p>明度=颜色深浅亮暗；纯度=含颜料量，像咖啡含多少咖啡粉。改它们通常加水，或加对比色（红绿、蓝橙、黄紫）。</p>
      <div class="quote">明度……深浅或者亮暗……纯度……含颜料量……一杯咖啡里面含咖啡量</div>
      <div class="relation">先用两个问题自检：它更亮吗？颜料更浓吗？</div>
    </div>
    <div class="card card card-green">
      <h3>两条改路：加水变浅，加绿变暗</h3>
      <p>正红加水→越来越浅；红加绿（或加黑）→越来越暗。明度用左暗右亮的单箭头很好理解，像电灯泡。</p>
      <div class="quote">水越多……越来越浅……红里面加绿……越来越暗</div>
      <div class="relation">演示时固定中间正红，左右各走一条措施，对照更清楚。</div>
    </div>
    <div class="card card card-red">
      <h3>关键辨析：纯度是中间峰，不是单箭头</h3>
      <p>纯度不以与明度同一正比箭头：中间正红含颜料量最高；往右变浅、往左变暗，含红量都变少→纯度都低。像最浓咖啡往两边都变淡。</p>
      <div class="quote">以中间这坨正红色的浓度最高往两边递减……这一点是很多新手容易搞混的</div>
      <div class="relation">把「纯度峰形图」和「明度单箭头图」并排对照，混淆才会消失。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>本片是水彩/绘画入门概念，不覆盖 HSB/Lab 工程色度定义或摄影调色面板操作。</li><li>「含颜料量」是教学类比，不是化学计量精确值。</li><li>对比色三组为常用记忆法，复杂色相环细分另论。</li></ul><div class="pitfall">看见变暗就以为纯度更高（其实常是加了对比色/黑）。</div><div class="pitfall">只练加水稀释，不练加对比色路径，纯度概念不完整。</div><div class="pitfall">把明度轴和纯度轴画成同一方向，后续调色/水彩判断会长期拧巴。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>明度：亮暗深浅（单箭头）</li><li>纯度：含颜料量（中间峰）</li><li>加水：变浅 → 纯度也降</li><li>加对比色：变暗 → 纯度也降</li></ul><h3>行动清单</h3><ol><li>用同一管红颜料做三格：正红、加水浅红、加绿暗红，标出明度高低。</li><li>在同一张图上画明度单箭头与纯度中间峰两条示意，口头解释为何两侧纯度都低。</li><li>默写对比色三组（红绿、蓝橙、黄紫），并各做一次「加对比色降纯度」小样。</li></ol><h3>关键认知转变</h3><p>明度看亮暗单箭头，纯度看含颜料量中间峰；加水变浅与加对比色变暗都会让纯度从峰值往两侧掉——对照两张图，就不再把两条轴当成一回事。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 2分21秒</div>
</div>
    </div>
  </foreignObject>
</svg>