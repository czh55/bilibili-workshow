.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>风光 RAW 修出大片感</h1>
  <div class="meta"><span class="tag tag-blue">Lightroom</span><span class="tag tag-green">风光</span><span class="tag tag-orange">RAW</span><span class="tag tag-purple">蒙版</span><span class="tag tag-red">校准</span><span class="tag tag-gray">HSL</span><span class="tag tag-gray">时长 20分40秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/2TXPgE0LcDp">原视频</a>
  <div class="summary-line">大片感不是「动几个滑块」，而是闭环：裁剪定构图→基础＋曲线→校准定底层→HSL（明度）→色彩分级→少量蒙版塑光→清理→离开再看。蒙版服务于光线与纵深，眼睛判断优先于参数崇拜。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">成品与重置</span></div><div class="timeline-item"><span class="timeline-time">00:33</span><span class="timeline-text">先裁剪</span></div><div class="timeline-item"><span class="timeline-time">01:36</span><span class="timeline-text">基础校正</span></div><div class="timeline-item"><span class="timeline-time">02:09</span><span class="timeline-text">小S曲线</span></div><div class="timeline-item"><span class="timeline-time">03:46</span><span class="timeline-text">早清杂物</span></div><div class="timeline-item"><span class="timeline-time">04:02</span><span class="timeline-text">校准原色</span></div><div class="timeline-item"><span class="timeline-time">05:09</span><span class="timeline-text">HSL开关</span></div><div class="timeline-item"><span class="timeline-time">05:49</span><span class="timeline-text">明度加深蓝</span></div><div class="timeline-item"><span class="timeline-time">07:00</span><span class="timeline-text">色彩分级</span></div><div class="timeline-item"><span class="timeline-time">08:56</span><span class="timeline-text">五蒙版对比</span></div><div class="timeline-item"><span class="timeline-time">11:15</span><span class="timeline-text">径向引海湾</span></div><div class="timeline-item"><span class="timeline-time">12:09</span><span class="timeline-text">线性压前景</span></div><div class="timeline-item"><span class="timeline-time">13:04</span><span class="timeline-text">侧光模拟</span></div><div class="timeline-item"><span class="timeline-time">14:19</span><span class="timeline-text">蒙版堆叠</span></div><div class="timeline-item"><span class="timeline-time">16:29</span><span class="timeline-text">移除清理</span></div><div class="timeline-item"><span class="timeline-time">18:03</span><span class="timeline-text">降噪暗角</span></div><div class="timeline-item"><span class="timeline-time">19:23</span><span class="timeline-text">离开电脑</span></div><div class="timeline-item"><span class="timeline-time">20:24</span><span class="timeline-text">运用与续集</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">构图<br/>裁剪锚点</div><span class="arrow">→</span><div class="node-green">全局色<br/>校准→HSL→分级</div><span class="arrow">→</span><div class="node-orange">局部光<br/>蒙版塑形</div><span class="arrow">→</span><div class="node-blue">收束<br/>清理＋离开</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「萌版／蒙板」→蒙版；「欧键」→O 键；「质方图」→直方图。</p><p>「蓝颜色摄像」画面字幕已作「蓝原色」（Calibration）。</p><p>「镜像渐变／语话／雨画／测光模拟／重生感」→径向渐变／羽化／侧光模拟／纵深感。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>先裁剪再蒙版</h3>
      <p>构图不定，局部调整没有落点；4:3＋自动拉直＋O 键参考线是工作流第一锚。</p>
      <div class="quote">先完成裁剪，确定构图，这样我之后就知道该把蒙版用在哪些位置了</div>
      <div class="relation">几何先于色彩局部。</div>
    </div>
    <div class="card card-green">
      <h3>校准再 HSL</h3>
      <p>校准整体偏移底层基调；先做这一步，再进色相／饱和度／明度更稳。</p>
      <div class="quote">校准工具改变的是 Lightroom 解读图像底层基调和基础色彩的方式</div>
      <div class="relation">底层偏移 ≠ 单通道微调。</div>
    </div>
    <div class="card card-purple">
      <h3>明度＝加深而非减色</h3>
      <p>作者少蓝：降蓝饱和后再降明度，是加深颜色；黄提亮、绿压暗形成浓郁搭配。</p>
      <div class="quote">我不是在减少蓝色，其实我是在加深颜色</div>
      <div class="relation">饱和度与明度分工不同。</div>
    </div>
    <div class="card card-orange">
      <h3>蒙版为塑光</h3>
      <p>五蒙版即可拉开层次；径向引海湾、线性压前景、圆形侧光＋堆叠，目标是纵深不是数量。</p>
      <div class="quote">我使用蒙版的目的就是为了……去掌控光线，去塑造它</div>
      <div class="relation">少而准优于蒙版堆料。</div>
    </div>
    <div class="card card-red">
      <h3>白色与直方图</h3>
      <p>提白色易局部过曝；三角警示亮起＝调过头，需回看直方图再微曝光。</p>
      <div class="quote">当你看到这个小三角警示标志亮起时……你的高光部分过曝了</div>
      <div class="relation">局部提亮有硬上限。</div>
    </div>
    <div class="card card-purple">
      <h3>离开电脑</h3>
      <p>沉浸决策易自我合理化；短休或次日回看才能发现过鲜、偏色与多余元素。</p>
      <div class="quote">在编辑照片时最重要的一点就是离开你的电脑</div>
      <div class="relation">流程闭环含「停下来」。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>演示参数（如蓝原色 -30、高光分级 +41）是该片即兴值，非通用配方。</li><li>课程／邮件课／预设包为导流，不作为技术结论。</li><li>生成式去污与移除依赖软件版本；早年手动点除仍成立。</li><li>「侧光模拟」为作者自造说法，本质是光源同侧降清晰度／去朦胧。</li></ul><div class="pitfall">跳过裁剪直接蒙版，落点混乱。</div><div class="pitfall">只抄滑块数值，不看直方图与眼睛判断。</div><div class="pitfall">提白色不顾过曝三角。</div><div class="pitfall">蒙版越多越好，忽略塑光目标。</div><div class="pitfall">连坐数小时不离开，把过鲜当完成。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>构图锚点先于局部</li><li>校准→HSL 明度→分级是全局色链</li><li>蒙版＝塑光与纵深</li><li>清理＋离开完成闭环</li></ul><h3>行动清单</h3><ol><li>任选一张风光 RAW：先裁剪定比例再动其他</li><li>校准做小幅原色偏移后再开 HSL，重点试蓝明度</li><li>用 ≤5 个蒙版：一径向主体／海湾、一线性压前景、一侧光圆形</li><li>提白色时开直方图，三角亮起立刻回调</li><li>导出前强制离开 ≥5 分钟再微调</li></ol><h3>关键认知转变</h3><p>以前：觉得大片感靠神秘预设或狂拖滑块；现在：按构图→全局色→局部塑光→清理→离开再看的闭环执行，参数只是当次证据。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 20分40秒</div>
</div>
    </div>
  </foreignObject>
</svg>