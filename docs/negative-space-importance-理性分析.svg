      <div class="container root-wrap">
  <h1>留白为何重要：四作用</h1>
  <div class="meta"><span class="tag tag-blue">留白</span><span class="tag tag-green">计白当黑</span><span class="tag tag-orange">马远</span><span class="tag tag-purple">齐白石</span><span class="tag tag-red">意境</span><span class="tag tag-gray">时长 237秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/8IjJAeYsZ5T">原视频</a>
  <div class="summary-line">留白四作用：视觉缓冲（马远）；以虚衬实（齐白石虾）；故事延伸（蛙声十里）；意境载体（计白当黑：八大／板桥／莫兰迪）。空白不是未完成，是用空暗示有。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:09</span><span class="timeline-text">留白有多重要</span></div><div class="timeline-item"><span class="timeline-time">00:21</span><span class="timeline-text">寒江独钓</span></div><div class="timeline-item"><span class="timeline-time">00:45</span><span class="timeline-text">无信息缓冲带</span></div><div class="timeline-item"><span class="timeline-time">01:03</span><span class="timeline-text">填满则崩塌</span></div><div class="timeline-item"><span class="timeline-time">01:18</span><span class="timeline-text">齐白石虾</span></div><div class="timeline-item"><span class="timeline-time">01:50</span><span class="timeline-text">以虚衬实</span></div><div class="timeline-item"><span class="timeline-time">02:04</span><span class="timeline-text">蛙声十里</span></div><div class="timeline-item"><span class="timeline-time">02:28</span><span class="timeline-text">计白当黑</span></div><div class="timeline-item"><span class="timeline-time">02:39</span><span class="timeline-text">八大意境</span></div><div class="timeline-item"><span class="timeline-time">03:18</span><span class="timeline-text">莫兰迪时间感</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">缓冲<br/>眼睛休息</div><span class="arrow">→</span><div class="node-green">衬实<br/>聚焦主体</div><span class="arrow">→</span><div class="node-orange">延伸<br/>画外故事</div><span class="arrow">→</span><div class="node-blue">意境<br/>空暗示有</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「刘白／寒江独吊／以虚趁实／即白当黑／莫兰」→「留白／寒江独钓／以虚衬实／计白当黑／莫兰迪」。</p><p>误区：留白＝没画完。视频强调主动设计。</p><p>误区：只中国画才留白。莫兰迪同理。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>视觉缓冲</h3>
      <p>主体＜10%，空白成无信息休息区。</p>
      <div class="quote">空白区域就成了无信息缓冲带</div>
      <div class="relation">信息过载时需要空。</div>
    </div>
    <div class="card card-orange">
      <h3>以虚衬实</h3>
      <p>不画水见水；空白剔除干扰放大虾动态。</p>
      <div class="quote">空白越纯粹主体就越清晰</div>
      <div class="relation">空是主体的放大器。</div>
    </div>
    <div class="card card-red">
      <h3>故事延伸</h3>
      <p>蝌蚪方向把青蛙推到画外。</p>
      <div class="quote">更成了故事的延伸线</div>
      <div class="relation">留白可叙事，不只装饰。</div>
    </div>
    <div class="card card-purple">
      <h3>计白当黑</h3>
      <p>空暗示有：旷野风声、竹间风势、瓶间时间。</p>
      <div class="quote">空白不是未完成而是用空暗示有</div>
      <div class="relation">意境常住在空白里。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>作业：分析一幅留白属于哪类</p>
      <div class="quote">下期我们将解决不敢留白的痛点</div>
      <div class="relation">先分类，再谈公式</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>237 秒作用论，公式在下期。</li><li>五幅名画为抽样。</li><li>形式美课程预告非本集步骤。</li></ul><div class="pitfall">害怕空洞而填满每个角落。</div><div class="pitfall">留白无功能（不缓冲、不衬、不叙事）。</div><div class="pitfall">把留白只当中国画专属。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>缓冲</li><li>衬实</li><li>延伸</li><li>意境</li></ul><h3>行动清单</h3><ol><li>给作品空白区标注属于哪一作用</li><li>做一次「填满对照」看意境是否崩塌</li><li>尝试不画介质（水／风）只留意象</li><li>禁止无目的的均匀铺满</li></ol><h3>关键认知转变</h3><p>以前：空着＝没画完；现在：空着＝主动说的话。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 237秒</div>
</div>
    </div>
  </foreignObject>
</svg>