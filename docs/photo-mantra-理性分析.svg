.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style><div class="container">
<h1>掌握这3句口诀，跟任何人出门都能出片</h1>
<div class="meta">
<span class="tag tag-blue">拍照</span><span class="tag tag-green">3句口诀</span><span class="tag tag-orange">构图</span><span class="tag tag-gray">3:15</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>教不会拍照的人，只教<strong>3句口诀</strong>：<strong>一光二景三人</strong>。光：你迎着光、让他背着光；景：照片除你以外不超过3个元素；人：长在九宫格上——脑袋别放最上一格（畸变难P）、人放两条竖线上（十有八九能用）。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">成果：从来没拍过照的助理，集训后出了几张网图</span></div><div class="timeline-item"><span class="timeline-time">00:27</span><span class="timeline-text">口诀1：光——你迎着光，他背着光；黄金时间早7-9/午4-6</span></div><div class="timeline-item"><span class="timeline-time">00:50</span><span class="timeline-text">顶光补救：找阴阳交界处，站阴面</span></div><div class="timeline-item"><span class="timeline-time">01:05</span><span class="timeline-text">口诀2：景——景乱人大、景美人让景，除你外不超3元素</span></div><div class="timeline-item"><span class="timeline-time">01:19</span><span class="timeline-text">口诀3：人——长在九宫格上，脑袋别超最上一格</span></div><div class="timeline-item"><span class="timeline-time">01:48</span><span class="timeline-text">进阶：人放两条竖线上/四个交汇点，自拍让出中间格</span></div><div class="timeline-item"><span class="timeline-time">02:44</span><span class="timeline-text">肌肉记忆：手机抬起来微微扣一点，人呈正三角形</span></div><div class="timeline-item"><span class="timeline-time">02:56</span><span class="timeline-text">灵动刁钻角度：前置+别人按快门，或蓝牙遥控器</span></div></div>
<div class='section'><div class='sec-title'>3句口诀</div><div class='diagram'><div class='node'>一光<br/><small>迎着光他背光</small></div><span class='arrow'>→</span><div class='node node-green'>二景<br/><small>除你外≤3元素</small></div><span class='arrow'>→</span><div class='node node-orange'>三人<br/><small>长在九宫格上</small></div></div></div><div class='section'><div class='sec-title'>口诀详解</div><div class='card'><h3>口诀1：光</h3><p><strong>你迎着光，让他背着光，站在光过来的方向</strong>——不会大黑脸逆光，也不会阴阳脸。黄金时间：<strong>早上7-9点、下午4-6点</strong>。顶光不可避免时：找<strong>阴阳交界处</strong>，你站阴面、他站阳面。逆光发丝照等网感玩法新手别轻易尝试。</p></div><div class='card card-green' style='margin:12px 0'><h3>口诀2：景</h3><p><strong>景乱人大、景美人让景。</strong>一个照片除了你以外，<strong>不超过三个元素</strong>（如：天、海、沙滩）——照片干净、好构图。</p></div><div class='card card-orange'><h3>口诀3：人（九宫格）</h3><p>新手只教两条：①<strong>脑袋别出现在最上面1/3</strong>（涉及畸变，很难P）；②<strong>人放在两条竖线上、和竖线平行</strong>——十有八九能用。别放太靠边（易畸变，靠后期裁）。</p></div></div><div class='section'><div class='sec-title'>进阶与肌肉记忆</div><div class='card'><h3>四个交汇点</h3><p>把人放在九宫格<strong>四个交汇点</strong>上，脑袋占一个点、腿占一个点——竖着、横着、截着都能出图。自拍时<strong>让出中间格</strong>，脸出现在循环眼位置，特别有生活感、空间感。</p></div><div class='card card-green' style='margin:12px 0'><h3>肌肉记忆</h3><p>手机一旦抬起来就<strong>微微扣一点（向内倾斜）</strong>，别扣太多——整个人在照片里呈现<strong>正三角形</strong>关系。</p></div><div class='card card-orange'><h3>灵动刁钻角度</h3><p>想拍灵动清奇的视角：找人<strong>打开前置举着</strong>，在自己看得到的情况下让他按快门；或自己拿<strong>蓝牙遥控器+手机支架</strong>。</p></div></div>
<div class="conclusion">
<h2>3句口诀行动清单</h2>
<h3>给不会拍照的人</h3><ol><li><strong>光</strong>：我迎着光，你背着光</li><li><strong>景</strong>：除了我，画面里不超3个元素</li><li><strong>人</strong>：打开九宫格，我站在两条竖线上</li></ol><h3>加分项</h3><ul><li>脑袋别超最上一格（畸变难P）</li><li>交点构图：脑袋一个点、腿一个点</li><li>抬手机微微扣一点，呈正三角形</li><li>前置+他人按快门，拍刁钻灵动角度</li></ul>
</div>
