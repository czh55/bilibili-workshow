<div class="svg-page">
  <div class="container">
    <h1>光圈如何定义（一）：相对光圈与入瞳径</h1>
    <div class="meta">
      <span class="tag tag-blue">小红书</span>
      <span class="tag tag-green">53秒</span>
      <span class="tag tag-orange">摄影科普</span>
      <span class="tag tag-purple">光圈 / 入瞳径</span>
      <span class="tag tag-gray">理性分析</span>
    </div>
    <a class="source-link" href="http://xhslink.cn/o/3iwI6eRpA7z">原视频：相机「光圈」底层逻辑科普，光圈如何定义（一）</a>
    <div class="summary-line">
      <strong>核心判断：</strong>本集真正回答的不是「该开哪一档好看」，而是「F 值到底在量什么」。先纠正「数字越大孔越大」的反向直觉，再把定义钉成
      <span class="key-data">F = 焦距 / 入瞳径</span>，并划清：入瞳径是从前看进去的视觉开孔，受物理光圈控制，却不等于叶片机械孔径；大光圈前镜组还会光学放大入瞳。
    </div>

    <div class="timeline">
      <h3>关键证据时间轴</h3>
      <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">列出常见 F1.4 / 2.8 / 4 / 8 / 16</div></div>
      <div class="timeline-item"><div class="timeline-time">00:06</div><div class="timeline-text">点明这些是相对光圈值；数字小 → 物理光圈大</div></div>
      <div class="timeline-item"><div class="timeline-time">00:18</div><div class="timeline-text">转入「如何定义 F 值」</div></div>
      <div class="timeline-item"><div class="timeline-time">00:22</div><div class="timeline-text">给出公式：F = 焦距 / 入瞳径（通光孔径）</div></div>
      <div class="timeline-item"><div class="timeline-time">00:28</div><div class="timeline-text">入瞳径很大程度上由物理光圈控制</div></div>
      <div class="timeline-item"><div class="timeline-time">00:34</div><div class="timeline-text">入瞳径 = 从镜头前看进去的视觉开孔直径</div></div>
      <div class="timeline-item"><div class="timeline-time">00:39</div><div class="timeline-text">明确：不是叶片控制的物理孔径</div></div>
      <div class="timeline-item"><div class="timeline-time">00:42</div><div class="timeline-text">大光圈前镜组可放大入瞳径（高曲率/高折射率）</div></div>
    </div>

    <div class="map">
      <h2>核心脉络</h2>
      <div class="diagram">
        <div class="node">问题<br/>F 数字为何反直觉</div>
        <div class="arrow">→</div>
        <div class="node node-green">证据<br/>相对值与入瞳公式</div>
        <div class="arrow">→</div>
        <div class="node">判断<br/>分母是视觉入瞳</div>
        <div class="arrow">→</div>
        <div class="node node-orange">行动<br/>先换算再谈孔大小</div>
      </div>
    </div>

    <div class="correction">
      <h3>常见误解与认知纠偏</h3>
      <p><strong>误解：</strong>「F16 比 F1.4 大，所以孔更大、进光更多。」<br/>
      <strong>纠偏：</strong>视频明确：数值越大，实际物理光圈越小；相对光圈是比值，不是孔的毫米数本身。<br/>
      <strong>误解：</strong>「入瞳径就是光圈叶片围出的那个机械孔。」<br/>
      <strong>纠偏：</strong>入瞳径是从前看进去的视觉开孔；前镜组还能光学放大它，因此不能直接等同叶片孔径。</p>
    </div>

    <div class="section">
      <h2 class="sec-title">1. 相对光圈：数字与物理开孔反向</h2>
      <div class="card card-green">
        <h3>在讲什么</h3>
        <p>日常说的 F1.4、F2.8、F4、F8、F16 是镜头的相对光圈值：数值越小，实际物理光圈越大；数值越大，物理光圈越小。</p>
        <div class="highlight">相对光圈先建立「反向直觉」：别把 F 数字当成孔的线性尺寸。</div>
        <div class="quote">「这些说的其实是镜头的相对光圈值」「这个数值越小代表实际的物理光圈越大」[00:06–00:15]</div>
        <div class="relation">关系：F 数字 ↑ → 物理开孔 ↓（同焦距语境下的教学表述）。</div>
        <div class="action">怎么用：听到「开大光圈」时先想「F 数字变小」，而不是「数字变大」。</div>
        <div class="insight">原文依据：开场档位序列 + F16/F11 与开孔动画对照，属可观察教学演示。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">2. 定义公式：F = 焦距 / 入瞳径</h2>
      <div class="card">
        <h3>在讲什么</h3>
        <p>F 值被定义为焦距除以入瞳径（通光孔径），也就是焦距与入瞳径的比值；入瞳径很大程度上由物理光圈控制。</p>
        <div class="quote">画面字幕：「光圈F值等于焦距除以入瞳径（通光孔径）」[00:22–00:28]</div>
        <div class="highlight">同一焦距下：F 变小 ⇔ 入瞳径变大；这解释了为何「小数字 = 大孔」。</div>
        <div class="relation">关系：公式把「相对值」还原成两个几何量的比，为下一集毫米级计算铺路。</div>
        <div class="action">怎么用：比较两档时，固定焦距，用「入瞳 = 焦距 / F」心算开孔谁更大。</div>
        <div class="insight">立场分层：公式本身是光学定义（可验证）；「很大程度上由物理光圈控制」是视频给出的教学表述（UP 主观点，方向正确但未量化）。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">3. 入瞳径：视觉开孔，不是叶片孔径</h2>
      <div class="card card-purple">
        <h3>UP 主观点（概念分层）</h3>
        <p>入瞳径可理解为从镜头前看向内部的视觉开孔直径；它并不是真实光圈叶片所控制的物理孔径。</p>
        <div class="quote">「从镜头前看向其内部的视觉开孔直径」「它并不是真实的光圈叶片所控制的物理孔径」[00:34–00:42]</div>
        <div class="relation">关系：物理光圈是控制手段；入瞳径是公式分母的观察量——二者相关但不等同。</div>
        <div class="action">怎么用：读规格或做光学估算时，以入瞳/有效通光口径为准，不要默认等于可见叶片孔直径。</div>
        <div class="insight">边界：本集未给出测量入瞳的实验方法，只建立概念区分。</div>
      </div>
      <div class="card card-orange">
        <h3>风险和避坑</h3>
        <div class="pitfall">不要把 F 数字直接当成「亮度百分比」或「孔的毫米数」。</div>
        <div class="pitfall">不要把入瞳径与叶片机械孔径画等号，尤其在大光圈镜头上。</div>
        <div class="pitfall">本集未讲曝光档位与景深；勿用定义集结论硬推「虚化一定更好」。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">4. 前镜组：为什么大光圈能「放大」入瞳</h2>
      <div class="card">
        <h3>在讲什么</h3>
        <p>很多大光圈镜头前镜组采用高曲率或高折射率镜片，作用是把入瞳径放大——因此从前面看进去的开孔，可以比机械孔「显得」更大。</p>
        <div class="quote">「很多大光圈镜头前镜组采用高曲率或高折射率的镜片，其作用就是把入瞳径放大」[00:42–00:50]</div>
        <div class="highlight">补充资料：结尾镜头特写标注引用 GM 50mm 宣传片，属画面引用，不是本集实测。</div>
        <div class="action">怎么用：理解「大光圈设计」时，除了叶片行程，还要想到前组光学对入瞳的贡献。</div>
        <div class="insight">推断边界：视频说明「作用是放大」，未给出放大倍率或设计公式；后续计算集用的是入瞳结果，而非叶片孔直径。</div>
      </div>
    </div>

    <div class="card">
      <h3>横向对比：三个容易混的「孔」</h3>
      <table>
        <thead>
          <tr>
            <th>概念</th>
            <th>它是什么</th>
            <th>本集怎么说</th>
            <th>使用时注意</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>相对光圈 F 值</td>
            <td>焦距 / 入瞳径 的比值</td>
            <td>日常说的 F1.4、F16 等</td>
            <td>数字大 ≠ 孔大</td>
          </tr>
          <tr>
            <td>入瞳径（通光孔径）</td>
            <td>从前看进去的视觉开孔直径</td>
            <td>公式分母；受物理光圈控制</td>
            <td>不等于叶片机械孔径</td>
          </tr>
          <tr>
            <td>叶片物理孔径</td>
            <td>光圈叶片围出的真实开孔</td>
            <td>明确说「不是」入瞳本身</td>
            <td>可被前镜组光学「放大」后呈现为入瞳</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <h3>方法边界与立场分层</h3>
      <div class="stance-grid">
        <div class="stance-item">
          <strong>可验证事实</strong>
          F = 焦距 / 入瞳径；相对光圈数字与物理开孔反向（同焦距）。
        </div>
        <div class="stance-item">
          <strong>UP 主观点</strong>
          用视觉开孔定义入瞳；强调前镜组放大入瞳的设计意图。
        </div>
        <div class="stance-item">
          <strong>基于原文的推断</strong>
          搞清分母后，下一集才能用毫米数算入瞳并接曝光；本集不单独完成曝光决策。
        </div>
      </div>
      <div class="highlight" style="margin-top:16px">适用条件：理想化圆形入瞳教学模型；未讨论 T 停、渐晕、变焦时入瞳随焦距变化。示例镜头画面为 FE 1.2/50GM 示意，不等于实测数据。</div>
    </div>

    <div class="conclusion">
      <h2>总结与行动</h2>
      <h3>核心要点</h3>
      <ul>
        <li>日常 F 值是相对光圈：数字越小，物理光圈越大。</li>
        <li>定义式：F = 焦距 ÷ 入瞳径（通光孔径）。</li>
        <li>入瞳径是从前看进去的视觉开孔，不等于叶片机械孔径。</li>
        <li>大光圈前镜组可用高曲率/高折射率镜片放大入瞳。</li>
      </ul>
      <h3>行动清单</h3>
      <ol>
        <li>背下定义式，遇到 F 档先问「分母入瞳变大还是变小」。</li>
        <li>口语练习：把「开大光圈」对应到「F 数字变小」，避免反向口误。</li>
        <li>看镜头剖面或参数时，区分「叶片孔」与「入瞳/有效通光」。</li>
        <li>为下一集做准备：固定一支定焦，准备用「焦距 ÷ F」估算入瞳毫米数。</li>
        <li>做曝光或景深决策前，先确认本集只解决定义，不要越界硬推。</li>
      </ol>
      <h3>关键认知转变</h3>
      <p>从「F 是亮度旋钮上的数字」转向「F 是焦距与视觉入瞳的比值」：先认清分母是什么，再谈孔大孔小，最后才接曝光与景深。</p>
    </div>

    <p class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录与画面字幕</p>
  </div>
</div>

    </div>
  </foreignObject>
</svg>