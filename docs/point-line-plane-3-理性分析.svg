.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>点线面关系3：线为主导</h1>
  <div class="meta"><span class="tag tag-blue">线主导</span><span class="tag tag-green">吴冠中</span><span class="tag tag-orange">克里姆特</span><span class="tag tag-purple">情绪张力</span><span class="tag tag-red">韵律</span><span class="tag tag-gray">时长 180秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/6P6D9uk6LYO">原视频</a>
  <div class="summary-line">去线则失魂。曲线舞韵、克里姆特生命触须、吴冠中线即春天、直线几何理性——线形态即情绪。主导关键是释放张力，点面仅辅助。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">线条魔力</span></div><div class="timeline-item"><span class="timeline-time">00:18</span><span class="timeline-text">去线对照</span></div><div class="timeline-item"><span class="timeline-time">00:34</span><span class="timeline-text">侍女曲线</span></div><div class="timeline-item"><span class="timeline-time">00:55</span><span class="timeline-text">克里姆特触须线</span></div><div class="timeline-item"><span class="timeline-time">01:22</span><span class="timeline-text">吴冠中春如线</span></div><div class="timeline-item"><span class="timeline-time">01:45</span><span class="timeline-text">线即春天</span></div><div class="timeline-item"><span class="timeline-time">02:01</span><span class="timeline-text">直线几何美</span></div><div class="timeline-item"><span class="timeline-time">02:26</span><span class="timeline-text">释放情绪张力</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">证明<br/>去线失魂</div><span class="arrow">→</span><div class="node-green">曲<br/>生命韵律</div><span class="arrow">→</span><div class="node-orange">直<br/>理性几何</div><span class="arrow">→</span><div class="node-blue">辅助<br/>点面适度</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「补写／吞的乐章／不复所望」→「谱写／春的乐章／不负所望」。</p><p>误区：线主导＝满屏线。要形态情绪清晰。</p><p>误区：点面平均。口播强调适度辅助。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>去线失魂</h3>
      <p>去掉穿过人潮的树枝线，画面瞬间平淡。</p>
      <div class="quote">好像没了灵魂</div>
      <div class="relation">线是灵魂骨架之一。</div>
    </div>
    <div class="card card-orange">
      <h3>曲线推韵律</h3>
      <p>侍女通体曲线；点串成另一动线交织。</p>
      <div class="quote">把舞蹈与音乐的韵律美推向了高潮</div>
      <div class="relation">点可服从线。</div>
    </div>
    <div class="card card-red">
      <h3>线即春天</h3>
      <p>吴冠中抽象线＝春风雨丝生命脉络；彩点如花苞飞鸟。</p>
      <div class="quote">线条在此刻就是春天本身</div>
      <div class="relation">具象可让位于线。</div>
    </div>
    <div class="card card-purple">
      <h3>释放张力</h3>
      <p>充分释放不同形态情绪张力，点面适度辅助。</p>
      <div class="quote">关键在于要充分释放它不同形态下的情绪张力</div>
      <div class="relation">形态选择＝情绪选择。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>线主导成立条件</p>
      <div class="quote">情绪张力在线；点面不抢戏。</div>
      <div class="relation">这就是以线主导的点线面关系</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>三部曲收线主导篇。</li><li>插画／克里姆特为旁证。</li><li>课宣非步骤。</li></ul><div class="pitfall">线无粗细节奏成铁丝网。</div><div class="pitfall">点面过大压过线。</div><div class="pitfall">直线曲线情绪与主题打架。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>线可主导叙事</li><li>形态即情绪</li><li>点面辅助</li></ul><h3>行动清单</h3><ol><li>做去线前后对照拼图</li><li>临《春如线》只保留线与彩点</li><li>同构图用曲线版／直线版比情绪</li><li>检查点面面积是否抢线</li></ol><h3>关键认知转变</h3><p>以前：线只是勾边；现在：让线主导情绪，点面退居辅助。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 180秒</div>
</div>
    </div>
  </foreignObject>
</svg>