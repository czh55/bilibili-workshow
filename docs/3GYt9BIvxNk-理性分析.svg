<div class="card"><h3>内容要点</h3><ul><li>其实闪光灯和长亮灯完全是两个级别的产品</li>
<li>我们平时用的基顶灯</li>
<li>如果换算成相同的亮度</li>
<li>差不多相当于一万瓦以上的长亮灯</li>
<li>所以是闪光灯在亮度上完全可以秒示长亮灯</li>
<li>那么我们应该怎么选择亮度的灯呢</li>
<li>灯的亮度输出基本上遵循着</li>
<li>预强折强预弱折弱的原则</li>
<li>大体上就是灯的亮度和你要拍摄的环境</li>
<li>亮度在一个数量级上</li>
<li>所以说夜景里面一个小小的补光灯就够了</li>
<li>室内、阴天或者是树影底下都可以用小公寓的灯</li>
<li>长亮灯也可以在这些环境下使用</li>
<li>但是如果是外景阳光</li>
<li>那么唯一的选择就只有闪光灯了</li>
<li>长亮灯的优势是锁建技术的</li>
<li>对新手补光很友好</li>
<li>还有如果是视频拍摄</li>
<li>长亮灯是唯一的选择</li>
<li>但在摄影中</li>
<li>长亮灯除了锁建技术折折的一个优点之外</li>
<li>其他几乎都是闪光灯的优势了</li>
<li>闪光灯远超长亮灯的亮度</li>
<li>使它可以加各种光智附件</li>
<li>比如大型的深拋、柔光箱等等</li>
<li>这些附件本身对光亮度有很大的削减</li>
<li>所以说长亮灯常常因为亮度不够</li>
<li>不太好用这些附件</li>
<li>另外闪光灯还有一个瞬间凝固性的特点</li>
<li>所以说你再用闪光灯拍出的照片</li>
<li>锐度和质感都会更好</li>
<li>而且不太容易发虚</li>
<li>但是闪光灯的学习确实有点门槛</li>
<li>跨不过去你就会觉得用灯很难受</li>
<li>还不如自然光拍的</li>
<li>让你慢慢的放弃用灯</li>
<li>但你一旦过了这个门槛</li>
<li>玩灯可能是摄影里面最大的乐趣</li>
<li>如果你会深入的学习摄影</li>
<li>那么驾驭闪光灯一定是你不可回避的一个课题</li>
<li>有人说长亮灯还可以无极的调节摄温</li>
<li>其实闪光灯加上绿色纸也可以调摄温</li>
<li>但确实没有长亮灯具备冷暖两个灯珠</li>
<li>通过比例的混合无极调节摄温更方便</li>
<li>不过我有一个可以实现闪光灯远程</li>
<li>在影闪器上无极调节摄温的方法</li>
<li>下次我们讲闪光灯时候分享给大家</li>
</ul></div>
