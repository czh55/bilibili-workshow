<div class="timeline-item"><span class="timeline-time">[00:17]</span><span class="timeline-text">灯的亮度输出基本上遵循着</span></div>
<div class="timeline-item"><span class="timeline-time">[00:20]</span><span class="timeline-text">预强折强预弱折弱的原则</span></div>
<div class="timeline-item"><span class="timeline-time">[00:23]</span><span class="timeline-text">大体上就是灯的亮度和你要拍摄的环境</span></div>
<div class="timeline-item"><span class="timeline-time">[00:27]</span><span class="timeline-text">亮度在一个数量级上</span></div>
<div class="timeline-item"><span class="timeline-time">[00:29]</span><span class="timeline-text">所以说夜景里面一个小小的补光灯就够了</span></div>
<div class="timeline-item"><span class="timeline-time">[00:32]</span><span class="timeline-text">室内、阴天或者是树影底下都可以用小公寓的灯</span></div>
