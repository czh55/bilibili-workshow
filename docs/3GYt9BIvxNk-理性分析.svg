<div class="timeline-item"><span class="timeline-time">[00:40]</span><span class="timeline-text">但是如果是外景阳光</span></div>
<div class="timeline-item"><span class="timeline-time">[00:42]</span><span class="timeline-text">那么唯一的选择就只有闪光灯了</span></div>
<div class="timeline-item"><span class="timeline-time">[00:45]</span><span class="timeline-text">长亮灯的优势是锁建技术的</span></div>
<div class="timeline-item"><span class="timeline-time">[00:48]</span><span class="timeline-text">对新手补光很友好</span></div>
