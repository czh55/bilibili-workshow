.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>锐评⑥：剪影轮廓与海边杂物</h1>
  <div class="meta"><span class="tag tag-blue">锐评</span><span class="tag tag-green">剪影</span><span class="tag tag-orange">构图</span><span class="tag tag-purple">裁切</span><span class="tag tag-red">服装</span><span class="tag tag-gray">时长 248秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/8csW9QaOtbp">原视频</a>
  <div class="summary-line">剪影要轮廓与动态，横线过多会变牢笼；海边有前景意识也要清杂物与遮挡；沙滩避十字交叉与扭曲姿态；逆光情绪片仍要服装贴场景。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">窗边剪影缺轮廓</span></div><div class="timeline-item"><span class="timeline-time">00:50</span><span class="timeline-text">横线如井字牢笼</span></div><div class="timeline-item"><span class="timeline-time">01:30</span><span class="timeline-text">海边叶前景</span></div><div class="timeline-item"><span class="timeline-time">02:10</span><span class="timeline-text">裁切去杂</span></div><div class="timeline-item"><span class="timeline-time">02:40</span><span class="timeline-text">手臂海平线交叉</span></div><div class="timeline-item"><span class="timeline-time">03:30</span><span class="timeline-text">逆光合格减分项</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">剪影<br/>轮廓优先</div><span class="arrow">→</span><div class="node-green">杂物<br/>裁切提纯</div><span class="arrow">→</span><div class="node-orange">线条<br/>避十字交叉</div><span class="arrow">→</span><div class="node-blue">场景<br/>服装匹配</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>点评为作者个人审美立场。</p><p>「井字／监狱」为比喻，非事实指控。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>剪影纪律</h3>
      <p>轮廓、性别可读性、手脚动态缺一会就成「一坨」。</p>
      <div class="quote">剪影这种东西，它一定是要突出轮廓或者突出动作</div>
      <div class="relation">剪影卖的是形，不是糊。</div>
    </div>
    <div class="card card-orange">
      <h3>线条情绪</h3>
      <p>过多横竖线框住主体→压抑；需柔和形或减线。</p>
      <div class="quote">你就感觉这是在玩五子棋</div>
      <div class="relation">线条密度也会叙事。</div>
    </div>
    <div class="card card-red">
      <h3>杂乱诊断</h3>
      <p>暗部说不清的东西、路人、挡船都是减分；裁切是最快净化。</p>
      <div class="quote">因为太杂乱了</div>
      <div class="relation">有想法≠画面干净。</div>
    </div>
    <div class="card card-purple">
      <h3>合格线</h3>
      <p>逆光+表情张力可过线；服装与手部道具仍要服务场景。</p>
      <div class="quote">我这张照片我觉得是合格的</div>
      <div class="relation">合格是底线，匹配场景才加分。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>个人锐评</p>
      <div class="quote">好，那我们今天这个点评就到这了</div>
      <div class="relation">以可指认画面问题为学习点。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>短视频连评，非系统课。</li><li>未给原作者完整 EXIF／拍摄意图。</li></ul><div class="pitfall">剪影不检查轮廓。</div><div class="pitfall">前景有了却不清杂物。</div><div class="pitfall">人像线条与地平线乱交叉。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>轮廓可读</li><li>画面净化</li><li>线条与服装服务主题</li></ul><h3>行动清单</h3><ol><li>自拍剪影先问：轮廓与动作能否一眼读出</li><li>海边／窗边成片先裁掉说不清的暗部杂物</li><li>检查人体线条是否与地平线十字交叉</li><li>服装是否服务沙滩／楼道等场景气质</li></ol><h3>关键认知转变</h3><p>以前：有光影就满意；现在：先问轮廓与杂物是否完成叙事。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 248秒</div>
</div>
    </div>
  </foreignObject>
</svg>