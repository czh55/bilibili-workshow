      <div class="container root-wrap">
  <h1>这次彻底搞懂亮部颜色：光色 × 固有色</h1>
  <div class="meta"><span class="tag tag-blue">色彩原理</span><span class="tag tag-green">亮部</span><span class="tag tag-orange">光色</span><span class="tag tag-purple">固有色</span><span class="tag tag-red">纯度</span><span class="tag tag-gray">写生</span><span class="tag tag-gray">时长 105秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/3YWYtqeUu19">原视频</a>
  <div class="summary-line">亮部色不是加白：中性光只提明度；有色光时，光色与固有色接近则变纯，远离则变灰。佐恩红裙与索罗拉蓝衣亮部是两端例证；岩石实操验证同一规律。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">设问：亮部颜色由什么决定</span></div><div class="timeline-item"><span class="timeline-time">00:07</span><span class="timeline-text">中性光：亮部只是明度提高</span></div><div class="timeline-item"><span class="timeline-time">00:17</span><span class="timeline-text">暖阳：橙灰球亮部变鲜橙黄</span></div><div class="timeline-item"><span class="timeline-time">00:30</span><span class="timeline-text">蓝球：也变暖，但变灰</span></div><div class="timeline-item"><span class="timeline-time">00:40</span><span class="timeline-text">接近→变纯；远离→变灰</span></div><div class="timeline-item"><span class="timeline-time">01:05</span><span class="timeline-text">蓝灰岩暖亮发灰；橙灰岩更纯</span></div><div class="timeline-item"><span class="timeline-time">01:34</span><span class="timeline-text">亮部≠加白，是光色×固有色</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">中性光<br/>只提明度</div><span class="arrow">→</span><div class="node-green">光色≈固有色<br/>强化变纯</div><span class="arrow">→</span><div class="node-orange">光色远离<br/>削弱变灰</div><span class="arrow">→</span><div class="node-blue">实操<br/>亮部≠加白</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「成灰色／左恩／化灰」校正为「橙灰色／佐恩／画灰」。</p><p>误区：亮部=加白。视频结论是光色与固有色共同作用。</p><p>误区：亮部越鲜越好。固有色与光色距离远时应画灰才真实。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>实验入口：光有没有色彩倾向</h3>
      <p>无倾向时亮部只是明度提高；暖阳让橙灰球亮部变鲜橙黄；蓝球同样变暖却变灰——同一暖光，结果取决于固有色。</p>
      <div class="quote">当光线没有明显色彩倾向的时候，亮部呢只是明度的提高</div>
      <div class="relation">先辨光色，再谈亮部配方。</div>
    </div>
    <div class="card card-orange">
      <h3>接近则纯：强化</h3>
      <p>光色与固有色接近时，颜色更容易被强化变纯。佐恩红裙是「接近→变纯」的经典视觉记忆点。</p>
      <div class="quote">当光色和固有色接近时，颜色更容易被强化而变纯</div>
      <div class="relation">同方向叠色=提纯。</div>
    </div>
    <div class="card card-purple">
      <h3>远离则灰：更真实</h3>
      <p>两者距离远时固有色被削弱变灰。索罗拉把蓝衣亮部画灰，反而更真实——灰不是失败，是光色关系正确。</p>
      <div class="quote">当两者距离较远时，固有色更容易被削弱而变灰</div>
      <div class="relation">该灰时敢灰。</div>
    </div>
    <div class="card card-green">
      <h3>实操纪律：亮部≠加白</h3>
      <p>蓝灰岩暖亮发灰（相抵消），橙灰岩暖且更纯（接近）。收束：亮部是光色与固有色共同作用，不是简单加白。</p>
      <div class="quote">亮部不是简单的加白，而是光色和固有色共同作用的结果</div>
      <div class="relation">写生前先估两者距离。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>105 秒讲亮部规律，暗部明确留待下期。</li><li>大师例证为观感引用，非画作技法全解。</li><li>球体／岩石为教学简化模型。</li></ul><div class="pitfall">亮部一律提白，失去光色信息。</div><div class="pitfall">固有色与光色冲突时仍强行提纯，虚假发光。</div><div class="pitfall">只记结论不跑球体对照，无法迁移到写生。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>亮部色 = 光色 × 固有色</li><li>接近变纯，远离变灰</li><li>加白只提明度，不能代替关系判断</li></ul><h3>行动清单</h3><ol><li>写生前写下：固有色倾向、光源色倾向、两者远近</li><li>用灰球／色球各做一次暖光实验并截图对照</li><li>亮部先定色相再定明度，最后才考虑加白</li><li>冷固有色+暖光时，允许亮部发灰</li></ol><h3>关键认知转变</h3><p>以前：亮部就是加白加亮；现在：先量光色与固有色的距离，再决定提纯还是画灰。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 105秒</div>
</div>
    </div>
  </foreignObject>
</svg>