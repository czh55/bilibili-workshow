<h1>远程摄影指导第6期：荷花池怎么拍</h1>
<div class="meta">
<span class="tag tag-blue">摄影指导</span><span class="tag tag-green">荷花池</span><span class="tag tag-orange">机位</span><span class="tag tag-gray">0:52</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>荷花池怎么拍？①<strong>找高一点的地儿站上去</strong>（高机位）——背景整个就都是荷叶了；②用<strong>长焦镜头（85mm）</strong>，压缩背景；③<strong>模特向后转身</strong>面对镜头，荷叶铺满画面；④用<strong>小光圈</strong>让背景荷叶虚化、拍不清楚，突出人物。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">老师，这荷花怎么拍啊，这有一片</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">这附近有没有什么高一点的地儿啊</span></div><div class="timeline-item"><span class="timeline-time">00:11</span><span class="timeline-text">高点：站高一点，上树上行吗</span></div><div class="timeline-item"><span class="timeline-time">00:14</span><span class="timeline-text">这整块土坡，站上去</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">有长焦啊你？85 有</span></div><div class="timeline-item"><span class="timeline-time">00:24</span><span class="timeline-text">拿起来对着模特，向后转</span></div><div class="timeline-item"><span class="timeline-time">00:31</span><span class="timeline-text">哇塞，有了！背景都是荷叶了</span></div><div class="timeline-item"><span class="timeline-time">00:36</span><span class="timeline-text">弄一个小点的光圈，背景拍不清楚</span></div><div class="timeline-item"><span class="timeline-time">00:42</span><span class="timeline-text">小光圈拍了啊，老师 OK</span></div></div>
<div class='section'><div class='sec-title'>荷花池拍摄四步</div><div class='diagram'><div class='node'>①站高点<br/><small>土坡/高台</small></div><span class='arrow'>→</span><div class='node'>②长焦85mm<br/><small>压缩背景</small></div><span class='arrow'>→</span><div class='node'>③模特转身<br/><small>背景全是荷叶</small></div><span class='arrow'>→</span><div class='node node-green'>④小光圈<br/><small>荷叶虚化成景</small></div></div></div><div class='section'><div class='sec-title'>关键动作</div><div class='card'><h3>高机位</h3><p>附近找高一点的地儿（土坡、高台），<strong>站上去俯拍</strong>——整个背景就都是荷叶了，画面干净出片。</p></div><div class='card card-green' style='margin:12px 0'><h3>长焦压缩</h3><p>用<strong>85mm 长焦</strong>，拉近人物、压缩背景，荷叶会大片铺在画面里。</p></div><div class='card card-orange' style='margin:12px 0'><h3>小光圈虚化</h3><p>用<strong>小光圈</strong>让背景荷叶<strong>拍不清楚</strong>——变成虚化的绿色背景，突出人物、氛围感更强。</p></div></div>
<div class="conclusion">
<h2>荷花池出片清单</h2>
<h3>四步出片</h3><ol><li><strong>找高点</strong>：土坡、高台，站上去俯拍</li><li><strong>换长焦</strong>：85mm，压缩背景让荷叶铺满</li><li><strong>模特转身</strong>：背对荷叶转回来面对镜头</li><li><strong>小光圈</strong>：背景荷叶虚化成一片绿</li></ol><h3>心法</h3><ul><li>荷花池的核心不是拍花，是<strong>用荷叶做背景</strong></li><li>机位决定背景干净度，<strong>高机位+长焦=满屏荷叶</strong></li></ul>
</div>
