      <div class="container root-wrap">
  <h1>LUT使用的小秘诀：放链路开头还是结尾？</h1>
  <div class="meta"><span class="tag tag-blue">调色</span><span class="tag tag-green">LUT</span><span class="tag tag-orange">色域</span><span class="tag tag-purple">教学</span><span class="tag tag-gray">时长 2分08秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/6DWfzldxlgw">原视频</a>
  <div class="summary-line">LUT 在调色链路中放开头还是结尾，取决于你是否保护了交付色域。放开头可以，但必须用 DCI P3 limiter 兜底——否则在显示器上看不到的色可能在 P3 投影色域里突然显形。把 LUT 放链路末尾、先校色后套 LUT，则全程在已知调色板内工作，更可控也更省时。两种方式都成立，关键是最终输出落在目标色域内。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">回答大问题：怎么在调色中使用 LUT</span></div><div class="timeline-item"><span class="timeline-time">00:11</span><span class="timeline-text">做法一：LUT 放在链路开头，之后再校色——先给出警告</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">风险：显示器上不可见的颜色可能在 DCI P3 投影色域里突然显现</span></div><div class="timeline-item"><span class="timeline-time">00:41</span><span class="timeline-text">对策：链路末尾加 DCI P3 limiter，把色彩约束在交付色域内</span></div><div class="timeline-item"><span class="timeline-time">01:08</span><span class="timeline-text">做法二：作者习惯 LUT 放链路末尾，先校色后套 LUT</span></div><div class="timeline-item"><span class="timeline-time">01:19</span><span class="timeline-text">理由：知道调色板约束与对比曲线，省时且清晰</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">LUT 放开头<br/>先套 LUT 再校色</div><span class="arrow">→</span><div class="node-green">P3 limiter 保护<br/>链路末尾限制器约束交付色域</div><span class="arrow">→</span><div class="node-orange">LUT 放末尾<br/>先校色后套 LUT</div><span class="arrow">→</span><div class="node-blue">已知色板工作<br/>全程在确定色彩与对比范围内</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误区：LUT 只能放链路开头。实际上两种方式都成立，取决于是否管理好交付色域。</p><p>误区：显示器上看到的颜色就是最终交付的颜色。实际上 P3 色域可能显现显示器上看不到的色彩。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card">
      <h3>风险场景：看不见的颜色会在 P3 里显形</h3>
      <p>如果你在显示器上校色，但影片最终要在 DCI P3 色域的投影机上播放，就可能出现显示器上看不见的颜色在 P3 里突然表达出来的意外。这是把 LUT 放链路开头时的主要风险。</p>
      <div class="quote">You could have colors that you couldn't see on your monitor that suddenly express themselves in the P3 color space that come as a bit of a surprise.</div>
      <div class="relation">原理：显示器色域 ≠ 交付色域，色彩可能越出你的可视范围。</div>
    </div>
    <div class="card card card-green">
      <h3>保护措施：链路末尾放 DCI P3 limiter</h3>
      <p>如果要把 LUT 放链路开头，建议在链路末尾放一个 DCI P3 limiter，确保始终工作在正确的、受约束的色彩空间里，为最终交付物提供保护。即使当前显示器无法完整呈现那个色域，也能兜住最坏情况。</p>
      <div class="quote">I always think it's good to put a limiter at the end of your chain... that will make certain that you're in the right basically constrained color space.</div>
      <div class="relation">机制：limiter 把输出约束在交付色域内，避免越界色彩。</div>
    </div>
    <div class="card card card-purple">
      <h3>作者习惯：LUT 放链路末尾，先校色后套 LUT</h3>
      <p>Natasha 本人倾向把 LUT 放在链路末尾：先校色、后套 LUT，全程知道自己调色板的约束、对比曲线与最终色彩，非常省时且清晰。这是她个人经验，两种方式都成立。</p>
      <div class="quote">I personally tend to work with a LUT at the end of my chain. I find that it's just kind of I know the constraints of my palette.</div>
      <div class="relation">好处：工作全程色彩与对比值已知，效率高、可控性强。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">两种 LUT 用法对照</h2><div class="card"><table><thead><tr><th>维度</th><th>LUT 放开头</th><th>LUT 放末尾</th></tr></thead><tbody><tr><td>工作顺序</td><td>先套 LUT 再校色</td><td>先校色后套 LUT</td></tr><tr><td>主要风险</td><td>显示器不可见颜色在 P3 显形</td><td>需自己管理调色板与色域</td></tr><tr><td>必要措施</td><td>链路末尾加 DCI P3 limiter</td><td>建立已知的色板与对比曲线</td></tr><tr><td>效率</td><td>取决于校色习惯</td><td>作者认为更省时、更清晰</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>两种方式都以最终交付落在目标色域内为前提；不放 limiter 时 P3 投影有色彩意外风险。</li><li>作者的末尾用法是个人经验，不代表唯一正确；适合其工作流程，其他流程可自由选择。</li><li>视频只讲 LUT 摆放位置，不涉及具体 LUT 的制作与选择。</li></ul><div class="pitfall">把 LUT 放链路开头却不加 limiter，直接交付 P3 投影。</div><div class="pitfall">只在显示器上确认颜色就交付，忽视目标色域差异。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>LUT 可以放链路开头，但必须用 DCI P3 limiter 保护交付色域。</li><li>LUT 放链路末尾、先校色后套 LUT，全程在已知色板内工作。</li><li>两种方式都成立，关键是最终输出落在目标色域内。</li></ul><h3>行动清单</h3><ol><li>若 LUT 放开头，在链路末尾加 DCI P3 limiter。</li><li>明确你的交付色域（Rec.709 / P3 / 其他），全程对照。</li><li>建立自己的调色板与对比曲线认知，提高工作可控性。</li></ol><h3>关键认知转变</h3><p>从「LUT 放哪都行」到「LUT 位置必须与交付色域管理配套」——摆放不是口味问题，是风险管理问题。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 视频 2分08秒 · LUT 使用技巧</div>
</div>
    </div>
  </foreignObject>
</svg>