      <div class="container root-wrap">
  <h1>家里拥挤？利用颜色把家变大!</h1>
  <div class="meta"><span class="tag tag-blue">家装设计</span><span class="tag tag-green">膨胀色</span><span class="tag tag-orange">收缩色</span><span class="tag tag-purple">小户型</span><span class="tag tag-red">色彩</span><span class="tag tag-gray">门套</span><span class="tag tag-gray">时长 75秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/AHpHYIropek">原视频</a>
  <div class="summary-line">同大色块定义膨胀色与收缩色：前者显大靠前，后者显小退后。客厅用前景膨胀色 + 背景收缩色做层次显大；位置反了会互相挤压。同一对概念延伸到走廊、灯光强化与门窗套范围。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">红=膨胀色更近；黑=收缩色更远</span></div><div class="timeline-item"><span class="timeline-time">00:12</span><span class="timeline-text">全米色糊成一片 → 家具膨胀色 + 背景收缩色</span></div><div class="timeline-item"><span class="timeline-time">00:27</span><span class="timeline-text">禁忌：膨胀色在后、收缩色在前 → 挤小</span></div><div class="timeline-item"><span class="timeline-time">00:37</span><span class="timeline-text">调换位置 → 层次与显大恢复</span></div><div class="timeline-item"><span class="timeline-time">00:45</span><span class="timeline-text">走廊远近、灯光强化、门窗套扩大范围</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">膨胀色<br/>显大 / 强化主体 / 向前挤</div><span class="arrow">→</span><div class="node-green">收缩色<br/>显小 / 弱化主体 / 向后退</div><span class="arrow">→</span><div class="node-orange">正确前后<br/>前膨胀 + 后收缩</div><span class="arrow">→</span><div class="node-blue">延伸<br/>走廊·灯光·门窗套</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>「膨胀色／收缩色」按画面字幕保留，不改写成其他色彩学术语。</p><p>误区：到处涂亮色就能显大。位置错误（膨胀在后、收缩在前）会挤小。</p><p>误区：只改墙面色。视频把家具主体、背景、门套窗套范围一并纳入同一逻辑。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>定义：膨胀色 vs 收缩色</h3>
      <p>两个一样大的色块对照：红色膨胀色显大、强化主体、感觉更近；黑色收缩色显小、弱化主体、感觉更远。后续所有建议都建立在这对可演示定义上。</p>
      <div class="quote">红色是膨胀色……黑色是收缩色</div>
      <div class="relation">先记住前后感，再谈搭配。</div>
    </div>
    <div class="card card-green">
      <h3>客厅公式：前膨胀 + 后收缩</h3>
      <p>全米色会糊在一起没层次。把沙发等主体换成膨胀色、背景换成收缩色：主体被突出，视线被拉长，房间更显大。</p>
      <div class="quote">把沙发换成膨胀色，背景换成收缩色……让房间更显大</div>
      <div class="relation">层次来自前后色差，不是来自颜色数量。</div>
    </div>
    <div class="card card-red">
      <h3>禁忌：前后反了会挤小</h3>
      <p>膨胀色在后、收缩色在前时，一前一后对挤，房间显小。注意事项页用「向前挤／向后退」把机制画清楚，调换后层次与显大同时回来。</p>
      <div class="quote">膨胀色不要在后边，收缩色不要在前边……房间就显小</div>
      <div class="relation">先查位置，再加饱和度。</div>
    </div>
    <div class="card card-orange">
      <h3>延伸：走廊、灯光、门窗套</h3>
      <p>走廊用收缩色显狭长，换膨胀色可弱化；灯光提亮能强化膨胀；门套窗套用膨胀色扩大开口的开阔大气感，且范围越大越明显。</p>
      <div class="quote">门套……换成膨胀色就会显得更开阔更大气；膨胀色的范围越大……越开阔越明亮</div>
      <div class="relation">同一对颜色逻辑，换到通道与开口。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>75 秒色彩知觉短片，不含完整配色体系、漆号或照明计算。</li><li>红/黑模型是极端对照，实际家装需按材质与光照折中。</li><li>「显大」指观感，不是建筑面积变化。</li></ul><div class="pitfall">把膨胀色铺在远端背景、收缩色放在身前家具。</div><div class="pitfall">全屋同明度米色，缺乏前后层次却怪户型小。</div><div class="pitfall">门套窗套长期用深收缩色，开口显得小气却只加灯不改色。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>膨胀色向前、收缩色退后，是显大的基本前后关系</li><li>客厅：主体膨胀色 + 背景收缩色</li><li>同一逻辑可用于走廊、灯光强化与门窗套范围</li></ul><h3>行动清单</h3><ol><li>拍一张客厅正面照，标出「最靠前的大件」与「最靠后的墙/柜」颜色</li><li>若前后明度接近，先把主体家具或靠垫换成相对膨胀的色</li><li>检查门套窗套：过深则试浅膨胀色边框或扩大浅色范围</li><li>走廊尽端若过暗过缩，优先改尽端或侧墙的收缩/膨胀关系，再补灯</li></ol><h3>关键认知转变</h3><p>以前：觉得拥挤就拼命涂浅色或加灯；现在：先固定膨胀色与收缩色的前后位置，再把灯光和门窗套范围当作同一套显大工具。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 75秒</div>
</div>
    </div>
  </foreignObject>
</svg>