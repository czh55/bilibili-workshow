<div class="svg-page">
  <div class="container">
    <h1>去掉 AI 塑料感：三类提示词如何重建真实照片感</h1>
    <div class="meta">
      <span class="tag tag-blue">小红书</span>
      <span class="tag tag-green">1分27秒</span>
      <span class="tag tag-orange">AI 写真</span>
      <span class="tag tag-purple">提示词</span>
      <span class="tag tag-gray">理性分析</span>
    </div>
    <a class="source-link" href="http://xhslink.cn/o/5rME68lDOe8">原视频：AI太假？3招去掉“塑料感”秒变真实照片</a>
    <div class="summary-line">
      <strong>核心判断：</strong>视频主张 AI 图“一眼假”常因提示词过干净，而非模型失效；用<span class="key-data">加光源</span>、<span class="key-data">皮肤/材质细节</span>、<span class="key-data">前景·景深·运镜</span>三类可执行提示，可显著降低塑料感。这是提示工程清单，不是对任意模型或平台的普适证明。
    </div>

    <div class="timeline">
      <h3>关键证据时间轴</h3>
      <div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">提问：为什么 AI 做的图总能看出来；同图改提示词后真实感立刻不同。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">诊断：不是模型不行，很多时候是提示词太干净。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:16</span><span class="timeline-text">技巧一：加光源；均匀光照让人物假，现实光有方向与明暗。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">不要只写高清/真实/电影感，要写光影描述（自然光、侧逆光等）。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:34</span><span class="timeline-text">技巧二：加皮肤细节；过完美五官=塑料感，可写轻微瑕疵。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:46</span><span class="timeline-text">技巧三：加前景；真实照片是空间抓拍，非人物贴背景。</span></div>
      <div class="timeline-item"><span class="timeline-time">01:05</span><span class="timeline-text">操作：精准提示词 + Image 2／智能图片 V2；素材在 XL 画布生成。</span></div>
      <div class="timeline-item"><span class="timeline-time">01:21</span><span class="timeline-text">结尾复盘三类提示词：光源／皮肤材质／前景景深运镜。</span></div>
    </div>

    <div class="map">
      <h2>核心脉络</h2>
      <div class="diagram">
        <div class="node">问题<br/>一眼假 / 塑料感</div>
        <div class="arrow">→</div>
        <div class="node">诊断<br/>提示词太干净</div>
        <div class="arrow">→</div>
        <div class="node node-green">三类提示<br/>光 · 皮 · 景</div>
        <div class="arrow">→</div>
        <div class="node node-orange">行动<br/>写方向光写瑕疵写层次</div>
      </div>
    </div>

    <div class="correction">
      <h3>常见误解与认知纠偏</h3>
      <p><strong>误解：</strong>AI 图假 = 模型不行，只能换更贵模型。</p>
      <p><strong>纠偏（UP 主观点）：</strong>同样一张图，只改提示词就能拉开真实感；假感常来自“高清真实电影感”这类空词，缺少物理线索。</p>
      <p><strong>边界：</strong>三类提示可提高“像照片”的概率，不能保证所有题材/模型都无假；也未给出可复现的完整提示原文对照实验。</p>
    </div>

    <div class="section">
      <h2 class="sec-title">三类提示词拆解</h2>

      <div class="card card-green">
        <h3><span class="speaker speaker-host">技巧一</span>加光源：明确光从哪里来</h3>
        <p><strong>在讲什么：</strong>均匀光照让人物像贴图；现实光有方向、明暗、高光与阴影。</p>
        <p><strong>关键理解：</strong>写光源=给渲染器一条可计算的光学约束，而不是形容词堆砌。</p>
        <p><strong>怎么用：</strong>在提示里指定自然光／侧逆光／头顶光／场景灯光等，并描述窗边、侧逆等高光阴影落点。</p>
        <div class="quote">原文依据（字幕）：“现实里的光一定有方向”“提示词里不要只写高清、真实和电影感”“你要加上对光影的描述。” [00:21–00:30]</div>
        <div class="relation">关系：光源清晰 → 人物与背景分离 → 降低“贴图感”。</div>
      </div>

      <div class="card">
        <h3><span class="speaker speaker-host">技巧二</span>加皮肤与材质细节：别让人物太完美</h3>
        <p><strong>在讲什么：</strong>五官皮肤过完美会出塑料感；可加轻微瑕疵丰富面部细节。</p>
        <p><strong>关键理解：</strong>“真实”常表现为不完美——毛孔、肤色不均、细小纹理与皮肤反光。</p>
        <p><strong>怎么用：</strong>提示可写轻微毛孔、自然肤色不均、鼻尖高光、脸颊细小纹理、真实皮肤反光等。</p>
        <div class="quote">原文依据（字幕）：“很容易有塑料感”“提示词里面可以加轻微瑕疵”“一下子就摆脱了 AI 脸的廉价感。” [00:39–00:46]</div>
        <div class="insight">推断（基于原文）：细节词的作用是打破“磨皮广告脸”先验，而非单纯提高分辨率。</div>
      </div>

      <div class="card card-purple">
        <h3><span class="speaker speaker-host">技巧三</span>加前景、景深与运镜：让画面像被拍出来</h3>
        <p><strong>在讲什么：</strong>真实照片是镜头在空间里捕捉人物，不是人物站在背景前。</p>
        <p><strong>关键理解：</strong>前景遮挡、中景清晰、前景虚化（书架边缘、玻璃反光）提供景深与遮挡关系，接近街拍。</p>
        <p><strong>怎么用：</strong>写前景遮挡 + 景深层次；结尾清单还补上“运镜”，让静态提示也带拍摄感。</p>
        <div class="quote">原文依据（字幕）：“镜头在一个真实空间里面去捕捉人物”“更像真实街拍，而不是 AI 生成的图片。” [00:50–01:05]</div>
        <div class="pitfall">避坑：只堆“电影感”而不写空间层次，仍容易像棚拍贴图。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">横向对比：空词提示 vs 三类提示</h2>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>维度</th>
              <th>常见空词写法</th>
              <th>视频主张的写法</th>
              <th>预期效果</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>光照</td>
              <td>“高清、真实、电影感”</td>
              <td>写光源方向与高光阴影</td>
              <td>人物不再均匀贴脸</td>
            </tr>
            <tr>
              <td>皮肤</td>
              <td>默认完美脸</td>
              <td>轻微瑕疵 / 毛孔 / 纹理</td>
              <td>降低塑料感与廉价感</td>
            </tr>
            <tr>
              <td>空间</td>
              <td>人物 + 背景平铺</td>
              <td>前景遮挡、景深、运镜</td>
              <td>更像街拍抓拍</td>
            </tr>
            <tr>
              <td>工具</td>
              <td>换模型碰运气</td>
              <td>精准提示 + Image 2／XL 画布</td>
              <td>降低门槛、可批量</td>
            </tr>
          </tbody>
        </table>
        <div class="highlight">立场分层：对比表中的“效果”来自 UP 主演示与口头结论，不是盲测数据；适用边界是人像／写真类生成，未覆盖风景、产品静物等。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">工具主张与方法边界</h2>
      <div class="card card-orange">
        <h3>XL 画布 + Image 2／智能图片 V2</h3>
        <p><strong>事实（画面可核）：</strong>操作段展示画布缩略图阵列与对话式生成面板；可见“可灵／智能图片 V2”类菜单；字幕写“我都是在 XL 上生成的”。</p>
        <p><strong>UP 主观点：</strong>精准提示词搭配新出 Image 2 同级模型，能轻松还原真实感；内置链降低门槛，并支持画布批量图视频。</p>
        <p><strong>推断：</strong>工具段落偏产品演示，三类提示词本身可迁移到其他生成器，但迁移效果未在视频中对照验证。</p>
        <div class="pitfall">边界：视频未提供完整可复制提示原文、种子参数或失败案例统计；“秒变真实”是演示修辞，不是量化指标。</div>
      </div>
    </div>

    <div class="stance-grid">
      <div class="stance-item">
        <strong>可验证事实</strong>
        时长约 1:27；章节含 Intro／三技巧／操作／结尾；画面列出光型与皮肤细节清单。
      </div>
      <div class="stance-item">
        <strong>UP 主观点</strong>
        假感主因是提示词太干净；三类提示即可让 AI 不像 AI。
      </div>
      <div class="stance-item">
        <strong>基于原文的推断</strong>
        物理线索（光／瑕疵／景深）比空泛审美形容词更能约束生成结果。
      </div>
    </div>

    <div class="conclusion">
      <h2>总结与行动</h2>
      <h3>核心要点</h3>
      <ul>
        <li>先怀疑提示词是否过干净，再怀疑模型。</li>
        <li>光源要写方向，皮肤要写不完美，空间要写前景与景深。</li>
        <li>工具（XL／Image 2）是落地通道，不是三类原则的替代品。</li>
      </ul>
      <h3>行动清单</h3>
      <ol>
        <li>删掉或降权“高清真实电影感”，改写一条带方向的光源描述。</li>
        <li>为人像追加 2–3 个轻微瑕疵词（毛孔／肤色不均／细纹理）。</li>
        <li>补一层前景遮挡或虚化（书架边、玻璃反光等）。</li>
        <li>同提示做前后对照，只改一类变量，观察塑料感是否下降。</li>
        <li>若批量生产，再考虑画布／内置链，而不是一上来换模型。</li>
      </ol>
      <h3>关键认知转变</h3>
      <p>从“换更强模型”转向“给生成器可计算的物理线索”；真实感是约束问题，不是滤镜词问题。</p>
    </div>

    <p class="footer">双轨产物之二 · 理性分析 · 证据回溯至 Whisper 分段与可见字幕</p>
  </div>
</div>

    </div>
  </foreignObject>
</svg>