<h1>眼神训练2 我又悟了</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">摄影技巧</span> <span class="tag tag-blue">人像拍照</span> <span class="tag tag-gray">32秒</span></div>
<div class="summary-line">拍照拍久了 眼睛变得无神这个时候我们只需要把我们的眉机抬起来再放松眼睛一下就会找到有神的感觉想要拍出一个好看的侧脸眼球的转动方向和脸的转动方向摇消反我现在连往右边转眼睛呢 就要往左边看这样子拍出来的侧脸的眼神就不会无神谢谢观看...</div>
