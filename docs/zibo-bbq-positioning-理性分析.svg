      <div class="container root-wrap">
  <h1>淄博烧烤没热度了怎么救｜定位理论</h1>
  <div class="meta"><span class="tag tag-blue">营销</span><span class="tag tag-green">定位</span><span class="tag tag-orange">城市</span><span class="tag tag-purple">品牌</span><span class="tag tag-gray">时长 1分50秒</span><span class="tag tag-gray">分析视角：城市品牌定位的认知资产</span></div>
  <a class="source-link" href="local:01e46dcd572e169301037103884d8553a5_4610.mp4video.MP4">原视频（本地文件）</a>
  <div class="summary-line">核心判断：淄博烧烤的流量衰减，是因为定位定在了物理属性（烧烤好吃），而物理属性极易被复制。里斯/特劳特的定位理论要求定在认知层面：淄博真正占据心智的认知资产是「人情味」——师傅摇扇子、送学子吃烧烤。定位「人情味的淄博，人情味的烧烤」，还能向医疗、养老、美容等产业延伸。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">设问：淄博烧烤没热度了，如果你是市长怎么办</span></div><div class="timeline-item"><span class="timeline-time">00:04</span><span class="timeline-text">别「不在其位不谋其政」，那是螺丝钉心态</span></div><div class="timeline-item"><span class="timeline-time">00:10</span><span class="timeline-text">方法：里斯/特劳特定位理论重新定位城市</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">定位定住，流量随之而来（王老吉、汉庭类比）</span></div><div class="timeline-item"><span class="timeline-time">00:28</span><span class="timeline-text">大V探店：烧烤多好吃不予置评，市民老板是真热情</span></div><div class="timeline-item"><span class="timeline-time">00:45</span><span class="timeline-text">定位要定认知层面，不能是物理属性</span></div><div class="timeline-item"><span class="timeline-time">00:50</span><span class="timeline-text">物理属性易复制，认知属性占心智难挤出</span></div><div class="timeline-item"><span class="timeline-time">01:15</span><span class="timeline-text">拆解：烧烤有人情味（师傅摇扇子），淄博有人情味（送学子）</span></div><div class="timeline-item"><span class="timeline-time">01:40</span><span class="timeline-text">定位：人情味的淄博，人情味的烧烤</span></div><div class="timeline-item"><span class="timeline-time">01:45</span><span class="timeline-text">延伸：医疗、养老、美容等需要人情味的产业</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>淄博烧烤没热度怎么救</div><span class="arrow">→</span><div class="node-green">证据<br/>物理vs认知 + 人情味证据</div><span class="arrow">→</span><div class="node-orange">判断<br/>定位定在认知层面的独特资产</div><span class="arrow">→</span><div class="node-blue">行动<br/>主打人情味，向多产业延伸</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误解 1：淄博的卖点是烧烤好吃。纠偏：口味是物理属性，容易被复制；认知层面的「人情味」才难被模仿。</p><p>误解 2：定位 = 发明一个新概念。纠偏：定位是把大众脑中已有的认知凸显出来，不是发明。</p><p>误解 3：不在其位不谋其政是成熟。纠偏：那是螺丝钉心态，主动思考是成长机会。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>定位要定认知层面，不是物理属性</h3>
      <p>在讲什么：定位住的东西一定是认知层面的东西，不能是物理属性——物理属性容易被复制（原材料和技术不是光刻机），认知属性一旦占据心智就很难被挤出。烧烤口味是物理属性，容易被复制。关键理解：城市品牌的护城河在心智里，不在口味里。怎么用：做任何品牌先问「这是物理资产还是认知资产」。</p>
      <div class="quote">依据 [00:45–01:00]：定位住的东西一定是认知层面的东西……物理属性的东西很容易被复制……认知属性一旦占据消费者的心智，就很难再被挤出来。</div>
      <div class="relation">立场分层：定位理论为里斯/特劳特经典框架；应用推演为讲者分析。</div>
    </div>
    <div class="card card-orange">
      <h3>淄博的认知资产：人情味</h3>
      <p>在讲什么：拆解淄博烧烤——烧烤是中央厨房做不出来的真师傅摇扇子，淄博是送学子吃烧烤换来涌泉相报，核心都是人情味。关键理解：大V探店都说「烧烤不予置评但市民老板真热情」，印证认知资产在人情味。怎么用：品牌定位找「竞品固有属性的对立面」，对方用中央厨房，你就用人情味。</p>
      <div class="quote">依据 [01:15–01:39]：淄博烧烤是真的有个师傅把自己烧成个煤炭人，为你尽心尽力摇扇子……这里面是什么？人情味。</div>
      <div class="relation">立场分层：人情味证据为讲者观察归纳；「定位找对立面」为定位理论核心。</div>
    </div>
    <div class="card card-purple">
      <h3>落地：广告与产业延伸</h3>
      <p>在讲什么：把「人情味的淄博，人情味的烧烤」贴到各大机场高速广告牌；定位定住后，淄博可发展所有特别需要人情味的产业——医疗、养老、美容等。关键理解：定位是战略资产，能向关联产业复用。怎么用：城市/品牌定位选词时，优先选可延伸的认知词。</p>
      <div class="quote">依据 [01:40–01:50]：如果人情味这个定位给定住了，淄博是将来可以发展所有特别需要人情味的产业，医疗、养老、美容等等。</div>
      <div class="relation">立场分层：广告方案为讲者创意；产业延伸逻辑为定位理论应用。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">物理属性 vs 认知属性定位</h2><div class="card"><table><thead><tr><th>维度</th><th>物理属性（烧烤好吃）</th><th>认知属性（人情味）</th></tr></thead><tbody><tr><td>可复制性</td><td>极易复制</td><td>占据心智难挤出</td></tr><tr><td>证据</td><td>口味/食材/技术</td><td>师傅摇扇子、送学子</td></tr><tr><td>护城河</td><td>无</td><td>强</td></tr><tr><td>延伸性</td><td>弱</td><td>可延伸医疗养老美容</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>适用：品牌/城市营销从业者、创业者、定位理论学习者。</li><li>上限：定位是战略起点，还需产品、运营、传播落地。</li><li>反例：光喊口号没有真实认知支撑，会被吐槽。</li><li>例外：认知资产的建立需要真实事件支撑，不能硬造。</li></ul><div class="pitfall">避坑：别把「好吃」当定位——口味是最容易被复制和超越的。</div><div class="pitfall">避坑：人情味定位需要持续的真实案例支撑，别只喊口号。</div><div class="pitfall">避坑：广告投放前先验证认知是否已在大众脑中。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>定位定在认知层面，而不是物理属性。</li><li>淄博的认知资产是「人情味」，不是烧烤好吃。</li><li>定位是战略资产，能向关联产业延伸。</li></ul><h3>行动清单</h3><ol><li>为你的城市/品牌找到「竞品固有属性的对立面」。</li><li>验证这个认知是否已在大众脑中，然后凸显它。</li><li>评估定位词的产业延伸空间。</li></ol><h3>关键认知转变</h3><p>从「好吃就能火」转到「占住认知才能长红」：流量可以被制造，心智占领才是护城河。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 1分50秒</div>
</div>
