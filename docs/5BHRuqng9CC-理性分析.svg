<h1>用闪光灯快门速度为什么要最好在1/250秒？</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">摄影技巧</span> <span class="tag tag-blue">灯光</span> <span class="tag tag-gray">4:18</span></div>
<div class="summary-line">用閃光燈快門速度最好定在250分之一秒250分之一秒是閃光燈效率最高的快門速度也是目前主流相機閃光燈最高的同步速度有些相機可能只有200分之一秒或者180分之一秒這個值在你購買相機產品的說明書上有或者你直接擺度一下某某型號的相機都能找得到這裡說的閃光燈極限效率甚至你的閃光燈功率不是太高但是又想在比較...</div>
<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">用閃光燈快門速度最好定在250分之一秒</span></div>
<div class="timeline-item"><span class="timeline-time">[00:04]</span><span class="timeline-text">250分之一秒是閃光燈效率最高的快門速度</span></div>
<div class="timeline-item"><span class="timeline-time">[00:07]</span><span class="timeline-text">也是目前主流相機閃光燈最高的同步速度</span></div>
<div class="timeline-item"><span class="timeline-time">[00:11]</span><span class="timeline-text">有些相機可能只有200分之一秒或者180分之一秒</span></div>
<div class="timeline-item"><span class="timeline-time">[00:15]</span><span class="timeline-text">這個值在你購買相機產品的說明書上有</span></div>
<div class="timeline-item"><span class="timeline-time">[00:18]</span><span class="timeline-text">或者你直接擺度一下某某型號的相機都能找得到</span></div>
<div class="timeline-item"><span class="timeline-time">[00:21]</span><span class="timeline-text">這裡說的閃光燈極限效率</span></div>
<div class="timeline-item"><span class="timeline-time">[00:24]</span><span class="timeline-text">甚至你的閃光燈功率不是太高</span></div>
<div class="timeline-item"><span class="timeline-time">[00:26]</span><span class="timeline-text">但是又想在比較亮的陽光或者逆光下壓光時的做法</span></div>
<div class="timeline-item"><span class="timeline-time">[00:31]</span><span class="timeline-text">如果是一天夜景或者是室內就不需要</span></div>
<div class="timeline-item"><span class="timeline-time">[00:34]</span><span class="timeline-text">我們平常用的主流閃光燈全光輸出</span></div>
<div class="timeline-item"><span class="timeline-time">[00:37]</span><span class="timeline-text">閃爍的時間大概是在千分之一秒之內就能完成</span></div>
<div class="timeline-item"><span class="timeline-time">[00:41]</span><span class="timeline-text">如果是小功率的輸出</span></div>
<div class="timeline-item"><span class="timeline-time">[00:42]</span><span class="timeline-text">甚至幾萬分之一秒之內就能完成</span></div>
<div class="timeline-item"><span class="timeline-time">[00:45]</span><span class="timeline-text">這是因為這麼短的閃爍時間</span></div>
<div class="timeline-item"><span class="timeline-time">[00:47]</span><span class="timeline-text">所以閃光燈才有凝固性一說</span></div>
<div class="timeline-item"><span class="timeline-time">[00:50]</span><span class="timeline-text">它能夠瞬間把運動的物體凝固住</span></div>
<div class="timeline-item"><span class="timeline-time">[00:53]</span><span class="timeline-text">這也是我們用閃光燈拍攝的時候</span></div>
<div class="timeline-item"><span class="timeline-time">[00:55]</span><span class="timeline-text">主體成像特別紮實的原因</span></div>
<div class="timeline-item"><span class="timeline-time">[00:57]</span><span class="timeline-text">對同一款閃光燈來說輸出越小</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>用閃光燈快門速度最好定在250分之一秒</li>
<li>250分之一秒是閃光燈效率最高的快門速度</li>
<li>也是目前主流相機閃光燈最高的同步速度</li>
<li>有些相機可能只有200分之一秒或者180分之一秒</li>
<li>這個值在你購買相機產品的說明書上有</li>
<li>或者你直接擺度一下某某型號的相機都能找得到</li>
<li>這裡說的閃光燈極限效率</li>
<li>甚至你的閃光燈功率不是太高</li>
<li>但是又想在比較亮的陽光或者逆光下壓光時的做法</li>
<li>如果是一天夜景或者是室內就不需要</li>
<li>我們平常用的主流閃光燈全光輸出</li>
<li>閃爍的時間大概是在千分之一秒之內就能完成</li>
<li>如果是小功率的輸出</li>
<li>甚至幾萬分之一秒之內就能完成</li>
<li>這是因為這麼短的閃爍時間</li>
<li>所以閃光燈才有凝固性一說</li>
<li>它能夠瞬間把運動的物體凝固住</li>
<li>這也是我們用閃光燈拍攝的時候</li>
<li>主體成像特別紮實的原因</li>
<li>對同一款閃光燈來說輸出越小</li>
<li>它的凝固性就越強</li>
<li>比如我們平常用的旗艦型機警燈</li>
<li>它在最小輸出時凝固性甚至可以達到兩萬分之一秒</li>
<li>在這種情況之下拍攝對象的高速運動</li>
<li>或者攝影師手的劇烈抖動都不影響成像的紮實</li>
<li>凝固性是閃光燈區別於長亮燈最好玩的一點</li>
<li>你可以用來拍一些定格的畫面</li>
<li>暗光拍攝中如果你嫌棄自己的相機的高感不夠好</li>
<li>甚至可以用非常低的快門速度</li>
<li>還能保證拍片不糊</li>
<li>所以盡量買功率高一點的閃光燈</li>
<li>然後減小輸出拍攝</li>
<li>效果會比小功率的閃光燈好很多</li>
<li>無論是凝固性還是回電速度</li>
<li>或者拍攝張數上都好很多</li>
<li>明白這個道理之後你就不會問我</li>
<li>多少功率的燈夠不夠了</li>
<li>當然功率更高的燈會更重更貴</li>
<li>隨著你要找到一個平衡點</li>
<li>在可能的情況之下</li>
<li>功率盡量高一點總是不會錯的</li>
<li>來看一下這張示意圖</li>
<li>黃線代表著快門打開的時間</li>
<li>藍線代表著閃光燈閃爍的時間</li>
<li>我們先假設拍張逆光的人物</li>
<li>拍攝主體曝光主要來自於閃光燈</li>
<li>你會發現閃光燈很快就會完成了</li>
<li>對人物主體的曝光</li>
<li>剩下的黃線的長短就影響著黃鏡光的亮暗</li>
<li>黃線越長代表著環境光曝光越多</li>
<li>環境越亮</li>
<li>黃線越短代表著環境光曝光越短</li>
<li>環境也越暗</li>
<li>所以說在陽光下有效的壓光</li>
<li>我們就有必要把黃線做得盡量短</li>
<li>可不可以短於250分之1秒呢</li>
<li>或者說短的跟藍線一樣長度呢</li>
<li>如果黃線和藍線長度一樣</li>
<li>就是代表著壓光效率最高的那個點</li>
<li>可惜相機做不到</li>
<li>因為它機械連目式快門移動的時間</li>
<li>最低也要需要250分之1秒</li>
<li>如果是電子快門的族行讀取</li>
<li>那速度更慢</li>
<li>這也是最高同步速度的由來</li>
<li>所以說黃線最短的極限是250分之1秒</li>
<li>這也是我們為什麼用閃光燈拍攝時</li>
<li>把相機快門設置到250分之1秒的原因</li>
<li>有人說可以打開高速同步</li>
<li>這樣可以把快門提高到250分之1秒以上</li>
<li>高速同步是一個特殊的模式</li>
<li>快門不再是打開曝光放下這種狀態</li>
<li>而變成了夾縫掃描底片的狀態</li>
<li>為了保證每一個夾縫都被閃光燈照到</li>
<li>閃光燈就變成了脈衝閃爍的狀態</li>
<li>它單車的亮度會極具的衰減</li>
<li>開啟高速同步並不有助於壓光</li>
<li>反倒會讓閃光燈的效率下降</li>
<li>所以在極限用燈的情況之下</li>
<li>盡量不要開高速同步</li>
<li>外景為了虛化背景大光圈拍攝</li>
<li>速度限制不到250分之1秒以下怎麼辦呢</li>
<li>有些攝影師使用了鏡頭減光鏡</li>
<li>這是個辦法</li>
<li>不過稍現麻煩</li>
<li>我覺得需要用就用吧</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>用閃光燈快門速度最好定在250分之一秒250分之一秒是閃光燈效率最高的快門速度也是目前主流相機閃光燈最高的同步速度有些相機可能只有200分之一秒或者180分之一秒這個值在你購買相機產品的說明書上有或者你直接擺度一下某某型號的相機都能找得到這裡說的閃光燈極限效率甚至你的閃光燈功率不是太高但是又想在比較亮的陽光或者逆光下壓光時的做法如果是一天夜景或者是室內就不需要我們平常用的主流閃光燈全光輸出閃爍的時</p><p>转录分段: 101 | 时长: 4:18</p></div>
