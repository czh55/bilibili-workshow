      <div class="container root-wrap">
  <h1>额头美学设计</h1>
  <div class="meta"><span class="tag tag-blue">面部美学</span><span class="tag tag-green">额头</span><span class="tag tag-orange">眉骨</span><span class="tag tag-purple">美学</span><span class="tag tag-gray">时长 0分13秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/2XIklA1WYa6">原视频</a>
  <div class="summary-line">额头美学是比例游戏：宽窄与下颌呼应、高低与眉毛联动、后倾靠额肌结节过渡、前凸靠眉骨承接。设计的关键是让额头与下半脸形成连贯的比例关系。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">额头宽下颌就要宽，额头窄下颌就要窄</span></div><div class="timeline-item"><span class="timeline-time">00:05</span><span class="timeline-text">额头高眉毛就要高</span></div><div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">额头后倾，额肌结节就要出来</span></div><div class="timeline-item"><span class="timeline-time">00:11</span><span class="timeline-text">额头前凸，眉骨就要出来</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">额头宽窄<br/>与下颌呼应</div><span class="arrow">→</span><div class="node-green">额头高低<br/>与眉毛联动</div><span class="arrow">→</span><div class="node-orange">后倾额头<br/>额肌结节过渡</div><span class="arrow">→</span><div class="node-blue">前凸额头<br/>眉骨承接</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误区：额头独立设计。实际宽窄、高低都要与下半脸联动。</p><p>误区：额头前凸直接垫高。实际要靠眉骨承接，后倾要靠额肌结节过渡。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card">
      <h3>三组联动规则：额头从来不是孤立对象</h3>
      <p>额头宽下颌就要宽，额头窄下颌就要窄；额头高眉毛就要高；额头后倾额肌结节就要出来；额头前凸眉骨就要出来。四组规则共同说明：额头设计的关键是与眉毛、下颌的比例联动。</p>
      <div class="quote">额头宽，下颌就要宽；额头窄，下颌就要窄。</div>
      <div class="relation">结构逻辑：上下比例呼应 + 过渡结构承接。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">额头设计联动规则</h2><div class="card"><table><thead><tr><th>额头状态</th><th>联动要求</th><th>作用</th></tr></thead><tbody><tr><td>宽</td><td>下颌要宽</td><td>上下比例呼应</td></tr><tr><td>窄</td><td>下颌要窄</td><td>上下比例呼应</td></tr><tr><td>高</td><td>眉毛要高</td><td>眉眼联动</td></tr><tr><td>后倾</td><td>额肌结节出来</td><td>过渡结构</td></tr><tr><td>前凸</td><td>眉骨出来</td><td>承接结构</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>本视频为 13 秒美学速览，高度浓缩，未展开具体方案。</li><li>额头设计需结合颅骨基础与整体脸型，个体差异大。</li></ul><div class="pitfall">单独评估额头——忽略与下颌、眉毛的联动。</div><div class="pitfall">前凸额头不处理眉骨——缺少承接，比例失衡。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>额头宽窄与下颌呼应，高低与眉毛联动。</li><li>后倾靠额肌结节过渡，前凸靠眉骨承接。</li><li>额头设计是上下比例的整体游戏。</li></ul><h3>行动清单</h3><ol><li>评估额头时同时对比下颌宽度。</li><li>观察额头高低与眉毛位置的关系。</li><li>按额头倾/凸状态确认过渡结构需求。</li></ol><h3>关键认知转变</h3><p>从「单独看额头」到「额头与下颌、眉毛联动看」——额头美学是比例呼应，不是孤立指标。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 视频 13 秒 · 面部美学速览</div>
</div>
