  <foreignObject x="0" y="0" width="1320" height="8394">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
  *{margin:0;padding:0;box-sizing:border-box}
  .page{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b;min-height:100%}
  .container{max-width:1200px;margin:0 auto}
  h1{font-size:40px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;line-height:1.25}
  h2{font-size:26px;font-weight:700;color:#1e40af;margin:32px 0 16px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
  h3{font-size:20px;font-weight:700;color:#334155;margin-bottom:12px}
  h4{font-size:16px;color:#1e40af;margin:14px 0 6px}
  p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}
  ul,ol{padding-left:24px;margin:8px 0}
  li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:6px}
  .tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}
  .tag-blue{background:#dbeafe;color:#1e40af}.tag-green{background:#d1fae5;color:#065f46}.tag-orange{background:#ffedd5;color:#9a3412}.tag-purple{background:#ede9fe;color:#6b21a8}.tag-red{background:#fee2e2;color:#991b1b}.tag-gray{background:#f1f5f9;color:#64748b}
  .meta{margin:12px 0 20px}.summary-line{font-size:18px;line-height:1.7;color:#334155;padding:20px 24px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
  .source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
  .timeline{background:#fff;border-radius:16px;padding:24px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
  .timeline h3{color:#1e40af;margin-bottom:12px}.timeline-item{display:flex;align-items:baseline;padding:9px 0;border-bottom:1px solid #f1f5f9}.timeline-time{font-size:14px;font-weight:700;color:#3b82f6;min-width:92px;font-variant-numeric:tabular-nums}.timeline-text{font-size:15px;color:#475569}
  .map{background:#fff;border-radius:20px;padding:36px;margin-bottom:28px;box-shadow:0 4px 24px rgba(0,0,0,.06)}.map h2{font-size:24px;margin-top:0;border-bottom:none;padding-bottom:0}.diagram{display:flex;align-items:stretch;justify-content:center;gap:12px;flex-wrap:nowrap;padding:20px 0}.node{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:16px;padding:20px 18px;text-align:center;flex:1;font-weight:700;font-size:15px;color:#1e40af}.node small{display:block;margin-top:8px;font-weight:500;line-height:1.5}.node-green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}.node-orange{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}.arrow{font-size:24px;color:#94a3b8;align-self:center}
