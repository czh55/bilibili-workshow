.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>暗调青绿胶片风，把普通街景调成电影截图</h1>
  <div class="meta"><span class="tag tag-blue">达芬奇</span><span class="tag tag-green">暗调</span><span class="tag tag-orange">青绿</span><span class="tag tag-purple">胶片风</span><span class="tag tag-red">黑柔</span><span class="tag tag-gray">时长 5分37秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/2IhTyeID7YZ">原视频</a>
  <div class="summary-line">高反差亮调街景→低反差暗调电影感：HDR 上压仍抬 Highlight 保光感，分区让天暗、中间与水面亮，密度压天蓝，一级轮暖冷+向量靠青，图层黑柔与柔和对比度收「又暗又亮」。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">目标：低反差暗调但保光感</span></div><div class="timeline-item"><span class="timeline-time">00:37</span><span class="timeline-text">HDR：Light/Shadow 降 + Highlight 抬</span></div><div class="timeline-item"><span class="timeline-time">01:09</span><span class="timeline-text">分区：建筑对比、天空渐变+限定、水面对比</span></div><div class="timeline-item"><span class="timeline-time">02:21</span><span class="timeline-text">蓝青密度压天空明度</span></div><div class="timeline-item"><span class="timeline-time">02:50</span><span class="timeline-text">一级轮冷暖 + 向量蓝→青</span></div><div class="timeline-item"><span class="timeline-time">03:38</span><span class="timeline-text">黑柔图层 + 柔和对比度样条线</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">影调<br/>上压反差保光感</div><span class="arrow">→</span><div class="node-green">分区<br/>天暗 / 中间亮</div><span class="arrow">→</span><div class="node-orange">染色<br/>暖高光 + 青绿暗</div><span class="arrow">→</span><div class="node-blue">质感<br/>黑柔 + 柔和对比</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「打不进」校正为「达芬奇」；「要的加P」校正为「Option+P」；「终会」校正为「中灰」；「高光暖暗不冷」校正为「高光暖暗部冷」；「中晖」校正为「中灰」；「Android Out加L」校正为「Alt/Option+L」；「合成模式改成绿色」校正为「滤色（Screen）」；「高丝模糊」校正为「高斯模糊」；「柔和对不堵」校正为「柔和对比度」；「波感」校正为「波谷」；「大屏光」校正为「大平光」；「现场分享」校正为「知识分享」。</p><p>误区：只全局压暗。没有分区与 Highlight 回光感会闷死。</p><p>误区：天空不够暗就继续猛压前链路曝光。可用密度降明度。</p><p>误区：黑柔力度过大就反复改曲线。可复合后降增益。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-orange">
      <h3>暗调不是闷死：上压 + 找回光感</h3>
      <p>要低反差暗调选上往下压：降 Light，略降 Shadow 让暗部收缩下移，再抬 Highlight 把光感拉回。波形中灰以下往暗压，上半相对保住。</p>
      <div class="quote">再稍微提高一点Highlight色轮的曝光，让它的光感能够回来</div>
      <div class="relation">三种降反差里，暗调优先「上往下压」。</div>
    </div>
    <div class="card card-green">
      <h3>分区：暴雨前晴天的明暗叙事</h3>
      <p>参考天暗、建筑亮、水面偏亮。中间略加对比；天空渐变+限定器压暗；水面遮罩加对比去灰。风格靠分区成立，不靠单节点全局。</p>
      <div class="quote">就必须要分区调整……天空有云但是偏暗，但地面的受光面又偏亮</div>
      <div class="relation">渐变方向常上→下，建筑在侧要用限定器保护。</div>
    </div>
    <div class="card ">
      <h3>密度：天空再暗一点的巧劲</h3>
      <p>前链路别再死压曝光。蓝青加密度降明度，不够再略全局密度，往往比继续拧曝光更舒服。</p>
      <div class="quote">因为增加密度会降低明度</div>
      <div class="relation">密度是染色前的天空收口。</div>
    </div>
    <div class="card card-purple">
      <h3>青绿染色：回调 + 蓝靠青</h3>
      <p>一级轮亮暖、中灰回调、暗冷。参考偏青时用向量蓝→青并略降青饱和，比色轮硬磨更直观。</p>
      <div class="quote">我不建议你用色轮再去磨了……用蜘蛛网去调，这个更加直观</div>
      <div class="relation">先有冷暖骨架，再靠青收色相。</div>
    </div>
    <div class="card card-red">
      <h3>黑柔与柔和对比度：又暗又亮的最后一公里</h3>
      <p>图层滤色+高斯模糊满+曲线做黑柔，过强则复合后降增益。柔和对比度样条线压缩高光/暗部两端，保护中低调反差——决定「又暗又亮」能否成立。</p>
      <div class="quote">这一步就取决于你画面能不能实现又暗又亮的效果</div>
      <div class="relation">素材需大光比，忌大平光与顺光。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>黑柔为后期模拟，与真实滤镜光学特性不完全等价。</li><li>青绿冷暖为该参考审美，非唯一街景正解。</li><li>合成模式名称以达芬奇界面为准（滤色/Screen）。</li><li>适用边界：大光比、场景匹配；平光素材难出同款。</li></ul><div class="pitfall">只全局压暗不做分区，中间建筑起不来。</div><div class="pitfall">压 Light 后不抬 Highlight，光感丢失。</div><div class="pitfall">天空不够暗继续猛压曝光导致断层。</div><div class="pitfall">黑柔过强发糊却反复拧曲线，忘了降复合增益。</div><div class="pitfall">平光/顺光素材硬套该风格。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>暗调＝上压反差 + Highlight 保光感</li><li>分区让天暗、主体与水面亮</li><li>密度与向量完成青绿电影色</li><li>黑柔 + 柔和对比度收「又暗又亮」</li></ul><h3>行动清单</h3><ol><li>还原后 HDR：Light/Shadow 降，Highlight 抬</li><li>并行分区：建筑对比、天空渐变+限定、水面对比</li><li>蓝青密度压天 → 一级轮冷暖 → 向量靠青</li><li>图层黑柔，过强用复合增益减淡</li><li>柔和对比度样条线压缩两端，对照参考微调</li></ol><h3>关键认知转变</h3><p>以前：全局压暗堆青绿色；现在：先影调与分区做出又暗又亮，再染色与黑柔。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 5分37秒</div>
</div>
    </div>
  </foreignObject>
</svg>