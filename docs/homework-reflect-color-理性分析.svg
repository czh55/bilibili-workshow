      <div class="container root-wrap">
  <h1>反光什么色：混合＋形转色变</h1>
  <div class="meta"><span class="tag tag-blue">反光</span><span class="tag tag-green">环境色</span><span class="tag tag-orange">形转色变</span><span class="tag tag-purple">静物</span><span class="tag tag-red">作业讲评</span><span class="tag tag-gray">时长 103秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/3WtA0rhTwXU">原视频</a>
  <div class="summary-line">蓝紫环境里茶壶底发红／粉，是固有色与环境光的混合，不是玄学。要变暖可向紫红偏移，必要时再提亮。本质是素描：面朝向变则色变——形转色变。大师用原理，不神技。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">为何这里发红</span></div><div class="timeline-item"><span class="timeline-time">00:11</span><span class="timeline-text">固有＋环境混合</span></div><div class="timeline-item"><span class="timeline-time">00:22</span><span class="timeline-text">偏暖＋蓝紫→更亮更暖</span></div><div class="timeline-item"><span class="timeline-time">00:46</span><span class="timeline-text">大师只用原理</span></div><div class="timeline-item"><span class="timeline-time">00:55</span><span class="timeline-text">向紫红偏移</span></div><div class="timeline-item"><span class="timeline-time">01:05</span><span class="timeline-text">再提亮</span></div><div class="timeline-item"><span class="timeline-time">01:18</span><span class="timeline-text">形转色变</span></div><div class="timeline-item"><span class="timeline-time">01:25</span><span class="timeline-text">瓶身侧面／肚子</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">混合<br/>固有＋环境</div><span class="arrow">→</span><div class="node-green">操作<br/>偏移＋提亮</div><span class="arrow">→</span><div class="node-orange">逻辑<br/>形转色变</div><span class="arrow">→</span><div class="node-blue">态度<br/>原理非神技</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>口播「地为什么变红」按画面校正为茶壶底／反光区偏红粉。</p><p>误区：反光＝随便加点环境固有色的纯色。应是混合结果。</p><p>误区：只改色相不看明度。演示显示有时需再提亮。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>混合公式</h3>
      <p>最终所见＝本身颜色与环境光混合；偏暖遇蓝紫可更亮更暖。</p>
      <div class="quote">它本身的颜色和环境光混合在一起，才是那个最终影响的结果</div>
      <div class="relation">先承认混合，再谈「怪颜色」。</div>
    </div>
    <div class="card card-orange">
      <h3>去神话</h3>
      <p>大师没有神乎其神乱搞，只是用原理画画。</p>
      <div class="quote">大师只是用原理来画画</div>
      <div class="relation">可学的是程序，不是气质。</div>
    </div>
    <div class="card card-red">
      <h3>操作顺序</h3>
      <p>要变暖先向紫红走；画上去没反应再稍微提亮。</p>
      <div class="quote">要变暖这地方会向紫红去走……把它稍微画亮</div>
      <div class="relation">色相优先，明度补刀。</div>
    </div>
    <div class="card card-purple">
      <h3>形转色变</h3>
      <p>面朝向转化，色彩就变；侧面与下凹肚子是当堂例证。</p>
      <div class="quote">形体朝向转化以后，它的色彩就发生了变化</div>
      <div class="relation">色彩问题先问朝向。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>解密感</p>
      <div class="quote">感性里面充满像解密一样的原理乐趣。</div>
      <div class="relation">你就发现你画画……就像解密一样</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>课堂切片约 104 秒，非完整静物课。</li><li>具体作业光源／布色以画面为准。</li><li>「我想没有人比我想的更清楚」为口语自信，非普遍断言。</li></ul><div class="pitfall">反光区直接抹环境纯色。</div><div class="pitfall">忽略朝向，全局同一环境色。</div><div class="pitfall">把看不清归因为「没有大师感觉」。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>反光是混合</li><li>偏移再提亮</li><li>形转色变</li></ul><h3>行动清单</h3><ol><li>在蓝紫衬布静物上标出反光区，写混合假设</li><li>色相向暖偏一档，不够再提明度</li><li>给瓶身分面：正／侧／底，各写一笔色倾向</li><li>复盘时用「朝向」而非「风格」解释颜色</li></ol><h3>关键认知转变</h3><p>以前：猜大师感觉；现在：朝向＋环境混合，按步骤偏移与提亮。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 103秒</div>
</div>
    </div>
  </foreignObject>
</svg>