<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="6065" viewBox="0 0 1320 6065">
  <foreignObject x="0" y="0" width="1320" height="6065">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}
body,.svg-page{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}
.container{max-width:1200px;margin:0 auto}
h1{font-size:36px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h2{font-size:26px;font-weight:700;color:#1e40af;margin:32px 0 16px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
h3{font-size:20px;font-weight:700;color:#334155;margin-bottom:12px}
p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}
ul,ol{padding-left:24px;margin:8px 0}
li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:6px}
.tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}
.tag-blue{background:#dbeafe;color:#1e40af}
.tag-green{background:#d1fae5;color:#065f46}
.tag-orange{background:#ffedd5;color:#9a3412}
.tag-purple{background:#ede9fe;color:#6b21a8}
.tag-red{background:#fee2e2;color:#991b1b}
.tag-gray{background:#f1f5f9;color:#64748b}
.meta{margin:12px 0 20px}
.summary-line{font-size:18px;line-height:1.7;color:#334155;padding:20px 24px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline{background:#fff;border-radius:16px;padding:24px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline h3{color:#1e40af;margin-bottom:12px}
.timeline-item{display:flex;align-items:baseline;padding:8px 0;border-bottom:1px solid #f1f5f9}
.timeline-time{font-size:14px;font-weight:700;color:#3b82f6;min-width:70px;font-variant-numeric:tabular-nums}
.timeline-text{font-size:15px;color:#475569}
.map{background:#fff;border-radius:20px;padding:36px;margin-bottom:28px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.map h2{font-size:24px;margin-top:0;border-bottom:none;padding-bottom:0}
.diagram{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:20px 0}
.node{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:16px;padding:20px 28px;text-align:center;min-width:160px;font-weight:700;font-size:16px;color:#1e40af}
.node-green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}
.node-orange{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}
.arrow{font-size:24px;color:#94a3b8}
.correction{background:linear-gradient(135deg,#fef3c7,#fef9c3);border-left:4px solid #f59e0b;padding:20px 24px;border-radius:12px;margin-bottom:24px}
.correction h3,.correction p{color:#92400e}
.section{margin-bottom:32px}
.sec-title{font-size:22px;font-weight:700;color:#1e40af;margin-bottom:16px;padding-left:16px;border-left:4px solid #3b82f6}
.card{background:#fff;border-radius:16px;padding:32px;margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.06);border-left:5px solid #3b82f6}
.card.card-green{border-left-color:#10b981}
.card.card-orange{border-left-color:#f59e0b}
.card.card-purple{border-left-color:#8b5cf6}
.card.card-red{border-left-color:#ef4444}
.card h3{font-size:20px;font-weight:700;color:#1e40af;margin-bottom:12px}
.card .highlight{background:#fef3c7;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#92400e;border-left:4px solid #f59e0b}
.card .quote{background:#f8fafc;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#64748b;border-left:4px solid #cbd5e1;font-style:italic}
.card .relation{background:#f0fdf4;padding:10px 14px;border-radius:10px;margin:8px 0;font-size:14px;color:#166534}
.card .pitfall{background:#fef2f2;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#991b1b;border-left:4px solid #ef4444}
.card .action,.card .insight{background:#eff6ff;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#1e40af;border-left:4px solid #3b82f6}
.speaker{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:12px;margin-right:8px}
.speaker-host{background:#dbeafe;color:#1e40af}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}
th{background:#f1f5f9;padding:12px 16px;text-align:left;font-weight:700;color:#1e40af;border-bottom:2px solid #cbd5e1}
td{padding:12px 16px;border-bottom:1px solid #e2e8f0;color:#475569;vertical-align:top}
tr:nth-child(even) td{background:#fafbfc}
.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:36px;margin-top:32px}
.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.stance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.stance-item{padding:18px;border-radius:12px;background:#f8fafc}
.stance-item strong{display:block;color:#334155;margin-bottom:8px}
.small{font-size:13px;color:#64748b}</style>
      
<div class="svg-page">
  <div class="container">
    <h1>拍视频一定要开Log｜斑马线100 + 10bit</h1>
    <div class="meta">
      <span class="tag tag-blue">小红书</span>
      <span class="tag tag-green">18秒</span>
      <span class="tag tag-purple">索尼微单</span>
      <span class="tag tag-orange">S-Log3</span>
      <span class="tag tag-gray">理性分析</span>
    </div>
    <a class="source-link" href="http://xhslink.cn/o/3t5oxXegXXa">原视频：拍视频一定要开Log｜斑马线100 + 10bit</a>
    <div class="summary-line">
      <strong>核心判断：</strong>视频真正回答的不是「Log 好了更好看」，而是拍视频时如何用三条可执行设置保住后期空间：开 Log（接受预览发灰）、用斑马线 100 防过曝、记录选 10 bit。证据以菜单路径演示与叠字口诀为主，属于操作经验，不构成对所有机身、场景与调色流程的普适证明。
    </div>

    <div class="timeline">
      <h3>关键证据时间轴</h3>
      <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">口诀开场：拍视频一定要开 Log；菜单停在影像质量/记录，可见 XAVC S 4K。</div></div>
      <div class="timeline-item"><div class="timeline-time">00:02</div><div class="timeline-text">纠偏发灰：嫌它灰是还没到时候；等电脑调色后质感出来。</div></div>
      <div class="timeline-item"><div class="timeline-time">00:05</div><div class="timeline-text">进入 Log 拍摄设置；随后开灵活 ISO，色域 S-Gamut3.Cine/S-Log3。</div></div>
      <div class="timeline-item"><div class="timeline-time">00:07</div><div class="timeline-text">提醒直方图有时不准；改开斑马线并定在 100。</div></div>
      <div class="timeline-item"><div class="timeline-time">00:12</div><div class="timeline-text">判读规则：画面一闪条纹 = 过曝预警（演示发白预览）。</div></div>
      <div class="timeline-item"><div class="timeline-time">00:15</div><div class="timeline-text">记录格式收尾：在 10bit 与 8bit 间选 10 比特，「就这么简单」。</div></div>
    </div>

    <div class="map">
      <h2>核心脉络</h2>
      <div class="diagram">
        <div class="node">问题<br/>预览发灰 / 怕过曝 / 后期吃紧</div>
        <div class="arrow">→</div>
        <div class="node node-orange">证据<br/>菜单演示 + 叠字口诀</div>
        <div class="arrow">→</div>
        <div class="node">判断<br/>Log + 斑马线100 + 10bit</div>
        <div class="arrow">→</div>
        <div class="node node-green">行动<br/>三条设置立刻可做</div>
      </div>
    </div>

    <div class="correction">
      <h3>常见误解与认知纠偏</h3>
      <p><strong>误解：</strong>Log 看起来灰 = 拍坏了，应该关掉。</p>
      <p><strong>纠偏：</strong>视频明确说「还没到时候」——发灰是 Log 预览常态，质感要等电脑调色后判断；是否值得开 Log，取决于你是否做调色，而不是监视器当下好不好看。</p>
    </div>

    <div class="section">
      <h2 class="sec-title">三条设置如何互相咬合</h2>

      <div class="card card-green">
        <h3>1. 开 Log：先保住动态范围叙事</h3>
        <p><strong>在讲什么：</strong>拍视频优先打开 Log；画面停在索尼「Log拍摄设置」，并演示开「灵活ISO」、色域到 S-Gamut3.Cine/S-Log3。</p>
        <p><strong>关键理解：</strong>Log 把「好看预览」换成「可调空间」；发灰不是故障，而是后期入口。</p>
        <p><strong>怎么用：</strong>进拍摄 → 影像质量/记录 → Log拍摄设置 → 开（灵活ISO），确认色域为 S-Log3 路线。</p>
        <div class="quote">原文依据（字幕）：「你就记住，拍视频一定要开Log」「有人嫌它灰」「其实那是还没到时候」「等你在电脑上一调色」</div>
        <div class="relation">关系：没有这条，后面斑马线与 10bit 都是在「已经压扁的素材」上补救。</div>
      </div>

      <div class="card card-purple">
        <h3>2. 斑马线定 100：用条纹替代「只看直方图」</h3>
        <p><span class="speaker speaker-host">UP 主观点</span>直方图有时不准，应打开斑马线并定在 100；画面一闪条纹就判定过曝。</p>
        <p><strong>关键理解：</strong>这是曝光辅助工具的优先级建议，不是否定直方图，而是给 Log 场景一个更醒目的高光警报。</p>
        <p><strong>怎么用：</strong>曝光/颜色 → 斑马线显示 → 打开，水平定 100；拍摄中看到条纹立刻降曝光。</p>
        <div class="quote">原文依据：「别光盯着那个直方图」「有时候不太准」「你就把斑马线打开」「定在100」「只要画面一闪条纹」「坏了，过曝了」</div>
        <div class="pitfall">避坑：把「定在 100」当成所有机身/所有 Log 曲线的唯一正确 IRE；视频未证明该数值可跨品牌通用。</div>
      </div>

      <div class="card card-orange">
        <h3>3. 选 10 bit：记录格式是最后一道闸</h3>
        <p><strong>在讲什么：</strong>在码率/色度选项里选 10 比特（画面可见 200M 4:2:2 10bit 与 150M 4:2:0 8bit）。</p>
        <p><strong>关键理解：</strong>10 bit 给调色更大的量化台阶；若前面开了 Log 却记 8 bit，后期空间会被压缩。</p>
        <p><strong>怎么用：</strong>动态影像设置里优先选带 10bit 的条目，而不是只看「看起来够用」的 8bit。</p>
        <div class="quote">原文依据：「剩下的你就选10比特」「就这么简单」</div>
        <div class="highlight">边界：视频未比较存储成本、机内发热、机型是否支持；「选 10bit」是在已支持选项中的偏好，不是无条件强制。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">横向对比：三条工具各自管什么</h2>
      <div class="card">
        <table>
          <thead>
            <tr>
              <th>设置</th>
              <th>主要目标</th>
              <th>视频给出的操作口诀</th>
              <th>证据强弱</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>开 Log / S-Log3</td>
              <td>预留调色空间</td>
              <td>一定要开；发灰等到调色</td>
              <td>演示 + 口诀（观点强，数据弱）</td>
            </tr>
            <tr>
              <td>斑马线 = 100</td>
              <td>高光过曝预警</td>
              <td>别只看直方图；闪条纹=过曝</td>
              <td>菜单路径清晰；阈值适用性未展开</td>
            </tr>
            <tr>
              <td>10 bit 记录</td>
              <td>降低色带/量化损失</td>
              <td>剩下就选 10 比特</td>
              <td>选项对照可见；未测画质差异</td>
            </tr>
          </tbody>
        </table>
        <p class="small">立场分层：菜单路径与字幕口诀为可核对事实；「一定要开 / 直方图不准 / 定在100」为 UP 主经验观点；「对所有索尼微单/所有场景最优」属于推断，视频未证明。</p>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">方法边界</h2>
      <div class="card card-red">
        <h3>适用条件与上限</h3>
        <ul>
          <li><strong>适用：</strong>会做电脑调色、机身支持 Log/S-Log3 与 10bit、需要保住高光层次的视频拍摄。</li>
          <li><strong>上限：</strong>18 秒口诀视频，不覆盖白平衡、曝光补偿具体数值、LUT 选择、剪辑软件调色步骤。</li>
          <li><strong>反例：</strong>直出成片、不调色的短视频；或存储/机型不支持 10bit 时，硬套口诀会碰壁。</li>
          <li><strong>例外：</strong>不同 Log 曲线与斑马线阈值对应关系可能变化；「100」需按机身说明再校准。</li>
        </ul>
        <div class="stance-grid">
          <div class="stance-item"><strong>可验证事实</strong>菜单出现 Log 拍摄、S-Gamut3.Cine/S-Log3、斑马线、10bit/8bit 选项。</div>
          <div class="stance-item"><strong>UP 主观点</strong>拍视频一定要开 Log；直方图有时不准；斑马线定 100；选 10bit 就够。</div>
          <div class="stance-item"><strong>推断（弱）</strong>这三条组合对所有题材都是最优默认；未做 A/B 画质对比。</div>
        </div>
      </div>
    </div>

    <div class="conclusion">
      <h2>总结与行动</h2>
      <h3>核心要点</h3>
      <ul>
        <li>Log 发灰是预览常态，不是立刻关掉的理由。</li>
        <li>曝光辅助：斑马线定 100，条纹=过曝警报。</li>
        <li>记录格式优先 10 bit，给调色留台阶。</li>
      </ul>
      <h3>行动清单</h3>
      <ol>
        <li>打开 Log 拍摄（灵活 ISO），确认色域到 S-Log3 路线。</li>
        <li>打开斑马线显示，水平设为 100，实拍中看见条纹就降曝光。</li>
        <li>动态影像记录选 10bit 条目，避免默认落到 8bit。</li>
        <li>成片判断放到电脑调色后，不要用机内灰预览否定 Log。</li>
        <li>若你不做调色或机身不支持，先核对是否值得启用整套流程。</li>
      </ol>
      <h3>关键认知转变</h3>
      <p>从「监视器当下好看」转向「后期空间够不够」：预览发灰可接受，过曝与 8bit 才是更难补的损失。</p>
    </div>

    <p class="footer">基于 Whisper 转录与可见字幕交叉核对 · 小红书短链保留原始 URL 以便去重</p>
  </div>
</div>

    </div>
  </foreignObject>
</svg>