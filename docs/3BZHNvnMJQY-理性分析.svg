<li>如果是白天拍攝的話</li>
<li>最好準備一塊ND濾鏡</li>
<li>盡量要快門速度的分母</li>
<li>不要超過真實的兩倍</li>
<li>即便你做好了前面所有這些</li>
<li>還是會遇到另一個非常棘手的問題</li>
<li>在展示並解決它之前</li>
<li>我們先來看一下如何讓剛才的拍攝變得更高效</li>
<li>如果你是像這樣手指跟拍的話</li>
<li>肯定會晃的人都不知道在哪裡</li>
<li>有穩定器但純靠自己去跟的話也很難</li>
<li>因為拍的人也要跑起來</li>
<li>很難兼顧構圖什麼的</li>
<li>拍個石頭不一定有一套能用的</li>
