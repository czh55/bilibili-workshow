<li>前後快速略過的參照物會顯得你跑得更快</li>
<li>而長焦帶來的空間壓縮會讓前後景看起來離你更近</li>
<li>也就會讓他們在畫面中運動得更快</li>
<li>如果只用長焦 但沒有參照物</li>
<li>速度感也是出不來的</li>
