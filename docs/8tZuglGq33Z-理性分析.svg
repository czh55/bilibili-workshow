      <div class="container">
<h1>一盏台灯打6种人像布光法</h1>
<div class="meta"><span class="tag tag-blue">小红书</span><span class="tag tag-blue">摄影灯光</span><span class="tag tag-gray">55秒</span></div>

<div class="summary-line">仅用一盏台灯就能打出6种经典人像布光：轮勃朗光（斜上45°，眼睛下方三角光区，五官立体有质感）、蝴蝶光/派拉蒙光（前上45°，鼻下阴影、脸显瘦）、侧光（左右正侧面，明显明暗对比，表现人物两面性）、轮廓光（后方光源，勾勒轮廓、制造剪影、极具艺术感）、顶光（头顶正上，神秘感、压迫感）、底光（下往上，诡异恐怖效果）。不同光位产生截然不同的视觉效果和情绪表达。</div>

<div class="map"><h2>核心脉络图</h2>
<div class="diagram">
  <div class="node node-green">轮勃朗光<br/>斜上45°<br/>立体有质</div>
  <div class="node node-green">蝴蝶光<br/>前上45°<br/>挺拔显瘦</div>
  <div class="node node-orange">侧光<br/>正侧面<br/>明暗对比</div>
</div>
<div class="diagram">
  <div class="node node-orange">轮廓光<br/>后方<br/>剪影艺术感</div>
  <div class="node">顶光<br/>正上方<br/>神秘压迫</div>
  <div class="node">底光<br/>下往上<br/>诡异恐怖</div>
</div>
</div>

<div class="card"><h3>6种人像布光对比</h3>
<table>
<tr><th>光位</th><th>光源位置</th><th>视觉效果</th><th>适用场景</th></tr>
<tr><td>轮勃朗光</td><td>斜上方45°</td><td>眼下方三角光区，五官立体</td><td>人像、艺术照</td></tr>
<tr><td>蝴蝶光(派拉蒙)</td><td>前上方45°</td><td>鼻下蝴蝶阴影，鼻挺拔脸显瘦</td><td>女性人像、明星照</td></tr>
<tr><td>侧光</td><td>左右正侧面</td><td>强烈明暗对比</td><td>表现人物两面性</td></tr>
<tr><td>轮廓光</td><td>后方</td><td>勾勒轮廓，制造剪影</td><td>艺术创作、氛围感</td></tr>
<tr><td>顶光</td><td>头顶正上</td><td>看不清眼神，神秘压迫感</td><td>悬疑、压抑氛围</td></tr>
<tr><td>底光</td><td>下往上</td><td>诡异，不自然</td><td>恐怖效果、内心活动</td></tr>
</table>
</div>

<div class="card card-green"><h3>行动清单</h3>
<ul>
<li>准备一盏可移动的台灯（或其他小型可控光源）</li>
<li>轮勃朗光和蝴蝶光是最常用的人像布光——优先掌握</li>
<li>侧光用于表现人物性格和情绪的两面性</li>
<li>轮廓光+暗背景=高级剪影效果</li>
<li>顶光/底光仅在特定情绪表达时使用</li>
</ul>
</div>

<div class="card card-red"><h3>避坑总结</h3>
<ul>
<li>不要忽视光位角度——45°和正侧面的效果天差地别</li>
<li>不要用底光拍正常人像——只适用于恐怖/诡异效果</li>
<li>顶光会让眼窝和法令纹更明显——不适合大多数常规人像</li>
</ul>
</div>

<div class="card card-orange"><h3>方法边界</h3>
<div class="boundary">
<p><strong>适用前提：</strong>单光源+可控距离和角度，暗环境更佳。</p>
<p><strong>限制：</strong>台灯功率有限，室外或大空间难以应用。多灯组合能创造更丰富的效果。</p>
<p><strong>本质：</strong>光位决定光影分布和情绪表达，同一张脸在不同光位下视觉效果完全不同。</p>
</div>
</div>

<div class="conclusion">
<h2>立场分层与结语</h2>
<h3>新手入门</h3>
<p>从轮勃朗光和蝴蝶光开始练习，用一盏台灯在家就能练。光位对了，效果立竿见影。</p>
<h3>进阶方向</h3>
<p>理解不同光位的情绪表达功能，根据拍摄主题选择合适的光位，而非盲目套用。</p>
</div></div>
    </div>
