<h1>挑战用一盏台灯💡打6种不同的人像光‼️</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">人像拍照</span> <span class="tag tag-blue">灯光</span> <span class="tag tag-gray">55秒</span></div>
<div class="summary-line">只要用一盏台灯,打六种不同的光第一种,轮不软光光源从鞋上方45度打下来流眼睛下方会出现三角光光区五官会显得立体有质第二种,骨蝶光,也叫美人光从前上方45度打下来鼻子下方会出现阴影比较显得更挺拔两侧光线偏暗,脸型会更显瘦第三种,侧光光源从左右方正侧面打过来脸部会有明显的敏感对比在临时作品中,常用来表现...</div>
<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">只要用一盏台灯,打六种不同的光</span></div>
<div class="timeline-item"><span class="timeline-time">[00:02]</span><span class="timeline-text">第一种,轮不软光</span></div>
<div class="timeline-item"><span class="timeline-time">[00:04]</span><span class="timeline-text">光源从鞋上方45度打下来</span></div>
<div class="timeline-item"><span class="timeline-time">[00:06]</span><span class="timeline-text">流眼睛下方会出现三角光光区</span></div>
<div class="timeline-item"><span class="timeline-time">[00:08]</span><span class="timeline-text">五官会显得立体有质</span></div>
<div class="timeline-item"><span class="timeline-time">[00:10]</span><span class="timeline-text">第二种,骨蝶光,也叫美人光</span></div>
<div class="timeline-item"><span class="timeline-time">[00:12]</span><span class="timeline-text">从前上方45度打下来</span></div>
<div class="timeline-item"><span class="timeline-time">[00:14]</span><span class="timeline-text">鼻子下方会出现阴影比较显得更挺拔</span></div>
<div class="timeline-item"><span class="timeline-time">[00:17]</span><span class="timeline-text">两侧光线偏暗,脸型会更显瘦</span></div>
<div class="timeline-item"><span class="timeline-time">[00:20]</span><span class="timeline-text">第三种,侧光</span></div>
<div class="timeline-item"><span class="timeline-time">[00:21]</span><span class="timeline-text">光源从左右方正侧面打过来</span></div>
<div class="timeline-item"><span class="timeline-time">[00:23]</span><span class="timeline-text">脸部会有明显的敏感对比</span></div>
<div class="timeline-item"><span class="timeline-time">[00:25]</span><span class="timeline-text">在临时作品中,常用来表现人物的两面性</span></div>
<div class="timeline-item"><span class="timeline-time">[00:29]</span><span class="timeline-text">第四种,轮廓光,光源来源于后方</span></div>
<div class="timeline-item"><span class="timeline-time">[00:32]</span><span class="timeline-text">可以勾勒出小伙伴的轮廓</span></div>
<div class="timeline-item"><span class="timeline-time">[00:34]</span><span class="timeline-text">制造阴影效果,极具隶属感</span></div>
<div class="timeline-item"><span class="timeline-time">[00:36]</span><span class="timeline-text">第五种,顶光</span></div>
<div class="timeline-item"><span class="timeline-time">[00:38]</span><span class="timeline-text">从头顶正上方打下来光</span></div>
<div class="timeline-item"><span class="timeline-time">[00:40]</span><span class="timeline-text">由于看不清眼神了,略带神秘色彩</span></div>
<div class="timeline-item"><span class="timeline-time">[00:43]</span><span class="timeline-text">会给人很强的压不改</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>只要用一盏台灯,打六种不同的光</li>
<li>第一种,轮不软光</li>
<li>光源从鞋上方45度打下来</li>
<li>流眼睛下方会出现三角光光区</li>
<li>五官会显得立体有质</li>
<li>第二种,骨蝶光,也叫美人光</li>
<li>从前上方45度打下来</li>
<li>鼻子下方会出现阴影比较显得更挺拔</li>
<li>两侧光线偏暗,脸型会更显瘦</li>
<li>第三种,侧光</li>
<li>光源从左右方正侧面打过来</li>
<li>脸部会有明显的敏感对比</li>
<li>在临时作品中,常用来表现人物的两面性</li>
<li>第四种,轮廓光,光源来源于后方</li>
<li>可以勾勒出小伙伴的轮廓</li>
<li>制造阴影效果,极具隶属感</li>
<li>第五种,顶光</li>
<li>从头顶正上方打下来光</li>
<li>由于看不清眼神了,略带神秘色彩</li>
<li>会给人很强的压不改</li>
<li>第六种,底光</li>
<li>光源从下往上走得到的光线很诡异</li>
<li>多用来制造恐怖的效果和奇怪的内心活动</li>
<li>所以口不大光,你学会了吗?</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>只要用一盏台灯,打六种不同的光第一种,轮不软光光源从鞋上方45度打下来流眼睛下方会出现三角光光区五官会显得立体有质第二种,骨蝶光,也叫美人光从前上方45度打下来鼻子下方会出现阴影比较显得更挺拔两侧光线偏暗,脸型会更显瘦第三种,侧光光源从左右方正侧面打过来脸部会有明显的敏感对比在临时作品中,常用来表现人物的两面性第四种,轮廓光,光源来源于后方可以勾勒出小伙伴的轮廓制造阴影效果,极具隶属感第五种,顶光</p><p>转录分段: 24 | 时长: 55秒</p></div>
