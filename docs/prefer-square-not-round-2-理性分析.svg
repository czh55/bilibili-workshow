      <div class="container root-wrap">
  <h1>宁方勿圆2：体积大转折</h1>
  <div class="meta"><span class="tag tag-blue">宁方勿圆</span><span class="tag tag-green">体积</span><span class="tag tag-orange">转折</span><span class="tag tag-purple">蒋兆和</span><span class="tag tag-red">造型</span><span class="tag tag-gray">时长 140秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/AnjQQlcieHR">原视频</a>
  <div class="summary-line">体积塑造也要宁方勿圆：抓大转折（如颧骨正侧面），勿碎小面。蒋兆和自画像是范例；安格尔、维米尔与中国画同律。起形先大后小。下期几何形归纳法。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">方≠机械棱角</span></div><div class="timeline-item"><span class="timeline-time">00:17</span><span class="timeline-text">体积也要宁方勿圆</span></div><div class="timeline-item"><span class="timeline-time">00:31</span><span class="timeline-text">蒋兆和自画像</span></div><div class="timeline-item"><span class="timeline-time">00:47</span><span class="timeline-text">关键转折＋颧骨正侧面</span></div><div class="timeline-item"><span class="timeline-time">01:03</span><span class="timeline-text">抓大转折，勿碎小面</span></div><div class="timeline-item"><span class="timeline-time">01:26</span><span class="timeline-text">大师共通</span></div><div class="timeline-item"><span class="timeline-time">01:54</span><span class="timeline-text">几何形归纳法预告</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">方<br/>大转折</div><span class="arrow">→</span><div class="node-green">勿圆<br/>拒碎面</div><span class="arrow">→</span><div class="node-orange">范例<br/>蒋兆和</div><span class="arrow">→</span><div class="node-blue">下一步<br/>几何形归纳</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「凝方物圓／比量／安格／起行」→「宁方勿圆／鼻梁／安格尔／起形」。</p><p>误区：方＝削尖所有边。视频强调特征与美感。</p><p>误区：只方轮廓不方体积。本集补体积篇。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-orange">
      <h3>体积篇补完轮廓篇</h3>
      <p>轮廓画好不够，塑造体积同样宁方勿圆。</p>
      <div class="quote">我们在塑造体积的时候，也要注意宁方勿圆</div>
      <div class="relation">方是体积语言，不只外轮廓。</div>
    </div>
    <div class="card card-green">
      <h3>只留关键转折</h3>
      <p>发际到额保留关键转折；颧骨强化正侧面。蒋兆和清瘦骨感由此来。</p>
      <div class="quote">他只保留了形体关键的那条转折线……强化了……正面与侧面的转折</div>
      <div class="relation">大方＞碎面。</div>
    </div>
    <div class="card card-red">
      <h3>宁方／勿圆操作定义</h3>
      <p>宁方＝抓大转折；勿圆＝不过分关注细碎小块面→结实整体、精炼概括。</p>
      <div class="quote">宁方是让我们抓住形体的大的转折，勿圆则是不要过分的关注细碎的小块面</div>
      <div class="relation">取舍标准可自检。</div>
    </div>
    <div class="card card-purple">
      <h3>起形顺序</h3>
      <p>从起形就紧抓大转折，再带小面；与碎面作品对照高下立判。</p>
      <div class="quote">从起形开始，就紧紧的抓住大的形体的转折，再逐渐的带出小的块面</div>
      <div class="relation">顺序错误会导致永远碎。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>续篇，需结合上期轮廓篇。</li><li>几何形归纳法仅预告。</li><li>大师名用作规律旁证。</li></ul><div class="pitfall">一上来抠小面，大型散。</div><div class="pitfall">把方理解成到处折线。</div><div class="pitfall">有转折线却正侧面关系糊。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>体积方＝大转折取舍</li><li>正侧面关系优先</li><li>起形先大后小</li></ul><h3>行动清单</h3><ol><li>头像素描只画三条大转折先停笔</li><li>颧骨处检查正侧是否分明</li><li>对照蒋兆和：哪些面被省略</li><li>等待下期几何形归纳并预习体块</li></ol><h3>关键认知转变</h3><p>以前：圆滑堆面求像；现在：宁方抓大转折，体积先结实再言细节。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 140秒</div>
</div>
    </div>
  </foreignObject>
</svg>