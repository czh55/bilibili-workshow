<div class="container">
  <h1>亚麻苎麻汉麻什么区别？怎么选？怎么养护？</h1>
  <div class="meta">
    <span class="tag tag-green">小红书</span>
    <span class="tag tag-blue">2分01秒</span>
    <span class="tag tag-orange">面料对比</span>
    <span class="tag tag-purple">理性分析</span>
    <span class="tag tag-gray">作者立场分层</span>
  </div>
  <a class="source-link" href="http://xhslink.cn/o/FvqOzXKWy7">原视频链接</a>
  <div class="summary-line">核心判断：三种麻不是“越贵越好”，而是按进口成本、纤维形态与缩水风险分层——第一次买优先亚麻（性价比），敏感肌优先汉麻，透气防晒优先苎麻；养护只需过水、阴干、卷存。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">三件手写标签衬衫并列：汉麻 / 苎麻 / 亚麻，提出区别、选购与养护问题。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:05</div><div class="timeline-text">亚麻「纤维之王」：欧洲主产、价格偏贵、竹节纹理、越洗越软；缩水最高→买大不买小或选洗水款。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:38</div><div class="timeline-text">苎麻「中国丝」：国产便宜、纤维最细最长、吸湿散热最好且缩水最低，但上身扎刺感最强。</div></div>
    <div class="timeline-item"><div class="timeline-time">01:13</div><div class="timeline-text">汉麻「万年衣祖」：约八成产自黑龙江，产量少加工难→最贵；单纤维短、钝圆头→舒适与抗菌最好。</div></div>
    <div class="timeline-item"><div class="timeline-time">01:33</div><div class="timeline-text">推荐指南：新手选亚麻；舒适/敏感肌选汉麻；透气防晒选苎麻。</div></div>
    <div class="timeline-item"><div class="timeline-time">01:48</div><div class="timeline-text">护理指南：简单过水、通风阴干勿暴晒、卷起存放防死褶。</div></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">问题<br/>三种麻差在哪</div>
      <div class="arrow">→</div>
      <div class="node node-green">证据<br/>产地·价格·纤维·缩水</div>
      <div class="arrow">→</div>
      <div class="node">判断<br/>按需求分层选</div>
      <div class="arrow">→</div>
      <div class="node node-orange">行动<br/>买码·洗护·卷存</div>
    </div>
    <p>视频真正回答的不是“哪一种麻绝对最好”，而是：在产地成本、手感舒适、透气防晒三条约束下，如何快速做第一次购买决策。</p>
  </div>

  <div class="correction">
    <h3>常见误解与认知纠偏</h3>
    <p>1. 误区：纤维越细就越软。 → 纠偏：苎麻纤维最细最长，却是麻料里最硬挺、扎刺感最强的。</p>
    <p>2. 误区：汉麻贵所以人人都该买。 → 纠偏：汉麻贵主要来自产量少与加工难；若预算有限，新手更适合亚麻。</p>
    <p>3. 误区：麻料难洗难养。 → 纠偏：作者主张简单过水即可，并强调自带抗菌性；关键是阴干与卷存，而不是复杂护理。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">三种麻：可核对属性</h2>

    <div class="card card-green">
      <h3>亚麻「纤维之王」：进口成本换可穿性价比</h3>
      <p><span class="speaker speaker-host">作者观点</span>约 85% 产自法国、比利时、荷兰等；依赖进口，价格偏高。</p>
      <div class="quote">「第一次穿会觉得稍微有一点硬挺……但是这种面料会越洗越柔软。」</div>
      <p><strong>关键理解：</strong>竹节纹理与初次硬挺是正常手感，不是劣质信号；缩水率在麻类最高，决定尺码策略。</p>
      <div class="highlight">怎么用：买大不买小，或直接选做过洗水工艺的款；市面常见雨露麻比普通麻更贵。</div>
      <div class="relation">原文依据：00:05–00:38 产地/价格口述 + 画面「买大不买小」「越洗越柔软」。</div>
      <div class="pitfall">适用边界：产地比例与「所有麻类缩水最高」为作者口述，未给出检测来源；结论适用于日常成衣选购，不外推工业检测标准。</div>
    </div>

    <div class="card card-orange">
      <h3>苎麻「中国丝」：透气冠军，舒适短板</h3>
      <p><span class="speaker speaker-host">作者观点</span>主产中国、产量大加工易→麻料里最便宜；纤维最细最长；吸湿散热最好、缩水最低。</p>
      <div class="quote">「千万不要觉得它的纤维又细又长就会软和……它是……上身扎刺感最强的那个。」</div>
      <p><strong>关键理解：</strong>苎麻的优势在散热与尺寸稳定，短板在初次上身舒适度；适合追求透气防晒、能接受硬挺手感的人。</p>
      <div class="action">怎么用：更重视透气/防晒时选苎麻；敏感肌慎入。</div>
      <div class="relation">原文依据：00:38–01:13 对比纱线细腻 + 画面「吸湿散热好」「上身扎刺感强」。</div>
    </div>

    <div class="card card-purple">
      <h3>汉麻「万年衣祖」：舒适与抗菌溢价</h3>
      <p><span class="speaker speaker-host">作者观点</span>约 80% 产自黑龙江；产量少、加工难→最贵；单纤维短、头部钝圆→上身最舒适，抗菌最好；缩水介于亚麻与苎麻之间。</p>
      <p><strong>关键理解：</strong>汉麻买的是舒适与抗菌溢价，不是“更高级”的身份标签。</p>
      <div class="insight">怎么用：敏感肌或极度重视舒适度时首选；预算紧张可先用亚麻过渡。</div>
      <div class="relation">原文依据：01:13–01:33 产地/价格/纤维形态口述 + 画面「上身舒适度高」。</div>
      <div class="pitfall">适用边界：「抗菌性最好」属作者判断与推断；未区分汉麻与工业大麻法规语境，仅按服饰面料讨论。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">横向对比与选择条件</h2>
    <div class="card">
      <h3>三麻对照表（按视频信息重组）</h3>
      <table>
        <thead>
          <tr>
            <th>维度</th>
            <th>亚麻</th>
            <th>苎麻</th>
            <th>汉麻</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>称号（画面）</td>
            <td>纤维之王</td>
            <td>中国丝</td>
            <td>万年衣祖</td>
          </tr>
          <tr>
            <td>主产地</td>
            <td>欧洲（法/比/荷等）</td>
            <td>中国各地</td>
            <td>中国黑龙江为主</td>
          </tr>
          <tr>
            <td>价格</td>
            <td>偏贵</td>
            <td>最便宜</td>
            <td>最贵</td>
          </tr>
          <tr>
            <td>手感路径</td>
            <td>初硬→越洗越软</td>
            <td>细长却最硬挺扎刺</td>
            <td>短纤钝圆，最舒适</td>
          </tr>
          <tr>
            <td>缩水</td>
            <td>最高（买大/洗水）</td>
            <td>最低</td>
            <td>介于两者之间</td>
          </tr>
          <tr>
            <td>作者优先场景</td>
            <td>第一次尝试 / 性价比</td>
            <td>透气防晒</td>
            <td>敏感肌 / 舒适优先</td>
          </tr>
        </tbody>
      </table>
      <div class="highlight">立场分层：可核对事实为画面标签与字幕原文；「称号、产地比例、相对价格、缩水排序」来自作者口述；「应选哪一种」是作者观点，不是客观最优解。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">养护与避坑</h2>
    <div class="card card-red">
      <h3>护理动作很少，但有两处硬坑</h3>
      <ul>
        <li><strong>洗衣：</strong>简单过下水即可；作者认为纤维自带抗菌性，不必过度洗涤。</li>
        <li><strong>干燥：</strong>通风处阴干，别暴晒。</li>
        <li><strong>存放：</strong>卷起来存放，避免死褶。</li>
      </ul>
      <div class="pitfall">避坑 1：亚麻按正常码买却不预留缩水空间。避坑 2：把苎麻的细纤维误读成“一定软”。避坑 3：暴晒与折叠硬压导致变形/死褶。</div>
      <div class="relation">原文依据：01:48–02:01 护理指南口述与字幕「简单过水洗」「自带抗菌性」。</div>
    </div>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>亚麻：进口偏贵、缩水最高，但越洗越软，作者认为新手性价比最高。</li>
      <li>苎麻：最便宜、透气散热强、缩水低，但扎刺感最强。</li>
      <li>汉麻：最贵，换取最高舒适度与更好抗菌表现。</li>
    </ul>
    <h3>行动清单</h3>
    <ol>
      <li>第一次买麻料：优先亚麻，尺码买大或选洗水款。</li>
      <li>敏感肌/追求舒适：预算允许时选汉麻。</li>
      <li>夏日透气防晒优先：选苎麻，并先试穿手感。</li>
      <li>洗衣只做简单过水，通风阴干，勿暴晒。</li>
      <li>收纳一律卷存，减少死褶。</li>
    </ol>
    <h3>关键认知转变</h3>
    <p>从“麻料都差不多、贵的更好”转向“按产地成本、纤维形态与缩水风险做场景匹配”；细不等于软，贵不等于人人刚需。</p>
  </div>

  <div class="footer">双轨产物之二 · 理性分析 · slug: linen-ramie-hemp-diff · 证据来自同一 Whisper 转录与画面字幕</div>
</div>

    </div>
  </foreignObject>
</svg>