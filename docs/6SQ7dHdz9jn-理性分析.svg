      <div class="container">
<h1>分区曝光教程：精准控制每个亮度区域</h1>
<div class="meta"><span class="tag tag-blue">小红书</span><span class="tag tag-blue">摄影技术</span><span class="tag tag-blue">后期</span><span class="tag tag-gray">7:22</span></div>

<div class="summary-line">分区曝光是解决大光比场景的关键技法——通过点测光联动对焦点，分别测试每个区域的曝光值（高光、暗部、中间调），拍摄多张不同曝光的照片后在PS中合成。核心流程：相机设为点测光（标准）+对焦点联动→对不同区域分别测光→拍摄多张→PS中图层蒙版合成。其中暗部用曝光更亮的图片提取，高光用曝光更暗的图片保护，透明度控制在30%左右自然融合。</div>

<div class="map"><h2>核心脉络图</h2>
<div class="diagram">
  <div class="node">相机设置<br/>点测光+联动</div>
  <div class="arrow">→</div>
  <div class="node node-green">逐区域测光<br/>拍摄多张</div>
  <div class="arrow">→</div>
  <div class="node">PS图层+蒙版<br/>分区合成</div>
  <div class="arrow">→</div>
  <div class="node node-orange">高光不溢<br/>暗部有细节</div>
</div>
</div>

<div class="card"><h3>拍摄流程</h3>
<table>
<tr><th>步骤</th><th>操作</th><th>目的</th></tr>
<tr><td>1.相机设置</td><td>测光模式→点测光(标准)；点测光→对焦点联动</td><td>点哪里测哪里</td></tr>
<tr><td>2.区域测光</td><td>点击画面各区域查看曝光值(EV)</td><td>了解每个区域的亮度差异</td></tr>
<tr><td>3.多张拍摄</td><td>分别按高光、暗部、中间调的正确曝光拍摄</td><td>每张照片照顾一个区域</td></tr>
<tr><td>4.PS合成</td><td>图层蒙版+30%透明度笔刷</td><td>自然融合各区域曝光</td></tr>
</table>
</div>

<div class="card card-green"><h3>行动清单</h3>
<ul>
<li>大光比场景（逆光室内等）不用多重测光，改用点测光联动</li>
<li>分别针对窗户高光区、暗部阴影区、中间调区域拍摄</li>
<li>PS中用黑色蒙版+白色笔刷（30%透明度）逐一刷出需要曝光的区域</li>
<li>手动镜头无法联动时：用眼睛判断各区域亮度，手动调参数</li>
</ul>
</div>

<div class="card card-red"><h3>避坑总结</h3>
<ul>
<li>不要在大光比场景用多重测光——高光过曝+暗部无细节</li>
<li>不要100%刷出暗部——30%透明度更自然</li>
<li>不要忘记点测光设置为"对焦点联动"，否则测光与对焦分离</li>
</ul>
</div>

<div class="card card-orange"><h3>方法边界</h3>
<div class="boundary">
<p><strong>适用：</strong>大光比场景（强逆光、室内窗外光差大等），任何需要分别控制高光和暗部曝光的场景。</p>
<p><strong>不适用：</strong>移动物体/人物（多张合成有对齐问题）；光线均匀的场景（普通测光即可）。</p>
<p><strong>设备要求：</strong>需支持点测光联动对焦点的相机（索尼A7R5/M4/S3等）。</p>
</div>
</div>

<div class="conclusion">
<h2>立场分层与结语</h2>
<h3>核心价值</h3>
<p>分区曝光是高光比场景下保证画面干净、层次丰富的核心技法。拍摄只需多花几分钟，后期合成后画质提升非常显著。</p>
<h3>关键参数</h3>
<p>点测光(标准)+对焦点联动→分区拍摄→PS蒙版30%透明度合成。</p>
</div></div>
