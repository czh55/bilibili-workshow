<div class="svg-page">
  <div class="container">
    <h1>光圈计算（二）：从入瞳直径到曝光档位</h1>
    <div class="meta">
      <span class="tag tag-blue">小红书</span>
      <span class="tag tag-green">1分08秒</span>
      <span class="tag tag-orange">摄影科普</span>
      <span class="tag tag-purple">光圈 / 曝光</span>
      <span class="tag tag-gray">理性分析</span>
    </div>
    <a class="source-link" href="http://xhslink.cn/o/8bcnLdmF4B6">原视频：相机「光圈」底层逻辑科普，光圈计算（二）</a>
    <div class="summary-line">
      <strong>核心判断：</strong>本集真正回答的不是「该开多大光圈好看」，而是「F 值如何对应物理入瞳，又如何近似决定成像面照度」。先用 <span class="key-data">F = 焦距 / 入瞳直径</span> 算出通光孔大小，再建立「入瞳 → 光通面积 → 传感器照度 → 画面明暗」链，最后用「F 每变约 1.4 倍 ↔ 照度约变两倍」把档位量化。
    </div>

    <div class="timeline">
      <h3>关键证据时间轴</h3>
      <div class="timeline-item"><div class="timeline-time">00:01</div><div class="timeline-text">给出公式 F = 焦距 / 入瞳直径，示例 50mm 定焦</div></div>
      <div class="timeline-item"><div class="timeline-time">00:08</div><div class="timeline-text">f/1.2 → 入瞳约 42mm（50 ÷ 1.2）</div></div>
      <div class="timeline-item"><div class="timeline-time">00:14</div><div class="timeline-text">f/16 → 入瞳约 3mm，通光孔骤缩</div></div>
      <div class="timeline-item"><div class="timeline-time">00:26</div><div class="timeline-text">调大光圈：照度变强、画面更亮</div></div>
      <div class="timeline-item"><div class="timeline-time">00:37</div><div class="timeline-text">调小光圈：照度变弱、画面更暗</div></div>
      <div class="timeline-item"><div class="timeline-time">00:43</div><div class="timeline-text">F 值与成像面照度近似平方反比；一档 ≈ ×1.4</div></div>
      <div class="timeline-item"><div class="timeline-time">01:00</div><div class="timeline-text">照度与光通面积对照表；引出景深伏笔</div></div>
    </div>

    <div class="map">
      <h2>核心脉络</h2>
      <div class="diagram">
        <div class="node">问题<br/>F 值到底在量什么</div>
        <div class="arrow">→</div>
        <div class="node node-green">证据<br/>入瞳直径 / 通光面积</div>
        <div class="arrow">→</div>
        <div class="node">判断<br/>F 控照度与档位</div>
        <div class="arrow">→</div>
        <div class="node node-orange">行动<br/>按档调曝光预期</div>
      </div>
    </div>

    <div class="correction">
      <h3>常见误解与认知纠偏</h3>
      <p><strong>误解：</strong>「光圈数字越大，孔就越大。」<br/>
      <strong>纠偏：</strong>F 值越大，入瞳越小（同焦距下）。视频用 f/1.2≈42mm 对 f/16≈3mm 直接打脸。<br/>
      <strong>误解：</strong>「照度变化 = 光通面积变化，两者是一回事。」<br/>
      <strong>纠偏：</strong>视频明确说二者不能混为一谈，但在标准档位下，用入瞳算出的面积变化节奏与照度档位一致。</p>
    </div>

    <div class="section">
      <h2 class="sec-title">1. 可验证公式：F 值把焦距换成入瞳</h2>
      <div class="card card-green">
        <h3>在讲什么</h3>
        <p>先把抽象的 F 值还原成几何量：焦距固定时，F 值与入瞳直径成反比。</p>
        <div class="highlight">F = 焦距 / 入瞳直径。50mm @ f/1.2 → ≈42mm；@ f/16 → ≈3mm。</div>
        <div class="quote">画面字幕：「此时的入瞳直径大约是42mm」「此时的入瞳直径仅约为3mm」[00:08–00:14]</div>
        <div class="relation">关系：同一支镜头，F 从 1.2 收到 16，入瞳大约缩小一个数量级。</div>
        <div class="action">怎么用：需要估算最大通光孔时，直接用「焦距 ÷ 最大 F」；比较两档时先换算入瞳再谈「孔大孔小」。</div>
        <div class="insight">原文依据：开场公式卡 + 两组反算数字，属于可核验算术，不是审美判断。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">2. 因果链：入瞳 → 面积 → 照度 → 明暗</h2>
      <div class="card">
        <h3>在讲什么</h3>
        <p>光圈控制曝光的机制被拆成四步：调大/调小光圈 → 入瞳变大/变小 → 光通面积变大/变小 → 传感器照度变强/变弱 → 画面更亮/更暗。</p>
        <div class="quote">「当调大光圈入瞳径随之变大……画面看起来更亮」「如果把光圈调小……画面就会更暗」[00:19–00:41]</div>
        <div class="relation">关系：明暗是结果，入瞳变化是中间变量；动画剖面把「看不见的孔」变成「看得见的光通量」。</div>
        <div class="action">怎么用：预判曝光时先问「这一档相对上一档，入瞳大约变了多少」，再决定补偿快门/ISO。</div>
        <div class="insight">立场分层：剖面动画与样张对比是教学演示（观点表达方式）；「孔大则更亮」符合光学常识（可验证方向）。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">3. 量化规则：约 1.4 倍 F ↔ 约两倍照度</h2>
      <div class="card card-purple">
        <h3>UP 主观点（教学表述）</h3>
        <p>F 值与成像面照度近似平方反比；标准序列里相邻全档约乘 1.4（√2），照度约翻倍或减半。</p>
        <div class="quote">「F值与成像面照度是近似平方反比的关系」「F值每改变约1.4倍……照度……成两倍变化」[00:41–00:52]</div>
        <div class="highlight">常见全档序列：1 → 1.4 → 2 → 2.8 → 4 → 5.6 …</div>
        <div class="action">怎么用：手动曝光时按「整档」心算；半档/1/3 档再细分，但底层仍是 √2 阶梯。</div>
        <div class="insight">边界：视频说「近似」——真实镜头有 T 值、渐晕、滤镜损耗，不算进本集模型。</div>
      </div>
      <div class="card card-orange">
        <h3>风险和避坑</h3>
        <div class="pitfall">不要把「照度」和「光通面积」直接画等号；视频已声明二者不能混为一谈，只是档位规律同向同节奏。</div>
        <div class="pitfall">不要把 F 数字当成「亮度百分比」；它是比值，不是线性亮度滑条。</div>
        <div class="pitfall">本集未讲景深，勿把「大光圈更亮」直接延伸成「一定更好虚化」——那是下一题。</div>
      </div>
    </div>

    <div class="card">
      <h3>横向对比：同一 50mm 下的档位效应</h3>
      <table>
        <thead>
          <tr>
            <th>维度</th>
            <th>f/1.2（大光圈）</th>
            <th>f/8 附近（收小）</th>
            <th>f/16（小光圈）</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>入瞳直径（视频数）</td>
            <td>约 42mm</td>
            <td>介于两者之间（动画示意）</td>
            <td>约 3mm</td>
          </tr>
          <tr>
            <td>光通面积趋势</td>
            <td>大</td>
            <td>中</td>
            <td>很小</td>
          </tr>
          <tr>
            <td>成像面照度 / 画面</td>
            <td>更强 / 更亮</td>
            <td>减弱 / 变暗</td>
            <td>更弱（相对 f/1.2）</td>
          </tr>
          <tr>
            <td>适用心智</td>
            <td>低光优先通光</td>
            <td>常用于折中曝光</td>
            <td>需要压光或深景深时（景深本集未展开）</td>
          </tr>
        </tbody>
      </table>
      <p style="margin-top:12px;font-size:14px;color:#64748b">表中 f/1.2 与 f/16 数字来自视频字幕；f/8 为动画对照档，未给出精确入瞳毫米数。</p>
    </div>

    <div class="card">
      <h3>方法边界与立场分层</h3>
      <div class="stance-grid">
        <div class="stance-item">
          <strong>可验证事实</strong>
          F = 焦距/入瞳；50÷1.2≈42、50÷16≈3.1；标准档序列近似 √2。
        </div>
        <div class="stance-item">
          <strong>UP 主观点</strong>
          用动画把「孔—面积—照度—明暗」串成一条直觉链；强调照度与面积勿混称。
        </div>
        <div class="stance-item">
          <strong>基于原文的推断</strong>
          掌握入瞳换算后，曝光补偿可按档心算；景深效应需等后续集数证据。
        </div>
      </div>
      <div class="highlight" style="margin-top:16px">适用条件：理想化圆形入瞳、忽略 T 停、渐晕与镜头镀膜损耗；示例焦距固定为 50mm。变焦镜头在不同焦距下入瞳会变，不能直接套用片中毫米数。</div>
    </div>

    <div class="conclusion">
      <h2>总结与行动</h2>
      <h3>核心要点</h3>
      <ul>
        <li>F 值是「焦距 ÷ 入瞳直径」，不是亮度旋钮刻度。</li>
        <li>调大/调小光圈，本质是改入瞳与通光面积，从而改传感器照度。</li>
        <li>相邻全档约 ×1.4 的 F，对应约两倍的照度变化（近似平方反比）。</li>
        <li>照度规律与光通面积档位同节奏，但概念上不要混为一谈。</li>
      </ul>
      <h3>行动清单</h3>
      <ol>
        <li>拿常用定焦：用「焦距 ÷ F」心算最大/当前入瞳，建立孔的大小感。</li>
        <li>手动曝光时按整档练习：改一档 F，预期亮度约翻倍或减半，再用快门/ISO 对冲。</li>
        <li>对比样张时固定其他参数，只改 F，验证「更亮/更暗」是否符合预期。</li>
        <li>查阅镜头参数时区分 F 与 T；本集模型是 F 几何近似。</li>
        <li>需要虚化/景深决策时，等下一集或另找景深证据，不要用本集曝光结论硬推。</li>
      </ol>
      <h3>关键认知转变</h3>
      <p>从「光圈是好看虚化的开关」转向「光圈首先是可计算的通光几何」：先算孔，再谈亮，最后才接景深。</p>
    </div>

    <p class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录与画面字幕</p>
  </div>
</div>

    </div>
  </foreignObject>
</svg>