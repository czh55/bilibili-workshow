.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>鲜绿的正确打开方式</h1>
  <div class="meta"><span class="tag tag-blue">鲜绿</span><span class="tag tag-green">低纯衬高纯</span><span class="tag tag-orange">局部显眼</span><span class="tag tag-purple">缓冲区</span><span class="tag tag-gray">时长 147秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/4W69PpIpBVo">原视频</a>
  <div class="summary-line">鲜绿靠关系：灰衬托才显鲜（毕沙罗/梵高/莫奈同构）。整片中纯+局部闪光，忌均匀显眼过燥。天云高明低纯作缓冲区。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">鲜绿假</span></div><div class="timeline-item"><span class="timeline-time">00:10</span><span class="timeline-text">靠关系</span></div><div class="timeline-item"><span class="timeline-time">00:36</span><span class="timeline-text">毕沙罗灰衬</span></div><div class="timeline-item"><span class="timeline-time">01:00</span><span class="timeline-text">梵高莫奈</span></div><div class="timeline-item"><span class="timeline-time">01:30</span><span class="timeline-text">局部显眼</span></div><div class="timeline-item"><span class="timeline-time">01:48</span><span class="timeline-text">过燥对照</span></div><div class="timeline-item"><span class="timeline-time">01:48</span><span class="timeline-text">缓冲区</span></div><div class="timeline-item"><span class="timeline-time">02:10</span><span class="timeline-text">三要点</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">灰衬<br/>显鲜</div><span class="arrow">→</span><div class="node-green">局部<br/>闪光点</div><span class="arrow">→</span><div class="node-orange">缓冲<br/>呼吸</div><span class="arrow">→</span><div class="node-blue">关系<br/>非调色</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「必杀罗／巴金库尔／反高院尾花／吉威尼／无相」→「毕沙罗／巴赞库尔／梵高鸢尾花／吉维尼／吾象」。</p><p>误区：鲜绿=调最高饱和绿涂满。</p><p>误区：不舍得把邻色灰下去。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>关系制造</h3>
      <p>好看鲜绿不是调出来的。</p>
      <div class="quote">而是靠色彩关系制造出来的</div>
      <div class="relation">对比优先。</div>
    </div>
    <div class="card card-orange">
      <h3>低纯衬高纯</h3>
      <p>天云房干极灰，草地才鲜。</p>
      <div class="quote">以低纯度来衬托高纯度</div>
      <div class="relation">灰是绿的朋友。</div>
    </div>
    <div class="card card-red">
      <h3>局部显眼</h3>
      <p>中纯底+闪光点；均匀显眼过燥。</p>
      <div class="quote">不是平均显眼，而是局部显眼</div>
      <div class="relation">巧劲非蛮力。</div>
    </div>
    <div class="card card-purple">
      <h3>缓冲区</h3>
      <p>高明低纯天云给眼睛喘气。</p>
      <div class="quote">视觉就有了呼吸感</div>
      <div class="relation">节奏在明度。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>三要点</p>
      <div class="quote">灰衬、局部亮、留缓冲。</div>
      <div class="relation">可当检查表。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>聚焦绿色案例，原理可迁移他色。</li><li>地名译写按通用习惯。</li><li>总结卡以口播为准。</li></ul><div class="pitfall">整片拉满饱和。</div><div class="pitfall">邻色不肯变灰。</div><div class="pitfall">无缓冲区导致过燥。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>灰衬鲜</li><li>局部闪光</li><li>视觉缓冲</li></ul><h3>行动清单</h3><ol><li>临草地先把天云房画灰</li><li>只在局部加高纯笔触</li><li>对比均匀显眼过燥稿</li><li>保留一块高明低纯天空</li></ol><h3>关键认知转变</h3><p>以前：把绿调得很「鲜」；现在：把别人变灰，让绿自己显出来。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 147秒</div>
</div>
    </div>
  </foreignObject>
</svg>