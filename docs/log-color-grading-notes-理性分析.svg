      <div class="container root-wrap">
  <h1>Log 调色与色彩管理</h1>
  <div class="meta"><span class="tag tag-blue">个人专栏</span><span class="tag tag-green">Log</span><span class="tag tag-orange">LUT</span><span class="tag tag-purple">色彩管理</span><span class="tag tag-red">白平衡</span><span class="tag tag-blue">FCP</span><span class="tag tag-gray">讨论整理</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="#">personal:log-color-grading-notes</a>
  <div class="summary-line">九章把 Log 工作流拧成一条主线：先统一坐标系与基准，再用 LUT 做「罐头变换」，在标准显示空间交付；白平衡动中性轴、饱和调离轴距离，且必须分清 LUT 前/后工位。FCP 里用 Custom LUT 堆栈才能保住这条数学顺序。</div>
  <div class="timeline"><h3>结构时间轴</h3><div class="timeline-item"><span class="timeline-time">01 流程</span><span class="timeline-text">标准化 → 校正 → 匹配 → 风格化 → 输出适配</span></div><div class="timeline-item"><span class="timeline-time">02 LUT</span><span class="timeline-text">颜色变换的罐头：方便可分发，也可原生现做</span></div><div class="timeline-item"><span class="timeline-time">03 官方 LUT</span><span class="timeline-text">技术转换带审美；记录保持 Log，监看路径可烘焙</span></div><div class="timeline-item"><span class="timeline-time">04 显示空间</span><span class="timeline-text">色域×白点×传递函数×观看环境的行业契约</span></div><div class="timeline-item"><span class="timeline-time">05 高光损失</span><span class="timeline-text">709 压缩真实但可逆于母版；LUT 额外代价是精度</span></div><div class="timeline-item"><span class="timeline-time">06 手工/制作</span><span class="timeline-text">解眼前这题 vs 总结成对一切输入成立的公式</span></div><div class="timeline-item"><span class="timeline-time">07 中性轴</span><span class="timeline-text">白平衡=立轴（LUT 前）；饱和=调距（LUT 后）</span></div><div class="timeline-item"><span class="timeline-time">08 FCP 地图</span><span class="timeline-text">五层工具；Camera LUT 钉死最前 vs Custom 可排序</span></div><div class="timeline-item"><span class="timeline-time">09 色轮三轴</span><span class="timeline-text">轮盘动方向、滑块动距离、亮度动曝光</span></div></div>
  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">统一坐标系</div><span class="arrow">→</span><div class="node-green">技术基准</div><span class="arrow">→</span><div class="node-orange">LUT / 渲染</div><span class="arrow">→</span><div class="node">显示契约</div></div></div>
  <div class="correction"><h3>常见误解与认知纠偏</h3><p>· Log 不是单一格式，而是一族曲线+色域；不做输入变换，跨机匹配在错误坐标系里比坐标。</p><p>· 「机内不生成」指的是记录路径保持 Log；监看路径上的 LUT/代理一直在发生。</p><p>· 技术转换 LUT 的高光压缩多半是显示器上限所迫，母版仍在则损失在视图而非资产；真正额外罪过常是精度噪声。</p><p>· 色轮「既能校白又能补饱和」不是矛盾：校白用轮盘（动轴），补饱和用滑块（动距）。</p><p>· Camera LUT 后做白平衡可行但有天花板：非线性后再全局 offset，阴影/高光易残留色偏。</p></div>
  <div class="section"><h2 class="sec-title">观点拆解</h2><div class="card"><h3>主线：数学先于口味</h3><p>标准化与校正处理的是坐标与真实亮度关系；匹配服务感知连续；风格化才是主观表达；输出把意图翻译到目标媒介物理特性。场景差异来自素材一致性、时间预算与交付目标，而不是另发明一套魔法步骤。</p><div class="quote">流程的标准部分处理数学，差异部分处理生产关系</div><div class="relation">机制：先统一语言与基准，再谈叙事染色。</div></div><div class="card card-orange"><h3>LUT：罐头 vs 现做</h3><p>LUT 是颜色变换的可分发封装。索尼官方 LUT 是「带官方审美的技术转换」。记录保存信息、呈现做出解释——两者越晚绑定，自由度越大；确定永不二次解释时才烘焙。</p><div class="quote">记录保存信息，呈现做出解释</div><div class="relation">边界：协作链吃得起「现做」就可用原生管理替代罐头。</div></div><div class="card card-green"><h3>中性轴框架：立轴与调距</h3><p>白平衡把本该中性的推回中性轴，宜在 LUT 前一次增益全段生效；饱和补偿不动物体色相归属，只改离轴距离，针对 LUT 色域压缩副作用，宜在 LUT 后对着示波器补。</p><div class="quote">动轴的，还是动距离的——意图定操作，示波器裁决</div><div class="relation">避坑：用降饱和洗色偏，只会得到「错误得比较安静」的灰片。</div></div><div class="card card-purple"><h3>FCP：工具身份 vs 工位</h3><p>色轮始终是白平衡主力工具；理想工位在技术 LUT 之前。Camera LUT 钉死最前换便利；需要严格前后分工时，用 Custom LUT + 双份 Color Adjustments 搭堆栈（#1 立轴曝光，#2 饱和与口味）。</p><div class="quote">工具（what）与工位（where）正交</div><div class="relation">行动：检查器里把校正拖到 Custom LUT 上方。</div></div><div class="card card-red"><h3>色轮是三轴控制器</h3><p>轮盘=带方向的色向量（白平衡/染色）；饱和滑块=无方向径向缩放；亮度滑块=曝光。同一控件两次实例化可各取一根轴，不可拿错轴互顶。</p><div class="quote">白平衡用轮盘，饱和补偿用滑块</div><div class="relation">向量图检验：滑块径向呼吸、中心钉死；轮盘整体位移。</div></div></div>
  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>讨论以 Log→Rec.709 SDR 与 FCP 统一调色面板为主；ACES/达芬奇节点细节未展开成手册。</li><li>官方 LUT 审美因厂牌而异，不能当作唯一「正确」渲染。</li><li>混合色温、大面积单色场景，自动白平衡常采错锚点，需遮罩分区。</li><li>HDR/PQ 交付需另一套亮度映射，不可直接套用 SDR 口味结论。</li></ul><h3>避坑</h3><ul><li>跳过输入变换直接套创意 LUT，跨机颜色无法对话。</li><li>在 Camera LUT 后狂拧全局 offset「修白」，阴影高光残留相反色偏。</li><li>用饱和滑块当白平衡，或用轮盘当全局饱和补偿。</li><li>把监看烘焙误当成记录烘焙，丢掉二次解释空间。</li><li>手工只对眼前一镜取巧，导出成通用 LUT 后在其他镜头崩坏。</li></ul></div></div>
  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>顺序：统一坐标系 → 立曝光与中性轴 →（可选）技术 LUT → 饱和/口味 → 输出契约</li><li>几何：白平衡动轴，饱和动距，曝光动亮度分布</li><li>FCP：要严格顺序就用 Custom LUT 堆栈，不要默认 Camera LUT 钉死</li></ul><h3>行动清单</h3><ol><li>为常用机内 Log 建「Custom LUT 前校正」效果堆栈模板</li><li>白平衡时强制开 RGB Parade；补饱和时看 Vectorscope / Luma vs Sat</li><li>交付前确认目标显示空间四要素（色域/白点/曲线/观看环境）</li><li>母版保留 Log；只对确定不再重释的版本烘焙</li><li>新场景先问：素材一致性、时间预算、交付目标——再裁剪 pipeline</li></ol><h3>关键认知转变</h3><p>以前：把 LUT 和色轮当成滤镜旋钮乱拧；现在：先问自己在动哪根几何轴、工位在变换前还是后，用示波器而不是感觉结案。</p></div>
  <div class="footer">双轨产物之二 · 理性分析 · 证据来自讨论整理全文</div>
</div>
    </div>
  </foreignObject>
</svg>