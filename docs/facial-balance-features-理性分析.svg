      <div class="container root-wrap">
  <h1>有辨识度的面部平衡</h1>
  <div class="meta"><span class="tag tag-blue">面部美学</span><span class="tag tag-green">骨相</span><span class="tag tag-orange">眉眼</span><span class="tag tag-purple">医美</span><span class="tag tag-red">美学</span><span class="tag tag-gray">时长 0分26秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/85o21bnOryy">原视频</a>
  <div class="summary-line">面部平衡的美学判断：每个部位都有「可以怎样、不可以怎样」的边界——眉毛低可以但不能短（短显老局促）、中庭长可以但鬓区不能窄（窄显脸长头大）、下颌方可以但嘴巴不能太小（显小气）、颧骨高是骨相优势但要有眉毛包裹颧弓才有高级感。辨识度来自比例平衡而非单点极致。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">眉毛可以低，但不可以短——眉型短显老、显局促</span></div><div class="timeline-item"><span class="timeline-time">00:05</span><span class="timeline-text">中庭可以长，但鬓区不能窄——窄了显脸长头大</span></div><div class="timeline-item"><span class="timeline-time">00:11</span><span class="timeline-text">下颌方没问题，但嘴巴太小显小气</span></div><div class="timeline-item"><span class="timeline-time">00:17</span><span class="timeline-text">颧骨高是骨相优势，前提是眉毛包裹住颧弓才有高级感</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">眉毛<br/>低可以，短不可以</div><span class="arrow">→</span><div class="node-green">中庭/鬓区<br/>长可以，窄不可以</div><span class="arrow">→</span><div class="node-orange">下颌/嘴巴<br/>方可以，太小不可以</div><span class="arrow">→</span><div class="node-blue">颧骨<br/>高是优势，需眉包颧弓</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误区：眉毛越高越精神。实际眉毛可以低，但不能短。</p><p>误区：中庭短才好看。实际中庭可以长，关键是鬓区不能窄。</p><p>误区：颧骨高是缺点。实际颧骨高是骨相优势，前提是眉毛包裹住颧弓。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card">
      <h3>三组平衡：每项优势都有一个边界</h3>
      <p>眉毛低可以但不能短；中庭长可以但鬓区不能窄；下颌方没问题但嘴巴太小显小气；颧骨高是骨相优势但要有眉毛包裹颧弓才有高级感。辨识度来自比例平衡，不是单点极致。</p>
      <div class="quote">颧骨高，一定是你骨相的优势，前提是你的眉毛一定要包裹住你的颧弓，才会有高级感。</div>
      <div class="relation">框架：每个优势特征都依赖相邻结构的配合。</div>
    </div></div>

  <div class="section"><h2 class="sec-title">面部平衡边界对照</h2><div class="card"><table><thead><tr><th>部位</th><th>可以</th><th>不可以</th><th>原因</th></tr></thead><tbody><tr><td>眉毛</td><td>低</td><td>短</td><td>眉型短显老、显局促</td></tr><tr><td>中庭</td><td>长</td><td>鬓区窄</td><td>窄了显脸长头大</td></tr><tr><td>下颌</td><td>方</td><td>嘴巴太小</td><td>显小气</td></tr><tr><td>颧骨</td><td>高（优势）</td><td>眉不包颧弓</td><td>没有高级感</td></tr></tbody></table></div></div>

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>本视频为 26 秒美学速览，观点高度浓缩。</li><li>面部平衡需结合整体比例，单点边界不能决定设计。</li></ul><div class="pitfall">把眉毛做高做长——忽略「低可以短不可以」的边界。</div><div class="pitfall">颧骨高被当缺点处理——优势被眉毛包裹才有高级感。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>每个部位都有「可以…不可以…」的边界。</li><li>眉毛低可、中庭长可、下颌方可，但都有对应禁忌。</li><li>颧骨高是优势，需眉毛包裹颧弓。</li></ul><h3>行动清单</h3><ol><li>评估眉毛时检查长度是否足够。</li><li>中庭偏长时确认鬓区宽度是否协调。</li><li>颧骨高的人优先检查眉眼与颧弓的关系。</li></ol><h3>关键认知转变</h3><p>从「单点追极致」到「整体找平衡」——辨识度来自各部位在边界内的和谐。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 视频 26 秒 · 面部美学速览</div>
</div>
