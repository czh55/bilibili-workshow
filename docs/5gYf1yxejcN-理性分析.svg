<div class="card"><h3>内容要点</h3><ul><li>我们通常都会听到过一档曝光</li>
<li>过曝一档</li>
<li>那么一档到底是什么意思</li>
<li>是怎么来的</li>
<li>一档这个词</li>
<li>在英语里叫做stop</li>
<li>和我们在相机里看到的EV值</li>
<li>基本是一样的东西</li>
<li>加减EV等于加减一档曝光</li>
<li>加一档是增加一倍的亮度</li>
<li>而减少一档则是减一半的亮度</li>
<li>例如200%的E秒的快门</li>
<li>延长至100%的E秒</li>
<li>可以增加一档曝光</li>
<li>ISO100增加至一倍的ISO200</li>
<li>也可以增加一档曝光</li>
<li>如果想要减少一档的话</li>
<li>你当前只出以二就好</li>
<li>那么加两档</li>
<li>就并不是两倍曝光了</li>
<li>而是两倍乘以两倍等于四倍曝光</li>
<li>这样好理解吗</li>
<li>光圈有点点狡猾</li>
<li>因为牵扯到圆形面积</li>
<li>所以它每档的倍率是奇怪的1.4</li>
<li>F4出于1.4等于2.8</li>
<li>F4到F2.8为增加一档</li>
<li>也称开一档光圈</li>
<li>F4乘以1.4等于5.6</li>
<li>F4到5.6为减少一档</li>
<li>也称收益档光圈</li>
<li>另一个显著的规律</li>
<li>是每个档位上的数字</li>
<li>是上上档位的两倍</li>
<li>STOP档这个词也是源于光圈</li>
<li>严格来说是为望远镜</li>
<li>减低入光的装置</li>
<li>光圈刚被发明的时候</li>
<li>调节光圈需要把镜头整体拆散</li>
<li>换上不同尺寸的光孔</li>
<li>而到了19世纪50年代</li>
<li>John Waterhouse约翰水方先生</li>
<li>发明了插片式光孔</li>
<li>大大提升换光圈的效率</li>
<li>这些插片被称之为WaterhouseStops</li>
<li>顾名思义他们阻止了光的进入</li>
<li>市面上的ND镜也采用这个档标准</li>
<li>不过他们的单位名称再次有所不同</li>
<li>ND2X</li>
<li>ND4X</li>
<li>ND8X</li>
<li>这些是减光倍率</li>
<li>或者0.3、0.6、0.9</li>
<li>为光密度</li>
<li>对应的也是1档、2档、3档</li>
<li>最后给大家看看他们的单位对照</li>
<li>这样就很明了了</li>
<li>今天就分享到这</li>
<li>感谢收看这期视频</li>
<li>我是老粹</li>
<li>我们下期见</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>我们通常都会听到过一档曝光过曝一档那么一档到底是什么意思是怎么来的一档这个词在英语里叫做stop和我们在相机里看到的EV值基本是一样的东西加减EV等于加减一档曝光加一档是增加一倍的亮度而减少一档则是减一半的亮度例如200%的E秒的快门延长至100%的E秒可以增加一档曝光ISO100增加至一倍的ISO200也可以增加一档曝光如果想要减少一档的话你当前只出以二就好那么加两档就并不是两倍曝光了而是两倍乘</p><p>转录分段: 61 | 时长: 1:55</p></div>
