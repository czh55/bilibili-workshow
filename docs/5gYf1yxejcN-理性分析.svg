      <div class="container">
<h1>"档"(Stop)的曝光标准：来历与换算</h1>
<div class="meta"><span class="tag tag-blue">小红书</span><span class="tag tag-blue">摄影技术</span><span class="tag tag-gray">1:55</span></div>

<div class="summary-line">"一档曝光"的"档"（Stop）是一个统一了影视工业的标准单位。加一档=增加一倍亮度，减一档=减少一半亮度。快门和ISO遵循×2/÷2法则；光圈因为牵涉圆形面积，每档倍率是√2≈1.4（F4÷1.4=F2.8加一档，F4×1.4=F5.6减一档）。Stop一词源于19世纪50年代John Waterhouse发明的插片式光圈——Waterhouse Stops（阻止光进入的插片）。今天的ND镜也沿用档标准，但用减光倍率（ND2/4/8）或密度值（0.3/0.6/0.9）表示。</div>

<div class="map"><h2>核心脉络图</h2>
<div class="diagram">
  <div class="node">一档(Stop)<br/>亮度×2或÷2</div>
  <div class="arrow">→</div>
  <div class="node node-green">快门/ISO<br/>×2(加)/÷2(减)</div>
</div>
<div class="diagram">
  <div class="node">一档(Stop)<br/>亮度×2或÷2</div>
  <div class="arrow">→</div>
  <div class="node node-orange">光圈<br/>×1.4(减)/÷1.4(加)</div>
</div>
</div>

<div class="card"><h3>光圈档位速查</h3>
<table>
<tr><th>变化</th><th>操作</th><th>示例</th></tr>
<tr><td>+1档(开)</td><td>当前值÷1.4</td><td>F4→F2.8</td></tr>
<tr><td>-1档(收)</td><td>当前值×1.4</td><td>F4→F5.6</td></tr>
<tr><td>+2档</td><td>亮度×4</td><td>档位跳两格</td></tr>
<tr><td>-2档</td><td>亮度÷4</td><td>档位跳两格</td></tr>
</table>
<p style="color:#475569;font-size:14px;">规律：每个档位数字 = 上上档位的两倍（F2.8→F5.6→F11→F22...）</p>
</div>

<div class="card card-green"><h3>ND镜档位对照</h3>
<table>
<tr><th>减光档数</th><th>ND倍率</th><th>密度值</th></tr>
<tr><td>1档</td><td>ND2</td><td>0.3</td></tr>
<tr><td>2档</td><td>ND4</td><td>0.6</td></tr>
<tr><td>3档</td><td>ND8</td><td>0.9</td></tr>
<tr><td>6档</td><td>ND64</td><td>1.8</td></tr>
<tr><td>10档</td><td>ND1000</td><td>3.0</td></tr>
</table>
</div>

<div class="card card-red"><h3>避坑总结</h3>
<ul>
<li>加两档不是2倍亮度——是2×2=4倍亮度</li>
<li>光圈1.4倍率来自圆形面积公式（πr²）：直径×1.4→面积×2</li>
<li>ND镜三个命名体系（档/倍率/密度）本质相同，别被单位绕晕</li>
</ul>
</div>

<div class="card card-orange"><h3>方法边界</h3>
<div class="boundary">
<p><strong>Stop的历史：</strong>最初指Waterhouse插片式光圈中的金属插片，用于"阻止"光进入。后来统一为影视工业曝光标准。</p>
<p><strong>EV值与Stop：</strong>相机中的EV值加减就是加减档（Stop），直接对应亮度倍率变化。</p>
</div>
</div>

<div class="conclusion">
<h2>立场分层与结语</h2>
<h3>摄影曝光口诀</h3>
<p>快门/ISO：×2加一档、÷2减一档。光圈：÷1.4加一档、×1.4减一档。ND镜的0.3/0.6/0.9就是1/2/3档减光。</p>
</div></div>
