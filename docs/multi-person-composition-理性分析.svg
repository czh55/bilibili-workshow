tr:nth-child(even) td{background:#fafbfc}
.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:36px;margin-top:32px}
.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>多人构图三招：空间·疏密·主次</h1>
  <div class="meta"><span class="tag tag-blue">多人构图</span><span class="tag tag-green">空间</span><span class="tag tag-orange">疏密</span><span class="tag tag-purple">主次</span><span class="tag tag-red">名画</span><span class="tag tag-gray">时长 222秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/2tcjYfTm6fd">原视频</a>
  <div class="summary-line">告别游客照靠布局：前中后景透气、疏密呼吸、主次可被锁定并引导。维米尔／夜宴图／雅典学院是三招样本。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">维米尔空间</span></div><div class="timeline-item"><span class="timeline-time">00:50</span><span class="timeline-text">摄影／绘画做法</span></div><div class="timeline-item"><span class="timeline-time">01:20</span><span class="timeline-text">夜宴图疏密</span></div><div class="timeline-item"><span class="timeline-time">01:40</span><span class="timeline-text">遮疏只留密喘不过气</span></div><div class="timeline-item"><span class="timeline-time">02:30</span><span class="timeline-text">雅典学院主次</span></div><div class="timeline-item"><span class="timeline-time">03:05</span><span class="timeline-text">强化主角+引导</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">空间<br/>层次透气</div><span class="arrow">→</span><div class="node-green">疏密<br/>聚散呼吸</div><span class="arrow">→</span><div class="node-orange">主次<br/>C位可锁</div><span class="arrow">→</span><div class="node-blue">引导<br/>视线有序</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>画名画家已校。</p><p>疏密／帷幔等 ASR 已校。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>空间感</h3>
      <p>前中后景错落；去掉层次就回游客并排。</p>
      <div class="quote">人多不是问题，关键在于布局</div>
      <div class="relation">人数≠难度，层次才是。</div>
    </div>
    <div class="card card-orange">
      <h3>疏密呼吸</h3>
      <p>全密会窒息；分组留缝并用眼神暗连。</p>
      <div class="quote">赋予了画面节奏感和呼吸感</div>
      <div class="relation">空隙是构图材料。</div>
    </div>
    <div class="card card-red">
      <h3>主次制造</h3>
      <p>位置、大小、亮度、视线汇聚、框景共同造 C 位。</p>
      <div class="quote">如此成就了主角地位</div>
      <div class="relation">主角是设计出来的。</div>
    </div>
    <div class="card card-purple">
      <h3>引导线</h3>
      <p>眼神姿态线条让观看有序，避免均匀抢戏。</p>
      <div class="quote">让观众目光有序的来观看</div>
      <div class="relation">主次之后还要路径。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>三招复盘</p>
      <div class="quote">想要告别游客照，秘密就在这三招</div>
      <div class="relation">空间→疏密→主次，可检查表化。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>名画示例偏绘画／摄影通用，未拆机位参数。</li><li>片尾课宣非技法必需。</li></ul><div class="pitfall">多人站成一排。</div><div class="pitfall">只密不疏。</div><div class="pitfall">人人一样亮一样清楚。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>层次</li><li>呼吸</li><li>可锁主角</li></ul><h3>行动清单</h3><ol><li>合影先定一人为主角，前后排拉开距离</li><li>人群分组并在组间留缝，避免整片塞满</li><li>用眼神或姿态把分散的人暗连起来</li><li>检查 C 位是否最亮／最大／被视线或透视汇聚</li></ol><h3>关键认知转变</h3><p>以前：人齐了就拍；现在：先排空间疏密与主次。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 222秒</div>
</div>
    </div>
  </foreignObject>
</svg>