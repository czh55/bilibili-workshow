      <div class="container root-wrap">
  <h1>咖啡拉花｜流距太高？一分钟调整</h1>
  <div class="meta"><span class="tag tag-blue">咖啡拉花</span><span class="tag tag-green">流距</span><span class="tag tag-orange">奶沫</span><span class="tag tag-purple">拿铁</span><span class="tag tag-red">培训</span><span class="tag tag-gray">时长 26秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/4GxgHK1vXcY">原视频</a>
  <div class="summary-line">拉花「黏成一团」时先查流距：缸嘴贴住液面、流量放开、摆动频率稳住，白沫才容易浮出来并收干净。本片几乎不讲花型名称，只钉流距这一变量。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">痛点：拉不出花、图案黏在一起</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">诊断：流距太高，奶沫难浮面，显白与收尾差</span></div><div class="timeline-item"><span class="timeline-time">00:17</span><span class="timeline-text">对策：压低缸嘴、大胆流量、稳定摆动</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">症状<br/>拉不出花/黏连</div><span class="arrow">→</span><div class="node-green">主因<br/>流距太高</div><span class="arrow">→</span><div class="node-orange">动作<br/>压低缸嘴</div><span class="arrow">→</span><div class="node-blue">辅助<br/>流量+摆动频率</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>误区：黏连是因为花型不会。先查流距是否过高。</p><p>误区：等液面满上来再显白也行。那样收尾通常难看。</p><p>误区：流量要小心翼翼。作者要求大胆释放流量并稳住摆动。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card card-red">
      <h3>问题定义：黏在一起=流距太高</h3>
      <p>开场对照模糊黏连心与清晰波纹心，直接归因：流距太高，奶沫无法顺利浮在表面；缸嘴离液面远，只能等满杯才显白。</p>
      <div class="quote">重点其实就是因为流距太高</div>
      <div class="relation">先改高度，再练花型。</div>
    </div>
    <div class="card card card-green">
      <h3>三句对策可立即执行</h3>
      <p>持续压低缸嘴，大胆释放流量，保持稳定摆动频率。画面红箭头标注入点，强调贴面注入。</p>
      <div class="quote">持续压低缸嘴，大胆释放流量，保持稳定的摆动频率</div>
      <div class="relation">三个旋钮一起拧，缺一仍易黏。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>仅讲流距与注入姿态，不覆盖蒸汽打奶或浓缩参数。</li><li>~26 秒短片，无系统花型课。</li><li>术语以培训画面「缸嘴」为准。</li></ul><div class="pitfall">缸嘴抬高只为看清图案，结果奶沫沉不上去。</div><div class="pitfall">流量过小，只能等满杯才显白。</div><div class="pitfall">摆动忽快忽慢，波纹并成一团。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>症状：拉不出花/黏连</li><li>主因：流距太高</li><li>动作：压低缸嘴</li><li>辅助：流量+摆动频率</li></ul><h3>行动清单</h3><ol><li>下一杯故意把缸嘴压到几乎贴液面再摆动。</li><li>对比一次「高流距」与「低流距」同花型收尾。</li><li>摆动时数节拍，先求频率稳再求花型复杂。</li></ol><h3>关键认知转变</h3><p>黏连先查流距：压低缸嘴、放开流量、稳住摆动；高度对了，显白与收尾才会干净。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 26秒</div>
</div>
