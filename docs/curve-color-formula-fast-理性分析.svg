      <div class="container root-wrap">
  <h1>曲线调色 套公式就是快！</h1>
  <div class="meta"><span class="tag tag-blue">曲线</span><span class="tag tag-green">祛灰</span><span class="tag tag-orange">胶片感</span><span class="tag tag-purple">柯达金</span><span class="tag tag-red">夜景</span><span class="tag tag-gray">时长 46秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/2CW7c4GxbPc">原视频</a>
  <div class="summary-line">短视频把曲线调色压成可复用公式：两端对齐直方图祛灰 → S 形做胶片对比 → RGB 正 S 仿柯达金 → 夜景压暗再加对比；曲线加点即可分区微调亮暗。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">立题：曲线调色看不懂 → 先套公式</span></div><div class="timeline-item"><span class="timeline-time">00:03</span><span class="timeline-text">祛灰：两端移到直方图波峰两侧</span></div><div class="timeline-item"><span class="timeline-time">00:09</span><span class="timeline-text">压亮提暗 + S 曲线 → 胶片感</span></div><div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">RGB 分别正 S → 柯达金配方</span></div><div class="timeline-item"><span class="timeline-time">00:23</span><span class="timeline-text">夜景：压暗部 + S 增强对比</span></div><div class="timeline-item"><span class="timeline-time">00:31</span><span class="timeline-text">加点分区调亮/暗；号召截图跟练</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">祛灰<br/>两端对齐波峰</div><span class="arrow">→</span><div class="node-green">胶片<br/>S 曲线对比</div><span class="arrow">→</span><div class="node-orange">柯达金<br/>RGB 正 S</div><span class="arrow">→</span><div class="node-blue">夜景<br/>压暗+再对比</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「直方图拨风」校正为「直方图波峰」。</p><p>ASR「灰布布」校正为「灰扑扑」。</p><p>ASR「科达金胶卷 / 胶片位」校正为「柯达金胶卷 / 胶片味」。</p><p>本片为口播快教程，公式需按素材直方图微调，不是一键预设文件。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>公式一：祛灰＝两端对齐有效直方图</h3>
      <p>先把曲线两端挪到直方图波峰两侧，去掉灰扑扑的杂色。这是对比与染色的底座；端点乱放会导致死黑或死白。</p>
      <div class="quote">上来就先把曲线的两端移动到直方图波峰的两侧，灰扑扑的杂色这不就消失了</div>
      <div class="relation">机制：拉伸有效灰阶，提高动态范围利用率。</div>
    </div>
    <div class="card card-orange">
      <h3>公式二：胶片感＝压亮 + 提暗 + S</h3>
      <p>压低亮部点、提亮暗部点，再用 S 曲线提高对比度，做出胶片灰底与中间对比。暗部抬起是「褪黑」常见手法，幅度过大易发雾。</p>
      <div class="quote">压低亮部的点，提亮暗部的点，然后用 S 曲线提高对比度，胶片感这不就调出来了</div>
      <div class="relation">边界：人像肤色与高光细节需回看波形/直方图。</div>
    </div>
    <div class="card card-green">
      <h3>公式三：柯达金≈RGB 通道各自正 S</h3>
      <p>在 RGB 曲线上分别拉出正 S，用通道对比模拟暖调胶片分离。名称「柯达金」是教学隐喻，非官方 LUT 复刻保证。</p>
      <div class="quote">你把红绿蓝曲线再分别拉出正 S 形，这不就是炒到天价的柯达金胶卷配方吗</div>
      <div class="relation">可验证：口播演示；实际色偏取决于素材白平衡。</div>
    </div>
    <div class="card card-purple">
      <h3>夜景变体：先压暗部再加对比</h3>
      <p>背景不高级时，先压曲线暗部，再 S 增强对比，让城市灯光更有质感。与「提暗部做胶片」方向相反，说明同一工具按目标切换。</p>
      <div class="quote">你给曲线暗部压暗，再 S 曲线增强一下对比，城市夜景灯光不就有质感了</div>
      <div class="relation">诊断：夜景杂散灰雾优先压暗，而不是先染色。</div>
    </div>
    <div class="card card-red">
      <h3>手感：加点＝分区微调</h3>
      <p>曲线上加一点，即可单独调节亮部或暗部，避免全局滑杆牵一发而动全身。适合公式套完后的局部收尾。</p>
      <div class="quote">曲线上加一个点，调节亮部部分就能单独调节画面的亮部</div>
      <div class="relation">行动：跟练时先套四公式，再加点收尾。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>46 秒口播快教程，不是完整校色工作流（白平衡、曝光还原未展开）。</li><li>「柯达金配方」为比喻，不保证复刻某一支实体胶卷。</li><li>不同软件曲线坐标与直方图显示略有差异，端点位置需目视对齐。</li><li>人像肤色在强 S / RGB 分离后需单独保护。</li></ul><div class="pitfall">未对齐直方图就拉 S，灰雾仍在或高光死白。</div><div class="pitfall">暗部抬起过度，画面发雾却以为是胶片感。</div><div class="pitfall">RGB 正 S 后不看肤色，偏绿/偏品。</div><div class="pitfall">夜景与日景套同一「提暗部」方向，背景更脏。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>祛灰：两端对齐直方图波峰</li><li>胶片：压亮提暗 + S；柯达金：RGB 正 S</li><li>夜景：压暗 + 再对比；加点分区微调</li></ul><h3>行动清单</h3><ol><li>打开曲线前先看直方图有效范围</li><li>日景胶片：先祛灰再 S，再考虑 RGB</li><li>夜景：优先压暗部去灰雾</li><li>每步只改一类操作并对比前后</li><li>截图保存自己的端点与 S 幅度作为个人公式</li></ol><h3>关键认知转变</h3><p>以前：曲线随便拉、不知道从哪下手；现在：按祛灰→胶片 S→RGB→场景变体的顺序套公式，再用加点收尾。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 46秒</div>
</div>
    </div>
  </foreignObject>
</svg>