.source-link{color:#0d9488;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#0f766e;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      
<div class="container root-wrap">
  <h1>夏天穿短裙这样拍超级显瘦！</h1>
  <div class="meta"><span class="tag tag-blue">拍照姿势</span><span class="tag tag-blue">显瘦</span><span class="tag tag-blue">短裙</span><span class="tag tag-blue">腿部</span><span class="tag tag-blue">小红书</span><span class="tag tag-gray">时长 52秒</span></div>
  <a class="source-link" href="http://xhslink.cn/o/6I0Gsupwsyf">原视频链接</a>
  <div class="summary-line">短裙显瘦姿势库：腿前伸不往里放、架腿藏肉、蹲姿遮肉、翘腿侧伸、侧前方45度伸腿绷脚背，五类动作显瘦显长。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">坐姿腿前伸架起</span></div><div class="timeline-item"><span class="timeline-time">00:09</span><span class="timeline-text">蹲姿遮肉、手挡肉</span></div><div class="timeline-item"><span class="timeline-time">00:19</span><span class="timeline-text">架腿藏肉：前腿后架</span></div><div class="timeline-item"><span class="timeline-time">00:29</span><span class="timeline-text">翘腿侧伸面向镜头</span></div><div class="timeline-item"><span class="timeline-time">00:38</span><span class="timeline-text">侧前方 45 度伸腿绷脚背</span></div></div>
  <div class="section"><div class="sec-title">观点拆解</div><div class="card"><h3>坐姿铁律</h3><div class="highlight">腿往镜头前伸 + 架起 + 绷脚背。</div></div><div class="card"><h3>藏肉技巧</h3><div class="highlight">前腿后架藏大腿肉，手挡肚子。</div></div><div class="card"><h3>翘腿方向</h3><div class="highlight">侧伸、面向镜头的腿后翘，不正面后翘。</div></div><div class="card"><h3>显长终极动作</h3><div class="highlight">侧前方 45 度伸腿 + 绷脚背 + 双手后撑。</div></div></div>
  <div class="conclusion"><h2>行动清单</h2><ul><li>坐姿腿往镜头前伸，不要往里放</li><li>架腿时用前腿往后架藏肉</li><li>蹲姿有肉用手挡住</li><li>翘腿侧伸，面向镜头的腿后翘</li><li>腿往侧前方 45 度伸出绷起脚背</li></ul>
  <h2>适用边界</h2><p>本视频为短裙静态拍照姿势教学，未涉及动态抓拍、全身站姿与多人合影。</p></div>
