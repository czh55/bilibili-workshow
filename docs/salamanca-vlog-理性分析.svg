<h1>🇪🇸萨拉曼卡Vlog｜漫游西班牙02</h1>
<div class="meta">
<span class="tag tag-blue">Vlog</span><span class="tag tag-green">西班牙</span><span class="tag tag-orange">萨拉曼卡</span><span class="tag tag-purple">罗马遗迹</span><span class="tag tag-red">大学·青蛙传说</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>萨拉曼卡是一整座'时间长廊'：罗马桥一半16世纪重建一半2000年原桥，凯尔特人的无头石牛比罗马人更古老，舍不得拆旧的教堂变成世界罕见的双座大教堂；还有全欧洲最古老大学之一的'找青蛙免挂科'传说与中世纪司法豁免权，用本地红砂石砌出'黄金之城'的美名。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">路过空城，抵达萨拉曼卡</span></div><div class="timeline-item"><span class="timeline-time">00:55</span><span class="timeline-text">酒店100欧窗外大片天空</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">罗马桥：16世纪新半 + 2000年旧半</span></div><div class="timeline-item"><span class="timeline-time">02:25</span><span class="timeline-text">无头石牛：凯尔特人2500年前图腾</span></div><div class="timeline-item"><span class="timeline-time">03:00</span><span class="timeline-text">世界罕见双座大教堂（新旧连体）</span></div><div class="timeline-item"><span class="timeline-time">03:40</span><span class="timeline-text">萨拉曼卡大学：找青蛙传说 + 神权豁免</span></div><div class="timeline-item"><span class="timeline-time">04:20</span><span class="timeline-text">贝壳之家：扇贝与何欢花徽章</span></div><div class="timeline-item"><span class="timeline-time">04:40</span><span class="timeline-text">红砂石黄金之城，告别前往葡萄牙</span></div></div>

<h2>⏳ 一整座城市的时间长廊</h2>
<div class="map"><h3>在同一座城市里，你踩过的时间层</h3>
<div class="diagram">
  <div class="node node-orange">凯尔特人<br/>2500年前<br/>无头石牛图腾</div>
  <div class="arrow">←</div>
  <div class="node node-blue">罗马帝国<br/>2000年前<br/>古桥·老城</div>
  <div class="arrow">→</div>
  <div class="node node-green">中世纪<br/>双座大教堂<br/>大学豁免权</div>
  <div class="arrow">→</div>
  <div class="node node-purple">16世纪+现代<br/>新桥新教堂<br/>黄金之城</div>
</div></div>

<h2>🌉 罗马桥：一半是2000年，一半是16世纪</h2>
<div class="card card-orange">
<h3>为什么同一座桥有两段历史？</h3>
<p>洪水曾冲塌旧桥，近岸的一半在16世纪重建，远岸的一半仍保留罗马原样。走这座桥，等于从'新世界'走向'2000年前的老城'。</p>
<div class="highlight">桥上那座无头石牛其实更古老：它是早于罗马人来到这里的凯尔特部族图腾，距今约2500年。</div>
</div>

<h2>⛪ 双座大教堂：舍不得拆旧的世界罕见</h2>
<div class="card card-green">
<h3>别人的城市：建新的拆旧的。萨拉曼卡：全都留下</h3>
<p>多数西班牙城市会在新教堂建成后拆除旧教堂（如塞哥维亚）。萨拉曼卡舍不得拆，于是新旧两座教堂背靠背连在一起，形成全世界罕见的双座大教堂景观——左边是新的，右边是旧的。</p>
<div class="example">旅拍提示：双座大教堂是萨拉曼卡最出片的机位，新旧立面对比非常上镜。</div>
</div>

<h2>🎓 萨拉曼卡大学：找青蛙与司法豁免</h2>
<div class="card card-purple">
<h3>世界最古老大学之一的两个传说</h3>
<ul>
<li><strong>找青蛙</strong>：在大学的门楣浮雕上找到一只青蛙，据说这学期就不用挂科了——学生们的求好运仪式</li>
<li><strong>神权豁免</strong>：中世纪神权时代，大学拥有高贵的豁免权——学生在城里犯法，警察不能抓，由大学自己的法庭和监狱裁决</li>
</ul>
<div class="pitfall">别小看墙上的细节：一个浮雕里的青蛙，背后是几百年的大学自治传统。</div>
</div>

<h2>🐚 贝壳之家：炫耀妻子的爱</h2>
<div class="card card-orange">
<h3>满墙扇贝的来历</h3>
<p>最浪漫的一种说法：男主人家族的徽章是扇贝，妻子家族的徽章是花，他把两种徽章融合雕刻满整面墙，向全城炫耀他对妻子的爱。</p>
</div>

<h2>🟠 黄金之城：红砂石的名片</h2>
<div class="card card-blue">
<h3>萨拉曼卡为什么叫'黄金之城'（La Dorada）？</h3>
<p>当地建筑全部用本地出产的红砂石建造，在夕阳下泛着金黄色的光，因而得名'黄金之城'。</p>
<div class="action">旅行彩蛋：看完古罗马桥进城、走现代桥离开——每次过桥都是一次时间穿越。下一站：葡萄牙。</div>
</div>

<div class="conclusion">
<h2>萨拉曼卡留给我的三句话</h2>

<h3>🥇 时间可以拼接</h3>
<p>洪水重建后的罗马桥、新旧相连的双座教堂——这座城市从不抹掉过去，而是让每个时代并肩站立。</p>
<h3>🥈 知识曾是特权</h3>
<p>找到青蛙就不挂科、犯法由学校自审——中世纪的大学自治，在今天变成了可爱的校园传说。</p>
<h3>🥉 好城不在大</h3>
<p>没有游客涌来的小城，100欧就能拥有整片天空；'没人来'反而是它最奢侈的地方。</p>

</div>
