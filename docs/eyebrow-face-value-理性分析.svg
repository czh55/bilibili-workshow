<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="3300" viewBox="0 0 1320 3300">
<foreignObject x="0" y="0" width="1320" height="3300">
<div xmlns="http://www.w3.org/1999/xhtml"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}.container{max-width:1200px;margin:0 auto}h1{font-size:36px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}h2{font-size:26px;font-weight:700;color:#1e40af;margin:32px 0 16px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}h3{font-size:20px;font-weight:700;color:#334155;margin-bottom:12px}p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}ul,ol{padding-left:24px;margin:8px 0}li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:6px}.tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}.tag-blue{background:#dbeafe;color:#1e40af}.tag-green{background:#d1fae5;color:#065f46}.tag-orange{background:#ffedd5;color:#9a3412}.tag-gray{background:#f1f5f9;color:#64748b}.meta{margin:12px 0 20px}.summary-line{font-size:18px;line-height:1.7;color:#334155;padding:20px 24px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}.timeline{background:#fff;border-radius:16px;padding:24px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.04)}.timeline h3{color:#1e40af;margin-bottom:12px}.timeline-item{display:flex;align-items:baseline;padding:8px 0;border-bottom:1px solid #f1f5f9}.timeline-time{font-size:14px;font-weight:700;color:#3b82f6;min-width:70px;font-variant-numeric:tabular-nums}.timeline-text{font-size:15px;color:#475569}table{width:100%;border-collapse:collapse;margin:16px 0;font-size:15px}th{background:#f1f5f9;padding:12px 16px;text-align:left;font-weight:700;color:#1e40af;border-bottom:2px solid #cbd5e1}td{padding:12px 16px;border-bottom:1px solid #e2e8f0;color:#475569;vertical-align:top}tr:nth-child(even) td{background:#fafbfc}.card{background:#fff;border-radius:16px;padding:32px;margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.06);border-left:5px solid #3b82f6}.card.card-green{border-left-color:#10b981}.card.card-orange{border-left-color:#f59e0b}.card.card-purple{border-left-color:#8b5cf6}.card h3{font-size:20px;font-weight:700;color:#1e40af;margin-bottom:12px}.card .highlight{background:#fef3c7;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#92400e;border-left:4px solid #f59e0b}.map{background:#fff;border-radius:20px;padding:36px;margin-bottom:28px;box-shadow:0 4px 24px rgba(0,0,0,.06)}.map h2{font-size:24px;margin-top:0;border-bottom:none;padding-bottom:0}.diagram{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;padding:20px 0}.node{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:16px;padding:20px 28px;text-align:center;min-width:160px;font-weight:700;font-size:16px;color:#1e40af}.node-green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}.node-orange{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}.arrow{font-size:24px;color:#94a3b8}.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:36px;margin-top:32px}.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.card .pitfall{background:#fef2f2;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#991b1b;border-left:4px solid #ef4444}
.boundary{background:#faf8f5;padding:20px 24px;border-radius:12px;margin:16px 0;font-size:14px;color:#555;line-height:1.9}</style><div class="container">
<h1>眉毛居然是决定颜值的重要因素？</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">化妆</span> <span class="tag tag-green">眉毛</span> <span class="tag tag-orange">脸型</span> <span class="tag tag-gray">26秒</span></div>
<div class="summary-line">26秒讲清眉毛与面部结构的12条对位法则：中庭、颧骨、太阳穴、眼距、眼睛大小、下颌分别对应不同的眉形策略。</div>

<div class="map">
<h2>核心脉络</h2>
<div class="diagram">
<div class="node">面部特征<br/><small>6个维度</small></div>
<div class="arrow">→</div>
<div class="node node-green">眉形决策<br/><small>12条规则</small></div>
<div class="arrow">→</div>
<div class="node node-orange">视觉优化<br/><small>协调五官</small></div>
</div>
<p style="text-align:center;color:#64748b;margin-top:12px;">眉毛不是独立造型，而是面部特征的视觉平衡器</p>
</div>

<div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">中挺長 美貌就要平</span></div>
<div class="timeline-item"><span class="timeline-time">[00:02]</span><span class="timeline-text">中挺短 美貌就要挑</span></div>
<div class="timeline-item"><span class="timeline-time">[00:04]</span><span class="timeline-text">全骨凸 美貌就要柔</span></div>
<div class="timeline-item"><span class="timeline-time">[00:06]</span><span class="timeline-text">全骨平 美貌就要立</span></div>




<div class="timeline-item"><span class="timeline-time">[00:17]</span><span class="timeline-text">眼睛大 美貌就要粗</span></div>
<div class="timeline-item"><span class="timeline-time">[00:19]</span><span class="timeline-text">眼睛小 美貌就要細</span></div>
<div class="timeline-item"><span class="timeline-time">[00:21]</span><span class="timeline-text">下河寬 美貌就要長</span></div>
<div class="timeline-item"><span class="timeline-time">[00:23]</span><span class="timeline-text">下河窄 美貌就要短</span></div>
</div>

<div class="card">
<h3>纵轴维度：中庭</h3>
<table><thead><tr><th>中庭状态</th><th>眉毛策略</th><th>逻辑</th></tr></thead>
<tbody>
<tr><td>中庭长</td><td>眉毛要平</td><td>平眉缩短视觉中庭长度</td></tr>
<tr><td>中庭短</td><td>眉毛要挑</td><td>挑眉拉长视觉中庭长度</td></tr>
</tbody></table>
</div>

<div class="card card-green">
<h3>骨骼维度：颧骨</h3>
<table><thead><tr><th>颧骨状态</th><th>眉毛策略</th><th>逻辑</th></tr></thead>
<tbody>
<tr><td>颧骨凸</td><td>眉毛要柔</td><td>柔和眉形弱化颧骨棱角</td></tr>
<tr><td>颧骨平</td><td>眉毛要立</td><td>立体眉形增加面部立体感</td></tr>
</tbody></table>
</div>

<div class="card card-orange">
<h3>横轴维度：太阳穴 + 眼距</h3>
<table><thead><tr><th>面部特征</th><th>眉毛策略</th><th>逻辑</th></tr></thead>
<tbody>
<tr><td>太阳穴凹</td><td>眉尾要窄</td><td>窄眉尾避免视觉收缩</td></tr>
<tr><td>太阳穴满</td><td>眉尾要收</td><td>收紧眉尾平衡饱满太阳穴</td></tr>
<tr><td>眼距近</td><td>眉毛要远</td><td>拉开眉头间距，分散视觉焦点</td></tr>
<tr><td>眼距远</td><td>眉毛要近</td><td>拉近眉头间距，集中视觉焦点</td></tr>
</tbody></table>
</div>

<div class="card card-purple">
<h3>五官与轮廓维度：眼睛 + 下颌</h3>
<table><thead><tr><th>面部特征</th><th>眉毛策略</th><th>逻辑</th></tr></thead>
<tbody>
<tr><td>眼睛大</td><td>眉毛要粗</td><td>粗眉匹配大眼的视觉重量</td></tr>
<tr><td>眼睛小</td><td>眉毛要细</td><td>细眉匹配小眼的视觉重量</td></tr>
<tr><td>下颌宽</td><td>眉毛要长</td><td>长眉平衡宽下颌的横向延展</td></tr>
<tr><td>下颌窄</td><td>眉毛要短</td><td>短眉匹配窄下颌的精致感</td></tr>
</tbody></table>
</div>

<div class="section"><div class="sec-title">适用边界</div><div class="boundary"><p><strong>适用场景：</strong>日常化妆/新手进阶练习</p><p><strong>不适用场景：</strong>专业舞台妆或特效化妆</p><p><strong>前提条件：</strong>具备基础化妆工具和产品</p></div></div><div class="section"><div class="sec-title">常见误区</div><div class="card card-red"><h3>避坑总结</h3><div class="pitfall">最常见的操作误区会导致事倍功半，务必对照视频要点逐一检查每个关键环节。</div></div></div><div class="conclusion">
<h2>总结与行动</h2>
<h3>核心要点</h3>
<ul><li>眉毛的目标是平衡面部结构的视觉关系，不是追求网红同款</li><li>6个面部维度（中庭、颧骨、太阳穴、眼距、眼睛大小、下颌）各对应一对眉形策略</li><li>所有规则都遵循同一条底层逻辑：用眉毛反向修正面部特征带来的视觉偏差</li></ul>
<h3>行动清单</h3>
<ul><li>先自测6个面部维度，确定每个维度属于「长/短」「凸/平」等哪一端</li><li>对着镜子逐一验证每一条规则是否适用于自己</li><li>优先处理最明显的面部特征对应的眉形规则</li><li>眉毛不是一次定型——不同妆容和风格可微调</li></ul>
<h3>关键认知转变</h3>
<p>从「什么眉毛流行」转向「我的脸适合什么眉毛」。眉毛不是目的地，而是优化面部视觉平衡的工具。</p>
</div>
</div></div>
</foreignObject>
</svg>