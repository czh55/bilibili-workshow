<div class="svg-page">
  <div class="container">
    <h1>衣服好坏分辨真的只需一眼</h1>
    <div class="meta">
      <span class="tag tag-blue">小红书</span>
      <span class="tag tag-green">55 秒</span>
      <span class="tag tag-purple">买衣技巧</span>
      <span class="tag tag-orange">做工细节</span>
      <span class="tag tag-gray">理性分析视角</span>
    </div>
    <a class="source-link" href="http://xhslink.cn/o/7eYFp0HylGg">原视频：xhslink.cn/o/7eYFp0HylGg</a>
    <div class="summary-line"><strong>核心判断：</strong>视频把“衣服好坏一眼分辨”落成四组可现场检查的结构信号——前短后长衣长、领口横开度、领圈厚度层数、通肩拉条拐角吃量。它是店内快速验货清单，不是对面料成分、品牌档次或长期耐穿的对照实验。</div>

    <div class="timeline">
      <h3>关键证据时间轴</h3>
      <div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">叠字“差的 / 好的”，建立好坏并排的观看框架。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:04</span><span class="timeline-text">字幕点名女生 T 恤，不要选前短后长。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">胸前被顶起，前面更短还翘，领口往后跑、易卡脖子。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:14</span><span class="timeline-text">下摆只能往下拽；转入领口久穿不变形的话题。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:17</span><span class="timeline-text">推荐更大领横开：用手掌量，至少多出两公分。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:24</span><span class="timeline-text">一掌或小于一掌：螺纹再好，仍易发黄变形。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:29</span><span class="timeline-text">溜肩、脖子粗：厚领圈别考虑。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:36</span><span class="timeline-text">缝份与多层面料叠加，只会显脖子更粗、肩更溜。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:41</span><span class="timeline-text">通肩拉条拐角要从正面看做工。</span></div>
      <div class="timeline-item"><span class="timeline-time">00:52</span><span class="timeline-text">宽窄不匀意味着吃量问题，穿上出现小凸起鼓包。</span></div>
    </div>

    <div class="map">
      <h2>核心脉络</h2>
      <div class="diagram">
        <div class="node">问题<br/><span class="small">如何一眼分辨<br/>衣服好坏</span></div>
        <div class="arrow">→</div>
        <div class="node">证据<br/><span class="small">衣长 / 领口<br/>领圈 / 拉条</span></div>
        <div class="arrow">→</div>
        <div class="node node-orange">判断<br/><span class="small">结构信号可查<br/>不等于面料真相</span></div>
        <div class="arrow">→</div>
        <div class="node node-green">行动<br/><span class="small">店内 4 步<br/>快速验货</span></div>
      </div>
    </div>

    <div class="correction">
      <h3>避坑总结 · 常见误解与认知纠偏</h3>
      <p><strong>误解 1：</strong>“螺纹用料好 = 领口一定不变形。”视频反例是领横开过小，穿脱仍会撑坏。</p>
      <p><strong>误解 2：</strong>“厚领圈更显品质。”对溜肩/粗脖人群，厚度可能放大视觉负担。</p>
      <p><strong>误解 3：</strong>“线走歪只是缝制瑕疵。”通肩拉条拐角宽窄不匀，可能是吃量问题，上身会鼓包。</p>
    </div>

    <div class="section">
      <h2 class="sec-title">四组验货信号</h2>

      <div class="card">
        <h3>1. 前短后长衣长：上身后的连锁变形</h3>
        <p class="label">在讲什么</p>
        <p>女生 T 恤若前短后长，胸部顶起后前面更短还翘，领口往后跑，容易卡脖子，下摆还得往下拽。</p>
        <p class="label">关键理解</p>
        <p>问题不只是“款式偏好”，而是衣长差会通过胸型把领口与下摆一起拽偏。</p>
        <p class="label">怎么用</p>
        <p>挂着看前后衣长差；必要时比对自己胸线，想象上身后前片是否会被顶短。</p>
        <div class="quote">原文依据（字幕校正）：“千万不要去选这种前短后长的……胸部这一块它是顶起来的……领口还往后跑。”</div>
        <div class="relation">关系：衣长差 → 胸前顶起 → 领口后跑 / 下摆需拽</div>
      </div>

      <div class="card card-green">
        <h3>2. 领口横开度：用手掌当尺子</h3>
        <p class="label">在讲什么</p>
        <p>想要久穿球领不变形，选领横开更大的款：比自己手掌至少多出两公分；一掌或更小则易撑变形、发黄。</p>
        <p class="label">关键理解</p>
        <p>螺纹质量是必要条件，不是充分条件；开口余量决定穿脱张力。</p>
        <p class="label">怎么用</p>
        <p>店里直接把手掌横在领口内侧测量，优先保留 ≥2cm 余量。</p>
        <div class="quote">原文依据（字幕校正）：“搭你自己的手掌，至少两公分以上的，穿脱才不容易被撑变形……依然容易发黄变形。”</div>
        <div class="highlight">可操作阈值：领横开 ≥ 手掌宽度 + 2cm</div>
      </div>

      <div class="card card-purple">
        <h3>3. 厚领圈：对特定体型是减分项</h3>
        <p class="label">在讲什么</p>
        <p>溜肩或脖子较粗时，过厚领圈加上里外缝份与多层面料，会显脖子更粗、肩更溜。</p>
        <p class="label">关键理解</p>
        <p>这是讲述者基于体型的风格建议，不是“厚领=差衣”的普遍定律。</p>
        <p class="label">怎么用</p>
        <p>先摸领圈厚度与缝份堆叠，再对照自己的肩颈比例；不适用所有审美偏好。</p>
        <div class="quote">原文依据（字幕校正）：“溜肩还有脖子比较粗的女生，像这种领圈就别考虑了……只会显得你脖子更粗，肩更溜。”</div>
        <div class="pitfall">陷阱：把“厚实”直接等同于“高品质”，忽略视觉体积。</div>
      </div>

      <div class="card card-orange">
        <h3>4. 通肩拉条拐角：宽窄不匀 = 吃量风险</h3>
        <p class="label">在讲什么</p>
        <p>带通肩拉条的衣服，要从正面看拐角做工；有宽有窄不只是线歪，可能是吃量问题，上身出现小凸起鼓包。</p>
        <p class="label">关键理解</p>
        <p>把缝线歪斜升级为结构吃量问题，解释为什么瑕疵会在穿着时显现。</p>
        <p class="label">怎么用</p>
        <p>正视肩领交接处，左右对比拉条宽度；发现宽窄跳变就慎重。</p>
        <div class="quote">原文依据（字幕校正）：“但凡带这种通肩拉条的衣服……有宽有窄……它出现了吃量……会有一个小凸起鼓包。”</div>
        <div class="insight">观察顺序：正面 → 左右对比 → 想象上身鼓包位置</div>
      </div>
    </div>

    <div class="card">
      <h3>横向对比：四项信号怎么取舍</h3>
      <table>
        <thead>
          <tr>
            <th>检查点</th>
            <th>优先看什么</th>
            <th>负面信号</th>
            <th>适用边界</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>衣长</td>
            <td>前后长度差</td>
            <td>前短后长导致领口后跑</td>
            <td>主要针对有胸型支撑的女生 T 恤场景</td>
          </tr>
          <tr>
            <td>领口</td>
            <td>横开相对手掌余量</td>
            <td>≤一掌，久穿易发黄变形</td>
            <td>未覆盖拉链领、V 领等其他结构</td>
          </tr>
          <tr>
            <td>领圈厚度</td>
            <td>缝份与面料层数</td>
            <td>过厚显脖粗、肩溜</td>
            <td>对溜肩/粗脖更敏感；审美偏好可例外</td>
          </tr>
          <tr>
            <td>通肩拉条</td>
            <td>拐角宽窄一致性</td>
            <td>吃量不匀 → 鼓包</td>
            <td>只覆盖有通肩拉条的款式</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="section">
      <h2 class="sec-title">立场分层与方法边界</h2>
      <div class="stance-grid">
        <div class="stance-item">
          <strong>可验证事实</strong>
          <p>视频展示了前短后长、手掌量领、厚领圈与拉条拐角等店内可复现动作；时长 55 秒，主题为买衣技巧。</p>
        </div>
        <div class="stance-item">
          <strong>讲述者观点</strong>
          <p>前短后长“千万不要选”、厚领圈对溜肩/粗脖“别考虑”、拉条宽窄不匀等于吃量问题。</p>
        </div>
        <div class="stance-item">
          <strong>基于原文的推断</strong>
          <p>这四项适合当作快速筛查清单；不能据此断定面料档次、洗涤寿命或品牌价值高低。</p>
        </div>
      </div>
      <div class="card card-red" style="margin-top:20px">
        <h3>方法边界</h3>
        <ul>
          <li>样本来自店内几件样衣演示，不是多品牌盲测。</li>
          <li>未给出面料成分、克重、水洗实验或价格对照。</li>
          <li>体型建议（溜肩、粗脖）是风格判断，存在审美例外。</li>
          <li>Whisper 对术语误识别较多；分析以可见字幕为准。</li>
        </ul>
      </div>
    </div>

    <div class="conclusion">
      <h2>总结与行动</h2>
      <h3>核心要点</h3>
      <ul>
        <li>好坏可先看结构信号，不必先猜品牌故事。</li>
        <li>衣长差、领口余量、领圈厚度、拉条拐角构成四步清单。</li>
        <li>螺纹好≠领口稳；厚度高≠一定更显品质。</li>
      </ul>
      <h3>行动清单</h3>
      <ol>
        <li>挂看前后衣长：女生 T 恤慎选前短后长。</li>
        <li>手掌量领横开：尽量保留 ≥2cm 余量。</li>
        <li>摸领圈厚度与缝份层数，对照自己的肩颈比例。</li>
        <li>正视通肩拉条拐角，拒绝明显宽窄跳变。</li>
        <li>把以上四步当作筛查，再决定是否继续比面料与价格。</li>
      </ol>
      <h3>关键认知转变</h3>
      <p>从“凭手感猜好坏”转向“用可见结构做快速证伪”；同时承认：一眼验货能排除明显踩雷，却替代不了长期穿着与洗涤证据。</p>
    </div>

    <p class="footer">双轨产物之二 · SVG 理性分析 · 证据来自同一转录与可见字幕</p>
  </div>
</div>

    </div>
  </foreignObject>
</svg>