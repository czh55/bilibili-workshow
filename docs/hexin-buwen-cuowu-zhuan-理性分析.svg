<div class="container">
  <h1>你的【核心不稳】是因为错误的转！</h1>
  <div class="meta">
    <span class="tag tag-green">小红书</span>
    <span class="tag tag-blue">游泳</span>
    <span class="tag tag-orange">自由泳</span>
    <span class="tag tag-purple">核心稳定</span>
    <span class="tag tag-red">转肩游</span>
    <span class="tag tag-gray">2分38秒</span>
  </div>
  <a class="source-link" href="http://xhslink.cn/o/9WShSN7XuOk">原视频链接</a>
  <div class="summary-line">核心判断：自由泳「核心荡秋千」常被误读为核心力量差；讲者主张主因是错误转动——转体游、髋带肩；正确路径是转肩游、肩带髋，让核心保持拉长收紧。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">现象：游自由泳时核心像荡秋千、扭扭蛇</div></div>
    <div class="timeline-item"><div class="timeline-time">00:13</div><div class="timeline-text">设问：是核心力量差吗？立即否定</div></div>
    <div class="timeline-item"><div class="timeline-time">00:17</div><div class="timeline-text">诊断：转体游而非转肩游；髋带肩而非肩带髋</div></div>
    <div class="timeline-item"><div class="timeline-time">00:27</div><div class="timeline-text">错误念法：划手就左右翻面 → 核心永不稳定</div></div>
    <div class="timeline-item"><div class="timeline-time">00:45</div><div class="timeline-text">机制：主观翻身时发力点在核心，髋塌腰扭</div></div>
    <div class="timeline-item"><div class="timeline-time">01:21</div><div class="timeline-text">正解：转肩带身体；前伸推水驱动肩滚动</div></div>
    <div class="timeline-item"><div class="timeline-time">01:42</div><div class="timeline-text">跟练：趴平、一前一后、前置手前伸侧倾</div></div>
    <div class="timeline-item"><div class="timeline-time">02:14</div><div class="timeline-text">复述重点：转肩游 + 肩带髋</div></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">问题<br/>核心荡秋千</div>
      <div class="arrow">→</div>
      <div class="node node-orange">误区<br/>核心力量差</div>
      <div class="arrow">→</div>
      <div class="node">证据<br/>转体/髋先转</div>
      <div class="arrow">→</div>
      <div class="node node-green">判断<br/>转肩游</div>
      <div class="arrow">→</div>
      <div class="node node-green">行动<br/>肩带髋跟练</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解与认知纠偏</h3>
    <p>把「腰髋左右扭」直接等同于「核心力量不够」——视频明确否定这一默认归因。讲者观点：同一现象更可能来自转动策略错误（转体游 / 髋带肩），而不是单纯肌力不足。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">诊断：错误的转</h2>
    <div class="card card-red">
      <h3>在讲什么</h3>
      <p>核心不稳的外观是左右摇、像扭扭蛇；常见自诊是「核心力量差」。</p>
      <div class="highlight">关键纠偏：问题出在转体游而非转肩游，髋带肩而非肩带髋。</div>
      <h3>关键理解</h3>
      <p>若每次划手都主动「转左边 / 转右边」，身体像翻面，核心被迫当发动机关节，稳定无从谈起。</p>
      <div class="quote">「随着每一次的划手动作，身体就像左右的翻面……那么你的核心永远都不稳定。」（约 00:32–00:40，结合字幕校正）</div>
      <h3>怎么用</h3>
      <p>先检查脑子里的指令是不是「划手→翻身」，再决定要不要加平板支撑之类的陆地核心训练。</p>
      <div class="relation">立场分层：画面红框与症状描述属可观察现象；「不是力量差而是转动错」是讲者观点。</div>
    </div>

    <div class="card card-orange">
      <h3>机制：为什么用核心翻就稳不住</h3>
      <p>主观想翻身体时，发力点落在核心——类比躺床翻身由肚子带动。水中同样做，髋塌、腰扭；「用核心发力又想稳住核心」互相冲突。</p>
      <div class="pitfall">陷阱：把陆地翻身习惯直接搬进自由泳转动。</div>
      <div class="quote">「你用核心发力，用核心做动作，你还想维持它的稳定，这几乎是不可能的事。」（约 01:14–01:21）</div>
      <h3>怎么用</h3>
      <p>把「翻身」换成「肩滚动带动侧倾」；感受发力点从腰腹前移到肩带联动。</p>
      <div class="relation">方法边界：类比帮助理解发力点，不等于否定所有核心参与；视频主张核心应「拉长收紧」而非当转动发动机。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">正解与跟练</h2>
    <div class="card card-green">
      <h3>在讲什么</h3>
      <p>正确转动：转肩带着身体转；前伸推水让肩膀滚动，身体跟随；主力军是肩膀联动。</p>
      <div class="insight">目标状态：核心拉长收紧、不塌不扭，连贯后不再荡秋千。</div>
      <div class="quote">「而自由泳正确的转动并不是去翻身体转体，而是转肩带着身体转。」（约 01:21–01:29）</div>
      <h3>怎么用</h3>
      <ol>
        <li>水中趴平，手臂一前一后</li>
        <li>前置手向前伸</li>
        <li>胳膊带肩转，肩带身体侧倾</li>
        <li>多做几次建立「肩带髋」体感</li>
      </ol>
      <div class="action">口诀：肩带髋，不要髋先转带着肩去拧。</div>
      <div class="relation">原文依据：约 01:42–02:14 跟练段 + 画面叠字「是肩带髋」。</div>
    </div>

    <div class="card card-purple">
      <h3><span class="speaker speaker-host">讲者观点</span>两句复述</h3>
      <p>收尾再次钉死两句：转肩游而非转体游；肩带髋而不是髋带肩。</p>
      <div class="highlight">这是视频可执行的决策规则，不是一般「多练核心」的空泛建议。</div>
      <div class="quote">「再重复一下重点，转肩游而非转体游；肩带髋，而不是髋带肩。」（约 02:14–02:24，字幕校正）</div>
    </div>
  </div>

  <div class="card">
    <h3>横向对比：两种转动策略</h3>
    <table>
      <thead>
        <tr>
          <th>维度</th>
          <th>转体游 / 髋带肩（错误）</th>
          <th>转肩游 / 肩带髋（主张）</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>主观指令</td>
          <td>划手 → 左右翻面</td>
          <td>前伸推水 → 肩滚动</td>
        </tr>
        <tr>
          <td>发动关节</td>
          <td>核心 / 髋先拧</td>
          <td>肩膀联动</td>
        </tr>
        <tr>
          <td>核心状态</td>
          <td>塌、扭、荡秋千</td>
          <td>拉长收紧、不塌不扭</td>
        </tr>
        <tr>
          <td>体感类比</td>
          <td>床上翻身靠肚子</td>
          <td>肩先侧倾，身体跟随</td>
        </tr>
        <tr>
          <td>选择条件</td>
          <td>感觉腰髋左右甩、像扭扭蛇时，优先排查</td>
          <td>需要建立肩带驱动的侧倾时采用</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="card card-orange">
    <h3>避坑总结</h3>
    <ul>
      <li>不要一看见晃腰就只加陆地核心力量，先查转动策略</li>
      <li>不要用「划手转左边 / 转右边」当节奏口令</li>
      <li>不要让髋先拧再拖肩，容易塌髋扭腰</li>
      <li>不要把「转肩」理解成耸肩或硬拧脖子；视频强调肩滚动带动身体侧倾</li>
    </ul>
    <div class="pitfall">适用边界：针对自由泳转动与核心稳定关系；未给出量化力量测试，也未覆盖蝶仰蛙等其他泳姿。昵称缺失，内容归属以话题「泳培帮」与口播「泳培帮线上训练营」为准。</div>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>核心荡秋千 ≠ 自动等于核心力量差</li>
      <li>错误路径：转体游、髋带肩</li>
      <li>正确路径：转肩游、肩带髋，核心拉长收紧</li>
    </ul>
    <h3>行动清单</h3>
    <ol>
      <li>录一段自由泳俯拍，看腰髋是否左右甩</li>
      <li>默念改成「前伸推水 → 肩滚动」，停掉左右翻面口令</li>
      <li>做趴平一前一后 + 前置手前伸侧倾，每次感受肩先动</li>
      <li>体感检查：核心是否拉长收紧、髋是否少塌</li>
      <li>复述口诀：转肩游而非转体游；肩带髋而非髋带肩</li>
    </ol>
    <h3>关键认知转变</h3>
    <p>从「我核心不行」转向「我可能在用错误的转」——先改转动驱动链，再谈是否补陆地力量。</p>
  </div>

  <p class="footer">理性分析 · 小红书 · 你的【核心不稳】是因为错误的转！ · 2026-07-26</p>
</div>

    </div>
