.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>黑白弱仍光感强：冷暖通道</h1>
  <div class="meta"><span class="tag tag-blue">光感</span><span class="tag tag-green">冷暖</span><span class="tag tag-orange">明度</span><span class="tag tag-purple">色块</span><span class="tag tag-red">受光背光</span><span class="tag tag-gray">时长 89秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/1FynErXo88P">原视频</a>
  <div class="summary-line">无明显黑白也可强光感。实验消掉草地暖与树影冷后光感塌，灰度证明明度未变。秘诀是受光／背光冷暖对比。色块起稿：亮暖黄、背冷紫、底面可泛绿。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">黑白不强为何有光</span></div><div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">草地变冷</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">树影变暖</span></div><div class="timeline-item"><span class="timeline-time">00:28</span><span class="timeline-text">光感弱掉</span></div><div class="timeline-item"><span class="timeline-time">00:35</span><span class="timeline-text">明度其实没变</span></div><div class="timeline-item"><span class="timeline-time">00:39</span><span class="timeline-text">只变了冷暖</span></div><div class="timeline-item"><span class="timeline-time">00:54</span><span class="timeline-text">色块起稿</span></div><div class="timeline-item"><span class="timeline-time">01:01</span><span class="timeline-text">亮黄背紫</span></div><div class="timeline-item"><span class="timeline-time">01:18</span><span class="timeline-text">各区冷暖变化</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">问题<br/>弱黑白强光</div><span class="arrow">→</span><div class="node-green">实验<br/>消冷暖则塌</div><span class="arrow">→</span><div class="node-orange">秘诀<br/>受暖背冷</div><span class="arrow">→</span><div class="node-blue">落地<br/>色块起稿</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「密切／物质下面」→「秘诀／物体下面」。</p><p>误区：光感＝黑白拉满。视频展示冷暖通道。</p><p>误区：起稿就抠细节。强调色块先立冷暖。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>反例实验</h3>
      <p>草地变冷、树影变暖后光感全无；灰度显示明度未动。</p>
      <div class="quote">其实我只变了冷暖</div>
      <div class="relation">光感有独立于明度的温度轴。</div>
    </div>
    <div class="card card-orange">
      <h3>秘诀表述</h3>
      <p>除了明度，受光与背光的冷暖对比制造光感。</p>
      <div class="quote">受光和背光的冷暖对比还是制造光感的秘诀</div>
      <div class="relation">双通道：明度＋温度。</div>
    </div>
    <div class="card card-red">
      <h3>起稿配方</h3>
      <p>亮部受暖光发黄；背光受天光发紫；底面反光可泛绿。</p>
      <div class="quote">亮部会明显的发黄……背光……会明显的发紫</div>
      <div class="relation">先分区温度，再谈局部固有色。</div>
    </div>
    <div class="card card-purple">
      <h3>真实感</h3>
      <p>所有受光背光都有冷暖变化，光感强烈又真实。</p>
      <div class="quote">这让光感强烈又真实</div>
      <div class="relation">统一规则重复出现＝可信光。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>下期纯度</p>
      <div class="quote">预告颜色纯度如何决定光的强弱。</div>
      <div class="relation">下一期我们继续讲</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>89 秒短片，纯度与光留给下期。</li><li>猫／林间为演示素材，光源设定以画面为准。</li><li>「受光」标注为教学简化。</li></ul><div class="pitfall">只拉黑白，忽略冷暖。</div><div class="pitfall">亮部背光同温。</div><div class="pitfall">起稿陷入皮毛／树叶琐碎。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>冷暖是光感第二通道</li><li>受暖背冷</li><li>色块先于细节</li></ul><h3>行动清单</h3><ol><li>给喜欢的风景去色，看光感剩多少</li><li>再做只改冷暖的破坏实验</li><li>色块稿强制：亮黄、背紫、底微绿</li><li>自检：每个大面是否有温度差</li></ol><h3>关键认知转变</h3><p>以前：光感不够就加深阴影；现在：先问受光背光的冷暖是否还在。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 89秒</div>
</div>
    </div>
  </foreignObject>
</svg>