.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style><div class="container">
<h1>分享几个简单的拍照姿势</h1>
<div class="meta">
<span class="tag tag-blue">拍照姿势</span><span class="tag tag-green">站姿</span><span class="tag tag-orange">坐姿</span><span class="tag tag-gray">0:21</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>3个最基础的拍照纠错：①站着别直站——<strong>双腿交叉、一手摸耳、往左看</strong>；②坐着别正坐——<strong>身体侧放镜头对角线、手搭椅背</strong>；③半身别干拍——<strong>双手放后、脸朝阳光</strong>。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">站着：别直站 → 双腿交叉、一手摸耳、往左看</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">坐着：别正坐 → 身体侧放对角线上、手自然搭椅子</span></div><div class="timeline-item"><span class="timeline-time">00:14</span><span class="timeline-text">半身：别干拍 → 双手放后面、脸朝向有阳光的一面</span></div></div>
<div class='section'><div class='sec-title'>3组基础纠错</div><div class='card'><h3>① 站着</h3><p><strong>错：</strong>直直站着。<br/><strong>对：</strong><strong>双腿交叉</strong>，<strong>一只手摸耳朵</strong>，<strong>往左看</strong>——三件套下来，站姿立刻有线条有表情。</p></div><div class='card card-green' style='margin:12px 0'><h3>② 坐着</h3><p><strong>错：</strong>正对镜头坐。<br/><strong>对：</strong>把<strong>身体侧过来放在镜头的对角线上</strong>，<strong>手自然地搭在椅子上</strong>——对角线+手有落点，松弛显腿长。</p></div><div class='card card-orange'><h3>③ 拍半身</h3><p><strong>错：</strong>干站着拍半身。<br/><strong>对：</strong><strong>双手放在后面</strong>，<strong>脸朝向有阳光的一面</strong>——手收身后显瘦，脸迎光皮肤透亮。</p></div></div>
<div class="conclusion">
<h2>三个口诀</h2>
<h3>记住这三条</h3><ol><li><strong>站</strong>：双腿交叉 + 摸耳 + 侧头看</li><li><strong>坐</strong>：身体侧放对角线 + 手搭椅背</li><li><strong>半身</strong>：双手背后 + 脸迎光</li></ol><h3>核心逻辑</h3><ul><li>手永远要有<strong>落点</strong>（摸耳/搭椅/背后）</li><li>身体永远要有<strong>角度</strong>（交叉/侧放/迎光）</li></ul>
</div>
