<h1>零基础必学习的肩膀基础，你会几个？</h1>
<div class="meta">
<span class="tag tag-blue">爵士舞</span><span class="tag tag-green">基本功</span><span class="tag tag-orange">零基础</span><span class="tag tag-gray">0:09</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>爵士舞肩膀基础动作合集：<strong>单肩提沉、双肩交替、绕肩画圆、前后顶肩</strong>——肩膀是爵士舞律动的核心发动机，四个基础动作找到肩膀的“发力感”，你会几个？</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">示范1：肩膀基础动作（纯视觉教学）</span></div><div class="timeline-item"><span class="timeline-time">00:03</span><span class="timeline-text">示范2：变换方向继续展示</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">示范3：更多动作变化</span></div><div class="timeline-item"><span class="timeline-time">00:09</span><span class="timeline-text">合集结束：你会几个？</span></div></div>
<div class='section'><div class='sec-title'>肩膀基础四件套</div><div class='card'><h3>① 单肩提沉</h3><p>一边肩膀<strong>向上提、再向下沉</strong>，左右交替。练的是肩膀的<strong>独立性</strong>——这是爵士舞最基础的肩膀发力。</p></div><div class='card card-green' style='margin:12px 0'><h3>② 双肩交替滚动</h3><p>左肩右肩<strong>依次滚动</strong>，像波浪一样传递。练的是肩膀的<strong>连贯性</strong>，为后面的身体wave打基础。</p></div><div class='card card-orange' style='margin:12px 0'><h3>③ 绕肩画圆</h3><p>肩膀<strong>向前/向后画圆</strong>（绕环），充分活动肩关节。练的是肩膀的<strong>幅度与灵活度</strong>。</p></div><div class='card card-purple'><h3>④ 前后顶肩</h3><p>肩膀<strong>向前顶、向后收</strong>，配合胸腔。练的是肩膀的<strong>爆发与节奏感</strong>，爵士舞甩头、顶胯都靠它带动。</p></div></div>
<div class="conclusion">
<h2>肩膀基础练习清单</h2>
<h3>零基础怎么练</h3><ol><li><strong>先单后双</strong>：练好单肩提沉，再练双肩交替</li><li><strong>先慢后快</strong>：慢速找发力点，熟练后再跟节奏</li><li><strong>对镜检查</strong>：肩膀动时头别跟着晃，身体稳住</li></ol><h3>练到位标准</h3><ul><li>左右肩<strong>各自独立</strong>，不互相牵动</li><li>动作有<strong>幅度</strong>，不是小碎动</li><li>能卡上<strong>节拍</strong>，肩膀像跟着音乐说话</li></ul>
</div>
