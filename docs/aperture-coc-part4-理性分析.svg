<div class="svg-page">
  <div class="container">
    <h1>弥散圆（四）：从容许模糊到焦点外光锥</h1>
    <div class="meta">
      <span class="tag tag-blue">小红书</span>
      <span class="tag tag-green">1分51秒</span>
      <span class="tag tag-orange">摄影科普</span>
      <span class="tag tag-purple">弥散圆 / 景深基础</span>
      <span class="tag tag-gray">理性分析</span>
    </div>
    <a class="source-link" href="http://xhslink.cn/o/82oVAQNcUTq">原视频：相机「光圈」底层逻辑科普，弥散圆（四）</a>
    <div class="summary-line">
      <strong>核心判断：</strong>本集真正回答的不是「怎么拍出浅景深」，而是「什么叫可接受的清晰」。先用观看距离把<span class="key-data">弥散圆</span>缩到视觉阈值，得到<span class="key-data">容许弥散圆</span>；再把镜头简化为凸透镜 + 光圈，说明只有焦点与传感器重合时点才最清晰，焦点外的光锥截面就是弥散圆——这是后续景深讨论的尺子。
    </div>

    <div class="timeline">
      <h3>关键证据时间轴</h3>
      <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">展示模糊圆，建立「糊」的视觉对象</div></div>
      <div class="timeline-item"><div class="timeline-time">00:03</div><div class="timeline-text">命名弥散圆 / circle of confusion</div></div>
      <div class="timeline-item"><div class="timeline-time">00:05</div><div class="timeline-text">设定 6 英寸手机、约 30cm 观看距离并缩小弥散圆</div></div>
      <div class="timeline-item"><div class="timeline-time">00:18</div><div class="timeline-text">得到「可接受的清晰圆」= 容许弥散圆</div></div>
      <div class="timeline-item"><div class="timeline-time">00:34</div><div class="timeline-text">复杂镜头仍归结为凸透镜成像原理</div></div>
      <div class="timeline-item"><div class="timeline-time">00:40</div><div class="timeline-text">简化模型：凸透镜成像 + 光圈控通光孔径</div></div>
      <div class="timeline-item"><div class="timeline-time">01:04</div><div class="timeline-text">点光源 → 折射光锥 → 汇聚焦点</div></div>
      <div class="timeline-item"><div class="timeline-time">01:23</div><div class="timeline-text">焦点落传感器得清晰倒立像；焦点外光锥截面=弥散圆</div></div>
    </div>

    <div class="map">
      <h2>核心脉络</h2>
      <div class="diagram">
        <div class="node">模糊圆<br/>感知对象</div>
        <div class="arrow">→</div>
        <div class="node">观看条件<br/>缩小尺寸</div>
        <div class="arrow">→</div>
        <div class="node node-green">容许弥散圆<br/>可接受清晰</div>
        <div class="arrow">→</div>
        <div class="node">光锥 + 焦点<br/>成像几何</div>
        <div class="arrow">→</div>
        <div class="node node-orange">焦点外截面<br/>仍是弥散圆</div>
      </div>
    </div>

    <div class="correction">
      <h3>常见误解纠偏</h3>
      <p>「对焦成功 = 画面每个像素都绝对锐利」——视频立场是：严格来说只有焦点上最清晰；日常「清晰」多指弥散圆已小于容许弥散圆。另：复杂镜头组不是「另一套物理」，根基仍是凸透镜成像。</p>
    </div>

    <div class="section">
      <h2 class="sec-title">概念层：弥散圆与容许弥散圆</h2>
      <div class="card">
        <h3>在讲什么</h3>
        <p>物点经光学系统后，理想上应成一个点；离焦或截面不在焦点时，截面变成扩散的圆——弥散圆。当圆小到在给定观看条件下察觉不到糊，就叫容许弥散圆。</p>
        <div class="highlight">关键理解：清晰是「可接受的模糊」，不是数学上的零尺寸点。</div>
        <div class="action">怎么用：讨论景深、合焦范围前，先固定观看介质与距离，否则「够不够锐」没有统一尺子。</div>
        <div class="quote">原文依据：[00:03—00:26] 命名弥散圆 → 6 英寸手机 / 约 30cm → 缩小至可接受清晰圆 → 容许弥散圆。</div>
      </div>
      <div class="card card-purple">
        <h3><span class="speaker speaker-host">UP 主观点</span>观看条件决定「可接受」阈值</h3>
        <p>视频用具体数字（约 6 英寸、约 30cm）作演示条件，不是发布行业标准 CoC 表；立场是「条件变了，可接受尺寸也会变」。</p>
        <div class="relation">证据强度：演示级论证；便于建立直觉，尚未给出传感器格式对应的工程 CoC 数值。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">几何层：凸透镜、光锥与焦点</h2>
      <div class="card card-green">
        <h3>在讲什么</h3>
        <p>多组多枚镜片可简化为一枚凸透镜 + 光圈。物点反射光进入镜头，折射后如光锥汇聚到交叉点（焦点）；焦点与传感器重合则该点清晰，平面上多点对应投射形成清晰倒立像。</p>
        <div class="highlight">关键理解：焦点是光锥的交叉点；传感器若切在交叉点之外，切到的是更大的圆截面。</div>
        <div class="action">怎么用：对焦 = 让目标物点的焦点落到传感器平面；光圈在本集主要被定位为「控制通光孔径」的部件（曝光/景深细节留给前后集）。</div>
        <div class="quote">原文依据：[00:34—01:38] 凸透镜原理 → 简化模型 → 光锥汇聚 → 清晰倒立像。</div>
      </div>
      <div class="card card-orange">
        <h3>风险与边界</h3>
        <p>传感器像素给出「可成像最小单位」的物理下限；理论无限小的点无法被离散传感器完整保留。视频未展开衍射极限、像差与像素间距的定量关系。</p>
        <div class="pitfall">避坑：不要把教学简化模型当成「真实镜头只有一片凸透镜」；也不要把本集的观看演示数字直接当全画幅工程 CoC。</div>
      </div>
    </div>

    <div class="card">
      <h3>横向对比：三种「圆 / 点」角色</h3>
      <table>
        <thead>
          <tr>
            <th>对象</th>
            <th>含义</th>
            <th>何时出现</th>
            <th>决策含义</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>弥散圆</td>
            <td>离焦或焦点外光锥截面形成的模糊圆</td>
            <td>焦点不在传感器，或观察光锥非交叉点截面</td>
            <td>解释「为什么糊」</td>
          </tr>
          <tr>
            <td>容许弥散圆</td>
            <td>在给定观看条件下可当作清晰的弥散圆上限</td>
            <td>圆缩小到察觉不到糊</td>
            <td>定义「多远仍算合焦」的尺子</td>
          </tr>
          <tr>
            <td>焦点（交叉点）</td>
            <td>光锥汇聚的理论最清晰位置</td>
            <td>与传感器重合时点成像最清晰</td>
            <td>对焦操作的几何目标</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <h3>立场分层</h3>
      <div class="stance-grid">
        <div class="stance-item">
          <strong>可验证事实</strong>
          凸透镜可使光线汇聚；离焦截面呈圆斑；传感器有最小成像单元限制。
        </div>
        <div class="stance-item">
          <strong>UP 主观点 / 演示设定</strong>
          用 6 英寸手机、约 30cm 距离演示「可接受」阈值；教学上把复杂镜头简化为凸透镜 + 光圈。
        </div>
        <div class="stance-item">
          <strong>基于原文的推断</strong>
          容许弥散圆将作为后续景深章节的核心判据；本集先把尺子造出来。
        </div>
      </div>
    </div>

    <div class="conclusion">
      <h2>总结与行动</h2>
      <h3>核心要点</h3>
      <ul>
        <li>弥散圆描述的是「点变成了多大的糊圆」。</li>
        <li>容许弥散圆 = 在特定观看条件下仍可当作清晰的上限。</li>
        <li>严格清晰只在焦点；焦点外光锥截面仍是弥散圆。</li>
      </ul>
      <h3>行动清单</h3>
      <ol>
        <li>谈锐度前先固定输出介质与观看距离，避免空对空争论。</li>
        <li>对焦时把目标理解为「让该物点焦点落在传感器」。</li>
        <li>把本集的容许弥散圆当作尺子，再去理解后续景深范围。</li>
        <li>读工程景深表时，核对所用 CoC 是否匹配你的画幅与用途。</li>
        <li>别把动画简化模型当成真实镜头只有一片玻璃。</li>
      </ol>
      <h3>关键认知转变</h3>
      <p>从「清晰 / 模糊是二值」转向「清晰是弥散圆是否小于容许阈值」；景深不是魔法，而是这把尺子在物距方向上的投影。</p>
    </div>

    <p class="footer">理性分析 · 与图文实录共享同一转录证据 · aperture-coc-part4</p>
  </div>
</div>

    </div>
  </foreignObject>
</svg>