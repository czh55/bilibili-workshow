.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>伟大的几何体：马的体块脚手架</h1>
  <div class="meta"><span class="tag tag-blue">几何体块</span><span class="tag tag-green">马</span><span class="tag tag-orange">透视</span><span class="tag tag-purple">体块</span><span class="tag tag-red">造型</span><span class="tag tag-gray">时长 94秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/7flDH69qTo6">原视频</a>
  <div class="summary-line">马装进方盒：头棱锥、颈圆柱、胸梯形、腰变径圆柱、臀切面半圆；腿再分扁圆柱／棱柱。体块支撑细化、肌肉与光影；换仰视继续练。几何体是造型脚手架。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">看成几何体块就简单</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">方盒假设</span></div><div class="timeline-item"><span class="timeline-time">00:09</span><span class="timeline-text">头颈胸腰臀体块清单</span></div><div class="timeline-item"><span class="timeline-time">00:27</span><span class="timeline-text">方盒检查透视</span></div><div class="timeline-item"><span class="timeline-time">00:41</span><span class="timeline-text">体块支撑细化与光影</span></div><div class="timeline-item"><span class="timeline-time">01:04</span><span class="timeline-text">换仰视角度练习</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">容器<br/>方盒</div><span class="arrow">→</span><div class="node-green">拆解<br/>标准体块</div><span class="arrow">→</span><div class="node-orange">收益<br/>透视／光影</div><span class="arrow">→</span><div class="node-blue">练习<br/>换角</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「棱椎体／仰式／强不到／合掌见」→「棱锥体／仰视／强到／课程见」。</p><p>误区：几何体＝儿童简笔画。视频强调透视可检查。</p><p>误区：有体块就不用结构。蹄子仍要结构与形变。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>方盒＋体块清单</h3>
      <p>头棱锥、颈弯曲圆柱、胸梯形、腰变径圆柱、臀切面半圆——复杂变零件。</p>
      <div class="quote">头部类似一个棱锥体……胸部像一个梯形的体块</div>
      <div class="relation">先命名体块，再画画。</div>
    </div>
    <div class="card card-orange">
      <h3>方盒查透视</h3>
      <p>通过方盒子随时检查体块透视，避免局部看起来「对」整体歪。</p>
      <div class="quote">通过方盒子，我们可以随时检查体块的透视</div>
      <div class="relation">透视有容器才可验。</div>
    </div>
    <div class="card card-red">
      <h3>体块是细化底座</h3>
      <p>肌肉附着、光影理解都因体块变容易；蹄子仍要注意结构与透视形变。</p>
      <div class="quote">有了体块的支撑，细化就会很轻松</div>
      <div class="relation">脚手架不替代结构，但先立架。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>换角练</p>
      <div class="quote">仰视等角度不断练，体块思维才会真强。</div>
      <div class="relation">我们还可以换一个仰视的角度……不断这样进行练习</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>94 秒马体示范，非全动物解剖。</li><li>体块为教学简化。</li><li>鼓励语「强到飞起」非量化承诺。</li></ul><div class="pitfall">直接贴皮毛纹理。</div><div class="pitfall">体块互不咬合，腰胸错位。</div><div class="pitfall">只练侧面，换角崩盘。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>复杂对象先体块化</li><li>方盒可验透视</li><li>细化附着在体块上</li></ul><h3>行动清单</h3><ol><li>侧立马：画出方盒与五个体块</li><li>检查腰两头大小是否不同</li><li>加腿体块后再贴大肌肉</li><li>换仰视重画同一清单</li></ol><h3>关键认知转变</h3><p>以前：马难在细节多；现在：难在没脚手架——体块立住，细节才有地方长。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 94秒</div>
</div>
    </div>
  </foreignObject>
</svg>