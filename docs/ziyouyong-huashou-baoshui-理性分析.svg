.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}</style>
      
<div class="container">
  <h1>自由泳划手抱水纠正～</h1>
  <div class="meta">
    <span class="tag tag-blue">小红书</span>
    <span class="tag tag-green">17秒</span>
    <span class="tag tag-orange">自由泳</span>
    <span class="tag tag-purple">抱水纠正</span>
    <span class="tag tag-gray">画面证据为主</span>
  </div>
  <a class="source-link" href="http://xhslink.cn/o/4sXxvaGdkYx">原视频短链 →</a>
  <div class="summary-line">核心判断：自由泳抱水的关键不在「把肘弯起来」，而在大臂内旋 + 肩膀前伸；肩胛外展是连带条件，「想象抱住一颗球」是把正确空间感固化的口诀。证据主要来自画面大字与红叉/箭头标注，口播不可辨。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">标题「自由泳划手抱水纠正」——确立问题域（陆上跪姿演示）</div></div>
    <div class="timeline-item"><div class="timeline-time">00:02</div><div class="timeline-text">错误：「大臂无内旋」+ 红叉——平伸臂被否定</div></div>
    <div class="timeline-item"><div class="timeline-time">00:04</div><div class="timeline-text">弯肘仍标「大臂无内旋」+ 红叉——弯肘非充分条件</div></div>
    <div class="timeline-item"><div class="timeline-time">00:06</div><div class="timeline-text">纠正：「大臂转向内旋」+ 肩部红箭头</div></div>
    <div class="timeline-item"><div class="timeline-time">00:08</div><div class="timeline-text">连带：「肩胛骨向外展」+ 背部红箭头</div></div>
    <div class="timeline-item"><div class="timeline-time">00:10</div><div class="timeline-text">正确形态：「肩膀前伸 大臂内旋」高肘抱水</div></div>
    <div class="timeline-item"><div class="timeline-time">00:14</div><div class="timeline-text">体感口诀：「想象抱住一颗球」+ 足球图示</div></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">问题：抱水无力/形状不对</div>
      <div class="arrow">→</div>
      <div class="node node-orange">误区：只弯肘、无内旋</div>
      <div class="arrow">→</div>
      <div class="node">证据：内旋 + 肩胛外展 + 前伸</div>
      <div class="arrow">→</div>
      <div class="node node-green">行动：高肘抱球感陆上练</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解与认知纠偏</h3>
    <p>误解：弯肘 = 抱水正确。纠偏：视频在弯肘姿态上仍打红叉并写「大臂无内旋」——弯肘只是外形，内旋才是驱动抱水的关键转动。立场：画面标注给出的教学观点，非实验室测量结论。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">错误形态：大臂无内旋</h2>
    <div class="card card-red">
      <h3>在讲什么</h3>
      <p>平伸臂与空弯肘两种演示，都被标成「大臂无内旋」并配红叉。</p>
      <div class="highlight">关键理解：缺少内旋时，前臂难以形成有效「卡住水」的触水面；弯肘本身不能补救。</div>
      <div class="action">怎么用：陆上自检时，若只是把肘垂下、大臂仍朝前「直推」，先暂停，回到内旋。</div>
      <div class="quote">原文依据（画面）：「大臂无内旋」+ 红叉（约 00:02–00:04）</div>
      <div class="relation">立场分层：事实=画面打了红叉；观点=作者把无内旋定义为错误根因；推断=这会导致抱水无力（视频未测量阻力）。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">正确驱动：内旋 + 肩胛外展 + 前伸</h2>
    <div class="card card-green">
      <h3>在讲什么</h3>
      <p>正向链条分三步：大臂转向内旋 → 肩胛骨向外展 → 肩膀前伸叠加大臂内旋，形成高肘抱水。</p>
      <div class="highlight">关键理解：内旋是转动轴，肩胛外展打开肩带空间，前伸把触水点送远——三者是组合，不是三选一。</div>
      <div class="action">怎么用：跪姿或站姿伸臂，先做大臂内旋，再感受肩胛外滑，最后维持高肘前伸。</div>
      <div class="quote">原文依据（画面）：「大臂转向内旋」「肩胛骨向外展」「肩膀前伸 大臂内旋」（约 00:06–00:10）</div>
    </div>
    <div class="card card-purple">
      <h3>体感口诀：想象抱住一颗球</h3>
      <p><span class="speaker speaker-host">UP 主观点</span>用足球图示把正确空间压成一句可执行口令。</p>
      <div class="insight">怎么用：肘腕与胸口之间留出「球」的空隙；压扁这个空隙往往意味着肘塌或内旋不足。</div>
      <div class="quote">原文依据（画面）：「想象抱住一颗球」+ 足球图示（约 00:14）</div>
      <div class="pitfall">避坑：别把「抱球」理解成手臂夹死贴胸；图示强调的是环抱空间，不是夹紧。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">错误 vs 正确对照</h2>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>维度</th>
            <th>错误（红叉）</th>
            <th>正确（箭头/口诀）</th>
            <th>选择条件</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>大臂</td>
            <td>无内旋；平伸或空弯肘</td>
            <td>转向内旋</td>
            <td>抱水启动时先检查转动，而非只看肘角</td>
          </tr>
          <tr>
            <td>肩带</td>
            <td>未提示外展（错误段未出现）</td>
            <td>肩胛骨向外展 + 肩膀前伸</td>
            <td>感觉肩紧、伸不远时优先开肩胛</td>
          </tr>
          <tr>
            <td>体感锚点</td>
            <td>无正向锚点</td>
            <td>想象抱住一颗球</td>
            <td>陆上定型、水中自检都可用</td>
          </tr>
          <tr>
            <td>证据类型</td>
            <td>画面红叉 + 黄字</td>
            <td>红箭头 + 黄字 + 足球图示</td>
            <td>短视频教学示意，非测力数据</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">适用边界与避坑</h2>
    <div class="card card-orange">
      <h3>方法边界</h3>
      <ul>
        <li><strong>适用：</strong>自由泳抱水/高肘入水后的陆上纠形；初学者建立「内旋+前伸」肌肉记忆。</li>
        <li><strong>上限：</strong>17 秒跪姿示意，不含水中阻力、呼吸侧转、节奏与全身配合。</li>
        <li><strong>反例/例外：</strong>肩伤、肩峰撞击或医嘱限制内旋/外展者，不应照搬幅度；教练个体化调整优先。</li>
        <li><strong>证据强弱：</strong>画面标注清晰，但口播不可辨；力学效果为教学推断，非实测。</li>
      </ul>
      <div class="pitfall">避坑：把弯肘当完成条件；夹臂贴胸当「抱球」；忽略肩胛只拧大臂导致耸肩代偿。</div>
    </div>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>错误根因被标为「大臂无内旋」，弯肘不能单独过关。</li>
      <li>正确链条：大臂内旋 → 肩胛外展 → 肩膀前伸 + 高肘抱水。</li>
      <li>「想象抱住一颗球」把空间感固化成可练口诀。</li>
    </ul>
    <h3>行动清单</h3>
    <ol>
      <li>跪姿或站姿伸臂，对着镜子先做大臂内旋，再弯肘。</li>
      <li>加一次肩胛外展：感觉肩胛向外滑开，而不是耸肩。</li>
      <li>定格「肩膀前伸 + 大臂内旋」高肘，肘腕与胸口留出球的空隙。</li>
      <li>每次划手前默念「抱球」，自检是否又回到无内旋平推。</li>
      <li>下水后只迁移形状与体感，速度与距离另训，勿一次改全部。</li>
    </ol>
    <h3>关键认知转变</h3>
    <p>从「看起来弯肘了就算抱水」转向「以内旋驱动触水面，用抱球感锁定空间」——形状服务于转动，而不是转动服务于形状。</p>
  </div>

  <div class="footer">理性分析 · 基于画面标注与时间轴证据 · 口播不可辨处未补写</div>
</div>

    </div>
  </foreignObject>
</svg>