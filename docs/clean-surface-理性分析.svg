<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1775" viewBox="0 0 1320 1775">
  <foreignObject x="0" y="0" width="1320" height="1775">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&amp;display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans SC',-apple-system,sans-serif}.container{width:1240px;padding:40px 40px 60px}h1{font-size:30px;font-weight:700;color:#1a1a1a;margin-bottom:8px}.meta{font-size:13px;color:#999;margin-bottom:8px}.tags{margin-bottom:20px}.tag{display:inline-block;background:#fdf2f2;color:#c0392b;padding:3px 10px;border-radius:12px;font-size:12px;margin-right:8px}.summary-line{background:#fff5f5;border-left:4px solid #e74c3c;padding:12px 16px;margin-bottom:28px;font-size:15px;color:#555;line-height:1.7}h2{font-size:20px;font-weight:600;color:#c0392b;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid #e74c3c;display:inline-block}.comp-row{display:flex;gap:20px;margin:16px 0}.comp-card{flex:1;padding:16px;border-radius:12px;font-size:13px;line-height:1.8}.bad{background:#fff5f5}.bad h4{color:#c0392b}.good{background:#e8f5e9}.good h4{color:#2e7d32}.comp-card h4{font-size:15px;font-weight:600;margin-bottom:6px}.comp-card p{color:#555}.step{display:flex;margin-bottom:12px;align-items:flex-start}.step-num{width:30px;height:30px;border-radius:50%;background:#e74c3c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;margin-right:14px}.step-body{flex:1;font-size:14px;color:#555;line-height:1.8}.conclusion{background:linear-gradient(135deg,#fdf2f2,#fff5f5);padding:20px 24px;border-radius:8px;margin-top:28px;font-size:14px;color:#555;line-height:1.8}.conclusion strong{color:#c0392b}</style>
      <div class="container"><h1>液面不干净，怎么办？</h1><div class="meta"><span>来源：小红书</span><span>时长：1分18秒</span><span>类型：融合技巧</span></div><div class="tags"><span class="tag">融合</span><span class="tag">流距</span><span class="tag">液面干净</span><span class="tag">新手入门</span></div><div class="summary-line"><strong>一句话总结：</strong>液面在拉花前就脏了，根本原因是一个词——<strong>流距</strong>（注入高度）。过高击穿液面让表面发白，过低奶泡浮在表面形成白色丝线。唯一正确的做法是<strong>由低到高的渐进式融合</strong>。</div><h2>两种错误流距对比</h2>
<div class="comp-row"><div class="comp-card bad"><h4>❌ 流距过高</h4><p>一开始就用很高的高度直接注入<br/>冲击力太强→击穿液面<br/>结果：整个杯面反白<br/>感觉：脏、不干净</p></div><div class="comp-card bad"><h4>❌ 流距过低</h4><p>奶泡压在表面无法融入<br/>留下白点→转圈后拉成白丝<br/>结果：液面布满白色线条<br/>感觉：像蜘蛛网、脏</p></div></div>
<h2>正确流距：由低到高渐进</h2>
<div class="step"><div class="step-num">1</div><div class="step-body"><strong>低位注入</strong>：从较低的高度注入奶泡，让它进入咖啡液面以下，稳定整个液面</div></div><div class="step"><div class="step-num">2</div><div class="step-body"><strong>逐渐拉高</strong>：液面稳定后，慢慢提高流距，让奶泡以较长的落距融入</div></div><div class="step"><div class="step-num">3</div><div class="step-body"><strong>高流距融合</strong>：达到足够高度后持续融合转圈，利用高流距的充分混合能力让液面干净统一</div></div><div class="step"><div class="step-num">4</div><div class="step-body"><strong>开始拉花</strong>：融合到五六分满后，放低、增大流量，开始创作图案</div></div>
<h2>物理原理</h2><div style="background:#faf8f5;padding:16px 20px;border-radius:12px;font-size:14px;color:#555;line-height:1.9;margin:12px 0"><strong>高流距</strong> = 液体获得更大的下落动能 = 更强的穿透力和混合力。但一开始液面不稳定时直接高流距冲击→击穿液面→破坏。<br/><strong>低流距</strong> = 液体动能低 = 奶泡无法穿透液面→浮在表面→白色点/线。<br/><strong>由低到高</strong> = 先保护液面完整性，再逐步提高动能充分混合。</div>
<div class="conclusion"><strong>练功方向：</strong>以后拉花前看看液面——如果已经脏了，说明融合流距有问题。养成"<strong>低→高</strong>"的肌肉记忆：低位开始、稳定后拉高。这个细节解决了，叶片才能在一杯干净的液面上清晰地呈现出来。</div></div>
    </div>
  </foreignObject>
</svg>