<div class="card"><h3>内容要点</h3><ul><li>看完這期視頻 教你分清穩定器兩大模式</li>
<li>Hello 大家好 又是你們的瑞角</li>
<li>平移跟隨是大家最常用到的穩定器模式</li>
<li>在這個模式下 穩定器只會進行左右方向的平移移動</li>
<li>使用最多的場景就是環繞運鏡</li>
<li>也就是我們熟知的刷鍋</li>
<li>不管是小範圍的輕微環繞 還是環繞主體的整體運鏡</li>
<li>都可以用到PF的平移跟隨模式</li>
<li>這樣的運鏡更多的起到交代周圍環境的作用</li>
<li>展現出人物所在的場景內容</li>
<li>如果想要突出人物主體的環繞運鏡</li>
<li>也可以搭配長焦鏡頭進行拍攝</li>
<li>空間的壓縮感會更強</li>
<li>我用的70-200鏡頭加上機身大概不到2000克</li>
<li>一天的拍攝下來 承重也完全沒問題</li>
<li>和之前提到的鎖定模式不同</li>
<li>平移跟隨模式拍攝出來的效果</li>
<li>更多的是一個定點的橫向運鏡</li>
<li>比起鎖定模式可以展示更多的環境內容</li>
<li>如果畫面是運動狀態的展示</li>
<li>就用鎖定模式</li>
<li>如果畫面重點是周圍環境的展示</li>
<li>就選平移跟隨模式</li>
</ul></div>
