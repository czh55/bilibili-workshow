</div>
<div class="card"><h3>内容要点</h3><ul><li>想拍出鬆弛感</li>
<li>你只需要做對四件事</li>
<li>一 胳膊要彎</li>
<li>過質的胳膊會讓動作僵化</li>
<li>看起來會更加鬆弛</li>
