<div class="timeline-item"><span class="timeline-time">[00:06]</span><span class="timeline-text">彎一點</span></div>
<div class="timeline-item"><span class="timeline-time">[00:08]</span><span class="timeline-text">看起來會更加鬆弛</span></div>
<div class="timeline-item"><span class="timeline-time">[00:09]</span><span class="timeline-text">二 手腕要彎</span></div>
<div class="timeline-item"><span class="timeline-time">[00:11]</span><span class="timeline-text">比起手腕上翹</span></div>
<div class="timeline-item"><span class="timeline-time">[00:13]</span><span class="timeline-text">下垂的手型</span></div>
<div class="timeline-item"><span class="timeline-time">[00:14]</span><span class="timeline-text">看個就放鬆多了</span></div>
<div class="timeline-item"><span class="timeline-time">[00:15]</span><span class="timeline-text">三 脖子要歪</span></div>
