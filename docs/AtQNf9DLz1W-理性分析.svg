</ul></div>
<div class="conclusion"><h2>总结</h2><p>想拍出鬆弛感你只需要做對四件事一 胳膊要彎過質的胳膊會讓動作僵化彎一點看起來會更加鬆弛二 手腕要彎比起手腕上翹下垂的手型看個就放鬆多了三 脖子要歪頭太正會顯得過於正式又不是在拍正在這但只要歪一歪頭效果可就不一樣了四 膝蓋要彎站著拍就不要站太直了單腿屈膝會顯得更俗持當然做著也是一</p><p>转录分段: 19 | 时长: 36秒</p></div>
