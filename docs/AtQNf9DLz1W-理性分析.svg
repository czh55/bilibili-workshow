<h1>✨松弛感四要素👉跟僵硬姿态说拜拜！</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">人像拍照</span> <span class="tag tag-gray">36秒</span></div>
<div class="summary-line">想拍出鬆弛感你只需要做對四件事一 胳膊要彎過質的胳膊會讓動作僵化彎一點看起來會更加鬆弛二 手腕要彎比起手腕上翹下垂的手型看個就放鬆多了三 脖子要歪頭太正會顯得過於正式又不是在拍正在這但只要歪一歪頭效果可就不一樣了四 膝蓋要彎站著拍就不要站太直了單腿屈膝會顯得更俗持當然做著也是一...</div>
<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">想拍出鬆弛感</span></div>
<div class="timeline-item"><span class="timeline-time">[00:01]</span><span class="timeline-text">你只需要做對四件事</span></div>
