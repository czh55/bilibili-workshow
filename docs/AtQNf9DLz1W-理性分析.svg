<div class="timeline-item"><span class="timeline-time">[00:19]</span><span class="timeline-text">又不是在拍正在這</span></div>
<div class="timeline-item"><span class="timeline-time">[00:21]</span><span class="timeline-text">但只要歪一歪頭</span></div>
<div class="timeline-item"><span class="timeline-time">[00:22]</span><span class="timeline-text">效果可就不一樣了</span></div>
<div class="timeline-item"><span class="timeline-time">[00:24]</span><span class="timeline-text">四 膝蓋要彎</span></div>
