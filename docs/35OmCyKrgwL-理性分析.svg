<li>学会了吗</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>为什么为什么我的评论区这么多男生要学姿势啊脚脚的就是男生拍照姿势准备好了第一步放松一点摘把你的手插进口袋接着伸出一条腿脚插点地再挑起一点点你的肩膀爱喝饮料吗拿着不要整个拿着而是要用纸缚拿再把手肘抬起来一些那是啥喝一会喽让我想想还能怎么带坐下把腿分开但脚要并拢然后一只手撑脸一只手搭腿随你看镜头还是看旁边都可以好了走吧诶不是让你真走了我是说假装地走把重心放在两腿中间前后来回地走插都领口脑头男生吗学会了</p><p>转录分段: 40 | 时长: 1:13</p></div>
