      <div class="container root-wrap">
  <h1>如何让颜色更耐看：色相并置</h1>
  <div class="meta"><span class="tag tag-blue">色相并置</span><span class="tag tag-green">耐看</span><span class="tag tag-orange">梵高</span><span class="tag tag-purple">卡萨特</span><span class="tag tag-red">千里江山</span><span class="tag tag-gray">时长 104秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/64xG3NDAP57">原视频</a>
  <div class="summary-line">平涂「正确平均色」一眼见底；把相关色相（蓝红、黄红）并置交错，让眼睛完成混合，颜色才生动耐看。毛衣、梵高梧桐紫、卡萨特沙发橙、《千里江山图》近看矿物色远看青绿，同一视觉游戏。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">毛衣与梵高：让眼睛调色</span></div><div class="timeline-item"><span class="timeline-time">00:14</span><span class="timeline-text">实验：平涂紫</span></div><div class="timeline-item"><span class="timeline-time">00:21</span><span class="timeline-text">先蓝后红并置</span></div><div class="timeline-item"><span class="timeline-time">00:41</span><span class="timeline-text">原理名：色相并置</span></div><div class="timeline-item"><span class="timeline-time">00:45</span><span class="timeline-text">毛衣黄红远看橙</span></div><div class="timeline-item"><span class="timeline-time">01:00</span><span class="timeline-text">梵高蓝红交错紫</span></div><div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">卡萨特红黄通透橙</span></div><div class="timeline-item"><span class="timeline-time">01:25</span><span class="timeline-text">千里江山近看矿物色</span></div><div class="timeline-item"><span class="timeline-time">01:37</span><span class="timeline-text">退远成青绿山河</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">并置<br/>相关色交错</div><span class="arrow">→</span><div class="node-green">眼睛<br/>完成混合</div><span class="arrow">→</span><div class="node-orange">举证<br/>衣／画／古画</div><span class="arrow">→</span><div class="node-blue">远看<br/>鲜活耐看</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「樊高／并制／耐暖／西化／褶食／王熙孟／捧一情侣山河」→「梵高／并置／耐看／西方／赭石／王希孟／磅礴青绿山河」。</p><p>误区：耐看＝涂匀平均固有色。视频强调并置变化。</p><p>误区：只有印象派才并置。千里江山同理。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>实验对比</h3>
      <p>平涂紫一眼见底；蓝红并置因冷暖变化更生动耐看。</p>
      <div class="quote">因为有红和蓝的冷暖变化，所以显得更加生动和耐看</div>
      <div class="relation">耐看来自可见的色相结构，不是更匀。</div>
    </div>
    <div class="card card-orange">
      <h3>原理：色相并置</h3>
      <p>先画几笔蓝再加几笔红，后退两步，眼睛已混成紫。</p>
      <div class="quote">这个原理叫色相并置</div>
      <div class="relation">混合交给视觉，画面留给笔触。</div>
    </div>
    <div class="card card-red">
      <h3>跨媒介同一手法</h3>
      <p>毛衣黄红、梵高蓝红紫、卡萨特红黄橙——织物与油画同构。</p>
      <div class="quote">全是蓝和红的交错并置</div>
      <div class="relation">材料不同，眼睛规则相同。</div>
    </div>
    <div class="card card-purple">
      <h3>千里江山：近交远远融</h3>
      <p>近看石青石绿赭石交错，退远成宏大青绿。</p>
      <div class="quote">近看是石青石绿……一旦退远</div>
      <div class="relation">观看距离是配色参数。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>当视觉游戏</p>
      <div class="quote">学好色彩不难——把它想象成视觉游戏。</div>
      <div class="relation">其实啊学好色彩一点都不难</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>104 秒原理短片，非完整调色课。</li><li>「大梧桐」按画面指梵高《大梧桐树》类作品。</li><li>片尾心态句非技法步骤。</li></ul><div class="pitfall">把目标色一次涂死，失去并置层次。</div><div class="pitfall">并置色相无关（乱跳色环）导致脏乱。</div><div class="pitfall">从不退远检查光学混合效果。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>相关色相并置</li><li>让眼睛完成混合</li><li>近看结构、远看整体</li></ul><h3>行动清单</h3><ol><li>做蓝红并置紫 vs 平涂紫对照小色稿</li><li>观察一块织物的交织线，远看记色相</li><li>临一小块古画青绿，先交错再退远验效果</li><li>禁止用单一平均色覆盖整个目标色域</li></ol><h3>关键认知转变</h3><p>以前：调准再涂满；现在：铺开相关色相，让眼睛帮你完成耐看的紫／橙／青绿。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 104秒</div>
</div>
    </div>
  </foreignObject>
