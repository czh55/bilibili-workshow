.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>色彩表达情绪：心理与名画</h1>
  <div class="meta"><span class="tag tag-blue">色彩心理</span><span class="tag tag-green">情绪</span><span class="tag tag-orange">梵高</span><span class="tag tag-purple">修拉</span><span class="tag tag-red">广告</span><span class="tag tag-gray">时长 236秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/dpW99sp1VZ">原视频</a>
  <div class="summary-line">红橙刺激兴奋与食欲；冷色镇静（案例数据为视频引用）。《英雄》色调深化悲剧。梵高咖啡馆血红硫黄写激情；杏花触发呼吸节律共鸣。修拉点彩：静谧秩序与疏离。把生活色彩感受记成词典。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:02</span><span class="timeline-text">麦当劳红黄vs蓝</span></div><div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">电商暖色消费</span></div><div class="timeline-item"><span class="timeline-time">00:59</span><span class="timeline-text">冷色镇静案例</span></div><div class="timeline-item"><span class="timeline-time">01:28</span><span class="timeline-text">电影《英雄》</span></div><div class="timeline-item"><span class="timeline-time">02:02</span><span class="timeline-text">夜间的咖啡馆</span></div><div class="timeline-item"><span class="timeline-time">02:23</span><span class="timeline-text">致提奥原文</span></div><div class="timeline-item"><span class="timeline-time">02:30</span><span class="timeline-text">杏花与呼吸</span></div><div class="timeline-item"><span class="timeline-time">02:56</span><span class="timeline-text">修拉点彩</span></div><div class="timeline-item"><span class="timeline-time">03:23</span><span class="timeline-text">记录感受练习</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">刺激<br/>红橙黄</div><span class="arrow">→</span><div class="node-green">镇静<br/>冷／灰粉</div><span class="arrow">→</span><div class="node-orange">名画<br/>激情／疗愈</div><span class="arrow">→</span><div class="node-blue">技法<br/>点彩疏离</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「情趣／迪奥／大腕岛的星际天」→「情绪／提奥／大碗岛的星期日」。</p><p>数据（点击率／自杀率等）为视频引用，未独立核实。</p><p>误区：情绪＝固有色象征表死记。需结合并置与技法。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>消费刺激</h3>
      <p>红黄换蓝食欲塌；电商偏暖少用冷。</p>
      <div class="quote">红橙色以强烈的视觉刺激直接引起兴奋感</div>
      <div class="relation">目标是冲动时，色温先决策。</div>
    </div>
    <div class="card card-orange">
      <h3>冷色镇静</h3>
      <p>桥改蓝、狱墙灰粉、手术室苹果绿等案例链。</p>
      <div class="quote">这些都源自于冷色系的心理镇静作用</div>
      <div class="relation">要降噪／降焦虑时转向冷或补色环境。</div>
    </div>
    <div class="card card-red">
      <h3>梵高双例</h3>
      <p>咖啡馆绿反向激活红橙躁动；杏花蓝枝联呼吸。</p>
      <div class="quote">表现人性在深夜咖啡馆里沸腾的可怕的激情</div>
      <div class="relation">同一画家可写亢奋也可写疗愈。</div>
    </div>
    <div class="card card-purple">
      <h3>技法即情绪</h3>
      <p>点彩视觉混合静谧，理性排列暗示疏离。</p>
      <div class="quote">既营造了一种秩序感又暗示了……疏离</div>
      <div class="relation">怎么画也在说情绪，不只画什么色。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>记录生活里的色彩感受</p>
      <div class="quote">色彩与情感之间的联系远比想象中的更加奇妙</div>
      <div class="relation">日积月累成自己的词典</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>社科／医疗百分比未经本仓库核实。</li><li>电影与广告为举例，非全面影评。</li><li>博物馆患者故事为视频叙述。</li></ul><div class="pitfall">把色彩心理当万能因果（忽略文化与语境）。</div><div class="pitfall">画「激情」只涂红，不加并置激活。</div><div class="pitfall">从不记录个人感受，只会背色表。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>先定激发或镇静</li><li>并置激活情绪</li><li>技法也参与叙事</li></ul><h3>行动清单</h3><ol><li>改一版广告色：暖刺激 vs 冷抑制对照</li><li>临一小块夜间咖啡馆，保留绿对红橙的反向激活</li><li>每周记三条生活色彩→情绪笔记</li><li>引用统计数据时标注「未核实」</li></ol><h3>关键认知转变</h3><p>以前：红＝热情蓝＝冷静背表；现在：设计刺激／镇静目标，并用并置与技法说话。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 236秒</div>
</div>
    </div>
  </foreignObject>
</svg>