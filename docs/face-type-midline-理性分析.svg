<div class="svg-page">
  <div class="container">
    <h1>你属于哪种脸型</h1>
    <div class="meta">
      <span class="tag tag-blue">小红书</span>
      <span class="tag tag-green">24秒</span>
      <span class="tag tag-purple">三庭比例</span>
      <span class="tag tag-orange">五官分析</span>
      <span class="tag tag-gray">理性分析</span>
    </div>
    <a class="source-link" href="http://xhslink.cn/o/9jGam2G5oqg">原视频：你属于哪种脸型</a>
    <div class="summary-line">
      <strong>核心判断：</strong>视频真正试图回答的不是「哪种脸绝对更好看」，而是：用三庭（上庭 / 中庭 / 下庭）相对比例，把脸粗分为幼态、标准、成熟、长下庭四类，并给每类贴上气质标签。证据是灰阶头像上的红线、中轴线与叠字比例；属于审美口诀，不是临床测量协议。
    </div>

    <div class="timeline">
      <h3>关键证据时间轴</h3>
      <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">定型「幼态脸」；提出上庭 ≥ 中庭，比例约 1:1:0.8；观感=可爱无害、少女感拉满。</div></div>
      <div class="timeline-item"><div class="timeline-time">00:07</div><div class="timeline-text">定型「标准脸」；三庭 1:1:1；评价=不惊艳但耐看不出错。</div></div>
      <div class="timeline-item"><div class="timeline-time">00:12</div><div class="timeline-text">定型「成熟脸」；中庭偏长，比例 1:1.2:1；标签=典型御姐范。</div></div>
      <div class="timeline-item"><div class="timeline-time">00:17</div><div class="timeline-text">定型「长下庭脸」；比例 1:1:1.2；观感=稳重有力量 + 知性魅力。</div></div>
      <div class="timeline-item"><div class="timeline-time">00:23</div><div class="timeline-text">CTA「快来测测你属于哪种」——未给出测量工具或步骤。</div></div>
    </div>

    <div class="map">
      <h2>核心脉络</h2>
      <div class="diagram">
        <div class="node">问题<br/>我属于哪种脸型？</div>
        <div class="arrow">→</div>
        <div class="node node-green">尺子<br/>三庭比例 + 中轴</div>
        <div class="arrow">→</div>
        <div class="node">四型分类<br/>幼态 / 标准 / 成熟 / 长下庭</div>
        <div class="arrow">→</div>
        <div class="node node-orange">行动<br/>对照比例自测</div>
      </div>
      <p class="small">证据链：同一灰阶头像反复标注 → 比例数字变化 → 气质口号；未提供真人样本对照或误差说明。</p>
    </div>

    <div class="correction">
      <h3>常见误解与认知纠偏</h3>
      <p><strong>误解：</strong>「标准脸 1:1:1 就是最好看。」视频明确说标准脸「不算一眼惊艳」，只是耐看不出错。</p>
      <p><strong>误解：</strong>「三庭比例是客观医学结论。」片中数字来自叠字示意，未说明测量点定义、样本量或个体差异。</p>
      <p><strong>纠偏：</strong>把它当快速分类口诀用：看哪一段被拉长或缩短，再对照气质标签；不要当成改脸手术依据。</p>
    </div>

    <div class="section">
      <h2 class="sec-title">四型框架拆解</h2>

      <div class="card card-green">
        <h3>幼态脸 · 在讲什么</h3>
        <p><strong>在讲什么：</strong>上庭 ≥ 中庭，整体约 1:1:0.8，下庭缩短。</p>
        <p><strong>关键理解：</strong>把「幼态」操作化为「下庭短 + 上庭不短于中庭」，再用可爱 / 少女感包装观感。</p>
        <p><strong>怎么用：</strong>自测时先比发际线—眉、眉—鼻底、鼻底—下巴三段长度；下庭明显更短时可对照此型。</p>
        <div class="quote">原文依据（可见字幕）：「上庭大于等于中庭」「三庭比例约 1:1:0.8」「少女感直接拉满」[00:01–00:07]</div>
        <div class="relation">关系：比例条件 → 气质标签；标签是观点，比例示意是片中「证据」。</div>
      </div>

      <div class="card">
        <h3>标准脸 · 在讲什么</h3>
        <p><strong>在讲什么：</strong>三庭等分 1:1:1。</p>
        <p><strong>关键理解：</strong>标准不等于惊艳；视频把它放在「不出错」档位，避免把均值审美神化。</p>
        <p><strong>怎么用：</strong>三段接近等长时先标为标准型，再看其他特征（骨相、光影）是否另有主导。</p>
        <div class="quote">原文依据：「三庭比例 1:1:1」「不算一眼惊艳」「但耐看又不出错」[00:08–00:12]</div>
      </div>

      <div class="card card-purple">
        <h3>成熟脸 · UP 主观点</h3>
        <p><strong>在讲什么：</strong>中庭偏长，比例 1:1.2:1，标签「典型御姐范」。</p>
        <p><strong>关键理解：</strong>把中庭加长与御姐气质绑定，是明确的主观立场，不是必然因果关系。</p>
        <p><strong>怎么用：</strong>若眉到鼻底明显长于两侧，可对照此型；气质判断请保留个人审美空间。</p>
        <div class="quote">原文依据：「中庭偏长」「三庭比例 1:1.2:1」「典型御姐范」[00:13–00:17]</div>
        <div class="highlight">立场分层：比例示意为片中可观察叠字；「御姐范」为 UP 主观点。</div>
      </div>

      <div class="card card-orange">
        <h3>长下庭脸 · 风险与边界</h3>
        <p><strong>在讲什么：</strong>下庭加长至 1:1:1.2，观感稳重、有力量、带知性魅力。</p>
        <p><strong>关键理解：</strong>与幼态脸对偶——一个缩下庭，一个拉下庭。</p>
        <p><strong>怎么用：</strong>鼻底到下巴偏长时可对照；不要据此自行缩短或垫高下庭做医美决策。</p>
        <div class="quote">原文依据：「长下庭脸」「三庭比例 1:1:1.2」「稳重有力量」「知性魅力」[00:18–00:22]</div>
        <div class="pitfall">避坑：短视频叠字比例≠你的真实测量；光线、仰俯角、发型发际都会改视觉比例。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">横向对比</h2>
      <div class="card">
        <h3>四型一眼对照</h3>
        <table>
          <thead>
            <tr>
              <th>类型</th>
              <th>三庭比例（片中）</th>
              <th>结构要点</th>
              <th>片中气质标签</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>幼态脸</td>
              <td><span class="key-data">约 1:1:0.8</span></td>
              <td>上庭 ≥ 中庭；下庭缩短</td>
              <td>可爱无害 / 少女感拉满</td>
            </tr>
            <tr>
              <td>标准脸</td>
              <td><span class="key-data">1:1:1</span></td>
              <td>三庭等分</td>
              <td>不惊艳但耐看不出错</td>
            </tr>
            <tr>
              <td>成熟脸</td>
              <td><span class="key-data">1:1.2:1</span></td>
              <td>中庭偏长</td>
              <td>典型御姐范</td>
            </tr>
            <tr>
              <td>长下庭脸</td>
              <td><span class="key-data">1:1:1.2</span></td>
              <td>下庭偏长</td>
              <td>稳重有力量 / 知性魅力</td>
            </tr>
          </tbody>
        </table>
        <p class="small">选择条件：只需粗分脸型时用此表；需要医美或化妆方案时，还须结合骨相、软组织、发型与拍摄角度——片中未展开。</p>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">方法边界与立场分层</h2>
      <div class="card">
        <div class="stance-grid">
          <div class="stance-item">
            <strong>可验证事实</strong>
            片中叠字出现四组比例与「上庭大于等于中庭」「中庭偏长」等标注；时长约 24 秒；有绿中轴线示意。
          </div>
          <div class="stance-item">
            <strong>UP 主观点</strong>
            把比例映射到少女感、御姐范、知性魅力等气质；暗示标准脸「不出错」。
          </div>
          <div class="stance-item">
            <strong>基于原文的推断</strong>
            框架核心是「哪一庭被拉长/缩短」；CTA 假设观众能自行对照，但未教测量法。
          </div>
        </div>
        <div class="insight" style="margin-top:18px">适用边界：适合作为短视频审美入门口诀；不适用于手术规划、病理诊断或跨种族统一审美标准。</div>
      </div>
    </div>

    <div class="conclusion">
      <h2>总结与行动</h2>
      <h3>核心要点</h3>
      <ul>
        <li>尺子只有一把：三庭相对比例，辅以面部中轴示意。</li>
        <li>四型对偶清晰：缩下庭=幼态；等分=标准；拉中庭=成熟；拉下庭=长下庭。</li>
        <li>气质标签是观点层，比例叠字是证据层，二者不要混成「科学真理」。</li>
      </ul>
      <h3>行动清单</h3>
      <ol>
        <li>用手机正面平视自拍，标记发际线、眉线、鼻底、下巴四点。</li>
        <li>量三段高度，粗算最接近 1:1:0.8 / 1:1:1 / 1:1.2:1 / 1:1:1.2 哪一组。</li>
        <li>只把气质词当参考，不强迫自己「必须像御姐或幼态」。</li>
        <li>化妆或修图时优先调视觉比例（发际、阴影、仰俯角），而不是先想医美。</li>
        <li>若要严肃评估骨相，另找专业测量或医生意见——本片未覆盖。</li>
      </ol>
      <h3>关键认知转变</h3>
      <p>从「猜自己是圆脸还是方脸」转向「先看三庭哪一段在主导」；标准脸不再被默认为最优解，而是「均衡且不出错」的一档。</p>
    </div>

    <p class="footer">分析基于可见字幕与画面标注；Whisper 原始转录另见 HTML 实录。非医美建议。</p>
  </div>
</div>

    </div>
  </foreignObject>
</svg>