      <div class="container root-wrap">
  <h1>双人构图：轮廓形原理</h1>
  <div class="meta"><span class="tag tag-blue">双人构图</span><span class="tag tag-green">轮廓形</span><span class="tag tag-orange">雷诺阿</span><span class="tag tag-purple">马奈</span><span class="tag tag-red">情感</span><span class="tag tag-gray">时长 157秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/Aob8TBzIdu5">原视频</a>
  <div class="summary-line">双人先比两个外轮廓的形与面积：雷同则平淡，三角对矩形则张力足。形的侵入融合可读亲密，扩张对收缩可读疏离；相似三角也可温情——形状在叙事。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:02</span><span class="timeline-text">秘密在轮廓形状</span></div><div class="timeline-item"><span class="timeline-time">00:14</span><span class="timeline-text">整体外轮廓</span></div><div class="timeline-item"><span class="timeline-time">00:28</span><span class="timeline-text">反例雷同</span></div><div class="timeline-item"><span class="timeline-time">00:45</span><span class="timeline-text">大三角vs小矩形</span></div><div class="timeline-item"><span class="timeline-time">00:59</span><span class="timeline-text">雷诺阿乡村舞会</span></div><div class="timeline-item"><span class="timeline-time">01:13</span><span class="timeline-text">侵入与融合</span></div><div class="timeline-item"><span class="timeline-time">01:26</span><span class="timeline-text">马奈疏离</span></div><div class="timeline-item"><span class="timeline-time">01:45</span><span class="timeline-text">相似三角温情</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">外轮廓<br/>非局部裁切</div><span class="arrow">→</span><div class="node-green">对比<br/>张力</div><span class="arrow">→</span><div class="node-orange">相似<br/>亲密</div><span class="arrow">→</span><div class="node-blue">叙事<br/>形状说话</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>繁转简；「巨型／乡村武／卡拉瓦桥」→「矩形／乡村舞会／卡拉瓦乔」。</p><p>误区：双人构图＝两张脸对称摆。</p><p>误区：形状必须不同。相似也可服务温情主题。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>轮廓形定义</h3>
      <p>人物整体动态的外部轮廓，并区分面积占比。</p>
      <div class="quote">主动区分两个人物的轮廓形状</div>
      <div class="relation">先剪影后五官。</div>
    </div>
    <div class="card card-orange">
      <h3>雷同＝平淡</h3>
      <p>形相似且大小接近，吸引力下降。</p>
      <div class="quote">是不是有点太雷同</div>
      <div class="relation">先做差异检查。</div>
    </div>
    <div class="card card-red">
      <h3>形比大小出张力</h3>
      <p>大三角对小矩形，动势张力拉满。</p>
      <div class="quote">画面的动势和张力瞬间就拉满了</div>
      <div class="relation">对比是设计不是偶然。</div>
    </div>
    <div class="card card-purple">
      <h3>形可读情感</h3>
      <p>侵入融合→亲密；扩张收缩→疏离；相似三角→温情。</p>
      <div class="quote">形状就是这么神奇</div>
      <div class="relation">构图选择＝关系陈述。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>练习题</p>
      <div class="quote">看卡拉瓦乔《圣马太与天使》：轮廓如何服务主题？</div>
      <div class="relation">又是如何服务于主题的</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>原理短片，非完整双人pose库。</li><li>画名口播有ASR误差已校正。</li><li>课宣非步骤。</li></ul><div class="pitfall">只摆脸对称忽略外轮廓。</div><div class="pitfall">两人剪影面积锁死50/50。</div><div class="pitfall">有故事却形状语言与情绪相反。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>先剪影再细节</li><li>形与面积叙事</li><li>对比／相似都可用</li></ul><h3>行动清单</h3><ol><li>双人照片先涂黑成剪影检查</li><li>改一版面积比与形类别</li><li>临雷诺阿只描外轮廓关系</li><li>评论区作业：圣马太轮廓分析</li></ol><h3>关键认知转变</h3><p>以前：两人摆好看姿势；现在：先设计两个外轮廓如何对话。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 157秒</div>
</div>
    </div>
  </foreignObject>
</svg>