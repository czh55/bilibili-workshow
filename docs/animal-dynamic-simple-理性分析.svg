      <div class="container root-wrap">
  <h1>猎豹动态：三圆精髓</h1>
  <div class="meta"><span class="tag tag-blue">猎豹</span><span class="tag tag-green">三圆</span><span class="tag tag-orange">动态</span><span class="tag tag-purple">关节</span><span class="tag tag-red">斑点</span><span class="tag tag-gray">时长 110秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/5yzlaoBPYp8">原视频</a>
  <div class="summary-line">奔跑猎豹：动态型上手后三圆是精髓；胸较方、脊柱清、关节方向准、尾要粗。深入再表情光影；斑点最后顺着体块意思一下，禁止硬抄花纹。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">示范猎豹动态</span></div><div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">三个圆是精髓</span></div><div class="timeline-item"><span class="timeline-time">00:30</span><span class="timeline-text">胸方、脊柱、关节</span></div><div class="timeline-item"><span class="timeline-time">00:45</span><span class="timeline-text">尾巴不能画细</span></div><div class="timeline-item"><span class="timeline-time">00:50</span><span class="timeline-text">深入表情光影</span></div><div class="timeline-item"><span class="timeline-time">01:15</span><span class="timeline-text">现在才画斑点</span></div><div class="timeline-item"><span class="timeline-time">01:28</span><span class="timeline-text">别对着硬抄</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">1<br/>三圆动态</div><span class="arrow">→</span><div class="node-green">2<br/>关节方向</div><span class="arrow">→</span><div class="node-orange">3<br/>深入体积</div><span class="arrow">→</span><div class="node-blue">4<br/>斑点最后</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「动式型／猫磕动／肌柱」→「动态型／猫科动物／脊柱」。</p><p>误区：先铺满斑点再修形。视频顺序相反。</p><p>误区：尾巴画细「好看」。作者强调粗壮有力。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>三圆是精髓</h3>
      <p>动态型上手后，三个圆撑起猎豹大关系；四肢可参考猫科骨骼。</p>
      <div class="quote">三个圆是精髓</div>
      <div class="relation">圆＝体积锚点。</div>
    </div>
    <div class="card card-orange">
      <h3>关节方向＞轮廓好看</h3>
      <p>胸腔偏方铁块感，脊柱动态必须交代；四肢找准关节运动方向。</p>
      <div class="quote">画四只一定要找准关节的运动方向</div>
      <div class="relation">动态来自关节，不是来自光滑线。</div>
    </div>
    <div class="card card-red">
      <h3>斑点最后、禁止硬抄</h3>
      <p>体块立住才画斑点：顺着体块意思一下；对着参考硬抄花纹会毁结构。</p>
      <div class="quote">现在才开始画斑点……千万别对着硬抄</div>
      <div class="relation">纹理是附着，不是主体。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>评论区素材</p>
      <div class="quote">素材放评论区，跟练即可验证步骤。</div>
      <div class="relation">跟着赵老师一起练起来吧</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>110 秒猎豹一例，非全猫科百科。</li><li>三圆为教学简化。</li><li>静音起形段以画面为准。</li></ul><div class="pitfall">开笔就点斑。</div><div class="pitfall">忽略脊柱动态只描外轮廓。</div><div class="pitfall">尾巴画成细绳。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>三圆锁动态</li><li>关节方向清楚</li><li>斑点贴体块最后上</li></ul><h3>行动清单</h3><ol><li>同一奔跑照只画三圆＋脊柱</li><li>标四肢关节箭头</li><li>尾加粗再进入深入</li><li>最后才意思斑点</li></ol><h3>关键认知转变</h3><p>以前：动物难在花纹；现在：难在体块——花纹是最后五分钟的事。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 110秒</div>
</div>
    </div>
  </foreignObject>
</svg>