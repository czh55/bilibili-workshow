.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}</style><div class="container">
<h1>欧洲vlog第一篇｜一年一度再见巴黎🌡️</h1>
<div class="meta">
<span class="tag tag-blue">旅行Vlog</span><span class="tag tag-green">巴黎</span><span class="tag tag-orange">时装周</span><span class="tag tag-gray">11:13</span>
</div>
<div class="summary-line"><strong>一句话核心：</strong>巴黎 vlog 的两条线：①<strong>工作线</strong>——巴黎时装周：下午 2 点多开始 <strong>fitting 试衣</strong>差不多 4 小时，连皮带打孔机、磨脚贴都会带；化妆间是从剧组带回来的各种琐碎东西；②<strong>生活线</strong>——和从小一起长大的<strong>老友豪哥</strong>逛街：<strong>妈妈们从初中就是闺蜜</strong>，三对闺蜜同一年生了三个宝宝，从幼儿园到高中都在一个班；住三层民宿、吃泰菜（猪油渣、小米辣）、换民宿、吃香菜超好吃的店；<strong>铁塔前晒太阳</strong>（巴黎时间 8 点 22 分）拍照。</div>
<div class="timeline"><h3>内容时间线</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">开场：给妈妈和爸爸一个掌声</span></div><div class="timeline-item"><span class="timeline-time">00:55</span><span class="timeline-text">fitting 试衣：下半身感觉要进会议室开会</span></div><div class="timeline-item"><span class="timeline-time">01:08</span><span class="timeline-text">下午 2 点多开始 fitting，差不多 4 小时弄完衣服</span></div><div class="timeline-item"><span class="timeline-time">01:24</span><span class="timeline-text">化妆间：从剧组带回来的东西</span></div><div class="timeline-item"><span class="timeline-time">01:54</span><span class="timeline-text">豪哥：你像英雄一样出现在我们的生命里</span></div><div class="timeline-item"><span class="timeline-time">02:03</span><span class="timeline-text">小礼物：祝巴黎时装周顺利</span></div><div class="timeline-item"><span class="timeline-time">02:42</span><span class="timeline-text">入住三层民宿：空气特别好，拍照很好看</span></div><div class="timeline-item"><span class="timeline-time">03:19</span><span class="timeline-text">第三天：结束所有秀，逛街日</span></div><div class="timeline-item"><span class="timeline-time">04:20</span><span class="timeline-text">天气很好，休闲的一天，吃泰菜</span></div><div class="timeline-item"><span class="timeline-time">04:36</span><span class="timeline-text">猪油渣好吃，绝对正宗小米辣</span></div><div class="timeline-item"><span class="timeline-time">05:40</span><span class="timeline-text">妈妈们的闺蜜故事：三对闺蜜同一年生三个宝宝</span></div><div class="timeline-item"><span class="timeline-time">07:30</span><span class="timeline-text">两家人拿对方当自己家孩子</span></div><div class="timeline-item"><span class="timeline-time">08:17</span><span class="timeline-text">来铁塔晒太阳，巴黎时间 8 点 22 分</span></div><div class="timeline-item"><span class="timeline-time">09:17</span><span class="timeline-text">铁塔前拍照：我好怕把你带到铁塔去</span></div><div class="timeline-item"><span class="timeline-time">09:41</span><span class="timeline-text">换民宿：肉眼看比视频更好，有空调</span></div><div class="timeline-item"><span class="timeline-time">09:56</span><span class="timeline-text">香菜超好吃的店</span></div><div class="timeline-item"><span class="timeline-time">10:11</span><span class="timeline-text">帽子购物：姐买的</span></div></div>
<div class='section'><div class='sec-title'>巴黎双线生活</div><div class='diagram'><div class='node'>时装周工作<br/><small>fitting试衣+化妆间</small></div><span class='arrow'>↔</span><div class='node node-green'>老友生活<br/><small>三层民宿+泰菜+铁塔</small></div></div></div><div class='section'><div class='sec-title'>精彩瞬间</div><div class='card'><h3>① 时装周侧写</h3><p><strong>下午 2 点多开始 fitting</strong>，差不多 4 小时弄完衣服（中间休息半小时）；化妆间地上是从<strong>剧组带回来的</strong>各种东西——连<strong>皮带打孔机、磨脚贴</strong>都会带。</p></div><div class='card card-green' style='margin:12px 0'><h3>② 二十年的发小</h3><p>豪哥和博主<strong>从幼儿园小班到高中</strong>都在一个班——妈妈们从初中就是闺蜜，<strong>三对闺蜜同一年生了三个宝宝</strong>；两家人<strong>拿对方当自己家孩子</strong>。</p></div><div class='card card-orange' style='margin:12px 0'><h3>③ 巴黎日常</h3><p>三层民宿空气特别好；泰菜<strong>猪油渣</strong>（湖南人最爱）+ 绝对正宗<strong>小米辣</strong>；香菜超好吃的店；换民宿<strong>肉眼看比视频更好</strong>。</p></div><div class='card card-purple'><h3>④ 铁塔晒太阳</h3><p>巴黎时间 <strong>8 点 22 分</strong>在铁塔前晒太阳；拍照名言：<strong>“我好怕把你带到铁塔去”</strong>。</p></div></div>
<div class="conclusion">
<h2>巴黎 vlog 看点</h2>
<h3>时装周小知识</h3><ol><li><strong>fitting</strong>：秀前试衣，一次 4 小时起步，衣服要全套配好</li><li>博主出行标配：<strong>皮带打孔机、磨脚贴</strong>——小东西关键时刻救命</li></ol><h3>巴黎打卡参考</h3><ul><li>铁塔：晚上 8 点 22 天还亮，<strong>晒太阳拍照正合适</strong></li><li>泰菜店：<strong>猪油渣+小米辣</strong>，湖南胃认证</li><li>香菜超好吃的店：值得单独一餐</li></ul><h3>友情篇</h3><ul><li>发小关系：妈妈们是闺蜜，<strong>从幼儿园到高中一个班</strong>，两家人互为家人</li></ul>
</div>
