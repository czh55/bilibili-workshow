<div class="container">
  <h1>车快人慢教程</h1>
  <div class="meta">
    <span class="tag tag-blue">小红书</span>
    <span class="tag tag-green">44秒</span>
    <span class="tag tag-purple">手机摄影</span>
    <span class="tag tag-orange">剪映 / 延时</span>
    <span class="tag tag-gray">理性分析</span>
  </div>
  <a class="source-link" href="http://xhslink.cn/o/rU0NBm5PMA">原视频：车快人慢教程</a>
  <div class="summary-line">
    核心判断：「车快人慢」不是单次超长曝光魔法，而是<span class="key-data">同机位双素材</span> + <span class="key-data">分层变速</span> + <span class="key-data">空间蒙版</span>：延时车流负责「快」，画中画人物降到约 0.3x 负责「慢」，线性蒙版按马路/人行道切开后再羽化融合。
  </div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">成品抛问：车快人慢怎么拍</div></div>
    <div class="timeline-item"><div class="timeline-time">00:03</div><div class="timeline-text">固定手机，拍人物迎面走来</div></div>
    <div class="timeline-item"><div class="timeline-time">00:07</div><div class="timeline-text">机位不动，延时拍约 10 分钟车流</div></div>
    <div class="timeline-item"><div class="timeline-time">00:11</div><div class="timeline-text">导入两段；人物切画中画</div></div>
    <div class="timeline-item"><div class="timeline-time">00:15</div><div class="timeline-text">变速约 0.3x + 智能补帧</div></div>
    <div class="timeline-item"><div class="timeline-time">00:18</div><div class="timeline-text">线性蒙版分界 + 羽化融合</div></div>
    <div class="timeline-item"><div class="timeline-time">00:26</div><div class="timeline-text">配乐、删多余、导出成品</div></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">问题<br/>如何做出车快人慢</div>
      <div class="arrow">→</div>
      <div class="node node-green">证据<br/>同机位双轨素材</div>
      <div class="arrow">→</div>
      <div class="node">判断<br/>速度差来自分层</div>
      <div class="arrow">→</div>
      <div class="node node-orange">行动<br/>画中画+蒙版羽化</div>
    </div>
  </div>

  <div class="correction">
    <h3>常见误解纠偏</h3>
    <p>误区一：以为必须用单反超长曝光一次成型。本片路径是手机固定机位 + 延时车流 + 后期叠层。</p>
    <p>误区二：以为人物也要延时。作者明确先拍正常人物走位，再用剪辑把人物层降速。</p>
    <p>误区三：只调透明度而不做空间分割。关键是线性蒙版把「马路侧快车流」与「人行道侧慢人物」切开，再羽化。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">一、拍摄层：同机位制造可对齐素材</h2>
    <div class="card card-green">
      <h3>在讲什么</h3>
      <p>先固定手机拍人物迎面走来，再保持机位不动，用延时摄影拍约十分钟车流。</p>
      <div class="quote">「固定手机，先拍一段人物迎面走来的视频……保持机位不动，用延时摄影功能，再拍一段十分钟左右的车流视频。」</div>
      <div class="insight">关键理解：两段素材必须共享同一透视与地平线，后期蒙版才有「可对齐的空间」。机位一晃，分界线就会穿帮。</div>
      <div class="action">怎么用：三脚架锁死构图；人物段走完整路径；车流段宁可多拍几分钟，给延时压缩留余量。</div>
      <div class="relation">原文依据：00:03–00:11 拍摄步骤口播 + 画面字幕。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">二、剪辑层：用速度差制造「车快 / 人慢」</h2>
    <div class="card card-purple">
      <h3>UP 主观点（明确立场）</h3>
      <p>把人物视频切画中画，变速到约 0.3，并勾选智能补帧。</p>
      <div class="quote">「将人物视频切画中画……将速度调至 0.3 左右，并勾选智能补帧。」</div>
      <div class="highlight">画面证据：变速面板显示时长约 5.7s → 18.9s，滑块停在 0.3x 附近。</div>
      <div class="insight">关键理解：车流层继承延时「快」；人物层靠 0.3x「慢」。效果来自层间相对速度，不是单层滤镜。</div>
      <div class="action">怎么用：先叠画中画再变速；智能补帧用于减缓卡顿，但仍属剪映功能建议，非光学必选项。</div>
      <div class="relation">原文依据：00:11–00:18；属 UP 主操作建议。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">三、融合层：蒙版负责空间，羽化负责观感</h2>
    <div class="card">
      <h3>在讲什么</h3>
      <p>给画中画加线性蒙版，把蒙版线放在人物与车流中间，再轻拉羽化使画面融合。</p>
      <div class="quote">「调整蒙版线放在人物与车流中间，轻拉羽化使画面融合。」</div>
      <div class="insight">关键理解：蒙版决定「哪一侧显示哪一层」；羽化决定交界是否自然。二者缺一，要么穿帮，要么硬边。</div>
      <div class="action">怎么用：沿马路边缘/人行道分界线旋转线性蒙版；羽化从小幅度试起，避免人物脚边发虚。</div>
      <div class="relation">原文依据：00:18–00:26；画面字幕确认「轻拉羽化」。</div>
    </div>
    <div class="card card-orange">
      <h3>风险与避坑</h3>
      <div class="pitfall">机位不一致：人物段与车流段若轻微平移/俯仰变化，蒙版线无法同时贴合两层。</div>
      <div class="pitfall">人物走进马路侧：若走位越过预设分界，会被车流层「切掉」或穿帮，需预留人行道安全区。</div>
      <div class="pitfall">羽化过大：人物轮廓变糊；羽化过小：出现硬切线。</div>
      <div class="pitfall">忽略尾部修剪：延时车流更长时，不删多余尾片会拖垮节奏。</div>
    </div>
  </div>

  <div class="card">
    <h3>横向对比：三种「车流+人物」做法</h3>
    <table>
      <thead>
        <tr>
          <th>做法</th>
          <th>速度来源</th>
          <th>适用条件</th>
          <th>主要上限</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>本片：双素材 + 画中画蒙版</td>
          <td>延时车流 + 人物 0.3x</td>
          <td>可固定机位、人物走位可控</td>
          <td>依赖后期对齐；蒙版边界要稳</td>
        </tr>
        <tr>
          <td>单次长曝光摄影（补充资料）</td>
          <td>快门时间拉长</td>
          <td>人物需尽量静止或多次合成</td>
          <td>人物易糊；手机可控性弱</td>
        </tr>
        <tr>
          <td>全程手持跟拍（对比）</td>
          <td>实时相对运动</td>
          <td>动态叙事、不要求光轨</td>
          <td>难得到稳定「车快人慢」光轨感</td>
        </tr>
      </tbody>
    </table>
    <p>表中「单次长曝光」标为补充资料，视频未展开；本片证据链只支撑双素材剪辑路径。</p>
  </div>

  <div class="card">
    <h3>立场分层</h3>
    <div class="stance-grid">
      <div class="stance-item">
        <strong>可验证事实</strong>
        视频演示固定机位、延时车流、画中画、约 0.3x 变速、线性蒙版与羽化；剪映界面出现对应控件。
      </div>
      <div class="stance-item">
        <strong>UP 主观点</strong>
        「很简单」；建议车流拍约 10 分钟；速度调至 0.3 左右并勾选智能补帧。
      </div>
      <div class="stance-item">
        <strong>基于原文的推断</strong>
        效果成立的核心是「同透视双层 + 空间分割」；机位一致比设备档次更关键。
      </div>
    </div>
  </div>

  <div class="card card-red">
    <h3>方法边界</h3>
    <p><strong>适用：</strong>夜景/车灯丰富、人行道与马路分界清晰、可架设三脚架的街头场景；剪映或同类支持画中画/蒙版/变速的 App。</p>
    <p><strong>上限：</strong>白天车流光轨弱；人物频繁越过马路分界；强风晃动三脚架会破坏对齐。</p>
    <p><strong>反例：</strong>两段素材机位不同、人物段本身已是延时、或不加蒙版只靠透明度硬叠——都难以稳定复现片中效果。</p>
    <p><strong>例外：</strong>若使用带运动跟踪/深度抠像的高级工具，可不走线性蒙版，但已超出本片操作范围。</p>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>车快人慢 = 同机位双素材的相对速度差，不是单层滤镜。</li>
      <li>拍摄锁死机位；剪辑用画中画承载「慢人物」。</li>
      <li>线性蒙版按空间切开，羽化负责交界观感。</li>
    </ul>
    <h3>行动清单</h3>
    <ol>
      <li>选好人行道与马路分界清晰的夜景点，架稳三脚架。</li>
      <li>先拍人物迎面完整走位；再同机位延时拍车流约 10 分钟。</li>
      <li>导入剪映：人物切画中画 → 约 0.3x + 智能补帧。</li>
      <li>加线性蒙版，分界落在人与车之间，轻拉羽化。</li>
      <li>配乐、修剪多余尾片后导出，回看分界是否穿帮。</li>
    </ol>
    <h3>关键认知转变</h3>
    <p>从「找一个神奇快门」转向「设计可对齐的双层时间线」：先保证空间一致，再用速度差与蒙版完成视觉分工。</p>
  </div>

  <p class="footer">双轨产物 · 理性分析 · 基于同一 Whisper 转录与画面字幕</p>
</div>

    </div>
  </foreignObject>
</svg>