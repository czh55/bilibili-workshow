<div class="svg-page">
  <div class="container">
    <h1>景深公式（五）：从容许弥散圆到可计算景深</h1>
    <div class="meta">
      <span class="tag tag-blue">小红书</span>
      <span class="tag tag-green">1分48秒</span>
      <span class="tag tag-orange">摄影科普</span>
      <span class="tag tag-purple">景深 / 焦深 / 公式</span>
      <span class="tag tag-gray">理性分析</span>
    </div>
    <a class="source-link" href="http://xhslink.cn/o/4QLiFJ7BXNu">原视频：相机「光圈」底层逻辑科普，景深公式（五）</a>
    <div class="summary-line">
      <strong>核心判断：</strong>本集真正回答的不是「F 值怎么调」，而是「景深如何被定义并被算出」。先用<span class="key-data">容许弥散圆</span>把「可接受清晰」钉成尺子，再区分<span class="key-data">焦深</span>（像方）与<span class="key-data">景深</span>（物方）；最后用 δ=0.029mm、F8、35mm、L=3m 代入公式，得到前 1.087m / 后 3.947m / 总 5.034m——并明确：本集尚未展开光圈如何改变这把尺子。
    </div>

    <div class="timeline">
      <h3>关键证据时间轴</h3>
      <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">移动物点 → 成像焦点离开传感器</div></div>
      <div class="timeline-item"><div class="timeline-time">00:08</div><div class="timeline-text">焦点外出现逐渐扩大的弥散圆，点像变糊</div></div>
      <div class="timeline-item"><div class="timeline-time">00:18</div><div class="timeline-text">弥散圆足够小 = 容许弥散圆，人眼当清晰</div></div>
      <div class="timeline-item"><div class="timeline-time">00:36</div><div class="timeline-text">全画幅常用 δ≈0.029mm（略粗于发丝）</div></div>
      <div class="timeline-item"><div class="timeline-time">00:52</div><div class="timeline-text">放大演示后命名：焦深</div></div>
      <div class="timeline-item"><div class="timeline-time">01:06</div><div class="timeline-text">镜头外对应区间命名：景深</div></div>
      <div class="timeline-item"><div class="timeline-time">01:15</div><div class="timeline-text">给出 ΔL1 / ΔL2 公式与参数含义</div></div>
      <div class="timeline-item"><div class="timeline-time">01:29</div><div class="timeline-text">算出总景深 5.034m，并追问与光圈的关系</div></div>
    </div>

    <div class="map">
      <h2>核心脉络</h2>
      <div class="diagram">
        <div class="node">问题<br/>景深如何定义与计算？</div>
        <div class="arrow">→</div>
        <div class="node">证据<br/>δ + 焦深/景深对照</div>
        <div class="arrow">→</div>
        <div class="node node-green">判断<br/>景深由容许弥散圆界定</div>
        <div class="arrow">→</div>
        <div class="node node-orange">行动<br/>代入公式得前后景深</div>
      </div>
    </div>

    <div class="correction">
      <h3>常见误解与认知纠偏</h3>
      <p><strong>误解：</strong>「清晰」是绝对的，景深是镜头自带的神秘区间。</p>
      <p><strong>纠偏：</strong>清晰是「弥散圆小到眼睛分不出糊」；景深是物方区间，焦深是像方区间，二者由同一把 δ 尺子对应出来。本集数值基于全画幅常用 δ≈0.029mm 与给定参数，换画幅/观看条件会改尺子。</p>
    </div>

    <div class="section">
      <h2 class="sec-title">1. 容许弥散圆：景深的定义尺子</h2>
      <div class="card">
        <h3>在讲什么</h3>
        <p>物点移动使焦点离开传感器后，传感器截到的是不断扩大的弥散圆；当圆足够小，人眼无法辨认模糊，就把它当作清晰。</p>
        <div class="highlight">关键理解：景深不是「绝对锐利带」，而是「糊到察觉不到」的带。</div>
        <div class="action">怎么用：讨论景深前先固定观看条件与 δ（本集全画幅示例用 0.029mm）。</div>
        <div class="quote">原文依据：[00:13–00:22]「只要这个弥散圆足够小…就是我们前面说的容许弥散圆」；[00:36–00:40]「直径约为0.029毫米」。</div>
        <div class="relation">关系：δ 是后续公式中的公共尺度，也是「清晰」判决门。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">2. 焦深 vs 景深：像方与物方</h2>
      <div class="card card-purple">
        <h3><span class="speaker speaker-host">UP 主观点</span>一对对应区间</h3>
        <p>把容许弥散圆放大放到焦点两侧，得到无法辨认模糊的像方区间，称为焦深；与之对应，镜头外物体前后相对清晰的范围称为景深。</p>
        <div class="highlight">关键理解：焦深管传感器附近，景深管拍摄现场；名字不同，尺子同一把。</div>
        <div class="action">怎么用：读剖面图时先找 δ 边界线，再分清左侧「景深」与右侧「焦深」标签。</div>
        <div class="quote">原文依据：[00:52]「称之为焦深」；[01:03–01:09]「镜头之外…就是我们说的景深」。</div>
        <div class="relation">立场分层：名称与对照关系来自视频讲授；光学教科书亦有同构说法，但本页不额外引入未讲公式证明。</div>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">3. 景深公式与算例</h2>
      <div class="card card-green">
        <h3>在讲什么</h3>
        <p>视频给出：ΔL1 = FδL² / (f² + FδL)，ΔL2 = FδL² / (f² − FδL)。代入 δ=0.029mm、F=8、f=35mm、L=3000mm，得到 ΔL1≈1087mm、ΔL2≈3947mm、ΔL≈5034mm。</p>
        <div class="highlight">关键理解：后景深通常大于前景深（分母一减一加）；总景深是两者之和，不是「对焦距离本身」。</div>
        <div class="action">怎么用：换参数时保持单位一致（本集统一毫米），先算前后景深再相加。</div>
        <div class="quote">原文依据：[01:15]「这里的delta是容许弥散圆的直径」；[01:29–01:41]「整个景深范围是5.034米…前景深约为1.087米…后景深为3.947米」。</div>
      </div>
      <div class="card">
        <table>
          <thead>
            <tr><th>符号</th><th>含义</th><th>本集取值</th><th>备注</th></tr>
          </thead>
          <tbody>
            <tr><td>δ</td><td>容许弥散圆直径</td><td>0.029mm</td><td>全画幅常用示例</td></tr>
            <tr><td>F</td><td>光圈值</td><td>8</td><td>本集只作输入，未解释机制</td></tr>
            <tr><td>f</td><td>焦距</td><td>35mm</td><td></td></tr>
            <tr><td>L</td><td>对焦距离</td><td>3000mm（3m）</td><td></td></tr>
            <tr><td>ΔL1</td><td>前景深</td><td>1087mm ≈ 1.087m</td><td></td></tr>
            <tr><td>ΔL2</td><td>后景深</td><td>3947mm ≈ 3.947m</td><td>大于前景深</td></tr>
            <tr><td>ΔL</td><td>总景深</td><td>5034mm ≈ 5.034m</td><td>ΔL1+ΔL2</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <h2 class="sec-title">4. 方法边界与悬念</h2>
      <div class="card card-orange">
        <h3>适用边界</h3>
        <ul>
          <li>δ 依赖传感器尺寸与观看条件；换画幅/打印尺寸不能照搬 0.029mm。</li>
          <li>公式算例是给定 F/f/L 下的一次代入，不是「任意场景通用答案」。</li>
          <li>本集明确提出但未解答：景深由 δ 定义，那跟光圈到底有什么关系？</li>
        </ul>
        <div class="pitfall">避坑：不要把「景深由容许弥散圆定义」听成「光圈无关」——视频自己把这个问题留到下一环。</div>
        <div class="insight">推断（基于原文）：光圈会进入公式的 F，从而改变前后景深数值；机制细节不在本集展开。</div>
      </div>
    </div>

    <div class="card">
      <h3>立场分层</h3>
      <div class="stance-grid">
        <div class="stance-item"><strong>可验证事实</strong>视频给出的参数、公式形式与算例数值（1.087 / 3.947 / 5.034m）。</div>
        <div class="stance-item"><strong>UP 主观点</strong>用动画把焦深与景深成对讲解，并以「看不见糊」定义清晰。</div>
        <div class="stance-item"><strong>基于原文的推断</strong>后续将把光圈机制接到同一套 δ 框架上；本集仅抛出问题。</div>
      </div>
    </div>

    <div class="conclusion">
      <h2>总结与行动</h2>
      <h3>核心要点</h3>
      <ul>
        <li>清晰 ≈ 弥散圆 ≤ 容许弥散圆（δ）。</li>
        <li>焦深（像方）与景深（物方）由同一 δ 对应。</li>
        <li>给定 δ、F、f、L 后可用公式算出前后景深；本例总景深约 5.034m。</li>
      </ul>
      <h3>行动清单</h3>
      <ol>
        <li>记下本集尺子：全画幅示例 δ≈0.029mm。</li>
        <li>读剖面时区分「景深」标签（物方）与「焦深」标签（像方）。</li>
        <li>用同一组单位（mm）代入 ΔL1 / ΔL2，再求和得总景深。</li>
        <li>复算本例：F8、35mm、3m，核对 ≈1.087 + 3.947 = 5.034m。</li>
        <li>带着问题看下一集：光圈如何改变景深，而不是另起一套定义。</li>
      </ol>
      <h3>关键认知转变</h3>
      <p>从「景深是镜头玄学」转向「景深是 δ 定义下的可计算区间」；光圈问题被明确挂起，避免本集结论被误读成曝光口诀。</p>
    </div>

    <p class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录与画面字幕</p>
  </div>
</div>

    </div>
  </foreignObject>
</svg>