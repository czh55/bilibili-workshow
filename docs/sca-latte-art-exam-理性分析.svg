      <div class="container root-wrap">
  <h1>在SCA的咖啡师考核当中，拉花考点啥？</h1>
  <div class="meta"><span class="tag tag-blue">精品咖啡</span><span class="tag tag-green">SCA</span><span class="tag tag-orange">咖啡师考核</span><span class="tag tag-purple">拉花</span><span class="tag tag-red">奶泡</span><span class="tag tag-gray">咖啡培训</span><span class="tag tag-gray">时长 130秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/ALLx7vyfQfk">原视频</a>
  <div class="summary-line">SCA 咖啡师中级实操拉花项：5 分钟两杯不同图案；图案看对比度、和谐大小位置、对称、奶泡 1–3 级、可识别；出品要喝——温度约 50–65℃，出杯量（奶液距杯缘）正确。按考卷条目自检比盲目加难花更有效。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">设问：SCA 拉花考什么</span></div><div class="timeline-item"><span class="timeline-time">00:13</span><span class="timeline-text">贴出中级实操拉花标准表</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">5 分钟两杯不同图案</span></div><div class="timeline-item"><span class="timeline-time">00:41</span><span class="timeline-text">图案评估五维度展开</span></div><div class="timeline-item"><span class="timeline-time">01:18</span><span class="timeline-text">出品要喝：温度 50–65℃</span></div><div class="timeline-item"><span class="timeline-time">01:37</span><span class="timeline-text">奶液距杯口＝出杯量纪律</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">门槛<br/>5分钟·双杯</div><span class="arrow">→</span><div class="node-green">图案<br/>五维量表</div><span class="arrow">→</span><div class="node-orange">出品<br/>温度·杯量</div><span class="arrow">→</span><div class="node-blue">备考<br/>照表自检</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「SA／咖啡室／艾西／奶酪／白云书」校正为「SCA／咖啡师／爱心／奶液／白云师叔」。</p><p>作者口称「终极考核」，画面试卷为 Intermediate Practical Exam（2020-01）——以画面为准并注明口径差异。</p><p>试卷另可见满分 14、及格 9；口播未展开但画面可核验。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>考核结构：限时双杯 + 两项评分</h3>
      <p>拉花项要求约 5 分钟内完成两杯不同图案（爱心/叶子常见，也可玫瑰、郁金香等）。评分分图案评估与出品评估——花形与饮品属性并重。</p>
      <div class="quote">你需要在5分钟的时间里面做出两杯不同图案的拉花……评分是有两项：第一就是拉花图案的评估，第二就是出品的评估</div>
      <div class="relation">先过限时双杯门槛，再谈花型难度。</div>
    </div>
    <div class="card card-green">
      <h3>图案五维：对比·和谐·对称·奶泡·可识别</h3>
      <p>对比度看咖/奶是否清晰；和谐看大小位置；对称图案要左右对称；奶泡须达 SCA 泡沫品质 1–3 级；图案必须可识别——抽象到认不出叶子也不行。</p>
      <div class="quote">拉花图案的评估分为五个维度……对比度……大小是否合适……对称性……奶泡……是否可以识别的</div>
      <div class="relation">五维是量表，不是「好看」一口价。</div>
    </div>
    <div class="card card-orange">
      <h3>出品是饮品：温度窗口</h3>
      <p>考官会喝。杯中温度要求约 50–65℃，适口；呈现给客人或考官通常应在约 50℃ 左右。只盯花形忽略温度，会在出品项失分。</p>
      <div class="quote">考官是会评估你的出品温度是否合理，考核的要求是在50到65度之间</div>
      <div class="relation">拉花流程必须把温度带进终局。</div>
    </div>
    <div class="card card-red">
      <h3>出杯量：奶液距杯缘必须正确</h3>
      <p>奶液表层到杯口边缘的距离反映填充是否正确。点了拿铁却七分满、八分满不合格——视觉完成度不能牺牲标准杯量。</p>
      <div class="quote">奶液距离杯口这个位置……出杯量是否正确……七分满的八分满的那肯定是不行的</div>
      <div class="relation">杯缘距离是可检查的硬指标。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>130 秒考点揭秘，非完整 SCA 课程替代。</li><li>以作者展示的 2020-01 中级实操拉花表为准；各级别试卷可能更新。</li><li>口播「终极」与画面「Intermediate」口径不一致时，以可核验画面为准。</li></ul><div class="pitfall">只练高难度花，忽略限时双杯与可识别性。</div><div class="pitfall">花好看但温度越界或出杯量不足。</div><div class="pitfall">对称花左右失衡，或对比度脏污仍硬交卷。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>5 分钟两杯不同图案是门槛</li><li>图案五维 + 出品温度/杯量 = 完整得分面</li><li>照考卷条目自检，比盲目加难更有效</li></ul><h3>行动清单</h3><ol><li>打印或对照拉花标准五维，每杯打勾自检</li><li>计时 5 分钟连做两杯不同图案，记录超时点</li><li>用温度计核对出品是否落在约 50–65℃</li><li>拍照检查奶液距杯缘，排除七分满习惯</li></ol><h3>关键认知转变</h3><p>以前：以为 SCA 拉花就是把花拉难；现在：按限时双杯、五维图案、温度与杯量四块清单备考。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 130秒</div>
</div>
    </div>
  </foreignObject>
</svg>