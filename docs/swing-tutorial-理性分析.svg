    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&amp;display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans SC',-apple-system,sans-serif}.container{width:1240px;padding:40px 40px 60px}h1{font-size:30px;font-weight:700;color:#1a1a1a;margin-bottom:8px}.meta{font-size:13px;color:#999;margin-bottom:8px}.tags{margin-bottom:20px}.tag{display:inline-block;background:#fdf2f2;color:#c0392b;padding:3px 10px;border-radius:12px;font-size:12px;margin-right:8px}.summary-line{background:#fff5f5;border-left:4px solid #e74c3c;padding:12px 16px;margin-bottom:28px;font-size:15px;color:#555;line-height:1.7}h2{font-size:20px;font-weight:600;color:#c0392b;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid #e74c3c;display:inline-block}.comparison{display:flex;gap:20px;margin:16px 0}.comp-card{flex:1;padding:18px;border-radius:12px;font-size:14px;line-height:1.8}.bad{background:#fff5f5}.bad h4{color:#c0392b}.good{background:#e8f5e9}.good h4{color:#2e7d32}.comp-card h4{font-size:16px;font-weight:600;margin-bottom:8px}.comp-card p{color:#555}.plan-row{display:flex;gap:12px;margin:16px 0}.plan-card{flex:1;padding:14px;border-radius:10px;background:#fff;border:1px solid #f0ece4;text-align:center;font-size:12px}.plan-card .day{font-size:22px;font-weight:700;color:#e74c3c;margin-bottom:4px}.plan-card h5{font-size:13px;font-weight:600;color:#c0392b;margin-bottom:6px}.plan-card p{color:#555;line-height:1.7}.principle{background:#faf8f5;padding:20px 24px;border-radius:12px;margin:16px 0;font-size:14px;color:#555;line-height:1.9}.principle strong{color:#c0392b}.conclusion{background:linear-gradient(135deg,#fdf2f2,#fff5f5);padding:20px 24px;border-radius:8px;margin-top:28px;font-size:14px;color:#555;line-height:1.8}.conclusion strong{color:#c0392b}</style>
      <div class="container"><h1>咖啡拉花摆动技巧（零基础）</h1><div class="meta"><span>来源：小红书</span><span>时长：2分03秒</span><span>类型：入门教程</span></div><div class="tags"><span class="tag">摆动入门</span><span class="tag">零基础</span><span class="tag">7天计划</span><span class="tag">S型水流</span></div><div class="summary-line"><strong>一句话总结：</strong>新手拉花翻车90%不是奶泡问题而是<strong>摆动不对</strong>。核心是后三指匀速惯性摆动（不是整只手），发力的原则是<strong>越轻越放松纹路越细腻</strong>。7天从水练习到树叶拉花的完整路线。</div>
<h2>正确 vs 错误摆动</h2>
<div class="comparison"><div class="comp-card bad"><h4>❌ 错误摆动</h4><p>整只手左右移动<br/>手腕发力<br/>节奏忽快忽慢<br/>宽窄不一<br/>→ 纹路僵硬不清晰</p></div><div class="comp-card good"><h4>✅ 正确摆动</h4><p>后三指匀速惯性运动<br/>手臂稳定不晃<br/>手肘与肩齐平<br/>发力越轻纹路越细<br/>→ 水流S型，纹路均匀</p></div></div>
<h2>7天练习路线</h2>
<div class="plan-row"><div class="plan-card"><div class="day">1</div><h5>水+水流S型</h5><p>只用水练动作<br/>3组×1分钟/天<br/>全程不抖<br/>速度均匀摆幅一致</p></div><div class="plan-card"><div class="day">2</div><h5>定点摆动</h5><p>空杯模拟<br/>只摆不退<br/>观察水面波纹<br/>练平行宽窄一致</p></div><div class="plan-card"><div class="day">3</div><h5>摆动+后退</h5><p>摆动不停<br/>后退不加速<br/>全程节奏统一<br/>继续用水巩固</p></div><div class="plan-card"><div class="day">4-7</div><h5>实战树叶</h5><p>牛奶+浓缩<br/>压低出摆→左右摆<br/>左手回杯<br/>不刻意发力→树叶</p></div></div>
<h2>握缸与发力要点</h2>
<div class="principle"><strong>握法：</strong>中指+无名指+小拇指在把手上，手臂打开，手肘与肩齐平<br/><strong>发力：</strong>只靠后方三个手指左右摆动，手臂保持稳定<br/><strong>性质：</strong>匀速惯性运动，不是刻意发力。越轻→越放松→纹路越细腻<br/><strong>验证：</strong>看水流是否呈S型——S型说明摆动节奏正确</div>
<div class="conclusion"><strong>练功方向：</strong>不要一上来就用牛奶+浓缩。先用水练习3天，让肌肉先把"后三指匀速摆动"的节奏刻进去。判断标准：水流S型稳不稳、空杯水面波纹整齐不整齐。基础摆动节奏形成了，再上牛奶就水到渠成——<strong>坚持练，基础的拉花直接就能成型</strong>。</div></div>
    </div>
  </foreignObject>
