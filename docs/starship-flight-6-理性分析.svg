.card .action,.card .insight{background:#eff6ff;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#1e40af;border-left:4px solid #3b82f6}
.speaker{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:12px;margin-right:8px}.speaker-host{background:#dbeafe;color:#1e40af}.speaker-guest{background:#ede9fe;color:#6b21a8}
.legend{background:#fff;padding:14px 18px;border-radius:12px;margin:16px 0 24px;border:1px solid #e2e8f0}
