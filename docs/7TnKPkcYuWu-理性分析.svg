<li>在雙手抱手擋住小肚子</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>回頭不是這樣是頭回肩膀不回回頭同時頭頂往一邊倒臉型更流暢再用頭髮擋住下河角眼神看鏡頭的下方還正面不是這樣頭髮全部放在兩邊框住我們的臉型顯得臉更大了全部撩在一側留一側頭髮下來修射我們的臉型身體轉向四分之三側如頂往鏡頭低頭看來不是這樣眉眼會顯胸頭頂往一邊倒低頭眼神放鬆看地面拍坐姿不要這樣手臂有肉的全部擠出來利用皮肩擋住我們的手臂在雙手抱手擋住小肚子</p><p>转录分段: 22 | 时长: 39秒</p></div>
