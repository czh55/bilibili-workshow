<div class="card"><h3>内容要点</h3><ul><li>回頭不是這樣</li>
<li>是頭回肩膀不回</li>
<li>回頭同時頭頂往一邊倒</li>
<li>臉型更流暢</li>
<li>再用頭髮擋住下河角</li>
<li>眼神看鏡頭的下方</li>
<li>還正面不是這樣</li>
<li>頭髮全部放在兩邊</li>
