      <div class="container root-wrap">
  <h1>冷暖之道：面积平衡</h1>
  <div class="meta"><span class="tag tag-blue">冷暖平衡</span><span class="tag tag-green">面积</span><span class="tag tag-orange">高级感</span><span class="tag tag-purple">穿搭</span><span class="tag tag-red">奶油风</span><span class="tag tag-gray">时长 181秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/7CXGr8IaJs5">原视频</a>
  <div class="summary-line">太灰或太燥常缺冷暖平衡：面纱蓝紫靠暖色才透亮，去暖变冷清，放暖则腻。梵高橙黄主体配门框蓝才有张力。用法看面积主辅非对半；蓝调点缀暖、奶油风点缀冷。灰闷本质常是过冷清。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">太灰或太燥</span></div><div class="timeline-item"><span class="timeline-time">00:07</span><span class="timeline-text">冷暖平衡</span></div><div class="timeline-item"><span class="timeline-time">00:28</span><span class="timeline-text">去掉暖色</span></div><div class="timeline-item"><span class="timeline-time">00:56</span><span class="timeline-text">定义平衡</span></div><div class="timeline-item"><span class="timeline-time">00:59</span><span class="timeline-text">梵高橱窗</span></div><div class="timeline-item"><span class="timeline-time">01:55</span><span class="timeline-text">面积占比</span></div><div class="timeline-item"><span class="timeline-time">02:05</span><span class="timeline-text">穿搭点缀</span></div><div class="timeline-item"><span class="timeline-time">02:16</span><span class="timeline-text">奶油风</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">暖托冷<br/>透亮</div><span class="arrow">→</span><div class="node-green">面积<br/>主辅</div><span class="arrow">→</span><div class="node-orange">点缀<br/>小块反向</div><span class="arrow">→</span><div class="node-blue">灰闷<br/>过冷清</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「太灶／金色鱼灰／无脑对气」→「太燥／金色与灰／无脑堆砌」。</p><p>误区：冷暖各占一半才叫平衡。</p><p>误区：高级感＝堆高纯度。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>面纱实验</h3>
      <p>去暖冷清；放暖甜腻；原作靠暖托冷。</p>
      <div class="quote">这就叫冷暖平衡</div>
      <div class="relation">关系决定好看。</div>
    </div>
    <div class="card card-orange">
      <h3>梵高张力</h3>
      <p>橙黄主体＋醒目蓝；换暖蓝则失张力。</p>
      <div class="quote">那种微妙的张力一下就没了</div>
      <div class="relation">辅色不可随便换温。</div>
    </div>
    <div class="card card-red">
      <h3>面积非对半</h3>
      <p>冷主暖辅或暖主冷辅，看占比。</p>
      <div class="quote">并不是平均的</div>
      <div class="relation">主辅意识。</div>
    </div>
    <div class="card card-purple">
      <h3>生活用法</h3>
      <p>蓝调点暖；奶油风点冷绿；灰闷试高纯暖。</p>
      <div class="quote">来一小块暖色点缀一下</div>
      <div class="relation">小面积杠杆大。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>高级感</p>
      <div class="quote">心理平衡舒服，不是堆料。</div>
      <div class="relation">感觉可设计。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>181秒原理片。</li><li>Tarbell 等画名以画面签名为准。</li><li>作业开放题。</li></ul><div class="pitfall">冷暖对半硬凑。</div><div class="pitfall">奶油风全暖无冷。</div><div class="pitfall">灰了还继续加冷色。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>冷暖互相成全</li><li>面积主辅</li><li>小块反向点缀</li></ul><h3>行动清单</h3><ol><li>做去暖/加暖对照小稿</li><li>标画面冷暖面积比</li><li>蓝调穿搭只加一块暖</li><li>奶油风加一块冷绿</li></ol><h3>关键认知转变</h3><p>以前：觉得高级就加纯色；现在：用面积做冷暖平衡。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 181秒</div>
</div>
    </div>
  </foreignObject>
</svg>