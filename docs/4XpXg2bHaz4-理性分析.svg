<div class="card"><h3>内容要点</h3><ul><li>如果有人能在我刚开始拍视频做vlog之后</li>
<li>把这五件事一口气全告诉我</li>
<li>我一定会专门定做一面景气</li>
<li>第一件事</li>
<li>不要搞太刻意又没意思的转场</li>
<li>我刚开始拍视频的时候</li>
<li>很喜欢模仿别人</li>
<li>想这样没说一句话</li>
<li>就突然转着头</li>
<li>换一个机位</li>
<li>后来我发现这非常不适合我</li>
<li>第一我在进入面前说话本来就放不开</li>
<li>脑子里还一直想着这句话说完要转头</li>
<li>只会更加不自然</li>
<li>第二是这个动作非常刻意</li>
<li>就像在提醒观众</li>
<li>诶我现在换了个场景换了个机位哦</li>
<li>但如果两个场景之间没有联系也没有设计</li>
<li>就会像隔着靴子脑痒一样</li>
<li>好像很努力</li>
<li>但真的有点没劲</li>
<li>其实新手想像这样换场景说话</li>
<li>要么就让自己舒服一点</li>
<li>你都不用看镜头</li>
<li>也不用做太刻意的动作</li>
<li>反正你一直在说话</li>
<li>其实都可以接得上头</li>
<li>再细节一点的话</li>
<li>可以让画面像这样慢慢慢慢慢慢的往前推</li>
<li>或者跟着你动</li>
<li>像我这个稳定器就是可以AI追踪自动跟随的</li>
<li>要么就是让换场景和机位变得更刻意</li>
<li>刻意到跟你的情节有关</li>
<li>比如你的主题是不在乎别人的看法</li>
<li>这会在开机头的时候居下换你的表达</li>
<li>比如前一个机位你这个裸体的疯狂原始人</li>
<li>下一个机位就可以加一个穿衣服的动作</li>
<li>前一句话在狭窄的衣柜里说</li>
<li>后一句话在广阔的海边说</li>
<li>要么反差</li>
<li>要么闲间</li>
<li>才会变得有意思</li>
<li>如果都觉得麻烦</li>
<li>哪怕就边走边自拍着说</li>
<li>也会比刻意做不适合自己的转场动作看起来舒服一些</li>
<li>第二件事</li>
<li>不要完全不注意光线</li>
<li>让新手车灯光确实要求太高</li>
<li>但其实只要多做一步</li>
<li>就是等到快夕阳的时候再拍</li>
<li>相同的场景</li>
<li>即便完全没有不同的摄影技术</li>
<li>选对的时间都会好看</li>
<li>第三件事</li>
<li>有的画面是必须要稳的</li>
<li>比如下面这种</li>
<li>咱们就从这个澎湖拉山一路北上隔离</li>
<li>然后再沿这个人的路去</li>
<li>有什么这么可惜的灯</li>
<li>就是我真的有什么灯</li>
<li>像这样信息又多</li>
<li>运动范围又大的一镜到底</li>
<li>如果是手指拍不用稳定器的话</li>
<li>画面难免会一顿一顿的</li>
<li>就会非常出息</li>
<li>诸如此类</li>
<li>必须要稳的话没有很多</li>
<li>想拉出来揭示环境</li>
<li>还有环绕展示情绪等等</li>
<li>你想你好不容易设计了一个挺好的画面</li>
<li>因为不稳 味道不对</li>
<li>真的很可惜</li>
<li>第四件事</li>
<li>画面也有节奏</li>
<li>找一个愿意跟你说实话的人</li>
<li>如果他的好几个</li>
<li>你想要观众注意的地方都毫无反应</li>
<li>说明这几个画面你放的太短</li>
<li>稀稀少的画面</li>
<li>比如脚步特写</li>
<li>推向眼神</li>
<li>跟拍单一物品等等</li>
<li>可以快速地闪过</li>
<li>但是像一群人众生白态</li>
<li>这种亮点很多需要慢慢看的画面</li>
<li>如果一晃而过</li>
<li>观众没看出来</li>
<li>你不是白态了吗</li>
<li>第五件事</li>
<li>每次增加一个新挑战</li>
<li>不光动画</li>
<li>用稳定器运进</li>
<li>简单的致净</li>
<li>每一条片子都尝试一个新东西</li>
<li>这是我个人最受益的一点</li>
<li>就关乎两个关键词</li>
<li>进步和热情</li>
<li>进步就是一条一条视频堆穿</li>
<li>所以想练新的技能</li>
<li>下一条片子就是最好的时机</li>
<li>而持续拍下去的关键因素</li>
<li>就是热情</li>
</ul></div>
