<div class="card"><h3>内容要点</h3><ul><li>今天继续给大家讲关于镜头的知识</li>
<li>有一点摄影基础的人都知道MTF曲线这个东西</li>
<li>他描述了镜头的光学特性</li>
<li>摄影的技术性在摄影爱好者圈子里呈现一种两级分化的状态</li>
<li>有人鼓吹摄影的技术性</li>
<li>拿着各种指标参数来评价摄影器材</li>
<li>也有人完全抗拒摄影的技术性</li>
<li>完全不去理会它</li>
<li>随便拿相机去拍照</li>
<li>其实摄影的技术性它不是枯燥的</li>
<li>更不是神秘的</li>
<li>摄影的技术原理都会在你拍摄的结果上产生影响</li>
<li>摄影者要从这种影响上去认识技术</li>
<li>反过来去运用技术去控制你的照片</li>
<li>我对技术的讲解目的是让大家了解摄影的技术原理</li>
<li>消除对技术的神秘感</li>
<li>打破技术的限制</li>
<li>我给大家用容易理解的方式来讲一下</li>
<li>这个MTF曲线是怎么回事</li>
<li>有什么实用的意义</li>
<li>MTF是调制传递函数的英文缩写</li>
<li>大家不要从理科的角度去理解这个概念</li>
<li>可以把它理解为光线经过镜头的透射以后所产生的影响</li>
<li>这个影响可以从能量变化的角度去理解</li>
<li>比如说一份光的能量</li>
<li>经过镜头以后因为镜片表面的反射</li>
<li>光学玻璃的吸收</li>
<li>会让能量下降</li>
<li>那么一份光的能量经过镜头以后就小于一了</li>
<li>越是好的镜头应该损失的越小</li>
<li>那么MTF的数值就应该越接近于一</li>
<li>MTF的采样测量方法是用相机去拍摄</li>
<li>黑白相间的条文</li>
<li>这个条文在光学上叫光山</li>
<li>它的密度是以通过镜头后的光山影像来计算</li>
<li>单位是线对美毫米</li>
<li>一般摄影镜头采用的光山密度是10线对和30线对</li>
<li>分别代表了低分辨率和高分辨率两种情况</li>
<li>光山的每对条文</li>
<li>白和黑分别代表了能量1和0</li>
<li>那么能量1经过镜头以后会衰减</li>
<li>能量0的位置本来不应该有影像</li>
<li>但是由于镜头的相差</li>
<li>光线在镜头内的反射</li>
<li>镜头表面的反射等因素</li>
<li>会让干扰的光线照射到光山的黑色的部分</li>
<li>那么就会让纯黑的地方</li>
<li>也不是那么黑了</li>
<li>也就是0的地方会增加一些信息</li>
<li>那么体现在光学影像上来说就是反差下降了</li>
<li>光山的影像它的反差要小于光山本身</li>
<li>好的镜头影像应该是让它尽量的接近光山本身的反差</li>
<li>光线经过镜头除了能量的衰减与干扰之外</li>
<li>这种衰减与干扰还会随着空间频率</li>
<li>以某种规律增加</li>
<li>反应在可见的这种现象就是光山的密度越大</li>
<li>那么这种衰减的干扰它也越大</li>
<li>到了一定密度就无法分辨光山的影像的反差了</li>
<li>这个时候就到了镜头的分辨率的极限</li>
<li>所谓光学的调制函数曲线</li>
<li>就是反映了上述规律的数学模型曲线</li>
<li>通过它我们可以直接看到</li>
<li>一直镜头的影像反差与分辨率的关系</li>
<li>对于好的镜头来说</li>
<li>应该尽量保持远景物的反差</li>
<li>同时尽量让这个反差在高分辨率的时候</li>
<li>不要下降得太快</li>
<li>所以我们看aptf曲线一般有两种颜色</li>
<li>一个是每毫米10线对的光山曲线</li>
<li>代表了低分辨率</li>
<li>另一个是每毫米30线对的代表了高分辨率</li>
<li>这两条曲线之间的落差越小</li>
<li>说明这个镜头的光学特性越好</li>
<li>同时我们也会看到</li>
<li>每种颜色的曲线都分成10线和虚线两部分</li>
<li>它分别代表了光山的水平和垂直状态</li>
<li>这是因为镜头对光线的传播</li>
<li>在不同的方向上</li>
<li>它的影响是不一样的</li>
<li>在了解了以上知识之后</li>
<li>我们就可以通过aptf曲线</li>
<li>去看一只镜头的光学素质了</li>
<li>那接下来我给大家讲解</li>
<li>几条曲线怎么去看</li>
<li>我们先看一下点型的aptf曲线</li>
<li>看看能从上面解读些什么</li>
</ul></div>
