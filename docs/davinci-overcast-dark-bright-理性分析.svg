      <div class="container root-wrap">
  <h1>达芬奇正确呈现阴天质感，让画面暗中有亮</h1>
  <div class="meta"><span class="tag tag-blue">达芬奇</span><span class="tag tag-green">阴天</span><span class="tag tag-orange">故事感</span><span class="tag tag-purple">中灰</span><span class="tag tag-red">密度</span><span class="tag tag-gray">时长 5分59秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/8qrLp6yMXje">原视频</a>
  <div class="summary-line">阴天故事感靠中间调够低。压中灰后抬暗/亮找回；去灰用人物遮罩对比+外部节点，忌全局对比。解紫时顺势走青绿冷调；更暗用蓝青密度而非死压曝光；风格化高光暖独立节点；柔和对比度压灰天不牺牲中间反差。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">还原：高光约 80，暗部略暗</span></div><div class="timeline-item"><span class="timeline-time">00:28</span><span class="timeline-text">压中灰做故事感；波形中灰下压</span></div><div class="timeline-item"><span class="timeline-time">01:16</span><span class="timeline-text">人物对比+外部节点分区去灰</span></div><div class="timeline-item"><span class="timeline-time">02:11</span><span class="timeline-text">降色调解紫，顺势青绿冷调</span></div><div class="timeline-item"><span class="timeline-time">03:07</span><span class="timeline-text">密度做阴沉；高光暖独立节点</span></div><div class="timeline-item"><span class="timeline-time">04:35</span><span class="timeline-text">柔和对比度压灰天；对比朋友问题</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">故事感<br/>中间调尽量低</div><span class="arrow">→</span><div class="node-green">去灰<br/>分区对比非全局</div><span class="arrow">→</span><div class="node-orange">冷调<br/>解问题顺带赋风格</div><span class="arrow">→</span><div class="node-blue">阴沉<br/>密度 &gt; 死压曝光</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「中晖」校正为「中灰」；「波星图/波线图」校正为「波形图」；「支障/制造」校正为「遮罩」；「新任」校正为「好让」；「一天」校正为「阴天」；「走冷掉」校正为「走冷调」；「铁刀」校正为「调到」；「现场分享」校正为「知识分享」；「邻居」校正为「领取」；「赞联」校正为「三连」。</p><p>误区：阴天故事感靠全局猛加对比。易人太暗天太亮。</p><p>误区：要暗就直接压曝光。密度压冷色更自然。</p><p>误区：必做冷调与可选风格化挤同一节点。应拆开方便改。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>故事感＝中间调尽量低</h3>
      <p>还原高光别太亮（约 80）。压中灰后暗部过暗就抬暗部与亮部找回——波形中灰下压、两端变化不大。</p>
      <div class="quote">中间调部分的曝光其实要尽可能的低</div>
      <div class="relation">重点是画面结果，不是抄数值。</div>
    </div>
    <div class="card card-orange">
      <h3>去灰：分区对比，别全局硬加</h3>
      <p>全局对比易让人物太暗、天空太亮。人物遮罩加对比，外部节点独立调环境。</p>
      <div class="quote">看起来好像是全局一起增加对比度……人物跟环境能够独立的去调整</div>
      <div class="relation">可控比「看起来猛」更重要。</div>
    </div>
    <div class="card card-green">
      <h3>解紫＝顺势冷调</h3>
      <p>衣服发紫就降色调，紫消且带青绿。在解决问题时赋风格，避免无层次猛加蓝。</p>
      <div class="quote">我们是在解决问题的同时，给画面赋予一定的风格</div>
      <div class="relation">先纠错色，再谈染冷。</div>
    </div>
    <div class="card card-purple">
      <h3>密度做阴沉</h3>
      <p>加蓝青密度让观感更阴沉，波形降幅不大但观感够；盯噪点与断层。比直接降曝光自然。</p>
      <div class="quote">这样的一个效果能够比我们直接降低对应的曝光效果会自然一些</div>
      <div class="relation">要暗先问能不能动冷色密度。</div>
    </div>
    <div class="card card-red">
      <h3>风格化节点拆开</h3>
      <p>高光暖+中灰回调是主观风格；全局加冷是画面该做的。拆开后悔只改风格节点。</p>
      <div class="quote">这个行为我不建议跟前面……全局加冷一起做</div>
      <div class="relation">必做与可选分层。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>阴天人像街景个案，高光「80」为口令非绝对标尺。</li><li>密度加大有噪点/断层风险，需盯画面。</li><li>课程引流从略。</li></ul><div class="pitfall">阴天还原高光过亮。</div><div class="pitfall">全局对比去灰导致人黑天爆。</div><div class="pitfall">要暗就死压曝光丢层次。</div><div class="pitfall">冷调与风格化混在一个节点。</div><div class="pitfall">精细遮罩过度（本片几乎不需要）。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>故事感靠压中灰</li><li>分区对比去灰</li><li>解色问题顺带冷调</li><li>密度阴沉；风格节点独立</li></ul><h3>行动清单</h3><ol><li>还原先把高光压到阴天逻辑</li><li>中灰下压后检查波形两端</li><li>去灰拆成人物罩+外部</li><li>更暗优先试蓝青密度</li></ol><h3>关键认知转变</h3><p>以前：阴天要么平要么死压；现在：中灰低、暗中有亮，密度做阴沉。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 5分59秒</div>
</div>
    </div>
  </foreignObject>
</svg>