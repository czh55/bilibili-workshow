<h1>什么是全域快门？果冻效应是什么意思？</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">摄影技巧</span> <span class="tag tag-blue">视频制作</span> <span class="tag tag-gray">1:08</span></div>
<div class="summary-line">这是一台微单相机当我们按下快门时相机的快门前幕连会落下当完全覆盖CMOS时相机会清空CMOS上的电子并开始感光随后前幕连被抬升后幕连紧跟着也被抬升当后幕连完全覆盖CMOS时相机完成一次曝光从前幕连抬起到后幕连完全遮盖住CMOS这一过程的时间就是相机的快门速度这边是机械快门的工作原理但当我们需要更高的...</div>
<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">这是一台微单相机</span></div>
<div class="timeline-item"><span class="timeline-time">[00:01]</span><span class="timeline-text">当我们按下快门时</span></div>
<div class="timeline-item"><span class="timeline-time">[00:02]</span><span class="timeline-text">相机的快门前幕连会落下</span></div>
<div class="timeline-item"><span class="timeline-time">[00:04]</span><span class="timeline-text">当完全覆盖CMOS时</span></div>
<div class="timeline-item"><span class="timeline-time">[00:05]</span><span class="timeline-text">相机会清空CMOS上的电子</span></div>
<div class="timeline-item"><span class="timeline-time">[00:07]</span><span class="timeline-text">并开始感光</span></div>
<div class="timeline-item"><span class="timeline-time">[00:08]</span><span class="timeline-text">随后前幕连被抬升</span></div>
<div class="timeline-item"><span class="timeline-time">[00:09]</span><span class="timeline-text">后幕连紧跟着也被抬升</span></div>
<div class="timeline-item"><span class="timeline-time">[00:11]</span><span class="timeline-text">当后幕连完全覆盖CMOS时</span></div>
<div class="timeline-item"><span class="timeline-time">[00:13]</span><span class="timeline-text">相机完成一次曝光</span></div>
<div class="timeline-item"><span class="timeline-time">[00:14]</span><span class="timeline-text">从前幕连抬起</span></div>
<div class="timeline-item"><span class="timeline-time">[00:15]</span><span class="timeline-text">到后幕连完全遮盖住CMOS这一过程的时间</span></div>
<div class="timeline-item"><span class="timeline-time">[00:18]</span><span class="timeline-text">就是相机的快门速度</span></div>
<div class="timeline-item"><span class="timeline-time">[00:20]</span><span class="timeline-text">这边是机械快门的工作原理</span></div>
<div class="timeline-item"><span class="timeline-time">[00:21]</span><span class="timeline-text">但当我们需要更高的快门速度</span></div>
<div class="timeline-item"><span class="timeline-time">[00:23]</span><span class="timeline-text">以及连拍速度时</span></div>
<div class="timeline-item"><span class="timeline-time">[00:24]</span><span class="timeline-text">机械快门由于物理结构限制</span></div>
<div class="timeline-item"><span class="timeline-time">[00:26]</span><span class="timeline-text">无法达到摄影师的要求</span></div>
<div class="timeline-item"><span class="timeline-time">[00:27]</span><span class="timeline-text">于是我们可将快门幕连去除</span></div>
<div class="timeline-item"><span class="timeline-time">[00:29]</span><span class="timeline-text">让CMOS直接曝光</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>这是一台微单相机</li>
<li>当我们按下快门时</li>
<li>相机的快门前幕连会落下</li>
<li>当完全覆盖CMOS时</li>
<li>相机会清空CMOS上的电子</li>
<li>并开始感光</li>
<li>随后前幕连被抬升</li>
<li>后幕连紧跟着也被抬升</li>
<li>当后幕连完全覆盖CMOS时</li>
<li>相机完成一次曝光</li>
<li>从前幕连抬起</li>
<li>到后幕连完全遮盖住CMOS这一过程的时间</li>
<li>就是相机的快门速度</li>
<li>这边是机械快门的工作原理</li>
<li>但当我们需要更高的快门速度</li>
<li>以及连拍速度时</li>
<li>机械快门由于物理结构限制</li>
<li>无法达到摄影师的要求</li>
<li>于是我们可将快门幕连去除</li>
<li>让CMOS直接曝光</li>
<li>这便是电子卷连快门</li>
<li>但由于一般的电子快门</li>
<li>是每颗像素一次主航扫描</li>
<li>上下航读取画面时间不同步</li>
<li>导致在拍摄高速平移的物体时</li>
<li>就会出现这种活动效应</li>
<li>为了解决这一现象</li>
<li>工程师研发了能让所有像素同时开始</li>
<li>同时结束曝光的CMOS</li>
<li>这块CMOS被用在专用于</li>
<li>高速摄影的A93这一类机器</li>
<li>无论是拍摄照片还是视频</li>
<li>都完全消除了活动效应</li>
<li>且没有主航扫描这一过程</li>
<li>快门速度也更快</li>
<li>总结一下</li>
<li>机械快门的速度最慢</li>
<li>活动效应轻微</li>
<li>电子卷连快门速度快</li>
<li>但是活动效应最为严重</li>
<li>而全域快门速度最快</li>
<li>也完全没有活动效应</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>这是一台微单相机当我们按下快门时相机的快门前幕连会落下当完全覆盖CMOS时相机会清空CMOS上的电子并开始感光随后前幕连被抬升后幕连紧跟着也被抬升当后幕连完全覆盖CMOS时相机完成一次曝光从前幕连抬起到后幕连完全遮盖住CMOS这一过程的时间就是相机的快门速度这边是机械快门的工作原理但当我们需要更高的快门速度以及连拍速度时机械快门由于物理结构限制无法达到摄影师的要求于是我们可将快门幕连去除让CMOS</p><p>转录分段: 42 | 时长: 1:08</p></div>
