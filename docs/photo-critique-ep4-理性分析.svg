.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>锐评④：动物主体、杂物与光照</h1>
  <div class="meta"><span class="tag tag-blue">锐评</span><span class="tag tag-green">动物</span><span class="tag tag-orange">趣味</span><span class="tag tag-purple">杂物</span><span class="tag tag-red">主体光</span><span class="tag tag-gray">时长 182秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/8c3KG8p4jjJ">原视频</a>
  <div class="summary-line">鱼群要形状或个体美感；表演瞬间清抢戏杂物并抓动态；趣味+光感可过关；颜色碰撞能加分；有故事也必须把光留在主体细节上。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:10</span><span class="timeline-text">慌乱鱼群</span></div><div class="timeline-item"><span class="timeline-time">00:45</span><span class="timeline-text">砸水被棍抢戏</span></div><div class="timeline-item"><span class="timeline-time">01:20</span><span class="timeline-text">小羊合格</span></div><div class="timeline-item"><span class="timeline-time">01:40</span><span class="timeline-text">彩鱼颜色加分</span></div><div class="timeline-item"><span class="timeline-time">02:00</span><span class="timeline-text">猫证件照失败</span></div><div class="timeline-item"><span class="timeline-time">02:35</span><span class="timeline-text">鸭有故事无光</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">策略<br/>群形或个体</div><span class="arrow">→</span><div class="node-green">净化<br/>去抢戏物</div><span class="arrow">→</span><div class="node-orange">加分<br/>趣味/颜色</div><span class="arrow">→</span><div class="node-blue">底线<br/>光在主体</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>「任务鱼」→「动物／鱼」语境。</p><p>主观锐评。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>群与个体</h3>
      <p>密群拉远成形状留白；或挑好看个体互动。</p>
      <div class="quote">要么再拉远一点，让整个鱼群可能形成某一些形状</div>
      <div class="relation">先决定看什么。</div>
    </div>
    <div class="card card-orange">
      <h3>抢戏物</h3>
      <p>沙包网棍会把主体换成「看棍」；动态缺浪花也减分。</p>
      <div class="quote">显得这里有一个棍，主体是一个棍</div>
      <div class="relation">前景默认有投票权。</div>
    </div>
    <div class="card card-red">
      <h3>合格样板</h3>
      <p>羊：趣味+干净背景+均衡光。猫：柔软撞糙水泥失败。</p>
      <div class="quote">它非常有趣味性……所以也还行</div>
      <div class="relation">趣味也要环境配合。</div>
    </div>
    <div class="card card-purple">
      <h3>故事需要光</h3>
      <p>鸭有夕阳叙事，但光不在羽毛与眼睛上就只剩剪影坨。</p>
      <div class="quote">核心是没拍清楚</div>
      <div class="relation">故事落点在可感细节。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>颜色可救一部分乱</p>
      <div class="quote">整体因为它颜色的冲突上面是给它加分了</div>
      <div class="relation">乱仍是乱，颜色只是加分项。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>未讨论动物摄影伦理与长焦技术参数。</li></ul><div class="pitfall">密群无结构硬拍。</div><div class="pitfall">表演瞬间不管前景。</div><div class="pitfall">赶夜景却让主体没光。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>主体策略</li><li>清杂物</li><li>光落在故事点</li></ul><h3>行动清单</h3><ol><li>拍鱼群先决定：群形留白还是挑好看个体</li><li>表演瞬间先清前景沙包网棍等抢戏物</li><li>趣味动物也要干净背景与均衡光</li><li>有故事的夜景也要让光落在主体眼睛／羽毛上</li></ol><h3>关键认知转变</h3><p>以前：看见动物就按快门；现在：先问观众到底在看什么。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 182秒</div>
</div>
    </div>
  </foreignObject>
</svg>