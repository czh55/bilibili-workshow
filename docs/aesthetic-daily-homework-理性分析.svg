<div class="container root-wrap">
  <h1>发一下今天的审美学习作业</h1>
  <div class="meta"><span class="tag tag-blue">穿搭</span><span class="tag tag-blue">审美</span><span class="tag tag-blue">化妆</span><span class="tag tag-blue">拍照姿势</span><span class="tag tag-blue">小红书</span><span class="tag tag-gray">时长 3:43</span></div>
  <a class="source-link" href="http://xhslink.cn/o/AyEn12JB13h">原视频链接</a>
  <div class="summary-line">把「审美学习」从看图好看，变成可记录的观察清单：焦点色、色温分区、场景道具、妆容位置与拍摄距离。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">第一张：红包 + 黄蓝伞构成焦点</span></div><div class="timeline-item"><span class="timeline-time">00:48</span><span class="timeline-text">克莱因蓝鞋与白发圈</span></div><div class="timeline-item"><span class="timeline-time">01:08</span><span class="timeline-text">餐厅道具撞色</span></div><div class="timeline-item"><span class="timeline-time">01:35</span><span class="timeline-text">眼下腮红细节</span></div><div class="timeline-item"><span class="timeline-time">02:15</span><span class="timeline-text">基础款 + 亮色包鞋</span></div><div class="timeline-item"><span class="timeline-time">02:50</span><span class="timeline-text">薄丝巾公主头</span></div><div class="timeline-item"><span class="timeline-time">03:15</span><span class="timeline-text">蹲姿与戒指撞色</span></div><div class="timeline-item"><span class="timeline-time">03:30</span><span class="timeline-text">浅蓝背景拍摄距离</span></div></div>
  <div class="section"><div class="sec-title">观点拆解</div><div class="card"><h3>核心命题：审美作业不是抄造型</h3><div class="highlight">每张图只回答一个问题——它靠什么成立：配色、比例、道具、妆容位置，还是拍摄距离。</div><div class="action">建立自己的「单图笔记」：焦点色 / 主体色温 / 提亮单品 / 可迁移技巧，四项即可。</div></div><div class="card"><h3>配色：冷暖可以分区，不必全身统一</h3><div class="quote">冷色衬衫半裙 + 暖色包鞋，是视频反复出现的结构。</div><div class="pitfall">不要把「配色和谐」理解成全身同一色温；完全同温容易变平。</div></div><div class="card"><h3>场景与妆容：细节位置比品牌更重要</h3><div class="highlight">餐厅找撞色道具；腮红扫到眼下睫毛根部，会明显改变氛围。</div><div class="action">拍照前列三件场景里可入镜的亮色；化妆时多试一个「非常规腮红位置」。</div></div><div class="card"><h3>拍照：姿势与背景都在服务肤色和焦点</h3><div class="action">蹲拍垫脚；大色块背景后退约五米，避免脸被压暗。</div><div class="pitfall">贴脸拍大面积高饱和背景，容易让自动曝光牺牲肤色。</div></div></div>
  <div class="conclusion"><h2>行动清单</h2><ul><li>每天选 1 张参考图，写下视觉焦点和可迁移的 1 个技巧</li><li>基础通勤装用包、鞋、帽承担 1 个高饱和点缀</li><li>餐厅或街拍先找可撞色的小道具再按快门</li><li>大色块背景拍摄时先退后测试肤色，再调整构图</li></ul>
  <h2>适用边界</h2><p>内容为博主个人审美拆解，参考图来自 Instagram 博主，具体单品品牌与可复制程度因身材、场景、光线而异；妆容与美甲需按个人肤质和技术调整。</p></div>
