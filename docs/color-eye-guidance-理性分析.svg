.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>色彩视线引导：明度与彩度动线</h1>
  <div class="meta"><span class="tag tag-blue">视线引导</span><span class="tag tag-green">明度对比</span><span class="tag tag-orange">彩度</span><span class="tag tag-purple">列宾</span><span class="tag tag-red">沃特豪斯</span><span class="tag tag-gray">时长 196秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/7613ZcM42kn">原视频</a>
  <div class="summary-line">平淡常因缺少视线路径。列宾用明度对比强弱推主视线并循环；怀斯用水平动线稳情绪；莫奈叠明度大动线与彩度红点成椭圆；沃特豪斯用纯度渐变与色相偏移送走再拉回焦点。主观用色＝研究色块构成。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">平淡vs大师：关键在引导</span></div><div class="timeline-item"><span class="timeline-time">00:16</span><span class="timeline-text">列宾《意外归来》</span></div><div class="timeline-item"><span class="timeline-time">00:36</span><span class="timeline-text">左→右：对比强弱</span></div><div class="timeline-item"><span class="timeline-time">00:54</span><span class="timeline-text">细节眼神循环动线</span></div><div class="timeline-item"><span class="timeline-time">01:14</span><span class="timeline-text">怀斯水平动线</span></div><div class="timeline-item"><span class="timeline-time">01:37</span><span class="timeline-text">莫奈明度大动线</span></div><div class="timeline-item"><span class="timeline-time">01:57</span><span class="timeline-text">红物件彩度椭圆</span></div><div class="timeline-item"><span class="timeline-time">02:18</span><span class="timeline-text">沃特豪斯鲜红焦点</span></div><div class="timeline-item"><span class="timeline-time">02:33</span><span class="timeline-text">纯度渐变+色相偏移</span></div><div class="timeline-item"><span class="timeline-time">02:57</span><span class="timeline-text">研究色块构成</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">主落点<br/>最强对比</div><span class="arrow">→</span><div class="node-green">路径<br/>递减对比</div><span class="arrow">→</span><div class="node-orange">呼应<br/>彩度／纯度</div><span class="arrow">→</span><div class="node-blue">回收<br/>拉回主角</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「怀思／琐思／清新」→「怀斯／思绪／精心」。</p><p>误区：主观用色＝随便换固有色。视频强调色块路径。</p><p>误区：只要画「像」就有引导。需主动设计对比强弱。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>列宾：强度感知</h3>
      <p>男人重色块对比最强→母亲→孩子；细节眼神织循环。</p>
      <div class="quote">利用了人眼强度感知的原理</div>
      <div class="relation">主视线靠对比阶梯，不靠题材本身。</div>
    </div>
    <div class="card card-orange">
      <h3>怀斯：水平＝平静</h3>
      <p>明度细节从强到弱横向移动，强化质朴情绪。</p>
      <div class="quote">水平动线带来的平和的心理感受</div>
      <div class="relation">动线方向也在规定情绪。</div>
    </div>
    <div class="card card-red">
      <h3>莫奈：明度+彩度</h3>
      <p>大明度动线定骨架，红领结／书／毯收成椭圆。</p>
      <div class="quote">明度与彩度共同作用形成的视线引导</div>
      <div class="relation">两种对比可叠成闭环路径。</div>
    </div>
    <div class="card card-purple">
      <h3>沃特豪斯：缓和导走</h3>
      <p>鲜红→红花→偏橙红；上方色块再拉回女主角。</p>
      <div class="quote">较为缓和的纯度渐变和色相偏移</div>
      <div class="relation">焦点过重时用渐变泄压并回收。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>抛弃像与不像，研究色块构成</p>
      <div class="quote">认真研究画面的色块构成是最行之有效的办法</div>
      <div class="relation">老师到底如何主观用色</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>196 秒原理短片，非完整构图课。</li><li>「怀斯」按画面与常见教学指安德鲁·怀斯一系。</li><li>课宣非技法步骤。</li></ul><div class="pitfall">到处平均对比，没有主落点。</div><div class="pitfall">焦点一侧堆满高对比导致失衡却不设计回流。</div><div class="pitfall">只用故事情节解释「抓眼」，忽略色块路径。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>对比强弱定落点</li><li>动线可水平可循环</li><li>纯度／色相可导走</li></ul><h3>行动清单</h3><ol><li>选一幅画闭眼退远，标出第一落点与路径</li><li>用三档明度块重排同一构图的视线</li><li>试一次纯度渐变把过重焦点泄到对侧</li><li>禁止只靠「画得更像」解决平淡</li></ol><h3>关键认知转变</h3><p>以前：把对象画清楚；现在：先设计眼睛从哪进、经哪走、在哪停。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 196秒</div>
</div>
    </div>
  </foreignObject>
</svg>