<div class="timeline-item"><span class="timeline-time">[00:07]</span><span class="timeline-text">结果换来的只是一个尴尬的假笑</span></div>
<div class="timeline-item"><span class="timeline-time">[00:09]</span><span class="timeline-text">其实不一定是你的技术不行</span></div>
<div class="timeline-item"><span class="timeline-time">[00:11]</span><span class="timeline-text">而是你的引导方式</span></div>
<div class="timeline-item"><span class="timeline-time">[00:12]</span><span class="timeline-text">缺了最关键的一环</span></div>
<div class="timeline-item"><span class="timeline-time">[00:14]</span><span class="timeline-text">这个关键的步骤</span></div>
<div class="timeline-item"><span class="timeline-time">[00:15]</span><span class="timeline-text">我把它叫做</span></div>
<div class="timeline-item"><span class="timeline-time">[00:17]</span><span class="timeline-text">很多人以为家庭计时是摆姿势按快门</span></div>
<div class="timeline-item"><span class="timeline-time">[00:20]</span><span class="timeline-text">但真正高级的引导不是控制动作</span></div>
<div class="timeline-item"><span class="timeline-time">[00:23]</span><span class="timeline-text">而是帮助他们进入一个故事场景</span></div>
<div class="timeline-item"><span class="timeline-time">[00:25]</span><span class="timeline-text">想象一下你把相机当成摄像机</span></div>
<div class="timeline-item"><span class="timeline-time">[00:28]</span><span class="timeline-text">把今天的拍摄当成他们一家人的小片场</span></div>
<div class="timeline-item"><span class="timeline-time">[00:31]</span><span class="timeline-text">而你不再只是喊看镜头的快门机器</span></div>
<div class="timeline-item"><span class="timeline-time">[00:33]</span><span class="timeline-text">你变成了一位引导家庭情绪的故事讲述者</span></div>
<div class="timeline-item"><span class="timeline-time">[00:37]</span><span class="timeline-text">故事引导法到底做了什么</span></div>
<div class="timeline-item"><span class="timeline-time">[00:39]</span><span class="timeline-text">它让你像讲故事一样带领他们进入情境</span></div>
<div class="timeline-item"><span class="timeline-time">[00:42]</span><span class="timeline-text">不是摆一个动作</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>你是不是总觉得</li>
<li>每次让客人摆好姿势看镜头的时候</li>
<li>他们做出来的动作都特别僵硬</li>
<li>你让他们笑一笑</li>
<li>结果换来的只是一个尴尬的假笑</li>
<li>其实不一定是你的技术不行</li>
<li>而是你的引导方式</li>
<li>缺了最关键的一环</li>
<li>这个关键的步骤</li>
<li>我把它叫做</li>
<li>很多人以为家庭计时是摆姿势按快门</li>
<li>但真正高级的引导不是控制动作</li>
<li>而是帮助他们进入一个故事场景</li>
<li>想象一下你把相机当成摄像机</li>
<li>把今天的拍摄当成他们一家人的小片场</li>
<li>而你不再只是喊看镜头的快门机器</li>
<li>你变成了一位引导家庭情绪的故事讲述者</li>
<li>故事引导法到底做了什么</li>
<li>它让你像讲故事一样带领他们进入情境</li>
<li>不是摆一个动作</li>
<li>而是体验一个瞬间</li>
<li>那么到底要怎么做呢</li>
<li>你只需要做到这三点</li>
<li>开拍之前先熟悉你的家庭剧本</li>
<li>引导其实从拍摄前就开始了</li>
<li>你要先了解这个家的故事</li>
<li>他们家大概什么样子</li>
<li>孩子最近喜欢什么</li>
<li>一家人惊奇有什么特别的经历</li>
<li>这些都属于他们真实情感线索</li>
<li>也就是你的拍摄剧本</li>
<li>当然这些细节你可以从调查文券中获得</li>
<li>其实也可以从他们的朋友圈中获得</li>
<li>而落实到拍摄中所谓的剧本</li>
<li>并不是让他们回忆什么第一次抱宝宝</li>
<li>也不是让他们在镜头前强行进入某种情绪</li>
<li>对普通家庭来说这反而会有点尴尬</li>
<li>孩子最近迷上的动画</li>
<li>经常重复的小游戏</li>
<li>家里一本读到烂掉的绘本</li>
<li>作者爸妈长跟孩子互动的方式</li>
<li>这些小细节比情绪回忆更自然也更真实</li>
<li>这些生活瞬间就是你拍摄时</li>
<li>最真实最自然的素材</li>
<li>拍摄过程中捕捉他们的高光情绪</li>
<li>好的照片不是摆出来的</li>
<li>而是被观察出来的</li>
<li>你要像盯着显示器一样</li>
<li>留意每一个情绪的微小波动</li>
<li>比如孩子突然安静的靠在妈妈肩上</li>
<li>妈妈轻轻抚摸她的头</li>
<li>那一瞬间的温柔一定是摆不出来的</li>
<li>又或者全家在沙发上聊天时</li>
<li>爸爸什么都没说</li>
<li>只是静静的看着他们笑</li>
<li>嘴角就跟着上扬</li>
<li>这些时刻不用打断</li>
<li>也不用重新摆拍</li>
<li>也不需要刻意调整</li>
<li>你只需要移动机位</li>
<li>把它记录下来</li>
<li>因为放大真实的情绪</li>
<li>永远比制造表情更有力量</li>
<li>少给动作指令</li>
<li>多给情经状态</li>
<li>普通家庭客户很少能演情绪</li>
<li>但他们非常擅长玩游戏</li>
<li>把套在爸爸妈妈身上</li>
<li>换成我们比一比</li>
<li>看谁能把爸爸挤成馅饼</li>
<li>把手举起来</li>
<li>换成谁是家里最可爱的人</li>
<li>赢的小朋友可以吃一颗糖</li>
<li>当你给的不是动作而是情境</li>
<li>甚至把情境换成游戏</li>
<li>他们就会自然地进入角色</li>
<li>这时候他们不再是镜头前的模特</li>
<li>而是故事里的家人</li>
<li>所以说最好的引导</li>
<li>不是把他们拉进某一种完美的姿势</li>
<li>而是轻轻把他们带回到</li>
<li>自己真实的状态里</li>
<li>让他们忘记镜头</li>
<li>也忘记应该怎么拍</li>
<li>而你所做的只是在旁边陪伴</li>
<li>与接纳着这一家人最真实的样子</li>
<li>那些突然想笑的瞬间</li>
<li>那些没忍住的鼻酸</li>
<li>还有那些拥抱的很紧的时刻</li>
<li>能把这些真实保存下来</li>
<li>成为他们未来回头</li>
<li>看时最柔软的记忆</li>
<li>是我们作为摄影师最幸福的事情了</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>你是不是总觉得每次让客人摆好姿势看镜头的时候他们做出来的动作都特别僵硬你让他们笑一笑结果换来的只是一个尴尬的假笑其实不一定是你的技术不行而是你的引导方式缺了最关键的一环这个关键的步骤我把它叫做很多人以为家庭计时是摆姿势按快门但真正高级的引导不是控制动作而是帮助他们进入一个故事场景想象一下你把相机当成摄像机把今天的拍摄当成他们一家人的小片场而你不再只是喊看镜头的快门机器你变成了一位引导家庭情绪的故事</p><p>转录分段: 96 | 时长: 3:14</p></div>
