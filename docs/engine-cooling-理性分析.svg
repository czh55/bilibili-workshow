<div class="card"><h3>内容要点</h3><ul><li>大家好,我是十一胞小老虎,欢迎来到我的频道</li>
<li>那么今天呢,来和大家聊一聊汽车发动机的冷却系统是怎样运行的</li>
<li>以及当冷却系统中的哪些部分出现了故障时,都是以什么样的形式表现出来的</li>
<li>好,那我们首先来挨个看一下这个零部件的构成和原理</li>
<li>最中心的这个呢,当然就是发动机了</li>
<li>在发动机的前端固定着这样一个水泵</li>
<li>水泵一同是液轮,另一同是同轴的滑轮</li>
<li>这样的话,液轮在发动机的内部,滑轮在发动机的外部</li>
<li>由发动机取轴,通过皮带来带动</li>
<li>它是整个发动机冷却系统循环运行的动力来源</li>
<li>而同样固定在发动机钢体上的还有这个结温器</li>
<li>简单来说呢,它就是一个通过温度控制开关的一个法门</li>
<li>结温器的开和关,它决定了发动机的冷却是在大循环的状态</li>
<li>还是小循环的状态,那么这一点呢在之后马上会想想到</li>
<li>而在发动机的前方处于车头位置的这一个大方块呢</li>
<li>就是冷却水箱了,水箱上最显眼的呢</li>
<li>就是上下这两根粗粗的水管了</li>
<li>而且一定是一根在最上面,一根在最下面</li>
<li>滚烫的冷却也永远是从发动机通过上面的这根水管进入水箱</li>
<li>然后从下面的这根水管重新流回发动机</li>
<li>由于水箱处于车头的位置,只要车开起来呢</li>
<li>就会有源源不断的风吹向水箱</li>
<li>给水箱里面的冷却液降温</li>
<li>所以从这里流回发动机的冷却液呢</li>
<li>就又能给发动机来降温了</li>
<li>而在水箱的后面,紧贴着水箱的这个地方啊</li>
<li>你会看到有一个风扇</li>
<li>那么当交通严重堵塞,车子一直停在原地</li>
<li>根本就没有什么撞风的机会的时候</li>
<li>那么势必啊,这个水箱里面的冷却效果也会大大折扣</li>
<li>那么导致这里流回发动机的冷却液呢,温度还不够低</li>
<li>那么工程师就会在水箱一般</li>
<li>下面的这个地方安装一个温度传感器</li>
<li>当发现马上要流回发动机的冷却液温度不够低的时候</li>
<li>这个温度传感器就会告诉电脑</li>
<li>电脑直接命令启动这个风扇</li>
<li>强行给水箱制造撞风降温</li>
<li>而在这边一般还会有一个负水箱</li>
<li>也叫膨胀水箱</li>
<li>这个水箱不同厂商的设计是有所不同的</li>
<li>但是主要的功能都是将煮水箱中的冷却液</li>
<li>它由于高温膨胀时来引流一部分储存到这个负水箱中</li>
<li>而等发动机熄火之后</li>
<li>煮水箱里面的冷却液逐渐降温收缩的时候</li>
<li>再从负水箱吸回一部分冷却液回到煮水箱中</li>
<li>所以说煮水箱中的液位应该永远都是满的</li>
<li>而负水箱中的液位是随着冷却液温度的变化而上下浮动的</li>
<li>这也就是为什么大家常规检查冷却液的液位</li>
<li>其实都是看的负水箱</li>
<li>也只有负水箱上才会标有最高和最低液位的标识</li>
<li>这几个大件都搞明白了</li>
<li>我们就能来看发动机冷却系统的整体运行了</li>
<li>发动机在室温环境下启动</li>
<li>燃烧室开始点火做工</li>
<li>环绕着发动机水道中的这些绿色的冷却液</li>
<li>就开始慢慢被燃烧室加热</li>
<li>这时唯一运行的部分其实只有水泵</li>
<li>它搅动着冷却液在发动机的内部循环着</li>
<li>这就是所谓的小循环</li>
<li>由于是小循环</li>
<li>发动机内部总共就这么一点水</li>
<li>每一会就会差不多烧到发动机正常运行的80多度的温度</li>
<li>温度再往上高一点</li>
<li>就达到了结温器所设计的打开的温度</li>
<li>随着结温器的打开</li>
<li>大家看这边有细节图</li>
<li>冷却液会被水泵驱动着从这边进入水箱</li>
<li>发动机也就从此进入了大循环</li>
<li>水箱通过撞风来给冷却液降温</li>
<li>如果堵车没有风给你撞</li>
<li>冷却液都流到这了</li>
<li>还是太烫</li>
<li>那么刚才说的水温敞感器就会命令风扇打开</li>
<li>进行强制撞风冷却</li>
<li>然后冷却玩的冷却也重新由这里进入发动机</li>
<li>随着水泵不间断的驱动</li>
<li>重复着这个大循环</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>大家好,我是十一胞小老虎,欢迎来到我的频道那么今天呢,来和大家聊一聊汽车发动机的冷却系统是怎样运行的以及当冷却系统中的哪些部分出现了故障时,都是以什么样的形式表现出来的好,那我们首先来挨个看一下这个零部件的构成和原理最中心的这个呢,当然就是发动机了在发动机的前端固定着这样一个水泵水泵一同是液轮,另一同是同轴的滑轮这样的话,液轮在发动机的内部,滑轮在发动机的外部由发动机取轴,通过皮带来带动它是整个发</p><p>转录分段: 182 | 时长: 8:02</p></div>
