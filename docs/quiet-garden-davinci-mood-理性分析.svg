      <div class="container root-wrap">
  <h1>幽静园林怎么用达芬奇调出氛围感？</h1>
  <div class="meta"><span class="tag tag-blue">达芬奇</span><span class="tag tag-green">园林</span><span class="tag tag-orange">阴天</span><span class="tag tag-purple">氛围</span><span class="tag tag-red">取舍</span><span class="tag tag-gray">时长 5分39秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/6ROwa1GmxJK">原视频</a>
  <div class="summary-line">园林雾景「杂」多半处处太亮无主次。还原偏暗，HDR 保潮湿表面光感，压天空、提中景、压四周；走冷青绿但并行保暖，六相降饱和求阴天逻辑。核心是取舍。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">杂乱＝处处太亮；还原偏暗保氛围</span></div><div class="timeline-item"><span class="timeline-time">00:28</span><span class="timeline-text">HDR：降 Shadow/Light，抬 Highlight 保光感</span></div><div class="timeline-item"><span class="timeline-time">01:33</span><span class="timeline-text">压天空、中间提对比、外部压暗</span></div><div class="timeline-item"><span class="timeline-time">02:59</span><span class="timeline-text">走冷青绿；并行保石板暖色；六相降艳</span></div><div class="timeline-item"><span class="timeline-time">04:29</span><span class="timeline-text">柔和对比度收束；总结取舍</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">病因<br/>处处亮 → 无主次</div><span class="arrow">→</span><div class="node-green">光<br/>HDR 保雾天光感</div><span class="arrow">→</span><div class="node-orange">分区<br/>压天 / 提中 / 压周</div><span class="arrow">→</span><div class="node-blue">色<br/>冷调 + 并行保暖</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「潮汐」校正为「潮气」；「一级胶色轮」校正为「一级校色轮」；「变形节点」多为「并行节点」；「音韵滑快」校正为「阴影滑块」；「映光」校正为「硬光」；「走冷掉」校正为「走冷调」；「Adroid的JP」校正为「Option+P / Alt+P」；「烟条线」校正为「样条线」；「波感」校正为「波谷」；「邻居」校正为「领取」。</p><p>误区：阴天园林越亮越「清透」。视频主张偏暗才有氛围。</p><p>误区：全局走冷不管石板暖色。必须并行保护暖色。</p><p>误区：阴天仍保持高饱和。应用密度与降饱和求耐看。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>杂乱的本质：没有主次</h3>
      <p>什么都太亮、谁都清楚，观感一定杂。阴天有雾时还原别太亮，暗一点才有氛围。</p>
      <div class="quote">什么都太亮了，谁都看得清楚，就代表着画面中没有主次</div>
      <div class="relation">先诊断曝光主次，再谈颜色。</div>
    </div>
    <div class="card card-orange">
      <h3>雾天 HDR：高光别发灰</h3>
      <p>潮湿表面在合适折射角会有光感。降 Light 的同时抬 Highlight 并调范围，拉开高光层次。</p>
      <div class="quote">如果说我们不提高 Highlight 色轮的曝光的话……它的高光会发灰</div>
      <div class="relation">氛围靠暗，质感靠保住的那一点光。</div>
    </div>
    <div class="card card-green">
      <h3>分区三板斧</h3>
      <p>天空抢戏就压；中景主体大柔化遮罩加对比略提；外部压四周且压暗同时略抬高光。</p>
      <div class="quote">要压暗就不能只压暗，你还得提亮</div>
      <div class="relation">阴天漫反射，必须有取舍。</div>
    </div>
    <div class="card card-purple">
      <h3>冷调逻辑 vs 艳色幻觉</h3>
      <p>阴天走冷必然，但不该那么艳。降色温色调后并行把石板/帽暖色找回，六相加密度降饱和。</p>
      <div class="quote">阴天怎么可能会有这么艳的颜色呢</div>
      <div class="relation">风格服从天气逻辑。</div>
    </div>
    <div class="card card-red">
      <h3>调色前思考：取舍清单</h3>
      <p>什么该要、不该要，强化还是弱化——比具体数值更重要。</p>
      <div class="quote">你调色的时候一定要有取舍</div>
      <div class="relation">可验证：与还原对比看主次是否成立。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>个案园林雾景，参数需按自己波形重调。</li><li>「取舍」是作者方法论，非唯一正确美学。</li><li>素材/课程引流信息不展开。</li></ul><div class="pitfall">还原过亮，氛围直接没。</div><div class="pitfall">HDR 不抬 Highlight，桥面等高光发灰。</div><div class="pitfall">只压四周不抬高光，环境光感死。</div><div class="pitfall">全局走冷不管暖石板，颜色发闷发脏。</div><div class="pitfall">阴天仍保持艳饱和。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>杂＝无主次；还原偏暗</li><li>HDR 保雾天表面光感</li><li>压天 / 提中 / 压周</li><li>冷调 + 保暖 + 降饱和</li></ul><h3>行动清单</h3><ol><li>开项目先问：谁该亮、谁该弃</li><li>雾天：Highlight 范围与曝光一起调</li><li>天空抢戏优先压</li><li>走冷后立刻检查石板/肤色暖是否还在</li></ol><h3>关键认知转变</h3><p>以前：处处提亮求「看清」；现在：偏暗分区，用取舍换氛围。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 5分39秒</div>
</div>
    </div>
  </foreignObject>
</svg>