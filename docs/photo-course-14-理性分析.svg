.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#0d9488;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#0f766e;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      
<div class="container root-wrap">
  <h1>从0开始学摄影｜第十四期</h1>
  <div class="meta"><span class="tag tag-blue">摄影教程</span><span class="tag tag-blue">人像</span><span class="tag tag-blue">街头摄影</span><span class="tag tag-blue">构图</span><span class="tag tag-blue">小红书</span><span class="tag tag-gray">时长 3分41秒</span></div>
  <a class="source-link" href="http://xhslink.cn/o/4dCILnS6h6J">原视频链接</a>
  <div class="summary-line">街头人像「随地大小拍」：环境够用就好、重点在人物、构图避干扰、顶光变长条光关注眼神、侧面营造侧光立体感。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">理念：拍照不挑环境</span></div><div class="timeline-item"><span class="timeline-time">00:29</span><span class="timeline-text">实拍：左脸受光构图</span></div><div class="timeline-item"><span class="timeline-time">01:13</span><span class="timeline-text">等后车眩光、避干扰</span></div><div class="timeline-item"><span class="timeline-time">02:15</span><span class="timeline-text">长条顶光与眼神</span></div><div class="timeline-item"><span class="timeline-time">03:11</span><span class="timeline-text">侧光利用与后期预告</span></div></div>
  <div class="section"><div class="sec-title">观点拆解</div><div class="card"><h3>拍摄理念</h3><div class="highlight">拍人像侧重点在人物本身，只要人好看哪里都行。</div></div><div class="card"><h3>构图法则</h3><div class="highlight">人物别放最中间，避开粗壮干扰物，等眩光增加趣味。</div></div><div class="card"><h3>顶光利用</h3><div class="highlight">长条光让模特后退观察变化，证件照风格专注眼神。</div></div><div class="card"><h3>侧光立体感</h3><div class="highlight">有线条的墙先给侧面，侧光制造明暗对比与过渡。</div></div></div>
  <div class="conclusion"><h2>行动清单</h2><ul><li>人像拍摄重点放在人物本身，场景够用就好</li><li>人物别放画面正中间</li><li>避开粗壮柱子等干扰物</li><li>顶光下让模特移动观察光线变化，专注眼神</li><li>遇线条墙面先拍侧面营造侧光</li></ul>
  <h2>适用边界</h2><p>本视频为街头环境人像教学，未涉及室内棚拍、闪光灯布光与后期调色具体参数。</p></div>
