<div class="container root-wrap">
  <h1>这套动作教程来啦！</h1>
  <div class="meta"><span class="tag tag-blue">舞蹈</span><span class="tag tag-blue">动作教学</span><span class="tag tag-blue">跟练</span><span class="tag tag-blue">小红书</span><span class="tag tag-gray">时长 23秒</span></div>
  <a class="source-link" href="http://xhslink.cn/o/1zBETKHZTC6">原视频链接</a>
  <div class="summary-line">23 秒舞蹈快教学，8 个动作按固定顺序衔接，强调上肢动作、空间转身与节奏配合。</div>
  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">起式动作，手位自由</span></div><div class="timeline-item"><span class="timeline-time">00:04</span><span class="timeline-text">抛头发打开画面</span></div><div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">扶墙甩手抬腿转</span></div><div class="timeline-item"><span class="timeline-time">00:13</span><span class="timeline-text">侧身抬腿转衔接</span></div><div class="timeline-item"><span class="timeline-time">00:16</span><span class="timeline-text">抛头发打招呼收尾</span></div></div>
  <div class="section"><div class="sec-title">观点拆解</div><div class="card"><h3>动作编排逻辑</h3><div class="highlight">起式→上臂→空间动作→转身→收尾，每步一个口令一个画面。</div></div><div class="card"><h3>上肢动作要点</h3><div class="highlight">手放上放下都可，抛头发用于打开镜头画面。</div></div><div class="card"><h3>空间与转身技巧</h3><div class="highlight">扶墙作支点、甩手抬腿转、侧身抬腿转，摆臂抬腿需配合节奏。</div></div></div>
  <div class="conclusion"><h2>行动清单</h2><ul><li>先做起式确定手位，再抛头发打开画面</li><li>用扶墙或支点辅助完成转身动作</li><li>甩手、抬腿、转身三步配合节奏</li><li>以侧身抬腿转衔接，收尾动作与开场呼应</li></ul>
  <h2>适用边界</h2><p>本视频为动作演示教学，未涉及音乐节奏、队形或舞台走位，动作难度适合新手跟练。</p></div>
