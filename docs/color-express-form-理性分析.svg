      <div class="container root-wrap">
  <h1>用色彩表现形体：亮／暗／灰三层公式</h1>
  <div class="meta"><span class="tag tag-blue">色彩</span><span class="tag tag-green">形体</span><span class="tag tag-orange">光源色</span><span class="tag tag-purple">环境色</span><span class="tag tag-red">补色</span><span class="tag tag-gray">时长 227秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/4YybIfEQh1S">原视频</a>
  <div class="summary-line">亮部＝光源色＋固有色提亮；暗部＝固有色变暗＋环境色＋光的补色（视觉生理）；灰面几乎只留固有色。莫奈桥、撑伞女人、干草堆举证。塑形靠分层跟光走，不是随意换色。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">为何亮灰暗要用不同倾向色</span></div><div class="timeline-item"><span class="timeline-time">00:30</span><span class="timeline-text">亮部公式：光源色＋固有色提亮</span></div><div class="timeline-item"><span class="timeline-time">00:37</span><span class="timeline-text">莫奈桥／毕沙罗树举证</span></div><div class="timeline-item"><span class="timeline-time">01:02</span><span class="timeline-text">暗部：环境反射</span></div><div class="timeline-item"><span class="timeline-time">01:34</span><span class="timeline-text">补色来自视觉生理</span></div><div class="timeline-item"><span class="timeline-time">02:34</span><span class="timeline-text">暗部公式＋干草堆</span></div><div class="timeline-item"><span class="timeline-time">03:14</span><span class="timeline-text">灰面保留固有色</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">亮<br/>光源色＋固有提亮</div><span class="arrow">→</span><div class="node-green">暗<br/>环境＋光补色</div><span class="arrow">→</span><div class="node-orange">灰<br/>守固有色</div><span class="arrow">→</span><div class="node-blue">证<br/>大师作品</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「阿仗特一／默奈／犯的强烈」→「阿让特伊／莫奈／泛着强烈」。</p><p>误区：暗部＝固有色加黑。视频要求环境与补色。</p><p>误区：灰面也大改光源色。灰面应少受影响。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>亮部跟光源走</h3>
      <p>朝向光源的面必混入光源色：亮部＝光源色＋固有色提亮。白＋暖黄、绿＋黄光→黄绿。</p>
      <div class="quote">亮部色彩等于光源色加固有色提亮</div>
      <div class="relation">亮＝固有×光，不是固有加白那么简单。</div>
    </div>
    <div class="card card-orange">
      <h3>暗部跟环境走</h3>
      <p>无直射时混反射：撑伞女人朝上发蓝、朝下受草绿。</p>
      <div class="quote">暗的同时要混合来自环境的色彩</div>
      <div class="relation">暗部色相来自周围，不是死黑。</div>
    </div>
    <div class="card card-red">
      <h3>再加光的补色</h3>
      <p>刺眼亮部光色会触发补色平衡；暗部公式含光补色。干草堆暗部大量紫。</p>
      <div class="quote">大脑会让暗部自动加入光色的补色，以求得心理平衡</div>
      <div class="relation">生理机制→可操作的补色习惯。</div>
    </div>
    <div class="card card-purple">
      <h3>灰面守固有</h3>
      <p>影响极小则基本保留固有色；人像皮肤灰面常偏高饱和固有色。</p>
      <div class="quote">则基本保留物体固有的色彩</div>
      <div class="relation">灰是固有色的栖息地。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>第一讲原理篇，不含完整实战步骤（下期预告）。</li><li>后像演示说明机制，非要求观众必须做实验。</li><li>大师例证服务公式，非画史考证。</li></ul><div class="pitfall">暗部只加黑加灰，形体发闷。</div><div class="pitfall">亮部忽略光源色倾向。</div><div class="pitfall">灰面也被环境色洗掉，固有色丢失。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>亮跟光源，暗跟环境＋补色，灰守固有</li><li>公式可套进印象派举证</li><li>塑形＝色相分工，不是明暗涂脏</li></ul><h3>行动清单</h3><ol><li>画球体：亮面写入光源色，暗面写环境＋补色，灰面保固有</li><li>临摹撑伞女人：标出朝上蓝与朝下绿</li><li>干草堆暗部检查是否有紫／天蓝成分</li><li>人像灰面避免过度染环境色</li></ol><h3>关键认知转变</h3><p>以前：暗部加黑、亮部加白；现在：按亮／暗／灰三层给不同色相任务。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 227秒</div>
</div>
    </div>
  </foreignObject>
</svg>