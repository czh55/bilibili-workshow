      <div class="container root-wrap">
  <h1>不加白，居然更耀眼？纯度也能增强光感</h1>
  <div class="meta"><span class="tag tag-blue">色彩原理</span><span class="tag tag-green">光感</span><span class="tag tag-orange">纯度</span><span class="tag tag-purple">画光</span><span class="tag tag-red">莫奈</span><span class="tag tag-gray">写生</span><span class="tag tag-gray">时长 98秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/HB5WFAJ2Jy">原视频</a>
  <div class="summary-line">画光第三招：纯度。明度与冷暖接近时，更鲜艳的一侧光感更强。莫奈鲁昂受光区靠提纯而非一味画浅；雪村实操把中心黄与云缘橙红、天空蓝紫饱和度拉满，耀眼不必加白。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">双球：右边光感更强</span></div><div class="timeline-item"><span class="timeline-time">00:07</span><span class="timeline-text">明度、冷暖接近 → 差在纯度</span></div><div class="timeline-item"><span class="timeline-time">00:20</span><span class="timeline-text">莫奈鲁昂：受光区提纯，不一味画浅</span></div><div class="timeline-item"><span class="timeline-time">00:36</span><span class="timeline-text">画光三思路：明度、冷暖、纯度</span></div><div class="timeline-item"><span class="timeline-time">00:44</span><span class="timeline-text">雪村：基调→云→树→雪</span></div><div class="timeline-item"><span class="timeline-time">01:03</span><span class="timeline-text">中心鲜黄+橙黄；云缘橙红+天空蓝紫拉满</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">证据<br/>双球纯度差</div><span class="arrow">→</span><div class="node-green">典范<br/>莫奈提纯受光</div><span class="arrow">→</span><div class="node-orange">三招<br/>明度·冷暖·纯度</div><span class="arrow">→</span><div class="node-blue">实操<br/>中心高纯+对拉</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「鲁王／木乃／化浅／化光」校正为「鲁昂／莫奈／画浅／画光」。</p><p>误区：光感=提亮加白。视频证明纯度可独立增强光感。</p><p>误区：受光区越浅越好。莫奈例证是更鲜艳而非一味画浅。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>实验：纯度独立贡献光感</h3>
      <p>两球明度与冷暖接近时，更鲜艳的右边光感更强。结论直接：纯度也能增强光感——为「不加白更耀眼」提供可重复证据。</p>
      <div class="quote">右边的明度一样……冷暖也差不多啊……一定是纯度</div>
      <div class="relation">控制变量后，纯度是第三旋钮。</div>
    </div>
    <div class="card card-orange">
      <h3>莫奈：受光区提纯</h3>
      <p>鲁昂大教堂受光区不一味画浅，而是让颜色更鲜艳、纯度更高，于是更鲜活炽热。把「画浅」替换成「提纯」。</p>
      <div class="quote">没有一味地把受光区画浅，而是让这块颜色更鲜艳，纯度更高</div>
      <div class="relation">浅 ≠ 亮；鲜也可以亮。</div>
    </div>
    <div class="card card-purple">
      <h3>三招齐全：明度、冷暖、纯度</h3>
      <p>作者把本集定位为画光第三思路，与明度、冷暖并列。缺纯度时，只调亮暗与冷暖仍可能「亮但不耀眼」。</p>
      <div class="quote">三种画光的思路：明度、冷暖和今天说的纯度</div>
      <div class="relation">检查清单少一招就少一分光感。</div>
    </div>
    <div class="card card-red">
      <h3>实操：中心高纯 + 冷暖对拉</h3>
      <p>雪村步骤把视觉中心鲜黄拉到明度对比最强，再用橙黄、云缘橙红与天空蓝紫把纯度拉满。光感鲜活来自饱和对冲，不是涂白。</p>
      <div class="quote">加入更鲜艳的黄色……加入最高饱和的橙红色……纯度此刻也被拉到最大</div>
      <div class="relation">关键受光区允许最高饱和。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>98 秒聚焦纯度与光感，不展开完整风景写生课程。</li><li>莫奈例证服务原理，非作品史考证。</li><li>「画光就是这么简单」是鼓励语，需结合前两集明度／冷暖。</li></ul><div class="pitfall">受光区只加白加浅，画面粉气无光。</div><div class="pitfall">到处拉满饱和，失去视觉中心。</div><div class="pitfall">有冷暖对比却把纯度压死，光感发闷。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>纯度是画光第三招，可独立增强光感</li><li>受光区优先提纯，而非一味画浅</li><li>中心高纯 + 冷暖对拉，比加白更耀眼</li></ul><h3>行动清单</h3><ol><li>对一张旧作：找到最「想发光」的区域，提高纯度而非提白</li><li>临摹时同时看彩图与灰度，确认光感是否主要靠纯度</li><li>风景写生规定：视觉中心允许画面最高饱和</li><li>自检三招是否都用到：明度、冷暖、纯度</li></ol><h3>关键认知转变</h3><p>以前：想要耀眼就加白加亮；现在：在明度与冷暖之外，把关键受光区的纯度拉起来。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 98秒</div>
</div>
    </div>
  </foreignObject>
