<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="4127" viewBox="0 0 1320 4127">
  <foreignObject x="0" y="0" width="1320" height="4127">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}
.container{max-width:1200px;margin:0 auto}
h1{font-size:36px;font-weight:900;background:linear-gradient(135deg,#1e40af,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
h2{font-size:26px;font-weight:700;color:#1e40af;margin:32px 0 16px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
h3{font-size:20px;font-weight:700;color:#334155;margin-bottom:12px}
p{font-size:16px;line-height:1.8;color:#475569;margin-bottom:10px}
ul,ol{padding-left:24px;margin:8px 0}
li{font-size:15px;line-height:1.8;color:#475569;margin-bottom:6px}
.tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-right:8px}
.tag-blue{background:#dbeafe;color:#1e40af}.tag-green{background:#d1fae5;color:#065f46}.tag-orange{background:#ffedd5;color:#9a3412}.tag-purple{background:#ede9fe;color:#6b21a8}.tag-red{background:#fee2e2;color:#991b1b}.tag-gray{background:#f1f5f9;color:#64748b}
.meta{margin:12px 0 20px}
.summary-line{font-size:18px;line-height:1.7;color:#334155;padding:20px 24px;background:#fff;border-radius:12px;border-left:4px solid #3b82f6;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline{background:#fff;border-radius:16px;padding:24px 28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.timeline-item{display:flex;padding:6px 0;border-bottom:1px solid #f1f5f9}
.timeline-time{font-size:14px;font-weight:700;color:#3b82f6;min-width:70px}
.timeline-text{font-size:14px;color:#475569}
.map{background:#fff;border-radius:20px;padding:36px;margin-bottom:28px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.diagram{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;padding:20px 0}
.node{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid #93c5fd;border-radius:16px;padding:16px 22px;text-align:center;min-width:140px;font-weight:700;font-size:15px;color:#1e40af}
.node-green{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border-color:#6ee7b7;color:#065f46}
.node-orange{background:linear-gradient(135deg,#fff7ed,#ffedd5);border-color:#fdba74;color:#9a3412}
.arrow{font-size:22px;color:#94a3b8}
.card{background:#fff;border-radius:16px;padding:28px;margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.06);border-left:5px solid #3b82f6}
.card h3{font-size:20px;font-weight:700;color:#1e40af;margin-bottom:12px}
.card-green{border-left-color:#10b981}.card-orange{border-left-color:#f59e0b}.card-purple{border-left-color:#8b5cf6}.card-red{border-left-color:#ef4444}
.card .highlight{background:#fef3c7;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#92400e;border-left:4px solid #f59e0b}
.card .quote{background:#f8fafc;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#64748b;border-left:4px solid #cbd5e1;font-style:italic}
.card .pitfall{background:#fef2f2;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#991b1b;border-left:4px solid #ef4444}
.card .action{background:#eff6ff;padding:12px 16px;border-radius:10px;margin:12px 0;font-size:15px;color:#1e40af;border-left:4px solid #3b82f6}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
th{background:#f1f5f9;padding:10px 14px;text-align:left;font-weight:700;color:#1e40af;border-bottom:2px solid #cbd5e1}
td{padding:10px 14px;border-bottom:1px solid #e2e8f0;color:#475569;vertical-align:top}
.conclusion{background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;border-radius:20px;padding:36px;margin-top:32px}
.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.conclusion ul,.conclusion ol{padding-left:24px;margin:8px 0}
.boundary{background:#faf8f5;padding:20px 24px;border-radius:12px;margin:16px 0;font-size:14px;color:#555;line-height:1.9}</style>
      <div class="container">
    <h1>蒙太奇句式，蒙太奇一学就会！</h1>
    <div class="meta">
      <span class="tag tag-gray">小红书</span>
      <span class="tag tag-blue">时长 48秒</span>
      <span class="tag tag-green">理性分析</span>
    </div>
    <div class="summary-line"><strong>核心命题：</strong>蒙太奇有哪些经典"句式"可以直接套用？学会这些句式模板，让你的视频剪辑立刻有电影感。</div>
    <div class="map"><h2>核心脉络图</h2><div class="diagram"><div class="node"><strong>问题</strong><br/><span style="font-size:13px;display:block;margin-top:6px;white-space:pre-line;color:#475569;font-weight:400">蒙太奇理论听懂了，但拍的时候
还是不知道该用什么句式？</span></div><div class="arrow">→</div><div class="node node-orange"><strong>证据</strong><br/><span style="font-size:13px;display:block;margin-top:6px;white-space:pre-line;color:#475569;font-weight:400">多种经典蒙太奇句式可直接套用
每种句式有特定的画面组合规则</span></div>d<div class="node node-orange"><strong>判断</strong><br/><span style="font-size:13px;display:block;margin-top:6px;white-space:pre-line;color:#475569;font-weight:400">句式=可复用的画面组合模板
熟练掌握后可以自由变体</span></div>i<div class="node node-green"><strong>行动</strong><br/><span style="font-size:13px;display:block;margin-top:6px;white-space:pre-line;color:#475569;font-weight:400">学习经典句式→在项目中套用
→熟练后创造自己的变体</span></div>v</div></div>
    <h2>观点卡片</h2>
    <div class="card"><h3>蒙太奇句式=可复用的画面模板</h3><p>句式就是把蒙太奇理论变成可以复用的具体操作模板。比如「积累句式」=多个相似画面快速切换来建立印象；「对比句式」=两组反差画面交替出现来强化主题。学会了句式，剪辑时就知道下一刀该切什么。</p></div>
<div class="card card-green"><h3>经典蒙太奇句式</h3><p>① <strong>积累句式</strong>：快速切换多个相似画面（如：不同人喝咖啡→建立"都市生活"印象）。<br/>② <strong>对比句式</strong>：贫富/快慢/强弱两组画面交替出现→强化主题反差。<br/>③ <strong>重复句式</strong>：同一类动作在不同场景重复出现→建立节奏和仪式感。<br/>④ <strong>递进句式</strong>：画面从小到大/从远到近/从少到多→增强冲击力。</p><div class="highlight">每个句式都是一套"输入→输出"的规则：给什么样的素材，产生什么样的效果。</div></div>
    <h2>横向对比</h2><table><tr><th>句式名称</th><th>画面组合方式</th><th>产生的效果</th><th>适用场景</th></tr><tr><td>积累句式</td><td>3-6个相似画面快速切换</td><td>建立印象/氛围</td><td>城市速写、情绪铺垫</td></tr><tr><td>对比句式</td><td>两组反差画面交替</td><td>强化主题</td><td>今昔对比、贫富差距</td></tr><tr><td>重复句式</td><td>同一动作不同场景</td><td>仪式感/节奏感</td><td>旅行Vlog、成长记录</td></tr><tr><td>递进句式</td><td>从小到大/从少到多</td><td>冲击力递增</td><td>高潮段落、情绪爆发</td></tr></table>
    <h2>行动清单</h2><ol><li>在日常视频中尝试积累句式：收集 4-6 个相似主题的短片段，快速切换在一起</li><li>做一期对比内容时，刻意用对比句式——两组画面交替出现，强化反差</li><li>记录同一个动作在不同时间/地点的重复（如每天早上喝咖啡），用重复句式剪在一起</li></ol>
    <h2>避坑总结</h2><div class="card card-red"><ul><li>积累句式中画面太多→观众疲劳→一般 4-6 个画面足够</li><li>对比句式对比不够强烈→两组画面差异太小→选素材时就要注意反差</li><li>重复句式节奏不对→切换太快看不懂/太慢没感觉→根据音乐节奏定切换速度</li><li>只用一种句式→风格单一→混合使用 2-3 种句式的效果最好</li></ul></div>
    <h2>方法边界</h2><div class="boundary"><strong>适用</strong>：Vlog、短片创作、情绪内容、MV。每种句式都有其最佳场景。<br/><strong>需注意</strong>：句式是工具不是公式——根据内容灵活调整，不要生搬硬套。<br/><strong>不适用</strong>：单一场景的教程/访谈视频；新闻纪实类内容。</div>
    <div class="conclusion">
    <h2>总结与认知转变</h2>
    <h3>核心要点</h3>
    <ul><li>蒙太奇句式=可复用的画面组合模板</li><li>四大经典句式：积累、对比、重复、递进</li><li>从套用开始→熟练后创造自己的变体</li></ul>
    <h3>行动清单</h3>
    <ol><li>尝试积累句式</li><li>刻意使用对比句式</li><li>记录重复画面</li><li>混合使用2-3种句式</li></ol>
    <h3>认知转变</h3>
    <p>从「我不知道下一刀该切什么」转变为「我知道这个段落该用哪种句式」</p>
  </div>
  </div>
