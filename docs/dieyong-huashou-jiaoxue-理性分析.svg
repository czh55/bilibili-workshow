<div class="container">
  <h1>蝶泳划手教学🦋</h1>
  <div class="meta">
    <span class="tag tag-blue">小红书</span>
    <span class="tag tag-green">16秒</span>
    <span class="tag tag-orange">蝶泳</span>
    <span class="tag tag-purple">划手路径</span>
    <span class="tag tag-gray">画面证据为主</span>
  </div>
  <a class="source-link" href="http://xhslink.cn/o/6alNPNMMIyW">原视频短链 →</a>
  <div class="summary-line">核心判断：蝶泳划手是「钥匙孔闭环」——水下按 <span class="key-data">划手→抱水→推水→小拇指出水</span> 走对称虚线；空中 <span class="key-data">移臂</span> 后以 <span class="key-data">大拇指入水</span> 接下一拍；同时用 <span class="key-data">压胸/提臀</span> 把波浪绑进手部节奏。口播不可辨，证据以俯拍叠字为准。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">流线型双手前伸 + 标题「蝶泳划手教学」——起点姿态</div></div>
    <div class="timeline-item"><div class="timeline-time">00:02</div><div class="timeline-text">白虚线 + 四段标签：划手 / 抱水 / 推水 / 小拇指出水</div></div>
    <div class="timeline-item"><div class="timeline-time">00:03</div><div class="timeline-text">推水收束，小拇指侧出水接恢复</div></div>
    <div class="timeline-item"><div class="timeline-time">00:05</div><div class="timeline-text">对称叠字「大拇指入水」——入水姿态</div></div>
    <div class="timeline-item"><div class="timeline-time">00:06</div><div class="timeline-text">红箭头「压胸」「提臀」——身体波浪同拍</div></div>
    <div class="timeline-item"><div class="timeline-time">00:08</div><div class="timeline-text">路径标签复述，巩固钥匙孔轨迹</div></div>
    <div class="timeline-item"><div class="timeline-time">00:11</div><div class="timeline-text">「移臂」弧线指向再次「大拇指入水」——闭环</div></div>
    <div class="timeline-item"><div class="timeline-time">00:12</div><div class="timeline-text">再次强调压胸 + 提臀，收束身体协同</div></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">问题<br/>蝶泳手怎么划</div>
      <div class="arrow">→</div>
      <div class="node node-green">证据<br/>虚线+黄字路径</div>
      <div class="arrow">→</div>
      <div class="node">判断<br/>钥匙孔闭环</div>
      <div class="arrow">→</div>
      <div class="node node-orange">行动<br/>跟拍复练</div>
    </div>
    <p>问题（怎么连贯划手）→ 画面证据（四段水下标签 + 入水/移臂 + 压胸提臀）→ 判断（对称钥匙孔 + 出入水手姿相反 + 身体同拍）→ 行动（分段跟练再串闭环）。</p>
  </div>

  <div class="correction">
    <h3>常见误解与认知纠偏</h3>
    <p>误解①：蝶泳划手=双手直线前后推。纠偏：俯拍虚线呈先外后内再后推的钥匙孔，不是平行直推。</p>
    <p>误解②：出水/入水都用手掌拍水。纠偏：叠字明确「小拇指出水」「大拇指入水」，手在空中完成旋转。</p>
    <p>误解③：只练手臂、身体不动。纠偏：「压胸/提臀」与划手同框，波浪是推进条件而非装饰。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">水下路径：划手到出水</h2>
    <div class="card">
      <h3>在讲什么</h3>
      <p>用对称白虚线把水下轨迹切成四段：划手启动、抱水抓水、推水加速、小拇指出水。</p>
      <div class="highlight">关键理解：路径先宽（外展抱水）再收（向中线推）再向髋后推，俯拍最能看清「钥匙孔」形状。</div>
      <div class="action">怎么用：干泳或水中慢动作时，让双手轨迹贴合「外→内→后」，而不是贴着身体两侧直推。</div>
      <div class="quote">原文依据：[00:02][00:08] 画面叠字「划手」「抱水」「推水」「小拇指出水」与虚线对齐。</div>
      <div class="relation">关系：抱水决定抓水质量，推水决定推进，小拇指出水决定能否干净进入移臂。</div>
    </div>
    <div class="card card-purple">
      <h3>UP 主呈现方式（画面立场）</h3>
      <p>作者用俯拍教学图而不是侧视角度尺；证据强度高在「路径形状」，低在「具体肘角度数」——本片未标 45°/90° 数值。</p>
      <div class="insight">推断（基于画面）：重复两遍路径标签，意图是让观众跟拍记忆，而非展示多种错误对照。</div>
      <div class="quote">原文依据：笔记标题「蝶泳划手教学」；[00:02] 与 [00:08] 同套标签复现。</div>
    </div>
    <div class="card card-orange">
      <h3>风险和避坑</h3>
      <div class="pitfall">避坑：看到「抱水」就硬掰成直角肘——本片没有给肘角数字；应先保证虚线形状与对称，再谈肘高。</div>
      <div class="pitfall">避坑：出水时手掌拍水花——与「小拇指出水」标注冲突，易打断移臂节奏。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">入水与恢复：大拇指 / 移臂</h2>
    <div class="card card-green">
      <h3>在讲什么</h3>
      <p>恢复段用「移臂」红弧线把双手送回前方，并以「大拇指入水」作为下一拍起点。</p>
      <div class="highlight">关键理解：出水小拇、入水大拇，说明手腕/前臂在空中完成旋转变向；入水时双手应重新并拢前伸。</div>
      <div class="action">怎么用：陆上挥臂练习时默念「出小拇、进大拇」，检查入水瞬间拇指朝下、手掌微外旋。</div>
      <div class="quote">原文依据：[00:05]「大拇指入水」；[00:11]「移臂」+「大拇指入水」。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">身体协同：压胸与提臀</h2>
    <div class="card">
      <h3>在讲什么</h3>
      <p>在溅水与躯干起伏帧叠加「压胸」「提臀」，把波浪与划手绑在同一时间窗。</p>
      <div class="highlight">关键理解：手部推水/出水时胸下沉、臀上提；不是先划完手再补身体动作。</div>
      <div class="action">怎么用：跟视频同拍做两次：只看手路径一次，再看压胸提臀是否与推水同帧。</div>
      <div class="quote">原文依据：[00:06][00:12] 红箭头「压胸」「提臀」。</div>
      <div class="relation">关系：身体波浪为手提供节奏与深度；丢掉压胸提臀，钥匙孔路径也容易变浅、变短。</div>
    </div>
  </div>

  <div class="card">
    <h3>横向对比：本片路径教学 vs 角度教学</h3>
    <table>
      <thead>
        <tr><th>维度</th><th>本片《蝶泳划手教学》</th><th>角度向短片（如「蝶泳抱水」）</th></tr>
      </thead>
      <tbody>
        <tr><td>主证据</td><td>俯拍虚线 + 阶段黄字</td><td>侧/前视角度尺（如 45°/90°）</td></tr>
        <tr><td>回答的问题</td><td>手怎么走完整闭环</td><td>关键姿态的角度是否到位</td></tr>
        <tr><td>身体信息</td><td>明确压胸/提臀</td><td>多聚焦肩肘手角度</td></tr>
        <tr><td>适用边界</td><td>建立路径记忆与节奏</td><td>校正肘高与入水倾角</td></tr>
        <tr><td>选用条件</td><td>零基础先建立「整条线」</td><td>已会大致划手、要修细节</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card card-orange">
    <h3>方法边界与立场分层</h3>
    <p><strong>可验证事实：</strong>画面出现四段水下标签、大拇指入水、移臂、压胸/提臀；时长约 16 秒；俯拍机位。</p>
    <p><strong>UP 主观点（呈现选择）：</strong>用路径图教学，不给肘角数字，也不做红叉错误对照。</p>
    <p><strong>推断：</strong>复述标签是为强化记忆；「小拇指出水 / 大拇指入水」暗示空中转腕——视频未口头解释力学原因。</p>
    <div class="highlight">适用边界：适合建立蝶泳划手闭环与身体同拍意识；不替代教练对个人肩灵活性、打腿时机与呼吸的现场纠正。反例：肩伤或过度僵硬者勿强行模仿大幅度空中移臂。</div>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>水下路径：划手 → 抱水 → 推水 → 小拇指出水（钥匙孔）</li>
      <li>空中恢复：移臂后大拇指入水，接下一拍</li>
      <li>身体同拍：压胸 + 提臀与推水/出水同步</li>
    </ul>
    <h3>行动清单</h3>
    <ol>
      <li>对着镜子慢做「外展抱水 → 内收推水 → 小拇侧出水」10 次</li>
      <li>陆上移臂练习默念「出小拇、进大拇」，检查入水手姿</li>
      <li>水中跟视频两遍：第一遍只看虚线路径，第二遍对齐压胸提臀</li>
      <li>录一段俯拍或侧拍，对照是否出现明显钥匙孔而非直推</li>
      <li>若肘高不稳，再另找带角度尺的抱水短片做细节校正</li>
    </ol>
    <h3>关键认知转变</h3>
    <p>从「用力往后划」转向「按钥匙孔闭环走形 + 身体波浪同拍」；出入水用手姿切换（小拇/大拇），而不是拍水。</p>
  </div>

  <div class="footer">双轨产物 · 理性分析 · 证据以画面叠字与笔记文案为准 · 口播 [听不清]</div>
</div>

    </div>
  </foreignObject>
</svg>