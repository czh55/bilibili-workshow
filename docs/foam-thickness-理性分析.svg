<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2618" viewBox="0 0 1320 2618">
  <foreignObject x="0" y="0" width="1320" height="2618">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&amp;display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',-apple-system,sans-serif}
.container{width:1240px;padding:40px 40px 60px}
h1{font-size:30px;font-weight:700;color:#1a1a1a;margin-bottom:8px}
.meta{font-size:13px;color:#999;margin-bottom:8px}
.tags{margin-bottom:20px}
.tag{display:inline-block;background:#fdf2f2;color:#c0392b;padding:3px 10px;border-radius:12px;font-size:12px;margin-right:8px}
.summary-line{background:#fff5f5;border-left:4px solid #e74c3c;padding:12px 16px;margin-bottom:28px;font-size:15px;color:#555;line-height:1.7}
h2{font-size:20px;font-weight:600;color:#c0392b;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid #e74c3c;display:inline-block}
.level-card{border:1px solid #f0ece4;border-radius:12px;padding:20px 24px;margin-bottom:20px;display:flex;gap:20px;align-items:flex-start}
.level-badge{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;flex-shrink:0;color:#fff}
.level-info{flex:1}
.level-info h4{font-size:17px;font-weight:600;color:#333;margin-bottom:6px}
.level-info p{font-size:14px;color:#666;line-height:1.8}
.level-good{background:#e8f5e9}
.level-good .level-badge{background:#2e7d32}
.level-good h4{color:#2e7d32}
.level-bad{background:#fff5f5}
.level-bad .level-badge{background:#c0392b}
.level-ok{background:#fff8e1}
.level-ok .level-badge{background:#f9a825;color:#333}
.principle{background:#faf8f5;padding:20px 24px;border-radius:12px;margin:20px 0;font-size:14px;line-height:1.9}
.principle strong{color:#c0392b}
.step{display:flex;margin-bottom:16px;align-items:flex-start}
.step-num{width:32px;height:32px;border-radius:50%;background:#e74c3c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;margin-right:14px;margin-top:2px}
.step-content{flex:1;font-size:14px;color:#555;line-height:1.8}
.conclusion{background:linear-gradient(135deg,#fdf2f2,#fff5f5);padding:20px 24px;border-radius:8px;margin-top:28px;font-size:14px;color:#555;line-height:1.8}
.conclusion strong{color:#c0392b}</style>
      <div class="container">
  <h1>奶泡厚度对拉花的影响</h1>
  <div class="meta">
    <span>来源：小红书</span>
    <span>时长：3分16秒</span>
    <span>实验方法：挖奶泡对比</span>
  </div>
  <div class="tags">
    <span class="tag">奶泡厚度</span><span class="tag">拉花</span><span class="tag">对比实验</span><span class="tag">流动性</span><span class="tag">新手教程</span>
  </div>
  <div class="summary-line">
    <strong>一句话总结：</strong>奶泡厚度直接决定拉花成败——太厚结块无纹路，太薄液体晃动图案歪斜。<strong>拿铁厚度（中等）</strong>是黄金平衡点：既有足够奶泡形成清晰纹路，又有控制力保持图案稳定。调节方法很简单：来回倒奶 + 持续摇动。
  </div>

  <h2>四种厚度效果对比</h2>

  <div class="level-card level-bad">
    <div class="level-badge">厚</div>
    <div class="level-info">
      <h4>厚奶泡 → 结块</h4>
      <p>状态：表面像固体，流动性极差<br/>拉花效果：一入水就白掉，白上加白，完全拉不出纹路<br/>原因：奶泡太多→液体太少→流动性极差→奶泡卡在表面</p>
    </div>
  </div>

  <div class="level-card level-good">
    <div class="level-badge">中</div>
    <div class="level-info">
      <h4>拿铁厚度 → 理想</h4>
      <p>状态：奶泡适中，流动性刚好<br/>拉花效果：入水不会太白，摆动后纹路清晰，图案稳定圆润<br/>结论：<strong>这是黄金平衡点，新手的目标厚度</strong></p>
    </div>
  </div>

  <div class="level-card level-ok">
    <div class="level-badge">薄</div>
    <div class="level-info">
      <h4>薄奶泡 → 歪斜</h4>
      <p>状态：液体多，流动性强<br/>拉花效果：纹路更细腻更多，但图案容易歪斜变形<br/>原因：液体带着奶泡到处漂→控制力不足</p>
    </div>
  </div>

  <div class="level-card level-bad">
    <div class="level-badge">极</div>
    <div class="level-info">
      <h4>极薄 → 失控</h4>
      <p>状态：几乎没有泡，几乎全是液体<br/>拉花效果：纹路细密但图案严重扭曲，完全无法控制方向<br/>原因：液体流动性过强→奶泡被冲散→完全失去控制</p>
    </div>
  </div>

  <h2>核心物理原理</h2>
  <div class="principle">
    <strong>泡越少 → 液体越多 → 流动性越强 → 奶泡跟着液体到处漂 → 图案歪斜</strong><br/>
    <strong>泡越多 → 液体越少 → 流动性越差 → 奶泡结块卡住 → 纹路出不来</strong><br/><br/>
    拿铁厚度恰好位于这两条衰减曲线的<strong>交点</strong>——既有足够的泡让纹路显现，又有足够的控制力让图案稳定。这是一个经典的<strong>倒U型曲线</strong>关系：太少不好，太多也不好。
  </div>

  <h2>调节奶泡厚度的实操方法</h2>
  <div class="step"><div class="step-num">1</div><div class="step-content"><strong>检测流动性：</strong>用勺子舀起奶泡倒回去，看下落是否流畅。如果奶泡卡在勺子上不流动，说明太厚。</div></div>
  <div class="step"><div class="step-num">2</div><div class="step-content"><strong>来回倒奶：</strong>在两个杯子之间反复倒，每次倒的动作都能帮助奶泡和液体重新混合。倒3-4次即可看到明显改善。</div></div>
  <div class="step"><div class="step-num">3</div><div class="step-content"><strong>持续摇动：</strong>在准备拉花的过程中保持摇动奶缸，维持奶泡的均匀分布和流动性。边撒粉边摇。</div></div>
  <div class="step"><div class="step-num">4</div><div class="step-content"><strong>应急挖掉：</strong>如果以上方法还不够，直接用勺子挖掉2勺表面的厚奶泡，基本能恢复理想厚度。</div></div>

  <div class="conclusion">
    <strong>练功方向：</strong>厚奶泡是新手最常见的错误——直接打完就倒进杯子里拉花，根本没想到要先调厚度。养成习惯：<strong>拉花前先摇奶缸、先倒一倒</strong>，感受奶泡的流动性。只有流动性对了，后续的摆动、手腕、图案才有基础。另外，奶泡越新越好拉花，旧奶泡品质会随时间下降，所以打完尽快用。
  </div>
</div>
    </div>
  </foreignObject>
</svg>