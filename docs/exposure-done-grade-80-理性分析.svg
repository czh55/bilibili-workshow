      <div class="container root-wrap">
  <h1>只要做对了曝光，你的调色就完成了80%</h1>
  <div class="meta"><span class="tag tag-blue">达芬奇</span><span class="tag tag-green">曝光</span><span class="tag tag-orange">还原</span><span class="tag tag-purple">遮罩</span><span class="tag tag-red">HDR色轮</span><span class="tag tag-gray">时长 7分58秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/AKVJN3t1xvy">原视频</a>
  <div class="summary-line">调色八成是曝光：先还原到「该有的亮度」，再用大范围遮罩重塑分区（提主体、压抢戏），用 HDR 色轮在高光/暗部内部拉开层次。小遮罩硬提人物易留痕迹；曝光舒服后，一级轮冷暖只是风格加成。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">立题：舒服＝曝光合适；还原后质感往往已到位</span></div><div class="timeline-item"><span class="timeline-time">00:31</span><span class="timeline-text">小遮罩痕迹重 → 下半部大遮罩提亮 + 并行压暗近处</span></div><div class="timeline-item"><span class="timeline-time">01:58</span><span class="timeline-text">中间小窗只能提亮不能压暗；并行节点更自然</span></div><div class="timeline-item"><span class="timeline-time">02:43</span><span class="timeline-text">波形未过曝仍刺眼：压 Light、抬 Highlight 展高光层次</span></div><div class="timeline-item"><span class="timeline-time">04:19</span><span class="timeline-text">普通素材：Dark/Shadow + Highlight/Specular 同理</span></div><div class="timeline-item"><span class="timeline-time">06:42</span><span class="timeline-text">曝光到位后再做晴天百搭冷暖染色</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">目标<br/>曝光合适 ≈ 调色完成 80%</div><span class="arrow">→</span><div class="node-green">步骤<br/>还原 → 大范围分区 → 展层次</div><span class="arrow">→</span><div class="node-orange">忌讳<br/>小遮罩硬提人物</div><span class="arrow">→</span><div class="node-blue">加成<br/>冷暖风格化可选</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「体谅」校正为「提亮」；「制造」校正为「遮罩」；「2D加P/要的加p」校正为「Shift+P / Option+P」；「按角」校正为「暗角」；「阳」校正为「羊」；「过曠」校正为「过曝」；「波星图」校正为「波形图」；「中晖」校正为「中灰」；「现场分享」校正为「知识分享」；「四载邻居」校正为「私信加入」；「达芬吉」校正为「达芬奇」。</p><p>误区：人物不够亮就画小遮罩猛提。视频主张大范围提亮再压抢戏区。</p><p>误区：波形没过曝就等于曝光舒服。高光内部无层次仍会刺眼。</p><p>误区：提亮暗部＝整块暗部整体抬起。应展暗部内部层次（Shadow/Dark 组合）。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card ">
      <h3>核心命题：曝光合适 ≈ 完成 80%</h3>
      <p>阴天牧羊对比说明：舒服代表曝光符合场景该有状态。还原做到位，质感常常已经够用；后面分区与染色都建立在这条主线上。</p>
      <div class="quote">我们要让画面曝光符合它该有的一个情况，这就是还原的重要性</div>
      <div class="relation">可验证：左右对比与还原前后对比为作者演示。</div>
    </div>
    <div class="card card-orange">
      <h3>大遮罩分区，而不是小窗硬提</h3>
      <p>小遮罩提人物痕迹重。给下半部大范围提亮（一级轮高光滑块），再用并行节点压暗近处羊群与地面——重塑视线中心，遮罩痕迹几乎不可见。</p>
      <div class="quote">这样我们就重塑了曝光分区……你看不到任何遮罩的痕迹，因为我们遮罩画的非常大</div>
      <div class="relation">操作口令：先大后压；Shift/Option+P 建并行。</div>
    </div>
    <div class="card card-red">
      <h3>为何中间小窗不够好</h3>
      <p>中间遮罩只能提亮、不能同时压暗近处乱区；并行节点带融合，本质是「主体更亮、其余更暗」。效果可以「没大问题」，但通常不如分区方案。</p>
      <div class="quote">单纯的在中间画一个遮罩给它提亮的这个行为，能提亮但是不能压暗</div>
      <div class="relation">诊断：先问能否压抢戏，再问能否提主体。</div>
    </div>
    <div class="card card-green">
      <h3>HDR：在亮/暗内部拉开层次</h3>
      <p>高光亮成一片：降 Light、抬 Highlight。暗部：Dark 降 + Shadow 抬，提「没那么暗」的部分而非整块抬起。天空有层次则 Highlight 降 + Specular 抬。波形峰值可相近，观感却差很多。</p>
      <div class="quote">右边画面中的亮面，它不只有亮，还有更亮，以及没那么亮的亮</div>
      <div class="relation">先看波形有没有层次可展，再动手。</div>
    </div>
    <div class="card card-purple">
      <h3>曝光后再染色：晴天百搭组合</h3>
      <p>白平衡准且有高光：略降色温，亮部偏暖黄绿，中灰回调，暗部微冷。柔和对比度可加可不加。力度自控；磨皮另期。</p>
      <div class="quote">因为我们曝光做到位了，它就能够完成80%的工作</div>
      <div class="relation">风格是加成，不是先于曝光的主线。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>个人调色演示与经验口令，非达芬奇官方操作手册。</li><li>案例素材光比、肤色与场景特定，参数数值需按自己波形重调。</li><li>「完成 80%」是作者修辞比例，不是可测的客观完成度。</li><li>课程/训练营/素材平台为作者引流信息，实录不展开招生细节。</li></ul><div class="pitfall">人物不够亮就画很小遮罩猛提，留下明显边缘。</div><div class="pitfall">只提亮不压抢戏区域，近景抢走视线。</div><div class="pitfall">看见波形没过曝就停止，不处理高光内部「亮成一片」。</div><div class="pitfall">提亮暗部时把整块暗部整体抬起，导致发灰。</div><div class="pitfall">曝光未稳就先堆风格化染色。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>舒服＝曝光合适；先还原再谈风格</li><li>大范围重塑分区：提主体、压抢戏，并行节点更自然</li><li>HDR 色轮用于在亮/暗内部展开层次</li><li>曝光到位 ≈ 调色八成；冷暖染色是加成</li></ul><h3>行动清单</h3><ol><li>开项目先做还原，左右对比问「哪边更符合场景该有亮度」</li><li>忌小窗硬提：先大遮罩提区域，再并行压抢戏</li><li>高光刺眼：试 Light 降 + Highlight 抬，对着波形看是否拉开</li><li>暗部闷：试 Dark 降 + Shadow 抬，只抬「没那么暗」的部分</li><li>分区舒服后再用一级轮做冷暖；力度宁小勿过</li></ol><h3>关键认知转变</h3><p>以前：想法很多、先画小遮罩堆颜色；现在：先还原与重塑曝光分区，用 HDR 展层次，风格化放在最后。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 7分58秒</div>
</div>
    </div>
  </foreignObject>
</svg>