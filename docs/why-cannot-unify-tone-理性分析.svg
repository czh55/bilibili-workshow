.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>无法统一色调的三招</h1>
  <div class="meta"><span class="tag tag-blue">统一色调</span><span class="tag tag-green">面积比</span><span class="tag tag-orange">光源色</span><span class="tag tag-purple">环境色</span><span class="tag tag-red">共性色</span><span class="tag tag-gray">时长 249秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/2D3TQrKrmnw">原视频</a>
  <div class="summary-line">整体各玩各的，用三招统一：①主导/辅助/点缀约6:3:1或7:2:1；②亮部浸暖光源、暗部融环境冷紫；③固有色加共性倾向。三法可叠，印象派与电影同构。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">各玩各的</span></div><div class="timeline-item"><span class="timeline-time">00:18</span><span class="timeline-text">方法一面积</span></div><div class="timeline-item"><span class="timeline-time">00:35</span><span class="timeline-text">萨金特6:3:1</span></div><div class="timeline-item"><span class="timeline-time">01:15</span><span class="timeline-text">方法二光色</span></div><div class="timeline-item"><span class="timeline-time">02:20</span><span class="timeline-text">莫奈暗部</span></div><div class="timeline-item"><span class="timeline-time">02:35</span><span class="timeline-text">方法三共性</span></div><div class="timeline-item"><span class="timeline-time">03:10</span><span class="timeline-text">综合练习</span></div><div class="timeline-item"><span class="timeline-time">03:50</span><span class="timeline-text">下期预告</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">面积<br/>6:3:1</div><span class="arrow">→</span><div class="node-green">光色<br/>亮暖暗紫</div><span class="arrow">→</span><div class="node-orange">共性<br/>同倾向</div><span class="arrow">→</span><div class="node-blue">叠用<br/>综合</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「双打一／惊染／麦杜／幽暗设计／问证」→「方法一／浸染／麦垛／室内设计／问诊」。</p><p>误区：每块都画准固有色却不管面积与染色。</p><p>误区：只有一种统一法。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>面积占比</h3>
      <p>主导6–7、辅助2–3、点缀1–2。</p>
      <div class="quote">按照6比3比1或者7比2比1</div>
      <div class="relation">先称面积再谈好看。</div>
    </div>
    <div class="card card-orange">
      <h3>光与环境染色</h3>
      <p>亮部暖黄浸染；暗部蓝紫融入。</p>
      <div class="quote">暖黄光线浸染了所有物体的亮部</div>
      <div class="relation">统一靠同一套光。</div>
    </div>
    <div class="card card-red">
      <h3>共性色</h3>
      <p>固有色共泛紫/蓝/棕红。</p>
      <div class="quote">你说他们能不和谐吗</div>
      <div class="relation">倾向比品种重要。</div>
    </div>
    <div class="card card-purple">
      <h3>综合叠用</h3>
      <p>同一幅可同时见面积+光色+共性。</p>
      <div class="quote">来猜猜这幅画都用了哪几种</div>
      <div class="relation">识别可训练。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>下期还有</p>
      <div class="quote">另三种实战技巧预告。</div>
      <div class="relation">方法成体系。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>本集三招；另三招见下期。</li><li>萨金特比例为课堂约数。</li><li>作业征集非技法。</li></ul><div class="pitfall">点缀色面积过大抢主导。</div><div class="pitfall">暗部不统一冷暖。</div><div class="pitfall">固有色零共性各自为政。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>面积比</li><li>光环境染色</li><li>共性倾向</li></ul><h3>行动清单</h3><ol><li>给作品标6:3:1色块</li><li>亮部统一加一点光源色</li><li>暗部统一加一点环境色</li><li>选一倾向作共性掺入</li></ol><h3>关键认知转变</h3><p>以前：逐个调准固有色；现在：用面积、光色、共性三层统一。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 249秒</div>
</div>
    </div>
  </foreignObject>
</svg>