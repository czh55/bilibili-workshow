<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1728" viewBox="0 0 1320 1728">
  <foreignObject x="0" y="0" width="1320" height="1728">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;600;700&amp;display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans SC',-apple-system,sans-serif}.container{width:1240px;padding:40px 40px 60px}h1{font-size:30px;font-weight:700;color:#1a1a1a;margin-bottom:8px}.meta{font-size:13px;color:#999;margin-bottom:8px}.tags{margin-bottom:20px}.tag{display:inline-block;background:#fdf2f2;color:#c0392b;padding:3px 10px;border-radius:12px;font-size:12px;margin-right:8px}.summary-line{background:#fff5f5;border-left:4px solid #e74c3c;padding:12px 16px;margin-bottom:28px;font-size:15px;color:#555;line-height:1.7}h2{font-size:20px;font-weight:600;color:#c0392b;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid #e74c3c;display:inline-block}.comparison{display:flex;gap:20px;margin:16px 0}.comp-card{flex:1;padding:18px;border-radius:12px;font-size:14px;line-height:1.8}.bad{background:#fff5f5}.bad h4{color:#c0392b}.good{background:#e8f5e9}.good h4{color:#2e7d32}.comp-card h4{font-size:16px;font-weight:600;margin-bottom:8px}.comp-card p{color:#555}.analogy{background:#faf8f5;padding:16px 20px;border-radius:12px;margin:16px 0;font-size:14px;line-height:2}.analogy strong{color:#c0392b}.formula{text-align:center;margin:20px 0;font-size:20px;font-weight:700;color:#c0392b}.conclusion{background:linear-gradient(135deg,#fdf2f2,#fff5f5);padding:20px 24px;border-radius:8px;margin-top:28px;font-size:14px;color:#555;line-height:1.8}.conclusion strong{color:#c0392b}</style>
      <div class="container"><h1>流速不够导致奶泡卡住</h1><div class="meta"><span>来源：小红书</span><span>时长：1分28秒</span><span>类型：流量诊断</span></div><div class="tags"><span class="tag">流量</span><span class="tag">冲击力</span><span class="tag">扩散</span><span class="tag">卡住</span></div><div class="summary-line"><strong>一句话总结：</strong>奶泡卡住摆不动的根本原因是<strong>流量太小、冲击力不够</strong>。加大流量产生冲击波效应把奶泡推出去，再配合摆动实现四面八方扩散。类比：海浪（风大浪大）和爆炸物（炸弹大冲击波大）。</div>
<h2>两种流量对比</h2>
<div class="comparison"><div class="comp-card bad"><h4>❌ 小流量</h4><p>奶泡倒出来太少<br/>冲击力不足<br/>奶泡卡在原地<br/>变一片白色，摆不动</p></div><div class="comp-card good"><h4>✅ 大流量</h4><p>奶泡冲出去后再摆动<br/>冲击力把奶泡推开<br/>不摆也有自然纹路扩散<br/>摆动能扩散到四面八方</p></div></div>
<h2>冲击力类比理解</h2>
<div class="analogy"><strong>海浪类比：</strong>风小→海浪小；风大→海浪更大，冲得更远<br/><strong>爆炸类比：</strong>炸弹小→冲击波小；炸弹大→冲击波大<br/><strong>拉花类比：</strong>流量小→冲击力小→波纹小→卡住；流量大→冲击力大→波纹大→扩散远</div>
<h2>扩散公式</h2>
<div class="formula">流量↑ → 冲击力↑ → 扩散范围↑ → 纹路传播↑</div>
<div style="background:#faf8f5;padding:14px 18px;border-radius:10px;font-size:14px;color:#555;line-height:1.9;margin:12px 0"><strong>关键动作链：</strong>加大流量（产生冲击力的前提）→ 奶泡被推出去 → 再配合摆动（左右引导）→ 纹路向四面八方扩散。</div>
<div class="conclusion"><strong>练功方向：</strong>下次发现奶泡卡住摆不动时，第一反应不是加大摆动幅度，而是<strong>先加大流量</strong>。冲击力是拉花扩散的基础，没有足够流量就没有足够的推力。流量到位了，摆动才有意义。</div></div>
    </div>
  </foreignObject>
</svg>