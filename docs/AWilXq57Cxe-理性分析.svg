olor:#fff;border-radius:20px;padding:36px;margin-top:32px}.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}</style><div class="container">
<h1>谁说剪刀手不能出片❓四个公式去土味儿✌️</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">摄影技巧</span> <span class="tag tag-gray">55秒</span></div>
<div class="summary-line">假如普通人用普通的剪刀手拍照回太普通的话那就是把手举高歪头挡嘴加交叉腿两只手的话就往前放微对微靠一下再斜着放一遍腿先内拔再勾个脚大腿记得要分开就这样坐着呢把腿盘起来另一条腿跨过去剪刀手就放下吧就好撑手再歪个头拍能坐在地上拍但不是这么拍而是一条腿放下面另一条腿靠过去把手搭在腿上再弯个腰搞定先学四个吧战...</div>
<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">假如普通人用普通的剪刀手拍照</span></div>
<div class="timeline-item"><span class="timeline-time">[00:02]</span><span class="timeline-text">回太普通的话</span></div>
<div class="timeline-item"><span class="timeline-time">[00:03]</span><span class="timeline-text">那就是把手举高</span></div>
<div class="timeline-item"><span class="timeline-time">[00:05]</span><span class="timeline-text">歪头</span></div>
<div class="timeline-item"><span class="timeline-time">[00:06]</span><span class="timeline-text">挡嘴</span></div>
<div class="timeline-item"><span class="timeline-time">[00:07]</span><span class="timeline-text">加交叉腿</span></div>
<div class="timeline-item"><span class="timeline-time">[00:10]</span><span class="timeline-text">两只手的话</span></div>
<div class="timeline-item"><span class="timeline-time">[00:11]</span><span class="timeline-text">就往前放</span></div>
<div class="timeline-item"><span class="timeline-time">[00:12]</span><span class="timeline-text">微对微靠一下</span></div>
<div class="timeline-item"><span class="timeline-time">[00:13]</span><span class="timeline-text">再斜着放一遍</span></div>
<div class="timeline-item"><span class="timeline-time">[00:15]</span><span class="timeline-text">腿先内拔</span></div>
<div class="timeline-item"><span class="timeline-time">[00:17]</span><span class="timeline-text">再勾个脚</span></div>
<div class="timeline-item"><span class="timeline-time">[00:18]</span><span class="timeline-text">大腿记得要分开</span></div>
<div class="timeline-item"><span class="timeline-time">[00:20]</span><span class="timeline-text">就这样</span></div>
<div class="timeline-item"><span class="timeline-time">[00:22]</span><span class="timeline-text">坐着呢</span></div>
<div class="timeline-item"><span class="timeline-time">[00:24]</span><span class="timeline-text">把腿盘起来</span></div>
<div class="timeline-item"><span class="timeline-time">[00:25]</span><span class="timeline-text">另一条腿跨过去</span></div>
<div class="timeline-item"><span class="timeline-time">[00:27]</span><span class="timeline-text">剪刀手就放下吧就好</span></div>
<div class="timeline-item"><span class="timeline-time">[00:30]</span><span class="timeline-text">撑手</span></div>
<div class="timeline-item"><span class="timeline-time">[00:31]</span><span class="timeline-text">再歪个头</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>假如普通人用普通的剪刀手拍照</li>
<li>回太普通的话</li>
<li>那就是把手举高</li>
<li>加交叉腿</li>
<li>两只手的话</li>
<li>就往前放</li>
<li>微对微靠一下</li>
<li>再斜着放一遍</li>
<li>腿先内拔</li>
<li>再勾个脚</li>
<li>大腿记得要分开</li>
<li>把腿盘起来</li>
<li>另一条腿跨过去</li>
<li>剪刀手就放下吧就好</li>
<li>再歪个头</li>
<li>拍能坐在地上拍</li>
<li>但不是这么拍</li>
<li>而是一条腿放下面</li>
<li>另一条腿靠过去</li>
<li>把手搭在腿上</li>
<li>再弯个腰</li>
<li>先学四个吧</li>
<li>战争多了</li>
<li>你也记不住</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>假如普通人用普通的剪刀手拍照回太普通的话那就是把手举高歪头挡嘴加交叉腿两只手的话就往前放微对微靠一下再斜着放一遍腿先内拔再勾个脚大腿记得要分开就这样坐着呢把腿盘起来另一条腿跨过去剪刀手就放下吧就好撑手再歪个头拍能坐在地上拍但不是这么拍而是一条腿放下面另一条腿靠过去把手搭在腿上再弯个腰搞定先学四个吧战争多了你也记不住</p><p>转录分段: 30 | 时长: 55秒</p></div>
