.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>色彩节奏2：繁与简</h1>
  <div class="meta"><span class="tag tag-blue">色彩节奏</span><span class="tag tag-green">繁简</span><span class="tag tag-orange">克里姆特</span><span class="tag tag-purple">金箔</span><span class="tag tag-red">感受力</span><span class="tag tag-gray">时长 209秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/9jmcCvFNYCb">原视频</a>
  <div class="summary-line">克里姆特用繁（脸／金箔线）与简（躯干整块）交替如强弱音符；另一幅左右上下同样跳动。画不下去时先找回对物象的强烈感受。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:08</span><span class="timeline-text">进入克里姆特</span></div><div class="timeline-item"><span class="timeline-time">00:42</span><span class="timeline-text">脸繁身简</span></div><div class="timeline-item"><span class="timeline-time">01:05</span><span class="timeline-text">繁简贯穿</span></div><div class="timeline-item"><span class="timeline-time">01:16</span><span class="timeline-text">背景金箔线＝繁</span></div><div class="timeline-item"><span class="timeline-time">01:30</span><span class="timeline-text">强弱音符</span></div><div class="timeline-item"><span class="timeline-time">01:50</span><span class="timeline-text">另一幅扫节奏</span></div><div class="timeline-item"><span class="timeline-time">02:21</span><span class="timeline-text">没有感觉何来表达</span></div><div class="timeline-item"><span class="timeline-time">02:33</span><span class="timeline-text">走进自然取感受</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">繁<br/>多变细节</div><span class="arrow">→</span><div class="node-green">简<br/>整块安静</div><span class="arrow">→</span><div class="node-orange">交替<br/>如音符</div><span class="arrow">→</span><div class="node-blue">前提<br/>先有感受</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「科里姆特／简越／古蓝色／繁语简」→「克里姆特／简约／钴蓝色／繁与简」。</p><p>误区：节奏＝色相乱跳。繁简密度也是节奏。</p><p>误区：卡住还硬画。视频主张先恢复感受。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>脸繁身简</h3>
      <p>面部头发复杂，躯干对比弱细节少。</p>
      <div class="quote">这种色彩繁与简的对比贯穿着整个画面</div>
      <div class="relation">密度对比制造呼吸。</div>
    </div>
    <div class="card card-orange">
      <h3>金箔线为繁</h3>
      <p>暗蓝紫、金箔、高纯钴蓝线把背景推到繁。</p>
      <div class="quote">这叫做繁</div>
      <div class="relation">繁可以是材料与线条，不单是物象多。</div>
    </div>
    <div class="card card-red">
      <h3>扫描验证</h3>
      <p>另一幅左右、上下简繁交替可被喊出来。</p>
      <div class="quote">能不能get到这种节奏感</div>
      <div class="relation">节奏应可被路径朗读。</div>
    </div>
    <div class="card card-purple">
      <h3>感受前提</h3>
      <p>无最初强烈感受则无表达；向日常取感。</p>
      <div class="quote">没有感觉何来表达</div>
      <div class="relation">技巧服务感受，不替代感受。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>繁简如强弱音符</p>
      <div class="quote">赋予画面节奏的美感</div>
      <div class="relation">上期方法之外的第三条路</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>209 秒续集，默认已知上期两种节奏法。</li><li>具体作品名口播未逐一钉死。</li><li>课宣非训练步骤。</li></ul><div class="pitfall">全画同等繁密，无休息区。</div><div class="pitfall">全画同等简，节奏死寂。</div><div class="pitfall">情绪空洞时堆技法。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>繁简交替</li><li>可扫描验证</li><li>感受先于技法</li></ul><h3>行动清单</h3><ol><li>在稿上用「繁／简」两色标记区域</li><li>强制安排至少两处简区作呼吸</li><li>卡住时出门记三条最强感受再画</li><li>禁止全程平均细节密度</li></ol><h3>关键认知转变</h3><p>以前：到处加点线怕空；现在：让繁与简轮流上场，节奏自己出现。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 209秒</div>
</div>
    </div>
  </foreignObject>
</svg>