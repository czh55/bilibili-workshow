.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>头部动态的2线1点</h1>
  <div class="meta"><span class="tag tag-blue">头部动态</span><span class="tag tag-green">面中线</span><span class="tag tag-orange">眉弓线</span><span class="tag tag-purple">三庭</span><span class="tag tag-red">仰视</span><span class="tag tag-gray">时长 161秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/AD1u7aAV7Dy">原视频</a>
  <div class="summary-line">用面中线定斜度、眉弓线连眉梢到耳得正侧面、眉梢点钉扭转；立方体一眼见仰视，三庭下长上短。五官按近大远小微调后再细化。口令：斜度、扭转、仰角三把斧。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">两根线一个点</span></div><div class="timeline-item"><span class="timeline-time">00:06</span><span class="timeline-text">面中线定斜度</span></div><div class="timeline-item"><span class="timeline-time">00:11</span><span class="timeline-text">眉弓线连耳</span></div><div class="timeline-item"><span class="timeline-time">00:25</span><span class="timeline-text">立方体见仰视</span></div><div class="timeline-item"><span class="timeline-time">00:28</span><span class="timeline-text">仰视三庭不等分</span></div><div class="timeline-item"><span class="timeline-time">00:44</span><span class="timeline-text">五官透视位移</span></div><div class="timeline-item"><span class="timeline-time">01:10</span><span class="timeline-text">细化定眼宽</span></div><div class="timeline-item"><span class="timeline-time">02:18</span><span class="timeline-text">回顾三把斧</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">面中线<br/>斜度</div><span class="arrow">→</span><div class="node-green">眉梢点<br/>扭转</div><span class="arrow">→</span><div class="node-orange">眉弓→耳<br/>仰角</div><span class="arrow">→</span><div class="node-blue">三庭<br/>下长上短</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「仰式／口列线／镍骨缘／头近坚／正面壁」→「仰视／口裂线／颧骨缘／头颈肩／正侧面」。</p><p>误区：先抠五官细节再找头动态。视频强调先2线1点锁框架。</p><p>误区：仰视仍等分三庭。应下庭长、上庭短。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>2线1点</h3>
      <p>面中线＝斜度；眉弓线得正侧面；眉梢点＝扭转。</p>
      <div class="quote">关键在于两根线和一个点</div>
      <div class="relation">动态先于细节。</div>
    </div>
    <div class="card card-orange">
      <h3>仰视立方体</h3>
      <p>补全立方体可见仰视；三庭不等分；颈用圆柱。</p>
      <div class="quote">很明显的可以看出这是一个仰式的角度</div>
      <div class="relation">框架决定五官落点。</div>
    </div>
    <div class="card card-red">
      <h3>五官透视</h3>
      <p>耳线右移、眼线略下、口裂约下庭1/3；再细化宽窄。</p>
      <div class="quote">因为近大远小的透视</div>
      <div class="relation">位移服务近大远小。</div>
    </div>
    <div class="card card-purple">
      <h3>三把斧回顾</h3>
      <p>斜度／扭转／仰角三句钉死头部动态。</p>
      <div class="quote">这三把斧就可以牢牢地抓住头部的动态</div>
      <div class="relation">检查清单可复用。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>示范可跟练</p>
      <div class="quote">素材放评论区，按框架练起来。</div>
      <div class="relation">先框架后细化。</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>161秒示范短片，非完整头像课。</li><li>「仰式」统一为仰视。</li><li>发箍等细节属细化层。</li></ul><div class="pitfall">跳过立方体直接画五官。</div><div class="pitfall">仰视仍把三庭画等分。</div><div class="pitfall">忽略眉梢点导致扭转丢失。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>2线1点锁动态</li><li>仰视三庭不等分</li><li>三把斧自检</li></ul><h3>行动清单</h3><ol><li>在参考上只画面中线+眉弓线+眉梢点</li><li>画立方体判断俯仰</li><li>五官线按近大远小微移后再细化</li><li>完成后用三把斧口述自检</li></ol><h3>关键认知转变</h3><p>以前：先抠眼睛鼻子；现在：先用两线一点和立方体锁死头部动态。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 161秒</div>
</div>
    </div>
  </foreignObject>
</svg>