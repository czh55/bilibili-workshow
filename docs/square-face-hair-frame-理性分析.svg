<div class="svg-page">
<div class="container">
  <h1>方圆脸快来变美，复制明星同款头包脸。</h1>
  <div class="meta">
    <span class="tag tag-orange">小红书</span>
    <span class="tag tag-blue">发型造型</span>
    <span class="tag tag-green">方圆脸</span>
    <span class="tag tag-purple">头包脸</span>
    <span class="tag tag-gray">4分13秒</span>
    <span class="tag tag-red">分析视角</span>
  </div>
  <a class="source-link" href="http://xhslink.cn/o/7wYzTmmHlhQ">原视频链接</a>
  <div class="summary-line">核心判断：方圆脸「显脸大」往往不是脸本身，而是颅顶低、颞区/后脑扁导致的「脸包头」；用窄版夹板按「该烫/不烫」分区垫发根，侧区出耳后扩弧、后脑加厚、颅顶只烫两指宽，才能做成披发扎发都站得住的头包脸。</div>

  <div class="timeline">
    <h3>关键证据时间轴</h3>
    <div class="timeline-item"><div class="timeline-time">00:00</div><div class="timeline-text">提出方圆脸困扰，目标复刻明星同款头包脸，披发/扎发都好看。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:20</div><div class="timeline-text">对照脸包头（颅顶低、贴头皮、无厚度）与头包脸（正侧面轮廓圆润饱满）。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:46</div><div class="timeline-text">工具约束：选窄版网格纹夹板，不要特别宽的款。</div></div>
    <div class="timeline-item"><div class="timeline-time">00:55</div><div class="timeline-text">分区禁区：头顶两骨、天灵盖到耳尖线、枕骨扁区不烫；侧区才是主战场。</div></div>
    <div class="timeline-item"><div class="timeline-time">01:52</div><div class="timeline-text">侧区正确角度：发片垂直头皮、贴发根停留、夹板往前往上顶；耳后扩弧立起来显脸小。</div></div>
    <div class="timeline-item"><div class="timeline-time">02:38</div><div class="timeline-text">后脑留一指宽不烫，其余分片垫厚；油头/湿发影响效果。</div></div>
    <div class="timeline-item"><div class="timeline-time">03:00</div><div class="timeline-text">颅顶只烫两指宽、分两次提拉夹烫；空洞补夹、过高沾水压平。</div></div>
    <div class="timeline-item"><div class="timeline-time">03:42</div><div class="timeline-text">收尾往后撩、露耳、必要时上推顶发，完成问号形轮廓。</div></div>
  </div>

  <div class="map">
    <h2>核心脉络</h2>
    <div class="diagram">
      <div class="node">问题<br/>脸包头显大</div>
      <div class="arrow">→</div>
      <div class="node node-orange">证据<br/>分区+角度</div>
      <div class="arrow">→</div>
      <div class="node">判断<br/>垫根塑廓</div>
      <div class="arrow">→</div>
      <div class="node node-green">行动<br/>侧后顶三区</div>
    </div>
    <p>不是「把头发全部烫蓬」，而是用禁区保护头型、用侧区/后脑/颅顶三处补厚度，把脸缘重新「包」进发量里。</p>
  </div>

  <div class="correction">
    <h3>常见误解与认知纠偏</h3>
    <p><strong>误解：</strong>头包脸=把所有头发烫得又高又厚。</p>
    <p><strong>纠偏：</strong>视频明确多处「绝对不能烫」。头顶两骨、天灵盖区、枕骨扁区乱烫会把头烫厚、方脑袋立体感更重；目标轮廓是「问号」弧线，不是半球。</p>
    <p><strong>误解：</strong>分区对了就一定蓬。</p>
    <p><strong>纠偏：</strong>角度错了（水平贴头皮夹）仍然扁平。必须垂直拎发片、贴发根、往前往上顶，并冷却定型。</p>
  </div>

  <div class="section">
    <h2 class="sec-title">概念层：脸包头 vs 头包脸</h2>
    <div class="card">
      <h3>在讲什么</h3>
      <p>用观感指标区分两种轮廓：脸是否比发量大，正侧面是否圆润饱满。</p>
      <div class="highlight">理解：方圆脸痛点常被表述为「脸大」，证据链却指向「头发没有厚度」——颅顶低、贴头皮、颞区/后脑扁。</div>
      <div class="action">怎么用：先照镜子看正侧面发量是否包住脸缘，再决定做不做垫根，而不是先选刘海款式。</div>
      <div class="quote">原文依据（约 00:25–00:38）：「颅顶低、贴头皮……看起来脸的面积都比头发多」；「整个的轮廓都是圆润饱满的。」（叙述据字幕校正「颅顶/披发/扎发」）</div>
      <div class="relation">关系：诊断先于手法——分不清这两种轮廓，后面分区会失去目标。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">工具与分区规则</h2>
    <div class="card card-green">
      <h3>在讲什么</h3>
      <p>窄版网格纹夹板 + 「该烫/不烫」分区图。</p>
      <div class="highlight">理解：宽板不好控局部垫根；禁区是为了保留头型凹凸，避免烫成厚方块。</div>
      <div class="action">怎么用：选窄版；摸出头顶两骨与耳尖上中线，把天灵盖区扎起；枕骨最扁一块约手掌大不烫；侧区留作主烫区。</div>
      <div class="quote">原文依据（约 00:46–01:27）：字幕「选窄版」；「这两个骨头……绝对不能烫」；「像问号一样才好看。」</div>
      <div class="pitfall">风险：禁区也烫 → 头显厚、方脑袋立体感加重（UP 主立场与演示推断）。</div>
    </div>
    <div class="card card-purple">
      <h3><span class="speaker speaker-host">UP 主观点</span>角度比分区更决定成败</h3>
      <p>分区正确仍可能「扁平/贴头皮」，因为夹烫角度错了。</p>
      <div class="highlight">理解：正确示范是发片垂直头皮、夹板贴发根停留 5–10 秒，再往前往上顶。</div>
      <div class="action">怎么用：先拎起再夹；侧发约两片；烫到耳廓附近结束；务必冷却后再放下。</div>
      <div class="quote">原文依据（约 01:44–02:10）：「角度很重要」；字幕「把你的发片拿起来」「这个夹板呢往前往上顶」。</div>
      <div class="relation">立场分层：垂直提拉与冷却定型为可观察操作事实；「耳后立起来显脸小」为造型观点，个体脸型差异可能改变观感强度。</div>
    </div>
  </div>

  <div class="section">
    <h2 class="sec-title">三区执行：侧区 · 后脑 · 颅顶</h2>
    <div class="card">
      <h3>侧区与耳后扩弧</h3>
      <p>侧区负责面部线条流畅；耳后扩弧是「显脸小」的关键局部。</p>
      <div class="action">操作：耳后可多停留；一动两下即可；对比左右冷却后的轮廓。</div>
      <div class="quote">原文依据（约 02:18–02:37）：字幕「你的耳后扩弧」；「就会显得脸小」；「冷却完之后它才能定型」。</div>
    </div>
    <div class="card card-orange">
      <h3>后脑加厚</h3>
      <p>先留一指宽不烫，再对扁平处分片加压；越平越用力、停留越长。</p>
      <div class="pitfall">避坑：油头或湿发会影响烫发效果（画面黄字明示）。</div>
      <div class="quote">原文依据（约 02:38–02:56）：「一指宽一片不烫」；「后脑勺就是烫了三片」；叠字「油头或者湿发都会影响烫发效果」。</div>
    </div>
    <div class="card card-red">
      <h3>颅顶两指宽</h3>
      <p>关键但克制：不能全烫；中分/偏分都只取两指宽，分两次提拉夹烫。</p>
      <div class="action">空洞补夹；过高/太翘则手沾水轻压；最后往后撩、露耳、必要时上推顶发。</div>
      <div class="quote">原文依据（约 03:00–03:52）：字幕「就是颅顶」「提拉起来」；「两个指头的宽度」；「往后一撩……把耳朵露出来」。</div>
    </div>
  </div>

  <div class="card">
    <h3>横向对比：脸包头做法 vs 头包脸做法</h3>
    <table>
      <thead>
        <tr>
          <th>维度</th>
          <th>脸包头（反例）</th>
          <th>头包脸（目标）</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>颅顶</td>
          <td>低、贴头皮；或乱烫变厚方</td>
          <td>只烫两指宽，提拉出高度</td>
        </tr>
        <tr>
          <td>侧轮廓</td>
          <td>发片贴头夹，耳后塌</td>
          <td>垂直提拉 + 耳后扩弧立起</td>
        </tr>
        <tr>
          <td>后脑</td>
          <td>扁、无厚度</td>
          <td>留一指禁区后分片垫厚</td>
        </tr>
        <tr>
          <td>工具</td>
          <td>过宽夹板难控局部</td>
          <td>窄版网格纹夹板</td>
        </tr>
        <tr>
          <td>观感指标</td>
          <td>脸面积 &gt; 发量</td>
          <td>正侧面圆润饱满，披发扎发都成立</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="card card-orange">
    <h3>方法边界与适用条件</h3>
    <ul>
      <li><strong>适用：</strong>细软塌、扁头、方圆脸希望增加发量包脸缘者；有垫发根/玉米须类窄板工具。</li>
      <li><strong>前提：</strong>头发相对干爽清洁；湿发或油头会削弱定型（视频明示）。</li>
      <li><strong>上限：</strong>不能改变骨相；显脸小主要来自轮廓光影与发量比例，非医学瘦脸。</li>
      <li><strong>反例：</strong>禁区乱烫、水平贴头夹、不冷却就放下——分区对了也会失败。</li>
      <li><strong>例外：</strong>短发量极少、严重损伤发质者，强行多次高温夹烫可能得不偿失（基于常见护发常识的补充资料，非视频原文）。</li>
    </ul>
  </div>

  <div class="conclusion">
    <h2>总结与行动</h2>
    <h3>核心要点</h3>
    <ul>
      <li>先诊断脸包头：颅顶低、贴头皮、颞后脑扁 → 脸面积看起来大于发量。</li>
      <li>工具选窄版；禁区（顶骨、天灵盖、枕骨扁区）不烫，保问号弧线。</li>
      <li>侧区垂直提拉 + 耳后扩弧；后脑分片加厚；颅顶只烫两指宽。</li>
      <li>冷却定型、补空洞、压过高；收尾露耳，让面部线条流畅。</li>
    </ul>
    <h3>行动清单</h3>
    <ol>
      <li>准备窄版网格纹夹板，头发干爽后再做。</li>
      <li>摸出顶骨与耳尖上中线，扎起不烫区；标出枕骨扁区。</li>
      <li>侧区两片：垂直拎起 → 贴根停留 → 往前往上顶 → 冷却。</li>
      <li>后脑留一指宽，其余 2–3 片加压垫厚。</li>
      <li>颅顶两指宽分两次提拉；修整后往后撩并露耳检查正侧面。</li>
    </ol>
    <h3>关键认知转变</h3>
    <p>从「换个刘海/烫个卷就显脸小」转向「用分区垫根重建头身发量比例」；头包脸是可复现的轮廓工程，不是玄学审美词。</p>
  </div>

  <div class="footer">理性分析 · 基于 Whisper 转录与可见字幕校正 · 事实/观点/推断已分层</div>
</div>
</div>

    </div>
  </foreignObject>
</svg>