.conclusion h2{font-size:26px;font-weight:800;margin-top:0;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}
.conclusion h3{font-size:18px;font-weight:700;color:rgba(255,255,255,.9);margin:20px 0 10px}
.conclusion p,.conclusion li{color:rgba(255,255,255,.9);font-size:15px}
.footer{text-align:center;color:#94a3b8;font-size:13px;padding:32px 0 16px}
.source-link{color:#3b82f6;font-size:14px;text-decoration:none;margin-bottom:24px;display:inline-block}
.key-data{display:inline-block;background:#1e40af;color:#fff;padding:2px 8px;border-radius:4px;font-size:13px;font-weight:700;margin-right:4px}
.root-wrap{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f8fafc,#e2e8f0);padding:48px 60px;color:#1e293b}</style>
      <div class="container root-wrap">
  <h1>表现远景：对比强度递减</h1>
  <div class="meta"><span class="tag tag-blue">远景</span><span class="tag tag-green">梵高</span><span class="tag tag-orange">冷暖</span><span class="tag tag-purple">明度</span><span class="tag tag-red">递减</span><span class="tag tag-gray">时长 176秒</span><span class="tag tag-gray">理性分析</span></div>
  <a class="source-link" href="https://xhslink.cn/o/41woLRwfJ82">原视频</a>
  <div class="summary-line">梵高两线：山／麦田树用冷暖+明度定空间基调；山／天用明度延纵深。对比强度递减则远山可饱和仍退远。遵循晴天远山可清晰的事实；莫奈远高纯近阴影低纯亦然。远景要有形有相，勿糊成含糊。</div>

  <div class="timeline"><h3>关键证据时间轴</h3><div class="timeline-item"><span class="timeline-time">00:00</span><span class="timeline-text">远山实蓝仍有空间？</span></div><div class="timeline-item"><span class="timeline-time">00:15</span><span class="timeline-text">梵高柏树麦田</span></div><div class="timeline-item"><span class="timeline-time">00:26</span><span class="timeline-text">一号线冷暖+明度</span></div><div class="timeline-item"><span class="timeline-time">00:49</span><span class="timeline-text">二号线明度分层</span></div><div class="timeline-item"><span class="timeline-time">01:14</span><span class="timeline-text">强度递减规律</span></div><div class="timeline-item"><span class="timeline-time">01:25</span><span class="timeline-text">柯罗同理</span></div><div class="timeline-item"><span class="timeline-time">01:32</span><span class="timeline-text">勿强行糊色彩</span></div><div class="timeline-item"><span class="timeline-time">02:05</span><span class="timeline-text">莫奈客观远近纯</span></div><div class="timeline-item"><span class="timeline-time">02:25</span><span class="timeline-text">远景有形有相</span></div></div>

  <div class="map"><h2>核心脉络</h2><div class="diagram"><div class="node">一号线<br/>冷暖定基调</div><span class="arrow">→</span><div class="node-green">二号线<br/>明度延纵深</div><span class="arrow">→</span><div class="node-orange">规律<br/>强度递减</div><span class="arrow">→</span><div class="node-blue">底线<br/>远景有形相</div></div></div>

  <div class="correction"><h3>常见误解与认知纠偏</h3><p>ASR「樊高／圆景／莫冷凉渴」→「梵高／远景／模糊含糊」。</p><p>误区：远景＝降饱和+抹细节。视频反对。</p><p>误区：忽略客观光影（阴影近景可更灰）。</p></div>

  <div class="section"><h2 class="sec-title">观点拆解：在讲什么 → 关键理解 → 怎么用 → 原文依据</h2>
    <div class="card card-green">
      <h3>一号线</h3>
      <p>山与麦田树轮廓分割冷暖并加强明度对比。</p>
      <div class="quote">由此确立了画面基本的空间秩序</div>
      <div class="relation">大空间先靠冷暖分界。</div>
    </div>
    <div class="card card-orange">
      <h3>二号线</h3>
      <p>同冷系山与天只靠明度拉开层次。</p>
      <div class="quote">通过明度对比拉开纵向层次</div>
      <div class="relation">同色温层用明度继续推远。</div>
    </div>
    <div class="card card-red">
      <h3>递减规律</h3>
      <p>远山可很饱和，只要对比强度递减仍退远。</p>
      <div class="quote">仍能稳定的处于视觉远处</div>
      <div class="relation">饱和≠前进，对比强度才关键。</div>
    </div>
    <div class="card card-purple">
      <h3>遵循事实</h3>
      <p>晴天远山本可清晰；莫奈远树高纯近草阴影低纯。</p>
      <div class="quote">像她一样大胆地画出来吧</div>
      <div class="relation">空间服务真实光色，不服务教条。</div>
    </div>
    <div class="card ">
      <h3></h3>
      <p>远景要具体形状与明确色相</p>
      <div class="quote">合理利用对比强度递减规律就是画好远景的最好办法</div>
      <div class="relation">不要莫名其妙糊掉</div>
    </div></div>

  

  <div class="section"><h2 class="sec-title">方法边界与避坑</h2><div class="card card-red"><h3>适用边界</h3><ul><li>176 秒风景空间短论。</li><li>洛佩兹等例点到为止。</li><li>系统课详解另述。</li></ul><div class="pitfall">为「有空间」把远景一律涂脏灰。</div><div class="pitfall">一二号线对比同样强，层次打架。</div><div class="pitfall">忽略近景阴影导致近灰远远艳的客观可能。</div></div></div>

  <div class="conclusion"><h2>总结与行动</h2><h3>核心要点</h3><ul><li>分界线定层次</li><li>强度递减推远</li><li>远景保留形相</li></ul><h3>行动清单</h3><ol><li>在风景稿上画出冷暖分界与明度分界两条线</li><li>检查三层对比是否递减</li><li>远山保留一笔明确色相试空间是否仍在</li><li>禁止无观察地「远景公式降饱和」</li></ol><h3>关键认知转变</h3><p>以前：越远越灰越糊；现在：管对比强度，让远景清晰也可以退远。</p></div>

  <div class="footer">双轨产物之二 · 理性分析 · 证据来自同一 Whisper 转录 · 176秒</div>
</div>
    </div>
  </foreignObject>
</svg>