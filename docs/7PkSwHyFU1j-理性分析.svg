<div class="timeline-item"><span class="timeline-time">[00:05]</span><span class="timeline-text">先別動</span></div>
<div class="timeline-item"><span class="timeline-time">[00:06]</span><span class="timeline-text">我有方法</span></div>
<div class="timeline-item"><span class="timeline-time">[00:07]</span><span class="timeline-text">頭不動</span></div>
