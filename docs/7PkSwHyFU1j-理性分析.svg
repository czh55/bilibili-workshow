<h1>脸部上镜三要素——上篇：眼神管理</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">人像拍照</span> <span class="tag tag-gray">50秒</span></div>
<div class="summary-line">臉部上進三要素上偏眼神管理當你拍側面的時候全是眼白先別動我有方法頭不動讓眼珠子去找向手機的方向當你抬頭的時候是不是像翻白眼先別動我有方法抬頭頭照樣抬著這個時候咱們的眼珠子可以稍微略低一點從你腦門方向去延伸當你低頭的時候是不是像閉眼先別動我有方法頭還是照樣的低這時候眼珠子去找向地板延伸的方向當你拍正面...</div>
