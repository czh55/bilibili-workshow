<div class="card"><h3>内容要点</h3><ul><li>臉部上進三要素</li>
<li>上偏眼神管理</li>
<li>當你拍側面的時候</li>
<li>全是眼白</li>
<li>我有方法</li>
<li>讓眼珠子去找向手機的方向</li>
<li>當你抬頭的時候</li>
<li>是不是像翻白眼</li>
<li>我有方法</li>
<li>抬頭頭照樣抬著</li>
<li>這個時候咱們的眼珠子</li>
<li>可以稍微略低一點</li>
<li>從你腦門方向去延伸</li>
<li>當你低頭的時候</li>
<li>是不是像閉眼</li>
<li>我有方法</li>
<li>頭還是照樣的低</li>
<li>這時候眼珠子</li>
<li>去找向地板延伸的方向</li>
<li>當你拍正面的時候</li>
<li>像拍中間照</li>
<li>我有方法</li>
<li>依舊頭不動</li>
<li>眼珠子可以看向鏡頭的左邊</li>
<li>也可以看向鏡頭的右邊</li>
<li>別再說你們不會眼神管理了</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>臉部上進三要素上偏眼神管理當你拍側面的時候全是眼白先別動我有方法頭不動讓眼珠子去找向手機的方向當你抬頭的時候是不是像翻白眼先別動我有方法抬頭頭照樣抬著這個時候咱們的眼珠子可以稍微略低一點從你腦門方向去延伸當你低頭的時候是不是像閉眼先別動我有方法頭還是照樣的低這時候眼珠子去找向地板延伸的方向當你拍正面的時候像拍中間照先別動我有方法依舊頭不動眼珠子可以看向鏡頭的左邊也可以看向鏡頭的右邊別再說你們不會眼</p><p>转录分段: 31 | 时长: 50秒</p></div>
