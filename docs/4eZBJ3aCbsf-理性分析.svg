<h1>闪光灯焦段和镜头的焦段有什么关系</h1>
<div class="meta"><span class="tag tag-blue">小红书</span> <span class="tag tag-blue">摄影技巧</span> <span class="tag tag-blue">灯光</span> <span class="tag tag-gray">2:31</span></div>
<div class="summary-line">闪光灯焦段和镜头焦段有什么关系先说结论在目前绝大多数的摄影题材里两者毫无关系一个是光线的假角一个是视线的假角如果你把闪光灯的焦段设置到A auto的模式那么闪光灯会根据你镜头的变焦而跟随着变焦保持着同一个焦这样设计的核心理念是保证光线照射的范围和镜头拍到的范围是一致的就是说闪光灯要把你镜头拍到的范围...</div>
<div class="timeline"><h3>关键时间轴</h3><div class="timeline-item"><span class="timeline-time">[00:00]</span><span class="timeline-text">闪光灯焦段和镜头焦段有什么关系</span></div>
<div class="timeline-item"><span class="timeline-time">[00:03]</span><span class="timeline-text">先说结论</span></div>
<div class="timeline-item"><span class="timeline-time">[00:04]</span><span class="timeline-text">在目前绝大多数的摄影题材里两者毫无关系</span></div>
<div class="timeline-item"><span class="timeline-time">[00:08]</span><span class="timeline-text">一个是光线的假角</span></div>
<div class="timeline-item"><span class="timeline-time">[00:10]</span><span class="timeline-text">一个是视线的假角</span></div>
<div class="timeline-item"><span class="timeline-time">[00:11]</span><span class="timeline-text">如果你把闪光灯的焦段设置到A auto的模式</span></div>
<div class="timeline-item"><span class="timeline-time">[00:15]</span><span class="timeline-text">那么闪光灯会根据你镜头的变焦而跟随着变焦</span></div>
<div class="timeline-item"><span class="timeline-time">[00:19]</span><span class="timeline-text">保持着同一个焦</span></div>
<div class="timeline-item"><span class="timeline-time">[00:21]</span><span class="timeline-text">这样设计的核心理念是保证光线照射的范围和镜头拍到的范围是一致的</span></div>
<div class="timeline-item"><span class="timeline-time">[00:27]</span><span class="timeline-text">就是说闪光灯要把你镜头拍到的范围全部照亮</span></div>
<div class="timeline-item"><span class="timeline-time">[00:32]</span><span class="timeline-text">但事实上我们使用闪光灯时绝大多数情况下只需要闪光灯把主体照亮</span></div>
<div class="timeline-item"><span class="timeline-time">[00:38]</span><span class="timeline-text">环境由环境光来提供亮度</span></div>
<div class="timeline-item"><span class="timeline-time">[00:40]</span><span class="timeline-text">所以光线的假角取决于主体的大小</span></div>
<div class="timeline-item"><span class="timeline-time">[00:43]</span><span class="timeline-text">这个主体可以在画面中站着笔中大也可以站着小</span></div>
<div class="timeline-item"><span class="timeline-time">[00:47]</span><span class="timeline-text">它和你镜头取景的范围没有什么关系</span></div>
<div class="timeline-item"><span class="timeline-time">[00:51]</span><span class="timeline-text">你拍同样的场景</span></div>
<div class="timeline-item"><span class="timeline-time">[00:52]</span><span class="timeline-text">妹子走近一点闪光灯的假角就得放大</span></div>
<div class="timeline-item"><span class="timeline-time">[00:55]</span><span class="timeline-text">妹子走远一点闪光灯的假角就可以说小</span></div>
<div class="timeline-item"><span class="timeline-time">[00:59]</span><span class="timeline-text">市面上方头的闪光灯一般焦段可以从20到200毫米</span></div>
<div class="timeline-item"><span class="timeline-time">[01:04]</span><span class="timeline-text">如果拉下扩散片可以广到14毫米</span></div>
</div>
<div class="card"><h3>内容要点</h3><ul><li>闪光灯焦段和镜头焦段有什么关系</li>
<li>先说结论</li>
<li>在目前绝大多数的摄影题材里两者毫无关系</li>
<li>一个是光线的假角</li>
<li>一个是视线的假角</li>
<li>如果你把闪光灯的焦段设置到A auto的模式</li>
<li>那么闪光灯会根据你镜头的变焦而跟随着变焦</li>
<li>保持着同一个焦</li>
<li>这样设计的核心理念是保证光线照射的范围和镜头拍到的范围是一致的</li>
<li>就是说闪光灯要把你镜头拍到的范围全部照亮</li>
<li>但事实上我们使用闪光灯时绝大多数情况下只需要闪光灯把主体照亮</li>
<li>环境由环境光来提供亮度</li>
<li>所以光线的假角取决于主体的大小</li>
<li>这个主体可以在画面中站着笔中大也可以站着小</li>
<li>它和你镜头取景的范围没有什么关系</li>
<li>你拍同样的场景</li>
<li>妹子走近一点闪光灯的假角就得放大</li>
<li>妹子走远一点闪光灯的假角就可以说小</li>
<li>市面上方头的闪光灯一般焦段可以从20到200毫米</li>
<li>如果拉下扩散片可以广到14毫米</li>
<li>源头灯一般吃能28到105毫米并且没有扩散片</li>
<li>从这一点上说方头灯的可控范围会更大</li>
<li>之前看到有朋友问我买的闪光灯焦段只有28到105毫米</li>
<li>那么我的70-200的镜头是不是用不了了</li>
<li>其实是不用担心的</li>
<li>那到底怎么确定拍摄是闪光灯的焦段设置到多少</li>
<li>这里需要运用到一些你中学学的数学三角函数</li>
<li>如图所示你直到妹子的身高和闪光灯到妹子的距离</li>
<li>这样通过三角函数你能够计算出光线的假角</li>
<li>通过角度和焦段的对照表你就能得到所需要的焦段值</li>
<li>当然你实际拍摄的时候不需要这么复杂的计算</li>
<li>大多数情况下你拍半身或者特写</li>
<li>闪光灯的焦段在80到105毫米</li>
<li>太全身大概在50毫米左右</li>
<li>闪光灯的焦距越长光线就越聚越亮</li>
<li>闪光灯的焦距越短光线就越闪越暗</li>
<li>那么把闪光灯焦距放到A档或者固定在一个比较广的焦段上是不是可以</li>
<li>大部分情况下是可以的</li>
<li>这是会浪费很多灯的功率</li>
<li>如果你在外景拍摄时嫌弃基顶灯的亮度不够</li>
<li>那么闪光灯焦段的精准设置会给你带来很大的改观</li>
<li>你大致可以这样理解</li>
<li>光般的直径说小一倍亮度增加4倍</li>
</ul></div>
<div class="conclusion"><h2>总结</h2><p>闪光灯焦段和镜头焦段有什么关系先说结论在目前绝大多数的摄影题材里两者毫无关系一个是光线的假角一个是视线的假角如果你把闪光灯的焦段设置到A auto的模式那么闪光灯会根据你镜头的变焦而跟随着变焦保持着同一个焦这样设计的核心理念是保证光线照射的范围和镜头拍到的范围是一致的就是说闪光灯要把你镜头拍到的范围全部照亮但事实上我们使用闪光灯时绝大多数情况下只需要闪光灯把主体照亮环境由环境光来提供亮度所以光线的</p><p>转录分段: 43 | 时长: 2:31</p></div>
